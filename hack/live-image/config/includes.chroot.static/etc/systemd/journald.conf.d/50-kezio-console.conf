# Copies every journal entry - kezio-agent's stdout/stderr included
# (kezio-agent.service has no ForwardToConsole/ForwardToSyslog override
# of its own, so its output only reaches journald by default) - to
# /dev/console, the device the kernel's console= cmdline argument points
# at (internal/bootserver's grub.go, Machine.spec.console). Without this,
# the live environment's boot log and kezio-agent's own log line never
# reach a machine's serial/BMC console, only `journalctl`.
[Journal]
ForwardToConsole=yes
MaxLevelConsole=debug
