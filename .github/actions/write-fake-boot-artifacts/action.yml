name: Write fake boot artifacts into dist/live
description: >-
  Stages tiny dummy vmlinuz/initrd.img/filesystem.squashfs/shimx64.efi/
  grubx64.efi/manifest.json under dist/live/ - the exact file set
  hack/live-image/build.sh produces and docker/boot-artifacts/Dockerfile
  packages - without running that ~90 minute `lb build`. What is under
  test in the probes calling this action is the plumbing (Dockerfile,
  containerd import, the fetch-boot-artifacts initContainer, the
  bootserver HTTP routes), not the kernel/initrd/squashfs content
  itself, so fake bytes exercise every one of those layers identically
  to real ones. manifest.json is still valid JSON with a real
  agentCommit field, so the "Assert the boot artifacts agent commit"
  step real lanes run (see e2e-boot-path-kubevirt.yml) can be exercised
  against it too.

inputs:
  agent-commit:
    description: Value written as manifest.json's agentCommit field.
    required: true
  dist-dir:
    description: Directory the fake artifacts are written to, relative to the repository root.
    required: false
    default: dist/live

runs:
  using: composite
  steps:
    - name: Write fake boot artifacts
      shell: bash
      env:
        AGENT_COMMIT: ${{ inputs.agent-commit }}
        DIST_DIR: ${{ inputs.dist-dir }}
      run: |
        set -euo pipefail
        mkdir -p "${DIST_DIR}"
        echo "fake vmlinuz - probe only, not a real kernel" > "${DIST_DIR}/vmlinuz"
        echo "fake initrd.img - probe only, not a real initrd" > "${DIST_DIR}/initrd.img"
        echo "fake filesystem.squashfs - probe only, not a real squashfs" > "${DIST_DIR}/filesystem.squashfs"
        echo "fake shimx64.efi - probe only, not a real signed shim" > "${DIST_DIR}/shimx64.efi"
        echo "fake grubx64.efi - probe only, not a real signed grub" > "${DIST_DIR}/grubx64.efi"
        printf '{\n  "agentCommit": "%s",\n  "note": "fake artifacts written by write-fake-boot-artifacts for a probe run - not a real build"\n}\n' \
          "${AGENT_COMMIT}" > "${DIST_DIR}/manifest.json"
        jq empty "${DIST_DIR}/manifest.json"
        echo "::group::Fake artifacts staged under ${DIST_DIR}"
        ls -la "${DIST_DIR}"
        cat "${DIST_DIR}/manifest.json"
        echo "::endgroup::"
