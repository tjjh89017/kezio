name: Wait for the per-Image seeder Deployment to be torn down

description: >-
  Polls until the given Deployment is gone, for confirming the per-Image
  seeder Deployment's grace-period teardown actually happens instead of
  leaving an orphaned seeder running.

inputs:
  deployment-name:
    description: Name of the Deployment expected to disappear.
    required: true
  namespace:
    description: Namespace the Deployment lives in.
    required: false
    default: kezio-system
  timeout-seconds:
    description: How long to poll before giving up.
    required: false
    default: "120"

runs:
  using: composite
  steps:
    - name: Wait for the per-Image seeder Deployment to be torn down
      shell: bash
      env:
        DEPLOYMENT_NAME: ${{ inputs.deployment-name }}
        NAMESPACE: ${{ inputs.namespace }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        deadline=$(( $(date +%s) + TIMEOUT_SECONDS ))
        while kubectl -n "${NAMESPACE}" get deployment "${DEPLOYMENT_NAME}" >/dev/null 2>&1; do
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::per-Image seeder Deployment ${DEPLOYMENT_NAME} was not removed within the grace period plus poll budget." >&2
            kubectl -n "${NAMESPACE}" get deployment "${DEPLOYMENT_NAME}" -o yaml || true
            exit 1
          fi
          sleep 5
        done
        echo "per-Image seeder Deployment ${DEPLOYMENT_NAME} was removed."
