name: Create a Subnet

description: >-
  The API half of a Subnet-backed bootd deployment: creates the Subnet
  CR that SubnetReconciler watches to build a bootd Deployment
  (kezio-bootd-<name>). Waits for status condition Valid=True (schema
  validation plus internal/nadvalidate and internal/subnetvalidate's own
  checks against the referenced NetworkAttachmentDefinitions and DHCP
  config) and reports the Ready condition without failing the action on
  it - Ready reflects the bootd Deployment's own rollout, which is
  deploy-bootd's job to wait on, not this action's.

  The boot half (bootd-server-ip/bootd-network-name/dhcp-*) is optional
  as a group: leave bootd-server-ip and bootd-network-name both empty
  for a data-plane-only Subnet that hosts only a seeder
  (seeder-network-name is then required). The Subnet webhook admits
  spec.siteRef only against a Site that already exists - create it
  first with create-site.

inputs:
  name:
    description: Name of the Subnet CR; also the suffix of the bootd Deployment it produces (kezio-bootd-<name>).
    required: true
  namespace:
    description: Namespace the Subnet is created in.
    required: false
    default: "scaffold-system"
  cidr:
    description: 'Subnet.spec.cidr, e.g. "192.0.2.0/24".'
    required: true
  bootd-server-ip:
    description: >-
      Subnet.spec.bootdServerIP (bare address, no CIDR suffix), e.g.
      "192.0.2.2". Part of the boot half: set together with
      bootd-network-name, or leave both empty for a data-plane-only
      Subnet (seeder-network-name must then be set instead).
    required: false
    default: ""
  bootd-network-name:
    description: >-
      Name of the NetworkAttachmentDefinition the bootd Deployment
      attaches through - must live in the same namespace. Part of the
      boot half; see bootd-server-ip.
    required: false
    default: ""
  seeder-network-name:
    description: >-
      Name of the NetworkAttachmentDefinition seeder pods attach
      through, when this Subnet hosts seeders. Empty leaves it unset.
      Required when bootd-server-ip/bootd-network-name are both empty -
      a Subnet must declare at least one plane.
    required: false
    default: ""
  site-ref:
    description: >-
      Subnet.spec.siteRef.name. The Subnet webhook rejects this at
      admission unless a Site by this name already exists in namespace -
      create it first (see create-site).
    required: true
  dhcp-scenario:
    description: >-
      DHCP scenario, mapped onto Subnet.spec.dhcp.mode: "proxydhcp" ->
      proxy (an existing DHCP server stays lease authority), "dhcp" ->
      lease (bootd's own dnsmasq becomes lease authority). Ignored for a
      data-plane-only Subnet (bootd-server-ip/bootd-network-name both
      empty) - no dhcp block is emitted in that case.
    required: false
    default: "proxydhcp"
  lease-range-start:
    description: Subnet.spec.dhcp.leaseRangeStart. Required when dhcp-scenario is "dhcp".
    required: false
    default: ""
  lease-range-end:
    description: Subnet.spec.dhcp.leaseRangeEnd. Required when dhcp-scenario is "dhcp".
    required: false
    default: ""
  timeout:
    description: >-
      Timeout to wait for the Valid condition to become True, in seconds
      as an integer, optionally suffixed with s.
    required: false
    default: "120s"

runs:
  using: composite
  steps:
    - name: Create the Subnet
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        NAMESPACE: ${{ inputs.namespace }}
        CIDR: ${{ inputs.cidr }}
        BOOTD_SERVER_IP: ${{ inputs.bootd-server-ip }}
        BOOTD_NETWORK_NAME: ${{ inputs.bootd-network-name }}
        SEEDER_NETWORK_NAME: ${{ inputs.seeder-network-name }}
        SITE_REF: ${{ inputs.site-ref }}
        DHCP_SCENARIO: ${{ inputs.dhcp-scenario }}
        LEASE_RANGE_START: ${{ inputs.lease-range-start }}
        LEASE_RANGE_END: ${{ inputs.lease-range-end }}
      run: |
        set -euo pipefail

        has_bootd_ip=0
        [ -n "${BOOTD_SERVER_IP}" ] && has_bootd_ip=1
        has_bootd_net=0
        [ -n "${BOOTD_NETWORK_NAME}" ] && has_bootd_net=1
        if [ "${has_bootd_ip}" -ne "${has_bootd_net}" ]; then
          echo "::error::bootd-server-ip and bootd-network-name must be set together or both left empty" >&2
          exit 1
        fi
        has_boot_plane="${has_bootd_ip}"
        if [ "${has_boot_plane}" -eq 0 ] && [ -z "${SEEDER_NETWORK_NAME}" ]; then
          echo "::error::a Subnet must declare a boot half (bootd-server-ip/bootd-network-name) or seeder-network-name; one with neither hosts nothing" >&2
          exit 1
        fi

        if [ "${has_boot_plane}" -eq 1 ]; then
          case "${DHCP_SCENARIO}" in
            proxydhcp) dhcp_mode=proxy ;;
            dhcp) dhcp_mode=lease ;;
            *)
              echo "::error::unknown dhcp-scenario '${DHCP_SCENARIO}' (expected proxydhcp or dhcp)" >&2
              exit 1
              ;;
          esac
          if [ "${dhcp_mode}" = lease ] && { [ -z "${LEASE_RANGE_START}" ] || [ -z "${LEASE_RANGE_END}" ]; }; then
            echo "::error::dhcp-scenario 'dhcp' requires both lease-range-start and lease-range-end" >&2
            exit 1
          fi
        fi

        subnet_yaml="$(cat <<EOF
        apiVersion: kezio.kojuro.date/v1alpha2
        kind: Subnet
        metadata:
          name: ${NAME}
          namespace: ${NAMESPACE}
        spec:
          siteRef:
            name: ${SITE_REF}
          cidr: "${CIDR}"
        EOF
        )"
        if [ "${has_boot_plane}" -eq 1 ]; then
          subnet_yaml+=$'\n  bootdServerIP: "'"${BOOTD_SERVER_IP}"$'"\n  bootdNetworkRef:\n    name: '"${BOOTD_NETWORK_NAME}"
        fi
        if [ -n "${SEEDER_NETWORK_NAME}" ]; then
          subnet_yaml+=$'\n  seederNetworkRef:\n    name: '"${SEEDER_NETWORK_NAME}"
        fi
        if [ "${has_boot_plane}" -eq 1 ]; then
          subnet_yaml+=$'\n  dhcp:\n    mode: '"${dhcp_mode}"
          if [ "${dhcp_mode}" = lease ]; then
            subnet_yaml+=$'\n    leaseRangeStart: '"${LEASE_RANGE_START}"
            subnet_yaml+=$'\n    leaseRangeEnd: '"${LEASE_RANGE_END}"
          fi
        fi
        echo "${subnet_yaml}" | kubectl apply -f -

    - name: Wait for the Subnet to become Valid
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        NAMESPACE: ${{ inputs.namespace }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail
        if [[ ! "${TIMEOUT}" =~ ^[0-9]+s?$ ]]; then
          echo "::error::invalid timeout '${TIMEOUT}': want seconds like 900 or 900s" >&2
          exit 1
        fi
        deadline_seconds="${TIMEOUT%s}"
        deadline=$(( $(date +%s) + deadline_seconds ))
        while true; do
          valid="$(kubectl get subnet "${NAME}" -n "${NAMESPACE}" \
            -o jsonpath='{.status.conditions[?(@.type=="Valid")].status}' || true)"
          echo "$(date -Is) Subnet Valid=${valid:-<none>}"
          [ "${valid}" = "True" ] && break
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::Subnet ${NAME} did not become Valid within ${TIMEOUT}." >&2
            kubectl get subnet "${NAME}" -n "${NAMESPACE}" -o yaml
            exit 1
          fi
          sleep 5
        done

    - name: Report the Subnet's Ready condition
      # Informational only: Ready tracks the bootd Deployment's own
      # rollout, which asynchronously follows this Subnet becoming
      # Valid. deploy-bootd is what actually waits on it - this step
      # never fails the action.
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set +e
        ready="$(kubectl get subnet "${NAME}" -n "${NAMESPACE}" \
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')"
        echo "Subnet ${NAME} Ready=${ready:-<none>} (not gated on by this action)"
