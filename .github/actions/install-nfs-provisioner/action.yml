name: Install an in-cluster NFS provisioner and mark it the default StorageClass

description: >-
  Deploys registry.k8s.io/sig-storage/nfs-provisioner (userspace NFS via
  ganesha, no kernel nfsd) backed by a single local-path-provisioner PVC,
  waits for it to roll out, then creates the "nfs" StorageClass pointing
  at it and marks it the cluster default (clearing local-path's own
  default annotation, so exactly one StorageClass is default). Every PVC
  the image-path lane's controllers request - the ingest scratch PVC, a
  PartitionContent's content PVC, image-service's staging PVC - defaults
  to ReadWriteMany in production; local-path-provisioner alone can only
  ever satisfy ReadWriteOnce, so without this, every RWX PVC in the lane
  would stay Pending forever. This lets the lane run every PVC RWX
  unmodified, matching production defaults exactly, instead of patching
  each consumer down to ReadWriteOnce.

inputs:
  namespace:
    description: 'Namespace to deploy the nfs-provisioner Service/Deployment/PVC into. Always exists (unlike scaffold-system, not yet created this early in the lane).'
    required: false
    default: "default"
  backing-storage-class:
    description: 'StorageClass backing the provisioner''s own export volume - must satisfy ReadWriteOnce.'
    required: false
    default: "local-path"
  backing-size:
    description: 'Size of the provisioner''s own export volume, e.g. "4Gi".'
    required: false
    default: "4Gi"
  provisioner-name:
    description: 'The provisioner name registered with Kubernetes and the StorageClass''s "nfs" name uses.'
    required: false
    default: "example.com/nfs"

runs:
  using: composite
  steps:
    - name: Deploy nfs-provisioner and make it the default StorageClass
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        BACKING_STORAGE_CLASS: ${{ inputs.backing-storage-class }}
        BACKING_SIZE: ${{ inputs.backing-size }}
        PROVISIONER_NAME: ${{ inputs.provisioner-name }}
      run: |
        set -euo pipefail

        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: nfs-provisioner
          namespace: ${NAMESPACE}
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: nfs-provisioner-runner
        rules:
          - apiGroups: [""]
            resources: ["persistentvolumes"]
            verbs: ["get", "list", "watch", "create", "delete"]
          - apiGroups: [""]
            resources: ["persistentvolumeclaims"]
            verbs: ["get", "list", "watch", "update"]
          - apiGroups: ["storage.k8s.io"]
            resources: ["storageclasses"]
            verbs: ["get", "list", "watch"]
          - apiGroups: [""]
            resources: ["events"]
            verbs: ["create", "update", "patch"]
          - apiGroups: [""]
            resources: ["services", "endpoints"]
            verbs: ["get"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: run-nfs-provisioner
        subjects:
          - kind: ServiceAccount
            name: nfs-provisioner
            namespace: ${NAMESPACE}
        roleRef:
          kind: ClusterRole
          name: nfs-provisioner-runner
          apiGroup: rbac.authorization.k8s.io
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: leader-locking-nfs-provisioner
          namespace: ${NAMESPACE}
        rules:
          - apiGroups: [""]
            resources: ["endpoints"]
            verbs: ["get", "list", "watch", "create", "update", "patch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: leader-locking-nfs-provisioner
          namespace: ${NAMESPACE}
        subjects:
          - kind: ServiceAccount
            name: nfs-provisioner
            namespace: ${NAMESPACE}
        roleRef:
          kind: Role
          name: leader-locking-nfs-provisioner
          apiGroup: rbac.authorization.k8s.io
        ---
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: nfs-provisioner-export
          namespace: ${NAMESPACE}
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: ${BACKING_STORAGE_CLASS}
          resources:
            requests:
              storage: ${BACKING_SIZE}
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: nfs-provisioner
          namespace: ${NAMESPACE}
          labels:
            app: nfs-provisioner
        spec:
          selector:
            app: nfs-provisioner
          ports:
            - {name: nfs, port: 2049}
            - {name: nfs-udp, port: 2049, protocol: UDP}
            - {name: nlockmgr, port: 32803}
            - {name: nlockmgr-udp, port: 32803, protocol: UDP}
            - {name: mountd, port: 20048}
            - {name: mountd-udp, port: 20048, protocol: UDP}
            - {name: rquotad, port: 875}
            - {name: rquotad-udp, port: 875, protocol: UDP}
            - {name: rpcbind, port: 111}
            - {name: rpcbind-udp, port: 111, protocol: UDP}
            - {name: statd, port: 662}
            - {name: statd-udp, port: 662, protocol: UDP}
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: nfs-provisioner
          namespace: ${NAMESPACE}
        spec:
          replicas: 1
          strategy:
            type: Recreate
          selector:
            matchLabels:
              app: nfs-provisioner
          template:
            metadata:
              labels:
                app: nfs-provisioner
            spec:
              serviceAccountName: nfs-provisioner
              containers:
                - name: nfs-provisioner
                  image: registry.k8s.io/sig-storage/nfs-provisioner:v4.0.8
                  ports:
                    - {name: nfs, containerPort: 2049}
                    - {name: nfs-udp, containerPort: 2049, protocol: UDP}
                    - {name: nlockmgr, containerPort: 32803}
                    - {name: nlockmgr-udp, containerPort: 32803, protocol: UDP}
                    - {name: mountd, containerPort: 20048}
                    - {name: mountd-udp, containerPort: 20048, protocol: UDP}
                    - {name: rquotad, containerPort: 875}
                    - {name: rquotad-udp, containerPort: 875, protocol: UDP}
                    - {name: rpcbind, containerPort: 111}
                    - {name: rpcbind-udp, containerPort: 111, protocol: UDP}
                    - {name: statd, containerPort: 662}
                    - {name: statd-udp, containerPort: 662, protocol: UDP}
                  securityContext:
                    capabilities:
                      add: ["DAC_READ_SEARCH", "SYS_RESOURCE"]
                  args:
                    - "-provisioner=${PROVISIONER_NAME}"
                  env:
                    - name: POD_IP
                      valueFrom: {fieldRef: {fieldPath: status.podIP}}
                    - name: SERVICE_NAME
                      value: nfs-provisioner
                    - name: POD_NAMESPACE
                      valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
                  imagePullPolicy: "IfNotPresent"
                  volumeMounts:
                    - name: export-volume
                      mountPath: /export
              volumes:
                - name: export-volume
                  persistentVolumeClaim:
                    claimName: nfs-provisioner-export
        EOF

        kubectl -n "${NAMESPACE}" rollout status deployment/nfs-provisioner --timeout=180s

        cat <<EOF | kubectl apply -f -
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: nfs
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"
        provisioner: ${PROVISIONER_NAME}
        EOF

        # Exactly one default StorageClass: local-path-provisioner (if
        # already installed and marked default) must give that up now
        # that "nfs" - the one that can actually satisfy ReadWriteMany -
        # has taken over.
        if kubectl get storageclass local-path >/dev/null 2>&1; then
          kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
        fi
