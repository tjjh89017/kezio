name: Verify the DHCP scenario behaved as configured

description: >-
  Asserts the DHCP-handling that e2e-bmc's DHCP_SCENARIO matrix leg is
  actually meant to exercise: no-relay checks that kezio-existing-dhcp's
  own proxyDHCP answered the DISCOVER/ACK exchange directly; lease checks
  that kezio-existing-dhcp was never deployed and bootd's dnsmasq issued
  the lease itself under BOOTD_LEASE_MODE. Any other scenario value is a
  no-op success, matching the two-step, mutually-exclusive `if:` pair
  this action replaces - unmatched values fell through both steps
  unverified there too.

inputs:
  scenario:
    description: DHCP scenario under test. One of no-relay, lease.
    required: true
  namespace:
    description: Namespace kezio-existing-dhcp and kezio-bootd are deployed in.
    required: false
    default: kezio-system

runs:
  using: composite
  steps:
    - name: Verify the DHCP scenario behaved as configured
      shell: bash
      env:
        SCENARIO: ${{ inputs.scenario }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        case "${SCENARIO}" in
          no-relay)
            existing_dhcp_log="$(kubectl -n "${NAMESPACE}" logs deployment/kezio-existing-dhcp --all-containers --tail=-1)"
            if ! grep -qF "DHCPDISCOVER" <<<"${existing_dhcp_log}" || ! grep -qF "DHCPACK" <<<"${existing_dhcp_log}"; then
              echo "::error::existing-dhcp's own log shows no DHCPDISCOVER/DHCPACK exchange" >&2
              echo "${existing_dhcp_log}"
              exit 1
            fi
            ;;
          lease)
            if kubectl -n "${NAMESPACE}" get deployment/kezio-existing-dhcp >/dev/null 2>&1; then
              echo "::error::kezio-existing-dhcp exists in the lease scenario" >&2
              exit 1
            fi

            bootd_log="$(kubectl -n "${NAMESPACE}" logs deployment/kezio-bootd --all-containers --tail=-1)"
            if ! grep -qF "DHCPACK" <<<"${bootd_log}"; then
              echo "::error::bootd's dnsmasq log shows no DHCPACK - it never issued a lease of its own under BOOTD_LEASE_MODE." >&2
              echo "${bootd_log}"
              exit 1
            fi
            ;;
          *)
            # Preserves the original two-step `if:` pair's behavior: a
            # DHCP_SCENARIO value that matches neither step's condition
            # skipped both and passed unverified, rather than failing.
            echo "No verification defined for DHCP scenario '${SCENARIO}'; skipping."
            ;;
        esac
