name: Verify the DHCP scenario behaved as configured

description: >-
  Asserts the DHCP-handling a Subnet's dhcp.mode matrix leg is actually
  meant to exercise: proxydhcp checks that kezio-existing-dhcp's own
  proxyDHCP answered the DISCOVER/ACK exchange directly; dhcp checks
  that kezio-existing-dhcp was never deployed and bootd's dnsmasq issued
  the lease itself under BOOTD_LEASE_MODE. Any other scenario value is a
  no-op success.

inputs:
  scenario:
    description: DHCP scenario under test. One of proxydhcp, dhcp.
    required: true
  namespace:
    description: Namespace kezio-existing-dhcp and the bootd Deployment are deployed in.
    required: false
    default: "scaffold-system"
  bootd-deployment-name:
    description: 'Name of the Subnet''s bootd Deployment, e.g. "kezio-bootd-<subnet-name>" (see deploy-bootd).'
    required: true
  existing-dhcp-deployment-name:
    description: Name of the deploy-existing-dhcp Deployment (its "name" input) checked in the proxydhcp scenario, and confirmed absent in the dhcp scenario.
    required: false
    default: "kezio-existing-dhcp"

runs:
  using: composite
  steps:
    - name: Verify the DHCP scenario behaved as configured
      shell: bash
      env:
        SCENARIO: ${{ inputs.scenario }}
        NAMESPACE: ${{ inputs.namespace }}
        BOOTD_DEPLOYMENT_NAME: ${{ inputs.bootd-deployment-name }}
        EXISTING_DHCP_DEPLOYMENT_NAME: ${{ inputs.existing-dhcp-deployment-name }}
      run: |
        set -euo pipefail
        case "${SCENARIO}" in
          proxydhcp)
            existing_dhcp_log="$(kubectl -n "${NAMESPACE}" logs deployment/"${EXISTING_DHCP_DEPLOYMENT_NAME}" --all-containers --tail=-1)"
            if ! grep -qF "DHCPDISCOVER" <<<"${existing_dhcp_log}" || ! grep -qF "DHCPACK" <<<"${existing_dhcp_log}"; then
              echo "::error::existing-dhcp's own log shows no DHCPDISCOVER/DHCPACK exchange" >&2
              echo "${existing_dhcp_log}"
              exit 1
            fi
            ;;
          dhcp)
            if kubectl -n "${NAMESPACE}" get deployment/"${EXISTING_DHCP_DEPLOYMENT_NAME}" >/dev/null 2>&1; then
              echo "::error::${EXISTING_DHCP_DEPLOYMENT_NAME} exists in the dhcp scenario" >&2
              exit 1
            fi

            bootd_log="$(kubectl -n "${NAMESPACE}" logs deployment/"${BOOTD_DEPLOYMENT_NAME}" --all-containers --tail=-1)"
            if ! grep -qF "DHCPACK" <<<"${bootd_log}"; then
              echo "::error::bootd's dnsmasq log shows no DHCPACK - it never issued a lease of its own under BOOTD_LEASE_MODE." >&2
              echo "${bootd_log}"
              exit 1
            fi
            ;;
          *)
            echo "No verification defined for DHCP scenario '${SCENARIO}'; skipping."
            ;;
        esac
