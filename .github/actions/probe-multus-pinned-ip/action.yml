name: Probe that Multus honours the default-network annotation's ips field

description: >-
  Shows how Multus applies the "ips" field of the
  `v1.multus-cni.io/default-network` annotation (the annotation that
  REPLACES the default network of a pod, not the additive
  `k8s.v1.cni.cncf.io/networks`). Multus passes that per-pod address to
  the ipam plugin of the NAD. The plugin decides what the interface
  ends up holding: the requested address alone, or a pool address with
  it. The order of the set is not guaranteed either, so the probe reads
  the whole set and looks for the requested address in it.

  The placement of the Site tracker depends on this behaviour. Every
  other caller in this repository puts only a bare NAD name on that
  annotation (see seederPodAnnotations in
  internal/controller/image_seeder_placement.go). The tracker
  Deployment of SiteReconciler
  (internal/controller/site_tracker_deployment.go,
  trackerPodAnnotations) is the only caller that puts the richer
  JSON-array-of-objects form there with "ips". If Multus did not
  honour "ips" on THIS annotation, the tracker would never bind
  Site.spec.tracker.ip, and every .torrent of the Site seeder would
  announce an address that no process listens on.

  Method: the probe creates a NetworkAttachmentDefinition with
  host-local ipam and a bounded pool. This is the shape that
  create-provisioning-nads gives to kezio-seeder-network, and it exists
  so that each attaching pod gets its own address: a static NAD gives
  the SAME address to every attaching pod, thus the tracker and a
  seeder collide. The probe then creates a pod with EXACTLY the
  annotation shape that trackerPodAnnotations builds: a JSON array with
  one element that carries "name", "namespace", and "ips":
  [requested-ip-cidr]. The CIDR form is necessary, because the ipam of
  the bridge CNI plugin rejects a bare dotted-quad with "the 'ip' field
  is expected to be in CIDR notation".

  The requested address sits INSIDE the pool, at its top. host-local
  refuses a requested address outside its own range and fails the
  sandbox with "failed to allocate all requested IPs", so this is the
  only placement production can use; the top of the range keeps a
  seeder pod from taking the address first, because host-local
  allocates upward from rangeStart.

  The probe then reads the addresses of the default interface (eth0;
  default-network always attaches as eth0, not net1) in two places: the
  k8s.v1.cni.cncf.io/network-status annotation that Multus writes back,
  and a live `ip addr` from inside the running pod. In both places the
  probe asserts that the requested address IS PRESENT, and prints the
  whole observed set. The assertion fails if Multus ignores "ips",
  which is the condition that stops the tracker binding
  Site.spec.tracker.ip. A pool address beside the requested one is
  reported but never required: with an in-pool request host-local can
  return the requested address alone.

inputs:
  namespace:
    description: Namespace the NAD and the probe pod are created in.
    required: false
    default: "scaffold-system"
  bridge-name:
    description: Host Linux bridge the probe NAD attaches to. The kernel rejects a device name of more than 15 characters with ERANGE.
    required: true
  nad-name:
    description: Name of the probe NetworkAttachmentDefinition.
    required: false
    default: "kezio-probe-multus-network"
  nad-pool-cidr:
    description: >-
      Subnet of the host-local ipam of the NAD (network address and
      prefix, e.g. "192.0.20.0/24"). This mirrors the shape that
      create-provisioning-nads gives to kezio-seeder-network.
    required: true
  nad-pool-range-start:
    description: 'First address of the host-local pool, e.g. "192.0.20.101".'
    required: true
  nad-pool-range-end:
    description: 'Last address of the host-local pool, e.g. "192.0.20.116".'
    required: true
  requested-ip-cidr:
    description: >-
      Address with a CIDR suffix, e.g. "192.0.20.116/24", requested
      through the "ips" field of the default-network annotation. This
      mirrors the entry that trackerPodAnnotations builds
      (Site.spec.tracker.ip plus the prefix length of the seeding
      Subnet, through trackerIPWithPrefix). It must sit INSIDE the pool
      range above, and belongs at the top of it - see this action's own
      description. The probe fails on its own inputs if it does not.
    required: true
  pod-name:
    description: Name of the probe pod.
    required: false
    default: "kezio-probe-multus-pinned-ip"
  pod-image:
    description: Minimal image carrying a busybox "ip" applet, used to read the pod's own address.
    required: false
    default: "busybox:1.36"
  timeout-seconds:
    description: How long to wait for the probe pod to become Running.
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - name: Create the probe NetworkAttachmentDefinition
      # Same shape create-provisioning-nads gives to
      # kezio-seeder-network: type "bridge", host-local ipam, one
      # bounded range. There is no "capabilities" key, which matches
      # the real NAD, because this probe is about the handling of
      # "ips" by Multus without an extra opt-in on the NAD side.
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        BRIDGE_NAME: ${{ inputs.bridge-name }}
        NAD_NAME: ${{ inputs.nad-name }}
        NAD_POOL_CIDR: ${{ inputs.nad-pool-cidr }}
        NAD_POOL_RANGE_START: ${{ inputs.nad-pool-range-start }}
        NAD_POOL_RANGE_END: ${{ inputs.nad-pool-range-end }}
      run: |
        set -euo pipefail
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: ${NAD_NAME}
          namespace: ${NAMESPACE}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "${NAD_NAME}",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${BRIDGE_NAME}",
                  "ipam": {
                    "type": "host-local",
                    "subnet": "${NAD_POOL_CIDR}",
                    "rangeStart": "${NAD_POOL_RANGE_START}",
                    "rangeEnd": "${NAD_POOL_RANGE_END}"
                  }
                }
              ]
            }
        EOF

    - name: Create the probe pod with the tracker's exact default-network annotation shape
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        NAD_NAME: ${{ inputs.nad-name }}
        REQUESTED_IP_CIDR: ${{ inputs.requested-ip-cidr }}
        POD_NAME: ${{ inputs.pod-name }}
        POD_IMAGE: ${{ inputs.pod-image }}
      run: |
        set -euo pipefail
        # jq -c with an object literal keeps the key insertion order, so
        # this is byte-identical to Go's json.Marshal of
        # trackerNetworkSelectionElement{Name, Namespace, IPs}: field
        # order name, namespace, ips, no whitespace.
        annotation="$(jq -nc --arg name "${NAD_NAME}" --arg ns "${NAMESPACE}" --arg ip "${REQUESTED_IP_CIDR}" \
          '[{name: $name, namespace: $ns, ips: [$ip]}]')"
        echo "requesting default-network annotation: ${annotation}"

        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: ${POD_NAME}
          namespace: ${NAMESPACE}
          labels:
            app.kubernetes.io/component: probe-multus-pinned-ip
          annotations:
            v1.multus-cni.io/default-network: '${annotation}'
        spec:
          restartPolicy: Never
          containers:
            - name: probe
              image: ${POD_IMAGE}
              command: ["sleep", "300"]
        EOF

    - name: Wait for the probe pod to become Running
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        POD_NAME: ${{ inputs.pod-name }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        if ! kubectl -n "${NAMESPACE}" wait --for=jsonpath='{.status.phase}'=Running \
            "pod/${POD_NAME}" --timeout="${TIMEOUT_SECONDS}s"; then
          echo "::error::probe pod ${NAMESPACE}/${POD_NAME} did not reach Running within ${TIMEOUT_SECONDS}s" >&2
          kubectl -n "${NAMESPACE}" describe pod "${POD_NAME}" || true
          exit 1
        fi

    - name: PASS/FAIL -- network-status reports the requested address among the observed set
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        POD_NAME: ${{ inputs.pod-name }}
        REQUESTED_IP_CIDR: ${{ inputs.requested-ip-cidr }}
        NAD_POOL_RANGE_START: ${{ inputs.nad-pool-range-start }}
        NAD_POOL_RANGE_END: ${{ inputs.nad-pool-range-end }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/lib.sh"

        # The ips entries of network-status carry only the bare address,
        # whatever the request itself specified, thus the expected side
        # loses its prefix.
        requested_ip="${REQUESTED_IP_CIDR%%/*}"

        status_json="$(kubectl -n "${NAMESPACE}" get pod "${POD_NAME}" \
          -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}')"
        echo "network-status: ${status_json}"
        if [ -z "${status_json}" ]; then
          echo "::error::FAIL observed=<no network-status annotation> expected an entry that carries ${requested_ip}" >&2
          exit 1
        fi

        # Multus marks the default-network entry "default": true. There
        # is no additive network here, thus exactly one entry is
        # expected, and it carries the whole observed address set.
        mapfile -t observed_ips < <(jq -r '[.[] | select(.default == true)][0].ips[]?' <<<"${status_json}")

        assert_pinned_address "network-status" "${requested_ip}" \
          "${NAD_POOL_RANGE_START}" "${NAD_POOL_RANGE_END}" "${observed_ips[@]}"

    - name: PASS/FAIL -- a live "ip addr" from inside the pod shows the requested address
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        POD_NAME: ${{ inputs.pod-name }}
        REQUESTED_IP_CIDR: ${{ inputs.requested-ip-cidr }}
        NAD_POOL_RANGE_START: ${{ inputs.nad-pool-range-start }}
        NAD_POOL_RANGE_END: ${{ inputs.nad-pool-range-end }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/lib.sh"

        # default-network always attaches as eth0, whatever the name of
        # the NAD - the additive k8s.v1.cni.cncf.io/networks annotation
        # is the one that lands on net1/net2/...
        addr_lines="$(kubectl -n "${NAMESPACE}" exec "${POD_NAME}" -- ip -4 -o addr show dev eth0 2>&1 || true)"
        echo "in-pod ip addr: ${addr_lines}"
        mapfile -t observed_cidrs < <(awk '{for (i=1;i<=NF;i++) if ($i=="inet") print $(i+1)}' <<<"${addr_lines}")

        assert_pinned_address "in-pod ip addr" "${REQUESTED_IP_CIDR%%/*}" \
          "${NAD_POOL_RANGE_START}" "${NAD_POOL_RANGE_END}" "${observed_cidrs[@]}"

        # The bridge CNI plugin binds the interface to exactly the
        # ip/prefix that it receives, thus the in-pod set must hold the
        # requested CIDR with its own prefix, and not only its address.
        for cidr in "${observed_cidrs[@]}"; do
          if [ "${cidr}" = "${REQUESTED_IP_CIDR}" ]; then
            echo "PASS observed=[${observed_cidrs[*]}] contains ${REQUESTED_IP_CIDR} with its prefix (in-pod ip addr)"
            exit 0
          fi
        done
        echo "::error::FAIL observed=[${observed_cidrs[*]}] expected to contain ${REQUESTED_IP_CIDR} -- eth0 holds the requested address with a different prefix length" >&2
        exit 1

    - name: Clean up the probe pod and NetworkAttachmentDefinition
      if: always()
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        NAD_NAME: ${{ inputs.nad-name }}
        POD_NAME: ${{ inputs.pod-name }}
      run: |
        set +e
        kubectl -n "${NAMESPACE}" delete pod "${POD_NAME}" --ignore-not-found --wait=false
        kubectl -n "${NAMESPACE}" delete network-attachment-definition "${NAD_NAME}" --ignore-not-found
        exit 0
