name: Collect always-on E2E diagnostics bundle

description: >-
  Writes a set of log/YAML/events files worth having on every run, not
  only a failed one - Deployment logs, arbitrary resource YAMLs (the
  caller passes whichever kezio CRs, e.g. Machine/DeployRun/Image, are
  relevant to its own lane), on-demand workload logs by label selector,
  and cluster events. Runs with `set +e` throughout and every command is
  best-effort: a resource that does not exist yet (a lane that failed
  before creating it) must not fail this step, since it is meant to run
  with `if: always()`.

  Each input is a newline-separated list of "<selector>:<output-file>"
  pairs so one caller step can collect several resources of the same kind
  without multiple action invocations; blank lines are skipped.

inputs:
  namespace:
    description: Namespace to collect from.
    required: false
    default: "kezio-system"
  output-dir:
    description: Directory the collected files are written into (created if missing).
    required: false
    default: e2e-bundle
  deployments:
    description: >-
      Newline-separated "deployment-name:output-file" pairs. Each
      Deployment's combined container logs
      (kubectl logs deployment/<name> --all-containers --tail=-1) are
      written to <output-dir>/<output-file>.
    required: false
    default: ""
  resources:
    description: >-
      Newline-separated "kind/name:output-file" pairs. Each resource's
      YAML (kubectl get <kind> <name> -o yaml) is written to
      <output-dir>/<output-file>.
    required: false
    default: ""
  job-label-selectors:
    description: >-
      Newline-separated "label-selector:output-file" pairs. Combined
      container logs of every pod matching the selector
      (kubectl logs -l <selector> --all-containers --tail=1000) are
      written to <output-dir>/<output-file> - for on-demand workloads
      (ingest Jobs) that have no fixed Deployment name to address.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Collect diagnostics bundle
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        DEPLOYMENTS: ${{ inputs.deployments }}
        RESOURCES: ${{ inputs.resources }}
        JOB_LABEL_SELECTORS: ${{ inputs.job-label-selectors }}
      run: |
        set +e
        mkdir -p "${OUTPUT_DIR}"

        while IFS= read -r line; do
          [ -z "${line}" ] && continue
          name="${line%%:*}"
          file="${line#*:}"
          kubectl -n "${NAMESPACE}" logs "deployment/${name}" --all-containers --tail=-1 \
            >"${OUTPUT_DIR}/${file}" 2>&1
        done <<<"${DEPLOYMENTS}"

        while IFS= read -r line; do
          [ -z "${line}" ] && continue
          ref="${line%%:*}"
          file="${line#*:}"
          kubectl -n "${NAMESPACE}" get "${ref}" -o yaml >"${OUTPUT_DIR}/${file}" 2>&1
        done <<<"${RESOURCES}"

        while IFS= read -r line; do
          [ -z "${line}" ] && continue
          selector="${line%%:*}"
          file="${line#*:}"
          kubectl -n "${NAMESPACE}" logs -l "${selector}" --all-containers --tail=1000 \
            >"${OUTPUT_DIR}/${file}" 2>&1
        done <<<"${JOB_LABEL_SELECTORS}"

        kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp >"${OUTPUT_DIR}/events.txt" 2>&1
        exit 0
