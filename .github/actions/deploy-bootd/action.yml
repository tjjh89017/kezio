name: Deploy kezio-bootd on the provisioning bridge

description: >-
  Applies config/bootd's RBAC (the bootd ServiceAccount and the
  ClusterRole/ClusterRoleBinding it binds to), then declares a Site and a
  Subnet CR for the provisioning bridge so SubnetReconciler builds the
  bootd Deployment itself - image, NAD attachment, and DHCP_SCENARIO's
  lease-mode env all come from the Subnet/Site spec and the
  controller-manager's own BOOTD_DEPLOYMENT_* env (wired by
  deploy-e2e-deploy-path-stack), not a hand patch here. Waits for the
  Deployment to roll out, then proves both the reverse proxy and the
  Multus attachment actually came up before returning - see this action's
  own inline comments for the full "why" behind each piece. Every value
  comes from the calling job's own env (DHCP_SCENARIO,
  PROVISIONING_BOOTD_NET1_IP, PROVISIONING_CIDR,
  PROVISIONING_LEASE_RANGE_START/END), not declared inputs - composite
  action steps run as part of the calling job, so that env is already in
  scope. Sets BOOTD_POD_NAME in $GITHUB_ENV for later steps.

runs:
  using: composite
  steps:
    - name: Deploy kezio-bootd on the provisioning bridge
      shell: bash
      run: |
        set -euo pipefail
        kubectl apply -k config/bootd

        # DHCP_SCENARIO maps onto Subnet.spec.dhcp.mode: no-relay keeps
        # the existing-dhcp pod as lease authority and bootd stays pure
        # proxyDHCP (SubnetDHCPModeProxy); lease makes bootd's own
        # dnsmasq the segment's lease authority instead
        # (SubnetDHCPModeLease), in the pinned range below - see
        # config/bootd/README.md's "Own DHCP server mode".
        case "${DHCP_SCENARIO}" in
          no-relay) dhcp_mode=proxy ;;
          lease) dhcp_mode=lease ;;
          *)
            echo "::error::unknown dhcp_scenario '${DHCP_SCENARIO}' (expected no-relay or lease)" >&2
            exit 1
            ;;
        esac

        # kezio-system already carries both bootd prerequisites this
        # Subnet's namespace needs (config/bootd/README.md's "RBAC scope"
        # and "Capabilities and Pod Security Admission"): the bootd
        # ServiceAccount config/bootd/rbac.yaml just provisioned, and the
        # privileged PSA label deploy-kezio-controller already applied to
        # it. Reusing it here, rather than a dedicated namespace, is what
        # keeps this single-subnet lane from having to stand up and label
        # a second namespace just to satisfy them.
        cat <<EOF | kubectl apply -f -
        apiVersion: kezio.kojuro.date/v1alpha1
        kind: Site
        metadata:
          name: e2e-bmc
          namespace: kezio-system
        spec:
          seederSubnetRef:
            name: e2e-bmc
        EOF

        subnet_yaml="$(cat <<EOF
        apiVersion: kezio.kojuro.date/v1alpha1
        kind: Subnet
        metadata:
          name: e2e-bmc
          namespace: kezio-system
        spec:
          siteRef:
            name: e2e-bmc
          cidr: "${PROVISIONING_CIDR}"
          bootdServerIP: "${PROVISIONING_BOOTD_NET1_IP%%/*}"
          bootdNetworkRef:
            name: kezio-boot-network
          seederNetworkRef:
            name: kezio-seeder-network
          dhcp:
            mode: ${dhcp_mode}
        EOF
        )"
        if [ "${dhcp_mode}" = lease ]; then
          subnet_yaml+=$'\n    leaseRangeStart: '"${PROVISIONING_LEASE_RANGE_START}"
          subnet_yaml+=$'\n    leaseRangeEnd: '"${PROVISIONING_LEASE_RANGE_END}"
        fi
        echo "${subnet_yaml}" | kubectl apply -f -

        # SubnetReconciler builds kezio-bootd-e2e-bmc asynchronously after
        # observing the Subnet above - it does not exist the instant apply
        # returns. `rollout status` on a Deployment that isn't there yet
        # exits immediately with NotFound instead of waiting, so poll for
        # its existence first and only then hand off to `rollout status`
        # for the real readiness wait.
        deadline=$(( $(date +%s) + 120 ))
        until kubectl get deployment/kezio-bootd-e2e-bmc -n kezio-system >/dev/null 2>&1; do
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::kezio-bootd-e2e-bmc Deployment did not appear within 120s - the Subnet controller either hasn't reconciled yet or is withholding the Deployment; dumping Subnet/Site status and controller-manager logs to tell the two apart" >&2
            kubectl get subnet e2e-bmc -n kezio-system -o yaml || true
            kubectl get site e2e-bmc -n kezio-system -o yaml || true
            kubectl logs -n kezio-system deploy/kezio-controller-manager --tail=100 || true
            exit 1
          fi
          sleep 5
        done

        kubectl rollout status deployment/kezio-bootd-e2e-bmc -n kezio-system --timeout=180s

        # Proves bootd's reverse proxy reaches the boot config server, over
        # the same L2 path the VM will use. Split into a connect step and a
        # status check instead of a bare `curl -sf`, since `-f` conflates
        # "no TCP connection to bootd" with "connected fine but upstream
        # answered >= 400" - the http_code capture below distinguishes them.
        bootd_ip="${PROVISIONING_BOOTD_NET1_IP%%/*}"
        http_code="$(curl -s -o /dev/null -w '%{http_code}' "http://${bootd_ip}:80/boot/artifacts/manifest.json")" || {
          echo "::error::could not connect to bootd's reverse proxy at ${bootd_ip}:80 at all (no TCP connection - a network/routing failure, not an HTTP error from the boot config server)" >&2
          exit 1
        }
        if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 400 ]; then
          echo "::error::bootd's reverse proxy at ${bootd_ip}:80 is reachable but answered HTTP ${http_code} for /boot/artifacts/manifest.json - the proxy itself is up, the boot config server behind it is not serving the artifact" >&2
          exit 1
        fi

        # Fail fast here, not 20 minutes later at a PXE-E18 timeout on the
        # VM console: confirm the live bootd pod's network-status
        # annotation (set by Multus after CNI ADD) actually reports the
        # attachment, not just the deployment template's *request* for it.
        # Exclude terminating pods: `rollout status` returning does not
        # mean the old ReplicaSet's pod is gone yet, and it still reports
        # phase=Running, so a bare .items[0] can race onto it.
        bootd_pod="$(kubectl -n kezio-system get pods -l app.kubernetes.io/component=bootd -o json \
          | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
        if [ -z "${bootd_pod}" ] || [ "${bootd_pod}" = "null" ]; then
          echo "::error::no non-terminating bootd pod found" >&2
          exit 1
        fi
        network_status="$(kubectl -n kezio-system get pod "${bootd_pod}" \
          -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}')"
        if ! grep -q 'kezio-boot-network' <<<"${network_status}"; then
          echo "::error::bootd pod ${bootd_pod} has no kezio-boot-network attachment in its network-status; got: ${network_status}" >&2
          exit 1
        fi
        echo "BOOTD_POD_NAME=${bootd_pod}" >> "$GITHUB_ENV"
