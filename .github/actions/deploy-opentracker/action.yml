name: Deploy opentracker

description: >-
  Points config/opentracker's kustomize image at the calling job's
  opentracker image, applies it, and waits for the Deployment to become
  ready. Split out of legacy's mixed e2e-deploy-path-stack action, which
  bundled opentracker together with image-service/seeder/ingest/boot-agent
  wiring; this action carries only the opentracker piece.

  Retired as the tracker for a Site's own seeding path: SiteReconciler
  now creates one reconciler-managed tracker Deployment per seeding
  Site (see create-site), single-homed on that Site's seeding NAD and
  bound to Site.spec.tracker.ip. This action remains only to back
  Site.spec.tracker.externalURL - the escape hatch for an operator who
  already runs a tracker - for a lane whose seeder/leecher swarm has no
  NetworkAttachmentDefinition of its own to single-home a Site-managed
  tracker on (the image-path lane, at the time of writing).

inputs:
  opentracker-image:
    description: 'opentracker image reference, e.g. "ghcr.io/tunisiano187/opentracker-docker:master".'
    required: false
    default: "ghcr.io/tunisiano187/opentracker-docker:master"
  namespace:
    description: 'Namespace the kustomize overlay deploys opentracker into.'
    required: false
    default: "kezio-system"
  kustomize-dir:
    description: 'Kustomize overlay directory to apply.'
    required: false
    default: "config/opentracker"
  network-name:
    description: >-
      NetworkAttachmentDefinition to attach opentracker through, in the
      same namespace. Empty leaves opentracker cluster-internal only.
      Required whenever real machines announce to it: a peer connects to
      the address the tracker hands back, so the tracker must live on the
      segment those peers are on (docs/physical-lab-deployment.md's
      no-NAT rule).
    required: false
    default: ""
  timeout:
    description: 'Timeout for the opentracker rollout wait, e.g. "180s".'
    required: false
    default: "180s"

runs:
  using: composite
  steps:
    - name: Deploy opentracker
      shell: bash
      env:
        OPENTRACKER_IMG: ${{ inputs.opentracker-image }}
        NAMESPACE: ${{ inputs.namespace }}
        KUSTOMIZE_DIR: ${{ inputs.kustomize-dir }}
        NETWORK_NAME: ${{ inputs.network-name }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail
        make kustomize
        (cd "${KUSTOMIZE_DIR}" && ../../bin/kustomize edit set image "ghcr.io/tunisiano187/opentracker-docker=${OPENTRACKER_IMG}")
        bin/kustomize build "${KUSTOMIZE_DIR}" | kubectl apply -f -
        deployment="$(kubectl get deployment -n "${NAMESPACE}" -l app.kubernetes.io/component=opentracker \
          -o jsonpath='{.items[0].metadata.name}')"
        # config/opentracker ships the annotation commented out because the
        # network name is site-specific - the same patch the lab guide walks
        # an operator through by hand.
        if [ -n "${NETWORK_NAME}" ]; then
          kubectl -n "${NAMESPACE}" patch deployment/"${deployment}" --type=strategic \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"k8s.v1.cni.cncf.io/networks\":\"${NETWORK_NAME}\"}}}}}"
        fi
        kubectl rollout status deployment/"${deployment}" -n "${NAMESPACE}" --timeout="${TIMEOUT}"
