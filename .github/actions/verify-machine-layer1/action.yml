name: "Verify layer 1 (controller): status.provisioning matches spec, conditions clean"

description: >-
  Confirms a provisioned Machine's status reflects what the controller
  was asked to do, independent of whether the guest actually booted:
  status.provisioning.image.imageRef.name matches the Image that was
  provisioned, status.provisioning.image.targetDisk resolved to a
  non-empty disk, and the Ready condition is True. On any mismatch, dumps
  the failing detail (conditions, on Ready mismatch) and exits 1.

inputs:
  machine-name:
    description: Name of the Machine to verify.
    required: true
  namespace:
    description: Namespace the Machine lives in.
    required: false
    default: kezio-system
  image-name:
    description: Expected status.provisioning.image.imageRef.name.
    required: true

runs:
  using: composite
  steps:
    - name: "Verify layer 1 (controller): status.provisioning matches spec, conditions clean"
      shell: bash
      env:
        MACHINE_NAME: ${{ inputs.machine-name }}
        NAMESPACE: ${{ inputs.namespace }}
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        set -euo pipefail
        machine_json="$(kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o json)"

        provisioned_image="$(jq -r '.status.provisioning.image.imageRef.name' <<<"${machine_json}")"
        if [ "${provisioned_image}" != "${IMAGE_NAME}" ]; then
          echo "::error::status.provisioning.image.imageRef.name = ${provisioned_image}, want ${IMAGE_NAME}" >&2
          exit 1
        fi

        target_disk="$(jq -r '.status.provisioning.image.targetDisk' <<<"${machine_json}")"
        if [ -z "${target_disk}" ] || [ "${target_disk}" = "null" ]; then
          echo "::error::status.provisioning.image.targetDisk is empty" >&2
          exit 1
        fi
        echo "resolved target disk: ${target_disk}"

        ready_status="$(jq -r '.status.conditions[] | select(.type=="Ready") | .status' <<<"${machine_json}")"
        if [ "${ready_status}" != "True" ]; then
          echo "::error::Ready condition status = ${ready_status}, want True" >&2
          echo "${machine_json}" | jq '.status.conditions'
          exit 1
        fi
