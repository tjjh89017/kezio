name: Deploy kezio CRDs and controller-manager

description: >-
  Installs the kezio CRDs (make install, always from config/crd), sets the
  controller-manager image and applies the given kustomize overlay, then
  waits for the controller-manager Deployment to become ready. The
  Deployment is located by its control-plane=controller-manager label
  rather than a fixed name, since kustomize's namePrefix can change it.

inputs:
  manager-image:
    description: 'Controller-manager image, e.g. "ghcr.io/tjjh89017/kezio:main".'
    required: true
  namespace:
    description: 'Namespace the kustomize overlay deploys the controller-manager into.'
    required: false
    default: "scaffold-system"
  kustomize-dir:
    description: 'Kustomize overlay directory to apply after CRD install.'
    required: false
    default: "config/default"
  timeout:
    description: 'Timeout for the controller-manager rollout wait, e.g. "180s".'
    required: false
    default: "180s"
  extra-env:
    description: >-
      Optional newline-separated NAME=VALUE pairs applied to the
      controller-manager Deployment via "kubectl set env" after it first
      rolls out, e.g. lane-specific PARTITIONCONTENT_*/IMAGE_INGEST_*
      wiring. Empty (the default) leaves the Deployment exactly as the
      kustomize overlay built it - the fast lane's current behavior.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Deploy CRDs and the controller-manager
      shell: bash
      env:
        MANAGER_IMAGE: ${{ inputs.manager-image }}
        NAMESPACE: ${{ inputs.namespace }}
        KUSTOMIZE_DIR: ${{ inputs.kustomize-dir }}
        TIMEOUT: ${{ inputs.timeout }}
        EXTRA_ENV: ${{ inputs.extra-env }}
      run: |
        set -euo pipefail
        make install
        make kustomize
        (cd config/manager && ../../bin/kustomize edit set image controller="${MANAGER_IMAGE}")
        bin/kustomize build "${KUSTOMIZE_DIR}" | kubectl apply -f -
        deployment="$(kubectl get deployment -n "${NAMESPACE}" -l control-plane=controller-manager \
          -o jsonpath='{.items[0].metadata.name}')"
        kubectl rollout status deployment/"${deployment}" -n "${NAMESPACE}" --timeout="${TIMEOUT}"
        if [ -n "${EXTRA_ENV}" ]; then
          # Drop blank lines: a YAML block-scalar input (as main.yaml's
          # "extra-env: |" callers use) always ends in a trailing newline,
          # which "<<<" turns into a trailing empty mapfile element -
          # kubectl then reads that empty string as a second (invalid)
          # resource argument instead of an env change.
          #
          # Drop "#" lines for the same reason: the block scalar reads like
          # a config file, so callers comment it, and kubectl would take
          # each comment word as another resource argument and fail with
          # "all resources must be specified before environment changes".
          env_pairs=()
          while IFS= read -r pair; do
            # Leading whitespace survives when a caller indents a comment
            # past the block scalar's own indentation, so trim before
            # testing rather than only matching a bare "#".
            trimmed="${pair#"${pair%%[![:space:]]*}"}"
            case "${trimmed}" in
              "" | "#"*) continue ;;
            esac
            env_pairs+=("${trimmed}")
          done <<< "${EXTRA_ENV}"
          kubectl -n "${NAMESPACE}" set env deployment/"${deployment}" "${env_pairs[@]}"
          kubectl rollout status deployment/"${deployment}" -n "${NAMESPACE}" --timeout="${TIMEOUT}"
        fi

    - name: Confirm the manager shipped its default PostHook
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
      # A rolled-out manager is not the same as a usable one: the default
      # PostHook is created at startup from POD_NAMESPACE, and every
      # Machine whose postHookRefs name it plans nothing at all until it
      # exists. Losing it fails no rollout and logs nothing above INFO -
      # the Machine just sits delayed forever - so assert it here, where
      # the message can still name the cause.
      run: |
        set -euo pipefail
        if ! kubectl wait --for=create posthook/kezio-default-finalize \
          -n "${NAMESPACE}" --timeout=60s; then
          echo "::error::PostHook kezio-default-finalize was never created - check that the controller-manager container still has POD_NAMESPACE (a kustomize patch that sets, rather than appends to, its env array drops it)" >&2
          kubectl -n "${NAMESPACE}" get deployment -l control-plane=controller-manager \
            -o jsonpath='{.items[0].spec.template.spec.containers[0].env}' >&2 || true
          exit 1
        fi
