name: Build the live boot image

description: >-
  Runs hack/live-image/build.sh and writes a size summary (artifact sizes
  plus the top packages by installed size) to GITHUB_STEP_SUMMARY.

runs:
  using: composite
  steps:
    - name: Build live image
      shell: bash
      run: hack/live-image/build.sh

    - name: Write size summary
      shell: bash
      run: |
        {
          echo "## Live boot image artifacts"
          echo
          echo "Target squashfs size: 100-300 MiB."
          echo
          echo "| artifact | size |"
          echo "| --- | --- |"
          for f in dist/live/vmlinuz dist/live/initrd.img dist/live/filesystem.squashfs dist/live/shimx64.efi dist/live/grubx64.efi dist/live/kernel.config; do
            name="$(basename "${f}")"
            size_bytes="$(stat -c%s "${f}")"
            size_mib="$(awk -v b="${size_bytes}" 'BEGIN { printf "%.1f", b / 1048576 }')"
            echo "| ${name} | ${size_mib} MiB |"
          done
          echo
          echo "## Top 40 packages by installed size (chroot)"
          echo
          echo "| size (KiB) | package |"
          echo "| --- | --- |"
          head -n 40 dist/live/package-sizes.txt | awk -F'\t' '{ printf "| %s | %s |\n", $1, $2 }'
        } >>"${GITHUB_STEP_SUMMARY}"
