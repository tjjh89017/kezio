name: Deploy config/e2e-boot-path and wire the fetch-boot-artifacts initContainer
description: >-
  Installs CRDs, deploys the controller-manager, applies config/e2e-boot-path
  (the boot config + agent registration Services), then wires the
  fetch-boot-artifacts initContainer the same way every real KubeVirt
  lane does today (see e2e-boot-path-kubevirt.yml's "Deploy the boot
  config and agent registration Services, wire real artifacts" step,
  currently duplicated near-identically across that workflow,
  e2e-kubevirt-reusable.yml, and e2e-scale-multisite-kubevirt.yml): apply
  config/e2e-boot-path/boot-artifacts-init-patch.yaml (JSON Patch, adds
  the initContainer with a placeholder image), then `kubectl set image`
  to point it at the real boot-artifacts-img - the exact two-step
  sequence a real lane uses because the placeholder tag is baked into
  the patch file and the real tag is only known per-run. Exists so a
  probe (or, later, the real lanes themselves) can exercise this exact
  plumbing in one place instead of three.

  expect-ready controls what this action asserts: true (the default)
  waits for the rollout and confirms all six boot artifacts are present
  and readable in the running manager container; false waits instead for
  the initContainer to report an image-pull failure and treats that as
  success - the mode a probe run uses to prove a suspected regression
  still reproduces.

inputs:
  manager-img:
    description: kezio controller-manager image reference, already built/imported (or otherwise pullable) in the target cluster.
    required: true
  boot-artifacts-img:
    description: kezio-boot-artifacts image reference the fetch-boot-artifacts initContainer is pointed at.
    required: true
  namespace:
    description: Namespace config/default creates and deploys into.
    required: false
    default: kezio-system
  restrict-psa:
    description: >-
      Label the namespace pod-security.kubernetes.io/enforce=restricted
      before deploying, the same label test/e2e/e2e_test.go's BeforeAll
      applies for the always-on Go e2e suite - the KubeVirt lanes that
      deploy by hand (unlike that suite) currently skip this label
      entirely, so the numeric-UID/restricted-PSA contract
      docker/boot-artifacts/Dockerfile and the initContainer's
      securityContext exist for goes untested there. Default true so a
      probe run genuinely exercises that contract.
    required: false
    default: "true"
  expect-ready:
    description: >-
      true asserts the rollout succeeds and all six artifacts are
      readable in the manager container. false asserts the
      fetch-boot-artifacts initContainer instead reaches an image-pull
      failure - the mode that proves a suspected regression reproduces.
    required: false
    default: "true"
  rollout-timeout:
    description: Timeout passed to `kubectl rollout status` when expect-ready is true.
    required: false
    default: "180s"
  reproduction-poll-seconds:
    description: How long to poll for an image-pull failure when expect-ready is false, before treating non-reproduction as this action's own failure.
    required: false
    default: "120"

outputs:
  pod-name:
    description: The resolved, non-terminating controller-manager pod name.
    value: ${{ steps.resolve-pod.outputs.pod-name }}

runs:
  using: composite
  steps:
    - name: Install CRDs and deploy the controller-manager
      shell: bash
      env:
        MANAGER_IMG: ${{ inputs.manager-img }}
        NAMESPACE: ${{ inputs.namespace }}
        RESTRICT_PSA: ${{ inputs.restrict-psa }}
      run: |
        set -euo pipefail
        make install
        make deploy IMG="${MANAGER_IMG}"
        if [ "${RESTRICT_PSA}" = "true" ]; then
          kubectl label --overwrite ns "${NAMESPACE}" pod-security.kubernetes.io/enforce=restricted
        fi

    - name: Apply config/e2e-boot-path and wire real artifacts
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        BOOT_ARTIFACTS_IMG: ${{ inputs.boot-artifacts-img }}
      run: |
        set -euo pipefail
        kubectl apply -k config/e2e-boot-path
        # In-cluster ClusterIP DNS names are enough here: unlike the
        # KubeVirt VM lanes, nothing calling this action needs the boot
        # config server reachable from a raw L2 segment with no cluster
        # DNS - a probe (or a future preflight job) curls it from inside
        # the cluster.
        kubectl -n "${NAMESPACE}" set env deployment/kezio-controller-manager \
          BOOT_SERVER_ADDR=:8090 \
          BOOT_ARTIFACTS_DIR=/boot-artifacts \
          BOOT_SERVER_URL="http://kezio-boot-server.${NAMESPACE}.svc.cluster.local:8090" \
          AGENT_SERVER_ADDR=:8091 \
          BOOT_AGENT_SERVER_URL="http://kezio-agent-server.${NAMESPACE}.svc.cluster.local:8091" \
          DEPLOYER=agent
        # See config/e2e-boot-path/boot-artifacts-init-patch.yaml's own
        # comment for why this overlay does not wire the initContainer
        # itself: this two-step (JSON Patch with a placeholder image,
        # then `kubectl set image`) is the exact sequence every real
        # KubeVirt lane runs.
        kubectl -n "${NAMESPACE}" patch deployment/kezio-controller-manager --type=json \
          --patch-file=config/e2e-boot-path/boot-artifacts-init-patch.yaml
        kubectl -n "${NAMESPACE}" set image deployment/kezio-controller-manager \
          fetch-boot-artifacts="${BOOT_ARTIFACTS_IMG}"

    - name: Wait for the expected outcome (Ready, or a reproduced image-pull failure)
      id: resolve-pod
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        EXPECT_READY: ${{ inputs.expect-ready }}
        ROLLOUT_TIMEOUT: ${{ inputs.rollout-timeout }}
        REPRODUCTION_POLL_SECONDS: ${{ inputs.reproduction-poll-seconds }}
      run: |
        set -euo pipefail

        if [ "${EXPECT_READY}" = "true" ]; then
          if ! kubectl -n "${NAMESPACE}" rollout status deployment/kezio-controller-manager --timeout="${ROLLOUT_TIMEOUT}"; then
            echo "::error::deployment/kezio-controller-manager did not become Ready within ${ROLLOUT_TIMEOUT}" >&2
            kubectl -n "${NAMESPACE}" get pods -l control-plane=controller-manager -o wide
            kubectl -n "${NAMESPACE}" describe pods -l control-plane=controller-manager
            exit 1
          fi
          pod_name="$(kubectl -n "${NAMESPACE}" get pods -l control-plane=controller-manager -o json \
            | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
          echo "pod-name=${pod_name}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # expect-ready=false: poll for the initContainer to actually
        # reach an image-pull failure state, not just a non-Ready
        # Deployment (which could just as easily mean "still pulling" a
        # moment before success) - ImagePullBackOff/ErrImagePull is the
        # exact state run 31134471424 hit.
        deadline=$(( $(date +%s) + REPRODUCTION_POLL_SECONDS ))
        reproduced=""
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          pod_name="$(kubectl -n "${NAMESPACE}" get pods -l control-plane=controller-manager -o json \
            | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
          if [ -n "${pod_name}" ] && [ "${pod_name}" != "null" ]; then
            reason="$(kubectl -n "${NAMESPACE}" get pod "${pod_name}" -o json \
              | jq -r '.status.initContainerStatuses[]? | select(.name=="fetch-boot-artifacts") | .state.waiting.reason // empty')"
            echo "$(date -Is) pod=${pod_name} fetch-boot-artifacts waiting.reason=${reason:-<none>}"
            case "${reason}" in
              ImagePullBackOff|ErrImagePull)
                reproduced="${pod_name}"
                break
                ;;
            esac
          fi
          sleep 5
        done

        if [ -z "${reproduced}" ]; then
          echo "::error::expect-ready=false but fetch-boot-artifacts never reached ImagePullBackOff/ErrImagePull within ${REPRODUCTION_POLL_SECONDS}s - the suspected failure did not reproduce" >&2
          kubectl -n "${NAMESPACE}" get pods -l control-plane=controller-manager -o wide
          kubectl -n "${NAMESPACE}" describe pods -l control-plane=controller-manager
          exit 1
        fi

        echo "Reproduced: fetch-boot-artifacts on pod ${reproduced} is in ImagePullBackOff/ErrImagePull."
        kubectl -n "${NAMESPACE}" describe pod "${reproduced}"
        echo "pod-name=${reproduced}" >> "$GITHUB_OUTPUT"

    - name: Verify all six boot artifacts are present and readable in the manager container
      if: ${{ inputs.expect-ready == 'true' }}
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        POD_NAME: ${{ steps.resolve-pod.outputs.pod-name }}
      run: |
        set -euo pipefail
        for f in vmlinuz initrd.img filesystem.squashfs shimx64.efi grubx64.efi manifest.json; do
          if ! kubectl -n "${NAMESPACE}" exec "${POD_NAME}" -c manager -- test -r "/boot-artifacts/${f}"; then
            echo "::error::/boot-artifacts/${f} is missing or unreadable in the manager container of pod ${POD_NAME}" >&2
            kubectl -n "${NAMESPACE}" exec "${POD_NAME}" -c manager -- ls -la /boot-artifacts || true
            exit 1
          fi
        done
        echo "All six boot artifacts are present and readable under /boot-artifacts in ${POD_NAME}'s manager container."
        kubectl -n "${NAMESPACE}" exec "${POD_NAME}" -c manager -- ls -la /boot-artifacts
