name: Assert the boot artifacts agent commit
description: >-
  Curls bootd's reverse proxy for manifest.json's agentCommit and compares it
  against the commit under test, so a lane can never go green while silently
  booting a stale kezio-agent: it either proves build_boot_artifacts actually
  rebuilt the agent (failing loudly if not), or says out loud which commit it
  booted instead. Single source shared by e2e-boot-path-kubevirt.yml,
  e2e-kubevirt-reusable.yml and e2e-scale-multisite-kubevirt.yml, which all
  used to carry this script inline and duplicated.

inputs:
  bootd-ip:
    description: >-
      Host or IP serving manifest.json (bootd's reverse proxy in real
      lanes; any other host:port-reachable server elsewhere), with or
      without a CIDR suffix (e.g. "10.0.0.5" or "10.0.0.5/24" - the
      suffix, if any, is stripped).
    required: true
  port:
    description: Port manifest.json is served on. Defaults to 80, the port bootd's reverse proxy always uses in real lanes.
    required: false
    default: "80"
  expected-commit:
    description: The commit the running kezio-agent is expected to be built from (normally github.sha).
    required: true
  build-boot-artifacts:
    description: >-
      "true" if this run built its own kezio-boot-artifacts image from
      expected-commit; a mismatch is then a hard failure instead of the
      expected pinned-default case.
    required: true

runs:
  using: composite
  steps:
    - name: Assert the boot artifacts agent commit
      shell: bash
      env:
        BOOTD_IP: ${{ inputs.bootd-ip }}
        PORT: ${{ inputs.port }}
        EXPECTED_COMMIT: ${{ inputs.expected-commit }}
        BUILD_BOOT_ARTIFACTS: ${{ inputs.build-boot-artifacts }}
      run: |
        set -euo pipefail
        bootd_ip="${BOOTD_IP%%/*}"
        agent_commit="$(curl -sf "http://${bootd_ip}:${PORT}/boot/artifacts/manifest.json" | jq -r '.agentCommit // "unknown"')"
        if [ "${agent_commit}" = "${EXPECTED_COMMIT}" ]; then
          result="FRESH - this run exercised the commit under test's own kezio-agent."
        elif [ "${BUILD_BOOT_ARTIFACTS}" = "true" ]; then
          result="MISMATCH (unexpected - build_boot_artifacts was set)"
        else
          result="STALE / PINNED - this run booted build-live-image.yml's last published kezio-agent, NOT the commit under test. Set build_boot_artifacts: true to exercise agent-side changes."
        fi
        # Also logged directly so a log reader sees the verdict without opening the job summary.
        echo "::notice::Boot artifacts agent commit result: ${result} (booted ${agent_commit}, expected ${EXPECTED_COMMIT})"
        {
          echo "## Boot artifacts agent commit"
          echo "- commit under test: \`${EXPECTED_COMMIT}\`"
          echo "- booted kezio-agent built from: \`${agent_commit}\`"
          echo "- result: ${result}"
        } >>"${GITHUB_STEP_SUMMARY}"
        if [ "${agent_commit}" != "${EXPECTED_COMMIT}" ] && [ "${BUILD_BOOT_ARTIFACTS}" = "true" ]; then
          echo "::error::build_boot_artifacts was set to build a fresh kezio-boot-artifacts image from ${EXPECTED_COMMIT}, but the deployed image reports agentCommit=${agent_commit}. The freshness build did not actually take effect." >&2
          exit 1
        fi
