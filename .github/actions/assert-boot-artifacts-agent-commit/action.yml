name: Assert the boot artifacts agent commit
description: >-
  Curls bootd's reverse proxy for manifest.json's agentCommit and compares it
  against the commit under test, so a lane can never go green while silently
  booting a stale kezio-agent. CI always builds the boot artifacts from the
  commit under test, so any mismatch is a hard failure.

inputs:
  bootd-ip:
    description: >-
      Host or IP serving manifest.json, with or without a CIDR suffix
      (the suffix, if any, is stripped).
    required: true
  port:
    description: Port manifest.json is served on. Defaults to 80, bootd's reverse-proxy port.
    required: false
    default: "80"
  expected-commit:
    description: The commit the running kezio-agent is expected to be built from (normally github.sha).
    required: true

runs:
  using: composite
  steps:
    - name: Assert the boot artifacts agent commit
      shell: bash
      env:
        BOOTD_IP: ${{ inputs.bootd-ip }}
        PORT: ${{ inputs.port }}
        EXPECTED_COMMIT: ${{ inputs.expected-commit }}
      run: |
        set -euo pipefail
        bootd_ip="${BOOTD_IP%%/*}"
        agent_commit="$(curl -sf "http://${bootd_ip}:${PORT}/boot/artifacts/manifest.json" | jq -r '.agentCommit // "unknown"')"
        if [ "${agent_commit}" = "${EXPECTED_COMMIT}" ]; then
          result="FRESH - this run exercised the commit under test's own kezio-agent."
        else
          result="MISMATCH - this run booted a kezio-agent that is NOT built from the commit under test."
        fi
        # Logged directly so a log reader sees the verdict without opening the job summary.
        echo "::notice::Boot artifacts agent commit result: ${result} (booted ${agent_commit}, expected ${EXPECTED_COMMIT})"
        {
          echo "## Boot artifacts agent commit"
          echo "- commit under test: \`${EXPECTED_COMMIT}\`"
          echo "- booted kezio-agent built from: \`${agent_commit}\`"
          echo "- result: ${result}"
        } >>"${GITHUB_STEP_SUMMARY}"
        if [ "${agent_commit}" != "${EXPECTED_COMMIT}" ]; then
          echo "::error::The boot artifacts were expected to be built from ${EXPECTED_COMMIT}, but the deployed image reports agentCommit=${agent_commit}." >&2
          exit 1
        fi
