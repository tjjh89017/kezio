name: Fail fast if the downloaded boot artifacts are empty
description: >-
  Checks that vmlinuz, initrd.img, filesystem.squashfs, shimx64.efi,
  grubx64.efi, and manifest.json exist and are non-empty under the given
  directory. Guards against a download-artifact step that "succeeded" but
  handed off a truncated or zero-byte boot-artifacts set, which would
  otherwise surface much later as an obscure boot failure instead of here.

inputs:
  artifacts-dir:
    description: Directory the boot artifacts were downloaded into, relative to the repository root.
    required: false
    default: dist/live

runs:
  using: composite
  steps:
    - name: Fail fast if the downloaded boot artifacts are empty
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
      run: |
        set -euo pipefail
        missing=()
        for f in vmlinuz initrd.img filesystem.squashfs shimx64.efi grubx64.efi manifest.json; do
          [ -s "${ARTIFACTS_DIR}/${f}" ] || missing+=("${f}")
        done
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::boot-artifacts artifact download is missing or empty: ${missing[*]}" >&2
          exit 1
        fi
