name: Customize the Ubuntu cloud image with a marker file and qemu-guest-agent
description: >-
  Injects a fresh marker token and qemu-guest-agent (plus its full runtime
  dependency closure) into a pristine Ubuntu cloud image, offline, via
  virt-customize. Shared by e2e-kubevirt-reusable.yml and
  e2e-scale-multisite-kubevirt.yml so the debugging history behind this step
  lives in one place.

inputs:
  source-image-path:
    description: >-
      Path to the pristine, downloaded cloud image. Left untouched; the
      customized result is written to output-image-path instead.
    required: true
  output-image-path:
    description: >-
      Path the customized (marked + qemu-guest-agent-injected) image is
      written to. Also exported as UBUNTU_CLOUD_IMAGE_PATH via GITHUB_ENV
      for later steps in the calling job.
    required: true
  marker-path:
    description: Guest path the fresh marker token is written to.
    required: true
  cloud-image-url:
    description: >-
      URL the cloud image was downloaded from. Its sibling .manifest (same
      URL, .img -> .manifest) is fetched to find which of
      qemu-guest-agent's dependency closure the image is still missing.
    required: true

runs:
  using: composite
  steps:
    - name: Customize the Ubuntu cloud image with a marker file and qemu-guest-agent
      # Injects marker-path (a fresh token, this run's content-layer proof
      # value) and qemu-guest-agent (needed only by this e2e test image,
      # never by production images) in one virt-customize call. Copied
      # into a fresh path first since the qcow2 is edited in place and the
      # caller's cache step must keep the pristine download.
      #
      # Runs with --no-network + dpkg -i rather than --network +
      # --install: booting the appliance's networking hit unresolvable
      # passt/DHCP failures in this runner environment. dpkg -i still runs
      # real maintainer scripts and registers packages in the image's own
      # dpkg database, and fails loudly on any missing dependency.
      #
      # qemu-guest-agent's Depends: is not fully covered by the minimal
      # cloud image (e.g. liburing2/libnuma1 were missing for noble),
      # which crash-loops the daemon on start with no functional-restart
      # recovery. A fixed dependency list would only be a stopgap against
      # future version bumps, so the closure is resolved dynamically below
      # via `apt-get install --simulate` (apt's real solver, resolving
      # `a | b` alternatives and virtual packages, unlike
      # `apt-cache depends --recurse`) with
      # `-o Dir::State::status=/dev/null` so the closure reflects
      # qemu-guest-agent's complete dependency tree, not whatever this
      # runner already has installed.
      #
      # What's missing from the image is found by diffing that closure
      # against the image's own sibling .manifest file (dpkg-query -W
      # format), not by assuming; qemu-guest-agent itself is always
      # downloaded regardless. Arch-qualified names (e.g. "libc6:amd64")
      # are stripped before comparing, since the manifest never carries
      # the qualifier. A download failure for any package in the closure
      # fails this step outright.
      shell: bash
      run: |
        set -euo pipefail

        source_image="${{ inputs.source-image-path }}"
        output_image="${{ inputs.output-image-path }}"
        marker_path="${{ inputs.marker-path }}"
        cloud_image_url="${{ inputs.cloud-image-url }}"

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libguestfs-tools

        cp "${source_image}" "${output_image}"

        MARKER_TOKEN="$(openssl rand -hex 16)"
        echo "MARKER_TOKEN=${MARKER_TOKEN}" >> "$GITHUB_ENV"

        echo "::group::Resolving qemu-guest-agent's runtime dependency closure"
        mapfile -t qga_closure < <(
          apt-get install --simulate -o Dir::State::status=/dev/null \
            --no-install-recommends qemu-guest-agent \
            | awk '/^Inst /{n=$2; sub(/:.*$/, "", n); print n}' \
            | sort -u
        )
        if [ "${#qga_closure[@]}" -eq 0 ]; then
          echo "::error::apt could not resolve qemu-guest-agent's dependency closure" >&2
          exit 1
        fi
        echo "full closure (${#qga_closure[@]} packages): ${qga_closure[*]}"

        manifest_file="$(mktemp)"
        curl -sfL -o "${manifest_file}" "${cloud_image_url%.img}.manifest"

        mapfile -t qga_missing < <(
          comm -23 \
            <(printf '%s\n' "${qga_closure[@]}" | sort -u) \
            <(awk -F'\t' '{n=$1; sub(/:.*$/, "", n); print n}' "${manifest_file}" | sort -u)
        )
        if ! printf '%s\n' "${qga_missing[@]:-}" | grep -qxF qemu-guest-agent; then
          qga_missing+=("qemu-guest-agent")
        fi
        echo "missing from the image manifest, to be downloaded and injected (${#qga_missing[@]} packages): ${qga_missing[*]}"
        echo "::endgroup::"

        qga_deb_dir="${RUNNER_TEMP}/qga-debs"
        mkdir -p "${qga_deb_dir}"
        echo "::group::Downloading resolved+injected packages"
        (
          cd "${qga_deb_dir}"
          for pkg in "${qga_missing[@]}"; do
            if ! apt-get download "${pkg}"; then
              echo "::error::apt-get download failed for '${pkg}' (part of qemu-guest-agent's dependency closure, not already carried by the image)" >&2
              exit 1
            fi
          done
        )
        echo "::endgroup::"

        # LIBGUESTFS_BACKEND=direct skips libguestfs's backend probe
        # (which can otherwise settle on software "tcg") and forces it
        # onto /dev/kvm, made world-accessible by the calling job's
        # "Fail fast unless /dev/kvm is usable" step's udev rule.
        export LIBGUESTFS_BACKEND=direct
        # Ubuntu ships /boot/vmlinuz-* mode 0600; virt-customize runs
        # unprivileged, so supermin needs it world-readable to build its appliance.
        sudo chmod 0644 /boot/vmlinuz-*
        guestfs_log="$(mktemp)"

        echo "::group::virt-customize: injecting marker + qemu-guest-agent"
        start_ts="$(date +%s)"
        # 300s bound: guards against a silent regression to the TCG
        # fallback, not a genuinely slow but successful run (normally
        # well under a minute on KVM).
        if ! timeout 300 virt-customize -a "${output_image}" \
          --no-network \
          --write "${marker_path}:${MARKER_TOKEN}" \
          --copy-in "${qga_deb_dir}:/tmp" \
          --run-command 'dpkg -i /tmp/qga-debs/*.deb' \
          --run-command 'systemctl enable qemu-guest-agent' \
          --verbose >"${guestfs_log}" 2>&1; then
          end_ts="$(date +%s)"
          echo "::error::virt-customize failed or timed out after $((end_ts - start_ts))s; full --verbose output follows" >&2
          cat "${guestfs_log}" >&2
          exit 1
        fi
        end_ts="$(date +%s)"
        echo "virt-customize (appliance boot + dpkg -i + all edits) completed in $((end_ts - start_ts))s"
        echo "::endgroup::"

        echo "UBUNTU_CLOUD_IMAGE_PATH=${output_image}" >> "$GITHUB_ENV"
