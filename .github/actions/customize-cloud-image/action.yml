name: Customize the Ubuntu cloud image with a marker file and qemu-guest-agent
description: >-
  Injects a fresh marker token and qemu-guest-agent (plus its full runtime
  dependency closure) into a pristine Ubuntu cloud image, offline, via
  virt-customize. Shared by e2e-kubevirt-reusable.yml and
  e2e-scale-multisite-kubevirt.yml so the debugging history behind this step
  lives in one place.

inputs:
  source-image-path:
    description: >-
      Path to the pristine, downloaded cloud image. Left untouched; the
      customized result is written to output-image-path instead.
    required: true
  output-image-path:
    description: >-
      Path the customized (marked + qemu-guest-agent-injected) image is
      written to. Also exported as UBUNTU_CLOUD_IMAGE_PATH via GITHUB_ENV
      for later steps in the calling job.
    required: true
  marker-path:
    description: Guest path the fresh marker token is written to.
    required: true
  cloud-image-url:
    description: >-
      URL the cloud image was downloaded from. Its sibling .manifest (same
      URL, .img -> .manifest) is fetched to find which of
      qemu-guest-agent's dependency closure the image is still missing.
    required: true

runs:
  using: composite
  steps:
    - name: Customize the Ubuntu cloud image with a marker file and qemu-guest-agent
      # Two things this test image needs that the stock download does
      # not have, both injected in one virt-customize call:
      #   - marker-path, containing a token generated fresh by this
      #     run (not baked into the repo) - the content layer's proof
      #     value. See MARKER_PATH's own comment in the calling workflow
      #     for why a fresh marker beats reading a field the stock image
      #     already has.
      #   - qemu-guest-agent, installed and enabled: the e2e test image
      #     itself must carry it; production images never need it,
      #     since the controller/boot layers of the three-layer verify
      #     do not depend on guest content.
      # Copied into a fresh path first: the qcow2 gets edited in place
      # below, and the caller's cache step must keep the pristine download
      # so a re-run with a cache hit customizes a clean copy, not a
      # copy some previous attempt already stamped a marker into.
      #
      # This step went through two networked virt-customize attempts
      # before landing on the offline one below. First, `--network`
      # with `--install qemu-guest-agent` (apt-get running inside the
      # appliance's guest chroot) hit "libguestfs error: passt exited
      # with status 1" - passt's shipped AppArmor profile denies the
      # PID-file write into libguestfs's per-run
      # /run/user/<uid>/libguestfs*/ directory. Patching that profile
      # (see git history) got passt starting, but a second failure
      # took its place: the appliance's own init runs `dhcpcd eth0`
      # then polls /etc/resolv.conf for a nameserver line 11 times,
      # 1s apart, and every poll came back empty - the appliance never
      # got a DHCP lease or DNS from passt at all, so the guest-chroot
      # resolv.conf rewrite this step used to carry (verified to have
      # run, via the guestfsd log) was moot with no functional eth0
      # underneath it. Appliance networking on this runner has now
      # failed three different ways (passt AppArmor, then appliance
      # DHCP never completing) for two different reasons, so this step
      # switches mechanism entirely: `--no-network` skips booting the
      # appliance's networking (and passt) altogether, and
      # qemu-guest-agent plus its full runtime dependency closure are
      # downloaded on the host below and installed with `dpkg -i`
      # inside the guest instead of `--install`'s apt-get. `dpkg -i`
      # still runs real maintainer scripts and registers the packages
      # in the image's own dpkg database (unlike a bare `dpkg-deb -x`
      # unpack), and fails loudly if any dependency is missing - which
      # the closure resolved below guarantees is not the case.
      #
      # An earlier revision of this step dropped virt-customize
      # entirely for a qemu-nbd mount of the qcow2's root partition,
      # believing the appliance's own boot time was the real
      # bottleneck. That symptom is now believed to have been
      # libguestfs falling back to its "tcg" (software-emulated)
      # backend, not an inherent appliance-boot cost - the "Fail fast
      # unless /dev/kvm is usable" step in the calling job (and the udev
      # MODE="0666" rule it installs) confirms /dev/kvm is present and
      # usable on this runner, so LIBGUESTFS_BACKEND=direct below
      # makes the appliance boot on real KVM instead of TCG.
      #
      # qemu-guest-agent's own Depends: is not fully covered by what
      # the (minimal) cloud image already carries - noble's
      # qemu-guest-agent 1:8.2.2+ds-0ubuntu1.16 once depended on
      # liburing2 (>= 2.3) and libnuma1 (>= 2.0.11), neither of which
      # was in ubuntu-24.04-minimal-cloudimg-amd64.manifest, unlike
      # libc6/libglib2.0-0t64/libudev1/init-system-helpers, which
      # were. Missing liburing2 meant the daemon's dynamic linker
      # failed instantly on start (no .so found), which systemd saw
      # as a crash loop that burned through StartLimitBurst and gave
      # up for good - no amount of restarting fixes a missing
      # library. A fixed dependency list would only be a stopgap: a
      # future qemu-guest-agent version bump can add, drop, or rename
      # dependencies at any point, silently reintroducing the same
      # crash loop with no signal until the boot-verify step times
      # out. The dependency closure is therefore resolved dynamically
      # below, so this step self-heals across qemu-guest-agent
      # updates.
      #
      # Resolution mechanism: `apt-get install --simulate` runs apt's
      # real solver, so `Depends: a | b` alternatives and virtual
      # packages come out already resolved to one concrete,
      # installable package - unlike `apt-cache depends --recurse`,
      # which prints the raw, unresolved dependency graph (every
      # alternative, every virtual-package name, some of which name
      # no real .deb at all). `-o Dir::State::status=/dev/null` makes
      # apt simulate against an empty dpkg status database, so the
      # closure always lists qemu-guest-agent's *complete* dependency
      # tree regardless of what this runner happens to already have
      # installed - the runner's own package set must never leak into
      # what gets injected into the image. This runner tracks the
      # same noble release the image is pinned to
      # (cloud-image-url above), so the closure it resolves is
      # the same one the image would need.
      #
      # What's still missing from the image is found by diffing that
      # closure against the image's own sibling .manifest file (same
      # URL, .img -> .manifest; "pkgname<TAB>version" per line,
      # dpkg-query -W format) instead of assuming which packages are
      # absent. Only packages the manifest doesn't already list get
      # downloaded; qemu-guest-agent itself is always downloaded
      # regardless of manifest membership, since it is the package
      # this step exists to install. Package names apt reports as
      # arch-qualified (e.g. "libc6:amd64") are stripped to their bare
      # name before comparing against the manifest and before
      # `apt-get download`, since the manifest never carries the
      # qualifier either. A download failure for any package in the
      # closure fails this step outright - a silently-skipped
      # dependency is exactly the class of bug this whole mechanism
      # exists to prevent.
      shell: bash
      run: |
        set -euo pipefail

        source_image="${{ inputs.source-image-path }}"
        output_image="${{ inputs.output-image-path }}"
        marker_path="${{ inputs.marker-path }}"
        cloud_image_url="${{ inputs.cloud-image-url }}"

        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libguestfs-tools

        cp "${source_image}" "${output_image}"

        MARKER_TOKEN="$(openssl rand -hex 16)"
        echo "MARKER_TOKEN=${MARKER_TOKEN}" >> "$GITHUB_ENV"

        echo "::group::Resolving qemu-guest-agent's runtime dependency closure"
        mapfile -t qga_closure < <(
          apt-get install --simulate -o Dir::State::status=/dev/null \
            --no-install-recommends qemu-guest-agent \
            | awk '/^Inst /{n=$2; sub(/:.*$/, "", n); print n}' \
            | sort -u
        )
        if [ "${#qga_closure[@]}" -eq 0 ]; then
          echo "::error::apt could not resolve qemu-guest-agent's dependency closure" >&2
          exit 1
        fi
        echo "full closure (${#qga_closure[@]} packages): ${qga_closure[*]}"

        manifest_file="$(mktemp)"
        curl -sfL -o "${manifest_file}" "${cloud_image_url%.img}.manifest"

        mapfile -t qga_missing < <(
          comm -23 \
            <(printf '%s\n' "${qga_closure[@]}" | sort -u) \
            <(awk -F'\t' '{n=$1; sub(/:.*$/, "", n); print n}' "${manifest_file}" | sort -u)
        )
        if ! printf '%s\n' "${qga_missing[@]:-}" | grep -qxF qemu-guest-agent; then
          qga_missing+=("qemu-guest-agent")
        fi
        echo "missing from the image manifest, to be downloaded and injected (${#qga_missing[@]} packages): ${qga_missing[*]}"
        echo "::endgroup::"

        qga_deb_dir="${RUNNER_TEMP}/qga-debs"
        mkdir -p "${qga_deb_dir}"
        echo "::group::Downloading resolved+injected packages"
        (
          cd "${qga_deb_dir}"
          for pkg in "${qga_missing[@]}"; do
            if ! apt-get download "${pkg}"; then
              echo "::error::apt-get download failed for '${pkg}' (part of qemu-guest-agent's dependency closure, not already carried by the image)" >&2
              exit 1
            fi
          done
        )
        echo "::endgroup::"

        # LIBGUESTFS_BACKEND=direct skips libguestfs's own backend
        # probe (which can otherwise settle on the software "tcg"
        # backend) and forces it straight onto /dev/kvm, made
        # world-accessible by the "Fail fast unless /dev/kvm is
        # usable" step's udev rule earlier in the calling job. virt-customize
        # therefore runs unprivileged (no sudo): sudo would only
        # re-add a privilege this step does not need, and would need
        # `-E` to keep LIBGUESTFS_BACKEND visible to the sudo'd
        # process regardless.
        export LIBGUESTFS_BACKEND=direct
        # Ubuntu ships /boot/vmlinuz-* mode 0600 (root-only); since
        # virt-customize above runs unprivileged, supermin can't read
        # the host kernel to build its appliance unless it's world-readable.
        sudo chmod 0644 /boot/vmlinuz-*
        guestfs_log="$(mktemp)"

        echo "::group::virt-customize: injecting marker + qemu-guest-agent"
        start_ts="$(date +%s)"
        # 300s bound: a KVM-backed supermin appliance boot plus one
        # dpkg -i is normally well under a minute, so this guards
        # against a silent regression to the TCG fallback rather than
        # a genuinely slow but successful run.
        if ! timeout 300 virt-customize -a "${output_image}" \
          --no-network \
          --write "${marker_path}:${MARKER_TOKEN}" \
          --copy-in "${qga_deb_dir}:/tmp" \
          --run-command 'dpkg -i /tmp/qga-debs/*.deb' \
          --run-command 'systemctl enable qemu-guest-agent' \
          --verbose >"${guestfs_log}" 2>&1; then
          end_ts="$(date +%s)"
          echo "::error::virt-customize failed or timed out after $((end_ts - start_ts))s; full --verbose output follows" >&2
          cat "${guestfs_log}" >&2
          exit 1
        fi
        end_ts="$(date +%s)"
        echo "virt-customize (appliance boot + dpkg -i + all edits) completed in $((end_ts - start_ts))s"
        echo "::endgroup::"

        echo "UBUNTU_CLOUD_IMAGE_PATH=${output_image}" >> "$GITHUB_ENV"
