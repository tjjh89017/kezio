name: Provision the target VM through a real KubeVirtBMC/Redfish endpoint

description: >-
  The initial BMC-driven provisioning sequence
  e2e-kubevirt-reusable.yml's "deploy-kubevirt" job runs after ingest
  finishes: creates the BMC credentials Secret, the target VM's
  power-cycle-surviving data disk PVC, and the VirtualMachine itself
  powered off (`running: false`); asserts the harness never started it;
  creates KubeVirtBMC's VirtualMachineBMC for it and waits for both the
  VirtualMachineBMC and its virtbmc pod to become Ready; verifies the
  Redfish endpoint answers and reports the VM off; then creates the
  Machine CR with spec.bmc pointing at that endpoint and asserts kezio's
  own Register step (not the harness) is what powers the VM on and gets
  its VMI to Ready. See this action's own inline comments for the full
  "why" behind each step - moved verbatim, not redesigned.

  Every value comes from the calling job's own env (BMC_CREDS_SECRET,
  TARGET_VM_NAME, TARGET_VM_MAC, TARGET_VM_DISK_SERIAL,
  BMC_REDFISH_ADDRESS, IMAGE_NAME), not declared inputs - composite
  action steps run as part of the calling job, so that env is already in
  scope.

runs:
  using: composite
  steps:
    - name: Create the BMC credentials Secret
      # Shared by both sides of the BMC relationship: KubeVirtBMC's
      # VirtualMachineBMC.spec.authSecretRef and kezio's
      # Machine.spec.bmc.credentialsSecretRef both read the same
      # "username"/"password" keys (KubeVirtBMC's bmcUserKey/bmcPasswordKey
      # match internal/bmc/credentials.go's SecretKeyUsername/SecretKeyPassword),
      # so one Secret authenticates both sides.
      shell: bash
      run: |
        set -euo pipefail
        BMC_PASSWORD="$(openssl rand -hex 16)"
        echo "::add-mask::${BMC_PASSWORD}"
        kubectl -n kezio-system create secret generic "${BMC_CREDS_SECRET}" \
          --type=kubernetes.io/basic-auth \
          --from-literal=username=kezio-e2e \
          --from-literal=password="${BMC_PASSWORD}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Create the target VM's data disk PVC
      # The later power-cycle step recreates the VMI to consume
      # KubeVirtBMC's one-shot PXE override (the BMC lane's stand-in for a
      # power-button press). An emptyDisk volume does not survive that -
      # KubeVirt recreates it blank on every VMI - which would wipe the
      # deployed disk before the reboot. A PVC survives VMI recreation like
      # a real bare-metal disk would. volumeMode Filesystem, not Block:
      # local-path has no raw block device to hand out, and KubeVirt
      # presents a Filesystem-mode PVC to the guest as the same virtio
      # block device emptyDisk did.
      shell: bash
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ${TARGET_VM_NAME}-data
          namespace: kezio-system
        spec:
          accessModes:
            - ReadWriteOnce
          volumeMode: Filesystem
          storageClassName: local-path
          resources:
            requests:
              storage: 4Gi
        EOF

    - name: Create the target KubeVirt VirtualMachine, powered off
      # `running: false`: this VM is never started here. Neither device
      # carries a permanent bootOrder: a static bootOrder would keep
      # QEMU's "bootorder" fw_cfg file non-empty on every boot, and OVMF's
      # QemuBootOrderLib rewrites NVRAM BootOrder from that file whenever
      # it is present - discarding the persistent efibootmgr entry
      # kezio-agent writes at finalize and falling back to PXE. With no
      # static bootOrder, fw_cfg goes back to empty once KubeVirtBMC's
      # one-shot PXE override (SetOneTimePXEBoot) is consumed and
      # restored, so OVMF leaves NVRAM BootOrder untouched on the reboot
      # into disk - matching real firmware with no BMC override in effect.
      shell: bash
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: ${TARGET_VM_NAME}
          namespace: kezio-system
        spec:
          running: false
          template:
            metadata:
              labels:
                kubevirt.io/vm: ${TARGET_VM_NAME}
            spec:
              domain:
                cpu:
                  cores: 2
                resources:
                  requests:
                    memory: 3Gi
                firmware:
                  bootloader:
                    efi:
                      secureBoot: false
                      # Persist the EFI variable store: real bare-metal
                      # NVRAM survives power cycles, so the efibootmgr
                      # boot entry kezio-agent writes at finalize must
                      # survive the reboot into disk.
                      persistent: true
                devices:
                  interfaces:
                    - name: provisioning
                      macAddress: "${TARGET_VM_MAC}"
                      bridge: {}
                  disks:
                    - name: data
                      serial: "${TARGET_VM_DISK_SERIAL}"
                      disk:
                        bus: virtio
                    - name: cloudinitdisk
                      disk:
                        bus: virtio
              networks:
                - name: provisioning
                  multus:
                    networkName: kezio-boot-network-vm
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: ${TARGET_VM_NAME}-data
                - name: cloudinitdisk
                  cloudInitNoCloud:
                    # Without this override, qemu-guest-agent.service
                    # crash-loops in the guest and permanently fails
                    # (systemd StartLimitBurst exhausted) before it can
                    # connect. This VM persists across the BMC
                    # power-cycle's VMI recreation, so the seed stays
                    # attached and applies on every boot, including after
                    # PowerOn.
                    userData: |
                      #cloud-config
                      write_files:
                        - path: /etc/systemd/system/qemu-guest-agent.service.d/override.conf
                          content: |
                            [Unit]
                            StartLimitIntervalSec=0
                            [Service]
                            Restart=always
                            RestartSec=1
                      runcmd:
                        - systemctl daemon-reload
                        - systemctl enable --now qemu-guest-agent.service
        EOF

    - name: "Assert the VM is off before any Machine is created (the harness did not start it)"
      # Bounded wait, not a one-shot check: right after `kubectl apply`,
      # status.printableStatus may not be populated yet (a lag, not a real
      # problem). A Running status is never lag, though, and must fail immediately.
      shell: bash
      run: |
        set -euo pipefail
        deadline=$(( $(date +%s) + 120 ))
        while true; do
          status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
          echo "$(date -Is) VM printableStatus: ${status:-<none>}"
          [ "${status}" = "Stopped" ] && break
          if [ "${status}" = "Running" ]; then
            echo "::error::VM ${TARGET_VM_NAME} printableStatus = Running, want Stopped - it must be off until kezio's controller powers it on through the BMC." >&2
            exit 1
          fi
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::VM ${TARGET_VM_NAME} printableStatus = ${status:-<none>}, want Stopped - it must be off until kezio's controller powers it on through the BMC." >&2
            exit 1
          fi
          sleep 5
        done
        if kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system >/dev/null 2>&1; then
          echo "::error::A VirtualMachineInstance already exists for ${TARGET_VM_NAME}; the VM must not be running yet." >&2
          exit 1
        fi

    - name: Create the KubeVirtBMC VirtualMachineBMC for the target VM
      # Gives the VM a Redfish endpoint: KubeVirtBMC's controller creates a
      # "virtbmc" agent Pod (translating Redfish calls into VirtualMachine
      # Start/Stop/Restart and boot order patches) and a ClusterIP Service
      # in front of it, on plain HTTP port 80 (hence "redfish+http" in
      # BMC_REDFISH_ADDRESS). No IPMI simulator: this job only exercises
      # the Redfish side, matching kezio's redfish:// driver.
      shell: bash
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: bmc.kubevirt.io/v1beta1
        kind: VirtualMachineBMC
        metadata:
          name: ${TARGET_VM_NAME}
          namespace: kezio-system
        spec:
          virtualMachineRef:
            name: ${TARGET_VM_NAME}
          authSecretRef:
            name: ${BMC_CREDS_SECRET}
        EOF

    - name: Wait for the VirtualMachineBMC to become Ready
      shell: bash
      run: |
        set -euo pipefail
        deadline=$(( $(date +%s) + 180 ))
        while true; do
          ready="$(kubectl get virtualmachinebmc "${TARGET_VM_NAME}" -n kezio-system \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' || true)"
          clusterip="$(kubectl get virtualmachinebmc "${TARGET_VM_NAME}" -n kezio-system \
            -o jsonpath='{.status.clusterIP}' || true)"
          echo "$(date -Is) VirtualMachineBMC Ready=${ready:-<none>} clusterIP=${clusterip:-<none>}"
          [ "${ready}" = "True" ] && [ -n "${clusterip}" ] && break
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::VirtualMachineBMC ${TARGET_VM_NAME} did not become Ready within the timeout." >&2
            kubectl get virtualmachinebmc "${TARGET_VM_NAME}" -n kezio-system -o yaml
            exit 1
          fi
          sleep 5
        done
        kubectl get virtualmachinebmc "${TARGET_VM_NAME}" -n kezio-system -o yaml
        kubectl -n kezio-system rollout status deployment 2>/dev/null || true
        kubectl -n kezio-system get pods -l app=virtbmc 2>/dev/null || true

    - name: Wait for the virtbmc pod to become Ready
      # The VirtualMachineBMC Ready condition above only means the Service
      # got a ClusterIP - it says nothing about the virtbmc pod's own
      # readinessProbe, so a curl on that signal alone can hit a Service
      # with zero ready endpoints (plain connection refused).
      shell: bash
      run: |
        set -euo pipefail
        kubectl -n kezio-system wait --for=condition=Ready pod \
          -l "kubevirt.io/virtualmachinebmc-name=${TARGET_VM_NAME}" --timeout=180s

    - name: "Verify the Redfish endpoint is reachable and reports the VM off"
      # Exercised from inside the cluster with a throwaway Pod (Service is
      # ClusterIP-only) - the same call the controller's Register step is
      # about to make, done here first so a broken endpoint fails with a
      # clear diagnostic rather than a Machine stuck in Error. Retried a
      # few times to absorb a first-connection blip on an endpoint that
      # only just turned ready.
      shell: bash
      run: |
        set -euo pipefail
        BMC_USERNAME="$(kubectl get secret "${BMC_CREDS_SECRET}" -n kezio-system -o jsonpath='{.data.username}' | base64 -d)"
        BMC_PASSWORD="$(kubectl get secret "${BMC_CREDS_SECRET}" -n kezio-system -o jsonpath='{.data.password}' | base64 -d)"
        echo "::add-mask::${BMC_PASSWORD}"

        # --overrides carries the whole container spec since kubectl run
        # has no flag to merge a securityContext into the generated pod.
        # Explicit numeric runAsUser/runAsGroup because this image's own
        # USER is the non-numeric "curl_user", which restricted PSA can't
        # resolve to verify runAsNonRoot.
        redfish_overrides="$(jq -n \
          --arg name "kezio-e2e-redfish-check" \
          --arg image "curlimages/curl:8.21.0" \
          --arg auth "${BMC_USERNAME}:${BMC_PASSWORD}" \
          --arg url "http://${TARGET_VM_NAME}-virtbmc.kezio-system.svc.cluster.local/redfish/v1/Systems/1" \
          '{
            apiVersion: "v1",
            kind: "Pod",
            spec: {
              securityContext: {
                runAsNonRoot: true,
                seccompProfile: {type: "RuntimeDefault"}
              },
              containers: [{
                name: $name,
                image: $image,
                stdin: true,
                command: ["curl", "-sf", "-u", $auth, $url],
                securityContext: {
                  allowPrivilegeEscalation: false,
                  runAsNonRoot: true,
                  runAsUser: 100,
                  runAsGroup: 101,
                  capabilities: {drop: ["ALL"]},
                  seccompProfile: {type: "RuntimeDefault"}
                }
              }]
            }
          }')"

        redfish_body=""
        last_err=""
        last_phase=""
        for attempt in $(seq 1 5); do
          # Fresh pod name per attempt avoids racing a leftover pod from a
          # failed attempt. Output is read via `kubectl logs` after waiting
          # for pod phase, not from an attached stream: `kubectl run -i
          # --rm --quiet` can exit 0 with empty stdout if curl finishes
          # before the attach stream is established.
          pod_name="kezio-e2e-redfish-check-${attempt}"
          phase=""
          body=""
          if kubectl run "${pod_name}" -n kezio-system \
            --attach=false --restart=Never --image=curlimages/curl:8.21.0 --quiet \
            --overrides="${redfish_overrides}" 2>&1; then
            if kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
              "pod/${pod_name}" -n kezio-system --timeout=60s >/dev/null 2>&1; then
              phase="Succeeded"
            else
              phase="$(kubectl get "pod/${pod_name}" -n kezio-system -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            fi
            body="$(kubectl logs "pod/${pod_name}" -n kezio-system 2>&1 || true)"
            kubectl delete "pod/${pod_name}" -n kezio-system --ignore-not-found >/dev/null 2>&1
          else
            phase="PodCreateFailed"
          fi
          last_phase="${phase}"
          if [ "${phase}" = "Succeeded" ] && [ -n "${body}" ]; then
            redfish_body="${body}"
            last_err=""
            break
          fi
          last_err="${body}"
          redfish_body=""
          echo "attempt ${attempt}/5: curl against the Redfish endpoint failed (pod phase: ${phase}), retrying in 5s: ${last_err}"
          sleep 5
        done
        if [ -z "${redfish_body}" ]; then
          echo "::error::Redfish endpoint still unreachable after 5 attempts (last pod phase: ${last_phase}): ${last_err}" >&2
          exit 1
        fi
        echo "Redfish ComputerSystem response: ${redfish_body}"

        power_state="$(jq -r '.PowerState' <<<"${redfish_body}")"
        if [ "${power_state}" != "Off" ]; then
          echo "::error::Redfish reports PowerState=${power_state}, want Off before Register runs." >&2
          exit 1
        fi

    - name: Create the Machine CR, with spec.bmc pointing at KubeVirtBMC's Redfish endpoint
      # No manual power-on, no manual boot-order flip: the controller's
      # Register step (internal/deployer/agent.go) must call
      # SetOneTimePXEBoot and PowerOn against BMC_REDFISH_ADDRESS itself.
      shell: bash
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: kezio.kojuro.date/v1alpha1
        kind: Machine
        metadata:
          name: ${TARGET_VM_NAME}
          namespace: kezio-system
        spec:
          bmc:
            address: ${BMC_REDFISH_ADDRESS}
            credentialsSecretRef:
              name: ${BMC_CREDS_SECRET}
          bootMACAddress: "${TARGET_VM_MAC}"
          subnetRef:
            name: e2e-bmc
          online: true
          targetDisk:
            serialNumber: "${TARGET_VM_DISK_SERIAL}"
          imageRef:
            name: ${IMAGE_NAME}
        EOF

    - name: "Assert kezio powered the VM on through the BMC (not the harness)"
      # The only thing that has touched this VM since it was created
      # `running: false` is the Machine CR just created above. If the VM
      # comes up, it came up because agentDeployer.Register called the
      # BMC.
      shell: bash
      run: |
        set -euo pipefail
        deadline=$(( $(date +%s) + 180 ))
        while true; do
          status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
          echo "$(date -Is) VM printableStatus: ${status:-<none>}"
          case "${status}" in
            Running) break ;;
          esac
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::VM ${TARGET_VM_NAME} never reached Running after the Machine was created - kezio's Register did not power it on through the BMC." >&2
            kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
            exit 1
          fi
          sleep 5
        done
        kubectl wait vmi/"${TARGET_VM_NAME}" -n kezio-system --for=condition=Ready --timeout=180s
