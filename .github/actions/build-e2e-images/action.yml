name: Build the e2e lane's component images

description: >-
  Builds every image e2e-kubevirt-reusable.yml's "deploy-kubevirt" job
  needs from source and loads each one locally (never pushes): the
  ingest/seeder/image-service trio through `docker buildx build` with
  GitHub Actions layer caching (shared with publish.yml's scope names),
  the manager and bootd images through their own `make docker-build*`
  targets, kezioctl, and the kezio-boot-artifacts image, packaged either
  from a freshly built live boot image (build-boot-artifacts) or from a
  same-run artifact download the calling job already staged at dist/live/
  (boot-artifacts-downloaded) - see those two inputs below for the
  precedence. RKE2 is installed in a later, separate step (it owns the
  containerd these images get imported into), so importing them happens
  later too, in its own step - not here.

  Every image tag and build input (INGEST_IMG, SEEDER_IMG,
  IMAGE_SERVICE_IMG, EZIO_REF, MANAGER_IMG, BOOTD_IMG, BOOT_ARTIFACTS_IMG)
  comes from the calling job's own env, not declared inputs - composite
  action steps run as part of the calling job, so that env is already in
  scope.

inputs:
  build-boot-artifacts:
    description: >-
      Mirrors the reusable workflow's own build_boot_artifacts input:
      when true, also builds the live boot image (hack/live-image/build.sh)
      from this checkout before packaging it into the kezio-boot-artifacts
      image. Ignored when boot-artifacts-downloaded is true - dist/live/
      is already populated in that case.
    required: true
  boot-artifacts-downloaded:
    description: >-
      Mirrors the reusable workflow's own boot_artifacts_artifact input
      (as a boolean): true when the calling job already downloaded a
      same-run artifact into dist/live/, so this action packages that
      into the kezio-boot-artifacts image without running
      hack/live-image/build.sh itself.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Warm the ingest/seeder/image-service image caches
      # Cache scope names (ingest/seeder/image-service) must match publish.yml's
      # so this job shares its warm GHA layer cache instead of rebuilding
      # debian:sid seeder from scratch. EZIO_REF build-arg name must match
      # docker/seeder/Dockerfile's EZIO_REF ARG for ezio_ref to take effect.
      shell: bash
      run: |
        set -euo pipefail
        for spec in "ingest:docker/ingest/Dockerfile:${INGEST_IMG}" "seeder:docker/seeder/Dockerfile:${SEEDER_IMG}" "image-service:docker/image-service/Dockerfile:${IMAGE_SERVICE_IMG}"; do
          IFS=: read -r scope dockerfile tag <<< "${spec}"
          build_args=()
          if [ "${scope}" = "seeder" ]; then
            build_args+=(--build-arg "EZIO_REF=${EZIO_REF}")
          fi
          docker buildx build \
            --file "${dockerfile}" \
            --tag "${tag}" \
            --cache-from "type=gha,scope=${scope}" \
            --cache-to "type=gha,mode=max,scope=${scope}" \
            "${build_args[@]}" \
            --load \
            .
        done

    - name: Build the manager image
      # Import into containerd happens later, in its own step, once RKE2
      # (which owns that containerd) is installed.
      shell: bash
      run: |
        set -euo pipefail
        go mod tidy
        make docker-build IMG="${MANAGER_IMG}"

    - name: Build the bootd image
      shell: bash
      run: |
        set -euo pipefail
        make docker-build-bootd BOOTD_IMG="${BOOTD_IMG}"

    - name: Build kezioctl
      shell: bash
      run: |
        set -euo pipefail
        make build-kezioctl

    - name: Build the live boot image
      # AGENT_COMMIT is written into manifest.json and must match what the
      # "Assert the boot artifacts agent commit" step later reads back.
      # Skipped when boot-artifacts-downloaded is true: the calling job
      # already staged dist/live/ from a same-run artifact download, with
      # its own manifest.json already carrying the upstream build's
      # AGENT_COMMIT (that job's checkout is the same commit, so the two
      # agree without this step re-running the build).
      if: ${{ inputs.build-boot-artifacts == 'true' && inputs.boot-artifacts-downloaded != 'true' }}
      shell: bash
      env:
        AGENT_COMMIT: ${{ github.sha }}
      run: hack/live-image/build.sh

    - name: Build the kezio-boot-artifacts image
      # Packages whatever is already at dist/live/ - either just built by
      # the step above, or downloaded by the calling job's own "Download
      # the boot-artifacts hand-off" step.
      if: ${{ inputs.build-boot-artifacts == 'true' || inputs.boot-artifacts-downloaded == 'true' }}
      shell: bash
      run: make docker-build-boot-artifacts BOOT_ARTIFACTS_IMG="${BOOT_ARTIFACTS_IMG}"
