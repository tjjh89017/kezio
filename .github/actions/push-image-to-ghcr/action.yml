name: Push image to a container registry

description: >-
  Logs in to a container registry, derives tags/labels from a
  docker/metadata-action tag spec, and runs a multi-platform build-push.
  Shared by main.yaml (pushes the ":main" branch tag, gated on the caller's
  own main-push `if:`) and release.yaml (pushes two semver tags,
  unconditionally) - only the tag spec and that `if:` differ between them,
  so both stay on the calling workflow rather than moving in here.

inputs:
  registry:
    description: 'Registry to log in to, e.g. "ghcr.io".'
    required: true
  image:
    description: 'Full image repository name to push, e.g. "ghcr.io/tjjh89017/kezio".'
    required: true
  tags-spec:
    description: >-
      docker/metadata-action "tags" input: one tag rule per line (e.g.
      "type=ref,event=branch", or a pair of "type=semver,..." rules).
    required: true
  dockerfile:
    description: 'Path to the Dockerfile to build.'
    required: true
  platforms:
    description: 'Comma-separated target platforms, e.g. "linux/amd64,linux/arm64".'
    required: true
  cache-scope:
    description: 'GHA cache scope shared with the local-tag build step for this image.'
    required: true
  github-token:
    description: >-
      Registry login token. Composite actions cannot read the secrets
      context directly - callers must pass secrets.GITHUB_TOKEN through
      this input.
    required: true

outputs:
  labels:
    description: 'OCI labels derived by docker/metadata-action, for callers that need them.'
    value: ${{ steps.meta.outputs.labels }}

runs:
  using: composite
  steps:
    - name: Log in to the registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Derive image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.image }}
        tags: ${{ inputs.tags-spec }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
