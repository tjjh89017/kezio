name: Install KubeVirtBMC

description: >-
  Applies the upstream KubeVirtBMC install manifest at a pinned version and
  waits for its controller-manager Deployment to become Available.

inputs:
  version:
    description: 'KubeVirtBMC release to install, e.g. "v0.9.0".'
    required: false
    default: "v0.9.0"

runs:
  using: composite
  steps:
    - name: Install KubeVirtBMC
      shell: bash
      env:
        KUBEVIRTBMC_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        kubectl apply -f "https://github.com/kubevirtbmc/kubevirtbmc/releases/download/${KUBEVIRTBMC_VERSION}/kubevirtbmc-install.yaml"
        kubectl -n kubevirtbmc-system wait deployment/kubevirtbmc-controller-manager --for=condition=Available --timeout=300s
