name: Install RKE2

description: >-
  Writes the RKE2 config, installs and starts rke2-server at a pinned
  version, symlinks kubectl/ctr/crictl onto PATH, and waits for the node to
  report Ready. Shared by every RKE2-based lane in main.yaml - none of them
  differs in the install/wait mechanics, only in whether Multus is needed,
  which enable-multus selects. Every caller still writes its own KUBECONFIG
  env var export afterwards through $GITHUB_ENV, exactly as this action's
  own "Install RKE2" step does, so a later step in the SAME job can already
  see it - composite action steps share the calling job's environment file,
  not a private one.

inputs:
  rke2-version:
    description: 'RKE2 release to install, e.g. "v1.36.2+rke2r1" (passed straight to the get.rke2.io installer''s INSTALL_RKE2_VERSION).'
    required: true
  enable-multus:
    description: >-
      "true" deploys the multus+canal CNI stack (needed by lanes that
      attach NetworkAttachmentDefinitions); "false" deploys plain canal.
      Defaults to "true" so e2e-bmc, the only caller before this input
      existed, keeps its Multus setup unchanged.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Write the RKE2 config (must exist before the service starts)
      # cni: [multus, canal] must list multus first when Multus is enabled;
      # canal is the actual pod network either way. RKE2 deploys each
      # listed entry as a HelmChart addon at startup.
      shell: bash
      env:
        ENABLE_MULTUS: ${{ inputs.enable-multus }}
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/rancher/rke2
        if [ "${ENABLE_MULTUS}" = "true" ]; then
          cni_config=$'cni:\n  - multus\n  - canal'
        else
          cni_config='cni: canal'
        fi
        {
          echo 'write-kubeconfig-mode: "0644"'
          echo "${cni_config}"
        } | sudo tee /etc/rancher/rke2/config.yaml

    - name: Install RKE2
      shell: bash
      env:
        RKE2_VERSION: ${{ inputs.rke2-version }}
      run: |
        set -euo pipefail

        # Retried because the installer downloads its own tarball from the
        # GitHub release, and a connection reset there fails this step
        # about a minute into a lane that runs for twenty. The installer
        # only unpacks into /usr/local and rewrites the same files, so a
        # second attempt over a partial first one is safe. Only the
        # download is retried - systemctl comes after, so a unit that
        # fails to start is still reported on the first try.
        for attempt in 1 2 3; do
          if curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${RKE2_VERSION}" sh -; then
            break
          fi
          if [ "${attempt}" -eq 3 ]; then
            echo "::error::the RKE2 installer failed ${attempt} times; the last attempt's output is above" >&2
            exit 1
          fi
          echo "RKE2 installer attempt ${attempt} failed; retrying in $((attempt * 10))s" >&2
          sleep "$((attempt * 10))"
        done

        sudo systemctl enable --now rke2-server.service

        # kubectl/ctr/crictl ship under /var/lib/rancher/rke2/bin, not on
        # PATH by default - symlink into /usr/local/bin (inside sudo's secure_path).
        sudo ln -sf /var/lib/rancher/rke2/bin/kubectl /usr/local/bin/kubectl
        sudo ln -sf /var/lib/rancher/rke2/bin/ctr /usr/local/bin/ctr
        sudo ln -sf /var/lib/rancher/rke2/bin/crictl /usr/local/bin/crictl

        echo "KUBECONFIG=/etc/rancher/rke2/rke2.yaml" >> "$GITHUB_ENV"
        export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
        # RKE2's control plane (etcd + canal + multus HelmChart addons) takes
        # longer to reach node-Ready than a bare flannel CNI would.
        for _ in $(seq 1 90); do
          [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ] && break
          sleep 2
        done
        kubectl wait --for=condition=Ready node --all --timeout=300s
        kubectl get nodes -o wide
