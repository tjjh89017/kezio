name: Install RKE2 with Multus enabled

description: >-
  Writes the RKE2 config that turns on the multus+canal CNI stack, installs
  and starts rke2-server at a pinned version, symlinks kubectl/ctr/crictl
  onto PATH, and waits for the node to report Ready. Identical across
  e2e-kubevirt-reusable.yml, e2e-boot-path-kubevirt.yml, and
  e2e-scale-multisite-kubevirt.yml - none of these three lanes' RKE2 setup
  differs in any way, so it lives here once instead of three times. Every
  caller still writes its own KUBECONFIG env var export afterwards through
  $GITHUB_ENV, exactly as this action's own "Install RKE2" step does, so a
  later step in the SAME job can already see it - composite action steps
  share the calling job's environment file, not a private one.

inputs:
  rke2-version:
    description: 'RKE2 release to install, e.g. "v1.36.2+rke2r1" (passed straight to the get.rke2.io installer''s INSTALL_RKE2_VERSION).'
    required: true

runs:
  using: composite
  steps:
    - name: Write the RKE2 config (must exist before the service starts)
      # cni: [multus, canal] must list multus first; canal is the actual
      # pod network. RKE2 deploys both as HelmChart addons at startup.
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/rancher/rke2
        cat <<'EOF' | sudo tee /etc/rancher/rke2/config.yaml
        write-kubeconfig-mode: "0644"
        cni:
          - multus
          - canal
        EOF

    - name: Install RKE2
      shell: bash
      env:
        RKE2_VERSION: ${{ inputs.rke2-version }}
      run: |
        set -euo pipefail
        curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${RKE2_VERSION}" sh -
        sudo systemctl enable --now rke2-server.service

        # kubectl/ctr/crictl ship under /var/lib/rancher/rke2/bin, not on
        # PATH by default - symlink into /usr/local/bin (inside sudo's secure_path).
        sudo ln -sf /var/lib/rancher/rke2/bin/kubectl /usr/local/bin/kubectl
        sudo ln -sf /var/lib/rancher/rke2/bin/ctr /usr/local/bin/ctr
        sudo ln -sf /var/lib/rancher/rke2/bin/crictl /usr/local/bin/crictl

        echo "KUBECONFIG=/etc/rancher/rke2/rke2.yaml" >> "$GITHUB_ENV"
        export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
        # RKE2's control plane (etcd + canal + multus HelmChart addons) takes
        # longer to reach node-Ready than a bare flannel CNI would.
        for _ in $(seq 1 90); do
          [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ] && break
          sleep 2
        done
        kubectl wait --for=condition=Ready node --all --timeout=300s
        kubectl get nodes -o wide
