name: Verify the per-Image seeder Deployment is single-homed on the provisioning bridge
description: >-
  Waits for the per-Image seeder Deployment labelled
  kezio.kojuro.date/seeder-image=<image-name> to appear, waits for its
  rollout, then confirms its pod carries a kezio-seeder-network Multus
  attachment and that the attachment landed on the expected provisioning
  address - the seeder must be reachable from the segment the target VM's
  BitTorrent leech runs on, not merely Ready. Exports
  SEEDER_DEPLOYMENT_NAME and SEEDER_DEPLOYMENT_POD to GITHUB_ENV for later
  steps in the same job (for example the teardown check), in addition to
  its declared outputs.

inputs:
  image-name:
    description: Value of the kezio.kojuro.date/seeder-image label the per-Image seeder Deployment and its pod carry.
    required: true
  seeder-ip:
    description: >-
      The seeder's expected net1 address, with or without a CIDR suffix
      (the suffix, if any, is stripped before comparing against the pod's
      PodIP).
    required: true
  namespace:
    description: Namespace the seeder Deployment lives in.
    required: false
    default: kezio-system

outputs:
  deployment-name:
    description: Name of the per-Image seeder Deployment that was found and verified.
    value: ${{ steps.verify.outputs.deployment-name }}
  pod-name:
    description: Name of the non-terminating pod backing the seeder Deployment.
    value: ${{ steps.verify.outputs.pod-name }}

runs:
  using: composite
  steps:
    - name: Verify the per-Image seeder Deployment is single-homed on the provisioning bridge
      id: verify
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        SEEDER_IP: ${{ inputs.seeder-ip }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        deadline=$(( $(date +%s) + 300 ))
        seeder_dep=""
        while true; do
          seeder_dep="$(kubectl -n "${NAMESPACE}" get deployments \
            -l "kezio.kojuro.date/seeder-image=${IMAGE_NAME}" \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -n "${seeder_dep}" ]; then
            break
          fi
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::no per-Image seeder Deployment labelled kezio.kojuro.date/seeder-image=${IMAGE_NAME} appeared" >&2
            kubectl -n "${NAMESPACE}" get machine "${TARGET_VM_NAME}" -o yaml || true
            exit 1
          fi
          sleep 5
        done
        echo "per-Image seeder Deployment: ${seeder_dep}"
        echo "SEEDER_DEPLOYMENT_NAME=${seeder_dep}" >> "$GITHUB_ENV"
        echo "deployment-name=${seeder_dep}" >> "$GITHUB_OUTPUT"

        kubectl rollout status deployment/"${seeder_dep}" -n "${NAMESPACE}" --timeout=180s

        pod_name="$(kubectl -n "${NAMESPACE}" get pods -l "kezio.kojuro.date/seeder-image=${IMAGE_NAME}" -o json \
          | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
        if [ -z "${pod_name}" ] || [ "${pod_name}" = "null" ]; then
          echo "::error::no non-terminating pod found for per-Image seeder Deployment ${seeder_dep}" >&2
          exit 1
        fi
        network_status="$(kubectl -n "${NAMESPACE}" get pod "${pod_name}" \
          -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}')"
        if ! grep -q "kezio-seeder-network" <<<"${network_status}"; then
          echo "::error::per-Image seeder pod ${pod_name} has no kezio-seeder-network attachment in its network-status; got: ${network_status}" >&2
          exit 1
        fi

        pod_ip="$(kubectl -n "${NAMESPACE}" get pod "${pod_name}" -o jsonpath='{.status.podIP}')"
        if [[ "${pod_ip}" != "${SEEDER_IP%%/*}" ]]; then
          echo "::error::per-Image seeder pod ${pod_name} PodIP is ${pod_ip}, want ${SEEDER_IP%%/*}" >&2
          kubectl -n "${NAMESPACE}" get pod "${pod_name}" -o yaml || true
          exit 1
        fi
        echo "SEEDER_DEPLOYMENT_POD=${pod_name}" >> "$GITHUB_ENV"
        echo "pod-name=${pod_name}" >> "$GITHUB_OUTPUT"
