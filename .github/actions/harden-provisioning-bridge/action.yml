name: Harden the provisioning bridge for real PXE/DHCP traffic

description: >-
  Two host-level fixups e2e-kubevirt-reusable.yml's "deploy-kubevirt" job
  needs after RKE2/canal is up and before any Multus pod attaches to the
  provisioning bridge (${PROVISIONING_BRIDGE} from the calling job's own
  env): opening canal's FORWARD chain for the bridge's own port-to-port
  traffic (canal drops it by default) and filling the UDP checksums a
  KubeVirt VM's virtio-net leaves partial, which the bridge-to-Multus-veth
  hop never fills in and DHCP would otherwise silently drop. See each
  step's own doc comment for the full "why" - moved verbatim, not
  redesigned.

runs:
  using: composite
  steps:
    - name: Allow bridged traffic on the provisioning bridge (bypass canal's FORWARD filtering)
      # canal's br_netfilter routes every bridged L2 frame - including
      # this bridge's, though it carries no cluster pod traffic - through
      # the host's FORWARD chain, whose default policy is DROP once the
      # cluster is up (kubernetes/kubernetes#39823, #91545), silently
      # eating the VM's PXE DHCP DISCOVER broadcast. Add an ACCEPT scoped
      # to this bridge's own port-to-port traffic only, idempotently
      # (-C before -I) in case a later canal reconciliation touches the
      # chain again.
      shell: bash
      run: |
        set -euo pipefail
        if command -v iptables >/dev/null 2>&1; then
          sudo iptables -C FORWARD -i "${PROVISIONING_BRIDGE}" -o "${PROVISIONING_BRIDGE}" -j ACCEPT 2>/dev/null || \
            sudo iptables -I FORWARD -i "${PROVISIONING_BRIDGE}" -o "${PROVISIONING_BRIDGE}" -j ACCEPT
        fi
        # RKE2/canal may run nf_tables instead of legacy iptables; mirror
        # the same exemption there when the "inet filter" table exists.
        if command -v nft >/dev/null 2>&1 && sudo nft list table inet filter >/dev/null 2>&1; then
          sudo nft list chain inet filter FORWARD 2>/dev/null | grep -q "iifname \"${PROVISIONING_BRIDGE}\" oifname \"${PROVISIONING_BRIDGE}\" accept" || \
            sudo nft insert rule inet filter FORWARD iifname "${PROVISIONING_BRIDGE}" oifname "${PROVISIONING_BRIDGE}" accept
        fi

        # No bridge<->pod-network accepts, on purpose: every peer the VM
        # talks to (bootd's net1, the tracker/seeder pods' net1) is a port
        # on this same bridge, so the port-to-port ACCEPT above covers it
        # all and the VM needs no route into the cluster's pod network.

    - name: Fill UDP checksums for PXE DHCP crossing the provisioning bridge
      # The VM's virtio-net leaves UDP checksums to hardware
      # (CHECKSUM_PARTIAL); crossing tap -> bridge -> Multus veth -> bootd's
      # netns never performs that fill, so DHCP datagrams arrive with a
      # checksum the kernel considers invalid and drops silently. Same
      # failure libvirt's virtual networks hit, same fix: an iptables
      # mangle CHECKSUM --checksum-fill rule on this bridge for both DHCP
      # ports (67 server, 68 client - this bridge carries the DISCOVER
      # direction too, not only the reply). nft has no CHECKSUM target, so
      # when nft is the active backend, disabling tx checksum offload on
      # the bridge (`ethtool -K ... tx off`) is the cruder fallback.
      # Idempotent (-C before -A).
      shell: bash
      run: |
        set -euo pipefail
        if command -v iptables >/dev/null 2>&1; then
          for port in 67 68; do
            sudo iptables -t mangle -C POSTROUTING -o "${PROVISIONING_BRIDGE}" -p udp --dport "${port}" -j CHECKSUM --checksum-fill 2>/dev/null || \
              sudo iptables -t mangle -A POSTROUTING -o "${PROVISIONING_BRIDGE}" -p udp --dport "${port}" -j CHECKSUM --checksum-fill
          done
        else
          sudo ethtool -K "${PROVISIONING_BRIDGE}" tx off || true
        fi
