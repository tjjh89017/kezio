name: Ingest a test image through kezioctl

description: >-
  Builds a small GPT+ext4 fixture disk directly on the runner (sfdisk +
  loop device + mkfs.ext4, no privileged container needed - the same
  regular-file-based approach internal/ingest itself uses once the Job
  gets the uploaded bytes), then builds kezioctl and drives it through a
  port-forwarded image-service to upload the fixture and create its
  ImageImport. Finally polls the import and the Image it creates until
  the Image reaches Ready (or either reaches Failed, or the deadline),
  dumping the ImageImport, Image, PartitionContent, and ingest/publish
  Job/pod state on any failure.

  The runner sends bytes only: the import slices, classifies, and names
  the fixture's one partition in the cluster. Its content name is
  therefore known in advance from the content prefix alone
  ("<content-prefix>-p1"), with no partclone run on the runner. The one
  raw partition slice this action still cuts is a plain dd, and it
  serves only the byte-compare reference (partition-sha256) a downstream
  leecher checks its reconstructed copy against.

inputs:
  image-name:
    description: >-
      Name to give the ImageImport, the Image it creates, the content
      prefix its one partition is named under, and the image-service
      upload - all four take this one name.
    required: false
    default: "kezio-e2e-fixture"
  namespace:
    description: 'Namespace the image-service Service and the Image live in.'
    required: false
    default: "kezio-system"
  token:
    description: Bearer token kezioctl authenticates the upload with.
    required: true
  image-service-service-name:
    description: 'Name of the image-service Service to port-forward.'
    required: false
    default: "kezio-image-service"
  local-port:
    description: 'Local port the image-service Service is port-forwarded to.'
    required: false
    default: "18080"
  partition-size-mib:
    description: 'Size in MiB of the fixture disk''s one ext4 partition.'
    required: false
    default: "60"
  wait-timeout-seconds:
    description: 'How long to poll for the Image to reach Ready before failing.'
    required: false
    default: "300"

outputs:
  image-name:
    description: 'Name of the Image object created (this action''s own image-name input, echoed back for a downstream step that only has this action''s outputs to work from).'
    value: ${{ inputs.image-name }}
  content-prefix:
    description: 'Prefix the import names its content under. Same as image-name, echoed back for a downstream step that has to name the same prefix.'
    value: ${{ inputs.image-name }}
  content-name:
    description: 'The PartitionContent object name the import gives the fixture''s one partition ("<content-prefix>-p1"). Predictable from the prefix alone - the import chooses it, so nothing has to read it back.'
    value: ${{ inputs.image-name }}-p1
  partition-sha256:
    description: 'sha256 of the fixture disk''s raw partition slice, for a downstream byte-compare (e.g. run-leecher) against a BT-reconstructed copy.'
    value: ${{ steps.fixture.outputs.partition-sha256 }}
  partition-size-bytes:
    description: 'Size in bytes of the fixture disk''s one partition.'
    value: ${{ steps.fixture.outputs.partition-size-bytes }}
  disk-path:
    description: 'Runner-local path to the fixture disk image, for a downstream re-upload of the identical bytes (e.g. assert-image-plane-semantics'' name-conflict check) without rebuilding the fixture.'
    value: ${{ steps.fixture.outputs.disk-path }}

runs:
  using: composite
  steps:
    - name: Build kezioctl
      shell: bash
      run: go build -o bin/kezioctl ./cmd/kezioctl

    - name: Build a GPT+ext4 fixture disk and record its partition's reference digest
      id: fixture
      shell: bash
      env:
        PART_MIB: ${{ inputs.partition-size-mib }}
      run: |
        set -euo pipefail

        disk="${RUNNER_TEMP}/fixture.img"
        total_mib=$(( PART_MIB + 8 ))
        truncate -s "${total_mib}M" "${disk}"
        printf 'label: gpt\nsize=%sMiB, type=L\n' "${PART_MIB}" | sfdisk "${disk}"
        sfdisk --json "${disk}" >"${RUNNER_TEMP}/sfdisk.json"

        loop="$(sudo losetup -P --find --show "${disk}")"
        sudo mkfs.ext4 -F -q "${loop}p1"
        mnt="$(mktemp -d)"
        sudo mount "${loop}p1" "${mnt}"
        sudo dd if=/dev/urandom of="${mnt}/fixture-content.bin" bs=1M count=2 status=none
        sudo umount "${mnt}"
        rmdir "${mnt}"
        sudo losetup -d "${loop}"
        # The fixture disk file itself was never chowned to root - only
        # the loop device and its mount were - so it stays readable by
        # the runner user for the plain dd/kezioctl steps below.

        # Slice the one partition straight out of the fixture disk by
        # byte offset - a plain file copy, exactly what
        # internal/ingest.extractPartition does server-side - so the
        # digest below is taken over the identical bytes the ingest Job
        # will see. This slice is the byte-compare reference only:
        # nothing here classifies it or gives it a name.
        start_sectors="$(jq -r '.partitiontable.partitions[0].start' "${RUNNER_TEMP}/sfdisk.json")"
        size_sectors="$(jq -r '.partitiontable.partitions[0].size' "${RUNNER_TEMP}/sfdisk.json")"
        sector_size="$(jq -r '.partitiontable.sectorsize // 512' "${RUNNER_TEMP}/sfdisk.json")"
        start_bytes=$(( start_sectors * sector_size ))
        size_bytes=$(( size_sectors * sector_size ))

        slice="${RUNNER_TEMP}/fixture-part1.raw"
        dd if="${disk}" of="${slice}" bs=1M iflag=skip_bytes,count_bytes \
          skip="${start_bytes}" count="${size_bytes}" status=none

        echo "disk-path=${disk}" >>"${GITHUB_OUTPUT}"

        # For run-leecher's byte-compare: the exact reference the
        # leecher's reconstructed-from-BT-extents partition must match.
        partition_sha256="$(sha256sum "${slice}" | cut -d' ' -f1)"
        echo "partition-sha256=${partition_sha256}" >>"${GITHUB_OUTPUT}"
        echo "partition-size-bytes=${size_bytes}" >>"${GITHUB_OUTPUT}"

    # One name for all four objects: the ImageImport, the Image it
    # creates, the content prefix ("<name>-p1" for this one-partition
    # fixture), and the image-service upload. kezioctl defaults
    # --image-name and --content-prefix to --name, so only --name is
    # given below.
    - name: Upload the fixture, request the import, and wait for its Image to reach Ready
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        NAMESPACE: ${{ inputs.namespace }}
        TOKEN: ${{ inputs.token }}
        SERVICE_NAME: ${{ inputs.image-service-service-name }}
        LOCAL_PORT: ${{ inputs.local-port }}
        WAIT_TIMEOUT_SECONDS: ${{ inputs.wait-timeout-seconds }}
        DISK_PATH: ${{ steps.fixture.outputs.disk-path }}
      run: |
        set -euo pipefail

        dump_diagnostics() {
          echo "::group::ImageImport ${IMAGE_NAME}"
          kubectl get imageimports.kezio.kojuro.date "${IMAGE_NAME}" -n "${NAMESPACE}" -o yaml || true
          echo "::endgroup::"
          echo "::group::Image ${IMAGE_NAME}"
          kubectl get images.kezio.kojuro.date "${IMAGE_NAME}" -n "${NAMESPACE}" -o yaml || true
          echo "::endgroup::"
          echo "::group::PartitionContents"
          kubectl get partitioncontents.kezio.kojuro.date -n "${NAMESPACE}" -o yaml || true
          echo "::endgroup::"
          echo "::group::PersistentVolumeClaims"
          kubectl get pvc -n "${NAMESPACE}" -o wide || true
          echo "::endgroup::"
          echo "::group::ingest/publish Jobs"
          kubectl get jobs -n "${NAMESPACE}" -l "app.kubernetes.io/name=kezio" -o wide || true
          kubectl describe jobs -n "${NAMESPACE}" -l "app.kubernetes.io/component=image-ingest-job" || true
          kubectl describe jobs -n "${NAMESPACE}" -l "app.kubernetes.io/component=partition-content-publish" || true
          echo "::endgroup::"
          echo "::group::ingest/publish pods"
          kubectl get pods -n "${NAMESPACE}" -l "app.kubernetes.io/name=kezio" -o wide || true
          kubectl describe pods -n "${NAMESPACE}" -l "app.kubernetes.io/component=image-ingest-job" || true
          kubectl describe pods -n "${NAMESPACE}" -l "app.kubernetes.io/component=partition-content-publish" || true
          echo "::endgroup::"
          echo "::group::ingest/publish pod logs"
          kubectl logs -n "${NAMESPACE}" -l "app.kubernetes.io/component=image-ingest-job" --all-containers --tail=1000 || true
          kubectl logs -n "${NAMESPACE}" -l "app.kubernetes.io/component=partition-content-publish" --all-containers --tail=1000 || true
          echo "::endgroup::"
        }

        kubectl -n "${NAMESPACE}" port-forward "svc/${SERVICE_NAME}" "${LOCAL_PORT}:8080" &
        pf_pid=$!
        trap 'kill "${pf_pid}" 2>/dev/null || true' EXIT

        for _ in $(seq 1 30); do
          curl -sf -o /dev/null "http://127.0.0.1:${LOCAL_PORT}/healthz" && break
          sleep 1
        done

        trap 'dump_diagnostics; kill "${pf_pid}" 2>/dev/null || true' ERR
        bin/kezioctl image upload "${DISK_PATH}" \
          --name "${IMAGE_NAME}" \
          --namespace "${NAMESPACE}" \
          --server "http://127.0.0.1:${LOCAL_PORT}" \
          --token "${TOKEN}"

        # The import is polled beside the Image: a failed import (a bad
        # source, or a name it refuses to write over) never creates the
        # Image at all, so watching the Image alone would only ever
        # report the timeout.
        deadline=$(( $(date +%s) + WAIT_TIMEOUT_SECONDS ))
        while true; do
          import_state="$(kubectl get imageimports.kezio.kojuro.date "${IMAGE_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.state}' 2>/dev/null || true)"
          state="$(kubectl get images.kezio.kojuro.date "${IMAGE_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.state}' 2>/dev/null || true)"
          echo "imageimport ${IMAGE_NAME} state=${import_state:-<none>}, image ${IMAGE_NAME} state=${state:-<none>}"
          if [ "${state}" = "Ready" ]; then
            break
          fi
          if [ "${import_state}" = "Failed" ]; then
            echo "::error::ImageImport ${IMAGE_NAME} reached Failed" >&2
            dump_diagnostics
            exit 1
          fi
          if [ "${state}" = "Failed" ]; then
            echo "::error::Image ${IMAGE_NAME} reached Failed" >&2
            dump_diagnostics
            exit 1
          fi
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::Image ${IMAGE_NAME} did not reach Ready within ${WAIT_TIMEOUT_SECONDS}s" >&2
            dump_diagnostics
            exit 1
          fi
          sleep 3
        done
        trap 'kill "${pf_pid}" 2>/dev/null || true' EXIT

        echo "Image ${IMAGE_NAME} reached Ready"
