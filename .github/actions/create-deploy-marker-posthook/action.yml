name: Create the full-deploy marker PostHook

description: >-
  Creates a PostHook whose one chrootScript step writes a marker file
  into the deployed guest's root file system - proof, readable back
  through the guest agent after boot, that a specific deploy actually
  ran. chrootScript is the only step kind that lands inside the deployed
  disk's own filesystem (script runs in the live agent environment with
  the target disk unmounted; a builtin has no way to write arbitrary
  content); using it here is what makes the marker describe the disk a
  later boot reads from, not the live environment the hook happened to
  run in.

  The marker is never baked into the source image: content baked into
  the image would already be present after any boot of that disk, deploy
  or not, and could not distinguish "this deploy ran" from "an earlier
  deploy of the same image ran, and the guest simply rebooted". Instead
  the script computes a fresh value - the deploying Machine's name (the
  machineName reserved template value every deploy plan carries) plus
  the wall-clock time in nanoseconds at the moment this step actually
  executes - and overwrites the marker with it on every run, so its
  content can be compared against a timestamp the caller captured before
  the deploy started.

  Marker contract (for a later verify-deploy-shaped action reading it
  back through the guest agent, e.g. `virtctl guestosinfo`'s exec path):
  path /var/lib/kezio/e2e-deploy-marker, two lines,
  "machine=<Machine name>\ndeployedAt=<unix nanoseconds>\n". A caller
  should assert both that the machine= line matches the Machine it
  deployed and that deployedAt is later than a timestamp recorded before
  the deploy began - the second check is what rules out a stale marker
  surviving from an earlier deploy of the same disk.

  This PostHook only writes the marker; it does not run kezio-default-
  finalize's mkswap/efibootmgr builtins (the shipped default hook,
  internal/posthookdefaults). A Machine driving the full-deploy e2e lane
  must list both hook names in spec.postHookRefs, in either order: naming
  postHookRefs explicitly at all - which the marker hook requires -
  already opts the Machine out of the default hook's automatic
  substitution (see internal/planbuild's resolveMachineHooks doc
  comment), so it has to be named alongside this one to still create the
  disk's UEFI boot entry.

inputs:
  name:
    description: 'Name of the PostHook CR.'
    required: false
    default: "kezio-e2e-deploy-marker"
  namespace:
    description: 'Namespace the PostHook is created in.'
    required: false
    default: "scaffold-system"

outputs:
  name:
    description: 'Name of the PostHook object created (this action''s own name input, echoed back for a downstream step that only has this action''s outputs to work from).'
    value: ${{ inputs.name }}

runs:
  using: composite
  steps:
    - name: Create the marker PostHook
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        cat <<EOF | kubectl apply -f -
        apiVersion: kezio.kojuro.date/v1alpha2
        kind: PostHook
        metadata:
          name: ${NAME}
          namespace: ${NAMESPACE}
        spec:
          steps:
            - osFamily: Linux
              chrootScript:
                script: |
                  #!/bin/sh
                  set -eu
                  mkdir -p /var/lib/kezio
                  printf 'machine=%s\ndeployedAt=%s\n' "{{ .machineName }}" "\$(date -u +%s%N)" >/var/lib/kezio/e2e-deploy-marker
        EOF
