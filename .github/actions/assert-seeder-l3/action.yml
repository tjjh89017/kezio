name: Assert a seeder is reachable only across a real routed L3 hop

description: >-
  The routed lane's core assertion, and the only claim this action adds
  of its own: the torrent URL the plan handed the agent
  (planbuild.resolveTorrentURL's own output, passed in as torrent-url)
  names a host OUTSIDE the machine's own subnet (machine-cidr). That is
  the check that fails on a design where the seeder is reachable only
  because it happens to share a broadcast domain with the machine, and it
  proves internal/planbuild's per-Site seeder placement delivers the
  capability a machine leeches from a seeder in its own routable Site
  rather than its own broadcast domain.

  The claim holds only where a Site spans more than one segment, so it
  travels with this action alone. Everything a seeder must satisfy at
  every Site - that it announces its own Site's tracker, and that its
  ports answer from the machine's own segment - lives in
  assert-seeder-announce, which this action runs afterwards with the same
  inputs. A lane that gives each Site a single segment calls that action
  directly: its machines reach their seeder without a routed hop by
  design, so asserting the opposite there would assert a property its
  topology does not have.

inputs:
  machine-cidr:
    description: The deploying machine's own subnet CIDR, e.g. "192.0.2.0/24".
    required: true
  torrent-url:
    description: The exact torrent URL the plan handed the agent (planbuild's resolveTorrentURL output).
    required: true
  expected-tracker-url:
    description: The Site's tracker announce URL (Site.status.trackerURL) expected inside the served .torrent.
    required: true
  bridge-name:
    description: The bridge for the machine's own segment, to probe from - as created by create-routed-segments.
    required: true
  probe-cidr:
    description: >-
      Address (with prefix) to assign to the helper netns on this
      segment, e.g. "192.0.2.250/24" - must be unused by anything else
      on that segment.
    required: true
  gateway-ip:
    description: >-
      Bare address (no prefix) of this segment's own host-cidr, the
      address create-routed-segments gave the runner on bridge-name -
      the helper netns' default route.
    required: true
  bt-port:
    description: Expected pinned BitTorrent port (seederdeploy.EzioBTPort).
    required: false
    default: "16881"
  timeout-seconds:
    description: Bounded connect timeout per probe, in whole seconds.
    required: false
    default: "5"
  netns-name:
    description: Name of the helper network namespace the probe creates and removes.
    required: false
    default: "kezio-seeder-l3-probe"

runs:
  using: composite
  steps:
    - name: Assert the torrent URL points outside the machine's own subnet
      shell: bash
      env:
        MACHINE_CIDR: ${{ inputs.machine-cidr }}
        TORRENT_URL: ${{ inputs.torrent-url }}
      run: |
        set -euo pipefail
        host="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urlsplit(sys.argv[1]).hostname)' "${TORRENT_URL}")"
        if [ -z "${host}" ]; then
          echo "::error::could not parse a host out of torrent-url '${TORRENT_URL}'" >&2
          exit 1
        fi

        inside="$(python3 -c 'import ipaddress, sys; print(ipaddress.ip_address(sys.argv[1]) in ipaddress.ip_network(sys.argv[2], strict=False))' "${host}" "${MACHINE_CIDR}")"
        if [ "${inside}" != "False" ]; then
          echo "::error::torrent URL host ${host} lies INSIDE the machine's own subnet ${MACHINE_CIDR} - the plan did not hand the agent a cross-segment address" >&2
          exit 1
        fi
        echo "confirmed: ${host} is outside ${MACHINE_CIDR}"

    - name: Assert the seeder announces this Site's tracker and answers across the segment boundary
      uses: ./.github/actions/assert-seeder-announce
      with:
        torrent-url: ${{ inputs.torrent-url }}
        expected-tracker-url: ${{ inputs.expected-tracker-url }}
        bridge-name: ${{ inputs.bridge-name }}
        probe-cidr: ${{ inputs.probe-cidr }}
        gateway-ip: ${{ inputs.gateway-ip }}
        bt-port: ${{ inputs.bt-port }}
        timeout-seconds: ${{ inputs.timeout-seconds }}
        netns-name: ${{ inputs.netns-name }}
