name: Dump all kezio v1alpha2 resources in a namespace

description: >-
  Best-effort YAML dump of every kezio.kojuro.date/v1alpha2 kind
  (machines, machinehardwares, subnets, sites, deployruns, images,
  partitioncontents) in one namespace - the YAML dump carries each
  Site's status.conditions along with everything else, so no separate
  conditions-only step is needed. A companion to
  dump-e2e-diagnostics for the API half of the netboot lane: pass this
  action's `namespace` instead of building an extra-resource-refs list
  by hand when the caller wants every kezio CR in the namespace, not a
  hand-picked subset. Runs under `set +e`: a kind with zero objects, or
  not yet created, must not fail this step. Teed into
  "${RUNNER_TEMP}/kezio-resources-dump.log" so a caller's own
  upload-artifact step can pick it up.

inputs:
  namespace:
    description: Namespace to dump kezio resources from.
    required: false
    default: "scaffold-system"

runs:
  using: composite
  steps:
    - name: Dump kezio v1alpha2 resources
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set +e
        # Teed into a file too, same as dump-e2e-diagnostics: only the
        # step's own stdout would otherwise carry this dump, and that
        # never reaches the "Upload diagnostics" artifact.
        exec > >(tee "${RUNNER_TEMP}/kezio-resources-dump.log") 2>&1
        echo "===== kezio v1alpha2 resources in ${NAMESPACE} ====="
        kubectl get machines,machinehardwares,subnets,sites,deployruns,images,partitioncontents \
          -n "${NAMESPACE}" -o yaml
