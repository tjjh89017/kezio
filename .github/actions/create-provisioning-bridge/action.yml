name: Create the provisioning bridge

description: >-
  Creates the host bridge the BMC e2e lane's boot-path participants
  (bootd, the existing DHCP responder, the tracker/seeder pods, and the
  target VM) all attach a Multus interface to, and gives the runner
  itself an address on it.

inputs:
  bridge-name:
    description: 'Name of the bridge device to create, e.g. "kezio-prov0".'
    required: true
  host-ip:
    description: 'CIDR address to assign the runner on the bridge, e.g. "192.0.2.1/24".'
    required: true

runs:
  using: composite
  steps:
    # host-ip is the runner's own address, not a gateway - every boot-path
    # participant gets its own Multus address instead.
    - name: Create the provisioning bridge
      shell: bash
      env:
        PROVISIONING_BRIDGE: ${{ inputs.bridge-name }}
        PROVISIONING_HOST_IP: ${{ inputs.host-ip }}
      run: |
        set -euo pipefail
        sudo ip link add "${PROVISIONING_BRIDGE}" type bridge
        # Per-device opt-out of br_netfilter: bridged frames on this
        # segment stay pure L2 instead of traversing the CNI's iptables
        # chains. ORed by the kernel with the global bridge-nf-call
        # sysctls, so it fully applies only where those are 0.
        sudo ip link set dev "${PROVISIONING_BRIDGE}" type bridge nf_call_iptables 0 nf_call_ip6tables 0
        sudo ip addr add "${PROVISIONING_HOST_IP}" dev "${PROVISIONING_BRIDGE}"
        sudo ip link set "${PROVISIONING_BRIDGE}" up
