name: Deploy the existing-dhcp pod on a provisioning bridge
description: >-
  Stands up the "site already has a DHCP server" half of the Clonezilla
  precedent this e2e topology follows: a pinned, deliberately
  NOT-kezio-owned dnsmasq image, static-Multus-attached to the same
  provisioning bridge bootd's net1 lives on, answering leases directly on
  the segment. bootd's own dnsmasq (BOOTD_DHCP_RELAY_SERVER, set by the
  caller) relays every DHCP request it hears to this pod's static
  address - a plain on-link unicast, since both sit on the same /24, so
  no host-side routing of any kind is needed for the relay leg to work.
  Shared by e2e-kubevirt-reusable.yml, e2e-boot-path-kubevirt.yml, and
  e2e-scale-multisite-kubevirt.yml (once per site) so the manifest shape
  lives in one place.

inputs:
  namespace:
    description: Namespace the pod, its ConfigMap, and its NetworkAttachmentDefinition are created in.
    required: false
    default: kezio-system
  name:
    description: >-
      Base name for every resource this action creates (Deployment,
      ConfigMap, NetworkAttachmentDefinition). Include a per-site suffix
      (for example "kezio-existing-dhcp-site-a") when a caller deploys
      more than one of these against different bridges.
    required: true
  image:
    description: Pinned third-party dnsmasq image (never kezio's own bootd image - see this action's own doc comment for why).
    required: true
  bridge:
    description: Host Linux bridge (the same one bootd's own boot-network NAD attaches to) this pod's net1 joins.
    required: true
  static-cidr:
    description: 'This pod''s fixed net1 address on the segment, e.g. "192.0.2.3/24".'
    required: true
  dhcp-range:
    description: 'dnsmasq dhcp-range value, e.g. "192.0.2.10,192.0.2.100,255.255.255.0,12h".'
    required: true
  network-site-label:
    description: >-
      Optional value for the kezio.kojuro.date/network-site label (the
      same label config/bootd's multisite clones carry) - set only by a
      caller running more than one site's worth of these pods, so each
      site's diagnostics can select its own pod by label as well as by
      name. Left empty, no such label is added.
    required: false
    default: ""

outputs:
  pod-name:
    description: The resolved, non-terminating pod name backing the Deployment - already confirmed to carry the requested Multus attachment.
    value: ${{ steps.resolve-pod.outputs.pod-name }}

runs:
  using: composite
  steps:
    - name: Create the existing-dhcp NetworkAttachmentDefinition, ConfigMap, and Deployment
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        NAME: ${{ inputs.name }}
        IMAGE: ${{ inputs.image }}
        BRIDGE: ${{ inputs.bridge }}
        STATIC_CIDR: ${{ inputs.static-cidr }}
        DHCP_RANGE: ${{ inputs.dhcp-range }}
        SITE_LABEL: ${{ inputs.network-site-label }}
      run: |
        set -euo pipefail
        nad_name="${NAME}-network"

        # Same "bridge + tuning(rp_filter=0)" plugin chain as bootd's own
        # kezio-boot-network NAD (see e2e-kubevirt-reusable.yml's own
        # comment on that NAD for the full reasoning): this pod answers
        # the VM's broadcast DISCOVER directly too, not only bootd's
        # relayed copy - it is the "two offers" half of the Clonezilla
        # shape this topology models - so its net1 needs the same loose
        # reverse-path filter a source-0.0.0.0 broadcast can otherwise
        # fail depending on kernel version and inherited sysctl defaults.
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: ${nad_name}
          namespace: ${NAMESPACE}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "${nad_name}",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${BRIDGE}",
                  "ipam": {
                    "type": "static",
                    "addresses": [
                      {"address": "${STATIC_CIDR}"}
                    ]
                  }
                },
                {
                  "type": "tuning",
                  "sysctl": {
                    "net.ipv4.conf.IFNAME.rp_filter": "0"
                  }
                }
              ]
            }
        EOF

        # The exact shape this lane's design settled on: no DNS
        # (port=0), bound only to net1 (bind-interfaces - the pod also
        # keeps the cluster's default eth0, same reason bootd's own
        # BOOTD_DHCP_INTERFACE exists), one lease range on the
        # provisioning subnet, and dhcp-option=3 left deliberately EMPTY
        # so this stand-in for "the site's existing DHCP server" never
        # hands the VM a router - the VM must stay unable to route off
        # this segment even when it takes this pod's own direct offer
        # instead of bootd's relayed copy.
        conf_file="$(mktemp)"
        cat <<EOF > "${conf_file}"
        port=0
        bind-interfaces
        interface=net1
        dhcp-range=${DHCP_RANGE}
        dhcp-option=3
        log-dhcp
        EOF
        kubectl -n "${NAMESPACE}" create configmap "${NAME}-conf" \
          --from-file=dnsmasq.conf="${conf_file}" \
          --dry-run=client -o yaml | kubectl apply -f -
        rm -f "${conf_file}"

        labels_json='{"app.kubernetes.io/component":"existing-dhcp"}'
        if [ -n "${SITE_LABEL}" ]; then
          labels_json="$(jq -c --arg site "${SITE_LABEL}" '. + {"kezio.kojuro.date/network-site":$site}' <<<"${labels_json}")"
        fi

        # Root, no added Linux capabilities beyond NET_BIND_SERVICE/
        # NET_ADMIN/NET_RAW - the same three plain dnsmasq itself refuses
        # to serve DHCP without (lab-verified against dnsmasq 2.91, see
        # internal/bootd/caps.go's dnsmasqCaps for the same finding
        # against bootd's own dnsmasq child). The namespace this pod
        # deploys into is already labeled
        # pod-security.kubernetes.io/enforce=privileged by the time this
        # action runs (NET_ADMIN is outside both the restricted and
        # baseline profiles), the same precondition bootd's own
        # Deployment relies on.
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${NAME}
          namespace: ${NAMESPACE}
          labels: $(jq -c . <<<"${labels_json}")
        spec:
          replicas: 1
          selector:
            matchLabels: $(jq -c . <<<"${labels_json}")
          template:
            metadata:
              labels: $(jq -c . <<<"${labels_json}")
              annotations:
                k8s.v1.cni.cncf.io/networks: ${nad_name}
            spec:
              containers:
                - name: existing-dhcp
                  image: ${IMAGE}
                  # Bypass the image's default "webproc --config ... --
                  # dnsmasq --no-daemon" entrypoint: webproc is a
                  # config-editing web UI with no purpose on this
                  # provisioning bridge, and it supervises dnsmasq -
                  # when dnsmasq dies, webproc stays up and the
                  # container (and pod) stay Ready, so a lane's DHCP
                  # failure would present as "pod healthy, no lease"
                  # instead of a restarting/crashed container. Running
                  # dnsmasq directly makes it PID 1, so its exit status
                  # is the container's exit status - the same
                  # direct-child shape bootd runs its own dnsmasq
                  # child under (see internal/bootd/dnsmasq.go).
                  command: ["dnsmasq"]
                  args: ["--no-daemon", "--conf-file=/etc/dnsmasq.conf", "--user=root"]
                  volumeMounts:
                    - name: conf
                      mountPath: /etc/dnsmasq.conf
                      subPath: dnsmasq.conf
                  securityContext:
                    runAsUser: 0
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: false
                    capabilities:
                      drop: ["ALL"]
                      add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE"]
              volumes:
                - name: conf
                  configMap:
                    name: ${NAME}-conf
        EOF

        kubectl -n "${NAMESPACE}" rollout status deployment/"${NAME}" --timeout=180s

    - name: Confirm the existing-dhcp pod's Multus attachment actually happened
      id: resolve-pod
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        nad_name="${NAME}-network"
        # Same non-terminating-pod selection and network-status check as
        # bootd's and the tracker/seeder's own attachment checks: the
        # Deployment's template annotation only records the *request*,
        # not proof a CNI ADD actually happened. Selected by pod-name
        # prefix rather than a label (this Deployment's own name is
        # already unique per bridge/site, one per caller of this action).
        pod_name="$(kubectl -n "${NAMESPACE}" get pods -o json \
          | jq -r --arg name "${NAME}" '[.items[] | select(.metadata.deletionTimestamp == null) | select(.metadata.name | startswith($name + "-"))][0].metadata.name')"
        if [ -z "${pod_name}" ] || [ "${pod_name}" = "null" ]; then
          echo "::error::no non-terminating pod found for existing-dhcp Deployment ${NAME}" >&2
          exit 1
        fi
        network_status="$(kubectl -n "${NAMESPACE}" get pod "${pod_name}" \
          -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}')"
        if ! grep -q "${nad_name}" <<<"${network_status}"; then
          echo "::error::existing-dhcp pod ${pod_name} has no ${nad_name} attachment in its network-status; got: ${network_status}" >&2
          exit 1
        fi
        echo "pod-name=${pod_name}" >> "$GITHUB_OUTPUT"
