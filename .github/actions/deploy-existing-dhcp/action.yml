name: Deploy the existing-dhcp pod on a provisioning bridge

description: >-
  Stands up the "site already has a DHCP server" half of the topology a
  BMC e2e lane exercises: a pinned, deliberately NOT-kezio-owned dnsmasq
  image, static-Multus-attached to the same provisioning bridge bootd's
  net1 lives on, answering leases directly on the segment while bootd
  itself runs pure proxyDHCP beside it (see deploy-bootd's dhcp-mode
  handling for the lease-mode alternative, where this pod isn't deployed
  at all).

inputs:
  namespace:
    description: Namespace the pod, its ConfigMap, and its NetworkAttachmentDefinition are created in.
    required: false
    default: "kezio-system"
  name:
    description: >-
      Base name for every resource this action creates (Deployment,
      ConfigMap, NetworkAttachmentDefinition). Include a per-subnet suffix
      (for example "kezio-existing-dhcp-subnet-a") when a caller deploys
      more than one of these against different bridges.
    required: true
  image:
    description: Pinned third-party dnsmasq image (never kezio's own bootd image - see this action's own doc comment for why).
    required: true
  bridge:
    description: Host Linux bridge (the same one bootd's own boot-network NAD attaches to) this pod's net1 joins.
    required: true
  static-cidr:
    description: 'This pod''s fixed net1 address on the segment, e.g. "192.0.2.3/24".'
    required: true
  dhcp-range:
    description: 'dnsmasq dhcp-range value, e.g. "192.0.2.10,192.0.2.100,255.255.255.0,12h".'
    required: true

outputs:
  pod-name:
    description: The resolved, non-terminating pod name backing the Deployment - already confirmed to carry the requested Multus attachment.
    value: ${{ steps.resolve-pod.outputs.pod-name }}

runs:
  using: composite
  steps:
    - name: Create the existing-dhcp NetworkAttachmentDefinition, ConfigMap, and Deployment
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        NAME: ${{ inputs.name }}
        IMAGE: ${{ inputs.image }}
        BRIDGE: ${{ inputs.bridge }}
        STATIC_CIDR: ${{ inputs.static-cidr }}
        DHCP_RANGE: ${{ inputs.dhcp-range }}
      run: |
        set -euo pipefail
        nad_name="${NAME}-network"

        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: ${nad_name}
          namespace: ${NAMESPACE}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "${nad_name}",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${BRIDGE}",
                  "ipam": {
                    "type": "static",
                    "addresses": [
                      {"address": "${STATIC_CIDR}"}
                    ]
                  }
                }
              ]
            }
        EOF

        # No DNS (port=0), bound only to net1 (the pod also keeps the
        # cluster's default eth0). dhcp-option=3 is deliberately left
        # EMPTY so this stand-in DHCP server never hands the VM a router -
        # it must stay unable to route off this segment.
        conf_file="$(mktemp)"
        cat <<EOF > "${conf_file}"
        port=0
        bind-interfaces
        interface=net1
        dhcp-range=${DHCP_RANGE}
        dhcp-option=3
        log-dhcp
        EOF
        kubectl -n "${NAMESPACE}" create configmap "${NAME}-conf" \
          --from-file=dnsmasq.conf="${conf_file}" \
          --dry-run=client -o yaml | kubectl apply -f -
        rm -f "${conf_file}"

        labels_json='{"app.kubernetes.io/component":"existing-dhcp"}'

        # NET_BIND_SERVICE/NET_ADMIN/NET_RAW are the capabilities plain
        # dnsmasq itself refuses to serve DHCP without (see
        # internal/bootd/caps.go's dnsmasqCaps). Requires the namespace to
        # already be labeled pod-security.kubernetes.io/enforce=privileged
        # (NET_ADMIN is outside restricted/baseline).
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${NAME}
          namespace: ${NAMESPACE}
          labels: $(jq -c . <<<"${labels_json}")
        spec:
          replicas: 1
          selector:
            matchLabels: $(jq -c . <<<"${labels_json}")
          template:
            metadata:
              labels: $(jq -c . <<<"${labels_json}")
              annotations:
                k8s.v1.cni.cncf.io/networks: ${nad_name}
            spec:
              containers:
                - name: existing-dhcp
                  image: ${IMAGE}
                  # Bypass the image's default webproc-supervised
                  # entrypoint: webproc stays up when dnsmasq dies, masking
                  # a DHCP failure as "pod healthy, no lease". Running
                  # dnsmasq directly makes it PID 1, so its exit status is
                  # the container's exit status.
                  command: ["dnsmasq"]
                  args: ["--no-daemon", "--conf-file=/etc/dnsmasq.conf", "--user=root"]
                  volumeMounts:
                    - name: conf
                      mountPath: /etc/dnsmasq.conf
                      subPath: dnsmasq.conf
                  securityContext:
                    runAsUser: 0
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: false
                    capabilities:
                      drop: ["ALL"]
                      add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE"]
              volumes:
                - name: conf
                  configMap:
                    name: ${NAME}-conf
        EOF

        kubectl -n "${NAMESPACE}" rollout status deployment/"${NAME}" --timeout=180s

    - name: Confirm the existing-dhcp pod's Multus attachment actually happened
      id: resolve-pod
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        nad_name="${NAME}-network"
        # The Deployment's template annotation only records the *request*
        # for a Multus attachment, not proof a CNI ADD actually happened -
        # confirm it via the pod's own network-status annotation instead.
        pod_name="$(kubectl -n "${NAMESPACE}" get pods -o json \
          | jq -r --arg name "${NAME}" '[.items[] | select(.metadata.deletionTimestamp == null) | select(.metadata.name | startswith($name + "-"))][0].metadata.name')"
        if [ -z "${pod_name}" ] || [ "${pod_name}" = "null" ]; then
          echo "::error::no non-terminating pod found for existing-dhcp Deployment ${NAME}" >&2
          exit 1
        fi
        network_status="$(kubectl -n "${NAMESPACE}" get pod "${pod_name}" \
          -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}')"
        if ! grep -q "${nad_name}" <<<"${network_status}"; then
          echo "::error::existing-dhcp pod ${pod_name} has no ${nad_name} attachment in its network-status; got: ${network_status}" >&2
          exit 1
        fi
        echo "pod-name=${pod_name}" >> "$GITHUB_OUTPUT"
