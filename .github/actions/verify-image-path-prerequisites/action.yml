name: Verify image-path prerequisites

description: >-
  Asserts the image-path lane's scaffolding is actually healthy: the
  tracker and image-service Deployments are Available, a default
  StorageClass exists (for the PVC each PartitionContent an import
  creates gets), the image-service token Secret is present with a
  non-empty token key, and image-service's Service actually answers
  /healthz from inside the cluster. It asserts nothing about any Image,
  import, or content: it runs before the first import, and it is what
  tells an ingest failure that follows apart from broken scaffolding.

inputs:
  namespace:
    description: 'Namespace the tracker, image-service, and the token Secret were deployed into.'
    required: false
    default: "scaffold-system"
  tracker-label-selector:
    description: >-
      Label selector matching the tracker Deployment to wait on.
      Defaults to the standalone opentracker Deployment
      (deploy-opentracker); a lane whose tracker is Site-managed passes
      "app.kubernetes.io/component=tracker" instead.
    required: false
    default: "app.kubernetes.io/component=opentracker"
  token-secret-name:
    description: 'Name of the image-service bearer token Secret.'
    required: false
    default: "kezio-image-service-token"
  image-service-service-name:
    description: 'Name of the image-service Service to curl /healthz on.'
    required: false
    default: "kezio-image-service"

runs:
  using: composite
  steps:
    - name: Verify image-path prerequisites
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        TRACKER_LABEL_SELECTOR: ${{ inputs.tracker-label-selector }}
        TOKEN_SECRET_NAME: ${{ inputs.token-secret-name }}
        IMAGE_SERVICE_SERVICE_NAME: ${{ inputs.image-service-service-name }}
      run: |
        set -euo pipefail

        kubectl wait deployment -n "${NAMESPACE}" -l "${TRACKER_LABEL_SELECTOR}" \
          --for=condition=Available --timeout=60s

        kubectl wait deployment -n "${NAMESPACE}" -l app.kubernetes.io/component=image-service \
          --for=condition=Available --timeout=60s

        if ! kubectl get storageclass -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}' \
          | grep -q .; then
          echo "::error::no default StorageClass found" >&2
          exit 1
        fi

        token_len="$(kubectl get secret "${TOKEN_SECRET_NAME}" -n "${NAMESPACE}" \
          -o jsonpath='{.data.token}' | base64 -d | wc -c)"
        if [ "${token_len}" -eq 0 ]; then
          echo "::error::${TOKEN_SECRET_NAME} in ${NAMESPACE} has an empty token key" >&2
          exit 1
        fi

        # /healthz is unauthenticated (see imageservice.Server.Handler), so
        # a plain in-cluster curl proves the Service actually routes to a
        # live, listening image-service pod - not just that the Deployment
        # object reports Available.
        kubectl run verify-image-service-healthz --rm -i --restart=Never \
          --image=curlimages/curl:8.11.0 -n "${NAMESPACE}" \
          --command -- curl --fail --silent --show-error \
          "http://${IMAGE_SERVICE_SERVICE_NAME}.${NAMESPACE}.svc.cluster.local:8080/healthz"

        echo "image-path prerequisites healthy: tracker and image-service Available, default StorageClass present, token Secret non-empty, image-service /healthz reachable"
