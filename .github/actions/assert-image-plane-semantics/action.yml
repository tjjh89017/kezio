name: Assert Image/PartitionContent plane semantics

description: >-
  Proves, against the real cluster ingest-test-image and run-leecher just
  walked through, the controller behaviors that are otherwise only
  envtested: an import that refuses to write over an existing content
  name, a hand-written Image over content that already exists, the
  PartitionContent deletion finalizer, seeder grace-period shutdown, and
  the full teardown of an ImageImport's own ingest scratch PVC and the
  staged upload that fed it. Runs as five ordered step groups against the
  one PartitionContent ingest-test-image produced (content-name); see
  each step's own comment for why the order is load-bearing.

inputs:
  namespace:
    description: 'Namespace every object below lives in.'
    required: false
    default: "kezio-system"
  content-name:
    description: 'PartitionContent object name ingest-test-image produced, e.g. its content-name output.'
    required: true
  content-prefix:
    description: 'Content prefix ingest-test-image''s import used, e.g. its content-prefix output. The conflicting import below names this same prefix, so it asks for content-name itself.'
    required: true
  first-image-name:
    description: 'Name of the Image ingest-test-image created (must match its image-name input).'
    required: false
    default: "kezio-e2e-fixture"
  fixture-disk-path:
    description: 'Runner-local fixture disk path, e.g. ingest-test-image''s disk-path output - re-uploaded byte-for-byte to exercise the import''s name-conflict refusal.'
    required: true
  token:
    description: Bearer token kezioctl authenticates the re-upload with.
    required: true
  image-service-service-name:
    description: 'Name of the image-service Service to port-forward for the re-upload.'
    required: false
    default: "kezio-image-service"
  local-port:
    description: 'Local port the image-service Service is port-forwarded to. Distinct from ingest-test-image''s own port so a slow-to-exit prior port-forward can never collide.'
    required: false
    default: "18081"
  conflicting-import-name:
    description: 'Name given to the second ImageImport, and to the Image it would have created had it not been refused.'
    required: false
    default: "kezio-e2e-fixture-dup"
  composed-image-name:
    description: 'Name given to the hand-written (composed) Image over already-existing content.'
    required: false
    default: "kezio-e2e-fixture-composed"
  wait-timeout-seconds:
    description: 'How long to poll for an Image to reach Ready, or for the conflicting import to reach Failed, before failing.'
    required: false
    default: "300"
  seeder-wait-timeout-seconds:
    description: 'How long to wait for the seeder Deployment to become Available.'
    required: false
    default: "180"
  grace-period-seconds:
    description: 'Must match the cluster''s PARTITIONCONTENT_SEEDER_GRACE_PERIOD - the countdown the grace-shutdown step observes.'
    required: false
    default: "30"
  teardown-wait-timeout-seconds:
    description: 'Upper bound the grace-shutdown step waits for the seeder Deployment to disappear after demand clears - comfortably above grace-period-seconds so a real hang still fails loudly instead of hanging the job.'
    required: false
    default: "120"
  deletion-wait-timeout-seconds:
    description: 'Upper bound the deletion-semantics step waits for each delete/block/unblock transition.'
    required: false
    default: "120"

runs:
  using: composite
  steps:
    # --- Step group 1: an import will not write over existing content ---
    #
    # Re-uploads the identical fixture bytes (fixture-disk-path, built
    # once by ingest-test-image, not rebuilt here) as a second
    # ImageImport that names the same content prefix, so it asks for
    # content-name itself. A content name is chosen by its import, not
    # derived from the bytes, so identical bytes buy this import
    # nothing: content is immutable, and the import reports the conflict
    # and stops rather than write over what the first import created.
    # Its own ingest Job still runs to completion first - the partition
    # set, and therefore the names, are only known once it has - so what
    # this asserts is what the refused import did NOT leave behind.
    - name: "Conflict: a second import naming the same content prefix is refused, not applied"
      id: conflict
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        CONTENT_NAME: ${{ inputs.content-name }}
        CONTENT_PREFIX: ${{ inputs.content-prefix }}
        IMPORT_NAME: ${{ inputs.conflicting-import-name }}
        DISK_PATH: ${{ inputs.fixture-disk-path }}
        TOKEN: ${{ inputs.token }}
        SERVICE_NAME: ${{ inputs.image-service-service-name }}
        LOCAL_PORT: ${{ inputs.local-port }}
        WAIT_TIMEOUT_SECONDS: ${{ inputs.wait-timeout-seconds }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/lib.sh"

        kubectl -n "${NAMESPACE}" port-forward "svc/${SERVICE_NAME}" "${LOCAL_PORT}:8080" &
        pf_pid=$!
        trap 'kill "${pf_pid}" 2>/dev/null || true' EXIT
        for _ in $(seq 1 30); do
          curl -sf -o /dev/null "http://127.0.0.1:${LOCAL_PORT}/healthz" && break
          sleep 1
        done

        trap 'dump_import_diagnostics "${NAMESPACE}" "${IMPORT_NAME}"; kill "${pf_pid}" 2>/dev/null || true' ERR
        bin/kezioctl image upload "${DISK_PATH}" \
          --name "${IMPORT_NAME}" \
          --namespace "${NAMESPACE}" \
          --content-prefix "${CONTENT_PREFIX}" \
          --server "http://127.0.0.1:${LOCAL_PORT}" \
          --token "${TOKEN}"

        wait_for_import_failed "${NAMESPACE}" "${IMPORT_NAME}" "${WAIT_TIMEOUT_SECONDS}"
        trap 'kill "${pf_pid}" 2>/dev/null || true' EXIT

        failure_message="$(jp "${NAMESPACE}" imageimports.kezio.kojuro.date "${IMPORT_NAME}" \
          '{.status.conditions[?(@.type=="Ready")].message}')"
        echo "import failure message: ${failure_message}"
        case "${failure_message}" in
          *"${CONTENT_NAME}"*) ;;
          *) echo "::error::the refused import does not name ${CONTENT_NAME} as the conflict: ${failure_message}" >&2
             dump_import_diagnostics "${NAMESPACE}" "${IMPORT_NAME}"
             exit 1 ;;
        esac

        echo "Asserting the refused import created no Image of its own"
        if kubectl get images.kezio.kojuro.date "${IMPORT_NAME}" -n "${NAMESPACE}" >/dev/null 2>&1; then
          echo "::error::refused import ${IMPORT_NAME} created Image ${IMPORT_NAME} anyway" >&2
          dump_import_diagnostics "${NAMESPACE}" "${IMPORT_NAME}"
          exit 1
        fi

        echo "Asserting content-name ${CONTENT_NAME} was left untouched"
        assert_shared_content_singleton "${NAMESPACE}" "${CONTENT_NAME}"
        echo "conflict assertions passed: import Failed, no second Image, still one PartitionContent, one content PVC, one publish Job"

    # --- Step group 2: composed Image -------------------------------------
    #
    # A hand-written Image reusing content-name's layout (fetched off
    # the already-Ready first Image, byte-identical sfdiskJSON/slots)
    # must reach Ready through pure aggregation over content that
    # already exists - composing an Image from existing content is done
    # by naming that content. An Image never starts an import: only an
    # ImageImport owns an ingest Job, so no image-ingest-<name> Job is
    # ever created for this one.
    - name: "Composed: an Image over existing content reaches Ready with no ingest Job"
      id: composed
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        CONTENT_NAME: ${{ inputs.content-name }}
        FIRST_IMAGE_NAME: ${{ inputs.first-image-name }}
        COMPOSED_IMAGE_NAME: ${{ inputs.composed-image-name }}
        WAIT_TIMEOUT_SECONDS: ${{ inputs.wait-timeout-seconds }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/lib.sh"

        layout="$(kubectl get images.kezio.kojuro.date "${FIRST_IMAGE_NAME}" -n "${NAMESPACE}" -o json | jq -c '.spec.layout')"

        trap 'dump_image_diagnostics "${NAMESPACE}" "${COMPOSED_IMAGE_NAME}"' ERR
        jq -n --arg name "${COMPOSED_IMAGE_NAME}" --arg ns "${NAMESPACE}" --argjson layout "${layout}" '{
          apiVersion: "kezio.kojuro.date/v1alpha3",
          kind: "Image",
          metadata: {name: $name, namespace: $ns},
          spec: {layout: $layout}
        }' | kubectl apply -f -

        wait_for_image_ready "${NAMESPACE}" "${COMPOSED_IMAGE_NAME}" "${WAIT_TIMEOUT_SECONDS}"

        echo "Asserting no ingest Job was created for the composed Image"
        if kubectl get job "image-ingest-${COMPOSED_IMAGE_NAME}" -n "${NAMESPACE}" >/dev/null 2>&1; then
          echo "::error::composed Image ${COMPOSED_IMAGE_NAME} unexpectedly has an ingest Job" >&2
          dump_image_diagnostics "${NAMESPACE}" "${COMPOSED_IMAGE_NAME}"
          exit 1
        fi
        echo "Asserting content-name ${CONTENT_NAME} still was not duplicated"
        assert_shared_content_singleton "${NAMESPACE}" "${CONTENT_NAME}"
        echo "composed-image assertions passed: Ready with no ingest Job, content still shared"

    # --- Step group 3: seeder grace-period shutdown -----------------------
    #
    # Deliberately runs *before* the deletion-semantics group below: that
    # group deletes every Image referencing content-name, which lets
    # content-name's own deletion (and its owned seeder Deployment) proceed
    # - nothing would be left to observe a grace shutdown on afterward. It
    # also does not reuse run-leecher's own demand cycle: the conflict/composed
    # steps above run an unbounded amount of wall-clock time after
    # run-leecher deleted its demand Machine, which could already exceed
    # grace-period-seconds by the time this step runs. Driving a fresh
    # demand Machine create/delete cycle here removes that race instead of
    # racing it.
    - name: "Seeder: grace-period shutdown neither fires early nor hangs"
      id: grace
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        CONTENT_NAME: ${{ inputs.content-name }}
        FIRST_IMAGE_NAME: ${{ inputs.first-image-name }}
        SEEDER_WAIT_TIMEOUT_SECONDS: ${{ inputs.seeder-wait-timeout-seconds }}
        GRACE_PERIOD_SECONDS: ${{ inputs.grace-period-seconds }}
        TEARDOWN_WAIT_TIMEOUT_SECONDS: ${{ inputs.teardown-wait-timeout-seconds }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/lib.sh"

        # One seeder Deployment serves one (Image, Site) pair, and its
        # name is derived from both (see seederdeploy.Name). It is found
        # here, once it appears, by its component label plus the owning
        # Image's own controller reference (listImageSeederDeployments'
        # own lookup, reproduced here).
        seeder_deployment=""
        seeder_label_selector="app.kubernetes.io/name=kezio,app.kubernetes.io/component=image-seeder"
        demand_machine="kezio-e2e-grace-demand"
        demand_bmc_creds_secret="kezio-e2e-grace-demand-bmc-creds"

        trap 'dump_seeder_diagnostics "${NAMESPACE}" "${seeder_deployment}"' ERR

        echo "Creating a Machine naming ${FIRST_IMAGE_NAME} as its OS image, for a fresh demand cycle"
        kubectl create secret generic "${demand_bmc_creds_secret}" \
          --namespace "${NAMESPACE}" \
          --from-literal=username=fake \
          --from-literal=password=fake \
          --dry-run=client -o yaml | kubectl apply -f -
        cat <<EOF | kubectl apply -f -
        apiVersion: kezio.kojuro.date/v1alpha3
        kind: Machine
        metadata:
          name: ${demand_machine}
          namespace: ${NAMESPACE}
        spec:
          bmc:
            address: redfish://198.51.100.12/redfish/v1/Systems/1
            credentialsSecretRef:
              name: ${demand_bmc_creds_secret}
          subnetRef:
            # The exact Subnet main.yaml creates for run-leecher's own
            # demand Machine (kezio-e2e-leecher-demand-subnet) - seeder
            # placement now resolves Machine.spec.subnetRef through a
            # real Subnet/Site chain (sitederive.Resolve), so a
            # not-actually-created Subnet name here would make this
            # Machine's demand unresolvable and the seeder Deployment
            # below would never appear.
            name: kezio-e2e-leecher-demand-subnet
        EOF
        cat <<EOF | kubectl apply -f -
        apiVersion: kezio.kojuro.date/v1alpha3
        kind: MachineClaim
        metadata:
          name: ${demand_machine}-claim
          namespace: ${NAMESPACE}
        spec:
          machineName: ${demand_machine}
          imageRef:
            name: ${FIRST_IMAGE_NAME}
        EOF
        kubectl wait "machineclaim/${demand_machine}-claim" -n "${NAMESPACE}" \
          --for=jsonpath='{.status.phase}'=Bound --timeout=30s

        echo "Waiting for the seeder Deployment owned by Image ${FIRST_IMAGE_NAME} to appear"
        deadline=$(( $(date +%s) + SEEDER_WAIT_TIMEOUT_SECONDS ))
        while [ -z "${seeder_deployment}" ]; do
          seeder_deployment="$(kubectl get deployments -n "${NAMESPACE}" -l "${seeder_label_selector}" -o json | \
            jq -r --arg image "${FIRST_IMAGE_NAME}" \
              '[.items[] | select((.metadata.ownerReferences // []) | any(.kind == "Image" and .name == $image))][0].metadata.name // ""')"
          if [ -n "${seeder_deployment}" ]; then
            break
          fi
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::no seeder Deployment owned by Image ${FIRST_IMAGE_NAME} (label ${seeder_label_selector}) ever appeared in ${NAMESPACE}" >&2
            exit 1
          fi
          sleep 3
        done
        echo "found seeder Deployment ${seeder_deployment}"
        kubectl wait --for=condition=Available "deployment/${seeder_deployment}" -n "${NAMESPACE}" \
          --timeout="${SEEDER_WAIT_TIMEOUT_SECONDS}s"

        echo "Deleting the demand Machine ${demand_machine}"
        # The claim is deleted first: MachineClaim and Machine are
        # independent objects (not owner/owned), and deleting the claim
        # first is what cleanly releases the Machine.
        # --ignore-not-found on the secret: the Machine's own delete walk
        # releases its finalizer and clears the Machine, letting the
        # credentials Secret's owner reference cascade-delete it (see
        # claimCredentialsSecret/releaseCredentialsSecretFinalizer) - this
        # explicit delete can race that cascade and find it already gone.
        kubectl delete machineclaim "${demand_machine}-claim" -n "${NAMESPACE}" --wait=false --ignore-not-found
        kubectl delete machine "${demand_machine}" -n "${NAMESPACE}" --wait=false
        kubectl delete secret "${demand_bmc_creds_secret}" -n "${NAMESPACE}" --ignore-not-found

        early_check_delay=5
        if [ "${early_check_delay}" -ge "${GRACE_PERIOD_SECONDS}" ]; then
          early_check_delay=0
        fi
        sleep "${early_check_delay}"
        echo "Asserting the seeder Deployment ${seeder_deployment} was not torn down before its grace period elapsed"
        if ! kubectl get deployment "${seeder_deployment}" -n "${NAMESPACE}" >/dev/null 2>&1; then
          echo "::error::seeder deployment ${seeder_deployment} was deleted before grace-period-seconds (${GRACE_PERIOD_SECONDS}s) could have elapsed" >&2
          exit 1
        fi

        echo "Waiting up to ${TEARDOWN_WAIT_TIMEOUT_SECONDS}s for ${seeder_deployment} to be torn down after grace"
        deadline=$(( $(date +%s) + TEARDOWN_WAIT_TIMEOUT_SECONDS ))
        while kubectl get deployment "${seeder_deployment}" -n "${NAMESPACE}" >/dev/null 2>&1; do
          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::seeder deployment ${seeder_deployment} was not torn down within ${TEARDOWN_WAIT_TIMEOUT_SECONDS}s of grace-period-seconds (${GRACE_PERIOD_SECONDS}s) elapsing" >&2
            exit 1
          fi
          sleep 3
        done
        echo "grace-shutdown assertions passed: torn down neither early nor never"

    # --- Step group 4: deletion semantics ----------------------------------
    #
    # Deletes the two Images that reference content-name one at a time,
    # observing the PartitionContentFinalizer's contract at each step:
    # the shared content survives while any Image still references it; a
    # direct delete against the content itself while still referenced
    # blocks (DeletionBlocked, deletionTimestamp set, object persists)
    # rather than either succeeding or being silently ignored; and once
    # the last referencing Image is gone, the pending delete completes
    # on its own (the Image-deletion watch, not a poll) and ordinary
    # garbage collection reclaims the content PVC.
    - name: "Deletion: content survives partial dereference, blocks under a direct delete, completes once unreferenced"
      id: deletion
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        CONTENT_NAME: ${{ inputs.content-name }}
        FIRST_IMAGE_NAME: ${{ inputs.first-image-name }}
        COMPOSED_IMAGE_NAME: ${{ inputs.composed-image-name }}
        DELETION_WAIT_TIMEOUT_SECONDS: ${{ inputs.deletion-wait-timeout-seconds }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/lib.sh"

        trap 'dump_content_diagnostics "${NAMESPACE}" "${CONTENT_NAME}"' ERR

        echo "Deleting the first Image (${FIRST_IMAGE_NAME}) - the composed Image still references ${CONTENT_NAME}"
        kubectl delete images.kezio.kojuro.date "${FIRST_IMAGE_NAME}" -n "${NAMESPACE}" --wait=false
        wait_for_gone "images.kezio.kojuro.date" "${FIRST_IMAGE_NAME}" "${NAMESPACE}" "${DELETION_WAIT_TIMEOUT_SECONDS}"

        echo "Asserting ${CONTENT_NAME} survives, still Ready"
        content_state="$(jp "${NAMESPACE}" partitioncontents.kezio.kojuro.date "${CONTENT_NAME}" '{.status.state}')"
        if [ "${content_state}" != "Ready" ]; then
          echo "::error::PartitionContent ${CONTENT_NAME} is ${content_state:-<gone>} after only one of its two referencing Images was deleted" >&2
          exit 1
        fi

        echo "Attempting to delete ${CONTENT_NAME} directly while ${COMPOSED_IMAGE_NAME} still references it"
        kubectl delete partitioncontents.kezio.kojuro.date "${CONTENT_NAME}" -n "${NAMESPACE}" --wait=false

        deadline=$(( $(date +%s) + DELETION_WAIT_TIMEOUT_SECONDS ))
        blocked=""
        while [ "$(date +%s)" -lt "${deadline}" ]; do
          deletion_ts="$(jp "${NAMESPACE}" partitioncontents.kezio.kojuro.date "${CONTENT_NAME}" '{.metadata.deletionTimestamp}')"
          blocked_status="$(jp "${NAMESPACE}" partitioncontents.kezio.kojuro.date "${CONTENT_NAME}" '{.status.conditions[?(@.type=="DeletionBlocked")].status}')"
          if [ -n "${deletion_ts}" ] && [ "${blocked_status}" = "True" ]; then
            blocked="1"
            break
          fi
          sleep 3
        done
        if [ -z "${blocked}" ]; then
          echo "::error::PartitionContent ${CONTENT_NAME} did not report deletionTimestamp set with DeletionBlocked=True while still referenced" >&2
          exit 1
        fi
        blocked_message="$(jp "${NAMESPACE}" partitioncontents.kezio.kojuro.date "${CONTENT_NAME}" '{.status.conditions[?(@.type=="DeletionBlocked")].message}')"
        echo "DeletionBlocked message: ${blocked_message}"
        case "${blocked_message}" in
          *image/*) ;;
          *) echo "::error::DeletionBlocked message does not name a blocking image: ${blocked_message}" >&2; exit 1 ;;
        esac
        # Still persists - the finalizer, not this delete call, decides.
        kubectl get partitioncontents.kezio.kojuro.date "${CONTENT_NAME}" -n "${NAMESPACE}" >/dev/null

        pvc_name="$(jp "${NAMESPACE}" partitioncontents.kezio.kojuro.date "${CONTENT_NAME}" '{.status.pvcRef.name}')"
        echo "Deleting the last referencing Image (${COMPOSED_IMAGE_NAME})"
        kubectl delete images.kezio.kojuro.date "${COMPOSED_IMAGE_NAME}" -n "${NAMESPACE}" --wait=false

        echo "Asserting the pending PartitionContent delete now completes on its own"
        wait_for_gone "partitioncontents.kezio.kojuro.date" "${CONTENT_NAME}" "${NAMESPACE}" "${DELETION_WAIT_TIMEOUT_SECONDS}"

        echo "Asserting its content PVC (${pvc_name}) was garbage-collected"
        wait_for_gone "pvc" "${pvc_name}" "${NAMESPACE}" "${DELETION_WAIT_TIMEOUT_SECONDS}"
        echo "deletion-semantics assertions passed"

    # --- Step group 5: ingest cleanup ---------------------------------------
    #
    # Runs last, after both Images (and, transitively, content-name) are
    # gone: the ingest scratch PVC and the ingest Job are owned by the
    # ImageImport, not the Image (docs/crd-reference.md), so nothing above
    # ever exercises their teardown - only deleting the ImageImport itself
    # does. ingest-test-image's own import name equals first-image-name
    # (one name for the import, the Image, and the upload - see its own
    # doc comment). Deleting an already-Succeeded import is safe by
    # design: it never takes the Image or content it produced with it,
    # and both are already gone by this point anyway.
    #
    # This is also where fix for the pvc-protection deadlock (a
    # long-Succeeded pc-publish-* pod still mounting the scratch PVC)
    # actually gets exercised: content-name's publish Job was deleted
    # outright when its PartitionContent cleared in step group 4 above,
    # not left for its own ttlSecondsAfterFinished, so nothing should be
    # left holding the scratch PVC's pvc-protection finalizer open here.
    - name: "Ingest cleanup: deleting the ImageImport reclaims its scratch PVC and the staged upload"
      id: ingest-cleanup
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        IMPORT_NAME: ${{ inputs.first-image-name }}
        DELETION_WAIT_TIMEOUT_SECONDS: ${{ inputs.deletion-wait-timeout-seconds }}
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/lib.sh"

        trap 'dump_import_diagnostics "${NAMESPACE}" "${IMPORT_NAME}"' ERR

        scratch_pvc="image-ingest-scratch-${IMPORT_NAME}"

        # RKE2 in this lane runs directly on this runner (single node),
        # and install-nfs-storage backs every ReadWriteMany PVC - the
        # staging PVC included - with a hostPath directory here
        # (/nfs-vol), so the staged upload's actual bytes on disk can be
        # checked directly, not just the Kubernetes objects that front
        # them. Resolved before the delete below so a failure to find it
        # at all (a naming/layout assumption gone stale) is reported
        # distinctly from it correctly disappearing afterward.
        staged_dir="$(sudo find /nfs-vol -maxdepth 6 -type d -path "*/uploads/${IMPORT_NAME}" 2>/dev/null | head -n1 || true)"
        if [ -z "${staged_dir}" ]; then
          echo "::warning::could not resolve the staged upload's NFS-backed directory for ${IMPORT_NAME} under /nfs-vol; skipping the on-disk assertion (the scratch-PVC and ImageImport assertions below still run)"
        else
          echo "staged upload backing directory: ${staged_dir}"
        fi

        echo "Deleting ImageImport ${IMPORT_NAME}"
        kubectl delete imageimports.kezio.kojuro.date "${IMPORT_NAME}" -n "${NAMESPACE}" --wait=false
        wait_for_gone "imageimports.kezio.kojuro.date" "${IMPORT_NAME}" "${NAMESPACE}" "${DELETION_WAIT_TIMEOUT_SECONDS}"

        echo "Asserting the ingest scratch PVC (${scratch_pvc}) was garbage-collected"
        wait_for_gone "pvc" "${scratch_pvc}" "${NAMESPACE}" "${DELETION_WAIT_TIMEOUT_SECONDS}"

        if [ -n "${staged_dir}" ]; then
          echo "Asserting the staged upload's directory no longer exists on disk"
          deadline=$(( $(date +%s) + DELETION_WAIT_TIMEOUT_SECONDS ))
          while sudo test -d "${staged_dir}"; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::staged upload directory ${staged_dir} still exists ${DELETION_WAIT_TIMEOUT_SECONDS}s after a successful ingest" >&2
              exit 1
            fi
            sleep 3
          done
        fi
        echo "ingest-cleanup assertions passed"
