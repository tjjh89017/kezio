name: Probe same-group forwarding and cross-group isolation

description: >-
  The probe form of the two-site lane's own precondition (section 7.3):
  three segments in two groups - A and B sharing one group, C alone in
  another - created by create-routed-segments, then asserted with
  assert-site-isolation from BOTH of the same-group segments: A reaches
  B, B reaches A, and neither reaches C. Two calls rather than one so
  the "A reaches B" half of the claim is actually exercised in both
  directions, not assumed symmetric from a single-direction check.

  Every reachability target is a helper network namespace on its own
  segment (its own veth pair, address, and default route through that
  segment's own host address, running a real TCP listener), never the
  runner host's own address on that bridge - see
  assert-site-isolation's own doc comment for why: traffic addressed to
  an address the host owns locally is delivered on the INPUT hook, not
  FORWARD, so it would answer regardless of whether any forwarding rule
  ever ran, proving nothing about the mechanism this probe exists to
  check.

inputs:
  segments:
    description: >-
      Passed straight through to create-routed-segments: three
      newline-separated "<name> <cidr> <host-cidr> <group>" lines - two
      sharing one group (A, B) and one in a different group (C).
    required: true
  bridge-a:
    description: Bridge name of segment A (must match its name field in `segments`).
    required: true
  bridge-a-gateway-ip:
    description: Bare address (no prefix) of the runner's own host-cidr on bridge-a.
    required: true
  bridge-a-listener-ip:
    description: Bare address (no prefix) for A's helper listener namespace.
    required: true
  bridge-a-probe-cidr:
    description: Address (with prefix) for the assert-site-isolation source probe run from A.
    required: true
  bridge-b:
    description: Bridge name of segment B (must match its name field in `segments`).
    required: true
  bridge-b-gateway-ip:
    description: Bare address (no prefix) of the runner's own host-cidr on bridge-b.
    required: true
  bridge-b-listener-ip:
    description: Bare address (no prefix) for B's helper listener namespace.
    required: true
  bridge-b-probe-cidr:
    description: Address (with prefix) for the assert-site-isolation source probe run from B.
    required: true
  bridge-c:
    description: Bridge name of segment C (must match its name field in `segments`).
    required: true
  bridge-c-gateway-ip:
    description: >-
      Bare address (no prefix) of the runner's own host-cidr on
      bridge-c. C is the segment nothing may reach, but its listener
      still needs the same default route A's and B's get: a listener
      that cannot route an answer back would time out even with every
      deny rule removed, which would make the isolation half of this
      probe vacuous.
    required: true
  bridge-c-listener-ip:
    description: Bare address (no prefix) for C's helper listener namespace.
    required: true
  listener-prefix-length:
    description: Prefix length used to build each listener namespace's own CIDR address on its bridge.
    required: false
    default: "24"
  listener-port:
    description: TCP port every helper listener namespace binds.
    required: false
    default: "8080"
  timeout-seconds:
    description: Passed through to assert-site-isolation's own timeout-seconds.
    required: false
    default: "3"
  fast-threshold-ms:
    description: Passed through to assert-site-isolation's own fast-threshold-ms.
    required: false
    default: "800"

runs:
  using: composite
  steps:
    - name: Create the routed, group-isolated segments
      uses: ./.github/actions/create-routed-segments
      with:
        segments: ${{ inputs.segments }}

    - name: Create a real TCP listener namespace on each of A, B, and C
      shell: bash
      env:
        BRIDGE_A: ${{ inputs.bridge-a }}
        GATEWAY_A_IP: ${{ inputs.bridge-a-gateway-ip }}
        LISTENER_A_IP: ${{ inputs.bridge-a-listener-ip }}
        BRIDGE_B: ${{ inputs.bridge-b }}
        GATEWAY_B_IP: ${{ inputs.bridge-b-gateway-ip }}
        LISTENER_B_IP: ${{ inputs.bridge-b-listener-ip }}
        BRIDGE_C: ${{ inputs.bridge-c }}
        GATEWAY_C_IP: ${{ inputs.bridge-c-gateway-ip }}
        LISTENER_C_IP: ${{ inputs.bridge-c-listener-ip }}
        LISTENER_PREFIX_LENGTH: ${{ inputs.listener-prefix-length }}
        LISTENER_PORT: ${{ inputs.listener-port }}
      run: |
        set -euo pipefail

        # Every listener gets a default route through its own segment's
        # host address, the same route assert-site-isolation gives its
        # probe namespaces. An on-link address alone lets a listener
        # RECEIVE a probe from another segment but never answer it, so
        # both halves of this probe would read "timed out" no matter
        # what the forwarding policy did.
        create_listener() {
          tag="$1"; bridge="$2"; ip="$3"; gateway="$4"
          netns="kezio-fwd-listener-${tag}"
          veth_host="kzfl${tag}-h"
          veth_ns="kzfl${tag}-n"

          sudo ip netns add "${netns}"
          sudo ip link add "${veth_host}" type veth peer name "${veth_ns}"
          sudo ip link set "${veth_host}" master "${bridge}"
          sudo ip link set "${veth_host}" up
          sudo ip link set "${veth_ns}" netns "${netns}"
          sudo ip netns exec "${netns}" ip link set lo up
          sudo ip netns exec "${netns}" ip link set "${veth_ns}" up
          sudo ip netns exec "${netns}" ip addr add "${ip}/${LISTENER_PREFIX_LENGTH}" dev "${veth_ns}"
          sudo ip netns exec "${netns}" ip route add default via "${gateway}"

          # shellcheck disable=SC2024 # the redirect target is runner-writable; only the netns exec needs root.
          sudo ip netns exec "${netns}" python3 -m http.server --bind "${ip}" "${LISTENER_PORT}" \
            >"/tmp/kezio-fwd-listener-${tag}.log" 2>&1 &
          echo "$!" >"/tmp/kezio-fwd-listener-${tag}.pid"
        }

        create_listener a "${BRIDGE_A}" "${LISTENER_A_IP}" "${GATEWAY_A_IP}"
        create_listener b "${BRIDGE_B}" "${LISTENER_B_IP}" "${GATEWAY_B_IP}"
        create_listener c "${BRIDGE_C}" "${LISTENER_C_IP}" "${GATEWAY_C_IP}"
        sleep 1

    - name: Assert from segment A -- reaches B, does not reach C
      uses: ./.github/actions/assert-site-isolation
      with:
        bridge-name: ${{ inputs.bridge-a }}
        probe-cidr: ${{ inputs.bridge-a-probe-cidr }}
        gateway-ip: ${{ inputs.bridge-a-gateway-ip }}
        reachable-endpoints: "${{ inputs.bridge-b-listener-ip }}:${{ inputs.listener-port }}"
        unreachable-endpoints: "${{ inputs.bridge-c-listener-ip }}:${{ inputs.listener-port }}"
        unreachable-bridge-name: ${{ inputs.bridge-c }}
        timeout-seconds: ${{ inputs.timeout-seconds }}
        fast-threshold-ms: ${{ inputs.fast-threshold-ms }}
        netns-name: "kezio-fwd-probe-a"

    - name: Assert from segment B -- reaches A, does not reach C
      uses: ./.github/actions/assert-site-isolation
      with:
        bridge-name: ${{ inputs.bridge-b }}
        probe-cidr: ${{ inputs.bridge-b-probe-cidr }}
        gateway-ip: ${{ inputs.bridge-b-gateway-ip }}
        reachable-endpoints: "${{ inputs.bridge-a-listener-ip }}:${{ inputs.listener-port }}"
        unreachable-endpoints: "${{ inputs.bridge-c-listener-ip }}:${{ inputs.listener-port }}"
        unreachable-bridge-name: ${{ inputs.bridge-c }}
        timeout-seconds: ${{ inputs.timeout-seconds }}
        fast-threshold-ms: ${{ inputs.fast-threshold-ms }}
        netns-name: "kezio-fwd-probe-b"

    - name: Clean up the three listener namespaces
      if: always()
      shell: bash
      run: |
        set +e
        for tag in a b c; do
          if [ -f "/tmp/kezio-fwd-listener-${tag}.pid" ]; then
            sudo kill "$(cat "/tmp/kezio-fwd-listener-${tag}.pid")" 2>/dev/null
            rm -f "/tmp/kezio-fwd-listener-${tag}.pid" "/tmp/kezio-fwd-listener-${tag}.log"
          fi
          sudo ip netns del "kezio-fwd-listener-${tag}" 2>/dev/null
        done
        exit 0
