name: Create the provisioning NetworkAttachmentDefinitions

description: >-
  Creates the four Multus NetworkAttachmentDefinitions
  e2e-kubevirt-reusable.yml's "deploy-kubevirt" job (and
  e2e-scale-multisite-kubevirt.yml) attaches bootd, the opentracker/
  ezio-seeder swarm, and the target VM to on the provisioning bridge -
  see this action's own inline comments for why each NAD's ipam/tuning
  shape differs (static vs. empty ipam, the tuning-plugin rp_filter
  override on bootd's own attachment only). A fifth NAD,
  kezio-existing-dhcp-network, is created separately by
  .github/actions/deploy-existing-dhcp, travelling with the pod it
  belongs to instead of living here. Every address comes from the
  calling job's own env (PROVISIONING_BRIDGE, PROVISIONING_BOOTD_NET1_IP,
  PROVISIONING_TRACKER_NET1_IP, PROVISIONING_SEEDER_NET1_IP), not
  declared inputs - composite action steps run as part of the calling
  job, so that env is already in scope.

runs:
  using: composite
  steps:
    - name: Create the provisioning NetworkAttachmentDefinitions
      # Four NADs on the SAME bridge, split on purpose:
      # - kezio-boot-network (static ipam): bootd only, fixed address
      #   (dnsmasq binds to net1, BOOTD_SERVER_IP advertises it as TFTP
      #   next-server).
      # - kezio-tracker-network / kezio-seeder-network (static ipam, one
      #   NAD per pod since the static plugin hands every attaching pod
      #   the same address): fixed addresses for opentracker/ezio-seeder,
      #   matching config/seeder/README.md's data-network convention, so
      #   the seeder announces its bridge address directly with no NAT.
      # - kezio-boot-network-vm ("ipam": {}): the target VM's NIC must NOT
      #   get an IPAM'd network - a KubeVirt bridge-mode interface with
      #   IPAM makes virt-launcher run its own in-pod DHCP server that
      #   hands the guest the pod's (static, duplicate-hazard) address,
      #   hijacking real PXE DHCP (observed: a rogue in-pod server
      #   answered DISCOVER before bootd and PXE died with PXE-E16).
      #   Empty ipam lets the guest do real DHCP on the wire instead.
      # The "tuning" plugin on bootd's attachment forces net1's rp_filter
      # to 0: a DHCPDISCOVER's source 0.0.0.0/dest 255.255.255.255 can
      # otherwise be rejected by a strict/loose reverse-path check
      # depending on kernel version and inherited sysctl defaults.
      shell: bash
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: kezio-boot-network
          namespace: kezio-system
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "kezio-boot-network",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${PROVISIONING_BRIDGE}",
                  "ipam": {
                    "type": "static",
                    "addresses": [
                      {"address": "${PROVISIONING_BOOTD_NET1_IP}"}
                    ]
                  }
                },
                {
                  "type": "tuning",
                  "sysctl": {
                    "net.ipv4.conf.IFNAME.rp_filter": "0"
                  }
                }
              ]
            }
        EOF
        # One static address per NAD is correct for this single-Image lane;
        # a site with concurrent Image deploys needs one address per
        # concurrently active seeder Deployment instead - see
        # config/seeder/networkattachmentdefinition-whereabouts.example.yaml.
        for nad_spec in "kezio-tracker-network:${PROVISIONING_TRACKER_NET1_IP}" "kezio-seeder-network:${PROVISIONING_SEEDER_NET1_IP}"; do
          nad_name="${nad_spec%%:*}"
          nad_addr="${nad_spec#*:}"
          cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: ${nad_name}
          namespace: kezio-system
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "${nad_name}",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${PROVISIONING_BRIDGE}",
                  "ipam": {
                    "type": "static",
                    "addresses": [
                      {"address": "${nad_addr}"}
                    ]
                  }
                }
              ]
            }
        EOF
        done
        # No tuning chain here: the VM's traffic is bridged at L2 straight
        # through, so the pod netns's IP-layer rp_filter never sees it.
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: kezio-boot-network-vm
          namespace: kezio-system
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "kezio-boot-network-vm",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${PROVISIONING_BRIDGE}",
                  "ipam": {}
                }
              ]
            }
        EOF
