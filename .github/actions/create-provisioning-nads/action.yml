name: Create the provisioning NetworkAttachmentDefinitions

description: >-
  Creates the three Multus NetworkAttachmentDefinitions a BMC e2e lane
  attaches bootd, the opentracker/ezio-seeder swarm, and the target VM to
  on the provisioning bridge - see this action's own inline comments for
  why each NAD's ipam shape differs (static vs. empty ipam). A fourth
  NAD, belonging to a deploy-existing-dhcp pod, is created separately by
  that action, travelling with the pod it belongs to instead of living
  here.

  The seeder NAD's ipam accepts an optional route list
  (seeding-routes-json). A single-homed tracker or seeder pod
  (v1.multus-cni.io/default-network, no cluster network at all) has no
  path to a machine on a different segment of the same Site unless its
  one interface carries a route there - this is that route, placed at
  the ipam object's own "routes" key, which the CNI static plugin
  (https://www.cni.dev/plugins/current/ipam/static/), host-local
  (https://www.cni.dev/plugins/current/ipam/host-local/), and
  whereabouts (https://github.com/k8snetworkplumbingwg/whereabouts) all
  read directly under ipam. Defaults to no routes, so every existing
  caller's NADs come out byte-identical.

  kezio-seeder-network uses host-local, not static: it is shared by
  every seeder Deployment pod AND, single-homed, by the Site's tracker
  pod pinning its own address through a per-pod "ips" override (see
  internal/controller/site_tracker_deployment.go's
  trackerPodAnnotations). A static NAD hands the SAME address to every
  attaching pod, so the tracker and any seeder collide on one address
  the moment both are scheduled; host-local hands out a distinct pool
  address per pod. The pinned tracker address must itself lie INSIDE
  that pool: host-local refuses a requested address outside its own
  range and fails the pod's sandbox with "failed to allocate all
  requested IPs". kezio-boot-network stays static: bootd is its sole
  attacher. There is no dedicated tracker NAD - a Site's tracker
  single-homes on the seeding NAD instead.

inputs:
  namespace:
    description: Namespace the NetworkAttachmentDefinitions are created in - must match the Subnet's own namespace, since bootdNetworkRef/seederNetworkRef resolve unqualified names there.
    required: false
    default: "scaffold-system"
  bridge-name:
    description: 'Host Linux bridge every NAD attaches to, e.g. "kezio-prov0".'
    required: true
  bootd-net1-ip:
    description: 'Fixed net1 CIDR address for bootd, e.g. "192.0.2.2/24" - matches the Subnet''s bootdServerIP.'
    required: true
  seeder-net1-cidr:
    description: >-
      Subnet (network address + prefix, e.g. "192.0.2.0/24") the
      kezio-seeder-network host-local pool is carved out of. The pool
      itself is a fixed sub-range, above both the fixed low addresses
      and the DHCP lease range every caller places within the same /24
      (.101-.116) - see this action's own inline comment for why that
      range is safe against every other reservation on the same
      bridge, and for which address of it the caller must give the
      Site as tracker.ip.
    required: true
  seeding-routes-json:
    description: >-
      JSON array of CNI ipam route objects ({"dst": "<cidr>", "gw":
      "<optional next-hop>"}), applied to kezio-seeder-network's own
      ipam.routes - the Site's other segments a single-homed
      tracker/seeder pod needs a route to reach. Empty (the default)
      omits the "routes" key entirely, leaving the NAD unchanged from
      before this input existed.
    required: false
    default: "[]"

runs:
  using: composite
  steps:
    - name: Create the provisioning NetworkAttachmentDefinitions
      # Three NADs on the SAME bridge, split on purpose:
      # - kezio-boot-network (static ipam): bootd only, fixed address
      #   (dnsmasq binds to net1, BOOTD_SERVER_IP advertises it as TFTP
      #   next-server).
      # - kezio-seeder-network (host-local ipam, ranged pool): every
      #   seeder Deployment pod's own address, AND the Site's tracker
      #   pod's default network (with tracker.ip layered on top via a
      #   per-pod "ips" override) - see this action's own description
      #   for why that pairing needs a ranged pool instead of one
      #   static address.
      # - kezio-boot-network-vm ("ipam": {}): the target VM's NIC must NOT
      #   get an IPAM'd network - a KubeVirt bridge-mode interface with
      #   IPAM makes virt-launcher run its own in-pod DHCP server that
      #   hands the guest the pod's (static, duplicate-hazard) address,
      #   hijacking real PXE DHCP (observed: a rogue in-pod server
      #   answered DISCOVER before bootd and PXE died with PXE-E16).
      #   Empty ipam lets the guest do real DHCP on the wire instead.
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        PROVISIONING_BRIDGE: ${{ inputs.bridge-name }}
        BOOTD_NET1_IP: ${{ inputs.bootd-net1-ip }}
        SEEDER_NET1_CIDR: ${{ inputs.seeder-net1-cidr }}
        SEEDING_ROUTES_JSON: ${{ inputs.seeding-routes-json }}
      run: |
        set -euo pipefail
        # Empty input becomes an empty-string append (unchanged NAD
        # output, matching every existing caller); a non-empty list
        # becomes the ipam-level "routes" key every ipam type here
        # reads - see this action's own description.
        if [ "$(jq -c '.' <<<"${SEEDING_ROUTES_JSON}" | jq 'length')" -gt 0 ]; then
          ipam_routes=",\"routes\": $(jq -c '.' <<<"${SEEDING_ROUTES_JSON}")"
        else
          ipam_routes=""
        fi
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: kezio-boot-network
          namespace: ${NAMESPACE}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "kezio-boot-network",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${PROVISIONING_BRIDGE}",
                  "ipam": {
                    "type": "static",
                    "addresses": [
                      {"address": "${BOOTD_NET1_IP}"}
                    ]
                  }
                }
              ]
            }
        EOF

        # kezio-seeder-network: host-local, ranged .101-.116 within the
        # given /24. Every fixed address a caller reserves sits at
        # .1-.9 (host/bootd/existing-dhcp/tracker.ip); every caller that
        # also runs bootd's own DHCP hands leases to real netbooting
        # machines out of .10-.100 (LEASE_RANGE_START/END, the same
        # range deploy-existing-dhcp's dhcp-range mirrors). Both pools
        # sit on the SAME L2 bridge, so an address inside .10-.100
        # would still risk the exact collision this range exists to
        # avoid - a real machine's DHCP lease and a pod's host-local
        # address landing on the same IP - just moved to a different
        # pair of holders. .101-.116 sits above every one of those
        # reservations.
        #
        # The Site's tracker pins its own address on this same NAD, and
        # host-local refuses a requested address outside its range, so
        # tracker.ip must be one address OF this pool. It belongs at
        # the top, .116: host-local allocates upward from rangeStart,
        # so no seeder pod can take .116 before the tracker asks for
        # it. The pool must therefore hold every seeder pod that can
        # run at once PLUS that pinned address - here 15 seeder
        # addresses (.101-.115) for one Site's seeder Deployment (one
        # pod, replicas: 1), far more than it holds at once even across
        # a rolling update. A caller that raises seeder concurrency
        # must widen this range with it.
        seeder_network_addr="${SEEDER_NET1_CIDR%%/*}"
        seeder_prefix="${SEEDER_NET1_CIDR##*/}"
        seeder_base="${seeder_network_addr%.*}"
        seeder_range_start="${seeder_base}.101"
        seeder_range_end="${seeder_base}.116"
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: kezio-seeder-network
          namespace: ${NAMESPACE}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "kezio-seeder-network",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${PROVISIONING_BRIDGE}",
                  "ipam": {
                    "type": "host-local",
                    "subnet": "${seeder_network_addr}/${seeder_prefix}",
                    "rangeStart": "${seeder_range_start}",
                    "rangeEnd": "${seeder_range_end}"${ipam_routes}
                  }
                }
              ]
            }
        EOF
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: kezio-boot-network-vm
          namespace: ${NAMESPACE}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "kezio-boot-network-vm",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${PROVISIONING_BRIDGE}",
                  "ipam": {}
                }
              ]
            }
        EOF
