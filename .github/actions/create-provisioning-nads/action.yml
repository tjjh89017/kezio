name: Create the provisioning NetworkAttachmentDefinitions

description: >-
  Creates the four Multus NetworkAttachmentDefinitions
  e2e-kubevirt-reusable.yml's "deploy-kubevirt" job (and
  e2e-scale-multisite-kubevirt.yml) attaches bootd, the opentracker/
  ezio-seeder swarm, and the target VM to on the provisioning bridge -
  see this action's own inline comments for why each NAD's ipam/tuning
  shape differs (static vs. empty ipam, the tuning-plugin rp_filter
  override on bootd's own attachment only). A fifth NAD,
  kezio-existing-dhcp-network, is created separately by
  .github/actions/deploy-existing-dhcp, travelling with the pod it
  belongs to instead of living here. Every address comes from the
  calling job's own env (PROVISIONING_BRIDGE, PROVISIONING_BOOTD_NET1_IP,
  PROVISIONING_TRACKER_NET1_IP, PROVISIONING_SEEDER_NET1_IP), not
  declared inputs - composite action steps run as part of the calling
  job, so that env is already in scope.

runs:
  using: composite
  steps:
    - name: Create the provisioning NetworkAttachmentDefinitions
      # FOUR NADs on the SAME bridge, split on purpose:
      #
      # kezio-boot-network (static ipam) is for the bootd pod ONLY.
      # bootd's net1 must carry a fixed address
      # (PROVISIONING_BOOTD_NET1_IP) on the provisioning subnet -
      # dnsmasq binds its DHCP sockets to net1, and BOOTD_SERVER_IP
      # advertises it as the TFTP next-server. Every other address on
      # this bridge (the existing-dhcp pod's, the tracker's, the
      # seeder's) is its own static Multus attachment, so none of them
      # ever collide.
      #
      # kezio-tracker-network / kezio-seeder-network (static ipam) are
      # for the opentracker and ezio-seeder pods, one each, so every
      # swarm participant sits directly on this bridge with a fixed
      # address (PROVISIONING_TRACKER_NET1_IP /
      # PROVISIONING_SEEDER_NET1_IP) - the e2e realization of
      # config/seeder/README.md's data-network requirement (the
      # commented-out k8s.v1.cni.cncf.io/networks annotation both
      # production Deployments carry; see
      # networkattachmentdefinition.example.yaml). The seeder's announce
      # then leaves its own net1 (the static /24 gives it the connected
      # route) with its bridge address as the source, and the tracker
      # registers it at an address that is on-link for the target VM -
      # announce IP == reachable IP, no NAT anywhere (the no-NAT rule).
      # One NAD per pod because the static ipam plugin hands every
      # attaching pod the same address; a shared NAD would assign
      # duplicates. No tuning chain either: unlike bootd's net1, these
      # carry ordinary unicast within the /24, which the connected route
      # already satisfies under any rp_filter setting.
      #
      # kezio-boot-network-vm ("ipam": {}) is for the target VM's
      # provisioning NIC. The VM must NOT attach the static-ipam NAD:
      # when a KubeVirt bridge-mode interface's network carries IPAM,
      # virt-launcher starts its own in-pod DHCP server on that NIC to
      # hand the pod's CNI-assigned address to the guest - and the
      # static plugin hands EVERY attaching pod the same address, so
      # that rogue server offers the guest bootd's own 192.0.2.2
      # (observed live: a 169.254.75.10 server answered every DISCOVER
      # before bootd with Your-IP 192.0.2.2, the firmware took it and
      # PXE died with PXE-E16). With empty ipam virt-launcher runs no
      # DHCP there, and the guest firmware does real DHCP on the wire
      # against bootd and the existing-dhcp stand-in server (dhcp_
      # scenario permitting), which is exactly what this lane must
      # exercise.
      #
      # Chains the "tuning" CNI plugin onto the plain bridge attachment
      # to force net1's reverse-path filter loose (rp_filter=0) inside
      # bootd's own network namespace, IFNAME substituted by the tuning
      # plugin for whatever interface name the bridge plugin gave this
      # attachment (net1 here). A DHCPDISCOVER arrives with source
      # 0.0.0.0, destination 255.255.255.255 - a source address a
      # strict/loose reverse-path check can still refuse to accept
      # depending on kernel version and the namespace's inherited
      # sysctl defaults, and unlike a host-wide sysctl this setting
      # lives with the attachment itself (config/bootd's own
      # NetworkAttachmentDefinition example carries the same plugin so
      # a real deployment gets it too), reaching only bootd's net1
      # rather than every interface on the node.
      shell: bash
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: kezio-boot-network
          namespace: kezio-system
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "kezio-boot-network",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${PROVISIONING_BRIDGE}",
                  "ipam": {
                    "type": "static",
                    "addresses": [
                      {"address": "${PROVISIONING_BOOTD_NET1_IP}"}
                    ]
                  }
                },
                {
                  "type": "tuning",
                  "sysctl": {
                    "net.ipv4.conf.IFNAME.rp_filter": "0"
                  }
                }
              ]
            }
        EOF
        # One static address per NAD is correct here: this lane runs a
        # single central tracker and, at most, one seeder Deployment at
        # a time (single-Image lane). A site where several Images can
        # be deploying concurrently needs one address per concurrently
        # active seeder Deployment instead - see
        # config/seeder/networkattachmentdefinition-whereabouts.example.yaml
        # and config/seeder/README.md's "Provisioning-segment address
        # pool" section for that shape; do not convert this lane's NADs
        # to it.
        for nad_spec in "kezio-tracker-network:${PROVISIONING_TRACKER_NET1_IP}" "kezio-seeder-network:${PROVISIONING_SEEDER_NET1_IP}"; do
          nad_name="${nad_spec%%:*}"
          nad_addr="${nad_spec#*:}"
          cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: ${nad_name}
          namespace: kezio-system
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "${nad_name}",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${PROVISIONING_BRIDGE}",
                  "ipam": {
                    "type": "static",
                    "addresses": [
                      {"address": "${nad_addr}"}
                    ]
                  }
                }
              ]
            }
        EOF
        done
        # No tuning chain here: the VM's traffic is bridged at L2
        # straight through virt-launcher's pod into the guest, so the
        # pod netns's IP-layer reverse-path filter never sees it.
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: kezio-boot-network-vm
          namespace: kezio-system
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "kezio-boot-network-vm",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${PROVISIONING_BRIDGE}",
                  "ipam": {}
                }
              ]
            }
        EOF
