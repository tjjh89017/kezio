name: Assert the boot actually went over HTTP, not PXE

description: >-
  The three discriminating assertions that prove a machine's net boot
  really travelled the UEFI HTTP Boot path rather than quietly degrading
  to PXE once the firmware-attempted check (assert-http-boot-attempted)
  has already passed:
    1. bootd's dnsmasq log still shows the HTTPClient-tagged exchange for
       the target MAC (re-asserted here against the full boot, not just
       the bounded early window the fast-fail gate used).
    2. the boot config server's request log (proxied through bootd,
       logged by the controller-manager pod - see
       internal/bootserver/logging.go) shows both the shim EFI binary and
       a GRUB config fetched over GET /boot/http/... with a 2xx status -
       the actual UEFI HTTP Boot data-plane traffic, not just the DHCP
       handshake.
    3. bootd's TFTP server (internal/bootd/tftp.go) never completed a
       transfer - absence asserted, not merely unchecked, since a
       firmware that fell back to PXE after all would still leave the
       HTTPClient DHCP evidence behind from its earlier, abandoned HTTP
       attempt.

inputs:
  namespace:
    description: Namespace the bootd Deployment and controller-manager live in.
    required: false
    default: "scaffold-system"
  bootd-deployment-name:
    description: 'Name of the Subnet''s bootd Deployment, e.g. "kezio-bootd-<subnet-name>".'
    required: true
  mac:
    description: The target VM's provisioning MAC address.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve the controller-manager Deployment
      id: resolve
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        manager_deployment="$(kubectl get deployment -n "${NAMESPACE}" -l control-plane=controller-manager \
          -o jsonpath='{.items[0].metadata.name}')"
        echo "manager-deployment=${manager_deployment}" >> "$GITHUB_OUTPUT"

    - name: Assert the HTTPClient DHCP exchange happened for this MAC
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        BOOTD_DEPLOYMENT_NAME: ${{ inputs.bootd-deployment-name }}
        MAC: ${{ inputs.mac }}
      run: |
        set -euo pipefail
        mac_lower="$(echo "${MAC}" | tr '[:upper:]' '[:lower:]')"
        bootd_log="$(kubectl -n "${NAMESPACE}" logs deployment/"${BOOTD_DEPLOYMENT_NAME}" -c bootd --tail=-1 | tr '[:upper:]' '[:lower:]')"
        if ! grep -qF "${mac_lower}" <<<"${bootd_log}" || ! grep -qF "vendor class: httpclient" <<<"${bootd_log}"; then
          echo "::error::bootd's dnsmasq log shows no HTTPClient vendor-class DHCP exchange for ${MAC}" >&2
          kubectl -n "${NAMESPACE}" logs deployment/"${BOOTD_DEPLOYMENT_NAME}" -c bootd --tail=-1
          exit 1
        fi
        echo "Confirmed: HTTPClient vendor-class DHCP exchange present for ${MAC}."

    - name: Assert the shim and a GRUB config were fetched over HTTP
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        MANAGER_DEPLOYMENT: ${{ steps.resolve.outputs.manager-deployment }}
      run: |
        set -euo pipefail
        manager_log="$(kubectl -n "${NAMESPACE}" logs deployment/"${MANAGER_DEPLOYMENT}" -c manager --tail=-1)"

        # logRequests (internal/bootserver/logging.go) logs "path" and
        # "status" through controller-runtime's structured logger, whose
        # encoder (JSON vs console) is a deployment choice this action
        # does not assume - matching on the bare path substring, then
        # checking the same line carries no 4xx/5xx status marker, holds
        # under either encoding.
        shim_fetch="$(grep -F "/boot/http/shimx64.efi" <<<"${manager_log}" || true)"
        if [ -z "${shim_fetch}" ]; then
          echo "::error::no GET /boot/http/shimx64.efi request logged by the boot config server - the shim was never fetched over HTTP" >&2
          echo "${manager_log}"
          exit 1
        fi
        if grep -qE '"?status"?[:=" ]+[45][0-9]{2}' <<<"${shim_fetch}"; then
          echo "::error::GET /boot/http/shimx64.efi was requested but answered with an error status: ${shim_fetch}" >&2
          exit 1
        fi

        grub_fetch="$(grep -E "/(grub/grub\.cfg|boot/http/grub/)" <<<"${manager_log}" || true)"
        if [ -z "${grub_fetch}" ]; then
          echo "::error::no GET /grub/grub.cfg or /boot/http/grub/... request logged by the boot config server - GRUB never searched for its config over HTTP" >&2
          echo "${manager_log}"
          exit 1
        fi
        if grep -qE '"?status"?[:=" ]+[45][0-9]{2}' <<<"${grub_fetch}"; then
          echo "::error::GRUB's config search request answered with an error status: ${grub_fetch}" >&2
          exit 1
        fi
        echo "Confirmed: shim and a GRUB config were both fetched over HTTP with no error status."

    - name: Assert TFTP never completed a transfer
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        BOOTD_DEPLOYMENT_NAME: ${{ inputs.bootd-deployment-name }}
      run: |
        set -euo pipefail
        bootd_log="$(kubectl -n "${NAMESPACE}" logs deployment/"${BOOTD_DEPLOYMENT_NAME}" -c bootd --tail=-1)"
        if grep -qF "served TFTP file" <<<"${bootd_log}"; then
          echo "::error::bootd's TFTP server completed a transfer - the boot fell back to PXE instead of staying on HTTP Boot" >&2
          grep -F "served TFTP file" <<<"${bootd_log}"
          exit 1
        fi
        echo "Confirmed: no TFTP transfer was ever completed on this Subnet's bootd."
