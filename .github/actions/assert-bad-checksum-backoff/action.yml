name: Assert a bad checksum sets error with backoff

description: >-
  Proves the negative-test line stage4b's own plan lists beside the
  two-axis status proof: "a bad checksum sets error with backoff" - and,
  unlike assert-two-axis-status's plan-build injection, this failure must
  surface from the real deploy pipeline: a genuine DeployRun is created,
  the live agent actually attempts the write, and it fails the real
  content-integrity check the BitTorrent transfer enforces.

  Where the checksum is actually enforced: internal/ingest.VerifyChecksum
  runs exactly once, inside the ingest Job, against the immutable
  Image.spec.source.checksum - not reachable again once an Image is
  Ready (ImageSpec's own XValidation rule is "self == oldSelf"), so it
  cannot be the injection point for a live retry. PartitionContentSpec is
  likewise immutable and is itself named by its content's info hash, so
  there is no mutable "recorded hash" CR field anywhere on the read path
  planbuild.buildTorrent (internal/planbuild/slots.go) walks: it derives
  agentapi.DeployTorrent.InfoHash straight from the PartitionContent
  object's own name. The one mutable place a checksum-shaped value lives
  on the actual deploy path is the generated content.torrent file
  (store.ContentTorrentPath) sitting in that content's own PVC -
  store.BuildInfoDict (internal/store/torrent.go) bencodes a "pieces" key
  whose value is the concatenation of every piece's SHA-1 hash, and ezio
  (this repo's BitTorrent daemon, tmp/ezio/daemon.cpp's add_torrent)
  parses that file synchronously inside AddTorrent, checking the decode
  error and rejecting a structurally invalid pieces blob (its length is
  meant to be an exact multiple of the 20-byte SHA-1 digest) before ever
  joining a swarm.

  Flipping a byte *inside* one piece's recorded hash (a true value-level
  checksum mismatch) was deliberately rejected as the injection
  mechanism: internal/agent/deploy's Executor.seedUntilStopped
  (deploy.go) has no self-timeout and this Machine's own agent is the
  only seeder-adjacent peer serving always-correct bytes against an
  always-wrong recorded hash, so libtorrent would simply keep
  rejecting/re-requesting that one piece forever - an unbounded hang, not
  a "sets error" outcome any wait loop here could observe without
  flaking. This action instead corrupts the "pieces" value's own
  bencoded *length* prefix (decrementing it by one byte, so the
  recorded piece-hash table is no longer a whole multiple of the 20-byte
  digest size) - a genuine corruption of the recorded checksum data that
  fails synchronously and deterministically at AddTorrent, before any
  network byte moves, giving a bounded failure this action can wait for.

  Ordering and cleanup: because this failure surfaces once a real
  DeployRun exists (not assert-two-axis-status's plan-build pre-check),
  simply leaving the Machine's spec patched and letting deploy-machine's
  own merge patch overwrite it - the sibling action's recovery mechanism
  - is not the mechanism this action itself watches for, so it runs
  strictly before deploy-machine and does the two things
  assert-two-axis-status never had to: it sets the Machine's own deploy
  intent itself (there is no plan-build pre-check to fail before a
  DeployRun exists), and once status.errorCount has shown at least two
  real retries of the same run, it restores the corrupted content.torrent
  so deploy-machine's own unmodified patch+wait (called right after,
  redundantly re-applying the same spec values) is still what proves
  recovery to Provisioned - exactly like the sibling action.

  What retries the run, traced through machine_controller.go and
  internal/deployer/agent.go: provisionResultFromPhase reports
  MachineErrorTypeRestart (not Transient) for an agent-reported Failed
  DeployRun - the agent that reported Failed has abandoned its attempt,
  so nothing about the run's recorded phase/partitions/timings/
  conditions is worth resuming, the same condition MachineErrorType's own
  doc comment describes for Restart. restartOnFailure(machine) then asks
  the *next* Provision call to discard that state and start over:
  AgentDeployer.Provision's resetProvisionAttempt wipes run's status back
  to freshly-created and startProvision re-arms PXE and power-cycles the
  same Machine, so the SAME DeployRun object (status.currentRunRef never
  changes) reboots into the live agent and re-executes the same plan
  against the still-corrupted content - failing the same way, since this
  action has not restored it yet. No deletion is involved: unlike
  recordCurrentRunDeleted's path (a DeployRun that disappeared out from
  under a live deployment), an agent-reported Failed run is retried in
  place. Deleting it here would not be wrong, but it would replace this
  action's own evidence (the same run's errorCount climbing) with a
  second, unrelated run object for no benefit - restoring the content and
  letting the DeployRun already in flight pick up the fix on its own next
  restart is both simpler and closer to what the fix actually guarantees.

  Backoff evidence: machine_controller.go's recordFailure requeues a
  failed Machine after the constant failedRequeueInterval (30s), not an
  exponential curve. errorCount is not reset by a restart succeeding
  (clearRetryStatus's own doc comment: a restart is a discarded attempt
  at the same unfinished goal, not a success), so it keeps climbing by
  one per failed restart cycle - but each cycle is a *full* PXE-boot and
  registration cycle (internal/deployer's own 5-minute
  agentDeployerProvisionBootDeadline), not just the flat 30s backoff, so
  error-count-timeout must absorb that, the same magnitude
  assert-abort-mid-write's own write-phase-timeout budgets for the same
  reason.

inputs:
  machine-name:
    description: Name of the Machine to inject the failure onto. Must already be Available (see wait-agent-registered) with no deploy intent set yet.
    required: true
  namespace:
    description: Namespace the Machine, its Image, its PartitionContent(s), and the debug pod this action creates all live in.
    required: false
    default: "scaffold-system"
  image-name:
    description: >-
      Name of an already-Ready Image (e.g. build-deploy-test-image's own
      output) to write to spec.imageRef.name and whose referenced
      content this action corrupts. Must be Ready, and every slot with a
      contentRef must resolve to a Ready PartitionContent - both are
      already guaranteed once the Image itself is Ready.
    required: true
  posthook-names:
    description: >-
      Newline-separated PostHook names, written in order to
      spec.postHookRefs - same contract and default pairing as
      deploy-machine's own posthook-names input (naming any hook at all
      opts out of the kezio-default-finalize substitution, so a
      chrootScript hook here must be paired with it). Kept identical to
      deploy-machine's own default so the plan this action's failing
      attempt builds is the same shape deploy-machine's own happy-path
      attempt builds right after.
    required: false
    default: |
      kezio-e2e-deploy-marker
      kezio-default-finalize
  debug-pod-image:
    description: >-
      Image the throwaway content-corruption pod runs - needs python3
      only, to do the "pieces" length-prefix edit precisely (bencode
      byte-string values are length-prefixed, and the piece-hash table's
      byte length is not fixed, so a plain byte-offset patch cannot be
      done reliably with text tools alone).
    required: false
    default: "python:3.12-alpine"
  provisioning-timeout:
    description: >-
      Timeout to wait for status.currentRunRef to be set (the deploy
      intent patch below reaching a started DeployRun) after this action
      patches the deploy intent, in seconds as an integer, optionally
      suffixed with s.
    required: false
    default: "120s"
  error-count-timeout:
    description: >-
      Timeout to wait for status.errorCount to reach 2 or more on the
      same retried DeployRun, in seconds as an integer, optionally
      suffixed with s. Generous: reaching 2 needs a full restart cycle
      (PXE-boot, agent registration, and a fresh write attempt against
      the still-corrupted content) after the first failure, not just the
      flat 30s backoff - see this action's own description.
    required: false
    default: "900s"
  recovery-timeout:
    description: >-
      Timeout to wait, after restoring the corrupted content, for the
      same DeployRun's status.phase to move off "Failed" again -
      evidence its own next automatic restart picked up the fix, before
      handing off to deploy-machine's own wait. Same magnitude as
      error-count-timeout and for the same reason: this is another full
      restart cycle, not an instant retry.
    required: false
    default: "900s"

runs:
  using: composite
  steps:
    - name: Resolve the Image's content-bearing slots and their PVCs
      id: resolve
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        set -euo pipefail

        content_names="$(kubectl get image "${IMAGE_NAME}" -n "${NAMESPACE}" -o json \
          | jq -r '[.spec.layout.slots[] | select(.contentRef != null) | .contentRef.name] | .[]')"
        if [ -z "${content_names}" ]; then
          echo "::error::Image ${IMAGE_NAME} has no slot with a contentRef - nothing for this action to corrupt" >&2
          exit 1
        fi

        : >"${RUNNER_TEMP}/bad-checksum-contents.txt"
        i=0
        while IFS= read -r content_name; do
          [ -z "${content_name}" ] && continue
          pvc_name="$(kubectl get partitioncontent "${content_name}" -n "${NAMESPACE}" -o jsonpath='{.status.pvcRef.name}')"
          if [ -z "${pvc_name}" ]; then
            echo "::error::partitioncontent ${content_name} has no status.pvcRef.name yet - it must be Ready before this action runs" >&2
            exit 1
          fi
          echo "${content_name} ${pvc_name} /content-${i}" >>"${RUNNER_TEMP}/bad-checksum-contents.txt"
          i=$((i + 1))
        done <<<"${content_names}"

        echo "resolved $(wc -l <"${RUNNER_TEMP}/bad-checksum-contents.txt") content-bearing slot(s):"
        cat "${RUNNER_TEMP}/bad-checksum-contents.txt"

    - name: Start a debug pod mounting every content PVC read-write
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        DEBUG_POD_IMAGE: ${{ inputs.debug-pod-image }}
      run: |
        set -euo pipefail

        {
          cat <<EOF
        apiVersion: v1
        kind: Pod
        metadata:
          name: kezio-e2e-bad-checksum-debug
          namespace: ${NAMESPACE}
          labels:
            app.kubernetes.io/name: kezio-e2e-bad-checksum-debug
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: debug
              image: ${DEBUG_POD_IMAGE}
              command: ["sleep", "3600"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
        EOF
          while read -r _content_name pvc_name mount_path; do
            cat <<EOF
                - name: ${pvc_name}
                  mountPath: ${mount_path}
        EOF
          done <"${RUNNER_TEMP}/bad-checksum-contents.txt"
          cat <<EOF
          volumes:
        EOF
          while read -r _content_name pvc_name _mount_path; do
            cat <<EOF
            - name: ${pvc_name}
              persistentVolumeClaim:
                claimName: ${pvc_name}
        EOF
          done <"${RUNNER_TEMP}/bad-checksum-contents.txt"
        } >"${RUNNER_TEMP}/bad-checksum-debug-pod.yaml"

        kubectl apply -f "${RUNNER_TEMP}/bad-checksum-debug-pod.yaml"
        kubectl wait --for=condition=Ready pod/kezio-e2e-bad-checksum-debug -n "${NAMESPACE}" --timeout=120s

    - name: Corrupt every content's recorded piece-hash table length
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail

        : >"${RUNNER_TEMP}/bad-checksum-original-lengths.txt"
        while read -r content_name _pvc_name mount_path; do
          original_len="$(kubectl exec -i kezio-e2e-bad-checksum-debug -n "${NAMESPACE}" -- \
            python3 - "${mount_path}/content.torrent" corrupt 0 <<'PY'
        import sys

        path, mode, target_len = sys.argv[1], sys.argv[2], sys.argv[3]
        data = bytearray(open(path, "rb").read())
        key = b"6:pieces"
        idx = data.find(key)
        if idx < 0:
            sys.exit("pieces key not found in " + path)
        i = idx + len(key)
        j = data.index(b":", i)
        current_len = int(data[i:j])

        if mode == "corrupt":
            new_len = current_len - 1
        elif mode == "restore":
            new_len = int(target_len)
        else:
            sys.exit("unknown mode " + mode)

        data[i:j] = str(new_len).encode()
        with open(path, "wb") as f:
            f.write(data)
        print(current_len)
        PY
          )"
          echo "${content_name} ${original_len}" >>"${RUNNER_TEMP}/bad-checksum-original-lengths.txt"
          echo "corrupted ${content_name}'s content.torrent: pieces length ${original_len} -> $((original_len - 1))"
        done <"${RUNNER_TEMP}/bad-checksum-contents.txt"

    - name: Set the failing deploy intent
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        MACHINE_NAME: ${{ inputs.machine-name }}
        IMAGE_NAME: ${{ inputs.image-name }}
        POSTHOOK_NAMES: ${{ inputs.posthook-names }}
      run: |
        set -euo pipefail
        if [ -n "${POSTHOOK_NAMES}" ] && ! grep -qxF "kezio-default-finalize" <<<"${POSTHOOK_NAMES}"; then
          echo "::error::posthook-names names one or more hooks but omits kezio-default-finalize - see deploy-machine's own doc comment for why" >&2
          exit 1
        fi
        posthook_refs="$(jq -nR '[inputs | select(length > 0) | {name: .}]' <<<"${POSTHOOK_NAMES}")"
        patch="$(jq -n --arg image "${IMAGE_NAME}" --argjson postHookRefs "${posthook_refs}" \
          '{spec: {imageRef: {name: $image}, postHookRefs: $postHookRefs}}')"
        kubectl patch machine "${MACHINE_NAME}" -n "${NAMESPACE}" --type=merge -p "${patch}"

    - name: Wait for a real DeployRun to start against the corrupted content
      id: started
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        MACHINE_NAME: ${{ inputs.machine-name }}
        TIMEOUT: ${{ inputs.provisioning-timeout }}
      run: |
        set -euo pipefail
        if [[ ! "${TIMEOUT}" =~ ^[0-9]+s?$ ]]; then
          echo "::error::invalid provisioning-timeout '${TIMEOUT}': want seconds like 120 or 120s" >&2
          exit 1
        fi
        deadline=$(( $(date +%s) + ${TIMEOUT%s} ))

        while true; do
          machine_json="$(kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o json)"
          state="$(jq -r '.status.state // ""' <<<"${machine_json}")"
          run_name="$(jq -r '.status.currentRunRef.name // ""' <<<"${machine_json}")"
          echo "$(date -Is) Machine status.state=${state:-<empty>} currentRunRef=${run_name:-<none>}"

          if [ -n "${run_name}" ]; then
            if [ "${state}" != "Provisioning" ]; then
              echo "::error::status.currentRunRef=${run_name} is set but status.state=${state:-<empty>}, want Provisioning" >&2
              kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o yaml || true
              exit 1
            fi
            echo "run-name=${run_name}" >>"${GITHUB_OUTPUT}"
            break
          fi
          if [ "${state}" != "" ] && [ "${state}" != "Available" ] && [ "${state}" != "Provisioning" ]; then
            echo "::error::status.state=${state} before a DeployRun even started - want Available or Provisioning" >&2
            kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o yaml || true
            exit 1
          fi

          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::status.currentRunRef was never set within ${TIMEOUT} - no DeployRun started for the failing deploy intent" >&2
            kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o yaml || true
            exit 1
          fi
          sleep 5
        done

    - name: Wait for status.errorCount to show a real retry of the same failed run
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        MACHINE_NAME: ${{ inputs.machine-name }}
        RUN_NAME: ${{ steps.started.outputs.run-name }}
        TIMEOUT: ${{ inputs.error-count-timeout }}
      run: |
        set -euo pipefail
        if [[ ! "${TIMEOUT}" =~ ^[0-9]+s?$ ]]; then
          echo "::error::invalid error-count-timeout '${TIMEOUT}': want seconds like 900 or 900s" >&2
          exit 1
        fi
        deadline=$(( $(date +%s) + ${TIMEOUT%s} ))

        dump_and_fail() {
          echo "::error::$1" >&2
          echo "===== Machine ${MACHINE_NAME} ====="
          kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o yaml || true
          echo "===== DeployRun ${RUN_NAME} ====="
          kubectl get deployrun "${RUN_NAME}" -n "${NAMESPACE}" -o yaml || true
          exit 1
        }

        while true; do
          machine_json="$(kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o json)"
          state="$(jq -r '.status.state // ""' <<<"${machine_json}")"
          operational_status="$(jq -r '.status.operationalStatus // ""' <<<"${machine_json}")"
          error_type="$(jq -r '.status.errorType // ""' <<<"${machine_json}")"
          error_count="$(jq -r '.status.errorCount // 0' <<<"${machine_json}")"
          polled_run_name="$(jq -r '.status.currentRunRef.name // ""' <<<"${machine_json}")"
          echo "$(date -Is) Machine status.state=${state:-<empty>} operationalStatus=${operational_status:-<empty>} errorType=${error_type:-<empty>} errorCount=${error_count} currentRunRef=${polled_run_name:-<none>}"

          if [ "${state}" != "Provisioning" ]; then
            dump_and_fail "status.state=${state:-<empty>} while waiting for the injected checksum failure to back off - want Provisioning throughout (state must never move because of an operationalStatus error)"
          fi
          if [ "${polled_run_name}" != "${RUN_NAME}" ]; then
            dump_and_fail "status.currentRunRef changed from ${RUN_NAME} to ${polled_run_name:-<empty>} before errorCount reached 2 - an agent-reported Failed run retries in place (resetProvisionAttempt/startProvision), it must never be replaced by a different run object here"
          fi

          if [ "${operational_status}" = "error" ] && [ "${error_count}" -ge 2 ]; then
            if [ "${error_type}" != "Restart" ]; then
              dump_and_fail "status.errorType=${error_type:-<empty>}, want Restart - an agent-reported Failed DeployRun classifies as MachineErrorTypeRestart (provisionResultFromPhase), so the controller's next Provision call retries this same run from scratch"
            fi
            break
          fi

          if [ "$(date +%s)" -ge "${deadline}" ]; then
            dump_and_fail "status.errorCount did not reach 2 with operationalStatus=error within ${TIMEOUT}"
          fi
          sleep 5
        done

        phase="$(kubectl get deployrun "${RUN_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.phase}')"
        succeeded_condition="$(kubectl get deployrun "${RUN_NAME}" -n "${NAMESPACE}" -o json | jq -r '(.status.conditions // []) | map(select(.type == "Succeeded")) | first | .status // ""')"
        echo "DeployRun ${RUN_NAME}: status.phase=${phase:-<empty>} status.conditions[type=Succeeded].status=${succeeded_condition:-<empty>}"
        if [ "${phase}" != "Failed" ]; then
          dump_and_fail "DeployRun ${RUN_NAME} status.phase=${phase:-<empty>}, want Failed"
        fi
        if [ "${succeeded_condition}" != "False" ]; then
          dump_and_fail "DeployRun ${RUN_NAME} status.conditions has no Succeeded condition with status=False (got '${succeeded_condition:-<empty>}')"
        fi

        echo "bad checksum proven: status.state stayed Provisioning, operationalStatus reached error with errorCount=${error_count} on DeployRun ${RUN_NAME} (phase Failed)"

    - name: Restore every content's original piece-hash table length
      if: always()
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        if [ ! -s "${RUNNER_TEMP}/bad-checksum-original-lengths.txt" ]; then
          echo "no recorded original lengths - nothing to restore (an earlier step must have failed before corrupting anything)"
          exit 0
        fi
        while read -r content_name original_len; do
          mount_path="$(awk -v c="${content_name}" '$1 == c { print $3 }' "${RUNNER_TEMP}/bad-checksum-contents.txt")"
          kubectl exec -i kezio-e2e-bad-checksum-debug -n "${NAMESPACE}" -- \
            python3 - "${mount_path}/content.torrent" restore "${original_len}" <<'PY'
        import sys

        path, mode, target_len = sys.argv[1], sys.argv[2], sys.argv[3]
        data = bytearray(open(path, "rb").read())
        key = b"6:pieces"
        idx = data.find(key)
        if idx < 0:
            sys.exit("pieces key not found in " + path)
        i = idx + len(key)
        j = data.index(b":", i)
        current_len = int(data[i:j])

        if mode == "corrupt":
            new_len = current_len - 1
        elif mode == "restore":
            new_len = int(target_len)
        else:
            sys.exit("unknown mode " + mode)

        data[i:j] = str(new_len).encode()
        with open(path, "wb") as f:
            f.write(data)
        print(current_len)
        PY
          echo "restored ${content_name}'s content.torrent pieces length to ${original_len}"
        done <"${RUNNER_TEMP}/bad-checksum-original-lengths.txt"

    - name: Wait for the same DeployRun's own next restart to pick up the fix
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        MACHINE_NAME: ${{ inputs.machine-name }}
        RUN_NAME: ${{ steps.started.outputs.run-name }}
        TIMEOUT: ${{ inputs.recovery-timeout }}
      run: |
        set -euo pipefail
        if [ -z "${RUN_NAME}" ]; then
          echo "no DeployRun was ever started - nothing to wait for"
          exit 0
        fi
        if [[ ! "${TIMEOUT}" =~ ^[0-9]+s?$ ]]; then
          echo "::error::invalid recovery-timeout '${TIMEOUT}': want seconds like 900 or 900s" >&2
          exit 1
        fi
        deadline=$(( $(date +%s) + ${TIMEOUT%s} ))

        # No deletion here: an agent-reported Failed DeployRun retries in
        # place (see this action's own description), so
        # status.currentRunRef stays RUN_NAME throughout - the same run
        # object's own status.phase moving off "Failed" is the evidence a
        # fresh restart actually started against the now-restored content.
        while true; do
          run_name="$(kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.currentRunRef.name}' || true)"
          phase="$(kubectl get deployrun "${RUN_NAME}" -n "${NAMESPACE}" -o jsonpath='{.status.phase}' || true)"
          echo "$(date -Is) Machine status.currentRunRef=${run_name:-<none>} DeployRun ${RUN_NAME} status.phase=${phase:-<empty>}"

          if [ "${run_name}" != "${RUN_NAME}" ]; then
            echo "::error::status.currentRunRef changed from ${RUN_NAME} to ${run_name:-<empty>} - an agent-reported Failed run must retry in place, never be replaced by a different run object" >&2
            kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o yaml || true
            exit 1
          fi
          if [ -n "${phase}" ] && [ "${phase}" != "Failed" ]; then
            echo "DeployRun ${RUN_NAME} restarted and reached status.phase=${phase} against the restored content - handing off to deploy-machine's own wait"
            break
          fi

          if [ "$(date +%s)" -ge "${deadline}" ]; then
            echo "::error::DeployRun ${RUN_NAME} status.phase never moved off Failed within ${TIMEOUT}" >&2
            kubectl get machine "${MACHINE_NAME}" -n "${NAMESPACE}" -o yaml || true
            kubectl get deployrun "${RUN_NAME}" -n "${NAMESPACE}" -o yaml || true
            exit 1
          fi
          sleep 5
        done

    - name: Delete the debug pod
      if: always()
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
      run: kubectl delete pod kezio-e2e-bad-checksum-debug -n "${NAMESPACE}" --ignore-not-found --wait=false

    - name: Dump diagnostics on failure
      if: failure()
      uses: ./.github/actions/collect-diagnostics
      with:
        namespace: ${{ inputs.namespace }}
        workload-namespace: ${{ inputs.namespace }}
        output-path: assert-bad-checksum-backoff-diagnostics
