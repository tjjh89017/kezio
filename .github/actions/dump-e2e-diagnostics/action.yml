name: Dump E2E diagnostics on failure

description: >-
  The verbose, failure-only diagnostic dump e2e-kubevirt-reusable.yml's
  "deploy-kubevirt" job runs when any earlier step fails: kezio-system
  pod/Deployment logs (including each pod's securityContext, restart
  count, and previous-attempt crash logs), bootd's Multus attachment and
  net1 rp_filter/link state (read from inside its pod network namespace
  via crictl+nsenter), the ingest Job, per-Image seeder Deployment, VM/
  VMI/Machine/Image CRs, the host's FORWARD/mangle iptables rules and
  bridge offload settings, and KubeVirtBMC's own controller-manager logs,
  VirtualMachineBMC, and virtbmc pod/Service. Extracted verbatim from the
  reusable workflow's own two "Dump diagnostics on failure" / "Dump
  KubeVirtBMC diagnostics on failure" steps - moved, not redesigned - so
  read this file's own inline comments for the "why" behind each dump.

  Every command here relies on the calling job's own env (TARGET_VM_NAME,
  IMAGE_NAME, PROVISIONING_BRIDGE, SEEDER_DEPLOYMENT_NAME set earlier via
  GITHUB_ENV) rather than declared inputs - composite action steps run as
  part of the calling job, so that env is already in scope.

runs:
  using: composite
  steps:
    - name: Dump diagnostics on failure
      if: failure()
      shell: bash
      run: |
        set +e
        # Teed into a file too: one of the two files "Upload E2E
        # diagnostics artifacts" (in the calling workflow) picks up.
        exec > >(tee "${RUNNER_TEMP}/diagnostics-dump.log") 2>&1
        echo "===== nodes ====="
        kubectl get nodes -o wide
        echo "===== kezio-system pods ====="
        kubectl get pods -n kezio-system -o wide
        echo "===== controller-manager logs ====="
        kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=1000
        echo "===== controller-manager fetch-boot-artifacts initContainer logs ====="
        # kubectl logs --all-containers above does not include
        # initContainers. `deployment/kezio-controller-manager` (a
        # workload reference) can resolve to the OLD ReplicaSet's pod
        # during a rollout, which has no fetch-boot-artifacts container at
        # all - loop over the actual pods instead, and dump each one's
        # rendered securityContext too.
        for p in $(kubectl -n kezio-system get pods -l control-plane=controller-manager -o name); do
          echo "--- ${p} securityContext ---"
          kubectl -n kezio-system get "${p}" \
            -o jsonpath='{.spec.securityContext}{"\n"}{range .spec.initContainers[*]}{.name}{": "}{.securityContext}{"\n"}{end}'
          echo "--- ${p} restart count ---"
          kubectl -n kezio-system get "${p}" \
            -o jsonpath='{range .status.containerStatuses[*]}{.name}{": restartCount="}{.restartCount}{" lastState="}{.lastState}{"\n"}{end}'
          # --previous first: the current attempt's log starts fresh at
          # the restart, well after whatever caused a mid-run crash.
          echo "--- ${p} manager logs (--previous) ---"
          kubectl -n kezio-system logs "${p}" -c manager --previous --tail=500 || true
          echo "--- ${p} fetch-boot-artifacts logs (--previous) ---"
          kubectl -n kezio-system logs "${p}" -c fetch-boot-artifacts --previous --tail=200 || \
            kubectl -n kezio-system logs "${p}" -c fetch-boot-artifacts --tail=200 || true
        done
        echo "===== bootd logs ====="
        kubectl -n kezio-system logs deployment/kezio-bootd --all-containers --tail=1000
        echo "===== bootd fetch-boot-artifacts initContainer logs ====="
        for p in $(kubectl -n kezio-system get pods -l app.kubernetes.io/component=bootd -o name); do
          echo "--- ${p} securityContext ---"
          kubectl -n kezio-system get "${p}" \
            -o jsonpath='{.spec.securityContext}{"\n"}{range .spec.initContainers[*]}{.name}{": "}{.securityContext}{"\n"}{end}'
          # Multus attachment dumped explicitly: the requested annotation
          # only proves what was asked for, not what attached, and a CNI
          # ADD failure leaves bootd running normally on eth0 alone with
          # every PXE request silently timing out and nothing in its logs.
          echo "--- ${p} k8s.v1.cni.cncf.io/networks annotation (requested) ---"
          kubectl -n kezio-system get "${p}" \
            -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/networks}{"\n"}'
          echo "--- ${p} k8s.v1.cni.cncf.io/network-status annotation (actual, set by Multus) ---"
          kubectl -n kezio-system get "${p}" \
            -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}{"\n"}'
          # net1 lives only inside this pod's own netns, so rp_filter and
          # link state must be read from there via nsenter/crictl, not
          # the host.
          echo "--- ${p} net1 rp_filter and link state (inside the pod network namespace) ---"
          pod_name="${p#pod/}"
          # Without -r, crictl's default endpoint probe finds nothing on an RKE2 node.
          crictl_endpoint="unix:///run/k3s/containerd/containerd.sock"
          sandbox_id="$(sudo crictl -r "${crictl_endpoint}" pods --name "${pod_name}" -q | head -1)"
          if [ -n "${sandbox_id}" ]; then
            sandbox_pid="$(sudo crictl -r "${crictl_endpoint}" inspectp -o go-template --template '{{.info.pid}}' "${sandbox_id}")"
            sudo nsenter -t "${sandbox_pid}" -n -- sh -c '
              for f in all default net1; do
                echo "net.ipv4.conf.${f}.rp_filter = $(cat /proc/sys/net/ipv4/conf/${f}/rp_filter 2>/dev/null || echo "<no such interface>")"
              done
              ip -d link show net1 2>&1
              ip addr show net1 2>&1
            ' || true
          fi
          echo "--- ${p} restart count ---"
          kubectl -n kezio-system get "${p}" \
            -o jsonpath='{range .status.containerStatuses[*]}{.name}{": restartCount="}{.restartCount}{" lastState="}{.lastState}{"\n"}{end}'
          echo "--- ${p} bootd logs (--previous) ---"
          kubectl -n kezio-system logs "${p}" -c bootd --previous --tail=500 || true
          echo "--- ${p} fetch-boot-artifacts logs (--previous) ---"
          kubectl -n kezio-system logs "${p}" -c fetch-boot-artifacts --previous --tail=200 || \
            kubectl -n kezio-system logs "${p}" -c fetch-boot-artifacts --tail=200 || true
        done
        echo "===== ingest Job(s) ====="
        kubectl get jobs -n kezio-system -l kezio.kojuro.date/image -o wide
        kubectl logs -n kezio-system -l kezio.kojuro.date/image --all-containers --tail=1000
        echo "===== per-Image seeder Deployment logs ====="
        if [ -n "${SEEDER_DEPLOYMENT_NAME:-}" ]; then
          kubectl -n kezio-system get deployment "${SEEDER_DEPLOYMENT_NAME}" -o yaml
          kubectl -n kezio-system logs deployment/"${SEEDER_DEPLOYMENT_NAME}" --tail=1000
        else
          echo "SEEDER_DEPLOYMENT_NAME is unset - the job failed before \"Attach the per-Image seeder Deployment...\" found one."
        fi
        echo "===== opentracker logs ====="
        kubectl -n kezio-system logs deployment/kezio-opentracker --tail=1000
        echo "===== existing-dhcp logs (the site's stand-in existing DHCP server) ====="
        kubectl -n kezio-system logs deployment/kezio-existing-dhcp --all-containers --tail=1000
        echo "===== image-service logs ====="
        kubectl -n kezio-system logs deployment/kezio-image-service --tail=1000
        echo "===== VirtualMachine / VMI ====="
        kubectl get vm,vmi -n kezio-system -o yaml
        echo "===== virt-launcher pod describe ====="
        kubectl describe pod -n kezio-system -l "kubevirt.io/vm=${TARGET_VM_NAME}"
        echo "===== VM console (last 20s, live attach only - see the uploaded console.log artifact for the full history from VM start) ====="
        timeout 20 virtctl console "${TARGET_VM_NAME}" -n kezio-system || true
        echo "===== Machine CR ====="
        kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
        echo "===== Image CR ====="
        kubectl get image "${IMAGE_NAME}" -n kezio-system -o yaml
        echo "===== events ====="
        kubectl get events -n kezio-system --sort-by=.lastTimestamp
        echo "===== host FORWARD chain (canal/br_netfilter can silently drop bridged traffic here) ====="
        sudo iptables -L FORWARD -v --line-numbers || true
        sysctl net.bridge.bridge-nf-call-iptables || true
        echo "===== host mangle table CHECKSUM rules (fills UDP checksums the VM's virtio-net offloaded) ====="
        sudo iptables -t mangle -L POSTROUTING -v --line-numbers || true
        echo "===== ${PROVISIONING_BRIDGE} offload settings ====="
        ethtool -k "${PROVISIONING_BRIDGE}" | head || true

    - name: Dump KubeVirtBMC diagnostics on failure
      if: failure()
      shell: bash
      run: |
        set +e
        # Teed into a file too, same as "Dump diagnostics on failure" above.
        exec > >(tee "${RUNNER_TEMP}/diagnostics-kubevirtbmc-dump.log") 2>&1
        echo "===== kubevirtbmc-system pods ====="
        kubectl get pods -n kubevirtbmc-system -o wide
        echo "===== KubeVirtBMC controller-manager logs ====="
        kubectl -n kubevirtbmc-system logs deployment/kubevirtbmc-controller-manager --all-containers --tail=1000
        echo "===== VirtualMachineBMC ====="
        kubectl get virtualmachinebmc -n kezio-system -o yaml
        echo "===== virtbmc pod logs (the per-VM Redfish/IPMI agent) ====="
        kubectl -n kezio-system logs "${TARGET_VM_NAME}-virtbmc" --all-containers --tail=1000
        echo "===== virtbmc Service ====="
        kubectl get svc -n kezio-system -l app=virtbmc -o yaml
        echo "===== events (kubevirtbmc-system) ====="
        kubectl get events -n kubevirtbmc-system --sort-by=.lastTimestamp
