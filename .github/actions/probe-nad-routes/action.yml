name: Probe that a single-homed pod reaches another segment through NAD IPAM routes

description: >-
  Proves the mechanism section 3.4's "single-homing does not mean L2
  adjacency" claim rests on: a single-homed pod (one interface, the
  default-network NAD, no cluster network at all) can still reach a
  machine on a different segment of the same Site, because that
  reachability comes from a route entry the seeding NAD's own IPAM
  carries (create-provisioning-nads' seeding-routes-json input), not
  from any implicit connectivity. Two pods are created on the SAME
  segment (segment1-bridge), attached to two NADs that differ in
  exactly one respect - one carries an ipam.routes entry pointing at
  segment2's network, the other does not - so a pass on one pod and a
  fail on the other is evidence the route entry itself is what made the
  difference, not some other property of the segment or the runner.

  Both NADs use the identical ipam shape create-provisioning-nads
  documents: "type": "static" with "addresses", and, only on the
  with-routes NAD, a "routes" array of {"dst", "gw"} objects at the
  ipam object's own top level - the same CNI static-plugin route shape
  https://www.cni.dev/plugins/current/ipam/static/ documents.

  The far end is a helper network namespace on segment2-bridge (a veth
  pair with its own address, not the runner host's own address on that
  bridge - see assert-site-isolation's own doc comment for why a
  destination address must not be the host's own: traffic addressed to
  an address the host owns locally is delivered on the INPUT hook, not
  FORWARD, so it would reach the pod whether or not any route or
  forwarding rule was ever installed and would prove nothing). It runs
  a real TCP listener (python3's stdlib http.server, guaranteed present
  on the runner) so a probe pod's TCP connect has something to actually
  answer.

inputs:
  namespace:
    description: Namespace the NADs and probe pods are created in.
    required: false
    default: "scaffold-system"
  segment1-bridge:
    description: Bridge name of segment1 - this action creates it (via create-routed-segments) itself.
    required: true
  segment1-cidr:
    description: 'segment1''s own network in CIDR form, e.g. "192.0.2.0/24" - informational, passed through to create-routed-segments.'
    required: true
  segment1-host-cidr:
    description: Address (with prefix) the runner gets on segment1-bridge, e.g. "192.0.2.1/24".
    required: true
  segment1-gateway-ip:
    description: >-
      Bare address (no prefix) of the runner's own host-cidr on
      segment1-bridge - the next hop the with-routes NAD's route entry
      points at, and the same host that forwards between the routed
      segments.
    required: true
  segment2-bridge:
    description: Bridge name of segment2 - this action creates it (via create-routed-segments) itself.
    required: true
  segment2-host-cidr:
    description: Address (with prefix) the runner gets on segment2-bridge, e.g. "192.0.3.1/24".
    required: true
  segment2-route-cidr:
    description: 'segment2''s own network in CIDR form, e.g. "192.0.3.0/24" - the destination the with-routes NAD''s route entry names.'
    required: true
  segment2-gateway-ip:
    description: >-
      Bare address (no prefix) of the runner's own host-cidr on
      segment2-bridge - the far helper namespace's default route.
    required: true
  pod-with-route-cidr:
    description: Address (with prefix) the with-routes NAD's static ipam hands to its pod, on segment1.
    required: true
  pod-no-route-cidr:
    description: Address (with prefix) the no-routes NAD's static ipam hands to its pod, on segment1.
    required: true
  far-cidr:
    description: Address (with prefix) for the far helper namespace, on segment2.
    required: true
  far-port:
    description: TCP port the far helper namespace listens on.
    required: false
    default: "8080"
  pod-image:
    description: Minimal image carrying a busybox "nc" applet, used to probe TCP reachability from inside each pod.
    required: false
    default: "busybox:1.36"
  timeout-seconds:
    description: Bounded connect timeout per probe, in whole seconds.
    required: false
    default: "5"
  pod-ready-timeout-seconds:
    description: How long to wait for each probe pod to become Running.
    required: false
    default: "60"
  netns-name:
    description: Name of the far helper network namespace this action creates and removes.
    required: false
    default: "kezio-nad-routes-probe"

runs:
  using: composite
  steps:
    - name: Create the two routed segments this probe attaches to
      # Both segments share one group so create-routed-segments' own
      # forwarding policy allows traffic between them - the routed hop
      # the with-routes NAD's route entry is claimed to use.
      uses: ./.github/actions/create-routed-segments
      with:
        segments: |
          ${{ inputs.segment1-bridge }} ${{ inputs.segment1-cidr }} ${{ inputs.segment1-host-cidr }} kezio-probe-nad-routes-group
          ${{ inputs.segment2-bridge }} ${{ inputs.segment2-route-cidr }} ${{ inputs.segment2-host-cidr }} kezio-probe-nad-routes-group

    - name: Create the with-routes and no-routes NetworkAttachmentDefinitions
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        SEGMENT1_BRIDGE: ${{ inputs.segment1-bridge }}
        SEGMENT1_GATEWAY_IP: ${{ inputs.segment1-gateway-ip }}
        SEGMENT2_ROUTE_CIDR: ${{ inputs.segment2-route-cidr }}
        POD_WITH_ROUTE_CIDR: ${{ inputs.pod-with-route-cidr }}
        POD_NO_ROUTE_CIDR: ${{ inputs.pod-no-route-cidr }}
      run: |
        set -euo pipefail
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: kezio-probe-nad-with-routes
          namespace: ${NAMESPACE}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "kezio-probe-nad-with-routes",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${SEGMENT1_BRIDGE}",
                  "ipam": {
                    "type": "static",
                    "addresses": [
                      {"address": "${POD_WITH_ROUTE_CIDR}"}
                    ],
                    "routes": [
                      {"dst": "${SEGMENT2_ROUTE_CIDR}", "gw": "${SEGMENT1_GATEWAY_IP}"}
                    ]
                  }
                }
              ]
            }
        EOF
        cat <<EOF | kubectl apply -f -
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: kezio-probe-nad-no-routes
          namespace: ${NAMESPACE}
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "kezio-probe-nad-no-routes",
              "plugins": [
                {
                  "type": "bridge",
                  "bridge": "${SEGMENT1_BRIDGE}",
                  "ipam": {
                    "type": "static",
                    "addresses": [
                      {"address": "${POD_NO_ROUTE_CIDR}"}
                    ]
                  }
                }
              ]
            }
        EOF

    - name: Create the with-routes and no-routes probe pods
      # Single-homed via v1.multus-cni.io/default-network, matching the
      # real seeder's own placement (seederPodAnnotations' bare
      # "namespace/name" form) - a single-homed pod is exactly the thing
      # section 3.4 says needs the NAD's own route to cross segments.
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        POD_IMAGE: ${{ inputs.pod-image }}
      run: |
        set -euo pipefail
        for suffix in with-routes no-routes; do
          cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: kezio-probe-nad-routes-${suffix}
          namespace: ${NAMESPACE}
          labels:
            app.kubernetes.io/component: probe-nad-routes
          annotations:
            v1.multus-cni.io/default-network: "${NAMESPACE}/kezio-probe-nad-${suffix}"
        spec:
          restartPolicy: Never
          containers:
            - name: probe
              image: ${POD_IMAGE}
              command: ["sleep", "300"]
        EOF
        done

    - name: Wait for both probe pods to become Running
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        TIMEOUT_SECONDS: ${{ inputs.pod-ready-timeout-seconds }}
      run: |
        set -euo pipefail
        for suffix in with-routes no-routes; do
          if ! kubectl -n "${NAMESPACE}" wait --for=jsonpath='{.status.phase}'=Running \
              "pod/kezio-probe-nad-routes-${suffix}" --timeout="${TIMEOUT_SECONDS}s"; then
            echo "::error::probe pod kezio-probe-nad-routes-${suffix} did not reach Running within ${TIMEOUT_SECONDS}s" >&2
            kubectl -n "${NAMESPACE}" describe pod "kezio-probe-nad-routes-${suffix}" || true
            exit 1
          fi
        done

    - name: Create the far helper namespace and start its TCP listener
      shell: bash
      env:
        SEGMENT2_BRIDGE: ${{ inputs.segment2-bridge }}
        FAR_CIDR: ${{ inputs.far-cidr }}
        SEGMENT2_GATEWAY_IP: ${{ inputs.segment2-gateway-ip }}
        FAR_PORT: ${{ inputs.far-port }}
        NETNS_NAME: ${{ inputs.netns-name }}
      run: |
        set -euo pipefail
        veth_host="kznadr-h"
        veth_ns="kznadr-n"
        far_ip="${FAR_CIDR%%/*}"

        sudo ip netns add "${NETNS_NAME}"
        sudo ip link add "${veth_host}" type veth peer name "${veth_ns}"
        sudo ip link set "${veth_host}" master "${SEGMENT2_BRIDGE}"
        sudo ip link set "${veth_host}" up
        sudo ip link set "${veth_ns}" netns "${NETNS_NAME}"
        sudo ip netns exec "${NETNS_NAME}" ip link set lo up
        sudo ip netns exec "${NETNS_NAME}" ip link set "${veth_ns}" up
        sudo ip netns exec "${NETNS_NAME}" ip addr add "${FAR_CIDR}" dev "${veth_ns}"
        sudo ip netns exec "${NETNS_NAME}" ip route add default via "${SEGMENT2_GATEWAY_IP}"

        # python3 ships on every GitHub-hosted ubuntu runner; a plain
        # http.server is a real TCP listener, which is all a connect-only
        # probe needs answered.
        # shellcheck disable=SC2024 # the redirect target is runner-writable; only the netns exec needs root.
        sudo ip netns exec "${NETNS_NAME}" python3 -m http.server --bind "${far_ip}" "${FAR_PORT}" \
          >/tmp/kezio-probe-nad-routes-httpd.log 2>&1 &
        echo "$!" > /tmp/kezio-probe-nad-routes-httpd.pid
        sleep 1

    - name: PASS/FAIL -- the with-routes pod reaches the far segment
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        FAR_CIDR: ${{ inputs.far-cidr }}
        FAR_PORT: ${{ inputs.far-port }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        far_ip="${FAR_CIDR%%/*}"
        if kubectl -n "${NAMESPACE}" exec kezio-probe-nad-routes-with-routes -- \
            nc -z -w "${TIMEOUT_SECONDS}" "${far_ip}" "${FAR_PORT}"; then
          echo "PASS observed=connected expected=connected (with-routes pod -> ${far_ip}:${FAR_PORT})"
        else
          echo "::error::FAIL observed=unreachable expected=connected -- the with-routes pod could not reach segment2 through the NAD's own ipam.routes entry" >&2
          exit 1
        fi

    - name: PASS/FAIL -- the no-routes pod does NOT reach the far segment
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        FAR_CIDR: ${{ inputs.far-cidr }}
        FAR_PORT: ${{ inputs.far-port }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        far_ip="${FAR_CIDR%%/*}"
        if kubectl -n "${NAMESPACE}" exec kezio-probe-nad-routes-no-routes -- \
            nc -z -w "${TIMEOUT_SECONDS}" "${far_ip}" "${FAR_PORT}"; then
          echo "::error::FAIL observed=connected expected=unreachable -- the no-routes pod reached segment2 with no ipam.routes entry at all; the route input is not what is providing reachability, so this probe proves nothing about it" >&2
          exit 1
        else
          echo "PASS observed=unreachable expected=unreachable (no-routes pod -> ${far_ip}:${FAR_PORT})"
        fi

    - name: Clean up probe pods, NADs, and the far helper namespace
      if: always()
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        NETNS_NAME: ${{ inputs.netns-name }}
      run: |
        set +e
        if [ -f /tmp/kezio-probe-nad-routes-httpd.pid ]; then
          sudo kill "$(cat /tmp/kezio-probe-nad-routes-httpd.pid)" 2>/dev/null
          rm -f /tmp/kezio-probe-nad-routes-httpd.pid /tmp/kezio-probe-nad-routes-httpd.log
        fi
        sudo ip netns del "${NETNS_NAME}" 2>/dev/null
        kubectl -n "${NAMESPACE}" delete pod kezio-probe-nad-routes-with-routes kezio-probe-nad-routes-no-routes \
          --ignore-not-found --wait=false
        kubectl -n "${NAMESPACE}" delete network-attachment-definition \
          kezio-probe-nad-with-routes kezio-probe-nad-no-routes --ignore-not-found
        exit 0
