name: Publish a GitHub Release

description: >-
  Creates (or resumes) a draft Release for a tag, uploads its assets, then
  flips it to published. Shared by release.yaml's boot-artifacts job only -
  the asset list is hardcoded to dist/live/'s fixed output, the same
  coupling build-live-image's own size-summary step already has.

inputs:
  tag:
    description: 'Release tag, e.g. "v1.2.3".'
    required: true
  target-sha:
    description: 'Commit SHA the release is cut from, for a first-time create.'
    required: true
  github-token:
    description: >-
      Token for the gh CLI. Composite actions cannot read the secrets
      context directly - callers must pass secrets.GITHUB_TOKEN (or
      github.token) through this input.
    required: true

runs:
  using: composite
  steps:
    - name: Create draft GitHub Release
      # Draft-first: a re-run for the same tag resumes instead of
      # erroring on "already exists"; published only once assets land.
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
        TARGET_SHA: ${{ inputs.target-sha }}
      run: |
        set -euo pipefail
        tag="${TAG}"
        if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          echo "Release ${tag} already exists; uploading assets to it."
        else
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --title "${tag}" --target "${TARGET_SHA}" --generate-notes --draft
        fi

    - name: Upload release assets
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
          dist/live/vmlinuz \
          dist/live/initrd.img \
          dist/live/filesystem.squashfs \
          dist/live/shimx64.efi \
          dist/live/grubx64.efi \
          dist/live/manifest.json \
          dist/live/sha256sums

    - name: Publish GitHub Release
      # Barrier: flips draft=false only after every asset uploaded.
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
