name: Seeding Throughput Baseline (Benchmark)

# Records a seeding throughput baseline, NOT a CI gate: it swarms N leecher
# Pods against one seeder and reports per-leecher completion time and
# aggregate throughput (plus the seeder's peak CPU/RSS) to the run's step
# summary and log. There is no pass/fail threshold on any of those numbers
# - this workflow exists so a human can compare one run's numbers against
# an earlier run's (e.g. before/after a libtorrent disk-IO backend change),
# not so a PR can fail on it.
#
# workflow_dispatch only, deliberately: this reuses the same slow-lane
# setup as test-e2e.yml's "image-path" job (RKE2, four locally built
# images including the from-source seeder, a real ingest of an Ubuntu
# cloud image) and then adds a multi-minute leecher swarm on top, which
# would slow down every push/PR if it ran there. Those setup steps are
# copied here rather than factored into a composite action or reusable
# workflow: they are a handful of shell steps, not enough shared logic to
# be worth the indirection, and copying keeps each workflow's job
# independently readable end to end.
#
# The benchmark logic itself lives in test/e2e's "Image ingest and
# seeding (image-path)" Context (test/e2e/e2e_image_path_test.go), as one
# more It() registered by registerSeedingBenchmarkSpec
# (test/e2e/e2e_benchmark_test.go) when E2E_BENCHMARK=true - it reuses
# that Context's already-ingested, already-seeded Image rather than
# ingesting a second one of its own, which is why this workflow sets both
# E2E_IMAGE_PATH=true and E2E_BENCHMARK=true below.

on:
  workflow_dispatch:
    inputs:
      leechers:
        description: >-
          Requested leecher Pod count (may be capped down at runtime if
          the runner's free disk cannot hold this many copies of the
          rootfs content - see test/e2e/e2e_benchmark_test.go's
          benchmarkAvailableDiskBytes/CapLeecherCount). A bigger
          self-hosted runner with more free disk will honor a higher
          value without any code change.
        required: false
        default: "10"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RKE2_VERSION: "v1.36.2+rke2r1"
  # RKE2 has no default StorageClass (unlike k3s's bundled local-path);
  # config/e2e-image-path's store/staging PVCs (applied by the Go suite's
  # own BeforeAll, not by this workflow directly) request storageClassName
  # local-path explicitly, so this rancher/local-path-provisioner release
  # is installed and marked default below. This lane never touches
  # Multus/NADs (each leecher Pod's emptyDir is single-node, no secondary
  # network needed), so it installs RKE2 with plain canal.
  LOCAL_PATH_PROVISIONER_VERSION: "v0.0.37"
  # Same minimal Ubuntu cloud image the image-path e2e job uses - see
  # test-e2e.yml's own env block for why the minimal image is preferred
  # here (half the download/convert/partclone time of the full image for
  # the same ingest coverage). Kept in sync by hand: both workflows pin
  # the same URL deliberately, not via a shared file, since GitHub
  # Actions has no first-class "shared env" primitive across workflows.
  UBUNTU_CLOUD_IMAGE_URL: "https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img"
  INGEST_IMG: "example.com/kezio-ingest:e2e"
  SEEDER_IMG: "example.com/kezio-seeder:e2e"
  IMAGE_SERVICE_IMG: "example.com/kezio-image-service:e2e"

jobs:
  benchmark-seeding:
    name: Swarm N leechers against one seeder
    runs-on: ubuntu-latest
    # Budget: everything test-e2e.yml's image-path job budgets 60 minutes
    # for (RKE2 install, four image builds, a real ingest of the Ubuntu
    # cloud image) plus the swarm itself. Each leecher is individually
    # bounded to 10 minutes (benchmarkLeechTimeout in
    # test/e2e/e2e_benchmark_test.go) but all leechers run concurrently,
    # so the swarm's own wall time is close to that single-leecher bound,
    # not N times it. 90 minutes leaves headroom for a cold seeder build
    # on an otherwise-busy runner, same reasoning as that job's own
    # timeout comment.
    timeout-minutes: 90
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Reclaim runner disk space
        # See test-e2e.yml's image-path job: this benchmark's leecher
        # Pods write real content to emptyDir volumes on this same disk,
        # on top of the same four locally built images that job already
        # needs the space for.
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Resource check (fail fast if the runner is under-resourced)
        run: |
          set -euo pipefail
          echo "===== CPU ====="
          nproc
          echo "===== Memory ====="
          free -h
          echo "===== Disk ====="
          df -h

          cpus="$(nproc)"
          mem_mb="$(free -m | awk '/^Mem:/{print $2}')"
          disk_avail_gb="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"

          # Same floors as test-e2e.yml's image-path job (including its
          # RKE2-vs-k3s bump). This job never fails on "not enough disk
          # for N leechers" here - that is a runtime decision the
          # benchmark itself makes (see CapLeecherCount) and reports, not
          # a hard CI gate - these floors only catch a runner that is
          # clearly the wrong class.
          if [ "$cpus" -lt 2 ]; then
            echo "::error::Runner has only ${cpus} CPU(s); kezio's benchmark needs at least 2." >&2
            exit 1
          fi
          if [ "$mem_mb" -lt 7000 ]; then
            echo "::error::Runner has only ${mem_mb} MiB RAM; kezio's benchmark needs at least 7000 MiB." >&2
            exit 1
          fi
          if [ "$disk_avail_gb" -lt 20 ]; then
            echo "::error::Runner has only ${disk_avail_gb} GiB free disk; kezio's benchmark needs at least 20 GiB just to build and ingest." >&2
            exit 1
          fi

      - name: Cache the Ubuntu cloud image
        id: cache-cloud-image
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ubuntu-cloud.img
          key: ubuntu-cloud-image-${{ env.UBUNTU_CLOUD_IMAGE_URL }}

      - name: Download the Ubuntu cloud image
        if: steps.cache-cloud-image.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sfL -o "${{ runner.temp }}/ubuntu-cloud.img" "${UBUNTU_CLOUD_IMAGE_URL}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warm the ingest/seeder/image-service image caches
        # Shares the gha cache scope names with test-e2e.yml's image-path
        # job and publish.yml's matrix, so whichever workflow ran most
        # recently on this repo pays the from-source debian:sid seeder
        # build cost, not every workflow independently.
        run: |
          set -euo pipefail
          for spec in "ingest:docker/ingest/Dockerfile:${INGEST_IMG}" "seeder:docker/seeder/Dockerfile:${SEEDER_IMG}" "image-service:docker/image-service/Dockerfile:${IMAGE_SERVICE_IMG}"; do
            IFS=: read -r scope dockerfile tag <<< "${spec}"
            docker buildx build \
              --file "${dockerfile}" \
              --tag "${tag}" \
              --cache-from "type=gha,scope=${scope}" \
              --cache-to "type=gha,mode=max,scope=${scope}" \
              --load \
              .
          done

      - name: Write the RKE2 config (must exist before the service starts)
        # Plain canal - each leecher Pod's emptyDir is single-node; this
        # lane never touches Multus/NADs.
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/rancher/rke2
          cat <<'EOF' | sudo tee /etc/rancher/rke2/config.yaml
          write-kubeconfig-mode: "0644"
          cni: canal
          EOF

      - name: Install RKE2
        run: |
          set -euo pipefail
          curl -sfL https://get.rke2.io | INSTALL_RKE2_VERSION="${RKE2_VERSION}" sh -
          sudo systemctl enable --now rke2-server.service

          # kubectl/ctr/crictl ship under /var/lib/rancher/rke2/bin, not on
          # PATH by default - symlink them into /usr/local/bin (inside
          # sudo's secure_path) the same way the k3s installer always put
          # its own "k3s" binary there.
          sudo ln -sf /var/lib/rancher/rke2/bin/kubectl /usr/local/bin/kubectl
          sudo ln -sf /var/lib/rancher/rke2/bin/ctr /usr/local/bin/ctr
          sudo ln -sf /var/lib/rancher/rke2/bin/crictl /usr/local/bin/crictl

          echo "KUBECONFIG=/etc/rancher/rke2/rke2.yaml" >> "$GITHUB_ENV"
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          # RKE2 registers its node a moment after the service starts; wait
          # for the node object to exist before waiting on its Ready condition,
          # since `kubectl wait` errors out immediately on zero matches.
          for _ in $(seq 1 90); do
            [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ] && break
            sleep 2
          done
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl get nodes -o wide

      - name: Install local-path-provisioner and mark it the default StorageClass
        # RKE2 ships no default StorageClass (k3s bundled local-path by
        # default; RKE2 deliberately does not). config/e2e-image-path's
        # store/staging PVCs (applied by the Go suite's own BeforeAll, not
        # by this workflow directly) request storageClassName local-path
        # explicitly, so that name must exist here before the suite runs.
        run: |
          set -euo pipefail
          kubectl apply -f "https://raw.githubusercontent.com/rancher/local-path-provisioner/${LOCAL_PATH_PROVISIONER_VERSION}/deploy/local-path-storage.yaml"
          kubectl -n local-path-storage rollout status deployment/local-path-provisioner --timeout=180s
          kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

      - name: Confirm metrics-server (seeder CPU/RSS sampling degrades gracefully if absent)
        # Unlike k3s, RKE2 does not bundle metrics-server by default, so
        # this step is expected to typically report "unavailable" here -
        # the benchmark itself (seederMetricsSampler in
        # test/e2e/e2e_benchmark_test.go) already tolerates it being
        # missing or slow to warm up and reports that for the CPU/RSS row
        # rather than failing the run, so this step stays informational
        # only (never fails the job) rather than installing metrics-server
        # just to make it succeed.
        run: |
          set +e
          kubectl wait --for=condition=Available deployment/metrics-server -n kube-system --timeout=60s
          kubectl top nodes
          echo "(a failure above is non-fatal: the benchmark degrades gracefully without metrics-server)"

      - name: Run the seeding throughput benchmark
        run: |
          set -euo pipefail
          go mod tidy
          # Mirrors `make test-e2e`'s own prerequisites, same as
          # test-e2e.yml's image-path job - see that job's equivalent
          # step for why this calls `go test` directly instead of going
          # through the `test-e2e` Make target.
          make manifests generate fmt vet
          E2E_IMAGE_PATH=true \
          E2E_BENCHMARK=true \
          E2E_BENCHMARK_LEECHERS="${{ inputs.leechers }}" \
          E2E_UBUNTU_QCOW2_PATH="${{ runner.temp }}/ubuntu-cloud.img" \
          INGEST_IMG="${INGEST_IMG}" \
          SEEDER_IMG="${SEEDER_IMG}" \
          IMAGE_SERVICE_IMG="${IMAGE_SERVICE_IMG}" \
          E2E_CLUSTER=rke2 go test ./test/e2e/ -v -ginkgo.v -timeout 80m

      - name: Dump operator, ingest, and seeder logs on failure
        if: failure()
        run: |
          set +e
          echo "===== kezio-system pods ====="
          kubectl get pods -n kezio-system -o wide
          echo "===== controller-manager logs ====="
          kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=500
          echo "===== ingest Job(s) ====="
          kubectl get jobs -n kezio-system -l kezio.kojuro.date/image -o wide
          echo "===== ingest Job logs ====="
          kubectl logs -n kezio-system -l kezio.kojuro.date/image --all-containers --tail=500
          echo "===== seeder logs ====="
          kubectl logs -n kezio-system deploy/kezio-ezio-seeder --tail=500
          echo "===== opentracker logs ====="
          kubectl logs -n kezio-system deploy/kezio-opentracker --tail=500
          echo "===== image-service logs ====="
          kubectl logs -n kezio-system deploy/kezio-image-service --tail=500
          echo "===== kezio Images ====="
          kubectl get images -A -o wide
          echo "===== events ====="
          kubectl get events -n kezio-system --sort-by=.lastTimestamp
