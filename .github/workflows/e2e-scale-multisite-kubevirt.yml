name: E2E Scale (Multi-Site KubeVirt VMs)

# Proves the multi-site BitTorrent swarm topology described in
# config/seeder/README.md's "Per-site seeders" section: a central
# tracker + a central seeder that already holds the full image (the
# "pre-warm" peer), plus a site-local seeder replica at each of two
# simulated sites, with one leecher VM per site deploying concurrently
# through the same swarm - not one leecher at a time against the central
# seeder alone.
#
# Builds on the same setup e2e-kubevirt-reusable.yml uses, but the
# topology diverges enough to need a dedicated workflow rather than a
# `workflow_call` of that file: two boot L2 segments instead of one (no
# single "boot network" input covers a set of segments); two site-local
# ezio-seeder replicas cloned by patching the reusable workflow's
# generated manifest with `jq` (there is no `workflow_call` input shape
# for "N seeders" without turning that workflow into a loop, which would
# complicate its single-leecher callers); and two target VMs/Machines
# polled concurrently with a swarm-wide peer-count sample gathered while
# both are leeching. Site-agnostic steps (image builds, RKE2 install,
# KubeVirt/CDI/Multus install, ingest) mirror e2e-kubevirt-reusable.yml -
# keep the two in sync by hand if that workflow's setup steps change.
#
# === Honest scope: what a single GitHub-hosted runner can and cannot
# simulate ===
#
# A single runner has one flat pod network - every seeder, the tracker,
# and both leecher VMs' data traffic cross the same loopback/veth fabric
# with no real inter-site latency, bandwidth cap, or routing hop. This
# lane CANNOT show that "the WAN carries close to one copy of the
# image" - that needs real per-network traffic accounting or genuinely
# separate network segments, neither of which exists here.
#
# What two Multus bridges + two kezio-bootd Deployments genuinely DO
# simulate: two separate, real, disjoint L2 broadcast domains for
# PXE/DHCP, each with its own independent proxyDHCP responder - the same
# mechanism a physically separate site's L2 segment needs in production.
#
# What this lane actually asserts (see the "Verify" steps near the
# bottom): both site leechers independently complete a real
# BitTorrent-transfer deploy concurrently, against a swarm with more than
# one seeder endpoint, not serially against one seeder. It additionally
# samples each seeder endpoint's live peer count while both leeches are
# in flight and reports the observed maximum - informational only, not a
# pass/fail gate: a peer count above 1 is necessary but not sufficient
# evidence of same-site piece exchange in a real, network-partitioned
# deployment.
#
# === The central seeder as the "pre-warm" peer ===
#
# kezio's Option A storage design means the central `ezio-seeder`
# Deployment already holds the full image directly (mounts the ingested
# store PVC read-only) rather than leeching over BitTorrent first - it is
# already the full-copy "pre-warm" peer from the moment the Image reaches
# Ready. This lane's two site-local seeder replicas are NOT the
# storage-isolated pre-warm pattern either: they mount the same PVC the
# central seeder does, since every pod here runs on one RKE2 node with
# one storage backend. Proving the storage-isolated leecher-then-seeder
# pattern needs a genuinely separate per-site store, which a
# single-runner cluster cannot provide; this lane instead proves the
# multi-endpoint seeder wiring (`SeederReconciler` syncing content to
# every Ready endpoint of one Service).
#
# workflow_dispatch only, release-gated like e2e-deploy-kubevirt.yml and
# e2e-boot-path-kubevirt.yml (PXE over a Multus bridge inside nested
# KubeVirt is a real risk surface, and a flaky job gating every PR trains
# reviewers to ignore red checks). This is also the heaviest lane in the
# repository (two full boot+deploy chains sharing one runner's CPU/RAM
# budget at once), so it is for pre-release validation, not routine CI
# signal.
on:
  workflow_dispatch:
    inputs:
      boot_artifacts_image:
        description: >-
          kezio-boot-artifacts OCI image both site VMs net-boot (see
          .github/workflows/build-live-image.yml, which builds and
          pushes it). Ignored when build_boot_artifacts is true.
          Defaults to the published "latest" tag.
        required: false
        type: string
        default: "ghcr.io/tjjh89017/kezio-boot-artifacts:latest"
      build_boot_artifacts:
        description: >-
          Build the live boot image (including kezio-agent) from this
          checkout instead of pulling boot_artifacts_image - the way to
          exercise an internal/agent or cmd/agent change under test.
          Slower; see e2e-kubevirt-reusable.yml's own input description.
        required: false
        type: boolean
        default: false
      runs_on:
        description: >-
          Runner label to run the job on. Defaults to the standard
          GitHub-hosted runner, but this lane runs two full boot+deploy
          chains (two VMs, two bootd pods, three seeder pods, KubeVirt +
          CDI + Multus) at once on top of the five from-source image
          builds e2e-kubevirt-reusable.yml already needs - noticeably
          heavier than that single-leecher lane, which is itself already
          close to the standard hosted runner's 16 GiB RAM ceiling. If
          this lane is flaky from resource pressure rather than an
          actual defect, retarget it at a larger or self-hosted
          KubeVirt-capable runner via this input rather than raising the
          resource-check floor below to a value the default runner can
          never satisfy.
        required: false
        type: string
        default: "ubuntu-latest"
      existing_dhcp_image:
        description: >-
          dnsmasq image standing in for each site's existing DHCP server
          (see .github/actions/deploy-existing-dhcp), one pod per site.
          Deliberately a different, pinned third-party image from
          kezio-bootd's own - the dnsmasq instances must stay
          distinguishable in logs and pcap.
        required: false
        type: string
        default: "jpillora/dnsmasq:1.1@sha256:78a9c6711031a557d9c6a79a0b6e060c4ac09de3a8755c78d690acb55b4ccd15"

# Manually dispatched runs get their own group (keyed by run id) so a
# deliberately requested verdict - or two scenario dispatches back to
# back - cannot cancel each other; push runs keep superseding per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Bump deliberately, not as a side effect of an unrelated change.
  RKE2_VERSION: "v1.36.2+rke2r1"
  KUBEVIRT_VERSION: "v1.9.0"
  CDI_VERSION: "v1.65.0"
  # RKE2 has no default StorageClass (unlike k3s's bundled local-path);
  # config/e2e-deploy-path's store/staging PVCs request storageClassName
  # local-path explicitly, so this rancher/local-path-provisioner release
  # is installed and marked default below.
  LOCAL_PATH_PROVISIONER_VERSION: "v0.0.37"

  # Two boot L2 segments, one per simulated site - see the header
  # comment's "Honest scope" section for what these genuinely simulate.
  # Each is a flat L2 with no gateway and no host address.
  SITE_A_BRIDGE: kezio-site-a0
  SITE_B_BRIDGE: kezio-site-b0
  # Distinct addresses per site segment, kept apart deliberately:
  #   - SITE_*_BOOTD_NET1_IP: the static address that site's
  #     kezio-boot-network-<site> NAD assigns to that site's bootd
  #     net1 - its dhcp-range subnet anchor and TFTP next-server.
  #   - SITE_*_EXISTING_DHCP_NET1_IP: the static address that site's own
  #     existing-dhcp pod's NAD assigns to its net1 (one deployed per
  #     site) - on the SAME /24 as that site's bootd net1, so that
  #     site's relay is a plain on-link unicast.
  #   - SITE_*_CIDR: that site's whole segment, handed to that site's
  #     bootd as BOOTD_PROVISIONING_CIDR.
  SITE_A_BOOTD_NET1_IP: 192.0.2.2/24
  SITE_A_EXISTING_DHCP_NET1_IP: 192.0.2.3/24
  SITE_A_CIDR: 192.0.2.0/24
  SITE_A_DHCP_RANGE: "192.0.2.10,192.0.2.100,255.255.255.0,12h"
  SITE_B_BOOTD_NET1_IP: 192.0.3.2/24
  SITE_B_EXISTING_DHCP_NET1_IP: 192.0.3.3/24
  SITE_B_CIDR: 192.0.3.0/24
  SITE_B_DHCP_RANGE: "192.0.3.10,192.0.3.100,255.255.255.0,12h"
  SITE_A_VM_MAC: "52:54:00:be:ef:0a"
  SITE_B_VM_MAC: "52:54:00:be:ef:0b"
  SITE_A_VM_DISK_SERIAL: "KEZIOE2ESCALESITEADISK1"
  SITE_B_VM_DISK_SERIAL: "KEZIOE2ESCALESITEBDISK1"
  EXISTING_DHCP_IMG: ${{ inputs.existing_dhcp_image }}

  UBUNTU_CLOUD_IMAGE_URL: "https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img"

  # Fixed at kezio's own current values: unlike e2e-kubevirt-reusable.yml,
  # this lane is not called by the ezio repository, so it always builds
  # this repository's own images at the revision under test.
  EZIO_REF: "v2.0.29"
  MANAGER_IMG: "example.com/kezio:e2e-scale"
  BOOTD_IMG: "example.com/kezio-bootd:e2e-scale"
  INGEST_IMG: "example.com/kezio-ingest:e2e-scale"
  SEEDER_IMG: "example.com/kezio-seeder:e2e-scale"
  IMAGE_SERVICE_IMG: "example.com/kezio-image-service:e2e-scale"
  OPENTRACKER_IMG: "ghcr.io/tunisiano187/opentracker-docker:master"
  # See "Build the live boot image and kezio-boot-artifacts image" below
  # for the build_boot_artifacts branch; the default pulls the published
  # image directly, no local build or import at all.
  BOOT_ARTIFACTS_IMG: ${{ inputs.build_boot_artifacts && 'example.com/kezio-boot-artifacts:e2e-scale' || inputs.boot_artifacts_image }}

  MARKER_PATH: "/etc/kezio-build-id"

jobs:
  scale-multisite-kubevirt:
    name: Deploy an Image to two simulated sites concurrently over the shared swarm
    runs-on: ${{ inputs.runs_on }}
    # Two full boot+deploy chains sharing one runner's budget - roughly
    # doubles e2e-kubevirt-reusable.yml's VM-boot/deploy cost on top of
    # the same fixed setup cost.
    timeout-minutes: ${{ inputs.build_boot_artifacts && 210 || 120 }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fail fast unless /dev/kvm is usable
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm does not exist on this runner; KubeVirt VMs need hardware virtualization." >&2
            exit 1
          fi
          sudo usermod -aG kvm "$(whoami)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Fail fast unless the boot-artifacts image exists
        # Mirrors e2e-kubevirt-reusable.yml's step of the same name.
        # Skipped when build_boot_artifacts is set: that mode builds and
        # locally imports its own tag, which exists in no registry.
        if: ${{ !inputs.build_boot_artifacts }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "${BOOT_ARTIFACTS_IMG}" >/dev/null; then
            echo "::error::No boot-artifacts image at ${BOOT_ARTIFACTS_IMG}. Publish one first by pushing a \"v*\" tag - release.yaml builds and publishes kezio-boot-artifacts on every such tag (see that workflow's own header comment)." >&2
            exit 1
          fi

      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=1048576
          sudo sysctl -w fs.inotify.max_user_instances=8192

      - name: Resource check (fail fast if the runner is under-resourced)
        # Same floor e2e-kubevirt-reusable.yml uses. This lane is
        # genuinely heavier, but the floor stays at what the default
        # hosted runner actually has - point runs_on at a bigger runner
        # instead of raising this floor unconditionally.
        run: |
          set -euo pipefail
          echo "===== CPU ====="
          nproc
          echo "===== Memory ====="
          free -h
          echo "===== Disk ====="
          df -h

          cpus="$(nproc)"
          mem_mb="$(free -m | awk '/^Mem:/{print $2}')"
          disk_avail_gb="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"

          if [ "$cpus" -lt 4 ]; then
            echo "::error::Runner has only ${cpus} CPU(s); this lane needs at least 4." >&2
            exit 1
          fi
          if [ "$mem_mb" -lt 14000 ]; then
            echo "::error::Runner has only ${mem_mb} MiB RAM; this lane needs at least 14000 MiB." >&2
            exit 1
          fi
          if [ "$disk_avail_gb" -lt 30 ]; then
            echo "::error::Runner has only ${disk_avail_gb} GiB free disk; this lane needs at least 30 GiB (two VM disks plus everything the single-leecher lane needs)." >&2
            exit 1
          fi

      - name: Create the two simulated sites' boot bridges
        # No address on either bridge: each is a flat L2 with no gateway
        # and no host presence - see e2e-kubevirt-reusable.yml's own
        # "Create the provisioning bridge" step for the full reasoning.
        run: |
          set -euo pipefail
          sudo ip link add "${SITE_A_BRIDGE}" type bridge
          sudo ip link set "${SITE_A_BRIDGE}" up

          sudo ip link add "${SITE_B_BRIDGE}" type bridge
          sudo ip link set "${SITE_B_BRIDGE}" up

      - name: Cache the Ubuntu cloud image
        id: cache-cloud-image
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ubuntu-cloud.img
          key: ubuntu-cloud-image-${{ env.UBUNTU_CLOUD_IMAGE_URL }}

      - name: Download the Ubuntu cloud image
        if: steps.cache-cloud-image.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sfL -o "${{ runner.temp }}/ubuntu-cloud.img" "${UBUNTU_CLOUD_IMAGE_URL}"

      - name: Customize the Ubuntu cloud image with a marker file and qemu-guest-agent
        # One Image, ingested once, deployed to both sites concurrently.
        # Full reasoning for the technique itself lives in
        # .github/actions/customize-cloud-image/action.yml, shared with
        # e2e-kubevirt-reusable.yml.
        uses: ./.github/actions/customize-cloud-image
        with:
          source-image-path: "${{ runner.temp }}/ubuntu-cloud.img"
          output-image-path: "${{ runner.temp }}/ubuntu-cloud-marked.img"
          marker-path: "${{ env.MARKER_PATH }}"
          cloud-image-url: "${{ env.UBUNTU_CLOUD_IMAGE_URL }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warm the ingest/seeder/image-service image caches
        run: |
          set -euo pipefail
          for spec in "ingest:docker/ingest/Dockerfile:${INGEST_IMG}" "seeder:docker/seeder/Dockerfile:${SEEDER_IMG}" "image-service:docker/image-service/Dockerfile:${IMAGE_SERVICE_IMG}"; do
            IFS=: read -r scope dockerfile tag <<< "${spec}"
            build_args=()
            if [ "${scope}" = "seeder" ]; then
              build_args+=(--build-arg "EZIO_REF=${EZIO_REF}")
            fi
            docker buildx build \
              --file "${dockerfile}" \
              --tag "${tag}" \
              --cache-from "type=gha,scope=${scope}" \
              --cache-to "type=gha,mode=max,scope=${scope}" \
              "${build_args[@]}" \
              --load \
              .
          done

      - name: Build the manager image
        run: |
          set -euo pipefail
          go mod tidy
          make docker-build IMG="${MANAGER_IMG}"

      - name: Build the bootd image
        run: |
          set -euo pipefail
          make docker-build-bootd BOOTD_IMG="${BOOTD_IMG}"

      - name: Build kezioctl
        run: |
          set -euo pipefail
          make build-kezioctl

      - name: Build the live boot image and kezio-boot-artifacts image
        # Runs the same script build-live-image.yml budgets 90 minutes
        # for on its own.
        if: ${{ inputs.build_boot_artifacts }}
        env:
          AGENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          hack/live-image/build.sh
          make docker-build-boot-artifacts BOOT_ARTIFACTS_IMG="${BOOT_ARTIFACTS_IMG}"

      - name: Install grpcurl (informational peer-count sampling only, not a pass/fail gate)
        run: |
          set -euo pipefail
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install RKE2 with Multus enabled
        # Shared with e2e-kubevirt-reusable.yml and
        # e2e-boot-path-kubevirt.yml - the three lanes' RKE2 setup was
        # byte-identical.
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: ${{ env.RKE2_VERSION }}

      - name: Allow bridged traffic on the two boot bridges (bypass canal's FORWARD filtering)
        # RKE2's canal CNI loads br_netfilter, routing every bridged L2
        # frame - including these bridges', though they carry no cluster
        # pod traffic - through the host's netfilter FORWARD chain, whose
        # default policy is DROP once the cluster is up
        # (kubernetes/kubernetes#39823, #91545). That silently eats each
        # site VM's PXE DHCP DISCOVER broadcast between its Multus port
        # and that site's bootd port. Run after the node is Ready (canal
        # has programmed its own rules by then) and idempotently (-C
        # before -I): add an ACCEPT scoped to each bridge's own
        # port-to-port traffic only, leaving cluster filtering elsewhere
        # untouched.
        run: |
          set -euo pipefail
          for bridge in "${SITE_A_BRIDGE}" "${SITE_B_BRIDGE}"; do
            if command -v iptables >/dev/null 2>&1; then
              sudo iptables -C FORWARD -i "${bridge}" -o "${bridge}" -j ACCEPT 2>/dev/null || \
                sudo iptables -I FORWARD -i "${bridge}" -o "${bridge}" -j ACCEPT
            fi
            # RKE2/canal can also run on nf_tables instead of legacy
            # iptables; mirror the same exemption there when it applies.
            if command -v nft >/dev/null 2>&1 && sudo nft list table inet filter >/dev/null 2>&1; then
              sudo nft list chain inet filter FORWARD 2>/dev/null | grep -q "iifname \"${bridge}\" oifname \"${bridge}\" accept" || \
                sudo nft insert rule inet filter FORWARD iifname "${bridge}" oifname "${bridge}" accept
            fi
          done

      - name: Fill UDP checksums for PXE DHCP crossing the two boot bridges
        # Each site VM's virtio-net leaves UDP checksums to "hardware"
        # (CHECKSUM_PARTIAL), and the tap -> bridge -> Multus veth ->
        # bootd pod netns path never performs that fill, so bootd drops
        # the datagram as checksum-invalid. Same fix libvirt uses for
        # this: an iptables mangle CHECKSUM --checksum-fill rule scoped
        # to each bridge and both DHCP ports (67, 68). nft has no
        # CHECKSUM target equivalent, so disabling tx checksum offload on
        # the bridge is the fallback when iptables is unavailable.
        # Idempotent (-C before -A).
        run: |
          set -euo pipefail
          for bridge in "${SITE_A_BRIDGE}" "${SITE_B_BRIDGE}"; do
            if command -v iptables >/dev/null 2>&1; then
              for port in 67 68; do
                sudo iptables -t mangle -C POSTROUTING -o "${bridge}" -p udp --dport "${port}" -j CHECKSUM --checksum-fill 2>/dev/null || \
                  sudo iptables -t mangle -A POSTROUTING -o "${bridge}" -p udp --dport "${port}" -j CHECKSUM --checksum-fill
              done
            else
              sudo ethtool -K "${bridge}" tx off || true
            fi
          done

      - name: Start capturing the two boot bridges (tcpdump)
        # Definitive instrumentation regardless of whether the checksum
        # fix above is the actual/only cause. One capture per site
        # bridge, backgrounded so both run from before either target VM
        # exists through however this job ends.
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends tcpdump || true
          sudo -- sh -c "nohup tcpdump -i '${SITE_A_BRIDGE}' -w '${RUNNER_TEMP}/bridge-site-a.pcap' \
            udp port 67 or port 68 or port 69 or tcp port 80 \
            >/tmp/tcpdump-bridge-site-a.log 2>&1 &"
          sudo -- sh -c "nohup tcpdump -i '${SITE_B_BRIDGE}' -w '${RUNNER_TEMP}/bridge-site-b.pcap' \
            udp port 67 or port 68 or port 69 or tcp port 80 \
            >/tmp/tcpdump-bridge-site-b.log 2>&1 &"

      - name: Install local-path-provisioner and mark it the default StorageClass
        # RKE2 ships no default StorageClass. config/e2e-deploy-path's
        # store/staging PVCs request storageClassName local-path
        # explicitly, so that name must exist; being default is also a
        # reasonable fallback for anything else (e.g. CDI's scratch
        # space) that resolves a StorageClass by cluster default.
        run: |
          set -euo pipefail
          kubectl apply -f "https://raw.githubusercontent.com/rancher/local-path-provisioner/${LOCAL_PATH_PROVISIONER_VERSION}/deploy/local-path-storage.yaml"
          kubectl -n local-path-storage rollout status deployment/local-path-provisioner --timeout=180s
          kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

      - name: Import images into RKE2 containerd
        # RKE2's containerd socket is still under /run/k3s/containerd (a
        # leftover of RKE2's k3s lineage); plain "ctr" needs both -a and
        # -n spelled out explicitly.
        run: |
          set -euo pipefail
          images=("${MANAGER_IMG}" "${BOOTD_IMG}" "${INGEST_IMG}" "${SEEDER_IMG}" "${IMAGE_SERVICE_IMG}")
          # BOOT_ARTIFACTS_IMG only needs a local import when
          # build_boot_artifacts built it locally above - the default
          # (published ghcr) tag is left for the kubelet to pull itself
          # inside the cluster.
          if [ "${{ inputs.build_boot_artifacts }}" = "true" ]; then
            images+=("${BOOT_ARTIFACTS_IMG}")
          fi
          for img in "${images[@]}"; do
            docker save "${img}" | sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import -
          done

      - name: Install cert-manager, KubeVirt, virtctl, and CDI
        # Shared with e2e-kubevirt-reusable.yml and
        # e2e-boot-path-kubevirt.yml. Also waits for RKE2's own
        # rke2-multus HelmChart addon to publish the Multus
        # NetworkAttachmentDefinition CRD, needed by the "Create the boot
        # NetworkAttachmentDefinitions" step below: RKE2 deploys Multus as
        # a packaged HelmChart addon whose install can lag node-Ready, so
        # the action polls for its NAD CRD to exist (and be Established)
        # first - a past layout mismatch here (not a Multus version
        # issue) broke several early runs.
        uses: ./.github/actions/install-cluster-addons
        with:
          kubevirt-version: ${{ env.KUBEVIRT_VERSION }}
          cdi-version: ${{ env.CDI_VERSION }}

      - name: Deploy CRDs and the controller-manager
        run: |
          set -euo pipefail
          make install
          make deploy IMG="${MANAGER_IMG}"
          # privileged, not restricted: bootd's dnsmasq child needs NET_ADMIN/NET_RAW, outside both the restricted and baseline PSA profiles - see config/bootd/deployment.yaml's capabilities comment. Every pod keeps its own strict securityContext regardless.
          kubectl label --overwrite ns kezio-system pod-security.kubernetes.io/enforce=privileged
          kubectl rollout status deployment/kezio-controller-manager -n kezio-system --timeout=180s

      - name: Create the boot NetworkAttachmentDefinitions
        # Two NADs per site on that site's bridge, split on purpose:
        #
        # kezio-boot-network-${site} (static ipam) is for that site's
        # bootd pod ONLY - bootd net1 needs a fixed address on that
        # site's subnet (dnsmasq binds DHCP sockets to it; BOOTD_SERVER_IP
        # advertises it as the TFTP next-server). Each site's
        # existing-dhcp pod keeps its own static address on the same
        # bridge, so the two never collide.
        #
        # kezio-boot-network-vm-${site} ("ipam": {}) is for that site's
        # target VM's provisioning NIC. The VM must NOT attach the
        # static-ipam NAD: a KubeVirt bridge-mode interface whose network
        # carries IPAM makes virt-launcher start its own in-pod DHCP
        # server, and the static plugin hands every attaching pod the
        # same address - so that rogue server would offer the guest
        # bootd's own address before either bootd or existing-dhcp gets a
        # chance to answer on the wire. Empty ipam means virt-launcher
        # runs no DHCP server on this NIC, and the guest firmware does
        # real DHCP on the wire, which is exactly what this lane exercises.
        run: |
          set -euo pipefail
          for site in site-a site-b; do
            case "${site}" in
              site-a) bridge="${SITE_A_BRIDGE}"; bootd_net1_ip="${SITE_A_BOOTD_NET1_IP}" ;;
              site-b) bridge="${SITE_B_BRIDGE}"; bootd_net1_ip="${SITE_B_BOOTD_NET1_IP}" ;;
            esac
            cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network-${site}
            namespace: kezio-system
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "type": "bridge",
                "bridge": "${bridge}",
                "ipam": {
                  "type": "static",
                  "addresses": [
                    {"address": "${bootd_net1_ip}"}
                  ]
                }
              }
          EOF
            cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network-vm-${site}
            namespace: kezio-system
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "type": "bridge",
                "bridge": "${bridge}",
                "ipam": {}
              }
          EOF
          done

      - name: Create the image-service bearer token Secret
        run: |
          set -euo pipefail
          kubectl -n kezio-system create secret generic kezio-image-service-token \
            --from-literal=token=kezio-e2e-scale-token \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy image-service+seeder+store+boot/agent servers, wire real ingest/seeding/deploy
        # Identical shape to e2e-kubevirt-reusable.yml's step of this
        # name. This applies the ONE central seeder (this lane's
        # "pre-warm" peer) and the ONE central opentracker; the two
        # site-local seeder replicas are added afterward, as extra
        # endpoints of the same Service, in their own step below.
        run: |
          set -euo pipefail
          cd config/manager && ../../bin/kustomize edit set image controller="${MANAGER_IMG}"
          cd ../..
          cd config/image-service && ../../bin/kustomize edit set image "image-service=${IMAGE_SERVICE_IMG}"
          cd ../..
          cd config/seeder
          ../../bin/kustomize edit set image "seeder=${SEEDER_IMG}"
          ../../bin/kustomize edit set image "ghcr.io/tunisiano187/opentracker-docker=${OPENTRACKER_IMG}"
          cd ../..
          bin/kustomize build config/e2e-deploy-path | kubectl apply -f -

          # BOOT_SERVER_URL / BOOT_AGENT_SERVER_URL: internal/bootserver is
          # one instance, embedded in this one controller-manager process,
          # shared across every site - there is no per-site copy to point
          # at a genuinely per-site address (a real deployment gets this
          # for free because every site's bootd reverse-proxies to the
          # SAME cluster-wide Services). Consistent with the header
          # comment's honest scope, both sites are pointed at site-a's
          # bootd address for this HTTP surface - not a bare ClusterIP or
          # socat forward, but an honestly-labeled simplification this
          # single runner cannot fully avoid with two disjoint L2s and one
          # shared boot server.
          kubectl -n kezio-system set env deployment/kezio-controller-manager \
            INGEST_IMAGE="${INGEST_IMG}" \
            INGEST_STORE_PVC=kezio-store \
            INGEST_STAGING_PVC=kezio-image-service-staging \
            SEEDER_TRACKER_URL=http://kezio-opentracker.kezio-system.svc.cluster.local:6969/announce \
            SEEDER_STORE_ROOT=/store \
            SEEDER_SERVICE_NAMESPACE=kezio-system \
            SEEDER_SERVICE_NAME=kezio-ezio-seeder \
            BOOT_SERVER_ADDR=:8090 \
            BOOT_ARTIFACTS_DIR=/boot-artifacts \
            BOOT_SERVER_URL="http://${SITE_A_BOOTD_NET1_IP%%/*}:80" \
            AGENT_SERVER_ADDR=:8091 \
            BOOT_AGENT_SERVER_URL="http://${SITE_A_BOOTD_NET1_IP%%/*}:80" \
            DEPLOYER=agent

          kubectl -n kezio-system patch deployment/kezio-controller-manager --type=json \
            --patch-file=config/e2e-boot-path/boot-artifacts-init-patch.yaml
          kubectl -n kezio-system set image deployment/kezio-controller-manager \
            fetch-boot-artifacts="${BOOT_ARTIFACTS_IMG}"

          kubectl rollout status deployment/kezio-controller-manager -n kezio-system --timeout=180s
          for d in kezio-image-service kezio-ezio-seeder kezio-opentracker; do
            kubectl rollout status deployment/"${d}" -n kezio-system --timeout=180s
          done

      - name: Deploy the two site-local ezio-seeder replicas
        # Clones config/seeder's ezio-seeder Deployment (already applied
        # above as the central "pre-warm" seeder) into two more, one per
        # site, following ezio-seeder-site.example.yaml's model: same pod
        # template labels the Service already selects on, plus one extra
        # kezio.kojuro.date/network-site label this Deployment's own
        # selector also carries, so the clones' selectors don't collide.
        # `jq`, not `yq`: no workflow here uses `yq`, so this stays
        # consistent rather than adding a second YAML-editing tool.
        #
        # Honest limitation: both clones mount the identical store PVC
        # the central seeder does (one storage backend on this
        # single-node cluster), so this proves the multi-endpoint
        # reconciler wiring, not per-site storage isolation or network
        # locality.
        run: |
          set -euo pipefail
          seeder_base_json="$(kubectl get deployment/kezio-ezio-seeder -n kezio-system -o json)"
          for site in site-a site-b; do
            echo "${seeder_base_json}" | jq --arg site "${site}" '
              .metadata.name = "kezio-ezio-seeder-\($site)"
              | del(.metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation, .status)
              | .spec.selector.matchLabels["kezio.kojuro.date/network-site"] = $site
              | .spec.template.metadata.labels["kezio.kojuro.date/network-site"] = $site
            ' | kubectl apply -f -
            kubectl rollout status deployment/kezio-ezio-seeder-"${site}" -n kezio-system --timeout=180s
          done

      - name: Deploy site-a's existing-dhcp pod
        id: existing-dhcp-site-a
        uses: ./.github/actions/deploy-existing-dhcp
        with:
          namespace: kezio-system
          name: kezio-existing-dhcp-site-a
          image: ${{ env.EXISTING_DHCP_IMG }}
          bridge: ${{ env.SITE_A_BRIDGE }}
          static-cidr: ${{ env.SITE_A_EXISTING_DHCP_NET1_IP }}
          dhcp-range: ${{ env.SITE_A_DHCP_RANGE }}
          network-site-label: site-a

      - name: Deploy site-b's existing-dhcp pod
        id: existing-dhcp-site-b
        uses: ./.github/actions/deploy-existing-dhcp
        with:
          namespace: kezio-system
          name: kezio-existing-dhcp-site-b
          image: ${{ env.EXISTING_DHCP_IMG }}
          bridge: ${{ env.SITE_B_BRIDGE }}
          static-cidr: ${{ env.SITE_B_EXISTING_DHCP_NET1_IP }}
          dhcp-range: ${{ env.SITE_B_DHCP_RANGE }}
          network-site-label: site-b

      - name: Deploy the two site-local kezio-bootd instances
        # Same cloning technique as the seeder step above, applied to
        # config/bootd's Deployment - one instance per boot L2 segment
        # (two Deployments, not two replicas of one). RBAC is shared:
        # both instances run under the same "kezio-bootd" ServiceAccount,
        # applied once below; only the Deployment itself needs a
        # per-site clone.
        run: |
          set -euo pipefail
          cd config/bootd
          ../../bin/kustomize edit set image bootd="${BOOTD_IMG}"
          ../../bin/kustomize edit set image kezio-boot-artifacts="${BOOT_ARTIFACTS_IMG}"
          cd ../..
          bootd_base_json="$(bin/kustomize build config/bootd | kubectl apply --dry-run=client -f - -o json)"

          # Apply the shared RBAC objects once (everything the
          # kustomization builds except the Deployment itself).
          echo "${bootd_base_json}" | jq '{apiVersion:"v1", kind:"List", items: [.items[] | select(.kind!="Deployment")]}' \
            | kubectl apply -f -

          deployment_base_json="$(echo "${bootd_base_json}" | jq '.items[] | select(.kind=="Deployment")')"

          for site in site-a site-b; do
            case "${site}" in
              site-a) bootd_ip="${SITE_A_BOOTD_NET1_IP%%/*}"; cidr="${SITE_A_CIDR}"; relay_ip="${SITE_A_EXISTING_DHCP_NET1_IP%%/*}" ;;
              site-b) bootd_ip="${SITE_B_BOOTD_NET1_IP%%/*}"; cidr="${SITE_B_CIDR}"; relay_ip="${SITE_B_EXISTING_DHCP_NET1_IP%%/*}" ;;
            esac
            # BOOTD_SERVER_IP: that site's bootd net1 static address.
            # BOOTD_PROVISIONING_CIDR: that site's segment subnet, as
            # dnsmasq's proxyDHCP dhcp-range. BOOTD_DHCP_RELAY_SERVER:
            # that site's OWN existing-dhcp pod, on the same /24 as that
            # site's bootd net1 - a plain on-link relay, no cross-site
            # sharing. All three are site-specific, patched per clone.
            #
            # BOOTD_BOOT_CONFIG_URL is also per-site (each bootd's OWN
            # address), since each site's bootd serves grub/grub.cfg to
            # its OWN segment only. BOOTD_AGENT_UPSTREAM_URL /
            # BOOTD_BOOT_UPSTREAM_URL are the same cluster-wide Services
            # for every site (one internal/agentserver, one
            # internal/bootserver for the whole cluster), appended rather
            # than patched since the base deployment.yaml leaves them
            # commented out by default.
            echo "${deployment_base_json}" | jq \
              --arg site "${site}" --arg ip "${bootd_ip}" --arg cidr "${cidr}" --arg relay "${relay_ip}" --arg net "kezio-boot-network-${site}" '
              .metadata.name = "kezio-bootd-\($site)"
              | .spec.selector.matchLabels["kezio.kojuro.date/network-site"] = $site
              | .spec.template.metadata.labels["kezio.kojuro.date/network-site"] = $site
              | .spec.template.metadata.annotations["k8s.v1.cni.cncf.io/networks"] = $net
              | (.spec.template.spec.containers[] | select(.name=="bootd") | .env[] | select(.name=="BOOTD_SERVER_IP") | .value) = $ip
              | (.spec.template.spec.containers[] | select(.name=="bootd") | .env[] | select(.name=="BOOTD_PROVISIONING_CIDR") | .value) = $cidr
              | (.spec.template.spec.containers[] | select(.name=="bootd") | .env) += [
                  {"name":"BOOTD_DHCP_RELAY_SERVER","value":$relay},
                  {"name":"BOOTD_BOOT_CONFIG_URL","value":("http://" + $ip + ":80")},
                  {"name":"BOOTD_AGENT_UPSTREAM_URL","value":"http://kezio-agent-server.kezio-system.svc.cluster.local:8091"},
                  {"name":"BOOTD_BOOT_UPSTREAM_URL","value":"http://kezio-boot-server.kezio-system.svc.cluster.local:8090"}
                ]
            ' | kubectl apply -f -

            kubectl rollout status deployment/kezio-bootd-"${site}" -n kezio-system --timeout=180s
          done

      - name: Assert the boot artifacts agent commit
        # Both sites share the same kezio-boot-artifacts image, so
        # checking site-a's bootd is representative of both.
        uses: ./.github/actions/assert-boot-artifacts-agent-commit
        with:
          bootd-ip: ${{ env.SITE_A_BOOTD_NET1_IP }}
          expected-commit: ${{ github.sha }}
          build-boot-artifacts: ${{ inputs.build_boot_artifacts }}

      - name: Ingest the marker-customized Ubuntu image through kezioctl
        # One Image, ingested once - both sites' Machines reference it
        # below. This is the "pre-warm" content: from the moment it
        # reaches Ready, the central seeder already serves it in full.
        run: |
          set -euo pipefail
          kubectl -n kezio-system port-forward svc/kezio-image-service 18080:8080 &
          PF_PID=$!
          echo "PF_PID=${PF_PID}" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:18080/healthz" && break
            sleep 1
          done

          bin/kezioctl image upload "${UBUNTU_CLOUD_IMAGE_PATH}" \
            --name e2e-scale-ubuntu \
            --namespace kezio-system \
            --server http://127.0.0.1:18080 \
            --token kezio-e2e-scale-token \
            --format qcow2

      - name: Wait for the Image to reach Ready (real ingest - qemu-img, sfdisk, partclone)
        uses: ./.github/actions/wait-for-image-ready
        with:
          image-name: e2e-scale-ubuntu

      - name: Stop the image-service port-forward
        if: always()
        run: kill "${PF_PID}" 2>/dev/null || true

      - name: Create the Machine CRs for both sites' target VMs
        # spec.networkSite is set for documentation purposes; nothing in
        # the boot/deploy path reads it today (a recorded future-use
        # allowance), so it plays no part in which bootd instance
        # actually answers a given VM's PXE request - that is decided
        # entirely by which bridge the VM's own NIC is attached to (see
        # the VirtualMachine step below).
        run: |
          for site in site-a site-b; do
            case "${site}" in
              site-a) mac="${SITE_A_VM_MAC}"; serial="${SITE_A_VM_DISK_SERIAL}" ;;
              site-b) mac="${SITE_B_VM_MAC}"; serial="${SITE_B_VM_DISK_SERIAL}" ;;
            esac
            cat <<EOF | kubectl apply -f -
          apiVersion: kezio.kojuro.date/v1alpha1
          kind: Machine
          metadata:
            name: e2e-scale-${site}
            namespace: kezio-system
          spec:
            bootMACAddress: "${mac}"
            online: true
            targetDisk:
              serialNumber: "${serial}"
            imageRef:
              name: e2e-scale-ubuntu
            networkSite: ${site}
          EOF
          done

      - name: Create and start both sites' target KubeVirt VirtualMachines
        # Same shape as e2e-kubevirt-reusable.yml's single VM, created
        # twice - each VM's provisioning interface attaches to its own
        # site's boot NetworkAttachmentDefinition, so each VM's PXE
        # broadcast only ever reaches its own site's kezio-bootd instance.
        run: |
          for site in site-a site-b; do
            case "${site}" in
              site-a) mac="${SITE_A_VM_MAC}"; serial="${SITE_A_VM_DISK_SERIAL}" ;;
              site-b) mac="${SITE_B_VM_MAC}"; serial="${SITE_B_VM_DISK_SERIAL}" ;;
            esac
            cat <<EOF | kubectl apply -f -
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: e2e-scale-${site}
            namespace: kezio-system
          spec:
            running: true
            template:
              metadata:
                labels:
                  kubevirt.io/vm: e2e-scale-${site}
              spec:
                domain:
                  cpu:
                    cores: 2
                  resources:
                    requests:
                      memory: 3Gi
                  firmware:
                    bootloader:
                      efi:
                        secureBoot: false
                  devices:
                    interfaces:
                      - name: provisioning
                        macAddress: "${mac}"
                        bridge: {}
                        bootOrder: 1
                    disks:
                      - name: data
                        serial: "${serial}"
                        bootOrder: 2
                        disk:
                          bus: virtio
                      - name: cloudinitdisk
                        disk:
                          bus: virtio
                networks:
                  - name: provisioning
                    multus:
                      networkName: kezio-boot-network-vm-${site}
                volumes:
                  - name: data
                    emptyDisk:
                      capacity: 4Gi
                  - name: cloudinitdisk
                    cloudInitNoCloud:
                      # See e2e-kubevirt-reusable.yml's cloudinitdisk
                      # comment: qemu-guest-agent.service can crash-loop
                      # in the guest and permanently fail (systemd
                      # StartLimitBurst exhausted) before ever staying up
                      # long enough for AgentConnected to appear, even
                      # though the deployed disk itself booted fine. This
                      # seed removes the restart burst limit and forces
                      # the unit enabled+running; qemu-guest-agent is
                      # already installed and systemd-started by the
                      # image, so this is not a reinstall.
                      userData: |
                        #cloud-config
                        write_files:
                          - path: /etc/systemd/system/qemu-guest-agent.service.d/override.conf
                            content: |
                              [Unit]
                              StartLimitIntervalSec=0
                              [Service]
                              Restart=always
                              RestartSec=1
                        runcmd:
                          - systemctl daemon-reload
                          - systemctl enable --now qemu-guest-agent.service
          EOF
          done
          # Applying each VirtualMachine only asks KubeVirt to create its
          # VirtualMachineInstance asynchronously, so a VMI object may
          # not exist yet ("no matches" errors `kubectl wait` immediately
          # instead of polling). Poll for each VMI to exist first, then
          # wait for it to report Ready.
          for vmi in e2e-scale-site-a e2e-scale-site-b; do
            deadline=$(( $(date +%s) + 60 ))
            until kubectl get vmi/"${vmi}" -n kezio-system >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "::error::VirtualMachineInstance ${vmi} did not appear within the timeout - the VM controller may not have reconciled it." >&2
                exit 1
              fi
              sleep 2
            done
          done
          kubectl wait vmi/e2e-scale-site-a -n kezio-system --for=condition=Ready --timeout=180s
          kubectl wait vmi/e2e-scale-site-b -n kezio-system --for=condition=Ready --timeout=180s

      - name: Start continuous VM console capture (site-a)
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: e2e-scale-site-a
          logfile: ${{ runner.temp }}/console-site-a.log

      - name: Start continuous VM console capture (site-b)
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: e2e-scale-site-b
          logfile: ${{ runner.temp }}/console-site-b.log

      - name: Wait for both Machines to reach Provisioned, sampling swarm peer counts meanwhile
        # The main gating wait: both site Machines must independently
        # reach Provisioned, each through its own site's boot chain.
        # Alongside that, this step port-forwards to all three seeder
        # endpoints and samples ezio's GetTorrentStatus RPC every
        # iteration, purely as informational evidence (see header
        # comment's "Honest scope") that never affects pass/fail.
        run: |
          set -euo pipefail

          central_pod="$(kubectl get pod -n kezio-system \
            -l 'app.kubernetes.io/component=ezio-seeder,!kezio.kojuro.date/network-site' \
            -o jsonpath='{.items[0].metadata.name}')"
          site_a_pod="$(kubectl get pod -n kezio-system \
            -l 'app.kubernetes.io/component=ezio-seeder,kezio.kojuro.date/network-site=site-a' \
            -o jsonpath='{.items[0].metadata.name}')"
          site_b_pod="$(kubectl get pod -n kezio-system \
            -l 'app.kubernetes.io/component=ezio-seeder,kezio.kojuro.date/network-site=site-b' \
            -o jsonpath='{.items[0].metadata.name}')"

          kubectl -n kezio-system port-forward pod/"${central_pod}" 15001:50051 >/dev/null 2>&1 &
          PF_CENTRAL=$!
          kubectl -n kezio-system port-forward pod/"${site_a_pod}" 15002:50051 >/dev/null 2>&1 &
          PF_SITE_A=$!
          kubectl -n kezio-system port-forward pod/"${site_b_pod}" 15003:50051 >/dev/null 2>&1 &
          PF_SITE_B=$!
          cleanup() { kill "${PF_CENTRAL}" "${PF_SITE_A}" "${PF_SITE_B}" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 3

          max_peers=0
          sample_swarm() {
            for port in 15001 15002 15003; do
              resp="$(grpcurl -plaintext -connect-timeout 2 -proto proto/ezio.proto -import-path proto \
                -d '{}' "127.0.0.1:${port}" ezio.EZIO/GetTorrentStatus 2>/dev/null || true)"
              [ -z "${resp}" ] && continue
              peers="$(jq -r '[.torrents[]?.numPeers // 0] | max // 0' <<<"${resp}" 2>/dev/null || echo 0)"
              case "${peers}" in ''|*[!0-9]*) peers=0 ;; esac
              if [ "${peers}" -gt "${max_peers}" ]; then
                max_peers="${peers}"
              fi
            done
          }

          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            state_a="$(kubectl get machine e2e-scale-site-a -n kezio-system -o jsonpath='{.status.state}' || true)"
            state_b="$(kubectl get machine e2e-scale-site-b -n kezio-system -o jsonpath='{.status.state}' || true)"
            echo "$(date -Is) site-a: ${state_a:-<none>}  site-b: ${state_b:-<none>}"

            sample_swarm

            if [ "${state_a}" = "Error" ] || [ "${state_b}" = "Error" ]; then
              echo "::error::A Machine landed in Error while deploying (site-a=${state_a:-<none>}, site-b=${state_b:-<none>})." >&2
              kubectl get machine e2e-scale-site-a e2e-scale-site-b -n kezio-system -o yaml
              exit 1
            fi
            if [ "${state_a}" = "Provisioned" ] && [ "${state_b}" = "Provisioned" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Both Machines did not reach Provisioned within the timeout (site-a=${state_a:-<none>}, site-b=${state_b:-<none>})." >&2
              exit 1
            fi
            sleep 10
          done

          echo "MAX_OBSERVED_SWARM_PEERS=${max_peers}" >> "$GITHUB_ENV"
          {
            echo "### Swarm peer-count sample (informational only)"
            echo
            echo "Maximum \`num_peers\` observed on any seeder endpoint's torrent"
            echo "while both site Machines were leeching concurrently: **${max_peers}**."
            echo
            echo "This is NOT a same-site locality measurement and NOT a"
            echo "WAN-copy-count measurement - every seeder and both VMs share one"
            echo "flat pod network on this single runner. It only shows whether"
            echo "more than one peer was actually connected to a torrent at once,"
            echo "which both leechers being active concurrently against the same"
            echo "swarm implies but this sample independently confirms."
          } >> "$GITHUB_STEP_SUMMARY"

          kubectl get machine e2e-scale-site-a e2e-scale-site-b -n kezio-system -o yaml

      - name: "Verify layer 1 (controller): status.provisioning matches spec, conditions clean (both sites)"
        run: |
          set -euo pipefail
          for site in site-a site-b; do
            machine_json="$(kubectl get machine e2e-scale-"${site}" -n kezio-system -o json)"

            provisioned_image="$(jq -r '.status.provisioning.image.imageRef.name' <<<"${machine_json}")"
            if [ "${provisioned_image}" != "e2e-scale-ubuntu" ]; then
              echo "::error::[${site}] status.provisioning.image.imageRef.name = ${provisioned_image}, want e2e-scale-ubuntu" >&2
              exit 1
            fi

            target_disk="$(jq -r '.status.provisioning.image.targetDisk' <<<"${machine_json}")"
            if [ -z "${target_disk}" ] || [ "${target_disk}" = "null" ]; then
              echo "::error::[${site}] status.provisioning.image.targetDisk is empty" >&2
              exit 1
            fi
            echo "[${site}] resolved target disk: ${target_disk}"

            ready_status="$(jq -r '.status.conditions[] | select(.type=="Ready") | .status' <<<"${machine_json}")"
            if [ "${ready_status}" != "True" ]; then
              echo "::error::[${site}] Ready condition status = ${ready_status}, want True" >&2
              echo "${machine_json}" | jq '.status.conditions'
              exit 1
            fi
          done

      - name: "Verify each site's DHCP relay leg reached its own existing-dhcp server"
        # Does NOT assert "a lease is obtainable only through the relay"
        # (either site's VM may legitimately take its own existing-dhcp
        # pod's direct offer or its own bootd's relayed copy). It proves
        # each site's relay leg fired independently, using that site's
        # own bootd/existing-dhcp pair - never the other site's,
        # confirming the two segments stayed disjoint.
        run: |
          set -euo pipefail
          for site in site-a site-b; do
            case "${site}" in
              site-a) bootd_ip="${SITE_A_BOOTD_NET1_IP%%/*}"; existing_dhcp_ip="${SITE_A_EXISTING_DHCP_NET1_IP%%/*}" ;;
              site-b) bootd_ip="${SITE_B_BOOTD_NET1_IP%%/*}"; existing_dhcp_ip="${SITE_B_EXISTING_DHCP_NET1_IP%%/*}" ;;
            esac
            relay_line="DHCP relay at ${bootd_ip} -> ${existing_dhcp_ip}"

            bootd_log="$(kubectl -n kezio-system logs deployment/kezio-bootd-"${site}" --all-containers --tail=-1)"
            if ! grep -qF "${relay_line}" <<<"${bootd_log}"; then
              echo "::error::[${site}] bootd's dnsmasq log never shows '${relay_line}' - the relay leg to that site's existing-dhcp server never fired." >&2
              echo "${bootd_log}"
              exit 1
            fi

            existing_dhcp_log="$(kubectl -n kezio-system logs deployment/kezio-existing-dhcp-"${site}" --all-containers --tail=-1)"
            if ! grep -qF "DHCPDISCOVER" <<<"${existing_dhcp_log}" || ! grep -qF "DHCPOFFER" <<<"${existing_dhcp_log}"; then
              echo "::error::[${site}] existing-dhcp's own log shows no DHCPDISCOVER/DHCPOFFER exchange - it never actually answered the request that site's bootd log says it relayed." >&2
              echo "${existing_dhcp_log}"
              exit 1
            fi
          done

      - name: "Wait for layer 2 (boot): both deployed disks boot and qemu-guest-agent connects"
        run: |
          set -euo pipefail
          for site in site-a site-b; do
            deadline=$(( $(date +%s) + 600 ))
            while true; do
              connected="$(kubectl get vmi e2e-scale-"${site}" -n kezio-system \
                -o jsonpath='{.status.conditions[?(@.type=="AgentConnected")].status}' || true)"
              echo "$(date -Is) [${site}] VMI AgentConnected: ${connected:-<none>}"
              [ "${connected}" = "True" ] && break
              if [ "$(date +%s)" -ge "${deadline}" ]; then
                echo "::error::[${site}] qemu-guest-agent never connected within the timeout after Provisioned - the VM did not boot from the deployed disk." >&2
                echo "===== [${site}] VMI e2e-scale-${site} conditions at timeout ====="
                kubectl get vmi e2e-scale-"${site}" -n kezio-system -o yaml || true
                exit 1
              fi
              sleep 5
            done

            guest_os_id="$(kubectl get vmi e2e-scale-"${site}" -n kezio-system -o jsonpath='{.status.guestOSInfo.id}')"
            echo "[${site}] guestOSInfo.id: ${guest_os_id}"
            if [ "${guest_os_id}" != "ubuntu" ]; then
              echo "::error::[${site}] guestOSInfo.id = ${guest_os_id}, want ubuntu (the deployed image's OS, not the live-boot environment's)" >&2
              exit 1
            fi
          done

      - name: "Verify layer 3 (content): read the marker file back through QGA and compare (both sites)"
        run: |
          set -euo pipefail
          for site in site-a site-b; do
            launcher_pod="$(kubectl get pods -n kezio-system -l kubevirt.io/vm=e2e-scale-"${site}" -o jsonpath='{.items[0].metadata.name}')"
            domain="kezio-system_e2e-scale-${site}"

            qga_exec() {
              kubectl exec -n kezio-system "${launcher_pod}" -c compute -- \
                virsh qemu-agent-command "${domain}" "$1"
            }

            open_reply="$(qga_exec "{\"execute\":\"guest-file-open\",\"arguments\":{\"path\":\"${MARKER_PATH}\",\"mode\":\"r\"}}")"
            handle="$(jq -r '.return' <<<"${open_reply}")"
            if [ "${handle}" = "null" ] || [ -z "${handle}" ]; then
              echo "::error::[${site}] guest-file-open on ${MARKER_PATH} failed: ${open_reply}" >&2
              exit 1
            fi

            read_reply="$(qga_exec "{\"execute\":\"guest-file-read\",\"arguments\":{\"handle\":${handle},\"count\":4096}}")"
            qga_exec "{\"execute\":\"guest-file-close\",\"arguments\":{\"handle\":${handle}}}" >/dev/null

            marker_content="$(jq -r '.return["buf-b64"]' <<<"${read_reply}" | base64 -d | tr -d '\n')"
            echo "[${site}] marker content: ${marker_content}"

            if [ "${marker_content}" != "${MARKER_TOKEN}" ]; then
              echo "::error::[${site}] marker file content mismatch: guest has ${marker_content@Q}, expected ${MARKER_TOKEN@Q}" >&2
              exit 1
            fi
          done

      - name: Job summary
        if: always()
        run: |
          {
            echo "## E2E Scale (Multi-Site KubeVirt VMs)"
            echo
            echo "Proves: two site leechers (site-a, site-b), each behind its own"
            echo "simulated boot L2 segment, deployed the same Image concurrently"
            echo "through a swarm with more than one seeder endpoint (a central"
            echo "seeder that already holds the full image, plus one site-local"
            echo "seeder replica per site) - not one leecher at a time against a"
            echo "single seeder."
            echo
            echo "Does NOT prove: WAN byte savings, or that same-site peers"
            echo "preferentially exchange pieces over the LAN. This runs on one"
            echo "GitHub-hosted runner with one flat pod network for all BitTorrent"
            echo "traffic - there is no real inter-site latency or bandwidth"
            echo "difference for peer selection to respond to. See this workflow"
            echo "file's own header comment for the full honest-scope statement."
            echo
            echo "Peer-count sample: \`${MAX_OBSERVED_SWARM_PEERS:-<not reached>}\`"
            echo "(informational only - see the sampling step's own summary output"
            echo "above for what it does and does not show)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "===== nodes ====="
          kubectl get nodes -o wide
          echo "===== kezio-system pods ====="
          kubectl get pods -n kezio-system -o wide
          echo "===== controller-manager logs ====="
          kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=1000
          for site in site-a site-b; do
            echo "===== bootd logs (${site}) ====="
            kubectl -n kezio-system logs deployment/kezio-bootd-"${site}" --all-containers --tail=1000
            echo "===== existing-dhcp logs (${site}, that site's stand-in existing DHCP server) ====="
            kubectl -n kezio-system logs deployment/kezio-existing-dhcp-"${site}" --all-containers --tail=1000
            echo "===== seeder logs (${site}) ====="
            kubectl -n kezio-system logs deployment/kezio-ezio-seeder-"${site}" --tail=1000
          done
          echo "===== central seeder logs ====="
          kubectl -n kezio-system logs deployment/kezio-ezio-seeder --tail=1000
          echo "===== opentracker logs ====="
          kubectl -n kezio-system logs deployment/kezio-opentracker --tail=1000
          echo "===== image-service logs ====="
          kubectl -n kezio-system logs deployment/kezio-image-service --tail=1000
          echo "===== ingest Job(s) ====="
          kubectl get jobs -n kezio-system -l kezio.kojuro.date/image -o wide
          kubectl logs -n kezio-system -l kezio.kojuro.date/image --all-containers --tail=1000
          echo "===== VirtualMachine / VMI ====="
          kubectl get vm,vmi -n kezio-system -o yaml
          for site in site-a site-b; do
            echo "===== VM console (last output, ${site}) ====="
            timeout 20 virtctl console e2e-scale-"${site}" -n kezio-system || true
          done
          echo "===== Machine CRs ====="
          kubectl get machine e2e-scale-site-a e2e-scale-site-b -n kezio-system -o yaml
          echo "===== Image CR ====="
          kubectl get image e2e-scale-ubuntu -n kezio-system -o yaml
          echo "===== events ====="
          kubectl get events -n kezio-system --sort-by=.lastTimestamp
          echo "===== host FORWARD chain (canal/br_netfilter can silently drop bridged traffic here) ====="
          sudo iptables -L FORWARD -v --line-numbers || true
          sysctl net.bridge.bridge-nf-call-iptables || true
          echo "===== host mangle table CHECKSUM rules (fills UDP checksums each site VM's virtio-net offloaded) ====="
          sudo iptables -t mangle -L POSTROUTING -v --line-numbers || true
          for bridge in "${SITE_A_BRIDGE}" "${SITE_B_BRIDGE}"; do
            echo "===== ${bridge} offload settings ====="
            ethtool -k "${bridge}" | head || true
          done

      - name: Stop the bridge captures and flush them to the artifact
        if: always()
        # Runs unconditionally, not just on failure.
        run: |
          set +e
          sudo pkill -TERM -f "tcpdump -i ${SITE_A_BRIDGE}"
          sudo pkill -TERM -f "tcpdump -i ${SITE_B_BRIDGE}"
          sleep 2
          for site_pcap in bridge-site-a bridge-site-b; do
            if [ -s "${RUNNER_TEMP}/${site_pcap}.pcap" ]; then
              sudo chmod 0644 "${RUNNER_TEMP}/${site_pcap}.pcap"
              tcpdump -vvv -r "${RUNNER_TEMP}/${site_pcap}.pcap" > "${RUNNER_TEMP}/${site_pcap}-pcap.txt" 2>&1
            fi
          done

      - name: Flush each site's bootd and existing-dhcp logs to the artifact
        if: always()
        # Unconditional, like the pcap flush above: these logs carry
        # log-dhcp decision lines, useful on a passing run too.
        run: |
          set +e
          for site in site-a site-b; do
            kubectl -n kezio-system logs deployment/kezio-bootd-"${site}" --all-containers --tail=-1 \
              > "${RUNNER_TEMP}/bootd-${site}.log" 2>&1 || true
            kubectl -n kezio-system logs deployment/kezio-existing-dhcp-"${site}" --all-containers --tail=-1 \
              > "${RUNNER_TEMP}/existing-dhcp-${site}.log" 2>&1 || true
          done
          exit 0

      - name: Collect the always-on diagnostics bundle
        if: always()
        # Unconditional, like the pcap/per-site log flushes above:
        # controller-manager's log is where the boot server's per-request
        # lines land, and the rest is the same Machine/Image/events
        # picture the failure-only dump prints inline - useful on a
        # passing run too.
        uses: ./.github/actions/collect-e2e-diagnostics-bundle
        with:
          output-dir: ${{ runner.temp }}
          deployments: |
            kezio-controller-manager:controller-manager.log
            kezio-ezio-seeder-site-a:ezio-seeder-site-a.log
            kezio-ezio-seeder-site-b:ezio-seeder-site-b.log
            kezio-ezio-seeder:ezio-seeder-central.log
            kezio-opentracker:opentracker.log
            kezio-image-service:image-service.log
          job-label-selectors: |
            kezio.kojuro.date/image:ingest.log
          resources: |
            machine/e2e-scale-site-a:machine-site-a.yaml
            machine/e2e-scale-site-b:machine-site-b.yaml
            image/e2e-scale-ubuntu:image.yaml
            vm/e2e-scale-site-a:vm-site-a.yaml
            vm/e2e-scale-site-b:vm-site-b.yaml
            vmi/e2e-scale-site-a:vmi-site-a.yaml
            vmi/e2e-scale-site-b:vmi-site-b.yaml

      - name: Upload E2E diagnostics artifacts
        # Always, not just on failure - the bridge captures are worth
        # having on a passing run too.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.job }}
          path: |
            ${{ runner.temp }}/console-site-a.log
            ${{ runner.temp }}/console-site-b.log
            ${{ runner.temp }}/bridge-site-a.pcap
            ${{ runner.temp }}/bridge-site-a-pcap.txt
            ${{ runner.temp }}/bridge-site-b.pcap
            ${{ runner.temp }}/bridge-site-b-pcap.txt
            ${{ runner.temp }}/bootd-site-a.log
            ${{ runner.temp }}/bootd-site-b.log
            ${{ runner.temp }}/existing-dhcp-site-a.log
            ${{ runner.temp }}/existing-dhcp-site-b.log
            ${{ runner.temp }}/controller-manager.log
            ${{ runner.temp }}/ezio-seeder-site-a.log
            ${{ runner.temp }}/ezio-seeder-site-b.log
            ${{ runner.temp }}/ezio-seeder-central.log
            ${{ runner.temp }}/opentracker.log
            ${{ runner.temp }}/image-service.log
            ${{ runner.temp }}/ingest.log
            ${{ runner.temp }}/machine-site-a.yaml
            ${{ runner.temp }}/machine-site-b.yaml
            ${{ runner.temp }}/image.yaml
            ${{ runner.temp }}/vm-site-a.yaml
            ${{ runner.temp }}/vm-site-b.yaml
            ${{ runner.temp }}/vmi-site-a.yaml
            ${{ runner.temp }}/vmi-site-b.yaml
            ${{ runner.temp }}/events.txt
          if-no-files-found: ignore
          retention-days: 14
