name: E2E BMC-Driven Deploy (KubeVirtBMC + KubeVirt VM)

# Thin workflow_dispatch caller for the BMC-driven scenario in
# e2e-kubevirt-reusable.yml (see that file's own header comment,
# "Topology note" section, for what changes when bmc_mode is set and what
# the job proves). This file exists so the trigger, gating, and
# BMC-specific naming kezio's own maintainers use stay exactly what they
# were before the scenario was folded into the reusable workflow - only
# the job body moved, not this file's behavior.
#
# workflow_dispatch only, release-gated exactly like
# e2e-deploy-kubevirt.yml (see that workflow's header for why: it cannot
# reach a live boot without a published boot-artifacts release), plus
# this workflow adds a second, independent gate: it needs a published
# KubeVirtBMC release whose install manifest and image tags match
# kubevirtbmc_version below. Both gates are pinned, not auto-discovered,
# so a version bump on either side is a deliberate edit to this file.
# Trigger it by hand after touching internal/bmc, internal/deployer's BMC
# wiring, or when deliberately validating the BMC-driven power/PXE path
# end to end. Expect early runs to need iteration: this is the heaviest
# lane in the repository (every cost e2e-deploy-kubevirt.yml pays, plus
# KubeVirtBMC's own control plane and webhook, plus the extra power
# cycle), and it is exercising an integration (kezio's Redfish driver
# against KubeVirtBMC's Redfish implementation) that has never run
# end-to-end before this workflow existed.
on:
  workflow_dispatch:
    inputs:
      boot_artifacts_version:
        description: >-
          Boot-artifacts release tag to boot (see
          .github/workflows/build-live-image.yml). Empty uses the
          repository's latest published release. Publishing a release is
          a maintainer action (a "v*" tag push, or a manual
          build-live-image.yml dispatch with publish=true); this input
          only selects among what is already published.
        required: false
        type: string

jobs:
  bmc-kubevirt:
    name: Power and PXE-boot a KubeVirt VM through KubeVirtBMC, deploy through it, and verify
    uses: ./.github/workflows/e2e-kubevirt-reusable.yml
    permissions:
      contents: read
    with:
      boot_artifacts_version: ${{ inputs.boot_artifacts_version }}
      bmc_mode: true
      manager_image: "example.com/kezio:e2e-bmc"
      bootd_image: "example.com/kezio-bootd:e2e-bmc"
      ingest_image: "example.com/kezio-ingest:e2e-bmc"
      seeder_image: "example.com/kezio-seeder:e2e-bmc"
      image_service_image: "example.com/kezio-image-service:e2e-bmc"
      target_vm_name: "e2e-bmc-vm"
      target_vm_mac: "52:54:00:be:ef:03"
      target_vm_disk_serial: "KEZIOE2EBMCDISK1"
      image_name: "e2e-bmc-ubuntu"
      image_service_token: "kezio-e2e-bmc-token"
      # ezio_ref, kubevirtbmc_version, and opentracker_image are left at
      # the reusable workflow's own defaults, which are kezio's current
      # values - kezio's own dispatch trigger needs no overrides.
