name: E2E BMC-Driven Deploy (KubeVirtBMC + KubeVirt VM)

# Thin workflow_dispatch caller for the BMC-driven scenario in
# e2e-kubevirt-reusable.yml (see that file's own header comment,
# "Topology note" section, for the full BMC-driven power/PXE flow). This
# is kezio's production-representative acceptance lane and the reusable
# workflow's only remaining caller (kezio never ships without a BMC
# driver).
#
# workflow_dispatch only: needs a published kezio-boot-artifacts image
# (unless build_boot_artifacts is set) plus a second, independent gate -
# a published KubeVirtBMC release whose install manifest and image tags
# match kubevirtbmc_version below. Both gates are pinned, not
# auto-discovered, so a version bump on either side is a deliberate edit
# to this file. This is the heaviest lane in the repository (KVM setup,
# cluster+addon installs, a full live PXE boot, a real
# partclone/BitTorrent deploy, KubeVirtBMC's own control plane and
# webhook, plus an extra power cycle); expect early runs to need
# iteration.
on:
  workflow_dispatch:
    inputs:
      boot_artifacts_image:
        description: >-
          kezio-boot-artifacts OCI image to boot (see .github/workflows/
          build-live-image.yml). Ignored when build_boot_artifacts is
          true. Defaults to the published "latest" tag.
        required: false
        type: string
        default: "ghcr.io/tjjh89017/kezio-boot-artifacts:latest"
      build_boot_artifacts:
        description: >-
          Build the live boot image (including kezio-agent) from this
          checkout instead of pulling boot_artifacts_image - the way to
          exercise an internal/agent or cmd/agent change under test.
          Slower; see e2e-kubevirt-reusable.yml's own input description.
          A CI-grade run of this lane (validating a real internal/agent
          or cmd/agent change, not just re-running the last published
          artifact) should set this true; the in-lane build is the
          reliable path since this lane must also be dispatchable
          standalone, with no prior main.yaml run to borrow artifacts
          from.
        required: false
        type: boolean
        default: false
      dhcp_scenario:
        description: >-
          Which of kezio-bootd's DHCP scenarios this run drives - see
          e2e-kubevirt-reusable.yml's own input description for the
          full "why" of each.
        required: false
        type: choice
        options:
          - no-relay
          - lease
        default: no-relay

jobs:
  bmc-kubevirt:
    name: Power and PXE-boot a KubeVirt VM through KubeVirtBMC, deploy through it, and verify
    uses: ./.github/workflows/e2e-kubevirt-reusable.yml
    permissions:
      contents: read
    with:
      boot_artifacts_image: ${{ inputs.boot_artifacts_image }}
      build_boot_artifacts: ${{ inputs.build_boot_artifacts }}
      dhcp_scenario: ${{ inputs.dhcp_scenario }}
      manager_image: "example.com/kezio:e2e-bmc"
      bootd_image: "example.com/kezio-bootd:e2e-bmc"
      ingest_image: "example.com/kezio-ingest:e2e-bmc"
      seeder_image: "example.com/kezio-seeder:e2e-bmc"
      image_service_image: "example.com/kezio-image-service:e2e-bmc"
      target_vm_name: "e2e-bmc-vm"
      target_vm_mac: "52:54:00:be:ef:03"
      target_vm_disk_serial: "KEZIOE2EBMCDISK1"
      image_name: "e2e-bmc-ubuntu"
      image_service_token: "kezio-e2e-bmc-token"
      # ezio_ref, kubevirtbmc_version, and opentracker_image are left at
      # the reusable workflow's own defaults, which are kezio's current
      # values - kezio's own dispatch trigger needs no overrides.
