name: Probe - partition ingest timing

# Times real ingest (qemu-img, sfdisk, partclone) through the
# per-partition-PVC/publish path (internal/controller/partition_storage.go,
# image_publish.go) against a disposable single-node RKE2 cluster, with no
# KubeVirt VM involved: only image-service and ingest are built and
# deployed, INGEST_STORE_PVC is deliberately never set (that env var is
# what selects the legacy shared-store path instead - see
# IngestConfig.legacy()'s doc comment), so this is the one place in CI
# that actually exercises the code the per-partition-PVC change added.
#
# Source disk images are synthesized directly on the runner with
# parted/mkfs.ext4 over a loop device - real GPT partition tables and
# real ext4 filesystems, just far smaller than a cloud image, so what is
# under test is ingest's own partition/PVC/publish handling, not disk
# download or filesystem-creation time. Three images (1, 2, and 4
# partitions) are ingested in turn against the same cluster so a timing
# difference reflects partition count, not cluster variance between runs.
# The timing/assertion body lives in
# .github/actions/time-partition-ingest so this workflow stays a thin,
# dispatchable wrapper around cluster setup.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RKE2_VERSION: "v1.36.2+rke2r1"
  LOCAL_PATH_PROVISIONER_VERSION: "v0.0.37"
  MANAGER_IMG: "example.com/kezio:probe-partition-ingest"
  INGEST_IMG: "example.com/kezio-ingest:probe-partition-ingest"
  IMAGE_SERVICE_IMG: "example.com/kezio-image-service:probe-partition-ingest"
  IMAGE_SERVICE_TOKEN: "probe-partition-ingest-token"

jobs:
  partition-ingest:
    name: Time real ingest through the per-partition-PVC/publish path
    runs-on: ubuntu-latest
    # No cloud image download, no seeder (from-source ezio/libtorrent
    # build), no KubeVirt/CDI - just RKE2, two small Go-binary images, and
    # three small synthetic-disk ingests. Generous headroom kept anyway:
    # this exists specifically to catch a hang, and a probe that itself
    # times out at the same budget as what it is investigating would not
    # tell stuck and slow apart.
    timeout-minutes: 25
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install disk-image tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils parted e2fsprogs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the manager and ingest and image-service images
        run: |
          set -euo pipefail
          go mod tidy
          make docker-build IMG="${MANAGER_IMG}"
          make docker-build-ingest INGEST_IMG="${INGEST_IMG}"
          make docker-build-image-service IMAGE_SERVICE_IMG="${IMAGE_SERVICE_IMG}"
          make build-kezioctl

      - name: Write the RKE2 config (must exist before the service starts)
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/rancher/rke2
          cat <<'EOF' | sudo tee /etc/rancher/rke2/config.yaml
          write-kubeconfig-mode: "0644"
          cni: canal
          EOF

      - name: Install RKE2
        run: |
          set -euo pipefail
          curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${RKE2_VERSION}" sh -
          sudo systemctl enable --now rke2-server.service

          sudo ln -sf /var/lib/rancher/rke2/bin/kubectl /usr/local/bin/kubectl
          sudo ln -sf /var/lib/rancher/rke2/bin/ctr /usr/local/bin/ctr
          sudo ln -sf /var/lib/rancher/rke2/bin/crictl /usr/local/bin/crictl

          echo "KUBECONFIG=/etc/rancher/rke2/rke2.yaml" >> "$GITHUB_ENV"
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          for _ in $(seq 1 90); do
            [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ] && break
            sleep 2
          done
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl get nodes -o wide

      - name: Install local-path-provisioner and mark it the default StorageClass
        # WaitForFirstConsumer is the exact mechanism the per-partition-PVC
        # hang hypothesis rests on (see rancher/local-path-provisioner's
        # bundled StorageClass) - this probe needs the real thing, not a
        # stand-in binding mode.
        run: |
          set -euo pipefail
          kubectl apply -f "https://raw.githubusercontent.com/rancher/local-path-provisioner/${LOCAL_PATH_PROVISIONER_VERSION}/deploy/local-path-storage.yaml"
          kubectl -n local-path-storage rollout status deployment/local-path-provisioner --timeout=180s
          kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

      - name: Install cert-manager
        uses: ./.github/actions/install-cert-manager

      - name: Import images into RKE2 containerd
        run: |
          set -euo pipefail
          for img in "${MANAGER_IMG}" "${INGEST_IMG}" "${IMAGE_SERVICE_IMG}"; do
            docker save "${img}" | sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import -
          done

      - name: Deploy the controller-manager and image-service, wired for the per-partition-PVC path
        # INGEST_STORE_PVC is never set: that is the one env var that
        # switches IngestConfig.legacy() on (see cmd/main.go's
        # ingestConfigFromEnv), and every existing e2e lane sets it - this
        # probe exists precisely to run the path none of them do.
        # INGEST_PARTITION_STORAGE_CLASS/INGEST_SCRATCH_STORAGE_CLASS are
        # also left unset: local-path is this cluster's default
        # StorageClass (patched above), so an unset storageClassName on a
        # PVC resolves to the same thing.
        run: |
          set -euo pipefail
          make kustomize
          cd config/manager && ../../bin/kustomize edit set image controller="${MANAGER_IMG}"
          cd ../image-service && ../../bin/kustomize edit set image image-service="${IMAGE_SERVICE_IMG}"
          cd ../..
          bin/kustomize build config/e2e-partition-ingest-probe | kubectl apply -f -

          kubectl -n kezio-system create secret generic kezio-image-service-token \
            --from-literal=token="${IMAGE_SERVICE_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n kezio-system set env deployment/kezio-controller-manager \
            INGEST_IMAGE="${INGEST_IMG}" \
            INGEST_STAGING_PVC=kezio-image-service-staging \
            INGEST_SERVICE_ACCOUNT=kezio-ingest

          kubectl rollout status deployment/kezio-controller-manager -n kezio-system --timeout=180s
          kubectl rollout status deployment/kezio-image-service -n kezio-system --timeout=180s

      - name: Port-forward image-service
        run: |
          set -euo pipefail
          kubectl -n kezio-system port-forward svc/kezio-image-service 18080:8080 &
          echo "$!" >"${RUNNER_TEMP}/port-forward.pid"
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:18080/healthz" && exit 0
            sleep 1
          done
          echo "::error::image-service never became reachable through the port-forward" >&2
          exit 1

      - name: Time ingest with 1 partition
        uses: ./.github/actions/time-partition-ingest
        with:
          image-name: probe-part-1
          partition-count: "1"
          image-service-token: ${{ env.IMAGE_SERVICE_TOKEN }}
          deadline-seconds: "300"

      - name: Time ingest with 2 partitions
        uses: ./.github/actions/time-partition-ingest
        with:
          image-name: probe-part-2
          partition-count: "2"
          image-service-token: ${{ env.IMAGE_SERVICE_TOKEN }}
          deadline-seconds: "300"

      - name: Time ingest with 4 partitions
        uses: ./.github/actions/time-partition-ingest
        with:
          image-name: probe-part-4
          partition-count: "4"
          image-service-token: ${{ env.IMAGE_SERVICE_TOKEN }}
          deadline-seconds: "300"

      - name: Stop the port-forward
        if: always()
        run: |
          kill "$(cat "${RUNNER_TEMP}/port-forward.pid")" 2>/dev/null || true

      - name: Record the result
        if: always()
        run: |
          {
            echo "## Partition ingest timing probe"
            echo "See each \"Time ingest with N partitions\" step log for the per-image ready_in_seconds breakdown and the state/reason timeline behind it."
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "===== kezio-system pods ====="
          kubectl get pods -n kezio-system -o wide
          echo "===== controller-manager logs ====="
          kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=1000
          echo "===== image-service logs ====="
          kubectl -n kezio-system logs deployment/kezio-image-service --all-containers --tail=500
          echo "===== kezio Images ====="
          kubectl get images -n kezio-system -o wide
          echo "===== PVCs ====="
          kubectl get pvc -n kezio-system -o wide
          echo "===== events ====="
          kubectl get events -n kezio-system --sort-by=.lastTimestamp
