name: main

on:
  push:
    branches:
      - main
  pull_request:

env:
  GO_VERSION: "1.26.5"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tjjh89017

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test

  # Image <-> Dockerfile mapping grows one row per component as later
  # stages add it; this stage builds only the manager image.
  images:
    name: ${{ matrix.name }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            image: kezio
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
            local-tag: example.com/kezio:e2e
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # load:true cannot hold a multi-platform manifest - amd64 only, for
      # the tarball hand-off downstream e2e jobs consume.
      - name: Build (amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.local-tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Save the image to a tarball
        run: docker save ${{ matrix.local-tag }} -o /tmp/${{ matrix.name }}.tar

      - name: Upload the image tarball
        uses: actions/upload-artifact@v4
        with:
          name: image-tar-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.tar
          retention-days: 1
          if-no-files-found: error

      # Multi-arch push, main only - PRs never authenticate or push.
      - name: Push to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/push-image-to-ghcr
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags-spec: |
            type=ref,event=branch
          dockerfile: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          cache-scope: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Stable required-check names for the branch ruleset. The real jobs
  # hang off these through `needs`; the ruleset references "Build" and
  # "E2E" so the graph can grow without ruleset edits. The e2e lane
  # lands behind "E2E" next; until then it gates on the test job.
  build-required:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - images
    steps:
      - run: "true"

  e2e-required:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test
      - images
    steps:
      - run: "true"
