name: main

on:
  push:
    branches:
      - main
  pull_request:

env:
  GO_VERSION: "1.26.5"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tjjh89017
  IMAGE_SERVICE_TOKEN: "kezio-e2e-image-path-token"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test

  # Image <-> Dockerfile mapping grows one row per component as later
  # stages add it. Seeder is amd64-only: ezio's C++ build (cmake/boost/
  # libtorrent) is too slow under QEMU emulation. Ingest ships only apt
  # packages (partclone/qemu-utils/util-linux/fdisk) plus a CGO_ENABLED=0
  # Go binary, so it builds natively for both platforms. image-service is a
  # plain CGO_ENABLED=0 Go binary with no external tools at all (no apt
  # packages), so it also builds natively for both platforms.
  images:
    name: ${{ matrix.name }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            image: kezio
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
            local-tag: example.com/kezio:e2e
          - name: ingest
            image: kezio-ingest
            dockerfile: docker/ingest/Dockerfile
            platforms: linux/amd64,linux/arm64
            local-tag: example.com/kezio-ingest:e2e
          - name: seeder
            image: kezio-seeder
            dockerfile: docker/seeder/Dockerfile
            platforms: linux/amd64
            local-tag: example.com/kezio-seeder:e2e
          - name: image-service
            image: kezio-image-service
            dockerfile: docker/image-service/Dockerfile
            platforms: linux/amd64,linux/arm64
            local-tag: example.com/kezio-image-service:e2e
          - name: bootd
            image: kezio-bootd
            dockerfile: docker/bootd/Dockerfile
            platforms: linux/amd64,linux/arm64
            local-tag: example.com/kezio-bootd:e2e
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # load:true cannot hold a multi-platform manifest - amd64 only, for
      # the tarball hand-off downstream e2e jobs consume.
      - name: Build (amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.local-tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Save the image to a tarball
        run: docker save ${{ matrix.local-tag }} -o /tmp/${{ matrix.name }}.tar

      - name: Upload the image tarball
        uses: actions/upload-artifact@v4
        with:
          name: image-tar-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.tar
          retention-days: 1
          if-no-files-found: error

      # Multi-arch push, main only - PRs never authenticate or push.
      - name: Push to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/push-image-to-ghcr
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags-spec: |
            type=ref,event=branch
          dockerfile: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          cache-scope: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  boot-artifacts:
    name: Boot artifacts
    needs: [lint, test]
    runs-on: ubuntu-latest
    # `lb build` compiles ezio from source and assembles a full Debian sid
    # chroot into a squashfs - budget generously.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build the live boot image
        uses: ./.github/actions/build-live-image

      - name: Fail fast if the built boot artifacts are empty
        uses: ./.github/actions/assert-boot-artifacts-present

      - name: Upload the live image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kezio-live-image
          retention-days: 1
          path: |
            dist/live/vmlinuz
            dist/live/initrd.img
            dist/live/filesystem.squashfs
            dist/live/shimx64.efi
            dist/live/grubx64.efi
            dist/live/kernel.config
            dist/live/manifest.json
            dist/live/sha256sums
          if-no-files-found: error

  # Fast e2e lane: single-node RKE2, built entirely from composite
  # actions - install CRDs, deploy the manager, walk a Machine through
  # the fake deployer to Provisioned, assert its DeployRun, exercise
  # the failure paths (retry-to-success, dead-BMC delete give-up), walk
  # the deploy plan builder against a real mkfs-only Image/PostHook pair
  # (default hook, a custom hook, and an unresolvable one), then assert
  # the Machine reconcile count stays flat under progress-only DeployRun
  # status updates.
  e2e-fast-lane:
    name: Fast lane
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resource check (fail fast if the runner is under-resourced)
        uses: ./.github/actions/check-runner-resources
        with:
          min-cpus: "2"
          min-mem-mb: "7000"
          context-label: "the kezio fast e2e lane"

      - name: Download the manager image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-manager
          path: /tmp/images

      - name: Install RKE2
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: "v1.36.2+rke2r1"
          enable-multus: "false"

      - name: Import the manager image into RKE2 containerd
        uses: ./.github/actions/import-image-tarballs
        with:
          images: manager

      - name: Install cert-manager
        uses: ./.github/actions/install-cert-manager

      # The manager-image tag must match the local-tag the images job
      # baked into the tarball above, so the manager Deployment resolves
      # it from containerd instead of pulling from a registry.
      - name: Deploy kezio CRDs and controller-manager
        uses: ./.github/actions/deploy-kezio
        with:
          manager-image: example.com/kezio:e2e

      - name: Run a fake-deployer Machine walk
        uses: ./.github/actions/run-fake-deploy-walk
        with:
          namespace: "default"

      - name: Run fake-deployer failure-path scenarios
        uses: ./.github/actions/run-fake-failure-walk
        with:
          namespace: "default"

      - name: Run a fake-deployer plan-builder walk
        uses: ./.github/actions/run-fake-plan-walk
        with:
          namespace: "default"
          manager-namespace: "scaffold-system"

      - name: Run a fake-deployer disk-hint matching walk
        uses: ./.github/actions/run-fake-disk-hints-walk
        with:
          namespace: "default"

      - name: Run the watch-churn check
        uses: ./.github/actions/run-watch-churn-check
        with:
          namespace: "default"

      - name: Collect diagnostics
        if: failure()
        uses: ./.github/actions/collect-diagnostics
        with:
          namespace: "scaffold-system"
          workload-namespace: "default"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-lane-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

  # Image-path lane: RKE2 + an NFS-backed default StorageClass (RKE2 has
  # no default StorageClass, unlike the fast lane which needs no PVCs;
  # every controller-requested PVC here defaults to ReadWriteMany, which
  # plain local-path-provisioner alone cannot satisfy) + opentracker + the
  # image-service token Secret + the controller-manager, verified healthy,
  # then a real upload -> ingest -> publish -> Ready walk through kezioctl
  # (ingest-test-image), then run-leecher: a demand Machine naming the
  # ingested Image -> seeder Deployment Available -> a leecher Pod
  # downloads the content over BitTorrent and byte-compares it against
  # the fixture -> the demand Machine deleted.
  e2e-image-path:
    name: Image path
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resource check (fail fast if the runner is under-resourced)
        uses: ./.github/actions/check-runner-resources
        with:
          min-cpus: "2"
          min-mem-mb: "7000"
          context-label: "the kezio image-path e2e lane"

      - name: Download the manager image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-manager
          path: /tmp/images

      - name: Download the image-service image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-image-service
          path: /tmp/images

      # kezio-ingest is the same image the ingest and publish Jobs both
      # run, selected by INGEST_MODE - see IMAGE_INGEST_IMAGE and
      # PARTITIONCONTENT_PUBLISH_IMAGE below.
      - name: Download the ingest image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-ingest
          path: /tmp/images

      # run-leecher's seeder Deployment (PARTITIONCONTENT_SEEDER_IMAGE
      # below) runs this - amd64-only, matching the images job's seeder
      # matrix entry.
      - name: Download the seeder image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-seeder
          path: /tmp/images

      - name: Install RKE2
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: "v1.36.2+rke2r1"
          enable-multus: "false"

      - name: Import the manager, image-service, ingest, and seeder images into RKE2 containerd
        uses: ./.github/actions/import-image-tarballs
        with:
          images: manager image-service ingest seeder

      # RKE2 ships no default StorageClass, and every PVC the lane's
      # controllers request (the ingest scratch PVC, a PartitionContent's
      # content PVC, image-service's staging PVC) defaults to
      # ReadWriteMany in production. install-nfs-storage (csi-driver-nfs
      # + a small in-cluster NFS server, hostPath-backed - no
      # local-path-provisioner PVC needed underneath it) installs as the
      # default StorageClass so every one of those PVCs actually binds,
      # with no lane-only access-mode overrides anywhere downstream.
      - name: Install csi-driver-nfs and mark it the default StorageClass
        uses: ./.github/actions/install-nfs-storage

      - name: Install cert-manager
        uses: ./.github/actions/install-cert-manager

      # Creates the scaffold-system namespace (config/manager/manager.yaml)
      # that opentracker and the token Secret deploy into below - it must
      # run first.
      # The manager-image tag must match the local-tag the images job
      # baked into the tarball above, so the manager Deployment resolves
      # it from containerd instead of pulling from a registry.
      #
      # IMAGE_INGEST_STAGING_PVC must name the PVC image-service actually
      # deploys below (config/image-service's namePrefix "kezio-" applied
      # to "image-service-staging"), so a kezio-staged:// source resolves
      # in the same lane.
      #
      # IMAGE_INGEST_IMAGE and PARTITIONCONTENT_PUBLISH_IMAGE both name
      # the ingest tarball's local-tag: the Image controller's ingest Job
      # and the PartitionContent controller's publish Job run the same
      # kezio-ingest binary, selected by INGEST_MODE (ingest vs publish).
      # IMAGE_INGEST_SOURCE_FORMAT=raw matches ingest-test-image's fixture
      # disk, which the ingest Job would otherwise reject against the
      # manager's own qcow2 default (ImageIngestConfig.sourceFormat).
      # There is no cluster-wide tracker setting: every seeder Deployment
      # takes its announce URL from its own Site's status.trackerURL
      # instead - see the Site/Subnet creation steps below.
      # PARTITIONCONTENT_SEEDER_IMAGE names the seeder tarball's local-tag
      # imported above - without it, run-leecher's demand Machine would
      # only ever produce SeederDegraded=SeederImageMissing.
      # PARTITIONCONTENT_SEEDER_GRACE_PERIOD is shortened from the 5m
      # production default so a later lane item asserting the
      # grace-period shutdown itself does not have to wait 5 real
      # minutes; run-leecher does not wait it out either way.
      - name: Deploy kezio CRDs and controller-manager
        uses: ./.github/actions/deploy-kezio
        with:
          manager-image: example.com/kezio:e2e
          extra-env: |
            IMAGE_INGEST_STAGING_PVC=kezio-image-service-staging
            IMAGE_INGEST_IMAGE=example.com/kezio-ingest:e2e
            IMAGE_INGEST_SOURCE_FORMAT=raw
            PARTITIONCONTENT_PUBLISH_IMAGE=example.com/kezio-ingest:e2e
            PARTITIONCONTENT_SEEDER_IMAGE=example.com/kezio-seeder:e2e
            PARTITIONCONTENT_SEEDER_GRACE_PERIOD=30s

      # This lane runs with Multus disabled (install-rke2 above), so no
      # NetworkAttachmentDefinition exists for a Site-managed tracker to
      # single-home on - deploy-opentracker's plain cluster-network
      # Deployment/Service is what backs tracker.externalURL instead,
      # the escape hatch for an operator who already runs a tracker. A
      # plain ClusterIP Service is fine here because nothing on this
      # lane's seeder/leecher path is single-homed to begin with, unlike
      # the deploy lane's real machines.
      - name: Deploy opentracker
        uses: ./.github/actions/deploy-opentracker

      # The seed-demand Machine (run-leecher, below) needs its subnetRef
      # to resolve to a real Site with a working tracker - kezio-e2e-
      # leecher-demand-subnet is the exact name run-leecher's own Machine
      # manifest names. The Site/Subnet cross-reference is cyclic (see
      # create-site's own doc comment), so the Site is created twice:
      # bare first, then patched once the Subnet exists and points back.
      - name: Create the Site (bare)
        uses: ./.github/actions/create-site
        with:
          name: kezio-e2e-image-path-site
          wait-for: Valid

      # No boot half is exercised by this Subnet (the demand Machine
      # never PXE-boots - it only carries a fake BMC address), but the
      # Machine webhook still requires spec.subnetRef to resolve to a
      # Subnet with a boot half, so one is declared here even though
      # BOOTD_DEPLOYMENT_IMAGE is never configured in this lane and no
      # bootd Deployment is ever attempted. seeder-network-name is left
      # unset: this lane's seeder already runs on the ordinary cluster
      # network (no Multus), matching its existing behavior.
      - name: Create the Subnet for the demand Machine
        uses: ./.github/actions/create-subnet
        with:
          name: kezio-e2e-leecher-demand-subnet
          cidr: "203.0.113.0/24"
          bootd-server-ip: "203.0.113.2"
          bootd-network-name: kezio-boot-network
          site-ref: kezio-e2e-image-path-site

      # tracker.externalURL points at opentracker's Service (deployed
      # above) rather than Tracker.IP: a Site-managed tracker Deployment
      # needs a NAD to single-home on, and this lane has none.
      - name: Point the Site at its seeding Subnet
        uses: ./.github/actions/create-site
        with:
          name: kezio-e2e-image-path-site
          seeder-subnet-name: kezio-e2e-leecher-demand-subnet
          tracker-external-url: http://opentracker.scaffold-system.svc.cluster.local:6969/announce
          wait-for: Ready

      - name: Create the image-service bearer token Secret
        uses: ./.github/actions/create-image-service-token-secret
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      # The nfs StorageClass (installed above) satisfies ReadWriteMany, so
      # config/image-service's own default access mode (ReadWriteMany)
      # applies here unmodified - this lane needs no staging-access-mode
      # override.
      #
      # staging-size is still capped well under config/image-service's
      # 100Gi production default: the NFS export backing the "nfs"
      # StorageClass sits on the same runner disk as everything else in
      # the job, and this fixture never uploads more than tens of MiB
      # anyway, so there is no reason to request anywhere near 100Gi of
      # it.
      - name: Deploy image-service
        uses: ./.github/actions/deploy-image-service
        with:
          image-service-image: example.com/kezio-image-service:e2e
          staging-size: "2Gi"

      - name: Verify image-path prerequisites
        uses: ./.github/actions/verify-image-path-prerequisites

      - name: Ingest a test image through kezioctl
        id: ingest
        uses: ./.github/actions/ingest-test-image
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Seed, leech, and byte-compare the ingested content
        uses: ./.github/actions/run-leecher
        with:
          content-name: ${{ steps.ingest.outputs.content-ref }}
          image-name: ${{ steps.ingest.outputs.image-name }}
          partition-sha256: ${{ steps.ingest.outputs.partition-sha256 }}
          partition-size-bytes: ${{ steps.ingest.outputs.partition-size-bytes }}

      # Closes out the lane: dedupe (a second Image sharing
      # ingest-test-image's content), a composed (source-less) Image,
      # seeder grace-period shutdown, and the PartitionContent deletion
      # finalizer - see the action's own step-group comments for why the
      # order among them is load-bearing.
      - name: Assert Image/PartitionContent plane semantics
        uses: ./.github/actions/assert-image-plane-semantics
        with:
          content-name: ${{ steps.ingest.outputs.content-ref }}
          fixture-disk-path: ${{ steps.ingest.outputs.disk-path }}
          fixture-layout-path: ${{ steps.ingest.outputs.layout-path }}
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Collect diagnostics
        if: failure()
        uses: ./.github/actions/collect-diagnostics
        with:
          namespace: "scaffold-system"
          workload-namespace: "default"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-path-lane-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

  # Deploy lane: a KubeVirt VM PXE-boots through a per-Subnet bootd pod
  # into the live image, kezio-agent registers with a single-use token,
  # MachineHardware holds the inventory, and the Machine reaches
  # Available - this is the register phase, carried over unchanged from
  # the retired netboot lane, including its matrix (both of Subnet's DHCP
  # modes: proxydhcp, where an existing DHCP server stays lease authority
  # and bootd answers proxyDHCP only, and dhcp, where bootd's own
  # dnsmasq issues leases) and its MAC-gate assertion (fail-secure
  # against an unenrolled MAC). The lane then continues past
  # registration: a real OS test image is built and ingested, a marker
  # PostHook proves a specific deploy ran, and the Machine is driven
  # through a full deploy - partition write over BitTorrent, hooks,
  # finalize, reboot from disk - verified on three independent layers.
  # This is the slowest, flakiest lane, so it deliberately gates only
  # this minimum surface; further deploy-path assertions belong in later
  # steps or jobs, not more matrix legs here.
  e2e-deploy:
    name: Deploy lane
    needs: [build-required, e2e-fast-lane]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dhcp-scenario: [proxydhcp, dhcp]
    env:
      PROVISIONING_BRIDGE: kezio-prov0
      PROVISIONING_HOST_IP: 192.0.2.1/24
      PROVISIONING_CIDR: 192.0.2.0/24
      BOOTD_SERVER_IP: 192.0.2.2
      EXISTING_DHCP_NET1_IP: 192.0.2.3/24
      # Bare, like BOOTD_SERVER_IP, because the announce URL baked into
      # every torrent must be the tracker's own address on this segment -
      # a peer connects to whatever the tracker hands back, and nothing
      # on that path may rewrite it. The NAD's CIDR is derived at its use
      # site so the two can never drift apart.
      TRACKER_SERVER_IP: 192.0.2.4
      SEEDER_NET1_IP: 192.0.2.5/24
      LEASE_RANGE_START: 192.0.2.10
      LEASE_RANGE_END: 192.0.2.100
      SUBNET_NAME: netboot-${{ matrix.dhcp-scenario }}
      SITE_NAME: netboot-${{ matrix.dhcp-scenario }}-site
      TARGET_VM_NAME: netboot-vm
      TARGET_VM_MAC: "52:54:00:be:ef:03"
      # Stamped on the target VM's data disk and carried into the
      # Machine's targetDisk hint: the VM reports a cloud-init disk
      # beside it, so a deploy with no hint resolves as ambiguous.
      TARGET_DISK_SERIAL: KEZIONETBOOTDISK01
      UNKNOWN_VM_NAME: netboot-vm-unknown
      UNKNOWN_VM_MAC: "52:54:00:be:ef:99"
      BOOT_ARTIFACTS_IMG: "example.com/kezio-boot-artifacts:e2e"
    steps:
      - uses: actions/checkout@v4

      - name: Download the live boot image artifacts
        uses: actions/download-artifact@v4
        with:
          name: kezio-live-image
          path: dist/live

      - name: Fail fast if the downloaded boot artifacts are empty
        uses: ./.github/actions/assert-boot-artifacts-present

      - name: Prepare the KVM host
        uses: ./.github/actions/prepare-kvm-host

      # Higher than the retired netboot lane's own budget: this lane also
      # runs image-service/opentracker/seeder, builds and converts the
      # real OS test image (virt-customize under KVM), and writes it to
      # the target VM's disk over BitTorrent. 15800, not 16384: a GitHub
      # 16 GB runner reports ~15989 usable MiB, so a round-16-GB
      # threshold rejects the very runner class this lane targets.
      - name: Resource check (fail fast if the runner is under-resourced)
        uses: ./.github/actions/check-runner-resources
        with:
          min-cpus: "4"
          min-mem-mb: "15800"
          min-disk-gb: "30"
          context-label: "the deploy e2e lane"

      - name: Create the provisioning bridge
        uses: ./.github/actions/create-provisioning-bridge
        with:
          bridge-name: ${{ env.PROVISIONING_BRIDGE }}
          host-ip: ${{ env.PROVISIONING_HOST_IP }}

      # manager and bootd feed the register phase (unchanged from the
      # retired netboot lane); image-service, ingest, and seeder feed the
      # deploy phase this lane adds, the same trio the image-path lane
      # imports.
      - name: Download the manager, bootd, image-service, ingest, and seeder image tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: "image-tar-@(manager|bootd|image-service|ingest|seeder)"
          path: /tmp/images
          merge-multiple: true

      - name: Install RKE2 with Multus enabled
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: "v1.36.2+rke2r1"
          enable-multus: "true"

      - name: Harden the provisioning bridge for real PXE/DHCP traffic
        uses: ./.github/actions/harden-provisioning-bridge
        with:
          bridge-name: ${{ env.PROVISIONING_BRIDGE }}

      - name: Install local-path-provisioner and mark it the default StorageClass
        uses: ./.github/actions/install-local-path-provisioner
        with:
          version: "v0.0.37"

      # The target VM's data disk PVC (create-target-vm) names "local-path"
      # explicitly, so it keeps working - but every PVC the deploy phase's
      # own controllers request (image-service staging, PartitionContent
      # content) defaults to ReadWriteMany in production, which plain
      # local-path-provisioner alone cannot satisfy. install-nfs-storage
      # un-defaults local-path and takes over as the cluster default, the
      # same pairing the image-path lane uses.
      - name: Install csi-driver-nfs and mark it the default StorageClass
        uses: ./.github/actions/install-nfs-storage

      # Packages the downloaded dist/live/ artifacts into an OCI image -
      # cheap local repackaging, not a from-source live-image rebuild.
      - name: Build the boot-artifacts image
        run: make docker-build-boot-artifacts BOOT_ARTIFACTS_IMG="${{ env.BOOT_ARTIFACTS_IMG }}"

      - name: Save the boot-artifacts image to a tarball
        run: docker save "${{ env.BOOT_ARTIFACTS_IMG }}" -o /tmp/images/boot-artifacts.tar

      - name: Import the manager, bootd, boot-artifacts, image-service, ingest, and seeder images into RKE2 containerd
        uses: ./.github/actions/import-image-tarballs
        with:
          images: manager bootd boot-artifacts image-service ingest seeder

      - name: Install cert-manager, KubeVirt, virtctl, and CDI
        uses: ./.github/actions/install-cluster-addons
        with:
          kubevirt-version: "v1.9.0"
          cdi-version: "v1.65.0"

      - name: Install KubeVirtBMC
        uses: ./.github/actions/install-kubevirtbmc
        with:
          version: "v0.9.0"

      # BOOT_SERVER_URL/BOOT_AGENT_SERVER_URL point at bootd's own
      # provisioning-network address: bootd's reverse proxy is what a
      # net-booting machine can actually reach, not the ClusterIP
      # Services BOOTD_DEPLOYMENT_*_UPSTREAM_URL name.
      #
      # The IMAGE_INGEST_*/PARTITIONCONTENT_SEEDER_* vars below are the
      # same ones the image-path lane sets, wiring this one
      # controller-manager for both halves of the lane at once - there
      # is no second deploy-kezio call later for the deploy phase. See
      # the image-path lane's own deploy-kezio step for what each one
      # does; IMAGE_INGEST_SOURCE_FORMAT=raw matches
      # build-deploy-test-image's own raw conversion, not only
      # ingest-test-image's fixture. TRACKER_DEPLOYMENT_IMAGE, unlike
      # those, is set only here: the image-path lane runs with no Multus
      # NAD to single-home a Site-managed tracker on and uses
      # tracker.externalURL instead (see its own Site creation steps).
      - name: Deploy kezio CRDs and controller-manager
        uses: ./.github/actions/deploy-kezio
        with:
          manager-image: example.com/kezio:e2e
          kustomize-dir: config/netboot-e2e
          extra-env: |
            DEPLOYER=agent
            BOOT_SERVER_ADDR=:8090
            BOOT_SERVER_URL=http://${{ env.BOOTD_SERVER_IP }}
            BOOT_AGENT_SERVER_URL=http://${{ env.BOOTD_SERVER_IP }}
            AGENT_SERVER_ADDR=:8091
            BOOTD_DEPLOYMENT_IMAGE=example.com/kezio-bootd:e2e
            BOOTD_DEPLOYMENT_BOOT_ARTIFACTS_IMAGE=${{ env.BOOT_ARTIFACTS_IMG }}
            BOOTD_DEPLOYMENT_BOOT_UPSTREAM_URL=http://boot-server.scaffold-system.svc.cluster.local:8090
            BOOTD_DEPLOYMENT_AGENT_UPSTREAM_URL=http://agent-server.scaffold-system.svc.cluster.local:8091
            IMAGE_INGEST_STAGING_PVC=kezio-image-service-staging
            IMAGE_INGEST_IMAGE=example.com/kezio-ingest:e2e
            IMAGE_INGEST_SOURCE_FORMAT=raw
            PARTITIONCONTENT_PUBLISH_IMAGE=example.com/kezio-ingest:e2e
            PARTITIONCONTENT_SEEDER_IMAGE=example.com/kezio-seeder:e2e
            PARTITIONCONTENT_SEEDER_GRACE_PERIOD=30s
            # There is no cluster-wide tracker setting: the Site created
            # below owns a real tracker Deployment, single-homed on
            # kezio-tracker-network and bound to TRACKER_SERVER_IP - not
            # the ClusterIP Service the image-path lane's externalURL
            # case uses, since a ClusterIP DNATs and this lane's leecher
            # runs on a real machine that has no route to one either way.
            # TRACKER_DEPLOYMENT_IMAGE is the public opentracker build
            # config/opentracker's own (retired) Deployment used to run;
            # no local import is needed, the same way this image was
            # already pulled live by every lane that used to call
            # deploy-opentracker.
            TRACKER_DEPLOYMENT_IMAGE=ghcr.io/tunisiano187/opentracker-docker:master

      - name: Create the provisioning NetworkAttachmentDefinitions
        uses: ./.github/actions/create-provisioning-nads
        with:
          bridge-name: ${{ env.PROVISIONING_BRIDGE }}
          bootd-net1-ip: "${{ env.BOOTD_SERVER_IP }}/24"
          tracker-net1-ip: "${{ env.TRACKER_SERVER_IP }}/24"
          seeder-net1-ip: ${{ env.SEEDER_NET1_IP }}

      # SubnetReconciler's Valid condition checks the kezio-bootd
      # ServiceAccount already exists (its bootd Deployment stamps
      # serviceAccountName: kezio-bootd unconditionally) - apply
      # config/bootd's RBAC before the Subnet, not only through
      # deploy-bootd below, which cannot run until the Subnet's own
      # bootd Deployment exists.
      - name: Apply kezio-bootd's RBAC ahead of the Subnet
        run: kubectl apply -k config/bootd

      - name: Deploy the existing-dhcp pod on the provisioning bridge
        if: matrix.dhcp-scenario == 'proxydhcp'
        uses: ./.github/actions/deploy-existing-dhcp
        with:
          name: kezio-existing-dhcp
          image: "jpillora/dnsmasq:1.1@sha256:78a9c6711031a557d9c6a79a0b6e060c4ac09de3a8755c78d690acb55b4ccd15"
          bridge: ${{ env.PROVISIONING_BRIDGE }}
          static-cidr: ${{ env.EXISTING_DHCP_NET1_IP }}
          dhcp-range: "192.0.2.10,192.0.2.100,255.255.255.0,12h"

      # The Subnet webhook admits spec.siteRef only against a Site that
      # already exists, and the Site/Subnet cross-reference is cyclic
      # (create-site's own doc comment), so the Site is created bare
      # first and patched below, once the Subnet exists and points back.
      - name: Create the Site (bare)
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_NAME }}
          wait-for: Valid

      - name: Create the Subnet
        uses: ./.github/actions/create-subnet
        with:
          name: ${{ env.SUBNET_NAME }}
          cidr: ${{ env.PROVISIONING_CIDR }}
          bootd-server-ip: ${{ env.BOOTD_SERVER_IP }}
          bootd-network-name: kezio-boot-network
          # Without this the seeder pod only ever gets a cluster pod IP,
          # which is the one address a machine on the provisioning
          # segment cannot reach - so every leecher fails to fetch its
          # torrent and the deploy retries forever.
          seeder-network-name: kezio-seeder-network
          site-ref: ${{ env.SITE_NAME }}
          dhcp-scenario: ${{ matrix.dhcp-scenario }}
          lease-range-start: ${{ env.LEASE_RANGE_START }}
          lease-range-end: ${{ env.LEASE_RANGE_END }}

      # This Site's tracker Deployment single-homes on the same
      # kezio-tracker-network NAD create-provisioning-nads pinned
      # TRACKER_SERVER_IP on above, so it is reachable from every
      # segment this lane routes to it - the same address a peer's
      # announce response hands back. Ready needs the tracker
      # Deployment actually Available, which needs
      # TRACKER_DEPLOYMENT_IMAGE (set on the manager above).
      - name: Point the Site at its seeding Subnet
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_NAME }}
          seeder-subnet-name: ${{ env.SUBNET_NAME }}
          tracker-ip: ${{ env.TRACKER_SERVER_IP }}
          wait-for: Ready

      - name: Deploy kezio-bootd on the provisioning bridge
        uses: ./.github/actions/deploy-bootd
        with:
          subnet-name: ${{ env.SUBNET_NAME }}
          bootd-server-ip: ${{ env.BOOTD_SERVER_IP }}

      - name: Create the target VM
        uses: ./.github/actions/create-target-vm
        with:
          vm-name: ${{ env.TARGET_VM_NAME }}
          vm-mac: ${{ env.TARGET_VM_MAC }}
          disk-serial: "${{ env.TARGET_DISK_SERIAL }}"

      # Must precede provisioning through the BMC: it creates the
      # basic-auth Secret VirtualMachineBMC.spec.authSecretRef reads,
      # which create-bmc-machine also points Machine.spec.bmc at.
      - name: Create the Machine
        uses: ./.github/actions/create-bmc-machine
        with:
          secret-name: "${{ env.TARGET_VM_NAME }}-bmc-creds"
          machine-name: ${{ env.TARGET_VM_NAME }}
          bmc-address: "redfish+http://${{ env.TARGET_VM_NAME }}-virtbmc.scaffold-system.svc.cluster.local/redfish/v1/Systems/1"
          boot-mac: ${{ env.TARGET_VM_MAC }}
          subnet-name: ${{ env.SUBNET_NAME }}
          target-disk-serial: "${{ env.TARGET_DISK_SERIAL }}"

      - name: Provision the target VM through a real KubeVirtBMC/Redfish endpoint
        uses: ./.github/actions/provision-target-vm-via-bmc
        with:
          vm-name: ${{ env.TARGET_VM_NAME }}
          bmc-creds-secret-name: "${{ env.TARGET_VM_NAME }}-bmc-creds"

      - name: Start continuous VM console capture
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: ${{ env.TARGET_VM_NAME }}
          logfile: ${{ runner.temp }}/console-${{ matrix.dhcp-scenario }}.log

      - name: Wait for the agent to register and the Machine to become Available
        uses: ./.github/actions/wait-agent-registered
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}

      - name: Verify the DHCP scenario behaved as configured
        uses: ./.github/actions/verify-dhcp-scenario
        with:
          scenario: ${{ matrix.dhcp-scenario }}
          bootd-deployment-name: "kezio-bootd-${{ env.SUBNET_NAME }}"

      - name: Create the unenrolled-MAC VM
        uses: ./.github/actions/create-target-vm
        with:
          vm-name: ${{ env.UNKNOWN_VM_NAME }}
          vm-mac: ${{ env.UNKNOWN_VM_MAC }}
          disk-serial: "KEZIONETBOOTDISK02"

      - name: Assert the unenrolled MAC is never answered
        uses: ./.github/actions/assert-mac-not-allowlisted
        with:
          vm-name: ${{ env.UNKNOWN_VM_NAME }}
          mac: ${{ env.UNKNOWN_VM_MAC }}
          bmc-creds-secret-name: "${{ env.UNKNOWN_VM_NAME }}-bmc-creds"
          bootd-deployment-name: "kezio-bootd-${{ env.SUBNET_NAME }}"
          wait-seconds: "90"

      # Register phase ends above (carried over from the retired netboot
      # lane, unchanged). Everything below drives the registered Machine
      # through a real deploy - the image-path lane's own image-service
      # setup (the tracker is already up: the Site created earlier owns
      # it), then the deploy-specific prerequisites and the happy-path
      # deploy itself.

      - name: Create the image-service bearer token Secret
        uses: ./.github/actions/create-image-service-token-secret
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      # The nfs StorageClass (installed above) satisfies ReadWriteMany, so
      # config/image-service's own default access mode applies unmodified;
      # staging-size is capped the same way the image-path lane caps it -
      # the runner's own disk backs the "nfs" StorageClass.
      - name: Deploy image-service
        uses: ./.github/actions/deploy-image-service
        with:
          image-service-image: example.com/kezio-image-service:e2e
          staging-size: "2Gi"

      - name: Verify image-path prerequisites
        uses: ./.github/actions/verify-image-path-prerequisites
        with:
          # This lane's tracker is the Site-managed Deployment created
          # above, not a standalone opentracker (the action's own
          # default label).
          tracker-label-selector: "app.kubernetes.io/component=tracker"

      - name: Build and ingest the full-deploy test image
        id: build-image
        uses: ./.github/actions/build-deploy-test-image
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Create the full-deploy marker PostHook
        id: marker
        uses: ./.github/actions/create-deploy-marker-posthook

      # Two-axis status proof, strictly before the happy-path deploy
      # below: injects one plan-build failure, asserts status.state stays
      # unchanged while status.operationalStatus becomes "error", then
      # returns with the failing deploy intent still on the Machine.
      # deploy-machine's own merge patch (next step, unmodified) overwrites
      # spec.imageRef/postHookRefs unconditionally, so it is itself the
      # retry-to-success proof - see this action's own doc comment for why
      # the injected failure cannot leak into the happy-path deploy.
      - name: Prove state and operationalStatus are independent axes
        uses: ./.github/actions/assert-two-axis-status
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}

      # Abort-channel proof, still strictly before deploy-machine's own
      # happy-path patch: assert-two-axis-status's own failure never
      # reaches startProvisioningRun, so it leaves the Machine Available
      # with no DeployRun in flight - this action therefore sets the
      # Machine's own deploy intent itself (same shape deploy-machine's
      # own patch uses), waits for that to start a real DeployRun, waits
      # for it to actually reach WritingContent, deletes it mid-write, and
      # proves the sanctioned recovery path for a run that disappears out
      # from under a live deployment (recordCurrentRunDeleted) starts a
      # genuinely fresh run that itself reboots into a new kezio-agent and
      # reaches WritingContent again - see this action's own doc comment
      # for the full evidence trace, including why a deleted run's own
      # "failed" status is never observable after the fact. No Provisioned
      # wait happens here: deploy-machine's own unmodified patch+wait
      # (next step, a no-op re-patch of the same imageRef/postHookRefs)
      # and verify-deploy are what prove the controller's automatic retry
      # actually lands.
      - name: Assert deleting a mid-write DeployRun aborts the agent and retries cleanly
        uses: ./.github/actions/assert-abort-mid-write
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}

      # Captured right before deploy-machine patches the deploy intent in,
      # so verify-deploy's layer 3 can tell this run's marker apart from a
      # stale one left by an earlier deploy of the same disk. The aborted
      # run above never reached DeployRunPhaseRunningPostHook (it was
      # caught and deleted mid-WritingContent), so it never wrote a
      # full-deploy marker - this timestamp's position relative to the
      # abort action above is therefore immaterial to freshness, only its
      # position relative to deploy-machine's own patch matters.
      - name: Capture the pre-deploy timestamp
        id: pre-deploy
        run: echo "timestamp-ns=$(date -u +%s%N)" >>"${GITHUB_OUTPUT}"

      # posthook-names left at deploy-machine's own default: it already
      # pairs create-deploy-marker-posthook's default name with
      # kezio-default-finalize.
      - name: Set the Machine's deploy intent and wait for Provisioned
        id: deploy
        uses: ./.github/actions/deploy-machine
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}

      - name: Verify the deploy landed
        uses: ./.github/actions/verify-deploy
        with:
          machine-name: ${{ steps.deploy.outputs.machine-name }}
          namespace: ${{ steps.deploy.outputs.namespace }}
          deploy-run-name: ${{ steps.deploy.outputs.deploy-run-name }}
          pre-deploy-timestamp-ns: ${{ steps.pre-deploy.outputs.timestamp-ns }}

      # After verify-deploy: this asserts recorded history on the DeployRun
      # itself (phase, per-partition percent, phase timings), not an
      # outward effect of the deploy, so verify-deploy's three layers stay
      # the first and clearest signal if the deploy itself is broken.
      - name: Assert the DeployRun's recorded progress detail
        uses: ./.github/actions/assert-deploy-run-progress
        with:
          deploy-run-name: ${{ steps.deploy.outputs.deploy-run-name }}
          namespace: ${{ steps.deploy.outputs.namespace }}

      # Post-deploy power-cycle proof through the reboot annotation, still
      # strictly before the disk-destroying step below: the deployed OS
      # disk from deploy-machine/verify-deploy above is still intact here,
      # which this action's own marker-unchanged check depends on.
      - name: Assert a post-deploy power cycle runs through the reboot annotation
        uses: ./.github/actions/assert-reboot-annotation-cycle
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}

      # Last disk-touching step in this lane, deliberately: it reshapes the
      # Machine's spec away from the OS image just verified above onto a
      # dataImages-only intent, overwriting the same disk. A future
      # assertion that still needs the deployed OS intact (an
      # abort-mid-write proof, or a post-deploy power-cycle proof through
      # the reboot annotation) belongs above this step, not below it - see
      # this action's own doc comment.
      - name: Build and ingest the dataImages-only test image
        id: build-data-image
        uses: ./.github/actions/ingest-test-image
        with:
          image-name: "kezio-e2e-deploy-poweroff-data"
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Assert a dataImages-only deploy powers the machine off
        id: poweroff
        uses: ./.github/actions/assert-poweroff-after-deploy
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}
          image-name: ${{ steps.build-data-image.outputs.image-name }}
          target-disk-serial: "${{ env.TARGET_DISK_SERIAL }}"

      - name: Dump all kezio v1alpha2 resources
        if: always()
        uses: ./.github/actions/dump-kezio-resources

      # extra-resource-refs is deliberately not set here: every
      # still-existing resource (machine, subnet, image x2, posthook,
      # deployrun x2) is already dumped, byte-identically, by "Collect
      # always-on diagnostics bundle" below - which also runs on this
      # same failure since it is if: always(). The one run this dump
      # cannot cover is the mid-write DeployRun that
      # assert-abort-mid-write deletes: dump-kezio-resources's `kubectl
      # get` above runs after that deletion, so a deleted object cannot
      # come back from it, and no extra-resource-refs entry could fix
      # that either. That run's evidence lives instead in the deleting
      # step's own log output, the console capture, and the controller
      # logs - see assert-abort-mid-write's own doc comment.
      - name: Dump diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-e2e-diagnostics
        with:
          target-vm-name: ${{ env.TARGET_VM_NAME }}
          provisioning-bridge: ${{ env.PROVISIONING_BRIDGE }}
          bootd-label-selector: "app.kubernetes.io/component=bootd,kezio.kojuro.date/bootd-subnet=${{ env.SUBNET_NAME }}"

      # The ingest/publish Jobs have no other log channel in this lane:
      # dump-e2e-diagnostics's extra-deployment-logs/extra-job-label-
      # selectors are unset above, and build-deploy-test-image/
      # ingest-test-image only dump ingest Job logs inline if their own
      # step is the one that fails, not a later one. The tracker
      # Deployment's logs are not named here - it is Site-managed
      # (kezio-tracker-<site>, no fixed name) and collect-site-
      # diagnostics below already covers it by label selector.
      - name: Collect always-on diagnostics bundle
        if: always()
        uses: ./.github/actions/collect-e2e-diagnostics-bundle
        with:
          output-dir: e2e-bundle
          deployments: |
            kezio-bootd-${{ env.SUBNET_NAME }}:bootd.log
            scaffold-controller-manager:controller-manager.log
            kezio-image-service:image-service.log
          resources: |
            machine/${{ env.TARGET_VM_NAME }}:machine.yaml
            subnet/${{ env.SUBNET_NAME }}:subnet.yaml
            site/${{ env.SITE_NAME }}:site.yaml
            machinehardware/${{ env.TARGET_VM_NAME }}:machinehardware.yaml
            image/${{ steps.build-image.outputs.image-name }}:image.yaml
            posthook/${{ steps.marker.outputs.name }}:posthook.yaml
            deployrun/${{ steps.deploy.outputs.deploy-run-name }}:deployrun.yaml
            image/${{ steps.build-data-image.outputs.image-name }}:data-image.yaml
            deployrun/${{ steps.poweroff.outputs.deploy-run-name }}:poweroff-deployrun.yaml
          job-label-selectors: |
            app.kubernetes.io/component=image-ingest-job:ingest-job.log
            app.kubernetes.io/component=partition-content-publish:publish-job.log
            app.kubernetes.io/name=kezio,app.kubernetes.io/component=partition-content-seeder:seeder.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ matrix.dhcp-scenario }}-diagnostics
          path: |
            e2e-bundle
            ${{ runner.temp }}/console-${{ matrix.dhcp-scenario }}.log
            ${{ runner.temp }}/diagnostics-dump.log
            ${{ runner.temp }}/diagnostics-kubevirtbmc-dump.log
            ${{ runner.temp }}/kezio-resources-dump.log
          retention-days: 7
          if-no-files-found: ignore

      # Describe + current/previous logs for the tracker and seeder
      # Deployments/pods above (dump-e2e-diagnostics does not cover
      # them), each pod's network-status annotation (the only place
      # Multus records the address a pod actually got - what a future
      # address-pinning assertion needs), and a runner-wide network
      # snapshot beyond dump-e2e-diagnostics's single FORWARD/mangle
      # dump. Augments, not replaces, the steps above: those already
      # cover controller-manager crash logs and KubeVirtBMC, which this
      # action does not duplicate. tracker-label-selector overrides the
      # action's own legacy-opentracker default: this lane's tracker is
      # Site-managed (kezio-tracker-<site>, label component=tracker), not
      # a standalone opentracker Deployment. extra-artifact-paths carries
      # the console-capture logfile (started above) into this same
      # upload instead of a separate one - this action does not call
      # capture-vm-console itself, since that backgrounds a continuous
      # attach loop from VM-Ready onward while this action runs once, at
      # the end.
      - name: Collect site/tracker/seeder/bootd/runner-network diagnostics
        if: always()
        uses: ./.github/actions/collect-site-diagnostics
        with:
          artifact-name-prefix: deploy-${{ matrix.dhcp-scenario }}
          namespaces: "scaffold-system"
          tracker-label-selector: "app.kubernetes.io/name=kezio,app.kubernetes.io/component=tracker"
          bridges: ${{ env.PROVISIONING_BRIDGE }}
          extra-artifact-paths: ${{ runner.temp }}/console-${{ matrix.dhcp-scenario }}.log

  # Stable required-check names for the branch ruleset. The real jobs
  # hang off these through `needs`; the ruleset references "Build" and
  # "E2E" so the graph can grow without ruleset edits.
  build-required:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - images
      - boot-artifacts
    steps:
      - name: All build outputs passed
        run: |
          [ "${{ needs.images.result }}" = "success" ] && \
            [ "${{ needs.boot-artifacts.result }}" = "success" ]

  e2e-required:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - e2e-fast-lane
      - e2e-image-path
      - e2e-deploy
    steps:
      - name: All e2e lanes passed
        run: |
          [ "${{ needs.e2e-fast-lane.result }}" = "success" ] && \
            [ "${{ needs.e2e-image-path.result }}" = "success" ] && \
            [ "${{ needs.e2e-deploy.result }}" = "success" ]
