name: main

on:
  push:
    branches:
      - main
  pull_request:

env:
  GO_VERSION: "1.26.5"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test

  build:
    name: build-manager
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build
      - run: docker build -t kezio-manager:ci .

  # Stable required-check names for the branch ruleset. The real jobs
  # hang off these through `needs`; the ruleset references "Build" and
  # "E2E" so the graph can grow without ruleset edits. The e2e lane
  # lands behind "E2E" next; until then it gates on the test job.
  build-required:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build
    steps:
      - run: "true"

  e2e-required:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test
      - build
    steps:
      - run: "true"
