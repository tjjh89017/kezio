name: CI

# The single CI entry point: every push to main, every pull request, and
# on-demand dispatch all funnel through this file. Tag pushes ("v*") are
# release.yaml's job instead - see that file for the full-publish path
# this workflow deliberately does not take (boot-artifacts here uploads
# an ephemeral workflow artifact only, and images here never pushes on a
# tag).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the RKE2 e2e lanes."
        required: false
        type: boolean
        default: true
      run_boot_artifacts:
        description: "Build the live boot image and upload it as a workflow artifact."
        required: false
        type: boolean
        default: true

# A manual dispatch gets its own group (keyed by run id) so a later push
# can't cancel a deliberately requested run; push/PR runs share a group
# keyed by ref so a newer commit supersedes the previous run's verdict.
concurrency:
  group: main-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tjjh89017
  # RKE2 version the e2e jobs install. Pinned so the e2e cluster doesn't
  # shift under us on a stable branch; bump deliberately.
  RKE2_VERSION: "v1.36.2+rke2r1"
  # RKE2 has no default StorageClass (unlike k3s's bundled local-path);
  # config/e2e-image-path's staging and per-partition-content PVCs
  # request storageClassName local-path explicitly, so this
  # rancher/local-path-provisioner release is installed and marked
  # default in that job below.
  LOCAL_PATH_PROVISIONER_VERSION: "v0.0.37"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Check composite action.yml metadata for GitHub-evaluated expressions
        run: go run ./hack/lint-action-metadata

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

  images:
    # Builds the four kezio images on every push to main and every PR;
    # only pushes to ghcr.io/tjjh89017 on a push to main (moving "latest"
    # tag) - a PR run builds to catch a broken Dockerfile without ever
    # authenticating to the registry. This is additive to the e2e job,
    # which builds the manager image locally and imports it into an
    # RKE2 node's containerd with `ctr images import` - that flow never
    # pulls from a registry, so it is unaffected by whatever this job
    # pushes or how long it takes to push it.
    #
    # kezio-boot-artifacts (docker/boot-artifacts/Dockerfile) is NOT in
    # this matrix: it packages hack/live-image/build.sh's output, which
    # only exists after that (many-minutes) build has run - see the
    # boot-artifacts job below, which never pushes to ghcr, and
    # release.yaml, which does on a "v*" tag.
    #
    # Image <-> Dockerfile mapping (must stay in sync with the per-binary
    # docker-build-* targets in the Makefile):
    #   kezio                <- Dockerfile                        (controller manager)
    #   kezio-ipmi           <- docker/manager-ipmi/Dockerfile     (opt-in, ipmitool-enabled manager)
    #   kezio-image-service  <- docker/image-service/Dockerfile
    #   kezio-ingest         <- docker/ingest/Dockerfile
    #   kezio-seeder         <- docker/seeder/Dockerfile
    #   kezio-bootd          <- docker/bootd/Dockerfile
    #
    # Architecture: manager, image-service, ingest and bootd cross-compile
    # their Go binary (BUILDPLATFORM/TARGETPLATFORM) and only need apt-get
    # to install a handful of prebuilt runtime packages, so they build
    # fine under QEMU emulation for both amd64 and arm64. The seeder image
    # instead compiles ezio's C++ stack (libtorrent-rasterbar, boost,
    # grpc) from source with cmake; doing that under QEMU emulation is
    # very slow. Seeder therefore builds amd64-only for now - TODO: add an
    # arm64 leg once either a native arm64 runner is available or the
    # emulated build time has been measured and judged acceptable.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            image: kezio
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: manager-ipmi
            image: kezio-ipmi
            dockerfile: docker/manager-ipmi/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: image-service
            image: kezio-image-service
            dockerfile: docker/image-service/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: ingest
            image: kezio-ingest
            dockerfile: docker/ingest/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: seeder
            image: kezio-seeder
            dockerfile: docker/seeder/Dockerfile
            # amd64-only: see the architecture note above the `on:` block.
            platforms: linux/amd64
          - name: bootd
            image: kezio-bootd
            dockerfile: docker/bootd/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  boot-artifacts:
    # Builds the kezio live boot image (kernel + initrd + squashfs) plus
    # the signed shimx64.efi/grubx64.efi kezio-bootd serves over TFTP,
    # with hack/live-image/build.sh, and uploads the result as an
    # ephemeral workflow artifact for inspection. No ghcr publish here -
    # see release.yaml, which builds the same artifacts on a "v*" tag and
    # publishes them to both a GitHub Release and the
    # kezio-boot-artifacts ghcr image.
    name: Boot artifacts
    needs: [lint, test]
    if: github.event_name != 'workflow_dispatch' || inputs.run_boot_artifacts
    runs-on: ubuntu-latest
    # `lb build` compiles ezio from source (cmake/make, the same as
    # docker/seeder/Dockerfile's builder stage) and then assembles a full
    # Debian sid chroot into a squashfs - budget generously.
    timeout-minutes: 90
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Build live image
        # ubuntu-latest's Docker already runs privileged containers -
        # hack/live-image/build.sh needs that for `lb build`'s own
        # chroot/mount work; see the script's header for why.
        run: hack/live-image/build.sh

      - name: Write size summary
        run: |
          {
            echo "## Live boot image artifacts"
            echo
            echo "Target squashfs size: 100-300 MiB."
            echo
            echo "| artifact | size |"
            echo "| --- | --- |"
            for f in dist/live/vmlinuz dist/live/initrd.img dist/live/filesystem.squashfs dist/live/shimx64.efi dist/live/grubx64.efi; do
              name="$(basename "${f}")"
              size_bytes="$(stat -c%s "${f}")"
              size_mib="$(awk -v b="${size_bytes}" 'BEGIN { printf "%.1f", b / 1048576 }')"
              echo "| ${name} | ${size_mib} MiB |"
            done
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kezio-live-image
          retention-days: 1
          path: |
            dist/live/vmlinuz
            dist/live/initrd.img
            dist/live/filesystem.squashfs
            dist/live/shimx64.efi
            dist/live/grubx64.efi
            dist/live/manifest.json
            dist/live/sha256sums
          if-no-files-found: error

  e2e-fast:
    # Fast lane: the fake-deployer, stub-ingest Image/Machine lifecycle
    # from test/e2e/e2e_test.go. Never touches image-service, ingest, or
    # the seeder - see e2e-image-path below, which is additive and runs
    # on its own runner so this job's timing never regresses because of
    # it.
    #
    # cert-manager is required from here on: every kezio CRD carries a
    # defaulting and a validating webhook, and the controller-manager
    # cannot serve admission requests until cert-manager has minted its
    # serving certificate (installed by `make test-e2e` itself, always
    # "latest" - see test/utils.InstallCertManager).
    name: Run against RKE2
    needs: [lint, test]
    if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resource check (fail fast if the runner is under-resourced)
        run: |
          set -euo pipefail
          echo "===== CPU ====="
          nproc
          echo "===== Memory ====="
          free -h
          echo "===== Disk ====="
          df -h

          cpus="$(nproc)"
          mem_mb="$(free -m | awk '/^Mem:/{print $2}')"

          # GitHub-hosted ubuntu-latest runners give 4 vCPUs / 16 GiB RAM.
          # These thresholds only catch a runner that is clearly the wrong
          # class (e.g. a misconfigured self-hosted runner), not normal
          # variance on the hosted fleet. Bumped from k3s's 6000 MiB floor:
          # RKE2's etcd + canal control plane runs roughly 1 GiB heavier.
          if [ "$cpus" -lt 2 ]; then
            echo "::error::Runner has only ${cpus} CPU(s); kezio e2e needs at least 2." >&2
            exit 1
          fi
          if [ "$mem_mb" -lt 7000 ]; then
            echo "::error::Runner has only ${mem_mb} MiB RAM; kezio e2e needs at least 7000 MiB." >&2
            exit 1
          fi

      - name: Write the RKE2 config (must exist before the service starts)
        # Plain canal here - this lane never creates a NetworkAttachmentDefinition
        # or touches Multus, unlike the KubeVirt VM lanes (see
        # e2e-kubevirt-reusable.yml), so there is no reason to pay for the
        # multus HelmChart addon in this always-on, every-push/PR lane.
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/rancher/rke2
          cat <<'EOF' | sudo tee /etc/rancher/rke2/config.yaml
          write-kubeconfig-mode: "0644"
          cni: canal
          EOF

      - name: Install RKE2
        run: |
          set -euo pipefail
          curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${RKE2_VERSION}" sh -
          sudo systemctl enable --now rke2-server.service

          # kubectl/ctr/crictl ship under /var/lib/rancher/rke2/bin, not on
          # PATH by default - symlink them into /usr/local/bin (inside
          # sudo's secure_path) the same way the k3s installer always put
          # its own "k3s" binary there.
          sudo ln -sf /var/lib/rancher/rke2/bin/kubectl /usr/local/bin/kubectl
          sudo ln -sf /var/lib/rancher/rke2/bin/ctr /usr/local/bin/ctr
          sudo ln -sf /var/lib/rancher/rke2/bin/crictl /usr/local/bin/crictl

          echo "KUBECONFIG=/etc/rancher/rke2/rke2.yaml" >> "$GITHUB_ENV"
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          # RKE2 registers its node a moment after the service starts; wait
          # for the node object to exist before waiting on its Ready condition,
          # since `kubectl wait` errors out immediately on zero matches.
          for _ in $(seq 1 90); do
            [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ] && break
            sleep 2
          done
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl get nodes -o wide

      - name: Running Test e2e
        run: |
          set -euo pipefail
          go mod tidy
          make test-e2e E2E_CLUSTER=rke2

      - name: Dump operator logs on failure
        if: failure()
        run: |
          set +e
          echo "===== kezio-system pods ====="
          kubectl get pods -n kezio-system -o wide
          echo "===== controller-manager logs ====="
          kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=500
          echo "===== kezio CRs ====="
          kubectl get machines,images,posthooks -A -o wide
          echo "===== events ====="
          kubectl get events -n kezio-system --sort-by=.lastTimestamp

  e2e-image-path:
    # Slow lane: test/e2e's "Image ingest and seeding (image-path)"
    # Context (test/e2e/e2e_image_path_test.go), gated on E2E_IMAGE_PATH=true
    # below. It deploys image-service on top of the same base
    # config/default the fast job exercises, uploads a real Ubuntu cloud
    # image through kezioctl, and drives it through real
    # qemu-img/sfdisk/partclone ingest and the per-partition-PVC/publish
    # path - see that file's doc comments for the full flow. This lane
    # runs no seeder: this stage never creates a Machine, and seeding is
    # demand-driven by a Machine deploying the Image (see
    # internal/controller/seeder_deployment.go) - end-to-end seeding proof
    # lives in the deploy-path lane instead. This is a separate job (own
    # runner, own RKE2, own timeout) precisely so none of that weight
    # lands on the e2e-fast job above.
    name: Run image-path against RKE2
    needs: [lint, test]
    if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
    runs-on: ubuntu-latest
    # Honest budget, not a guess: RKE2 + cert-manager install (~1-2m),
    # building+importing the manager/image-service/ingest images (~2-3m,
    # small Go binaries), downloading the Ubuntu cloud image (cached
    # after the first run, see the cache step below), then real ingest
    # (qemu-img convert + sfdisk + partclone over a several-hundred-MiB
    # image, a few minutes). 60 minutes leaves generous headroom on an
    # otherwise-busy runner.
    timeout-minutes: 60
    env:
      # Ubuntu's "minimal" cloud image, not the full one: honestly, a
      # bare GPT+ESP+rootfs disk with an ext4 root is all this stage
      # needs to exercise ingest's partition/filesystem handling, and the
      # minimal image is roughly half the download + qemu-img-convert +
      # partclone time of the full cloud image for the same coverage.
      # /releases/noble/release/ always serves the latest 24.04 LTS point
      # build, so this stays "latest-minor" without needing a version
      # bump here. Pinned in one place (not inlined below) so a future
      # bump (or a fallback to the full cloud image, if the minimal image
      # ever turns out to lack something ingest needs) is a one-line change.
      UBUNTU_CLOUD_IMAGE_URL: "https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img"
      INGEST_IMG: "example.com/kezio-ingest:e2e"
      IMAGE_SERVICE_IMG: "example.com/kezio-image-service:e2e"
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resource check (fail fast if the runner is under-resourced)
        run: |
          set -euo pipefail
          echo "===== CPU ====="
          nproc
          echo "===== Memory ====="
          free -h
          echo "===== Disk ====="
          df -h

          cpus="$(nproc)"
          mem_mb="$(free -m | awk '/^Mem:/{print $2}')"
          disk_avail_gb="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"

          # Same CPU/RAM floor as the fast job (see e2e-fast's own
          # resource-check step, including its RKE2-vs-k3s bump). Disk
          # gets its own, higher floor: this job builds two local images
          # and downloads and converts a several-hundred-MiB cloud image,
          # on top of everything the fast job already needs.
          if [ "$cpus" -lt 2 ]; then
            echo "::error::Runner has only ${cpus} CPU(s); kezio e2e needs at least 2." >&2
            exit 1
          fi
          if [ "$mem_mb" -lt 7000 ]; then
            echo "::error::Runner has only ${mem_mb} MiB RAM; kezio e2e needs at least 7000 MiB." >&2
            exit 1
          fi
          if [ "$disk_avail_gb" -lt 20 ]; then
            echo "::error::Runner has only ${disk_avail_gb} GiB free disk; kezio's image-path e2e needs at least 20 GiB." >&2
            exit 1
          fi

      - name: Cache the Ubuntu cloud image
        id: cache-cloud-image
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ubuntu-cloud.img
          # Keyed on the pinned URL (env, above): bumping that env var
          # (a version/URL change) naturally misses the old cache instead
          # of serving a stale image under a reused key.
          key: ubuntu-cloud-image-${{ env.UBUNTU_CLOUD_IMAGE_URL }}

      - name: Download the Ubuntu cloud image
        if: steps.cache-cloud-image.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sfL -o "${{ runner.temp }}/ubuntu-cloud.img" "${UBUNTU_CLOUD_IMAGE_URL}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warm the ingest/image-service image caches
        # Builds (and loads into the local docker daemon, never pushes -
        # this stage never depends on ghcr, see this job's own doc
        # comment) the same two images `make docker-build-ingest`/
        # `docker-build-image-service` build later, under the same tags,
        # with GitHub Actions' layer cache. The scope names match the
        # images job's matrix exactly, so a push to main (which does
        # depend on ghcr, unlike this job) and this job share one warm
        # cache.
        run: |
          set -euo pipefail
          for spec in "ingest:docker/ingest/Dockerfile:${INGEST_IMG}" "image-service:docker/image-service/Dockerfile:${IMAGE_SERVICE_IMG}"; do
            IFS=: read -r scope dockerfile tag <<< "${spec}"
            docker buildx build \
              --file "${dockerfile}" \
              --tag "${tag}" \
              --cache-from "type=gha,scope=${scope}" \
              --cache-to "type=gha,mode=max,scope=${scope}" \
              --load \
              .
          done

      - name: Write the RKE2 config (must exist before the service starts)
        # Plain canal - this job never touches Multus/NADs, just PVCs, so
        # canal alone (no multus addon cost) is enough.
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/rancher/rke2
          cat <<'EOF' | sudo tee /etc/rancher/rke2/config.yaml
          write-kubeconfig-mode: "0644"
          cni: canal
          EOF

      - name: Install RKE2
        run: |
          set -euo pipefail
          curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${RKE2_VERSION}" sh -
          sudo systemctl enable --now rke2-server.service

          # kubectl/ctr/crictl ship under /var/lib/rancher/rke2/bin, not on
          # PATH by default - symlink them into /usr/local/bin (inside
          # sudo's secure_path) the same way the k3s installer always put
          # its own "k3s" binary there.
          sudo ln -sf /var/lib/rancher/rke2/bin/kubectl /usr/local/bin/kubectl
          sudo ln -sf /var/lib/rancher/rke2/bin/ctr /usr/local/bin/ctr
          sudo ln -sf /var/lib/rancher/rke2/bin/crictl /usr/local/bin/crictl

          echo "KUBECONFIG=/etc/rancher/rke2/rke2.yaml" >> "$GITHUB_ENV"
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          # RKE2 registers its node a moment after the service starts; wait
          # for the node object to exist before waiting on its Ready condition,
          # since `kubectl wait` errors out immediately on zero matches.
          for _ in $(seq 1 90); do
            [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ] && break
            sleep 2
          done
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl get nodes -o wide

      - name: Install local-path-provisioner and mark it the default StorageClass
        # RKE2 ships no default StorageClass (k3s bundled local-path by
        # default; RKE2 deliberately does not). config/e2e-image-path's
        # staging PVC (applied by this workflow) and the per-partition
        # content PVCs (created by the Image reconciler during the suite
        # run) both request storageClassName local-path explicitly, so
        # that name must exist here before the suite runs.
        run: |
          set -euo pipefail
          kubectl apply -f "https://raw.githubusercontent.com/rancher/local-path-provisioner/${LOCAL_PATH_PROVISIONER_VERSION}/deploy/local-path-storage.yaml"
          kubectl -n local-path-storage rollout status deployment/local-path-provisioner --timeout=180s
          kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

      - name: Running Test e2e (image-path)
        run: |
          set -euo pipefail
          go mod tidy
          # Mirrors `make test-e2e`'s own prerequisites (manifests/
          # generate/fmt/vet - see the Makefile's test-e2e target) since
          # this step calls `go test` directly instead of going through
          # that target, needed only to raise -timeout past its fixed 15m
          # for this much slower stage.
          make manifests generate fmt vet
          E2E_IMAGE_PATH=true \
          E2E_UBUNTU_QCOW2_PATH="${{ runner.temp }}/ubuntu-cloud.img" \
          INGEST_IMG="${INGEST_IMG}" \
          IMAGE_SERVICE_IMG="${IMAGE_SERVICE_IMG}" \
          E2E_CLUSTER=rke2 go test ./test/e2e/ -v -ginkgo.v -timeout 50m

      - name: Dump operator and ingest logs on failure
        if: failure()
        run: |
          set +e
          echo "===== kezio-system pods ====="
          kubectl get pods -n kezio-system -o wide
          echo "===== controller-manager logs ====="
          kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=500
          echo "===== ingest Job(s) ====="
          kubectl get jobs -n kezio-system -l kezio.kojuro.date/image -o wide
          echo "===== ingest Job logs ====="
          kubectl logs -n kezio-system -l kezio.kojuro.date/image --all-containers --tail=500
          echo "===== partition PVCs ====="
          kubectl get pvc -n kezio-system -l app.kubernetes.io/component=partition-content -o wide
          echo "===== image-service logs ====="
          kubectl logs -n kezio-system deploy/kezio-image-service --tail=500
          echo "===== kezio Images ====="
          kubectl get images -A -o wide
          echo "===== events ====="
          kubectl get events -n kezio-system --sort-by=.lastTimestamp

  e2e-boot-path:
    # Boot-path lane: test/e2e's "Boot path (control-plane wiring)"
    # Context (test/e2e/e2e_boot_path_test.go), gated on E2E_BOOT_PATH=true
    # below. It proves the real boot config server (internal/bootserver)
    # and agent registration server (internal/agentserver) wiring - a
    # real minted single-use token, a real Machine status update - by
    # standing in a plain HTTP client for kezio-agent instead of driving
    # an actual PXE boot. It does NOT start a VM, does NOT touch
    # kezio-bootd's proxyDHCP/TFTP responder, and does NOT fetch a real
    # kernel/initrd/squashfs: those need a NIC on a real L2 broadcast
    # domain and a UEFI firmware actually executing GRUB, which a
    # GitHub-hosted runner's pod network cannot provide - see
    # e2e-boot-path-kubevirt.yml (workflow_dispatch only, not run here)
    # for that heavier, separable stage and the realism assessment behind
    # keeping it out of this always-on lane.
    name: Run boot-path against RKE2
    needs: [lint, test]
    if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
    runs-on: ubuntu-latest
    # Small, in-process HTTP servers and one reconciler cycle per phase -
    # no image builds beyond the manager itself, no real network boot.
    # Generous headroom over the fast lane's 30m only because it shares
    # this file's resource-check/RKE2-install boilerplate, not because the
    # boot-path specs themselves are slow.
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resource check (fail fast if the runner is under-resourced)
        run: |
          set -euo pipefail
          echo "===== CPU ====="
          nproc
          echo "===== Memory ====="
          free -h
          echo "===== Disk ====="
          df -h

          cpus="$(nproc)"
          mem_mb="$(free -m | awk '/^Mem:/{print $2}')"

          # Same floor as e2e-fast's own resource-check step (see its
          # comment, including its RKE2-vs-k3s bump): this lane is no
          # heavier than that one.
          if [ "$cpus" -lt 2 ]; then
            echo "::error::Runner has only ${cpus} CPU(s); kezio e2e needs at least 2." >&2
            exit 1
          fi
          if [ "$mem_mb" -lt 7000 ]; then
            echo "::error::Runner has only ${mem_mb} MiB RAM; kezio e2e needs at least 7000 MiB." >&2
            exit 1
          fi

      - name: Write the RKE2 config (must exist before the service starts)
        # Plain canal - this lane never touches Multus/NADs.
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/rancher/rke2
          cat <<'EOF' | sudo tee /etc/rancher/rke2/config.yaml
          write-kubeconfig-mode: "0644"
          cni: canal
          EOF

      - name: Install RKE2
        run: |
          set -euo pipefail
          curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${RKE2_VERSION}" sh -
          sudo systemctl enable --now rke2-server.service

          # kubectl/ctr/crictl ship under /var/lib/rancher/rke2/bin, not on
          # PATH by default - symlink them into /usr/local/bin (inside
          # sudo's secure_path) the same way the k3s installer always put
          # its own "k3s" binary there.
          sudo ln -sf /var/lib/rancher/rke2/bin/kubectl /usr/local/bin/kubectl
          sudo ln -sf /var/lib/rancher/rke2/bin/ctr /usr/local/bin/ctr
          sudo ln -sf /var/lib/rancher/rke2/bin/crictl /usr/local/bin/crictl

          echo "KUBECONFIG=/etc/rancher/rke2/rke2.yaml" >> "$GITHUB_ENV"
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          # RKE2 registers its node a moment after the service starts; wait
          # for the node object to exist before waiting on its Ready condition,
          # since `kubectl wait` errors out immediately on zero matches.
          for _ in $(seq 1 90); do
            [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ] && break
            sleep 2
          done
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl get nodes -o wide

      - name: Running Test e2e (boot-path)
        run: |
          set -euo pipefail
          go mod tidy
          make manifests generate fmt vet
          E2E_BOOT_PATH=true E2E_CLUSTER=rke2 go test ./test/e2e/ -v -ginkgo.v -timeout 20m

      - name: Dump operator logs on failure
        if: failure()
        run: |
          set +e
          echo "===== kezio-system pods ====="
          kubectl get pods -n kezio-system -o wide
          echo "===== controller-manager logs ====="
          kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=500
          echo "===== kezio-boot-server / kezio-agent-server Services ====="
          kubectl get svc -n kezio-system kezio-boot-server kezio-agent-server -o wide
          echo "===== boot-path Machine ====="
          kubectl get machine e2e-boot-node-01 -n kezio-system -o yaml
          echo "===== events ====="
          kubectl get events -n kezio-system --sort-by=.lastTimestamp
