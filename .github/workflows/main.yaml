name: main

on:
  push:
    branches:
      - main
  pull_request:

env:
  GO_VERSION: "1.26.5"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tjjh89017
  IMAGE_SERVICE_TOKEN: "kezio-e2e-image-path-token"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test

  # Image <-> Dockerfile mapping grows one row per component as later
  # stages add it. Seeder is amd64-only: ezio's C++ build (cmake/boost/
  # libtorrent) is too slow under QEMU emulation. Ingest ships only apt
  # packages (partclone/qemu-utils/util-linux/fdisk) plus a CGO_ENABLED=0
  # Go binary, so it builds natively for both platforms. image-service is a
  # plain CGO_ENABLED=0 Go binary with no external tools at all (no apt
  # packages), so it also builds natively for both platforms.
  images:
    name: ${{ matrix.name }}
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            image: kezio
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
            local-tag: example.com/kezio:e2e
          - name: ingest
            image: kezio-ingest
            dockerfile: docker/ingest/Dockerfile
            platforms: linux/amd64,linux/arm64
            local-tag: example.com/kezio-ingest:e2e
          - name: seeder
            image: kezio-seeder
            dockerfile: docker/seeder/Dockerfile
            platforms: linux/amd64
            local-tag: example.com/kezio-seeder:e2e
          - name: image-service
            image: kezio-image-service
            dockerfile: docker/image-service/Dockerfile
            platforms: linux/amd64,linux/arm64
            local-tag: example.com/kezio-image-service:e2e
          - name: bootd
            image: kezio-bootd
            dockerfile: docker/bootd/Dockerfile
            platforms: linux/amd64,linux/arm64
            local-tag: example.com/kezio-bootd:e2e
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # load:true cannot hold a multi-platform manifest - amd64 only, for
      # the tarball hand-off downstream e2e jobs consume.
      - name: Build (amd64, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.local-tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Save the image to a tarball
        run: docker save ${{ matrix.local-tag }} -o /tmp/${{ matrix.name }}.tar

      - name: Upload the image tarball
        uses: actions/upload-artifact@v4
        with:
          name: image-tar-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}.tar
          retention-days: 1
          if-no-files-found: error

      # Multi-arch push, main only - PRs never authenticate or push.
      - name: Push to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/push-image-to-ghcr
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags-spec: |
            type=ref,event=branch
          dockerfile: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          cache-scope: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  boot-artifacts:
    name: Boot artifacts
    needs: [lint, test]
    runs-on: ubuntu-latest
    # `lb build` compiles ezio from source and assembles a full Debian sid
    # chroot into a squashfs - budget generously.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build the live boot image
        uses: ./.github/actions/build-live-image

      - name: Fail fast if the built boot artifacts are empty
        uses: ./.github/actions/assert-boot-artifacts-present

      - name: Upload the live image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kezio-live-image
          retention-days: 1
          path: |
            dist/live/vmlinuz
            dist/live/initrd.img
            dist/live/filesystem.squashfs
            dist/live/shimx64.efi
            dist/live/grubx64.efi
            dist/live/kernel.config
            dist/live/manifest.json
            dist/live/sha256sums
          if-no-files-found: error

  # Gates the Site/tracker/seeder lanes on three mechanisms this repo
  # never tested before: that Multus honours the default-network
  # annotation's "ips" field (the tracker's own pinning mechanism), that
  # a single-homed pod crosses a segment boundary via a NAD IPAM route,
  # and that create-routed-segments' same-group forwarding and
  # cross-group isolation actually hold on a real runner. Needs no
  # kezio image, no cert-manager, no KubeVirt - only RKE2 with Multus,
  # the cheapest substrate that can even ask Multus a question - so it
  # runs alongside images/boot-artifacts rather than after them.
  e2e-network-probes:
    name: Network probes
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install RKE2
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: "v1.36.2+rke2r1"
          enable-multus: "true"

      # RKE2 deploys Multus as its own HelmChart addon, which can lag
      # behind node-Ready - the same wait install-cluster-addons uses,
      # inlined here rather than pulled in through that action, since
      # everything else it installs (cert-manager, KubeVirt, virtctl,
      # CDI) is not needed by any of these three probes.
      - name: Wait for the Multus NetworkAttachmentDefinition CRD
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          until kubectl get crd network-attachment-definitions.k8s.cni.cncf.io >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::network-attachment-definitions.k8s.cni.cncf.io CRD did not appear within the timeout - RKE2's rke2-multus HelmChart addon may not have installed." >&2
              kubectl get helmcharts -A -o wide || true
              kubectl -n kube-system get pods -o wide || true
              exit 1
            fi
            sleep 5
          done
          # kubectl wait --for=condition=Established errors out instead of
          # retrying while the fresh CRD's status.conditions is still nil
          # (".status.conditions accessor error"), so poll the condition
          # with the failure tolerated inside the loop.
          until kubectl get crd network-attachment-definitions.k8s.cni.cncf.io \
              -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null \
              | grep -q True; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::network-attachment-definitions.k8s.cni.cncf.io CRD never became Established." >&2
              kubectl get crd network-attachment-definitions.k8s.cni.cncf.io -o yaml || true
              exit 1
            fi
            sleep 5
          done

      # The CRD existing only means the rke2-multus HelmChart addon's
      # manifests were applied - the daemonset's pod can still be
      # mid-rollout, and only that pod writes the node's CNI conflist
      # (Multus's kubelet-facing config). A pod scheduled before that
      # write lands gets wired by canal directly and carries no
      # network-status annotation at all - this is what Probe A caught.
      # The deploy lane never hits this because cert-manager/KubeVirt/CDI
      # install after this same CRD wait, giving Multus minutes to
      # settle before any pod is created; this lane has nothing else to
      # wait on, so wait for the rollout explicitly, then confirm the
      # conflist file the daemonset writes is actually on disk - the
      # rollout condition (pod Ready) can flip slightly before that
      # write completes, which is exactly the gap Probe A hit. The
      # conflist directory is whatever the chart mounted, not a
      # documented constant (a hardcoded rke2 agent path turned out not
      # to even exist on the runner), so read the daemonset's own
      # hostPath volumes and search those.
      - name: Wait for the Multus daemonset to finish rolling out
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          until kubectl -n kube-system get daemonset rke2-multus >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::daemonset rke2-multus did not appear in kube-system within the timeout." >&2
              kubectl get helmcharts -A -o wide || true
              kubectl -n kube-system get pods -o wide || true
              exit 1
            fi
            sleep 5
          done
          remaining=$(( deadline - $(date +%s) ))
          if [ "${remaining}" -lt 1 ]; then remaining=1; fi
          kubectl -n kube-system rollout status daemonset/rke2-multus --timeout="${remaining}s"

          mapfile -t cni_dirs < <(kubectl -n kube-system get daemonset rke2-multus \
            -o jsonpath='{range .spec.template.spec.volumes[?(@.hostPath)]}{.hostPath.path}{"\n"}{end}' \
            | grep -E '/(cni/)?net\.d/?$' | sort -u)
          if [ "${#cni_dirs[@]}" -eq 0 ]; then
            echo "::error::daemonset rke2-multus mounts no host directory that looks like a CNI conf dir." >&2
            kubectl -n kube-system get daemonset rke2-multus -o jsonpath='{.spec.template.spec.volumes}' | jq . || true
            exit 1
          fi
          echo "Multus writes its conflist into: ${cni_dirs[*]}"
          until sudo find "${cni_dirs[@]}" -maxdepth 1 -iname '*multus*' 2>/dev/null | grep -q .; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::rke2-multus rolled out but no multus CNI conflist appeared under ${cni_dirs[*]}." >&2
              sudo ls -la "${cni_dirs[@]}" || true
              exit 1
            fi
            sleep 2
          done

      # This lane never deploys kezio (deploy-kezio, which creates
      # config/manager/manager.yaml's scaffold-system namespace, is not
      # part of it) - so the namespace every probe below defaults to must
      # be created directly. --dry-run=client | kubectl apply keeps this
      # idempotent across reruns of the same job.
      - name: Create the scaffold-system namespace the probes default to
        shell: bash
        run: kubectl create namespace scaffold-system --dry-run=client -o yaml | kubectl apply -f -

      # Pool range and pinned address both mirror
      # create-provisioning-nads' own kezio-seeder-network: the pool is
      # .101-.116 and the tracker pins the top of it, the one placement
      # host-local accepts.
      - name: Probe A -- Multus honours the default-network annotation's ips field
        uses: ./.github/actions/probe-multus-pinned-ip
        with:
          bridge-name: kezio-probe-a0
          nad-pool-cidr: 192.0.20.0/24
          nad-pool-range-start: 192.0.20.101
          nad-pool-range-end: 192.0.20.116
          requested-ip-cidr: 192.0.20.116/24

      - name: Probe B -- a single-homed pod reaches another segment through NAD IPAM routes
        uses: ./.github/actions/probe-nad-routes
        with:
          segment1-bridge: kezio-probe-b1
          segment1-cidr: 192.0.21.0/24
          segment1-host-cidr: 192.0.21.1/24
          segment1-gateway-ip: 192.0.21.1
          segment2-bridge: kezio-probe-b2
          segment2-host-cidr: 192.0.22.1/24
          segment2-route-cidr: 192.0.22.0/24
          segment2-gateway-ip: 192.0.22.1
          pod-with-route-cidr: 192.0.21.50/24
          pod-no-route-cidr: 192.0.21.60/24
          far-cidr: 192.0.22.50/24

      - name: Probe C -- same-group forwarding works and cross-group isolation holds
        uses: ./.github/actions/probe-site-forwarding
        with:
          segments: |
            kezio-probe-c-a 192.0.23.0/24 192.0.23.1/24 kezio-probe-c-group1
            kezio-probe-c-b 192.0.24.0/24 192.0.24.1/24 kezio-probe-c-group1
            kezio-probe-c-c 192.0.25.0/24 192.0.25.1/24 kezio-probe-c-group2
          bridge-a: kezio-probe-c-a
          bridge-a-gateway-ip: 192.0.23.1
          bridge-a-listener-ip: 192.0.23.50
          bridge-a-probe-cidr: 192.0.23.60/24
          bridge-b: kezio-probe-c-b
          bridge-b-gateway-ip: 192.0.24.1
          bridge-b-listener-ip: 192.0.24.50
          bridge-b-probe-cidr: 192.0.24.60/24
          bridge-c: kezio-probe-c-c
          bridge-c-gateway-ip: 192.0.25.1
          bridge-c-listener-ip: 192.0.25.50

      - name: Collect site/tracker/seeder/bootd/runner-network diagnostics
        if: always()
        uses: ./.github/actions/collect-site-diagnostics
        with:
          artifact-name-prefix: network-probes
          namespaces: "scaffold-system"
          bridges: |
            kezio-probe-a0
            kezio-probe-b1
            kezio-probe-b2
            kezio-probe-c-a
            kezio-probe-c-b
            kezio-probe-c-c

  # Fast e2e lane: single-node RKE2, built entirely from composite
  # actions - install CRDs, deploy the manager, walk a Machine through
  # the fake deployer to Provisioned, assert its DeployRun, exercise
  # the failure paths (retry-to-success, dead-BMC delete give-up), walk
  # the deploy plan builder against a real mkfs-only Image/PostHook pair
  # (default hook, a custom hook, and an unresolvable one), then assert
  # the Machine reconcile count stays flat under progress-only DeployRun
  # status updates.
  e2e-fast-lane:
    name: Fast lane
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resource check (fail fast if the runner is under-resourced)
        uses: ./.github/actions/check-runner-resources
        with:
          min-cpus: "2"
          min-mem-mb: "7000"
          context-label: "the kezio fast e2e lane"

      - name: Download the manager image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-manager
          path: /tmp/images

      - name: Install RKE2
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: "v1.36.2+rke2r1"
          enable-multus: "false"

      - name: Import the manager image into RKE2 containerd
        uses: ./.github/actions/import-image-tarballs
        with:
          images: manager

      - name: Install cert-manager
        uses: ./.github/actions/install-cert-manager

      # The manager-image tag must match the local-tag the images job
      # baked into the tarball above, so the manager Deployment resolves
      # it from containerd instead of pulling from a registry.
      - name: Deploy kezio CRDs and controller-manager
        uses: ./.github/actions/deploy-kezio
        with:
          manager-image: example.com/kezio:e2e

      # The Machine webhook now requires spec.subnetRef to resolve to a
      # Subnet with a boot half, and the Subnet webhook requires
      # spec.siteRef to resolve to an existing Site - so every walk below
      # needs both to already exist. One Site and one boot-half Subnet are
      # created here and shared by every walk: none of them creates a
      # PartitionContent or a seeder (every Image fixture in this lane is
      # mkfs-only), so there is no seeder-demand or per-Site placement
      # assertion for a shared Site identity to cross-contaminate. Both
      # live in namespace "default", matching every walk's own Machine
      # namespace, since neither SubnetRef nor SiteRef here carries an
      # explicit namespace and each defaults to its own object's
      # namespace. No BOOTD_DEPLOYMENT_IMAGE is configured in this lane
      # (deploy-kezio above sets none), so the Subnet's bootd Deployment is
      # never attempted regardless of the boot half declared here - same
      # as the image-path lane's own demand-Machine Subnet.
      - name: Create the Site
        uses: ./.github/actions/create-site
        with:
          name: kezio-e2e-fast-lane-site
          namespace: "default"

      - name: Create the Subnet for the fast lane's Machines
        uses: ./.github/actions/create-subnet
        with:
          name: kezio-e2e-fast-lane-subnet
          namespace: "default"
          cidr: "203.0.113.0/24"
          bootd-server-ip: "203.0.113.2"
          bootd-network-name: kezio-boot-network
          site-ref: kezio-e2e-fast-lane-site
          # This lane runs RKE2 with no Multus at all (the NAD CRD does
          # not exist), so SubnetReconciler's NAD checks can only ever
          # report Indeterminate (Valid=Unknown) - see this input's own
          # description in create-subnet/action.yml.
          accept-valid-unknown: "true"

      - name: Run a fake-deployer Machine walk
        uses: ./.github/actions/run-fake-deploy-walk
        with:
          namespace: "default"
          subnet-name: kezio-e2e-fast-lane-subnet

      - name: Run fake-deployer failure-path scenarios
        uses: ./.github/actions/run-fake-failure-walk
        with:
          namespace: "default"
          subnet-name: kezio-e2e-fast-lane-subnet

      - name: Run a fake-deployer plan-builder walk
        uses: ./.github/actions/run-fake-plan-walk
        with:
          namespace: "default"
          manager-namespace: "scaffold-system"
          subnet-name: kezio-e2e-fast-lane-subnet

      - name: Run a fake-deployer disk-hint matching walk
        uses: ./.github/actions/run-fake-disk-hints-walk
        with:
          namespace: "default"
          subnet-name: kezio-e2e-fast-lane-subnet

      - name: Run the watch-churn check
        uses: ./.github/actions/run-watch-churn-check
        with:
          namespace: "default"

      - name: Collect diagnostics
        if: failure()
        uses: ./.github/actions/collect-diagnostics
        with:
          namespace: "scaffold-system"
          workload-namespace: "default"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-lane-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

  # Image-path lane: RKE2 + an NFS-backed default StorageClass (RKE2 has
  # no default StorageClass, unlike the fast lane which needs no PVCs;
  # every controller-requested PVC here defaults to ReadWriteMany, which
  # plain local-path-provisioner alone cannot satisfy) + opentracker + the
  # image-service token Secret + the controller-manager, verified healthy,
  # then a real upload -> ingest -> publish -> Ready walk through kezioctl
  # (ingest-test-image), then run-leecher: a demand Machine naming the
  # ingested Image -> seeder Deployment Available -> a leecher Pod
  # downloads the content over BitTorrent and byte-compares it against
  # the fixture -> the demand Machine deleted.
  e2e-image-path:
    name: Image path
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resource check (fail fast if the runner is under-resourced)
        uses: ./.github/actions/check-runner-resources
        with:
          min-cpus: "2"
          min-mem-mb: "7000"
          context-label: "the kezio image-path e2e lane"

      - name: Download the manager image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-manager
          path: /tmp/images

      - name: Download the image-service image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-image-service
          path: /tmp/images

      # kezio-ingest is the same image the ingest and publish Jobs both
      # run, selected by INGEST_MODE - see IMAGE_INGEST_IMAGE and
      # PARTITIONCONTENT_PUBLISH_IMAGE below.
      - name: Download the ingest image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-ingest
          path: /tmp/images

      # run-leecher's seeder Deployment (PARTITIONCONTENT_SEEDER_IMAGE
      # below) runs this - amd64-only, matching the images job's seeder
      # matrix entry.
      - name: Download the seeder image tarball
        uses: actions/download-artifact@v4
        with:
          name: image-tar-seeder
          path: /tmp/images

      - name: Install RKE2
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: "v1.36.2+rke2r1"
          enable-multus: "false"

      - name: Import the manager, image-service, ingest, and seeder images into RKE2 containerd
        uses: ./.github/actions/import-image-tarballs
        with:
          images: manager image-service ingest seeder

      # RKE2 ships no default StorageClass, and every PVC the lane's
      # controllers request (the ingest scratch PVC, a PartitionContent's
      # content PVC, image-service's staging PVC) defaults to
      # ReadWriteMany in production. install-nfs-storage (csi-driver-nfs
      # + a small in-cluster NFS server, hostPath-backed - no
      # local-path-provisioner PVC needed underneath it) installs as the
      # default StorageClass so every one of those PVCs actually binds,
      # with no lane-only access-mode overrides anywhere downstream.
      - name: Install csi-driver-nfs and mark it the default StorageClass
        uses: ./.github/actions/install-nfs-storage

      - name: Install cert-manager
        uses: ./.github/actions/install-cert-manager

      # Creates the scaffold-system namespace (config/manager/manager.yaml)
      # that opentracker and the token Secret deploy into below - it must
      # run first.
      # The manager-image tag must match the local-tag the images job
      # baked into the tarball above, so the manager Deployment resolves
      # it from containerd instead of pulling from a registry.
      #
      # IMAGE_INGEST_STAGING_PVC must name the PVC image-service actually
      # deploys below (config/image-service's namePrefix "kezio-" applied
      # to "image-service-staging"), so a kezio-staged:// source resolves
      # in the same lane.
      #
      # IMAGE_INGEST_IMAGE and PARTITIONCONTENT_PUBLISH_IMAGE both name
      # the ingest tarball's local-tag: the Image controller's ingest Job
      # and the PartitionContent controller's publish Job run the same
      # kezio-ingest binary, selected by INGEST_MODE (ingest vs publish).
      # IMAGE_INGEST_SOURCE_FORMAT=raw matches ingest-test-image's fixture
      # disk, which the ingest Job would otherwise reject against the
      # manager's own qcow2 default (ImageIngestConfig.sourceFormat).
      # There is no cluster-wide tracker setting: every seeder Deployment
      # takes its announce URL from its own Site's status.trackerURL
      # instead - see the Site/Subnet creation steps below.
      # PARTITIONCONTENT_SEEDER_IMAGE names the seeder tarball's local-tag
      # imported above - without it, run-leecher's demand Machine would
      # only ever produce SeederDegraded=SeederImageMissing.
      # PARTITIONCONTENT_SEEDER_GRACE_PERIOD is shortened from the 5m
      # production default so a later lane item asserting the
      # grace-period shutdown itself does not have to wait 5 real
      # minutes; run-leecher does not wait it out either way.
      - name: Deploy kezio CRDs and controller-manager
        uses: ./.github/actions/deploy-kezio
        with:
          manager-image: example.com/kezio:e2e
          extra-env: |
            IMAGE_INGEST_STAGING_PVC=kezio-image-service-staging
            IMAGE_INGEST_IMAGE=example.com/kezio-ingest:e2e
            IMAGE_INGEST_SOURCE_FORMAT=raw
            PARTITIONCONTENT_PUBLISH_IMAGE=example.com/kezio-ingest:e2e
            PARTITIONCONTENT_SEEDER_IMAGE=example.com/kezio-seeder:e2e
            PARTITIONCONTENT_SEEDER_GRACE_PERIOD=30s

      # This lane runs with Multus disabled (install-rke2 above), so no
      # NetworkAttachmentDefinition exists for a Site-managed tracker to
      # single-home on - deploy-opentracker's plain cluster-network
      # Deployment/Service is what backs tracker.externalURL instead,
      # the escape hatch for an operator who already runs a tracker. A
      # plain ClusterIP Service is fine here because nothing on this
      # lane's seeder/leecher path is single-homed to begin with, unlike
      # the deploy lane's real machines.
      - name: Deploy opentracker
        uses: ./.github/actions/deploy-opentracker

      # The seed-demand Machine (run-leecher, below) needs its subnetRef
      # to resolve to a real Site with a working tracker - kezio-e2e-
      # leecher-demand-subnet is the exact name run-leecher's own Machine
      # manifest names. The Site/Subnet cross-reference is cyclic (see
      # create-site's own doc comment), so the Site is created twice:
      # bare first, then patched once the Subnet exists and points back.
      - name: Create the Site (bare)
        uses: ./.github/actions/create-site
        with:
          name: kezio-e2e-image-path-site
          wait-for: Valid

      # No boot half is exercised by this Subnet (the demand Machine
      # never PXE-boots - it only carries a fake BMC address), but the
      # Machine webhook still requires spec.subnetRef to resolve to a
      # Subnet with a boot half, so one is declared here even though
      # BOOTD_DEPLOYMENT_IMAGE is never configured in this lane and no
      # bootd Deployment is ever attempted. seeder-network-name is left
      # unset: this lane's seeder already runs on the ordinary cluster
      # network (no Multus), matching its existing behavior.
      - name: Create the Subnet for the demand Machine
        uses: ./.github/actions/create-subnet
        with:
          name: kezio-e2e-leecher-demand-subnet
          cidr: "203.0.113.0/24"
          bootd-server-ip: "203.0.113.2"
          bootd-network-name: kezio-boot-network
          site-ref: kezio-e2e-image-path-site
          # This lane runs RKE2 with no Multus at all (the NAD CRD does
          # not exist), so SubnetReconciler's NAD checks can only ever
          # report Indeterminate (Valid=Unknown) - see this input's own
          # description in create-subnet/action.yml.
          accept-valid-unknown: "true"

      # tracker.externalURL points at opentracker's Service (deployed
      # above) rather than Tracker.IP: a Site-managed tracker Deployment
      # needs a NAD to single-home on, and this lane has none.
      - name: Point the Site at its seeding Subnet
        uses: ./.github/actions/create-site
        with:
          name: kezio-e2e-image-path-site
          seeder-subnet-name: kezio-e2e-leecher-demand-subnet
          tracker-external-url: http://opentracker.scaffold-system.svc.cluster.local:6969/announce
          wait-for: Ready

      - name: Create the image-service bearer token Secret
        uses: ./.github/actions/create-image-service-token-secret
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      # The nfs StorageClass (installed above) satisfies ReadWriteMany, so
      # config/image-service's own default access mode (ReadWriteMany)
      # applies here unmodified - this lane needs no staging-access-mode
      # override.
      #
      # staging-size is still capped well under config/image-service's
      # 100Gi production default: the NFS export backing the "nfs"
      # StorageClass sits on the same runner disk as everything else in
      # the job, and this fixture never uploads more than tens of MiB
      # anyway, so there is no reason to request anywhere near 100Gi of
      # it.
      - name: Deploy image-service
        uses: ./.github/actions/deploy-image-service
        with:
          image-service-image: example.com/kezio-image-service:e2e
          staging-size: "2Gi"

      - name: Verify image-path prerequisites
        uses: ./.github/actions/verify-image-path-prerequisites

      - name: Ingest a test image through kezioctl
        id: ingest
        uses: ./.github/actions/ingest-test-image
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Seed, leech, and byte-compare the ingested content
        uses: ./.github/actions/run-leecher
        with:
          content-name: ${{ steps.ingest.outputs.content-ref }}
          image-name: ${{ steps.ingest.outputs.image-name }}
          partition-sha256: ${{ steps.ingest.outputs.partition-sha256 }}
          partition-size-bytes: ${{ steps.ingest.outputs.partition-size-bytes }}

      # Closes out the lane: dedupe (a second Image sharing
      # ingest-test-image's content), a composed (source-less) Image,
      # seeder grace-period shutdown, and the PartitionContent deletion
      # finalizer - see the action's own step-group comments for why the
      # order among them is load-bearing.
      - name: Assert Image/PartitionContent plane semantics
        uses: ./.github/actions/assert-image-plane-semantics
        with:
          content-name: ${{ steps.ingest.outputs.content-ref }}
          fixture-disk-path: ${{ steps.ingest.outputs.disk-path }}
          fixture-layout-path: ${{ steps.ingest.outputs.layout-path }}
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Collect diagnostics
        if: failure()
        uses: ./.github/actions/collect-diagnostics
        with:
          namespace: "scaffold-system"
          workload-namespace: "default"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-path-lane-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: ignore

  # Deploy lane: a KubeVirt VM PXE-boots through a per-Subnet bootd pod
  # into the live image, kezio-agent registers with a single-use token,
  # MachineHardware holds the inventory, and the Machine reaches
  # Available - this is the register phase, carried over unchanged from
  # the retired netboot lane, including its matrix (both of Subnet's DHCP
  # modes: proxydhcp, where an existing DHCP server stays lease authority
  # and bootd answers proxyDHCP only, and dhcp, where bootd's own
  # dnsmasq issues leases) and its MAC-gate assertion (fail-secure
  # against an unenrolled MAC). The lane then continues past
  # registration: a real OS test image is built and ingested, a marker
  # PostHook proves a specific deploy ran, and the Machine is driven
  # through a full deploy - partition write over BitTorrent, hooks,
  # finalize, reboot from disk - verified on three independent layers.
  # This is the slowest, flakiest lane, so it deliberately gates only
  # this minimum surface; further deploy-path assertions belong in later
  # steps or jobs, not more matrix legs here.
  e2e-deploy:
    name: Deploy lane
    needs: [build-required, e2e-fast-lane]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dhcp-scenario: [proxydhcp, dhcp]
    env:
      PROVISIONING_BRIDGE: kezio-prov0
      PROVISIONING_HOST_IP: 192.0.2.1/24
      PROVISIONING_CIDR: 192.0.2.0/24
      BOOTD_SERVER_IP: 192.0.2.2
      EXISTING_DHCP_NET1_IP: 192.0.2.3/24
      # Bare, like BOOTD_SERVER_IP, because the announce URL baked into
      # every torrent must be the tracker's own address on this segment -
      # a peer connects to whatever the tracker hands back, and nothing
      # on that path may rewrite it. The top of kezio-seeder-network's
      # host-local pool, not a low fixed address: the tracker pins this
      # through an "ips" override on that same NAD, and host-local
      # refuses a requested address outside its own range - see
      # create-provisioning-nads' own comment on that pool.
      TRACKER_SERVER_IP: 192.0.2.116
      # create-provisioning-nads also creates a kezio-tracker-network
      # NAD; no Deployment in this lane attaches it (the Site's tracker
      # single-homes on the seeding NAD instead), so this address backs
      # an inert object only. Distinct from every real address on this
      # segment so it cannot collide with one.
      UNUSED_TRACKER_NET1_IP: 192.0.2.7/24
      LEASE_RANGE_START: 192.0.2.10
      LEASE_RANGE_END: 192.0.2.100
      SUBNET_NAME: netboot-${{ matrix.dhcp-scenario }}
      SITE_NAME: netboot-${{ matrix.dhcp-scenario }}-site
      TARGET_VM_NAME: netboot-vm
      TARGET_VM_MAC: "52:54:00:be:ef:03"
      # Stamped on the target VM's data disk and carried into the
      # Machine's targetDisk hint: the VM reports a cloud-init disk
      # beside it, so a deploy with no hint resolves as ambiguous.
      TARGET_DISK_SERIAL: KEZIONETBOOTDISK01
      UNKNOWN_VM_NAME: netboot-vm-unknown
      UNKNOWN_VM_MAC: "52:54:00:be:ef:99"
      BOOT_ARTIFACTS_IMG: "example.com/kezio-boot-artifacts:e2e"
    steps:
      - uses: actions/checkout@v4

      - name: Download the live boot image artifacts
        uses: actions/download-artifact@v4
        with:
          name: kezio-live-image
          path: dist/live

      - name: Fail fast if the downloaded boot artifacts are empty
        uses: ./.github/actions/assert-boot-artifacts-present

      - name: Prepare the KVM host
        uses: ./.github/actions/prepare-kvm-host

      # Higher than the retired netboot lane's own budget: this lane also
      # runs image-service/opentracker/seeder, builds and converts the
      # real OS test image (virt-customize under KVM), and writes it to
      # the target VM's disk over BitTorrent. 15800, not 16384: a GitHub
      # 16 GB runner reports ~15989 usable MiB, so a round-16-GB
      # threshold rejects the very runner class this lane targets.
      - name: Resource check (fail fast if the runner is under-resourced)
        uses: ./.github/actions/check-runner-resources
        with:
          min-cpus: "4"
          min-mem-mb: "15800"
          min-disk-gb: "30"
          context-label: "the deploy e2e lane"

      - name: Create the provisioning bridge
        uses: ./.github/actions/create-provisioning-bridge
        with:
          bridge-name: ${{ env.PROVISIONING_BRIDGE }}
          host-ip: ${{ env.PROVISIONING_HOST_IP }}

      # manager and bootd feed the register phase (unchanged from the
      # retired netboot lane); image-service, ingest, and seeder feed the
      # deploy phase this lane adds, the same trio the image-path lane
      # imports.
      - name: Download the manager, bootd, image-service, ingest, and seeder image tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: "image-tar-@(manager|bootd|image-service|ingest|seeder)"
          path: /tmp/images
          merge-multiple: true

      - name: Install RKE2 with Multus enabled
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: "v1.36.2+rke2r1"
          enable-multus: "true"

      - name: Harden the provisioning bridge for real PXE/DHCP traffic
        uses: ./.github/actions/harden-provisioning-bridge
        with:
          bridge-name: ${{ env.PROVISIONING_BRIDGE }}

      - name: Install local-path-provisioner and mark it the default StorageClass
        uses: ./.github/actions/install-local-path-provisioner
        with:
          version: "v0.0.37"

      # The target VM's data disk PVC (create-target-vm) names "local-path"
      # explicitly, so it keeps working - but every PVC the deploy phase's
      # own controllers request (image-service staging, PartitionContent
      # content) defaults to ReadWriteMany in production, which plain
      # local-path-provisioner alone cannot satisfy. install-nfs-storage
      # un-defaults local-path and takes over as the cluster default, the
      # same pairing the image-path lane uses.
      - name: Install csi-driver-nfs and mark it the default StorageClass
        uses: ./.github/actions/install-nfs-storage

      # Packages the downloaded dist/live/ artifacts into an OCI image -
      # cheap local repackaging, not a from-source live-image rebuild.
      - name: Build the boot-artifacts image
        run: make docker-build-boot-artifacts BOOT_ARTIFACTS_IMG="${{ env.BOOT_ARTIFACTS_IMG }}"

      - name: Save the boot-artifacts image to a tarball
        run: docker save "${{ env.BOOT_ARTIFACTS_IMG }}" -o /tmp/images/boot-artifacts.tar

      - name: Import the manager, bootd, boot-artifacts, image-service, ingest, and seeder images into RKE2 containerd
        uses: ./.github/actions/import-image-tarballs
        with:
          images: manager bootd boot-artifacts image-service ingest seeder

      - name: Install cert-manager, KubeVirt, virtctl, and CDI
        uses: ./.github/actions/install-cluster-addons
        with:
          kubevirt-version: "v1.9.0"
          cdi-version: "v1.65.0"

      - name: Install KubeVirtBMC
        uses: ./.github/actions/install-kubevirtbmc
        with:
          version: "v0.9.0"

      # BOOT_SERVER_URL/BOOT_AGENT_SERVER_URL point at bootd's own
      # provisioning-network address: bootd's reverse proxy is what a
      # net-booting machine can actually reach, not the ClusterIP
      # Services BOOTD_DEPLOYMENT_*_UPSTREAM_URL name.
      #
      # The IMAGE_INGEST_*/PARTITIONCONTENT_SEEDER_* vars below are the
      # same ones the image-path lane sets, wiring this one
      # controller-manager for both halves of the lane at once - there
      # is no second deploy-kezio call later for the deploy phase. See
      # the image-path lane's own deploy-kezio step for what each one
      # does; IMAGE_INGEST_SOURCE_FORMAT=raw matches
      # build-deploy-test-image's own raw conversion, not only
      # ingest-test-image's fixture. TRACKER_DEPLOYMENT_IMAGE, unlike
      # those, is set only here: the image-path lane runs with no Multus
      # NAD to single-home a Site-managed tracker on and uses
      # tracker.externalURL instead (see its own Site creation steps).
      - name: Deploy kezio CRDs and controller-manager
        uses: ./.github/actions/deploy-kezio
        with:
          manager-image: example.com/kezio:e2e
          kustomize-dir: config/netboot-e2e
          extra-env: |
            DEPLOYER=agent
            BOOT_SERVER_ADDR=:8090
            BOOT_SERVER_URL=http://${{ env.BOOTD_SERVER_IP }}
            BOOT_AGENT_SERVER_URL=http://${{ env.BOOTD_SERVER_IP }}
            AGENT_SERVER_ADDR=:8091
            BOOTD_DEPLOYMENT_IMAGE=example.com/kezio-bootd:e2e
            BOOTD_DEPLOYMENT_BOOT_ARTIFACTS_IMAGE=${{ env.BOOT_ARTIFACTS_IMG }}
            BOOTD_DEPLOYMENT_BOOT_UPSTREAM_URL=http://boot-server.scaffold-system.svc.cluster.local:8090
            BOOTD_DEPLOYMENT_AGENT_UPSTREAM_URL=http://agent-server.scaffold-system.svc.cluster.local:8091
            IMAGE_INGEST_STAGING_PVC=kezio-image-service-staging
            IMAGE_INGEST_IMAGE=example.com/kezio-ingest:e2e
            IMAGE_INGEST_SOURCE_FORMAT=raw
            PARTITIONCONTENT_PUBLISH_IMAGE=example.com/kezio-ingest:e2e
            PARTITIONCONTENT_SEEDER_IMAGE=example.com/kezio-seeder:e2e
            PARTITIONCONTENT_SEEDER_GRACE_PERIOD=30s
            # There is no cluster-wide tracker setting: the Site created
            # below owns a real tracker Deployment, single-homed on the
            # seeding NAD and bound to TRACKER_SERVER_IP - not
            # the ClusterIP Service the image-path lane's externalURL
            # case uses, since a ClusterIP DNATs and this lane's leecher
            # runs on a real machine that has no route to one either way.
            # TRACKER_DEPLOYMENT_IMAGE is the public opentracker build
            # config/opentracker's own (retired) Deployment used to run;
            # no local import is needed, the same way this image was
            # already pulled live by every lane that used to call
            # deploy-opentracker.
            TRACKER_DEPLOYMENT_IMAGE=ghcr.io/tunisiano187/opentracker-docker:master

      - name: Create the provisioning NetworkAttachmentDefinitions
        uses: ./.github/actions/create-provisioning-nads
        with:
          bridge-name: ${{ env.PROVISIONING_BRIDGE }}
          bootd-net1-ip: "${{ env.BOOTD_SERVER_IP }}/24"
          tracker-net1-ip: ${{ env.UNUSED_TRACKER_NET1_IP }}
          seeder-net1-cidr: ${{ env.PROVISIONING_CIDR }}

      # SubnetReconciler's Valid condition checks the kezio-bootd
      # ServiceAccount already exists (its bootd Deployment stamps
      # serviceAccountName: kezio-bootd unconditionally) - apply
      # config/bootd's RBAC before the Subnet, not only through
      # deploy-bootd below, which cannot run until the Subnet's own
      # bootd Deployment exists.
      - name: Apply kezio-bootd's RBAC ahead of the Subnet
        run: kubectl apply -k config/bootd

      - name: Deploy the existing-dhcp pod on the provisioning bridge
        if: matrix.dhcp-scenario == 'proxydhcp'
        uses: ./.github/actions/deploy-existing-dhcp
        with:
          name: kezio-existing-dhcp
          image: "jpillora/dnsmasq:1.1@sha256:78a9c6711031a557d9c6a79a0b6e060c4ac09de3a8755c78d690acb55b4ccd15"
          bridge: ${{ env.PROVISIONING_BRIDGE }}
          static-cidr: ${{ env.EXISTING_DHCP_NET1_IP }}
          dhcp-range: "192.0.2.10,192.0.2.100,255.255.255.0,12h"

      # The Subnet webhook admits spec.siteRef only against a Site that
      # already exists, and the Site/Subnet cross-reference is cyclic
      # (create-site's own doc comment), so the Site is created bare
      # first and patched below, once the Subnet exists and points back.
      - name: Create the Site (bare)
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_NAME }}
          wait-for: Valid

      - name: Create the Subnet
        uses: ./.github/actions/create-subnet
        with:
          name: ${{ env.SUBNET_NAME }}
          cidr: ${{ env.PROVISIONING_CIDR }}
          bootd-server-ip: ${{ env.BOOTD_SERVER_IP }}
          bootd-network-name: kezio-boot-network
          # Without this the seeder pod only ever gets a cluster pod IP,
          # which is the one address a machine on the provisioning
          # segment cannot reach - so every leecher fails to fetch its
          # torrent and the deploy retries forever.
          seeder-network-name: kezio-seeder-network
          site-ref: ${{ env.SITE_NAME }}
          dhcp-scenario: ${{ matrix.dhcp-scenario }}
          lease-range-start: ${{ env.LEASE_RANGE_START }}
          lease-range-end: ${{ env.LEASE_RANGE_END }}
          # kezio-seeder-network's host-local ipam narrows its pool with
          # rangeStart/rangeEnd (create-provisioning-nads), which
          # internal/nadvalidate does not model - CheckSeederOverlap can
          # only report Indeterminate for it, so Valid never reaches
          # True even though nothing else about this Subnet is broken.
          accept-valid-unknown: "true"

      # This Site's tracker Deployment single-homes on the seeding
      # Subnet's own SeederNetworkRef (kezio-seeder-network), pinned to
      # TRACKER_SERVER_IP via a per-pod "ips" override
      # (site_tracker_deployment.go's trackerPodAnnotations) - so it is
      # reachable from every segment this lane routes to it, the same
      # address a peer's announce response hands back. Ready needs the
      # tracker Deployment actually Available, which needs
      # TRACKER_DEPLOYMENT_IMAGE (set on the manager above), and
      # accept-unknown for the same host-local-range reason the Subnet
      # above needs accept-valid-unknown: CheckTrackerAddress on that
      # same NAD is equally Indeterminate, so Ready never reaches True
      # either.
      - name: Point the Site at its seeding Subnet
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_NAME }}
          seeder-subnet-name: ${{ env.SUBNET_NAME }}
          tracker-ip: ${{ env.TRACKER_SERVER_IP }}
          wait-for: Ready
          accept-unknown: "true"

      - name: Deploy kezio-bootd on the provisioning bridge
        uses: ./.github/actions/deploy-bootd
        with:
          subnet-name: ${{ env.SUBNET_NAME }}
          bootd-server-ip: ${{ env.BOOTD_SERVER_IP }}

      - name: Create the target VM
        uses: ./.github/actions/create-target-vm
        with:
          vm-name: ${{ env.TARGET_VM_NAME }}
          vm-mac: ${{ env.TARGET_VM_MAC }}
          disk-serial: "${{ env.TARGET_DISK_SERIAL }}"

      # Must precede provisioning through the BMC: it creates the
      # basic-auth Secret VirtualMachineBMC.spec.authSecretRef reads,
      # which create-bmc-machine also points Machine.spec.bmc at.
      - name: Create the Machine
        uses: ./.github/actions/create-bmc-machine
        with:
          secret-name: "${{ env.TARGET_VM_NAME }}-bmc-creds"
          machine-name: ${{ env.TARGET_VM_NAME }}
          bmc-address: "redfish+http://${{ env.TARGET_VM_NAME }}-virtbmc.scaffold-system.svc.cluster.local/redfish/v1/Systems/1"
          boot-mac: ${{ env.TARGET_VM_MAC }}
          subnet-name: ${{ env.SUBNET_NAME }}
          target-disk-serial: "${{ env.TARGET_DISK_SERIAL }}"

      - name: Provision the target VM through a real KubeVirtBMC/Redfish endpoint
        uses: ./.github/actions/provision-target-vm-via-bmc
        with:
          vm-name: ${{ env.TARGET_VM_NAME }}
          bmc-creds-secret-name: "${{ env.TARGET_VM_NAME }}-bmc-creds"

      - name: Start continuous VM console capture
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: ${{ env.TARGET_VM_NAME }}
          logfile: ${{ runner.temp }}/console-${{ matrix.dhcp-scenario }}.log

      - name: Wait for the agent to register and the Machine to become Available
        uses: ./.github/actions/wait-agent-registered
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}

      - name: Verify the DHCP scenario behaved as configured
        uses: ./.github/actions/verify-dhcp-scenario
        with:
          scenario: ${{ matrix.dhcp-scenario }}
          bootd-deployment-name: "kezio-bootd-${{ env.SUBNET_NAME }}"

      - name: Create the unenrolled-MAC VM
        uses: ./.github/actions/create-target-vm
        with:
          vm-name: ${{ env.UNKNOWN_VM_NAME }}
          vm-mac: ${{ env.UNKNOWN_VM_MAC }}
          disk-serial: "KEZIONETBOOTDISK02"

      - name: Assert the unenrolled MAC is never answered
        uses: ./.github/actions/assert-mac-not-allowlisted
        with:
          vm-name: ${{ env.UNKNOWN_VM_NAME }}
          mac: ${{ env.UNKNOWN_VM_MAC }}
          bmc-creds-secret-name: "${{ env.UNKNOWN_VM_NAME }}-bmc-creds"
          bootd-deployment-name: "kezio-bootd-${{ env.SUBNET_NAME }}"
          wait-seconds: "90"

      # Register phase ends above (carried over from the retired netboot
      # lane, unchanged). Everything below drives the registered Machine
      # through a real deploy - the image-path lane's own image-service
      # setup (the tracker is already up: the Site created earlier owns
      # it), then the deploy-specific prerequisites and the happy-path
      # deploy itself.

      - name: Create the image-service bearer token Secret
        uses: ./.github/actions/create-image-service-token-secret
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      # The nfs StorageClass (installed above) satisfies ReadWriteMany, so
      # config/image-service's own default access mode applies unmodified;
      # staging-size is capped the same way the image-path lane caps it -
      # the runner's own disk backs the "nfs" StorageClass.
      - name: Deploy image-service
        uses: ./.github/actions/deploy-image-service
        with:
          image-service-image: example.com/kezio-image-service:e2e
          staging-size: "2Gi"

      - name: Verify image-path prerequisites
        uses: ./.github/actions/verify-image-path-prerequisites
        with:
          # This lane's tracker is the Site-managed Deployment created
          # above, not a standalone opentracker (the action's own
          # default label).
          tracker-label-selector: "app.kubernetes.io/component=tracker"

      - name: Build and ingest the full-deploy test image
        id: build-image
        uses: ./.github/actions/build-deploy-test-image
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Create the full-deploy marker PostHook
        id: marker
        uses: ./.github/actions/create-deploy-marker-posthook

      # Two-axis status proof, strictly before the happy-path deploy
      # below: injects one plan-build failure, asserts status.state stays
      # unchanged while status.operationalStatus becomes "error", then
      # returns with the failing deploy intent still on the Machine.
      # deploy-machine's own merge patch (next step, unmodified) overwrites
      # spec.imageRef/postHookRefs unconditionally, so it is itself the
      # retry-to-success proof - see this action's own doc comment for why
      # the injected failure cannot leak into the happy-path deploy.
      - name: Prove state and operationalStatus are independent axes
        uses: ./.github/actions/assert-two-axis-status
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}

      # Abort-channel proof, still strictly before deploy-machine's own
      # happy-path patch: assert-two-axis-status's own failure never
      # reaches startProvisioningRun, so it leaves the Machine Available
      # with no DeployRun in flight - this action therefore sets the
      # Machine's own deploy intent itself (same shape deploy-machine's
      # own patch uses), waits for that to start a real DeployRun, waits
      # for it to actually reach WritingContent, deletes it mid-write, and
      # proves the sanctioned recovery path for a run that disappears out
      # from under a live deployment (recordCurrentRunDeleted) starts a
      # genuinely fresh run that itself reboots into a new kezio-agent and
      # reaches WritingContent again - see this action's own doc comment
      # for the full evidence trace, including why a deleted run's own
      # "failed" status is never observable after the fact. No Provisioned
      # wait happens here: deploy-machine's own unmodified patch+wait
      # (next step, a no-op re-patch of the same imageRef/postHookRefs)
      # and verify-deploy are what prove the controller's automatic retry
      # actually lands.
      - name: Assert deleting a mid-write DeployRun aborts the agent and retries cleanly
        uses: ./.github/actions/assert-abort-mid-write
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}

      # Captured right before deploy-machine patches the deploy intent in,
      # so verify-deploy's layer 3 can tell this run's marker apart from a
      # stale one left by an earlier deploy of the same disk. The aborted
      # run above never reached DeployRunPhaseRunningPostHook (it was
      # caught and deleted mid-WritingContent), so it never wrote a
      # full-deploy marker - this timestamp's position relative to the
      # abort action above is therefore immaterial to freshness, only its
      # position relative to deploy-machine's own patch matters.
      - name: Capture the pre-deploy timestamp
        id: pre-deploy
        run: echo "timestamp-ns=$(date -u +%s%N)" >>"${GITHUB_OUTPUT}"

      # posthook-names left at deploy-machine's own default: it already
      # pairs create-deploy-marker-posthook's default name with
      # kezio-default-finalize.
      - name: Set the Machine's deploy intent and wait for Provisioned
        id: deploy
        uses: ./.github/actions/deploy-machine
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}

      - name: Verify the deploy landed
        uses: ./.github/actions/verify-deploy
        with:
          machine-name: ${{ steps.deploy.outputs.machine-name }}
          namespace: ${{ steps.deploy.outputs.namespace }}
          deploy-run-name: ${{ steps.deploy.outputs.deploy-run-name }}
          pre-deploy-timestamp-ns: ${{ steps.pre-deploy.outputs.timestamp-ns }}

      # After verify-deploy: this asserts recorded history on the DeployRun
      # itself (phase, per-partition percent, phase timings), not an
      # outward effect of the deploy, so verify-deploy's three layers stay
      # the first and clearest signal if the deploy itself is broken.
      - name: Assert the DeployRun's recorded progress detail
        uses: ./.github/actions/assert-deploy-run-progress
        with:
          deploy-run-name: ${{ steps.deploy.outputs.deploy-run-name }}
          namespace: ${{ steps.deploy.outputs.namespace }}

      # Post-deploy power-cycle proof through the reboot annotation, still
      # strictly before the disk-destroying step below: the deployed OS
      # disk from deploy-machine/verify-deploy above is still intact here,
      # which this action's own marker-unchanged check depends on.
      - name: Assert a post-deploy power cycle runs through the reboot annotation
        uses: ./.github/actions/assert-reboot-annotation-cycle
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}

      # Last disk-touching step in this lane, deliberately: it reshapes the
      # Machine's spec away from the OS image just verified above onto a
      # dataImages-only intent, overwriting the same disk. A future
      # assertion that still needs the deployed OS intact (an
      # abort-mid-write proof, or a post-deploy power-cycle proof through
      # the reboot annotation) belongs above this step, not below it - see
      # this action's own doc comment.
      - name: Build and ingest the dataImages-only test image
        id: build-data-image
        uses: ./.github/actions/ingest-test-image
        with:
          image-name: "kezio-e2e-deploy-poweroff-data"
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Assert a dataImages-only deploy powers the machine off
        id: poweroff
        uses: ./.github/actions/assert-poweroff-after-deploy
        with:
          machine-name: ${{ env.TARGET_VM_NAME }}
          image-name: ${{ steps.build-data-image.outputs.image-name }}
          target-disk-serial: "${{ env.TARGET_DISK_SERIAL }}"

      - name: Dump all kezio v1alpha2 resources
        if: always()
        uses: ./.github/actions/dump-kezio-resources

      # extra-resource-refs is deliberately not set here: every
      # still-existing resource (machine, subnet, image x2, posthook,
      # deployrun x2) is already dumped, byte-identically, by "Collect
      # always-on diagnostics bundle" below - which also runs on this
      # same failure since it is if: always(). The one run this dump
      # cannot cover is the mid-write DeployRun that
      # assert-abort-mid-write deletes: dump-kezio-resources's `kubectl
      # get` above runs after that deletion, so a deleted object cannot
      # come back from it, and no extra-resource-refs entry could fix
      # that either. That run's evidence lives instead in the deleting
      # step's own log output, the console capture, and the controller
      # logs - see assert-abort-mid-write's own doc comment.
      - name: Dump diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-e2e-diagnostics
        with:
          target-vm-name: ${{ env.TARGET_VM_NAME }}
          provisioning-bridge: ${{ env.PROVISIONING_BRIDGE }}
          bootd-label-selector: "app.kubernetes.io/component=bootd,kezio.kojuro.date/bootd-subnet=${{ env.SUBNET_NAME }}"

      # The ingest/publish Jobs have no other log channel in this lane:
      # dump-e2e-diagnostics's extra-deployment-logs/extra-job-label-
      # selectors are unset above, and build-deploy-test-image/
      # ingest-test-image only dump ingest Job logs inline if their own
      # step is the one that fails, not a later one. The tracker
      # Deployment's logs are not named here - it is Site-managed
      # (kezio-tracker-<site>, no fixed name) and collect-site-
      # diagnostics below already covers it by label selector.
      - name: Collect always-on diagnostics bundle
        if: always()
        uses: ./.github/actions/collect-e2e-diagnostics-bundle
        with:
          output-dir: e2e-bundle
          deployments: |
            kezio-bootd-${{ env.SUBNET_NAME }}:bootd.log
            scaffold-controller-manager:controller-manager.log
            kezio-image-service:image-service.log
          resources: |
            machine/${{ env.TARGET_VM_NAME }}:machine.yaml
            subnet/${{ env.SUBNET_NAME }}:subnet.yaml
            site/${{ env.SITE_NAME }}:site.yaml
            machinehardware/${{ env.TARGET_VM_NAME }}:machinehardware.yaml
            image/${{ steps.build-image.outputs.image-name }}:image.yaml
            posthook/${{ steps.marker.outputs.name }}:posthook.yaml
            deployrun/${{ steps.deploy.outputs.deploy-run-name }}:deployrun.yaml
            image/${{ steps.build-data-image.outputs.image-name }}:data-image.yaml
            deployrun/${{ steps.poweroff.outputs.deploy-run-name }}:poweroff-deployrun.yaml
          job-label-selectors: |
            app.kubernetes.io/component=image-ingest-job:ingest-job.log
            app.kubernetes.io/component=partition-content-publish:publish-job.log
            app.kubernetes.io/name=kezio,app.kubernetes.io/component=image-seeder:seeder.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ matrix.dhcp-scenario }}-diagnostics
          path: |
            e2e-bundle
            ${{ runner.temp }}/console-${{ matrix.dhcp-scenario }}.log
            ${{ runner.temp }}/diagnostics-dump.log
            ${{ runner.temp }}/diagnostics-kubevirtbmc-dump.log
            ${{ runner.temp }}/kezio-resources-dump.log
          retention-days: 7
          if-no-files-found: ignore

      # Describe + current/previous logs for the tracker and seeder
      # Deployments/pods above (dump-e2e-diagnostics does not cover
      # them), each pod's network-status annotation (the only place
      # Multus records the address a pod actually got - what a future
      # address-pinning assertion needs), and a runner-wide network
      # snapshot beyond dump-e2e-diagnostics's single FORWARD/mangle
      # dump. Augments, not replaces, the steps above: those already
      # cover controller-manager crash logs and KubeVirtBMC, which this
      # action does not duplicate. tracker-label-selector overrides the
      # action's own legacy-opentracker default: this lane's tracker is
      # Site-managed (kezio-tracker-<site>, label component=tracker), not
      # a standalone opentracker Deployment. extra-artifact-paths carries
      # the console-capture logfile (started above) into this same
      # upload instead of a separate one - this action does not call
      # capture-vm-console itself, since that backgrounds a continuous
      # attach loop from VM-Ready onward while this action runs once, at
      # the end.
      - name: Collect site/tracker/seeder/bootd/runner-network diagnostics
        if: always()
        uses: ./.github/actions/collect-site-diagnostics
        with:
          artifact-name-prefix: deploy-${{ matrix.dhcp-scenario }}
          namespaces: "scaffold-system"
          tracker-label-selector: "app.kubernetes.io/name=kezio,app.kubernetes.io/component=tracker"
          bridges: ${{ env.PROVISIONING_BRIDGE }}
          extra-artifact-paths: ${{ runner.temp }}/console-${{ matrix.dhcp-scenario }}.log

  # Routed lane: three segments, one Site. Segment A carries target
  # machine 1 and its own bootd; segment B carries target machine 2 and
  # its own bootd; segment C carries the seeder and the tracker and no
  # target machine. The runner host forwards between all three (one
  # create-routed-segments group), so the machine on A and the machine on
  # B both leech from - and announce to - the one seeder/tracker pair on
  # C over a real routed L3 hop, never a shared broadcast domain. This is
  # the per-(Image, Site) seeder plane proving what per-content placement
  # could not: two machines on two different Subnets of one Site sharing
  # one seeder.
  #
  # What this lane does NOT claim: nothing about latency, bandwidth, or
  # WAN copy counts - one runner cannot produce those. It also does not
  # claim per-Subnet boot-server isolation: BOOT_SERVER_URL/
  # BOOT_AGENT_SERVER_URL (below) are one manager-wide static value, so
  # both machines' kernel/initrd fetch and agent traffic are addressed at
  # segment A's bootd even for the machine on segment B - correct here
  # only because A and B are routable to each other inside this one Site,
  # the same routed hop the seeder/tracker assertions below exercise. A
  # lane whose segments must NOT route to each other (the two-site lane)
  # cannot reuse this shortcut; it needs its own boot server per Site.
  #
  # Heaviest lane so far: two full boot-and-deploy chains plus the
  # KubeVirt stack on one runner. check-runner-resources below uses the
  # same floor the single-machine deploy lane needs; if a real run shows
  # this is not enough (OOM or CPU starvation rather than a genuine test
  # failure), the fix is a larger runner class for this job specifically
  # (a `runs-on` change), not serializing the two deploys - concurrency
  # is this lane's reason to exist.
  e2e-routed-site:
    name: Routed lane
    needs: [build-required, e2e-fast-lane, e2e-network-probes]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SEG_A_BRIDGE: kezio-routed-a
      SEG_A_CIDR: 198.51.100.0/24
      SEG_A_HOST_CIDR: 198.51.100.1/24
      SEG_A_HOST_ADDR: 198.51.100.1
      BOOTD_A_IP: 198.51.100.2
      LEASE_A_START: 198.51.100.10
      LEASE_A_END: 198.51.100.100
      SEG_B_BRIDGE: kezio-routed-b
      SEG_B_CIDR: 198.51.101.0/24
      SEG_B_HOST_CIDR: 198.51.101.1/24
      SEG_B_HOST_ADDR: 198.51.101.1
      BOOTD_B_IP: 198.51.101.2
      LEASE_B_START: 198.51.101.10
      LEASE_B_END: 198.51.101.100
      SEG_C_BRIDGE: kezio-routed-c
      SEG_C_CIDR: 198.51.102.0/24
      SEG_C_HOST_CIDR: 198.51.102.1/24
      SEG_C_HOST_ADDR: 198.51.102.1
      # Bare, like the single-segment deploy lane's own TRACKER_SERVER_IP:
      # the announce URL baked into every torrent must be the tracker's
      # own address on this segment, with nothing rewriting it on the
      # way. The top address of the seeding NAD's own pool
      # (kezio-seeder-network, host-local, carved out of SEG_C_CIDR
      # below), because the tracker pins it on that same NAD and
      # host-local refuses a requested address outside its own range -
      # see create-provisioning-nads' own comment on that pool's range.
      TRACKER_IP: 198.51.102.116
      # create-provisioning-nads always creates a "kezio-boot-network" and
      # a "kezio-tracker-network" NAD alongside the seeder one; neither is
      # referenced by any Subnet in this lane (segment C hosts no bootd,
      # and the Site's tracker single-homes on the seeding Subnet's own
      # seederNetworkRef - see internal/controller/site_tracker_deployment.go's
      # trackerPodAnnotations, not a dedicated tracker NAD), so these two
      # addresses back inert, unused NAD objects. Distinct from every real
      # address on segment C so they cannot collide with one.
      UNUSED_BOOTD_NET1_IP: 198.51.102.6/24
      UNUSED_TRACKER_NET1_IP: 198.51.102.7/24
      SITE_NAME: kezio-routed-site
      SUBNET_A_NAME: kezio-routed-subnet-a
      SUBNET_B_NAME: kezio-routed-subnet-b
      SUBNET_C_NAME: kezio-routed-subnet-c
      VM_A_NAME: kezio-routed-vm-a
      VM_B_NAME: kezio-routed-vm-b
      VM_A_MAC: "52:54:00:be:ef:10"
      VM_B_MAC: "52:54:00:be:ef:11"
      DISK_A_SERIAL: KEZIOROUTEDDISKA01
      DISK_B_SERIAL: KEZIOROUTEDDISKB01
      BOOT_ARTIFACTS_IMG: "example.com/kezio-boot-artifacts:e2e"
    steps:
      - uses: actions/checkout@v4

      - name: Download the live boot image artifacts
        uses: actions/download-artifact@v4
        with:
          name: kezio-live-image
          path: dist/live

      - name: Fail fast if the downloaded boot artifacts are empty
        uses: ./.github/actions/assert-boot-artifacts-present

      - name: Prepare the KVM host
        uses: ./.github/actions/prepare-kvm-host

      # Same floor the single-machine deploy lane uses - see this job's
      # own top comment on the budget risk two concurrent boot chains add
      # on top of it.
      - name: Resource check (fail fast if the runner is under-resourced)
        uses: ./.github/actions/check-runner-resources
        with:
          min-cpus: "4"
          min-mem-mb: "15800"
          min-disk-gb: "35"
          context-label: "the routed multi-segment e2e lane"

      # Host-level bridges before RKE2/canal starts, the same ordering
      # create-provisioning-bridge uses in the single-segment deploy lane.
      # One group: all three segments belong to the one Site this lane
      # creates, so create-routed-segments allows forwarding between every
      # pair of them and would drop traffic to/from any other group (none
      # exists in this lane).
      - name: Create the three routed segments (one Site, one group)
        uses: ./.github/actions/create-routed-segments
        with:
          segments: |
            ${{ env.SEG_A_BRIDGE }} ${{ env.SEG_A_CIDR }} ${{ env.SEG_A_HOST_CIDR }} kezio-routed-site-group
            ${{ env.SEG_B_BRIDGE }} ${{ env.SEG_B_CIDR }} ${{ env.SEG_B_HOST_CIDR }} kezio-routed-site-group
            ${{ env.SEG_C_BRIDGE }} ${{ env.SEG_C_CIDR }} ${{ env.SEG_C_HOST_CIDR }} kezio-routed-site-group

      - name: Download the manager, bootd, image-service, ingest, and seeder image tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: "image-tar-@(manager|bootd|image-service|ingest|seeder)"
          path: /tmp/images
          merge-multiple: true

      - name: Install RKE2 with Multus enabled
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: "v1.36.2+rke2r1"
          enable-multus: "true"

      # All three bridges host Multus-attached pods (bootd on A and B,
      # tracker/seeder on C), so every one needs canal's FORWARD-chain
      # self-bridge fixup; only A and B carry real PXE/DHCP traffic, but
      # the UDP-checksum fixup is harmless on C.
      - name: Harden segment A for real PXE/DHCP traffic
        uses: ./.github/actions/harden-provisioning-bridge
        with:
          bridge-name: ${{ env.SEG_A_BRIDGE }}

      - name: Harden segment B for real PXE/DHCP traffic
        uses: ./.github/actions/harden-provisioning-bridge
        with:
          bridge-name: ${{ env.SEG_B_BRIDGE }}

      - name: Harden segment C for its own Multus-attached pods
        uses: ./.github/actions/harden-provisioning-bridge
        with:
          bridge-name: ${{ env.SEG_C_BRIDGE }}

      - name: Install local-path-provisioner and mark it the default StorageClass
        uses: ./.github/actions/install-local-path-provisioner
        with:
          version: "v0.0.37"

      - name: Install csi-driver-nfs and mark it the default StorageClass
        uses: ./.github/actions/install-nfs-storage

      - name: Build the boot-artifacts image
        run: make docker-build-boot-artifacts BOOT_ARTIFACTS_IMG="${{ env.BOOT_ARTIFACTS_IMG }}"

      - name: Save the boot-artifacts image to a tarball
        run: docker save "${{ env.BOOT_ARTIFACTS_IMG }}" -o /tmp/images/boot-artifacts.tar

      - name: Import the manager, bootd, boot-artifacts, image-service, ingest, and seeder images into RKE2 containerd
        uses: ./.github/actions/import-image-tarballs
        with:
          images: manager bootd boot-artifacts image-service ingest seeder

      - name: Install cert-manager, KubeVirt, virtctl, and CDI
        uses: ./.github/actions/install-cluster-addons
        with:
          kubevirt-version: "v1.9.0"
          cdi-version: "v1.65.0"

      - name: Install KubeVirtBMC
        uses: ./.github/actions/install-kubevirtbmc
        with:
          version: "v0.9.0"

      # One controller-manager for the whole lane, same as the
      # single-segment deploy lane. BOOT_SERVER_URL/BOOT_AGENT_SERVER_URL
      # are a single manager-wide value (internal/bootserver.Config, set
      # once at manager startup - see this job's own top comment): pointed
      # at segment A's bootd, which segment B's machine reaches over the
      # same routed hop this lane's Site provides. TRACKER_DEPLOYMENT_IMAGE
      # backs the one Site-managed tracker Deployment created below.
      - name: Deploy kezio CRDs and controller-manager
        uses: ./.github/actions/deploy-kezio
        with:
          manager-image: example.com/kezio:e2e
          kustomize-dir: config/netboot-e2e
          extra-env: |
            DEPLOYER=agent
            BOOT_SERVER_ADDR=:8090
            BOOT_SERVER_URL=http://${{ env.BOOTD_A_IP }}
            BOOT_AGENT_SERVER_URL=http://${{ env.BOOTD_A_IP }}
            AGENT_SERVER_ADDR=:8091
            BOOTD_DEPLOYMENT_IMAGE=example.com/kezio-bootd:e2e
            BOOTD_DEPLOYMENT_BOOT_ARTIFACTS_IMAGE=${{ env.BOOT_ARTIFACTS_IMG }}
            BOOTD_DEPLOYMENT_BOOT_UPSTREAM_URL=http://boot-server.scaffold-system.svc.cluster.local:8090
            BOOTD_DEPLOYMENT_AGENT_UPSTREAM_URL=http://agent-server.scaffold-system.svc.cluster.local:8091
            IMAGE_INGEST_STAGING_PVC=kezio-image-service-staging
            IMAGE_INGEST_IMAGE=example.com/kezio-ingest:e2e
            IMAGE_INGEST_SOURCE_FORMAT=raw
            PARTITIONCONTENT_PUBLISH_IMAGE=example.com/kezio-ingest:e2e
            PARTITIONCONTENT_SEEDER_IMAGE=example.com/kezio-seeder:e2e
            PARTITIONCONTENT_SEEDER_GRACE_PERIOD=30s
            TRACKER_DEPLOYMENT_IMAGE=ghcr.io/tunisiano187/opentracker-docker:master

      # Two independently-addressed boot NADs, one per PXE segment.
      # create-provisioning-nads bakes fixed names ("kezio-boot-network",
      # "kezio-boot-network-vm") for a single-bridge lane; composing it
      # twice in this one namespace would collide on those names, so both
      # pairs are created here instead, under per-segment names, using the
      # identical manifest shape that action documents (static ipam for
      # the real NAD, empty ipam for the VM's own - see its own doc
      # comment for why the VM interface must not be IPAM'd).
      - name: Create the boot NetworkAttachmentDefinitions for segments A and B
        shell: bash
        env:
          NAMESPACE: "scaffold-system"
          SEG_A_BRIDGE: ${{ env.SEG_A_BRIDGE }}
          SEG_B_BRIDGE: ${{ env.SEG_B_BRIDGE }}
          BOOTD_A_IP: ${{ env.BOOTD_A_IP }}
          BOOTD_B_IP: ${{ env.BOOTD_B_IP }}
        run: |
          set -euo pipefail
          for seg in a b; do
            case "${seg}" in
              a) bridge="${SEG_A_BRIDGE}"; addr="${BOOTD_A_IP}/24" ;;
              b) bridge="${SEG_B_BRIDGE}"; addr="${BOOTD_B_IP}/24" ;;
            esac
            cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network-${seg}
            namespace: ${NAMESPACE}
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "name": "kezio-boot-network-${seg}",
                "plugins": [
                  {
                    "type": "bridge",
                    "bridge": "${bridge}",
                    "ipam": {
                      "type": "static",
                      "addresses": [
                        {"address": "${addr}"}
                      ]
                    }
                  }
                ]
              }
          EOF
            cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network-vm-${seg}
            namespace: ${NAMESPACE}
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "name": "kezio-boot-network-vm-${seg}",
                "plugins": [
                  {
                    "type": "bridge",
                    "bridge": "${bridge}",
                    "ipam": {}
                  }
                ]
              }
          EOF
          done

      # Routes toward both boot segments on the seeding NAD's own ipam:
      # the single-homed seeder/tracker pod on segment C has no cluster
      # network at all (section 3.4), so this route entry is the only path
      # it has to either machine's segment.
      - name: Create the tracker/seeder NetworkAttachmentDefinitions on segment C, with IPAM routes to segments A and B
        uses: ./.github/actions/create-provisioning-nads
        with:
          bridge-name: ${{ env.SEG_C_BRIDGE }}
          bootd-net1-ip: ${{ env.UNUSED_BOOTD_NET1_IP }}
          tracker-net1-ip: ${{ env.UNUSED_TRACKER_NET1_IP }}
          seeder-net1-cidr: ${{ env.SEG_C_CIDR }}
          seeding-routes-json: >-
            [{"dst":"${{ env.SEG_A_CIDR }}","gw":"${{ env.SEG_C_HOST_ADDR }}"},{"dst":"${{ env.SEG_B_CIDR }}","gw":"${{ env.SEG_C_HOST_ADDR }}"}]

      # SubnetReconciler's Valid condition checks the kezio-bootd
      # ServiceAccount already exists - apply config/bootd's RBAC before
      # either boot-half Subnet, same as the single-segment deploy lane.
      - name: Apply kezio-bootd's RBAC ahead of the Subnets
        run: kubectl apply -k config/bootd

      # The Subnet webhook admits spec.siteRef only against a Site that
      # already exists, and the Site/Subnet cross-reference is cyclic
      # (create-site's own doc comment), so the Site is created bare
      # first and patched once all three Subnets exist.
      - name: Create the Site (bare)
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_NAME }}
          wait-for: Valid

      - name: Create Subnet A (segment A, boot half only)
        uses: ./.github/actions/create-subnet
        with:
          name: ${{ env.SUBNET_A_NAME }}
          cidr: ${{ env.SEG_A_CIDR }}
          bootd-server-ip: ${{ env.BOOTD_A_IP }}
          bootd-network-name: kezio-boot-network-a
          site-ref: ${{ env.SITE_NAME }}
          dhcp-scenario: dhcp
          lease-range-start: ${{ env.LEASE_A_START }}
          lease-range-end: ${{ env.LEASE_A_END }}

      - name: Create Subnet B (segment B, boot half only)
        uses: ./.github/actions/create-subnet
        with:
          name: ${{ env.SUBNET_B_NAME }}
          cidr: ${{ env.SEG_B_CIDR }}
          bootd-server-ip: ${{ env.BOOTD_B_IP }}
          bootd-network-name: kezio-boot-network-b
          site-ref: ${{ env.SITE_NAME }}
          dhcp-scenario: dhcp
          lease-range-start: ${{ env.LEASE_B_START }}
          lease-range-end: ${{ env.LEASE_B_END }}

      # Data-plane-only: no boot half, seederNetworkRef only - the
      # no-machines-here segment section 2.4 makes expressible.
      - name: Create Subnet C (segment C, data plane only - no boot half)
        uses: ./.github/actions/create-subnet
        with:
          name: ${{ env.SUBNET_C_NAME }}
          cidr: ${{ env.SEG_C_CIDR }}
          seeder-network-name: kezio-seeder-network
          site-ref: ${{ env.SITE_NAME }}
          # kezio-seeder-network's host-local ipam is range-bounded - see
          # the single-segment deploy lane's own comment on this input.
          accept-valid-unknown: "true"

      # Ready needs the tracker Deployment actually Available, which needs
      # TRACKER_DEPLOYMENT_IMAGE (set on the manager above), and
      # accept-unknown for the same host-local-range reason Subnet C's
      # own accept-valid-unknown is needed above.
      - name: Point the Site at its seeding Subnet (segment C)
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_NAME }}
          seeder-subnet-name: ${{ env.SUBNET_C_NAME }}
          tracker-ip: ${{ env.TRACKER_IP }}
          wait-for: Ready
          accept-unknown: "true"

      - name: Deploy kezio-bootd on segment A
        uses: ./.github/actions/deploy-bootd
        with:
          subnet-name: ${{ env.SUBNET_A_NAME }}
          bootd-server-ip: ${{ env.BOOTD_A_IP }}

      - name: Deploy kezio-bootd on segment B
        uses: ./.github/actions/deploy-bootd
        with:
          subnet-name: ${{ env.SUBNET_B_NAME }}
          bootd-server-ip: ${{ env.BOOTD_B_IP }}

      - name: Create target VM A on segment A
        uses: ./.github/actions/create-target-vm
        with:
          vm-name: ${{ env.VM_A_NAME }}
          vm-mac: ${{ env.VM_A_MAC }}
          disk-serial: "${{ env.DISK_A_SERIAL }}"
          boot-network-name: kezio-boot-network-vm-a

      - name: Create target VM B on segment B
        uses: ./.github/actions/create-target-vm
        with:
          vm-name: ${{ env.VM_B_NAME }}
          vm-mac: ${{ env.VM_B_MAC }}
          disk-serial: "${{ env.DISK_B_SERIAL }}"
          boot-network-name: kezio-boot-network-vm-b

      - name: Create Machine A
        uses: ./.github/actions/create-bmc-machine
        with:
          secret-name: "${{ env.VM_A_NAME }}-bmc-creds"
          machine-name: ${{ env.VM_A_NAME }}
          bmc-address: "redfish+http://${{ env.VM_A_NAME }}-virtbmc.scaffold-system.svc.cluster.local/redfish/v1/Systems/1"
          boot-mac: ${{ env.VM_A_MAC }}
          subnet-name: ${{ env.SUBNET_A_NAME }}
          target-disk-serial: "${{ env.DISK_A_SERIAL }}"

      - name: Create Machine B
        uses: ./.github/actions/create-bmc-machine
        with:
          secret-name: "${{ env.VM_B_NAME }}-bmc-creds"
          machine-name: ${{ env.VM_B_NAME }}
          bmc-address: "redfish+http://${{ env.VM_B_NAME }}-virtbmc.scaffold-system.svc.cluster.local/redfish/v1/Systems/1"
          boot-mac: ${{ env.VM_B_MAC }}
          subnet-name: ${{ env.SUBNET_B_NAME }}
          target-disk-serial: "${{ env.DISK_B_SERIAL }}"

      # Both machines' BMC/Redfish endpoints are stood up back-to-back,
      # before either wait-agent-registered below, so both power on and
      # PXE-boot concurrently rather than one fully enrolling before the
      # other starts.
      - name: Provision target VM A through a real KubeVirtBMC/Redfish endpoint
        uses: ./.github/actions/provision-target-vm-via-bmc
        with:
          vm-name: ${{ env.VM_A_NAME }}
          bmc-creds-secret-name: "${{ env.VM_A_NAME }}-bmc-creds"

      - name: Provision target VM B through a real KubeVirtBMC/Redfish endpoint
        uses: ./.github/actions/provision-target-vm-via-bmc
        with:
          vm-name: ${{ env.VM_B_NAME }}
          bmc-creds-secret-name: "${{ env.VM_B_NAME }}-bmc-creds"

      - name: Start continuous VM console capture (A)
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: ${{ env.VM_A_NAME }}
          logfile: ${{ runner.temp }}/console-routed-a.log

      - name: Start continuous VM console capture (B)
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: ${{ env.VM_B_NAME }}
          logfile: ${{ runner.temp }}/console-routed-b.log

      - name: Wait for machine A's agent to register and the Machine to become Available
        uses: ./.github/actions/wait-agent-registered
        with:
          machine-name: ${{ env.VM_A_NAME }}

      - name: Wait for machine B's agent to register and the Machine to become Available
        uses: ./.github/actions/wait-agent-registered
        with:
          machine-name: ${{ env.VM_B_NAME }}

      - name: Create the image-service bearer token Secret
        uses: ./.github/actions/create-image-service-token-secret
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Deploy image-service
        uses: ./.github/actions/deploy-image-service
        with:
          image-service-image: example.com/kezio-image-service:e2e
          staging-size: "2Gi"

      - name: Verify image-path prerequisites
        uses: ./.github/actions/verify-image-path-prerequisites
        with:
          tracker-label-selector: "app.kubernetes.io/component=tracker"

      # Built and ingested once: both machines deploy this same Image, off
      # the one shared seeder Deployment on segment C.
      - name: Build and ingest the shared test image
        id: build-image
        uses: ./.github/actions/build-deploy-test-image
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Create the full-deploy marker PostHook
        id: marker
        uses: ./.github/actions/create-deploy-marker-posthook

      - name: Capture the pre-deploy timestamp
        id: pre-deploy
        run: echo "timestamp-ns=$(date -u +%s%N)" >>"${GITHUB_OUTPUT}"

      # Both machines' deploy intent is patched in back-to-back, before
      # either wait below - this is what starts both deploys inside the
      # same window (proof 1). deploy-machine's own patch step later
      # re-applies the identical merge patch (a no-op) before it waits.
      - name: Set machine A's deploy intent
        shell: bash
        run: |
          set -euo pipefail
          patch='{"spec":{"imageRef":{"name":"${{ steps.build-image.outputs.image-name }}"},"postHookRefs":[{"name":"${{ steps.marker.outputs.name }}"},{"name":"kezio-default-finalize"}]}}'
          kubectl patch machine "${{ env.VM_A_NAME }}" -n scaffold-system --type=merge -p "${patch}"

      - name: Set machine B's deploy intent
        shell: bash
        run: |
          set -euo pipefail
          patch='{"spec":{"imageRef":{"name":"${{ steps.build-image.outputs.image-name }}"},"postHookRefs":[{"name":"${{ steps.marker.outputs.name }}"},{"name":"kezio-default-finalize"}]}}'
          kubectl patch machine "${{ env.VM_B_NAME }}" -n scaffold-system --type=merge -p "${patch}"

      # Proof 1 (concurrency) and proof 5 (PartitionContent.status.seeders[]
      # reports one Site entry with machineCount 2) together: no existing
      # action asserts either shape, so this polls until both Machines are
      # observed mid-deploy (state != Provisioned, with a live DeployRun)
      # at the same instant that a PartitionContent the shared Image
      # references reports machineCount 2 for this Site - proving the two
      # deploys actually overlapped rather than merely both eventually
      # succeeding, and that Site-scoped demand grouping counts both
      # machines as one Site's demand.
      - name: Assert both deploys are in flight at once, with PartitionContent reporting machineCount 2
        shell: bash
        env:
          NAMESPACE: "scaffold-system"
          IMAGE_NAME: ${{ steps.build-image.outputs.image-name }}
          SITE_IDENTITY: "scaffold-system/${{ env.SITE_NAME }}"
        run: |
          set -euo pipefail
          content_names="$(kubectl get image "${IMAGE_NAME}" -n "${NAMESPACE}" -o jsonpath='{.spec.slots[*].contentRef.name}')"
          deadline=$(( $(date +%s) + 180 ))
          found=0
          while true; do
            state_a="$(kubectl get machine "${{ env.VM_A_NAME }}" -n "${NAMESPACE}" -o jsonpath='{.status.state}' || true)"
            run_a="$(kubectl get machine "${{ env.VM_A_NAME }}" -n "${NAMESPACE}" -o jsonpath='{.status.currentRunRef.name}' || true)"
            state_b="$(kubectl get machine "${{ env.VM_B_NAME }}" -n "${NAMESPACE}" -o jsonpath='{.status.state}' || true)"
            run_b="$(kubectl get machine "${{ env.VM_B_NAME }}" -n "${NAMESPACE}" -o jsonpath='{.status.currentRunRef.name}' || true)"
            machine_count=0
            for c in ${content_names}; do
              mc="$(kubectl get partitioncontent "${c}" -n "${NAMESPACE}" -o json 2>/dev/null | \
                jq -r --arg s "${SITE_IDENTITY}" '[(.status.seeders // [])[] | select(.site==$s) | .machineCount] | first // 0')"
              if [ "${mc}" = "2" ]; then
                machine_count=2
                break
              fi
            done
            echo "$(date -Is) machineA state=${state_a:-<empty>} run=${run_a:-<none>} | machineB state=${state_b:-<empty>} run=${run_b:-<none>} | PartitionContent machineCount seen=${machine_count}"
            if [ "${state_a}" != "Provisioned" ] && [ -n "${run_a}" ] && \
               [ "${state_b}" != "Provisioned" ] && [ -n "${run_b}" ] && \
               [ "${machine_count}" = "2" ]; then
              found=1
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              break
            fi
            sleep 3
          done
          if [ "${found}" -ne 1 ]; then
            echo "::error::never observed both machines mid-deploy together with PartitionContent.status.seeders[] reporting machineCount=2 for Site ${SITE_IDENTITY} within the timeout - the concurrent-deploy and per-Site-demand-grouping claims are unproven" >&2
            exit 1
          fi
          {
            echo "### Concurrent deploy evidence"
            echo "Both ${{ env.VM_A_NAME }} and ${{ env.VM_B_NAME }} were observed mid-deploy (state != Provisioned, with an active DeployRun) at the same poll instant that PartitionContent reported machineCount=2 for Site ${SITE_IDENTITY}."
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Wait for machine A to reach Provisioned
        id: deploy-a
        uses: ./.github/actions/deploy-machine
        with:
          machine-name: ${{ env.VM_A_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}
          posthook-names: |
            ${{ steps.marker.outputs.name }}
            kezio-default-finalize

      - name: Wait for machine B to reach Provisioned
        id: deploy-b
        uses: ./.github/actions/deploy-machine
        with:
          machine-name: ${{ env.VM_B_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}
          posthook-names: |
            ${{ steps.marker.outputs.name }}
            kezio-default-finalize

      # Proof 7: the same three-layer verification the single-segment
      # deploy lane uses, for both machines.
      - name: Verify machine A's deploy landed
        uses: ./.github/actions/verify-deploy
        with:
          machine-name: ${{ steps.deploy-a.outputs.machine-name }}
          namespace: ${{ steps.deploy-a.outputs.namespace }}
          deploy-run-name: ${{ steps.deploy-a.outputs.deploy-run-name }}
          pre-deploy-timestamp-ns: ${{ steps.pre-deploy.outputs.timestamp-ns }}

      - name: Verify machine B's deploy landed
        uses: ./.github/actions/verify-deploy
        with:
          machine-name: ${{ steps.deploy-b.outputs.machine-name }}
          namespace: ${{ steps.deploy-b.outputs.namespace }}
          deploy-run-name: ${{ steps.deploy-b.outputs.deploy-run-name }}
          pre-deploy-timestamp-ns: ${{ steps.pre-deploy.outputs.timestamp-ns }}

      # Proof 2: exactly one seeder Deployment for the (Image, Site) pair,
      # single-homed on segment C.
      - name: Assert the shared seeder Deployment's placement and tuning contract
        uses: ./.github/actions/assert-seeder-placement
        with:
          image-name: ${{ steps.build-image.outputs.image-name }}
          site-namespace: "scaffold-system"
          site-name: ${{ env.SITE_NAME }}
          expected-seeding-nad: "scaffold-system/kezio-seeder-network"
          expected-tracker-url: "http://${{ env.TRACKER_IP }}:6969/announce"

      # Proof 2 (explicit half): no second seeder Deployment appeared even
      # though two machines on two different Subnets demanded seeding -
      # this is the defect section 3 describes, made an explicit check
      # rather than an implication of the placement assertion above.
      - name: Assert no second seeder Deployment appeared
        shell: bash
        run: |
          set -euo pipefail
          count="$(kubectl get deployments -n scaffold-system -l app.kubernetes.io/component=image-seeder -o json | jq '.items | length')"
          echo "seeder Deployments in scaffold-system: ${count}"
          if [ "${count}" -ne 1 ]; then
            echo "::error::expected exactly 1 seeder Deployment in scaffold-system (one per (Image, Site) pair; this lane deploys one Image to one Site), found ${count}" >&2
            kubectl get deployments -n scaffold-system -l app.kubernetes.io/component=image-seeder -o wide
            exit 1
          fi

      # Proof 3: the tracker is Site-owned on segment C at its pinned
      # address, with no Service. expected-ready/valid-status are
      # Unknown, not the action's own True default: kezio-seeder-network's
      # host-local ipam is range-bounded, so CheckTrackerAddress can only
      # ever report Indeterminate for it - see Proof 6's own comment
      # below.
      - name: Assert the Site's tracker placement and status reflection
        uses: ./.github/actions/assert-tracker-placement
        with:
          site-namespace: "scaffold-system"
          site-name: ${{ env.SITE_NAME }}
          expected-seeding-nad-namespace: "scaffold-system"
          expected-seeding-nad-name: "kezio-seeder-network"
          expected-tracker-ip: ${{ env.TRACKER_IP }}
          expected-ready-status: "Unknown"
          expected-valid-status: "Unknown"

      # Reconstructs the exact torrent URL the plan handed each agent
      # (planbuild.resolveTorrentURL's own output) the same way run-leecher
      # does: no DeployRun field carries it (the plan is never persisted -
      # see agentapi.DeployPlan's own doc comment), so it is rebuilt from
      # the shared seeder's own pod IP and the Image's own content hash.
      # Both machines were handed this identical URL, since they share the
      # one seeder Deployment.
      - name: Resolve the shared seeder's torrent URL
        id: torrent
        shell: bash
        env:
          NAMESPACE: "scaffold-system"
          IMAGE_NAME: ${{ steps.build-image.outputs.image-name }}
          SITE_IDENTITY: "scaffold-system/${{ env.SITE_NAME }}"
        run: |
          set -euo pipefail
          prefix="kezio-seeder-"
          suffix="-$(printf '%s' "${SITE_IDENTITY}" | sha256sum | cut -c1-8)"
          max_name_length=63
          max_base_len=$(( max_name_length - ${#prefix} - ${#suffix} ))
          base="${IMAGE_NAME}"
          if [ "${#base}" -gt "${max_base_len}" ]; then
            base="${base:0:${max_base_len}}"
          fi
          seeder_name="${prefix}${base}${suffix}"
          selector="$(kubectl get deployment "${seeder_name}" -n "${NAMESPACE}" -o json | \
            jq -r '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")')"
          pod_ip="$(kubectl get pods -n "${NAMESPACE}" -l "${selector}" -o jsonpath='{.items[0].status.podIP}')"
          content_name="$(kubectl get image "${IMAGE_NAME}" -n "${NAMESPACE}" -o jsonpath='{.spec.slots[0].contentRef.name}')"
          info_hash="${content_name#pc-}"
          torrent_url="http://${pod_ip}:8080/torrents/${info_hash}"
          echo "seeder ${seeder_name} pod ${pod_ip}, torrent URL ${torrent_url}"
          echo "torrent-url=${torrent_url}" >>"${GITHUB_OUTPUT}"

      # Proof 4: each agent's torrent URL lies outside its own machine's
      # subnet, the served torrent announces the Site's tracker, and both
      # seeder ports answer across the segment boundary - once per
      # machine, with that machine's own CIDR/bridge.
      - name: Assert seeder L3 reachability from machine A's segment
        uses: ./.github/actions/assert-seeder-l3
        with:
          machine-cidr: ${{ env.SEG_A_CIDR }}
          torrent-url: ${{ steps.torrent.outputs.torrent-url }}
          expected-tracker-url: "http://${{ env.TRACKER_IP }}:6969/announce"
          bridge-name: ${{ env.SEG_A_BRIDGE }}
          probe-cidr: "198.51.100.250/24"
          gateway-ip: ${{ env.SEG_A_HOST_ADDR }}
          netns-name: "kezio-seeder-l3-probe-a"

      - name: Assert seeder L3 reachability from machine B's segment
        uses: ./.github/actions/assert-seeder-l3
        with:
          machine-cidr: ${{ env.SEG_B_CIDR }}
          torrent-url: ${{ steps.torrent.outputs.torrent-url }}
          expected-tracker-url: "http://${{ env.TRACKER_IP }}:6969/announce"
          bridge-name: ${{ env.SEG_B_BRIDGE }}
          probe-cidr: "198.51.101.250/24"
          gateway-ip: ${{ env.SEG_B_HOST_ADDR }}
          netns-name: "kezio-seeder-l3-probe-b"

      # Proof 6: Site status is healthy. Ready/Valid land on Unknown, not
      # True: kezio-seeder-network's host-local ipam is range-bounded
      # (create-provisioning-nads), and internal/nadvalidate does not
      # model rangeStart/rangeEnd, so CheckTrackerAddress can only ever
      # report Indeterminate for it - the same reason Subnet C's own
      # creation step above needs accept-valid-unknown and this Site's
      # Point-at-its-seeding-Subnet step needs accept-unknown. The
      # functional proofs immediately above (a real torrent served, a
      # real tracker announce reachable, both ports open across the
      # segment boundary) are what actually establishes health here;
      # this step only confirms status reports that health honestly
      # rather than downgrading to Unknown for no reason.
      - name: Assert the Site's status
        uses: ./.github/actions/assert-site-status
        with:
          site-namespace: "scaffold-system"
          site-name: ${{ env.SITE_NAME }}
          expected-subnet-refs: |
            ${{ env.SUBNET_A_NAME }}
            ${{ env.SUBNET_B_NAME }}
            ${{ env.SUBNET_C_NAME }}
          expected-seeder-ready: "true"
          expected-conditions: |
            Ready|Unknown
            Valid|Unknown

      - name: Collect site/tracker/seeder/bootd/runner-network diagnostics
        if: always()
        uses: ./.github/actions/collect-site-diagnostics
        with:
          artifact-name-prefix: routed
          namespaces: "scaffold-system"
          tracker-label-selector: "app.kubernetes.io/name=kezio,app.kubernetes.io/component=tracker"
          bridges: |
            ${{ env.SEG_A_BRIDGE }}
            ${{ env.SEG_B_BRIDGE }}
            ${{ env.SEG_C_BRIDGE }}
          extra-artifact-paths: |
            ${{ runner.temp }}/console-routed-a.log
            ${{ runner.temp }}/console-routed-b.log

  # Two Sites, one Image, deployed concurrently, that deliberately cannot
  # route to each other. Simplified shape: ONE segment per Site (boot and
  # data plane on the same Subnet), not the four-segment (boot A, boot B,
  # data C) shape section 7.2's own lane uses - that lane already proves
  # the cross-segment hop inside one Site; this lane's own job is proving
  # concurrency and cross-Site isolation, which a second cross-segment hop
  # per Site would not add anything to. create-routed-segments still gets
  # two GROUPS (one per Site), so the isolation this lane exists to prove
  # is real: the runner forwards inside each group and drops everything
  # between them.
  #
  # Heaviest lane in this workflow: two full boot-and-deploy chains, two
  # bootd pods, two seeder pods, two tracker pods, and the KubeVirt stack,
  # concurrently, on one runner. check-runner-resources below uses the
  # same floor the single-machine deploy lane needs; if a real run shows
  # this is not enough (OOM or CPU starvation rather than a genuine test
  # failure), the fix is a larger runner class for this job specifically
  # (a `runs-on` change) - never serializing the two deploys, since
  # concurrency is this lane's own reason to exist.
  #
  # What this lane does NOT claim: nothing about latency, bandwidth, WAN
  # copy counts, or cross-site leech efficiency - one runner cannot
  # produce those, and two Sites that cannot route to each other could
  # never leech across Sites regardless.
  e2e-two-site-concurrent:
    name: Two-site concurrent lane
    needs: [build-required, e2e-fast-lane, e2e-network-probes]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SEG_X_BRIDGE: kezio-2site-x
      SEG_X_CIDR: 198.51.103.0/24
      SEG_X_HOST_CIDR: 198.51.103.1/24
      SEG_X_HOST_ADDR: 198.51.103.1
      BOOTD_X_IP: 198.51.103.2
      # Bare, like the routed lane's own TRACKER_IP: the announce URL
      # baked into every torrent must be the tracker's own address on
      # this segment, with nothing rewriting it on the way.
      TRACKER_X_IP: 198.51.103.3
      SEEDER_X_NET1_IP: 198.51.103.4/24
      SEEDER_X_IP: 198.51.103.4
      LEASE_X_START: 198.51.103.10
      LEASE_X_END: 198.51.103.100
      SEG_Y_BRIDGE: kezio-2site-y
      SEG_Y_CIDR: 198.51.104.0/24
      SEG_Y_HOST_CIDR: 198.51.104.1/24
      SEG_Y_HOST_ADDR: 198.51.104.1
      BOOTD_Y_IP: 198.51.104.2
      TRACKER_Y_IP: 198.51.104.3
      SEEDER_Y_NET1_IP: 198.51.104.4/24
      SEEDER_Y_IP: 198.51.104.4
      LEASE_Y_START: 198.51.104.10
      LEASE_Y_END: 198.51.104.100
      SITE_X_NAME: kezio-2site-x-site
      SITE_Y_NAME: kezio-2site-y-site
      SUBNET_X_NAME: kezio-2site-subnet-x
      SUBNET_Y_NAME: kezio-2site-subnet-y
      SEEDER_NAD_X_NAME: kezio-seeder-network-x
      SEEDER_NAD_Y_NAME: kezio-seeder-network-y
      VM_X_NAME: kezio-2site-vm-x
      VM_Y_NAME: kezio-2site-vm-y
      VM_X_MAC: "52:54:00:be:ef:20"
      VM_Y_MAC: "52:54:00:be:ef:21"
      DISK_X_SERIAL: KEZIO2SITEDISKX01
      DISK_Y_SERIAL: KEZIO2SITEDISKY01
      BOOT_ARTIFACTS_IMG: "example.com/kezio-boot-artifacts:e2e"
    steps:
      - uses: actions/checkout@v4

      - name: Download the live boot image artifacts
        uses: actions/download-artifact@v4
        with:
          name: kezio-live-image
          path: dist/live

      - name: Fail fast if the downloaded boot artifacts are empty
        uses: ./.github/actions/assert-boot-artifacts-present

      - name: Prepare the KVM host
        uses: ./.github/actions/prepare-kvm-host

      # Same floor the single-machine deploy lane uses - see this job's
      # own top comment on the budget risk two concurrent boot-and-deploy
      # chains add on top of it.
      - name: Resource check (fail fast if the runner is under-resourced)
        uses: ./.github/actions/check-runner-resources
        with:
          min-cpus: "4"
          min-mem-mb: "15800"
          min-disk-gb: "35"
          context-label: "the two-site concurrent e2e lane"

      # Two groups, one segment each: create-routed-segments' own
      # intra-group ACCEPT pass is a no-op here (a group of one has no
      # pair to accept), but the cross-group DROP pass is exactly what
      # this lane exists to prove - Site X's segment and Site Y's segment
      # must never route to each other.
      - name: Create the two Site segments (two groups, one segment each)
        uses: ./.github/actions/create-routed-segments
        with:
          segments: |
            ${{ env.SEG_X_BRIDGE }} ${{ env.SEG_X_CIDR }} ${{ env.SEG_X_HOST_CIDR }} kezio-2site-x-group
            ${{ env.SEG_Y_BRIDGE }} ${{ env.SEG_Y_CIDR }} ${{ env.SEG_Y_HOST_CIDR }} kezio-2site-y-group

      - name: Download the manager, bootd, image-service, ingest, and seeder image tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: "image-tar-@(manager|bootd|image-service|ingest|seeder)"
          path: /tmp/images
          merge-multiple: true

      - name: Install RKE2 with Multus enabled
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: "v1.36.2+rke2r1"
          enable-multus: "true"

      # Both bridges host Multus-attached pods (bootd, tracker, and
      # seeder all share the one segment per Site), so both need canal's
      # FORWARD-chain self-bridge fixup.
      - name: Harden Site X's segment for real PXE/DHCP and Multus traffic
        uses: ./.github/actions/harden-provisioning-bridge
        with:
          bridge-name: ${{ env.SEG_X_BRIDGE }}

      - name: Harden Site Y's segment for real PXE/DHCP and Multus traffic
        uses: ./.github/actions/harden-provisioning-bridge
        with:
          bridge-name: ${{ env.SEG_Y_BRIDGE }}

      - name: Install local-path-provisioner and mark it the default StorageClass
        uses: ./.github/actions/install-local-path-provisioner
        with:
          version: "v0.0.37"

      - name: Install csi-driver-nfs and mark it the default StorageClass
        uses: ./.github/actions/install-nfs-storage

      - name: Build the boot-artifacts image
        run: make docker-build-boot-artifacts BOOT_ARTIFACTS_IMG="${{ env.BOOT_ARTIFACTS_IMG }}"

      - name: Save the boot-artifacts image to a tarball
        run: docker save "${{ env.BOOT_ARTIFACTS_IMG }}" -o /tmp/images/boot-artifacts.tar

      - name: Import the manager, bootd, boot-artifacts, image-service, ingest, and seeder images into RKE2 containerd
        uses: ./.github/actions/import-image-tarballs
        with:
          images: manager bootd boot-artifacts image-service ingest seeder

      - name: Install cert-manager, KubeVirt, virtctl, and CDI
        uses: ./.github/actions/install-cluster-addons
        with:
          kubevirt-version: "v1.9.0"
          cdi-version: "v1.65.0"

      - name: Install KubeVirtBMC
        uses: ./.github/actions/install-kubevirtbmc
        with:
          version: "v0.9.0"

      # One controller-manager for the whole lane, same as every other
      # e2e lane. BOOT_SERVER_URL/BOOT_AGENT_SERVER_URL are the
      # manager-wide fallback only: both Subnets below carry their own
      # bootdServerIP, so each Machine's kernel/initrd/squashfs and
      # kezio.server= URLs are built from its own Subnet, never this
      # fallback - see this job's own top comment. TRACKER_DEPLOYMENT_IMAGE
      # backs both Sites' tracker Deployments; each Site creates its own.
      - name: Deploy kezio CRDs and controller-manager
        uses: ./.github/actions/deploy-kezio
        with:
          manager-image: example.com/kezio:e2e
          kustomize-dir: config/netboot-e2e
          extra-env: |
            DEPLOYER=agent
            BOOT_SERVER_ADDR=:8090
            BOOT_SERVER_URL=http://${{ env.BOOTD_X_IP }}
            BOOT_AGENT_SERVER_URL=http://${{ env.BOOTD_X_IP }}
            AGENT_SERVER_ADDR=:8091
            BOOTD_DEPLOYMENT_IMAGE=example.com/kezio-bootd:e2e
            BOOTD_DEPLOYMENT_BOOT_ARTIFACTS_IMAGE=${{ env.BOOT_ARTIFACTS_IMG }}
            BOOTD_DEPLOYMENT_BOOT_UPSTREAM_URL=http://boot-server.scaffold-system.svc.cluster.local:8090
            BOOTD_DEPLOYMENT_AGENT_UPSTREAM_URL=http://agent-server.scaffold-system.svc.cluster.local:8091
            IMAGE_INGEST_STAGING_PVC=kezio-image-service-staging
            IMAGE_INGEST_IMAGE=example.com/kezio-ingest:e2e
            IMAGE_INGEST_SOURCE_FORMAT=raw
            PARTITIONCONTENT_PUBLISH_IMAGE=example.com/kezio-ingest:e2e
            PARTITIONCONTENT_SEEDER_IMAGE=example.com/kezio-seeder:e2e
            PARTITIONCONTENT_SEEDER_GRACE_PERIOD=30s
            TRACKER_DEPLOYMENT_IMAGE=ghcr.io/tunisiano187/opentracker-docker:master

      # Per-Site NADs, not create-provisioning-nads: that action's names
      # ("kezio-boot-network", "kezio-seeder-network", ...) are fixed, and
      # both Sites live in the same namespace, so calling it twice would
      # collide - the same reason the routed lane creates its own two
      # boot NADs inline instead of composing create-provisioning-nads
      # per segment. No dedicated tracker NAD either: a Site's tracker
      # single-homes on its own seeding Subnet's seederNetworkRef,
      # requesting tracker.ip as an "ips" override on that same NAD's
      # network-selection element (site_tracker_deployment.go's
      # trackerPodAnnotations), not a NAD of its own.
      - name: Create the boot and seeding NetworkAttachmentDefinitions for Site X and Site Y
        shell: bash
        env:
          NAMESPACE: "scaffold-system"
          SEG_X_BRIDGE: ${{ env.SEG_X_BRIDGE }}
          SEG_Y_BRIDGE: ${{ env.SEG_Y_BRIDGE }}
          BOOTD_X_IP: ${{ env.BOOTD_X_IP }}
          BOOTD_Y_IP: ${{ env.BOOTD_Y_IP }}
          SEEDER_X_NET1_IP: ${{ env.SEEDER_X_NET1_IP }}
          SEEDER_Y_NET1_IP: ${{ env.SEEDER_Y_NET1_IP }}
        run: |
          set -euo pipefail
          for site in x y; do
            case "${site}" in
              x) bridge="${SEG_X_BRIDGE}"; bootd_addr="${BOOTD_X_IP}/24"; seeder_addr="${SEEDER_X_NET1_IP}" ;;
              y) bridge="${SEG_Y_BRIDGE}"; bootd_addr="${BOOTD_Y_IP}/24"; seeder_addr="${SEEDER_Y_NET1_IP}" ;;
            esac
            cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network-${site}
            namespace: ${NAMESPACE}
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "name": "kezio-boot-network-${site}",
                "plugins": [
                  {
                    "type": "bridge",
                    "bridge": "${bridge}",
                    "ipam": {
                      "type": "static",
                      "addresses": [
                        {"address": "${bootd_addr}"}
                      ]
                    }
                  }
                ]
              }
          EOF
            cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network-vm-${site}
            namespace: ${NAMESPACE}
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "name": "kezio-boot-network-vm-${site}",
                "plugins": [
                  {
                    "type": "bridge",
                    "bridge": "${bridge}",
                    "ipam": {}
                  }
                ]
              }
          EOF
            cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-seeder-network-${site}
            namespace: ${NAMESPACE}
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "name": "kezio-seeder-network-${site}",
                "plugins": [
                  {
                    "type": "bridge",
                    "bridge": "${bridge}",
                    "ipam": {
                      "type": "static",
                      "addresses": [
                        {"address": "${seeder_addr}"}
                      ]
                    }
                  }
                ]
              }
          EOF
          done

      # SubnetReconciler's Valid condition checks the kezio-bootd
      # ServiceAccount already exists - apply config/bootd's RBAC before
      # either Subnet, same as every other lane.
      - name: Apply kezio-bootd's RBAC ahead of the Subnets
        run: kubectl apply -k config/bootd

      # The Subnet webhook admits spec.siteRef only against a Site that
      # already exists, and the Site/Subnet cross-reference is cyclic, so
      # both Sites are created bare first and patched once their own
      # Subnet exists (create-site's own doc comment).
      - name: Create Site X (bare)
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_X_NAME }}
          wait-for: Valid

      - name: Create Site Y (bare)
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_Y_NAME }}
          wait-for: Valid

      # One combined Subnet per Site (boot half plus seeding half) - the
      # simplified two-segment shape this job's own top comment explains.
      - name: Create Subnet X (segment X, boot and data plane)
        uses: ./.github/actions/create-subnet
        with:
          name: ${{ env.SUBNET_X_NAME }}
          cidr: ${{ env.SEG_X_CIDR }}
          bootd-server-ip: ${{ env.BOOTD_X_IP }}
          bootd-network-name: kezio-boot-network-x
          seeder-network-name: ${{ env.SEEDER_NAD_X_NAME }}
          site-ref: ${{ env.SITE_X_NAME }}
          dhcp-scenario: dhcp
          lease-range-start: ${{ env.LEASE_X_START }}
          lease-range-end: ${{ env.LEASE_X_END }}

      - name: Create Subnet Y (segment Y, boot and data plane)
        uses: ./.github/actions/create-subnet
        with:
          name: ${{ env.SUBNET_Y_NAME }}
          cidr: ${{ env.SEG_Y_CIDR }}
          bootd-server-ip: ${{ env.BOOTD_Y_IP }}
          bootd-network-name: kezio-boot-network-y
          seeder-network-name: ${{ env.SEEDER_NAD_Y_NAME }}
          site-ref: ${{ env.SITE_Y_NAME }}
          dhcp-scenario: dhcp
          lease-range-start: ${{ env.LEASE_Y_START }}
          lease-range-end: ${{ env.LEASE_Y_END }}

      # Ready needs each Site's own tracker Deployment actually Available,
      # which needs TRACKER_DEPLOYMENT_IMAGE (set on the manager above).
      - name: Point Site X at its own seeding Subnet
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_X_NAME }}
          seeder-subnet-name: ${{ env.SUBNET_X_NAME }}
          tracker-ip: ${{ env.TRACKER_X_IP }}
          wait-for: Ready

      - name: Point Site Y at its own seeding Subnet
        uses: ./.github/actions/create-site
        with:
          name: ${{ env.SITE_Y_NAME }}
          seeder-subnet-name: ${{ env.SUBNET_Y_NAME }}
          tracker-ip: ${{ env.TRACKER_Y_IP }}
          wait-for: Ready

      # Proof 1, stage one (the always-present half): both Sites' tracker
      # Deployments exist as soon as Ready above returns, well before any
      # Machine or seeder demand exists - so isolation on the tracker path
      # can be, and is, proven before either target VM is even created.
      # The seeder half of proof 1 has to wait (see stage two, below):
      # a seeder Deployment is demand-driven (internal/controller's
      # per-(Image, Site) placement), so it does not exist until a
      # Machine's deploy intent creates that demand - probing an address
      # with no pod behind it yet would read as "unreachable" regardless
      # of whether the isolation rule is doing anything, which would make
      # the positive (reachable) half of the check meaningless.
      - name: Assert Site X cannot reach Site Y's tracker, and its own tracker is reachable
        uses: ./.github/actions/assert-site-isolation
        with:
          bridge-name: ${{ env.SEG_X_BRIDGE }}
          probe-cidr: "198.51.103.250/24"
          gateway-ip: ${{ env.SEG_X_HOST_ADDR }}
          unreachable-bridge-name: ${{ env.SEG_Y_BRIDGE }}
          unreachable-endpoints: |
            ${{ env.TRACKER_Y_IP }}:6969
          reachable-endpoints: |
            ${{ env.TRACKER_X_IP }}:6969
          netns-name: "kezio-2site-isolation-x-early"

      - name: Assert Site Y cannot reach Site X's tracker, and its own tracker is reachable
        uses: ./.github/actions/assert-site-isolation
        with:
          bridge-name: ${{ env.SEG_Y_BRIDGE }}
          probe-cidr: "198.51.104.250/24"
          gateway-ip: ${{ env.SEG_Y_HOST_ADDR }}
          unreachable-bridge-name: ${{ env.SEG_X_BRIDGE }}
          unreachable-endpoints: |
            ${{ env.TRACKER_X_IP }}:6969
          reachable-endpoints: |
            ${{ env.TRACKER_Y_IP }}:6969
          netns-name: "kezio-2site-isolation-y-early"

      - name: Deploy kezio-bootd on segment X
        uses: ./.github/actions/deploy-bootd
        with:
          subnet-name: ${{ env.SUBNET_X_NAME }}
          bootd-server-ip: ${{ env.BOOTD_X_IP }}

      - name: Deploy kezio-bootd on segment Y
        uses: ./.github/actions/deploy-bootd
        with:
          subnet-name: ${{ env.SUBNET_Y_NAME }}
          bootd-server-ip: ${{ env.BOOTD_Y_IP }}

      - name: Create target VM X on segment X
        uses: ./.github/actions/create-target-vm
        with:
          vm-name: ${{ env.VM_X_NAME }}
          vm-mac: ${{ env.VM_X_MAC }}
          disk-serial: "${{ env.DISK_X_SERIAL }}"
          boot-network-name: kezio-boot-network-vm-x

      - name: Create target VM Y on segment Y
        uses: ./.github/actions/create-target-vm
        with:
          vm-name: ${{ env.VM_Y_NAME }}
          vm-mac: ${{ env.VM_Y_MAC }}
          disk-serial: "${{ env.DISK_Y_SERIAL }}"
          boot-network-name: kezio-boot-network-vm-y

      - name: Create Machine X
        uses: ./.github/actions/create-bmc-machine
        with:
          secret-name: "${{ env.VM_X_NAME }}-bmc-creds"
          machine-name: ${{ env.VM_X_NAME }}
          bmc-address: "redfish+http://${{ env.VM_X_NAME }}-virtbmc.scaffold-system.svc.cluster.local/redfish/v1/Systems/1"
          boot-mac: ${{ env.VM_X_MAC }}
          subnet-name: ${{ env.SUBNET_X_NAME }}
          target-disk-serial: "${{ env.DISK_X_SERIAL }}"

      - name: Create Machine Y
        uses: ./.github/actions/create-bmc-machine
        with:
          secret-name: "${{ env.VM_Y_NAME }}-bmc-creds"
          machine-name: ${{ env.VM_Y_NAME }}
          bmc-address: "redfish+http://${{ env.VM_Y_NAME }}-virtbmc.scaffold-system.svc.cluster.local/redfish/v1/Systems/1"
          boot-mac: ${{ env.VM_Y_MAC }}
          subnet-name: ${{ env.SUBNET_Y_NAME }}
          target-disk-serial: "${{ env.DISK_Y_SERIAL }}"

      # Both machines' BMC/Redfish endpoints are stood up back-to-back,
      # before either wait-agent-registered below, so both power on and
      # PXE-boot concurrently rather than one fully enrolling before the
      # other starts.
      - name: Provision target VM X through a real KubeVirtBMC/Redfish endpoint
        uses: ./.github/actions/provision-target-vm-via-bmc
        with:
          vm-name: ${{ env.VM_X_NAME }}
          bmc-creds-secret-name: "${{ env.VM_X_NAME }}-bmc-creds"

      - name: Provision target VM Y through a real KubeVirtBMC/Redfish endpoint
        uses: ./.github/actions/provision-target-vm-via-bmc
        with:
          vm-name: ${{ env.VM_Y_NAME }}
          bmc-creds-secret-name: "${{ env.VM_Y_NAME }}-bmc-creds"

      - name: Start continuous VM console capture (X)
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: ${{ env.VM_X_NAME }}
          logfile: ${{ runner.temp }}/console-2site-x.log

      - name: Start continuous VM console capture (Y)
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: ${{ env.VM_Y_NAME }}
          logfile: ${{ runner.temp }}/console-2site-y.log

      - name: Wait for machine X's agent to register and the Machine to become Available
        uses: ./.github/actions/wait-agent-registered
        with:
          machine-name: ${{ env.VM_X_NAME }}

      - name: Wait for machine Y's agent to register and the Machine to become Available
        uses: ./.github/actions/wait-agent-registered
        with:
          machine-name: ${{ env.VM_Y_NAME }}

      - name: Create the image-service bearer token Secret
        uses: ./.github/actions/create-image-service-token-secret
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Deploy image-service
        uses: ./.github/actions/deploy-image-service
        with:
          image-service-image: example.com/kezio-image-service:e2e
          staging-size: "2Gi"

      # Matches both Sites' tracker Deployments (app.kubernetes.io/component=tracker) -
      # kubectl wait accepts a selector matching more than one object.
      - name: Verify image-path prerequisites
        uses: ./.github/actions/verify-image-path-prerequisites
        with:
          tracker-label-selector: "app.kubernetes.io/component=tracker"

      # Built and ingested once: both machines deploy this same Image,
      # each off its own Site's own seeder Deployment.
      - name: Build and ingest the shared test image
        id: build-image
        uses: ./.github/actions/build-deploy-test-image
        with:
          token: ${{ env.IMAGE_SERVICE_TOKEN }}

      - name: Create the full-deploy marker PostHook
        id: marker
        uses: ./.github/actions/create-deploy-marker-posthook

      - name: Capture the pre-deploy timestamp
        id: pre-deploy
        run: echo "timestamp-ns=$(date -u +%s%N)" >>"${GITHUB_OUTPUT}"

      # Both machines' deploy intent is patched in back-to-back, before
      # either wait below - this is what starts both deploys inside the
      # same window (proof 4) and what creates per-Site seeder demand for
      # both Sites at once.
      - name: Set machine X's deploy intent
        shell: bash
        run: |
          set -euo pipefail
          patch='{"spec":{"imageRef":{"name":"${{ steps.build-image.outputs.image-name }}"},"postHookRefs":[{"name":"${{ steps.marker.outputs.name }}"},{"name":"kezio-default-finalize"}]}}'
          kubectl patch machine "${{ env.VM_X_NAME }}" -n scaffold-system --type=merge -p "${patch}"

      - name: Set machine Y's deploy intent
        shell: bash
        run: |
          set -euo pipefail
          patch='{"spec":{"imageRef":{"name":"${{ steps.build-image.outputs.image-name }}"},"postHookRefs":[{"name":"${{ steps.marker.outputs.name }}"},{"name":"kezio-default-finalize"}]}}'
          kubectl patch machine "${{ env.VM_Y_NAME }}" -n scaffold-system --type=merge -p "${patch}"

      # Waits for both per-(Image, Site) seeder Deployments to exist -
      # the earliest point the seeder half of isolation can be checked
      # (see the tracker-only isolation check's own comment, above).
      # Reproduces seederdeploy.Name(imageName, siteIdentity) faithfully
      # in shell, the same arithmetic assert-seeder-placement uses.
      - name: Wait for both per-Site seeder Deployments to appear
        id: wait-seeders
        shell: bash
        env:
          NAMESPACE: "scaffold-system"
          IMAGE_NAME: ${{ steps.build-image.outputs.image-name }}
          SITE_X_IDENTITY: "scaffold-system/${{ env.SITE_X_NAME }}"
          SITE_Y_IDENTITY: "scaffold-system/${{ env.SITE_Y_NAME }}"
        run: |
          set -euo pipefail
          compute_name() {
            image="$1"; site_identity="$2"
            prefix="kezio-seeder-"
            suffix="-$(printf '%s' "${site_identity}" | sha256sum | cut -c1-8)"
            max_name_length=63
            max_base_len=$(( max_name_length - ${#prefix} - ${#suffix} ))
            base="${image}"
            if [ "${#base}" -gt "${max_base_len}" ]; then
              base="${base:0:${max_base_len}}"
            fi
            echo "${prefix}${base}${suffix}"
          }
          name_x="$(compute_name "${IMAGE_NAME}" "${SITE_X_IDENTITY}")"
          name_y="$(compute_name "${IMAGE_NAME}" "${SITE_Y_IDENTITY}")"
          echo "computed seeder deployment names: X=${name_x} Y=${name_y}"
          deadline=$(( $(date +%s) + 90 ))
          while true; do
            x_exists=0
            y_exists=0
            kubectl get deployment "${name_x}" -n "${NAMESPACE}" >/dev/null 2>&1 && x_exists=1
            kubectl get deployment "${name_y}" -n "${NAMESPACE}" >/dev/null 2>&1 && y_exists=1
            echo "$(date -Is) seeder-x-exists=${x_exists} seeder-y-exists=${y_exists}"
            if [ "${x_exists}" -eq 1 ] && [ "${y_exists}" -eq 1 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::timed out waiting for both per-Site seeder Deployments (${name_x}, ${name_y}) to appear" >&2
              kubectl get deployments -n "${NAMESPACE}" -l app.kubernetes.io/component=image-seeder
              exit 1
            fi
            sleep 5
          done
          echo "seeder-x-name=${name_x}" >>"${GITHUB_OUTPUT}"
          echo "seeder-y-name=${name_y}" >>"${GITHUB_OUTPUT}"

      # Proof 1, stage two (the full guarantee): now that both seeder
      # Deployments are real, both directions are re-checked with tracker
      # AND seeder addresses together, before either deploy reaches
      # Provisioned - a leaked route fails the lane before either write
      # completes.
      - name: Assert Site X cannot reach Site Y's tracker or seeder, and its own are reachable
        uses: ./.github/actions/assert-site-isolation
        with:
          bridge-name: ${{ env.SEG_X_BRIDGE }}
          probe-cidr: "198.51.103.252/24"
          gateway-ip: ${{ env.SEG_X_HOST_ADDR }}
          unreachable-bridge-name: ${{ env.SEG_Y_BRIDGE }}
          unreachable-endpoints: |
            ${{ env.TRACKER_Y_IP }}:6969
            ${{ env.SEEDER_Y_IP }}:16881
            ${{ env.SEEDER_Y_IP }}:8080
          reachable-endpoints: |
            ${{ env.TRACKER_X_IP }}:6969
            ${{ env.SEEDER_X_IP }}:16881
            ${{ env.SEEDER_X_IP }}:8080
          netns-name: "kezio-2site-isolation-x-full"

      - name: Assert Site Y cannot reach Site X's tracker or seeder, and its own are reachable
        uses: ./.github/actions/assert-site-isolation
        with:
          bridge-name: ${{ env.SEG_Y_BRIDGE }}
          probe-cidr: "198.51.104.252/24"
          gateway-ip: ${{ env.SEG_Y_HOST_ADDR }}
          unreachable-bridge-name: ${{ env.SEG_X_BRIDGE }}
          unreachable-endpoints: |
            ${{ env.TRACKER_X_IP }}:6969
            ${{ env.SEEDER_X_IP }}:16881
            ${{ env.SEEDER_X_IP }}:8080
          reachable-endpoints: |
            ${{ env.TRACKER_Y_IP }}:6969
            ${{ env.SEEDER_Y_IP }}:16881
            ${{ env.SEEDER_Y_IP }}:8080
          netns-name: "kezio-2site-isolation-y-full"

      # Proof 4 (concurrency) and proof 5's own machine-count half
      # (PartitionContent.status.seeders[] reports two real Site entries):
      # polls until both Machines are observed mid-deploy (state !=
      # Provisioned, with a live DeployRun) at the same instant that the
      # shared Image's PartitionContent reports machineCount 1 for BOTH
      # Site X and Site Y - proving the two deploys actually overlapped,
      # each against its own Site's demand, rather than merely both
      # eventually succeeding one after the other.
      - name: Assert both deploys are in flight at once, with PartitionContent reporting one machine per Site
        shell: bash
        env:
          NAMESPACE: "scaffold-system"
          IMAGE_NAME: ${{ steps.build-image.outputs.image-name }}
          SITE_X_IDENTITY: "scaffold-system/${{ env.SITE_X_NAME }}"
          SITE_Y_IDENTITY: "scaffold-system/${{ env.SITE_Y_NAME }}"
        run: |
          set -euo pipefail
          content_names="$(kubectl get image "${IMAGE_NAME}" -n "${NAMESPACE}" -o jsonpath='{.spec.slots[*].contentRef.name}')"
          deadline=$(( $(date +%s) + 180 ))
          found=0
          while true; do
            state_x="$(kubectl get machine "${{ env.VM_X_NAME }}" -n "${NAMESPACE}" -o jsonpath='{.status.state}' || true)"
            run_x="$(kubectl get machine "${{ env.VM_X_NAME }}" -n "${NAMESPACE}" -o jsonpath='{.status.currentRunRef.name}' || true)"
            state_y="$(kubectl get machine "${{ env.VM_Y_NAME }}" -n "${NAMESPACE}" -o jsonpath='{.status.state}' || true)"
            run_y="$(kubectl get machine "${{ env.VM_Y_NAME }}" -n "${NAMESPACE}" -o jsonpath='{.status.currentRunRef.name}' || true)"
            count_x=0
            count_y=0
            for c in ${content_names}; do
              mc_x="$(kubectl get partitioncontent "${c}" -n "${NAMESPACE}" -o json 2>/dev/null | \
                jq -r --arg s "${SITE_X_IDENTITY}" '[(.status.seeders // [])[] | select(.site==$s) | .machineCount] | first // 0')"
              mc_y="$(kubectl get partitioncontent "${c}" -n "${NAMESPACE}" -o json 2>/dev/null | \
                jq -r --arg s "${SITE_Y_IDENTITY}" '[(.status.seeders // [])[] | select(.site==$s) | .machineCount] | first // 0')"
              [ "${mc_x}" = "1" ] && count_x=1
              [ "${mc_y}" = "1" ] && count_y=1
            done
            echo "$(date -Is) machineX state=${state_x:-<empty>} run=${run_x:-<none>} | machineY state=${state_y:-<empty>} run=${run_y:-<none>} | PartitionContent machineCount seen: X=${count_x} Y=${count_y}"
            if [ "${state_x}" != "Provisioned" ] && [ -n "${run_x}" ] && \
               [ "${state_y}" != "Provisioned" ] && [ -n "${run_y}" ] && \
               [ "${count_x}" = "1" ] && [ "${count_y}" = "1" ]; then
              found=1
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              break
            fi
            sleep 3
          done
          if [ "${found}" -ne 1 ]; then
            echo "::error::never observed both machines mid-deploy together with PartitionContent.status.seeders[] reporting machineCount=1 for both Site ${SITE_X_IDENTITY} and Site ${SITE_Y_IDENTITY} within the timeout - the concurrent-deploy and per-Site-isolation-of-demand claims are unproven" >&2
            exit 1
          fi
          {
            echo "### Concurrent two-site deploy evidence"
            echo "Both ${{ env.VM_X_NAME }} (Site X) and ${{ env.VM_Y_NAME }} (Site Y) were observed mid-deploy (state != Provisioned, with an active DeployRun) at the same poll instant that PartitionContent reported machineCount=1 for each Site independently."
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Wait for machine X to reach Provisioned
        id: deploy-x
        uses: ./.github/actions/deploy-machine
        with:
          machine-name: ${{ env.VM_X_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}
          posthook-names: |
            ${{ steps.marker.outputs.name }}
            kezio-default-finalize

      - name: Wait for machine Y to reach Provisioned
        id: deploy-y
        uses: ./.github/actions/deploy-machine
        with:
          machine-name: ${{ env.VM_Y_NAME }}
          image-name: ${{ steps.build-image.outputs.image-name }}
          posthook-names: |
            ${{ steps.marker.outputs.name }}
            kezio-default-finalize

      # Proof 6: the same three-layer verification the single-segment
      # deploy lane uses, for both machines.
      - name: Verify machine X's deploy landed
        uses: ./.github/actions/verify-deploy
        with:
          machine-name: ${{ steps.deploy-x.outputs.machine-name }}
          namespace: ${{ steps.deploy-x.outputs.namespace }}
          deploy-run-name: ${{ steps.deploy-x.outputs.deploy-run-name }}
          pre-deploy-timestamp-ns: ${{ steps.pre-deploy.outputs.timestamp-ns }}

      - name: Verify machine Y's deploy landed
        uses: ./.github/actions/verify-deploy
        with:
          machine-name: ${{ steps.deploy-y.outputs.machine-name }}
          namespace: ${{ steps.deploy-y.outputs.namespace }}
          deploy-run-name: ${{ steps.deploy-y.outputs.deploy-run-name }}
          pre-deploy-timestamp-ns: ${{ steps.pre-deploy.outputs.timestamp-ns }}

      # Proof 2: two seeder Deployments for the one Image, one per Site,
      # each single-homed on its own Site's seeding NAD.
      - name: Assert Site X's seeder Deployment placement and tuning contract
        uses: ./.github/actions/assert-seeder-placement
        with:
          image-name: ${{ steps.build-image.outputs.image-name }}
          site-namespace: "scaffold-system"
          site-name: ${{ env.SITE_X_NAME }}
          expected-seeding-nad: "scaffold-system/${{ env.SEEDER_NAD_X_NAME }}"
          expected-tracker-url: "http://${{ env.TRACKER_X_IP }}:6969/announce"

      - name: Assert Site Y's seeder Deployment placement and tuning contract
        uses: ./.github/actions/assert-seeder-placement
        with:
          image-name: ${{ steps.build-image.outputs.image-name }}
          site-namespace: "scaffold-system"
          site-name: ${{ env.SITE_Y_NAME }}
          expected-seeding-nad: "scaffold-system/${{ env.SEEDER_NAD_Y_NAME }}"
          expected-tracker-url: "http://${{ env.TRACKER_Y_IP }}:6969/announce"

      # Proof 2 (explicit half): exactly two seeder Deployments exist -
      # one per Site, not one shared and not more than two.
      - name: Assert exactly two seeder Deployments exist (one per Site)
        shell: bash
        run: |
          set -euo pipefail
          count="$(kubectl get deployments -n scaffold-system -l app.kubernetes.io/component=image-seeder -o json | jq '.items | length')"
          echo "seeder Deployments in scaffold-system: ${count}"
          if [ "${count}" -ne 2 ]; then
            echo "::error::expected exactly 2 seeder Deployments in scaffold-system (one per Site; this lane deploys one Image to two Sites), found ${count}" >&2
            kubectl get deployments -n scaffold-system -l app.kubernetes.io/component=image-seeder -o wide
            exit 1
          fi

      # Proof 2: each Site's tracker is Site-owned at its own pinned
      # address on its own seeding NAD, with no Service.
      - name: Assert Site X's tracker placement and status reflection
        uses: ./.github/actions/assert-tracker-placement
        with:
          site-name: ${{ env.SITE_X_NAME }}
          expected-seeding-nad-namespace: "scaffold-system"
          expected-seeding-nad-name: ${{ env.SEEDER_NAD_X_NAME }}
          expected-tracker-ip: ${{ env.TRACKER_X_IP }}

      - name: Assert Site Y's tracker placement and status reflection
        uses: ./.github/actions/assert-tracker-placement
        with:
          site-name: ${{ env.SITE_Y_NAME }}
          expected-seeding-nad-namespace: "scaffold-system"
          expected-seeding-nad-name: ${{ env.SEEDER_NAD_Y_NAME }}
          expected-tracker-ip: ${{ env.TRACKER_Y_IP }}

      # Reconstructs the exact torrent URL each machine's agent was
      # handed (planbuild.resolveTorrentURL's own output), the same way
      # the routed lane does: no DeployRun field carries it, so it is
      # rebuilt from each Site's own seeder pod IP and the shared Image's
      # own content hash.
      - name: Resolve Site X's seeder torrent URL
        id: torrent-x
        shell: bash
        env:
          NAMESPACE: "scaffold-system"
          IMAGE_NAME: ${{ steps.build-image.outputs.image-name }}
          SEEDER_NAME: ${{ steps.wait-seeders.outputs.seeder-x-name }}
        run: |
          set -euo pipefail
          selector="$(kubectl get deployment "${SEEDER_NAME}" -n "${NAMESPACE}" -o json | \
            jq -r '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")')"
          pod_ip="$(kubectl get pods -n "${NAMESPACE}" -l "${selector}" -o jsonpath='{.items[0].status.podIP}')"
          content_name="$(kubectl get image "${IMAGE_NAME}" -n "${NAMESPACE}" -o jsonpath='{.spec.slots[0].contentRef.name}')"
          info_hash="${content_name#pc-}"
          torrent_url="http://${pod_ip}:8080/torrents/${info_hash}"
          echo "seeder ${SEEDER_NAME} pod ${pod_ip}, torrent URL ${torrent_url}"
          echo "torrent-url=${torrent_url}" >>"${GITHUB_OUTPUT}"

      - name: Resolve Site Y's seeder torrent URL
        id: torrent-y
        shell: bash
        env:
          NAMESPACE: "scaffold-system"
          IMAGE_NAME: ${{ steps.build-image.outputs.image-name }}
          SEEDER_NAME: ${{ steps.wait-seeders.outputs.seeder-y-name }}
        run: |
          set -euo pipefail
          selector="$(kubectl get deployment "${SEEDER_NAME}" -n "${NAMESPACE}" -o json | \
            jq -r '.spec.selector.matchLabels | to_entries | map("\(.key)=\(.value)") | join(",")')"
          pod_ip="$(kubectl get pods -n "${NAMESPACE}" -l "${selector}" -o jsonpath='{.items[0].status.podIP}')"
          content_name="$(kubectl get image "${IMAGE_NAME}" -n "${NAMESPACE}" -o jsonpath='{.spec.slots[0].contentRef.name}')"
          info_hash="${content_name#pc-}"
          torrent_url="http://${pod_ip}:8080/torrents/${info_hash}"
          echo "seeder ${SEEDER_NAME} pod ${pod_ip}, torrent URL ${torrent_url}"
          echo "torrent-url=${torrent_url}" >>"${GITHUB_OUTPUT}"

      # Proof 3: each machine's torrent URL lies outside its own subnet,
      # the served torrent announces ITS OWN Site's tracker (never the
      # other Site's - it could not, proof 1 already showed the path does
      # not exist), and the seeder answers across the segment boundary.
      - name: Assert machine X announces only to Site X's tracker
        uses: ./.github/actions/assert-seeder-l3
        with:
          machine-cidr: ${{ env.SEG_X_CIDR }}
          torrent-url: ${{ steps.torrent-x.outputs.torrent-url }}
          expected-tracker-url: "http://${{ env.TRACKER_X_IP }}:6969/announce"
          bridge-name: ${{ env.SEG_X_BRIDGE }}
          probe-cidr: "198.51.103.253/24"
          gateway-ip: ${{ env.SEG_X_HOST_ADDR }}
          netns-name: "kezio-2site-l3-probe-x"

      - name: Assert machine Y announces only to Site Y's tracker
        uses: ./.github/actions/assert-seeder-l3
        with:
          machine-cidr: ${{ env.SEG_Y_CIDR }}
          torrent-url: ${{ steps.torrent-y.outputs.torrent-url }}
          expected-tracker-url: "http://${{ env.TRACKER_Y_IP }}:6969/announce"
          bridge-name: ${{ env.SEG_Y_BRIDGE }}
          probe-cidr: "198.51.104.253/24"
          gateway-ip: ${{ env.SEG_Y_HOST_ADDR }}
          netns-name: "kezio-2site-l3-probe-y"

      # Proof 6: both Sites are healthy before any fault is injected.
      - name: Assert Site X's status is healthy
        uses: ./.github/actions/assert-site-status
        with:
          site-name: ${{ env.SITE_X_NAME }}
          expected-subnet-refs: |
            ${{ env.SUBNET_X_NAME }}
          expected-seeder-ready: "true"
          expected-conditions: |
            Ready|True
            Valid|True

      - name: Assert Site Y's status is healthy
        uses: ./.github/actions/assert-site-status
        with:
          site-name: ${{ env.SITE_Y_NAME }}
          expected-subnet-refs: |
            ${{ env.SUBNET_Y_NAME }}
          expected-seeder-ready: "true"
          expected-conditions: |
            Ready|True
            Valid|True

      # Proof 5: a fault at Site Y must not touch Site X. Both deploys
      # already finished and were verified above, so this cannot disturb
      # either machine's already-completed provisioning - it only proves
      # that a Site's own reconciliation failure stays local to that Site.
      #
      # Chosen fault: repoint Subnet Y's own seederNetworkRef at a NAD
      # name that does not exist, not deleting the real NAD object.
      # SubnetReconciler/SiteReconciler both watch the Subnet directly, so
      # a spec change reconciles immediately and deterministically; the
      # NAD kind itself is deliberately unwatched (a foreign CRD an
      # informer might fail to start against), so deleting the NAD object
      # would depend on the manager's own, much slower periodic resync to
      # notice at all - and it would also cut off any other Subnet
      # actually using that NAD, not just this test's target. A missing
      # NAD is classified Indeterminate, not a hard failure (a NAD is
      # foreign-CRD state kezio cannot fully trust to be absent forever),
      # so both Subnet Y and Site Y report Valid=Unknown with
      # reason SeederNADNotFound - never False - and the same patch,
      # reverted, is what proves recovery below.
      - name: Inject a fault at Site Y - point its seeding Subnet at a nonexistent NAD
        shell: bash
        run: |
          set -euo pipefail
          kubectl patch subnet "${{ env.SUBNET_Y_NAME }}" -n scaffold-system --type=merge \
            -p '{"spec":{"seederNetworkRef":{"name":"kezio-seeder-network-y-does-not-exist"}}}'

      - name: Wait for the fault to reconcile onto Site Y's status
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 60 ))
          while true; do
            reason="$(kubectl get site "${{ env.SITE_Y_NAME }}" -n scaffold-system \
              -o jsonpath='{.status.conditions[?(@.type=="Valid")].reason}' || true)"
            echo "$(date -Is) Site Y Valid.reason=${reason:-<empty>}"
            [ "${reason}" = "SeederNADNotFound" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Site Y's Valid condition never reported SeederNADNotFound after the fault" >&2
              kubectl get site "${{ env.SITE_Y_NAME }}" -n scaffold-system -o yaml
              exit 1
            fi
            sleep 3
          done

      - name: Assert Site Y degrades from the injected fault
        uses: ./.github/actions/assert-site-status
        with:
          site-name: ${{ env.SITE_Y_NAME }}
          expected-conditions: |
            Valid|Unknown|SeederNADNotFound
            Ready|Unknown

      - name: Assert Site X's status is unaffected by Site Y's fault
        uses: ./.github/actions/assert-site-status
        with:
          site-name: ${{ env.SITE_X_NAME }}
          expected-subnet-refs: |
            ${{ env.SUBNET_X_NAME }}
          expected-seeder-ready: "true"
          expected-conditions: |
            Ready|True
            Valid|True

      - name: Revert the fault at Site Y
        shell: bash
        run: |
          set -euo pipefail
          kubectl patch subnet "${{ env.SUBNET_Y_NAME }}" -n scaffold-system --type=merge \
            -p '{"spec":{"seederNetworkRef":{"name":"${{ env.SEEDER_NAD_Y_NAME }}"}}}'

      - name: Wait for Site Y to recover
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 60 ))
          while true; do
            status="$(kubectl get site "${{ env.SITE_Y_NAME }}" -n scaffold-system \
              -o jsonpath='{.status.conditions[?(@.type=="Valid")].status}' || true)"
            echo "$(date -Is) Site Y Valid=${status:-<empty>}"
            [ "${status}" = "True" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Site Y did not recover to Valid=True after reverting the fault" >&2
              kubectl get site "${{ env.SITE_Y_NAME }}" -n scaffold-system -o yaml
              exit 1
            fi
            sleep 3
          done

      - name: Collect site/tracker/seeder/bootd/runner-network diagnostics
        if: always()
        uses: ./.github/actions/collect-site-diagnostics
        with:
          artifact-name-prefix: two-site
          namespaces: "scaffold-system"
          tracker-label-selector: "app.kubernetes.io/name=kezio,app.kubernetes.io/component=tracker"
          bridges: |
            ${{ env.SEG_X_BRIDGE }}
            ${{ env.SEG_Y_BRIDGE }}
          extra-artifact-paths: |
            ${{ runner.temp }}/console-2site-x.log
            ${{ runner.temp }}/console-2site-y.log

  # Stable required-check names for the branch ruleset. The real jobs
  # hang off these through `needs`; the ruleset references "Build" and
  # "E2E" so the graph can grow without ruleset edits.
  build-required:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - images
      - boot-artifacts
    steps:
      - name: All build outputs passed
        run: |
          [ "${{ needs.images.result }}" = "success" ] && \
            [ "${{ needs.boot-artifacts.result }}" = "success" ]

  e2e-required:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - e2e-network-probes
      - e2e-fast-lane
      - e2e-image-path
      - e2e-deploy
      - e2e-routed-site
      - e2e-two-site-concurrent
    steps:
      - name: All e2e lanes passed
        run: |
          [ "${{ needs.e2e-network-probes.result }}" = "success" ] && \
            [ "${{ needs.e2e-fast-lane.result }}" = "success" ] && \
            [ "${{ needs.e2e-image-path.result }}" = "success" ] && \
            [ "${{ needs.e2e-deploy.result }}" = "success" ] && \
            [ "${{ needs.e2e-routed-site.result }}" = "success" ] && \
            [ "${{ needs.e2e-two-site-concurrent.result }}" = "success" ]
