name: Publish Images

# Builds and pushes the four kezio images to ghcr.io/tjjh89017 on every
# push to main (moving "latest" tag) and on every "v*" tag (semver
# tags). This is additive to test-e2e.yml, which builds the manager
# image locally and imports it into a k3s node with `k3s ctr images
# import` - that flow never pulls from a registry, so it is unaffected
# by whatever this workflow pushes or how long it takes to push it.
#
# Image <-> Dockerfile mapping (must stay in sync with the per-binary
# docker-build-* targets in the Makefile):
#   kezio                <- Dockerfile               (controller manager)
#   kezio-image-service  <- Dockerfile.image-service
#   kezio-ingest         <- Dockerfile.ingest
#   kezio-seeder         <- Dockerfile.seeder
#
# Architecture: manager, image-service and ingest cross-compile their Go
# binary (BUILDPLATFORM/TARGETPLATFORM) and only need apt-get to install
# a handful of prebuilt runtime packages, so they build fine under QEMU
# emulation for both amd64 and arm64. The seeder image instead compiles
# ezio's C++ stack (libtorrent-rasterbar, boost, grpc) from source with
# cmake; doing that under QEMU emulation is very slow. Seeder therefore
# builds amd64-only for now - TODO: add an arm64 leg once either a
# native arm64 runner is available or the emulated build time has been
# measured and judged acceptable.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Supersede an in-flight publish for the same ref when a newer commit or
# tag push comes in, so rapid pushes don't race to push the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tjjh89017

jobs:
  build-and-push:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            image: kezio
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: image-service
            image: kezio-image-service
            dockerfile: Dockerfile.image-service
            platforms: linux/amd64,linux/arm64
          - name: ingest
            image: kezio-ingest
            dockerfile: Dockerfile.ingest
            platforms: linux/amd64,linux/arm64
          - name: seeder
            image: kezio-seeder
            dockerfile: Dockerfile.seeder
            # amd64-only: see the architecture note above the `on:` block.
            platforms: linux/amd64
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
