name: Build Live Boot Image

# Builds the kezio live boot image (kernel + initrd + squashfs) plus the
# signed shimx64.efi/grubx64.efi kezio-bootd serves over TFTP, with
# hack/live-image/build.sh. Not on every push: `lb build` compiles ezio
# from source and assembles a Debian sid squashfs, which takes many
# minutes, and the resulting artifacts are large (the squashfs alone
# targets 100-300 MiB) - unlike the Go binaries test.yml and lint.yml
# check on every push, this is deliberately opt-in: workflow_dispatch
# for an on-demand build, and "v*" tags so a release carries a matching
# image without anyone having to remember to trigger one by hand.
#
# Publishing targets: BOTH a GitHub Release (human download - a plain
# HTTPS URL, `gh release`'s own end-to-end tooling, GitHub's size/
# bandwidth handling for this shape of content) AND a
# ghcr.io/tjjh89017/kezio-boot-artifacts OCI image (runtime consumption -
# config/bootserver's and config/bootd's fetch-boot-artifacts
# initContainers `cp` these same files out of that image instead of
# curling a release asset at every pod start/restart). The two used to be
# one and the same: a release asset was also this project's only runtime
# fetch source, which meant every fetch-boot-artifacts initContainer
# depended on GitHub's release-asset HTTPS path staying reachable and
# correctly redirect-followed from inside a cluster, on every pod
# (re)start - the actual cause of four separate e2e-gate failures (a
# non-numeric image USER restricted PSA could not verify, an emptyDir
# permission gap, a 404 against a release that did not exist yet, and an
# unfollowed 302 redirect). An OCI image fixes all four at once: the
# kubelet's own image cache serves every restart with no repeated
# download, a numeric-uid image satisfies restricted PSA outright (see
# docker/boot-artifacts/Dockerfile), and a missing/failed pull surfaces
# as an ordinary ImagePullBackOff instead of a curl exit code five layers
# removed from the actual cause. The GitHub Release stays for human
# download - this only replaces the runtime path.
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release tag to build for. Only consulted when "publish" below
          is also true; a plain build+package dry run ignores it.
        required: false
        type: string
      publish:
        description: >-
          Also create/update a GitHub Release named "version" and upload
          the artifacts to it. Leave false to validate the build and
          packaging steps only, without publishing anything - cutting a
          real release is a maintainer action taken by pushing a "v*"
          tag, not something to flip on a whim.
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # `lb build` compiles ezio from source (cmake/make, the same as
    # docker/seeder/Dockerfile's builder stage) and then assembles a full
    # Debian sid chroot into a squashfs - budget generously.
    timeout-minutes: 90
    # contents: write is only exercised by the "Publish GitHub Release"
    # step below, and packages: write only by "Push kezio-boot-artifacts
    # to ghcr" - both gated on the same `if:` (a "v*" tag push, or an
    # explicit workflow_dispatch publish=true) - every other step in this
    # job only ever reads.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Build live image
        # ubuntu-latest's Docker already runs privileged containers -
        # hack/live-image/build.sh needs that for `lb build`'s own
        # chroot/mount work; see the script's header for why.
        run: hack/live-image/build.sh

      - name: Write size summary
        run: |
          {
            echo "## Live boot image artifacts"
            echo
            echo "Target squashfs size: 100-300 MiB."
            echo
            echo "| artifact | size |"
            echo "| --- | --- |"
            for f in dist/live/vmlinuz dist/live/initrd.img dist/live/filesystem.squashfs dist/live/shimx64.efi dist/live/grubx64.efi; do
              name="$(basename "${f}")"
              size_bytes="$(stat -c%s "${f}")"
              size_mib="$(awk -v b="${size_bytes}" 'BEGIN { printf "%.1f", b / 1048576 }')"
              echo "| ${name} | ${size_mib} MiB |"
            done
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload workflow artifacts
        # Ephemeral, retention-limited GitHub Actions artifact - kept as
        # a quick way to inspect a workflow_dispatch build's output
        # in-place without publishing anything. The durable, easy-to-
        # consume copies are the GitHub Release asset set and the
        # kezio-boot-artifacts ghcr image, both published below; every
        # runtime consumer (config/bootserver's and config/bootd's
        # fetch-boot-artifacts initContainers) pulls the image, never
        # this ephemeral copy.
        uses: actions/upload-artifact@v7
        with:
          name: kezio-live-image
          path: |
            dist/live/vmlinuz
            dist/live/initrd.img
            dist/live/filesystem.squashfs
            dist/live/shimx64.efi
            dist/live/grubx64.efi
            dist/live/manifest.json
            dist/live/sha256sums
          if-no-files-found: error

      - name: Publish GitHub Release
        # Gated on either a real "v*" tag push, or an explicit
        # workflow_dispatch with publish=true - never a bare
        # workflow_dispatch (publish defaults false), so an on-demand
        # build-only run never creates a release as a side effect. When
        # dispatched with publish=true, "version" names the tag to
        # create/update; `gh release create` creates that tag pointing
        # at the dispatched ref if it does not already exist, so this
        # path also covers cutting a release from a non-tag ref
        # deliberately, not only re-running a tag push.
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
            if [ -z "${tag}" ]; then
              echo "::error::publish=true needs a non-empty 'version' input to name the release tag." >&2
              exit 1
            fi
          else
            tag="${{ github.ref_name }}"
          fi
          echo "Publishing boot artifacts to release ${tag}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; uploading assets to it."
          else
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" --target "${GITHUB_SHA}" --generate-notes
          fi
          gh release upload "${tag}" --repo "${GITHUB_REPOSITORY}" --clobber \
            dist/live/vmlinuz \
            dist/live/initrd.img \
            dist/live/filesystem.squashfs \
            dist/live/shimx64.efi \
            dist/live/grubx64.efi \
            dist/live/manifest.json \
            dist/live/sha256sums
          # Shared with "Push kezio-boot-artifacts to ghcr" below - same
          # tag names both the release and the image, so a caller can
          # correlate the two (and a boot_artifacts_image input
          # downstream that names this tag explicitly, instead of
          # "latest", still points at the matching release).
          echo "RELEASE_TAG=${tag}" >>"${GITHUB_ENV}"

      - name: Set up Docker Buildx
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push kezio-boot-artifacts to ghcr
        # Same gate as "Publish GitHub Release" above, for the same
        # reason: an on-demand build-only dispatch (publish=false)
        # validates the build and packaging without publishing anything,
        # on either channel. Tagged both with the release tag itself
        # (so a caller can pin an exact boot-artifacts version the same
        # way it could pin a release tag before) and "latest" (the
        # default every fetch-boot-artifacts initContainer pulls,
        # replacing GitHub's own "releases/latest/download" alias).
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/boot-artifacts/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tjjh89017/kezio-boot-artifacts:${{ env.RELEASE_TAG }}
            ghcr.io/tjjh89017/kezio-boot-artifacts:latest
