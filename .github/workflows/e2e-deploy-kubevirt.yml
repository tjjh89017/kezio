name: E2E Full Deploy (KubeVirt VM)

# Thin workflow_dispatch caller for the reusable BT-transfer/full-deploy
# scenario in e2e-kubevirt-reusable.yml (see that file's own header
# comment for what the job actually does and proves). This file exists
# so the trigger, gating, and inputs kezio's own maintainers use stay
# exactly what they were before the scenario was extracted into a
# reusable workflow - only the job body moved, not this file's behavior.
#
# workflow_dispatch only, for the same reasons the reusable workflow's
# own e2e-boot-path-kubevirt.yml sibling gives (PXE over a Multus bridge
# in a nested KubeVirt VM is a real risk surface a
# flaky-gate-trains-reviewers-to-ignore-red-checks argument applies to),
# plus one more: this job needs a published kezio-boot-artifacts image to
# exist (same dependency as e2e-boot-path-kubevirt.yml - see
# boot_artifacts_image's description below) before it can even reach a
# live boot, so it cannot be relied on to pass until a maintainer has cut
# one - or dispatch with build_boot_artifacts=true to build it here
# instead. Trigger it by hand before a release, after touching
# internal/deployer, internal/agent/deploy, or the live-image build, or
# when deliberately validating the full deploy flow end to end.
on:
  workflow_dispatch:
    inputs:
      boot_artifacts_image:
        description: >-
          kezio-boot-artifacts OCI image to boot (see .github/workflows/
          build-live-image.yml). Ignored when build_boot_artifacts is
          true. Defaults to the published "latest" tag.
        required: false
        type: string
        default: "ghcr.io/tjjh89017/kezio-boot-artifacts:latest"
      build_boot_artifacts:
        description: >-
          Build the live boot image (including kezio-agent) from this
          checkout instead of pulling boot_artifacts_image - the way to
          exercise an internal/agent or cmd/agent change under test.
          Slower; see e2e-kubevirt-reusable.yml's own input description.
        required: false
        type: boolean
        default: false

jobs:
  deploy-kubevirt:
    name: Deploy an Image onto a KubeVirt VM through the real agent chain and verify it booted
    uses: ./.github/workflows/e2e-kubevirt-reusable.yml
    permissions:
      contents: read
    with:
      boot_artifacts_image: ${{ inputs.boot_artifacts_image }}
      build_boot_artifacts: ${{ inputs.build_boot_artifacts }}
      # ezio_ref and the image-tag inputs are left at the reusable
      # workflow's own defaults, which are kezio's current values -
      # kezio's own dispatch trigger needs no overrides.
