name: Probe - boot-artifacts staging

# Answers, in minutes instead of the 30-90 the real KubeVirt lanes take,
# whether the fetch-boot-artifacts plumbing itself works: the Dockerfile,
# the numeric-UID/restricted-PSA contract, `cp -a` into the shared
# emptyDir, the containerd import, and `kubectl set image` - every layer
# a stale or missing kezio-boot-artifacts image could be blamed on. It
# uses FAKE artifacts (see .github/actions/write-fake-boot-artifacts) so
# it never pays hack/live-image/build.sh's ~90 minute cost; what is under
# test here is the plumbing around the artifacts, not their content.
#
# Root cause of the fetch-boot-artifacts ImagePullBackOff this probe was
# built to chase: config/*/boot-artifacts-init-patch.yaml's JSON Patch
# admits the initContainer with the placeholder tag
# "kezio-boot-artifacts:latest", and Kubernetes defaults
# imagePullPolicy from the image tag exactly once, at that admission -
# "latest" defaults to Always. The later `kubectl set image` this
# workflow (and every real KubeVirt lane) uses to repoint the container
# at the real, per-run tag only ever touches .image, never
# re-triggering that default, so the container keeps polling Always
# forever against a tag the registry "example.com" was never going to
# serve, even with the image already imported into containerd (measured
# directly: `ctr images ls`/`images check` showed it complete in the
# content store while the kubelet event stream still logged "not
# found" pull attempts). Fixed by setting imagePullPolicy: IfNotPresent
# explicitly in both patch files instead of leaving it to that
# one-shot default.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same pin as test-e2e.yml's always-on lanes - this probe must measure
  # the plumbing against the same RKE2 this project already trusts, not
  # a different version that happens to behave differently.
  RKE2_VERSION: "v1.36.2+rke2r1"
  # Same pin the KubeVirt lanes carry in their own env block (see
  # e2e-boot-path-kubevirt.yml, e2e-kubevirt-reusable.yml,
  # e2e-scale-multisite-kubevirt.yml) - keeping the name and value
  # identical here, rather than a locally-invented default, is what
  # lets a future single source of truth replace all four at once.
  CERT_MANAGER_VERSION: "v1.21.1"
  MANAGER_IMG: "example.com/kezio:probe-boot-artifacts"
  BOOT_ARTIFACTS_IMG: "example.com/kezio-boot-artifacts:probe-boot-artifacts"

jobs:
  boot-artifacts-staging:
    name: Stage fake boot artifacts and verify the fetch-boot-artifacts initContainer
    runs-on: ubuntu-latest
    # This is meant to be fast: no `lb build`, no from-source seeder
    # compile, no KubeVirt/CDI - just one RKE2 boot, cert-manager, and
    # two small `docker build`/`docker save` cycles.
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Write the RKE2 config (must exist before the service starts)
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/rancher/rke2
          cat <<'EOF' | sudo tee /etc/rancher/rke2/config.yaml
          write-kubeconfig-mode: "0644"
          cni: canal
          EOF

      - name: Install RKE2
        run: |
          set -euo pipefail
          curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${RKE2_VERSION}" sh -
          sudo systemctl enable --now rke2-server.service

          sudo ln -sf /var/lib/rancher/rke2/bin/kubectl /usr/local/bin/kubectl
          sudo ln -sf /var/lib/rancher/rke2/bin/ctr /usr/local/bin/ctr
          sudo ln -sf /var/lib/rancher/rke2/bin/crictl /usr/local/bin/crictl

          echo "KUBECONFIG=/etc/rancher/rke2/rke2.yaml" >> "$GITHUB_ENV"
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          for _ in $(seq 1 90); do
            [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ] && break
            sleep 2
          done
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl get nodes -o wide

      - name: Install cert-manager
        # Required the same way test-e2e.yml's lanes need it: every
        # kezio CRD carries a webhook, and the controller-manager cannot
        # serve admission requests until cert-manager has minted its
        # serving certificate.
        run: |
          set -euo pipefail
          kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          for d in cert-manager cert-manager-webhook cert-manager-cainjector; do
            kubectl wait deployment.apps/"${d}" --for condition=Available --namespace cert-manager --timeout=180s
          done

      - name: Write fake boot artifacts
        uses: ./.github/actions/write-fake-boot-artifacts
        with:
          agent-commit: ${{ github.sha }}

      - name: Build the manager and boot-artifacts images
        run: |
          set -euo pipefail
          go mod tidy
          make docker-build IMG="${MANAGER_IMG}"
          make docker-build-boot-artifacts BOOT_ARTIFACTS_IMG="${BOOT_ARTIFACTS_IMG}"

      - name: Import images into RKE2 containerd
        # Exactly the command real lanes use (see e2e-boot-path-kubevirt.yml's
        # "Build and import the ... image" steps): RKE2's containerd
        # socket is still under /run/k3s/containerd (a leftover of RKE2's
        # k3s lineage), and plain "ctr" needs both -a and -n spelled out.
        run: |
          set -euo pipefail
          for img in "${MANAGER_IMG}" "${BOOT_ARTIFACTS_IMG}"; do
            docker save "${img}" | sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import -
          done
          echo "::group::Images now known to containerd"
          sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images ls | grep -E 'kezio(-boot-artifacts)?:probe-boot-artifacts' || true
          echo "::endgroup::"

      - name: Inspect both imported images side by side
        # Confirms the images actually land in containerd's content
        # store, in the same complete, single-platform OCI manifest
        # form, before any Deployment ever asks for either - crictl
        # needs RKE2's own socket spelled out explicitly, the same as
        # ctr above, or it falls back to the standalone
        # /run/containerd/containerd.sock Docker's own engine owns,
        # which has no CRI image service registered.
        run: |
          set +e
          echo "===== ctr images check (manifest completeness), manager and boot-artifacts ====="
          sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images check | grep -E 'kezio(-boot-artifacts)?:probe-boot-artifacts'
          echo "===== crictl images, manager ====="
          sudo crictl -r unix:///run/k3s/containerd/containerd.sock -i unix:///run/k3s/containerd/containerd.sock inspecti "${MANAGER_IMG}"
          echo "===== crictl images, boot-artifacts ====="
          sudo crictl -r unix:///run/k3s/containerd/containerd.sock -i unix:///run/k3s/containerd/containerd.sock inspecti "${BOOT_ARTIFACTS_IMG}"
          true

      - name: Deploy and wire the fetch-boot-artifacts initContainer
        uses: ./.github/actions/deploy-boot-path-overlay
        with:
          manager-img: ${{ env.MANAGER_IMG }}
          boot-artifacts-img: ${{ env.BOOT_ARTIFACTS_IMG }}

      - name: Record the result
        if: always()
        run: |
          {
            echo "## Boot-artifacts staging probe"
            echo "- expected outcome: deployment/kezio-controller-manager becomes Ready with the fetched boot artifacts present"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "===== nodes ====="
          kubectl get nodes -o wide
          echo "===== kezio-system pods ====="
          kubectl get pods -n kezio-system -o wide
          echo "===== controller-manager describe ====="
          kubectl -n kezio-system describe deployment/kezio-controller-manager
          echo "===== controller-manager logs ====="
          kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=500
          echo "===== events ====="
          kubectl get events -n kezio-system --sort-by=.lastTimestamp
          echo "===== containerd images ====="
          sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images ls || true
