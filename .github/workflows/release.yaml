name: Release

# Publishes every kezio image and the boot artifacts on a "v*" tag, and the
# GitHub Release that ships alongside them. Never touches main.yaml's
# ":main" ghcr tag. A tag is cut from a commit on main, which lint/test/e2e
# already gated before it merged - re-running the full suite here would
# double the cost for no new signal, so this workflow goes straight to
# publishing.
#
# The GitHub Release is created as a draft before any image builds, and
# only flipped to published once every image/artifact job below has
# succeeded - so a failed build leaves a draft behind instead of a
# published Release with missing images.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tjjh89017

jobs:
  # Runs first so every other job can depend on it. Idempotent on re-run:
  # a re-pushed tag (or a re-run of this workflow) must not fail just
  # because the draft it made last time is still there.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the draft release if it does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as-is."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME"
          fi

  # Matrix and steps mirror main.yaml's images job: same composite action
  # (push-image-to-ghcr), same Dockerfile/platform per component - only the
  # tag spec and the unconditional push differ, both of which stay on the
  # calling workflow by push-image-to-ghcr's own design.
  images:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            image: kezio
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: ingest
            image: kezio-ingest
            dockerfile: docker/ingest/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: seeder
            image: kezio-seeder
            dockerfile: docker/seeder/Dockerfile
            # amd64-only: ezio's C++ build is too slow under QEMU emulation.
            platforms: linux/amd64
          - name: image-service
            image: kezio-image-service
            dockerfile: docker/image-service/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: bootd
            image: kezio-bootd
            dockerfile: docker/bootd/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Push to ghcr.io
        uses: ./.github/actions/push-image-to-ghcr
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          # The tag pushed to ghcr.io is the git tag verbatim (with its
          # leading "v"), not a semver-derived rewrite - v0.3.2 stays
          # v0.3.2 on ghcr.io.
          tags-spec: |
            type=raw,value=${{ github.ref_name }}
          dockerfile: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          cache-scope: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Same build-live-image/assert-boot-artifacts-present composite actions
  # main.yaml's boot-artifacts job uses, plus push-image-to-ghcr (shared
  # with the images job above) to publish the packaged artifacts as the
  # kezio-boot-artifacts image config/components/boot-artifacts and
  # BOOTD_DEPLOYMENT_BOOT_ARTIFACTS_IMAGE both pull by tag - the only
  # form the deploy path actually consumes; there is no release-asset
  # consumer anywhere in the deploy path.
  boot-artifacts:
    name: Boot artifacts
    needs: create-release
    runs-on: ubuntu-latest
    # `lb build` compiles ezio from source and assembles a full Debian sid
    # chroot into a squashfs - budget generously.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build the live boot image
        uses: ./.github/actions/build-live-image

      - name: Fail fast if the built boot artifacts are empty
        uses: ./.github/actions/assert-boot-artifacts-present

      - uses: docker/setup-buildx-action@v4

      - name: Push to ghcr.io
        uses: ./.github/actions/push-image-to-ghcr
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kezio-boot-artifacts
          tags-spec: |
            type=raw,value=${{ github.ref_name }}
          dockerfile: docker/boot-artifacts/Dockerfile
          platforms: linux/amd64
          cache-scope: boot-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Cross-compiles the kezioctl CLI for every platform the release ships a
  # binary for. Each leg uploads its own workflow artifact rather than a
  # release asset directly - publish-release below downloads them all and
  # does the actual `gh release upload`, the same needs-graph hand-off
  # images/boot-artifacts use, so a build failure here leaves the draft
  # release with no kezioctl binaries instead of a half-uploaded set.
  kezioctl:
    name: kezioctl (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # The binary name carries no ".exe" of its own - main.go builds the
      # same way on every GOOS, so only the packaging step below needs to
      # know windows is different.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "kezioctl-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/kezioctl

      # zip for windows (the platform's native archive format, and the one
      # a Windows user can open with no extra tool); tar.gz for the rest.
      - name: Package
        run: |
          base="kezioctl-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv "${base}" "${base}.exe"
            zip "${base}.zip" "${base}.exe"
            echo "ARCHIVE=${base}.zip" >> "$GITHUB_ENV"
          else
            chmod +x "${base}"
            tar -czf "${base}.tar.gz" "${base}"
            echo "ARCHIVE=${base}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: kezioctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1
          if-no-files-found: error

  # Runs only once every image has actually published, then flips the
  # draft from create-release to a published Release - so a build failure
  # anywhere above leaves the draft in place instead of a Release that
  # claims images it never pushed.
  publish-release:
    name: Publish release
    needs: [create-release, images, boot-artifacts, kezioctl]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Point the installer manifest at this tag's manager image and build it
        run: |
          make kustomize
          (cd config/manager && ../../bin/kustomize edit set image "controller=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kezio:${{ github.ref_name }}")
          make build-installer

      - name: Download the kezioctl archives
        uses: actions/download-artifact@v8
        with:
          pattern: "kezioctl-*"
          path: kezioctl-dist
          merge-multiple: true

      # One checksums file over every archive, computed here rather than
      # per-matrix-leg above: sha256sum's own relative-path output is only
      # meaningful once every archive sits in the same directory.
      - name: Compute the combined SHA256SUMS
        working-directory: kezioctl-dist
        run: sha256sum kezioctl-* > kezioctl-SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/install.yaml kezioctl-dist/kezioctl-* --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
