name: Release

# Publishes images and boot artifacts on a "v*" tag. Never touches
# main.yaml's ":main" ghcr tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tjjh89017

jobs:
  images:
    # Matrix mirrors main.yaml's images job exactly.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            image: kezio
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: manager-ipmi
            image: kezio-ipmi
            dockerfile: docker/manager-ipmi/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: image-service
            image: kezio-image-service
            dockerfile: docker/image-service/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: ingest
            image: kezio-ingest
            dockerfile: docker/ingest/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: seeder
            image: kezio-seeder
            dockerfile: docker/seeder/Dockerfile
            # amd64-only: ezio's C++ build is too slow under QEMU emulation.
            platforms: linux/amd64
          - name: bootd
            image: kezio-bootd
            dockerfile: docker/bootd/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  boot-artifacts:
    name: Boot artifacts
    runs-on: ubuntu-latest
    # `lb build` compiles ezio from source and assembles a full Debian
    # sid chroot into a squashfs - budget generously.
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Build live image
        run: hack/live-image/build.sh

      - name: Write size summary
        run: |
          {
            echo "## Live boot image artifacts"
            echo
            echo "Target squashfs size: 100-300 MiB."
            echo
            echo "| artifact | size |"
            echo "| --- | --- |"
            for f in dist/live/vmlinuz dist/live/initrd.img dist/live/filesystem.squashfs dist/live/shimx64.efi dist/live/grubx64.efi; do
              name="$(basename "${f}")"
              size_bytes="$(stat -c%s "${f}")"
              size_mib="$(awk -v b="${size_bytes}" 'BEGIN { printf "%.1f", b / 1048576 }')"
              echo "| ${name} | ${size_mib} MiB |"
            done
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Create draft GitHub Release
        # Draft-first: a re-run for the same tag resumes instead of
        # erroring on "already exists"; published only once assets land.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; uploading assets to it."
          else
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" --target "${GITHUB_SHA}" --generate-notes --draft
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --clobber \
            dist/live/vmlinuz \
            dist/live/initrd.img \
            dist/live/filesystem.squashfs \
            dist/live/shimx64.efi \
            dist/live/grubx64.efi \
            dist/live/manifest.json \
            dist/live/sha256sums

      - name: Publish GitHub Release
        # Barrier: flips draft=false only after every asset uploaded.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ github.ref_name }}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push kezio-boot-artifacts to ghcr
        # "latest" is the default every fetch-boot-artifacts initContainer pulls.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/boot-artifacts/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tjjh89017/kezio-boot-artifacts:${{ github.ref_name }}
            ghcr.io/tjjh89017/kezio-boot-artifacts:latest
