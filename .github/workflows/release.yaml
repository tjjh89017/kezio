name: Release

# Publishes images and boot artifacts on a "v*" tag. Never touches
# main.yaml's ":main" ghcr tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tjjh89017

jobs:
  images:
    # Matrix mirrors main.yaml's images job exactly.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manager
            image: kezio
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: manager-ipmi
            image: kezio-ipmi
            dockerfile: docker/manager-ipmi/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: image-service
            image: kezio-image-service
            dockerfile: docker/image-service/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: ingest
            image: kezio-ingest
            dockerfile: docker/ingest/Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: seeder
            image: kezio-seeder
            dockerfile: docker/seeder/Dockerfile
            # amd64-only: ezio's C++ build is too slow under QEMU emulation.
            platforms: linux/amd64
          - name: bootd
            image: kezio-bootd
            dockerfile: docker/bootd/Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push to ghcr.io
        uses: ./.github/actions/push-image-to-ghcr
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags-spec: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          dockerfile: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          cache-scope: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  boot-artifacts:
    name: Boot artifacts
    runs-on: ubuntu-latest
    # `lb build` compiles ezio from source and assembles a full Debian
    # sid chroot into a squashfs - budget generously.
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Build the live boot image
        uses: ./.github/actions/build-live-image

      - name: Publish the GitHub Release
        uses: ./.github/actions/publish-github-release
        with:
          tag: ${{ github.ref_name }}
          target-sha: ${{ github.sha }}
          github-token: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        # Same tag spec as the images job, so every kezio image carries the
        # same version tag. semver strips the "v": tag v1.2.3 pushes 1.2.3.
        # metadata-action's default "latest=auto" adds the "latest" tag every
        # fetch-boot-artifacts initContainer pulls.
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/kezio-boot-artifacts
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Push kezio-boot-artifacts to ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/boot-artifacts/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
