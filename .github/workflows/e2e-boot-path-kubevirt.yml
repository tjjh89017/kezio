name: E2E Boot Path (KubeVirt VM)

# Drives a real UEFI-native-PXE boot of a KubeVirt VirtualMachine through
# kezio-bootd's proxyDHCP/TFTP responder, the boot config server, and a
# real kezio-agent inside the live boot image - the full flow
# test-e2e.yml's "boot-path" job only simulates with a plain HTTP client
# (see that job's own doc comment and test/e2e/e2e_boot_path_test.go).
# This asserts nothing more than that job already asserts about the
# Machine's end state (status.hardware populated, status.state reaches
# Available) - what it adds is that the state got there through the real
# proxyDHCP + TFTP + GRUB + HTTP kernel/initrd + live-boot squashfs +
# kezio-agent chain, on a Multus bridge network, instead of a simulated
# registration call.
#
# workflow_dispatch only - deliberately NOT on every push or pull
# request. Reasons, honestly:
#   - PXE over a Multus bridge network inside a nested KubeVirt VM is
#     meaningfully riskier than the KubeVirt-in-RKE2-in-GitHub-Actions
#     topology alone (proven elsewhere in this project's E2E suite): it
#     adds a real L2
#     broadcast domain, a real UEFI firmware PXE ROM, TFTP, GRUB, and a
#     multi-minute live boot, any one of which can flake for reasons that
#     have nothing to do with a given pull request's actual change.
#   - A flaky job gating every PR trains reviewers to ignore red checks,
#     which is worse than not having the check at all. Keeping this
#     separate means test-e2e.yml's lanes (fast, image-path, boot-path)
#     stay the trustworthy, always-on signal, and this job is an
#     on-demand, deeper confidence check - run it before a release, after
#     touching internal/bootd or the live-image build, or when
#     deliberately validating this exact flow.
#   - This job has not yet been proven green in CI (no prior successful
#     run to point to at the time this workflow was added) - see the
#     commit/PR that introduced it for the first triggered run's outcome
#     and any follow-up fixes.
on:
  workflow_dispatch:
    inputs:
      boot_artifacts_image:
        description: >-
          kezio-boot-artifacts OCI image to boot (see .github/workflows/
          build-live-image.yml, which builds and pushes it). Ignored
          when build_boot_artifacts is true. Defaults to the published
          "latest" tag - the same default config/bootserver and
          config/bootd ship.
        required: false
        type: string
        default: "ghcr.io/tjjh89017/kezio-boot-artifacts:latest"
      build_boot_artifacts:
        description: >-
          Build the live boot image (hack/live-image/build.sh, which
          cross-compiles cmd/agent from this checkout) and the
          kezio-boot-artifacts image from it, instead of pulling
          boot_artifacts_image - the way this lane boots a kezio-agent
          built from the commit under test rather than whatever
          build-live-image.yml last published. Adds roughly the same
          many-minutes cost build-live-image.yml itself budgets for the
          identical script (see this job's own timeout-minutes).
        required: false
        type: boolean
        default: false
      existing_dhcp_image:
        description: >-
          dnsmasq image standing in for the site's existing DHCP server
          (see .github/actions/deploy-existing-dhcp). Deliberately a
          different, pinned third-party image from kezio-bootd's own -
          the two dnsmasq instances must stay distinguishable in logs
          and pcap.
        required: false
        type: string
        default: "jpillora/dnsmasq:1.1@sha256:78a9c6711031a557d9c6a79a0b6e060c4ac09de3a8755c78d690acb55b4ccd15"
      dhcp_scenario:
        description: >-
          Which of kezio-bootd's three DHCP scenarios this run drives
          through a real PXE boot to agent registration (mirrors
          Clonezilla lite server's own use-existing-dhcpd vs.
          start-new-dhcpd split, plus kezio's own relay addition -
          see internal/bootd.Config's RelayServerIP/LeaseMode doc
          comments):
            - relay (default): proxyDHCP + BOOTD_DHCP_RELAY_SERVER,
              relaying every request to the existing-dhcp stand-in
              server below - the scenario this lane has always run.
            - no-relay: proxyDHCP beside the existing-dhcp stand-in
              server, with BOOTD_DHCP_RELAY_SERVER left unset - bootd
              answers only the PXE portion of the exchange and the
              stand-in server answers the lease directly on the wire,
              with no relay leg at all.
            - lease: BOOTD_LEASE_MODE instead - no stand-in DHCP
              server is deployed at all, and bootd's own dnsmasq is
              the segment's sole DHCP lease authority.
        required: false
        type: choice
        options:
          - relay
          - no-relay
          - lease
        default: relay

# Manually dispatched runs get their own group (keyed by run id) so a
# deliberately requested verdict - or two scenario dispatches back to
# back - cannot cancel each other; push runs keep superseding per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin every version this job depends on for the KubeVirt topology -
  # bump deliberately, not as a side effect of an unrelated change.
  RKE2_VERSION: "v1.36.2+rke2r1"
  KUBEVIRT_VERSION: "v1.9.0"
  CDI_VERSION: "v1.65.0"

  # The provisioning L2 segment: a Linux bridge on the runner's host
  # network namespace, attached to kezio-bootd's Pod, the existing-dhcp
  # pod, and the target VM's NIC through Multus. A flat L2 with no
  # gateway - see e2e-kubevirt-reusable.yml's env block for the full
  # reasoning behind that shape. The host itself DOES carry one address
  # on it (PROVISIONING_HOST_IP below) - see that variable's own comment
  # for why that is not the same thing as a gateway.
  PROVISIONING_BRIDGE: kezio-prov0
  # Distinct addresses on that segment, kept apart deliberately (see
  # e2e-kubevirt-reusable.yml's env block for the full "why"):
  #   - PROVISIONING_HOST_IP: the runner host's own address on the
  #     bridge. Nothing on the boot path (bootd, the target VM, its
  #     live-booted kezio-agent) ever addresses this IP; it exists
  #     solely so the runner itself - not anything Multus-attached - can
  #     act as an ordinary on-segment client for the "Deploy kezio-bootd"
  #     step's post-deploy curl probe below. Without it the host has no
  #     route to this /24 at all and that probe fails regardless of
  #     whether bootd is healthy (see that step's own comment).
  #   - PROVISIONING_BOOTD_NET1_IP: the static address the
  #     kezio-boot-network NetworkAttachmentDefinition assigns to
  #     bootd's net1 - the dhcp-range subnet anchor, the TFTP
  #     next-server bootd advertises, and, once bootd's reverse proxy is
  #     configured below, the one address the VM (and its live-booted
  #     kezio-agent) ever needs to reach for the whole boot-to-
  #     registration flow.
  #   - PROVISIONING_EXISTING_DHCP_NET1_IP: the static address the
  #     existing-dhcp pod's own NAD assigns to its net1 (see
  #     .github/actions/deploy-existing-dhcp) - on the SAME /24 as
  #     bootd's net1, so bootd's relay to it (BOOTD_DHCP_RELAY_SERVER)
  #     is a plain on-link unicast with no host-side routing at all.
  #   - PROVISIONING_CIDR: the whole segment, handed to bootd as
  #     BOOTD_PROVISIONING_CIDR.
  PROVISIONING_HOST_IP: 192.0.2.1/24
  PROVISIONING_BOOTD_NET1_IP: 192.0.2.2/24
  PROVISIONING_EXISTING_DHCP_NET1_IP: 192.0.2.3/24
  PROVISIONING_CIDR: 192.0.2.0/24
  PROVISIONING_DHCP_RANGE: "192.0.2.10,192.0.2.100,255.255.255.0,12h"
  # Same pool the existing-dhcp stand-in's own PROVISIONING_DHCP_RANGE
  # draws from - reused (not derived from it) so the "lease" scenario's
  # BOOTD_LEASE_RANGE_START/END do not depend on parsing that string,
  # and kept clear of PROVISIONING_HOST_IP/PROVISIONING_BOOTD_NET1_IP
  # (.1/.2), which stay statically assigned regardless of scenario.
  PROVISIONING_LEASE_RANGE_START: "192.0.2.10"
  PROVISIONING_LEASE_RANGE_END: "192.0.2.100"
  TARGET_VM_MAC: "52:54:00:be:ef:01"
  TARGET_VM_DISK_SERIAL: "KEZIOE2EVMDISK01"
  EXISTING_DHCP_IMG: ${{ inputs.existing_dhcp_image }}
  DHCP_SCENARIO: ${{ inputs.dhcp_scenario }}
  # See "Build the live boot image and kezio-boot-artifacts image" below
  # for the build_boot_artifacts branch; the default pulls the published
  # image directly, no local build or import at all.
  BOOT_ARTIFACTS_IMG: ${{ inputs.build_boot_artifacts && 'example.com/kezio-boot-artifacts:e2e-boot-path' || inputs.boot_artifacts_image }}

jobs:
  boot-path-kubevirt:
    name: >-
      Boot a KubeVirt VM through the real PXE/GRUB/agent chain
      (${{ inputs.dhcp_scenario }} DHCP scenario)
    runs-on: ubuntu-latest
    # PXE discovery, TFTP, the live kernel/initrd HTTP fetch, and the
    # squashfs live-boot are each on the order of tens of seconds to a
    # few minutes; budget generously for a first PXE cycle that may need
    # firmware retries, plus the fetch-boot-artifacts initContainers'
    # own image pull (kernel/initrd/squashfs/shim/grub, up to a few
    # hundred MiB - see build-live-image.yml) before either Deployment's
    # main container even starts. build_boot_artifacts adds roughly the
    # same many-minutes cost build-live-image.yml itself budgets for the
    # identical hack/live-image/build.sh run.
    timeout-minutes: ${{ inputs.build_boot_artifacts && 150 || 60 }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: "Announce the DHCP scenario under test"
        # Printed once, up front, so a red run is attributable to a
        # specific scenario from the job log/summary alone - the job's
        # own name (above) already carries it too, but that only shows
        # up in the workflow run list, not inside the log a triager
        # opens first.
        run: |
          echo "::notice::boot-path-kubevirt: DHCP scenario under test = ${DHCP_SCENARIO}"

      - name: Fail fast unless /dev/kvm is usable
        # Never fall back to TCG (software) emulation: it hides real PXE
        # timing problems instead of surfacing them, and a KubeVirt VM
        # under TCG is far too slow to net boot within any timeout this
        # job could reasonably set.
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm does not exist on this runner; KubeVirt VMs need hardware virtualization." >&2
            exit 1
          fi
          sudo usermod -aG kvm "$(whoami)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Raise inotify limits
        # A known KubeVirt-in-CI failure mode: virt-handler and the
        # kubelet both watch a large number of files per running VM.
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=1048576
          sudo sysctl -w fs.inotify.max_user_instances=8192

      - name: Resource check (fail fast if the runner is under-resourced)
        run: |
          set -euo pipefail
          echo "===== CPU ====="
          nproc
          echo "===== Memory ====="
          free -h
          echo "===== Disk ====="
          df -h

          cpus="$(nproc)"
          mem_mb="$(free -m | awk '/^Mem:/{print $2}')"

          # Higher floor than test-e2e.yml's lanes: this job additionally
          # runs KubeVirt/CDI's control plane and one live-booted VM
          # (OVMF + initramfs + kezio-agent) on top of everything those
          # lanes need, hence the higher CPU/RAM floor below.
          if [ "$cpus" -lt 4 ]; then
            echo "::error::Runner has only ${cpus} CPU(s); the KubeVirt boot-path stage needs at least 4." >&2
            exit 1
          fi
          if [ "$mem_mb" -lt 14000 ]; then
            echo "::error::Runner has only ${mem_mb} MiB RAM; the KubeVirt boot-path stage needs at least 14000 MiB." >&2
            exit 1
          fi

      # ---------------------------------------------------------------
      # Boot artifacts: kernel/initrd/squashfs and shimx64.efi/
      # grubx64.efi are, by default, never built in this job - a
      # from-source `lb build` run (hack/live-image/build.sh) takes up to
      # 90 minutes on its own, which this job's default 60 minute budget
      # cannot also absorb. Instead, config/bootserver's and
      # config/bootd's own fetch-boot-artifacts initContainer `cp`s them
      # straight out of the kezio-boot-artifacts OCI image
      # (boot_artifacts_image, published by build-live-image.yml) once
      # each Deployment's pod actually starts - the same mechanism a
      # real deployment uses, dogfooding it here. Set build_boot_artifacts
      # to build that image from this checkout instead (see this job's
      # own input description and the "Build the live boot image and
      # kezio-boot-artifacts image" step below) - the only way this lane
      # proves a kezio-agent change, since a live-booted kezio-agent is
      # otherwise whatever build-live-image.yml last published.
      # ---------------------------------------------------------------

      - name: Fail fast unless the boot-artifacts image exists
        # Mirrors e2e-kubevirt-reusable.yml's own step of the same name -
        # see that file's comment for the full reasoning. Skipped when
        # build_boot_artifacts is set: that mode builds and locally
        # imports its own tag, which exists in no registry to check.
        if: ${{ !inputs.build_boot_artifacts }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "${BOOT_ARTIFACTS_IMG}" >/dev/null; then
            echo "::error::No boot-artifacts image at ${BOOT_ARTIFACTS_IMG}. Publish one first: push a \"v*\" tag, or dispatch build-live-image.yml with publish=true - a plain workflow_dispatch of build-live-image.yml without publish=true only validates the build and skips both publishing steps." >&2
            exit 1
          fi

      - name: Create the provisioning bridge
        # PROVISIONING_HOST_IP is the runner's own address, not a
        # gateway: the flat L2 segment this models still has no router
        # and nothing on the boot path ever addresses this IP - see that
        # variable's own comment, and e2e-kubevirt-reusable.yml's own
        # step of the same name, for the full reasoning.
        run: |
          set -euo pipefail
          sudo ip link add "${PROVISIONING_BRIDGE}" type bridge
          sudo ip addr add "${PROVISIONING_HOST_IP}" dev "${PROVISIONING_BRIDGE}"
          sudo ip link set "${PROVISIONING_BRIDGE}" up

      - name: Install RKE2 with Multus enabled
        # Shared with e2e-kubevirt-reusable.yml and
        # e2e-scale-multisite-kubevirt.yml - see this action's own doc
        # comment for why it was extracted (the three lanes' RKE2 setup
        # was byte-identical).
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: ${{ env.RKE2_VERSION }}

      - name: Allow bridged traffic on the provisioning bridge (bypass canal's FORWARD filtering)
        # RKE2's canal CNI loads br_netfilter
        # (net.bridge.bridge-nf-call-iptables=1), which routes every
        # bridged L2 frame - including this bridge's, even though it
        # carries no cluster pod traffic - through the host's netfilter
        # FORWARD chain. kube-proxy/canal leave that chain's default
        # policy at DROP once the cluster is up
        # (https://github.com/kubernetes/kubernetes/issues/39823,
        # https://github.com/kubernetes/kubernetes/issues/91545), which
        # silently eats the VM's PXE DHCP DISCOVER broadcast travelling
        # between its Multus port and bootd's Multus port on this
        # bridge. Run after the node is Ready (canal has had the chance
        # to program its own FORWARD rules by then) and idempotently -
        # -C before -I - in case a later canal reconciliation touches
        # the chain again: add an ACCEPT scoped to this bridge's own
        # port-to-port traffic only, so cluster filtering everywhere
        # else is untouched.
        run: |
          set -euo pipefail
          if command -v iptables >/dev/null 2>&1; then
            sudo iptables -C FORWARD -i "${PROVISIONING_BRIDGE}" -o "${PROVISIONING_BRIDGE}" -j ACCEPT 2>/dev/null || \
              sudo iptables -I FORWARD -i "${PROVISIONING_BRIDGE}" -o "${PROVISIONING_BRIDGE}" -j ACCEPT
          fi
          # RKE2/canal can also run with the kernel's nf_tables backend
          # instead of legacy iptables; when the "inet filter" table
          # exists, mirror the same exemption there so the bridge is
          # covered regardless of which backend actually owns FORWARD.
          if command -v nft >/dev/null 2>&1 && sudo nft list table inet filter >/dev/null 2>&1; then
            sudo nft list chain inet filter FORWARD 2>/dev/null | grep -q "iifname \"${PROVISIONING_BRIDGE}\" oifname \"${PROVISIONING_BRIDGE}\" accept" || \
              sudo nft insert rule inet filter FORWARD iifname "${PROVISIONING_BRIDGE}" oifname "${PROVISIONING_BRIDGE}" accept
          fi

      - name: Start capturing the provisioning bridge (tcpdump)
        # Definitive instrumentation regardless of whether the checksum
        # fix above is the actual/only cause - see e2e-kubevirt-reusable.
        # yml's step of the same name. Backgrounded so it runs from
        # before the target VM exists through however this job ends.
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends tcpdump || true
          sudo -- sh -c "nohup tcpdump -i '${PROVISIONING_BRIDGE}' -w '${RUNNER_TEMP}/bridge.pcap' \
            udp port 67 or port 68 or port 69 or tcp port 80 \
            >/tmp/tcpdump-bridge.log 2>&1 &"

      - name: Install cert-manager, KubeVirt, virtctl, and CDI
        # Shared with e2e-kubevirt-reusable.yml and
        # e2e-scale-multisite-kubevirt.yml - see this action's own doc
        # comment (and its own header on the KubeVirt CRD race and the
        # KubevirtSeccompProfile gate) for the full "why". Also waits for
        # RKE2's own rke2-multus HelmChart addon to publish the Multus
        # NetworkAttachmentDefinition CRD, which the "Create the
        # provisioning NetworkAttachmentDefinitions" step below needs.
        uses: ./.github/actions/install-cluster-addons
        with:
          kubevirt-version: ${{ env.KUBEVIRT_VERSION }}
          cdi-version: ${{ env.CDI_VERSION }}

      - name: Build and import the manager image
        # RKE2's containerd socket is still under /run/k3s/containerd (a
        # genuine leftover of RKE2's k3s lineage - the socket path itself,
        # not the cluster, is k3s-named), and the plain "ctr" binary needs
        # both -a (socket) and -n k8s.io (the namespace the kubelet reads
        # from) spelled out explicitly - unlike k3s's own "k3s ctr"
        # wrapper, which defaulted both on its own.
        run: |
          set -euo pipefail
          go mod tidy
          make docker-build IMG=example.com/kezio:e2e-boot-path
          docker save example.com/kezio:e2e-boot-path | sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import -

      - name: Build and import the bootd image
        run: |
          set -euo pipefail
          make docker-build-bootd BOOTD_IMG=example.com/kezio-bootd:e2e-boot-path
          docker save example.com/kezio-bootd:e2e-boot-path | sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import -

      - name: Build the live boot image and kezio-boot-artifacts image
        # See build_boot_artifacts's own input description. Runs the same
        # script build-live-image.yml budgets 90 minutes for on its own.
        if: ${{ inputs.build_boot_artifacts }}
        env:
          AGENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          hack/live-image/build.sh
          make docker-build-boot-artifacts BOOT_ARTIFACTS_IMG="${BOOT_ARTIFACTS_IMG}"
          docker save "${BOOT_ARTIFACTS_IMG}" | sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import -

      - name: Deploy CRDs and the controller-manager
        run: |
          set -euo pipefail
          make install
          make deploy IMG=example.com/kezio:e2e-boot-path
          # config/default's own kustomization creates the kezio-system
          # namespace as part of `make deploy` above; only the security
          # label is this step's own responsibility.
          # privileged, not restricted: bootd's dnsmasq child needs NET_ADMIN/NET_RAW, outside both the restricted and baseline PSA profiles - see config/bootd/deployment.yaml's capabilities comment. Every pod keeps its own strict securityContext regardless.
          kubectl label --overwrite ns kezio-system pod-security.kubernetes.io/enforce=privileged
          kubectl rollout status deployment/kezio-controller-manager -n kezio-system --timeout=180s

      - name: Create the provisioning NetworkAttachmentDefinitions
        # Namespaced under kezio-system, so this must run after "Deploy
        # CRDs and the controller-manager" above: that step's `make
        # deploy` is what creates the kezio-system namespace in the
        # first place (config/default's own kustomization - see that
        # step's own comment), and creating a namespaced object before
        # its namespace exists is a plain 404 from the API server. This
        # step used to run earlier, alongside the other cluster-addon
        # installs (KubeVirt/CDI/Multus); moving it here is the fix, not
        # a stylistic reshuffle - the first dispatched run of this
        # workflow failed with exactly that 404
        # ("namespaces \"kezio-system\" not found").
        #
        # Two NADs on the same bridge, split on purpose (see
        # e2e-kubevirt-reusable.yml's own step of this name for the same
        # topology):
        #
        # kezio-boot-network (static ipam) is for the bootd pod ONLY.
        # bootd's net1 must carry a fixed address
        # (PROVISIONING_BOOTD_NET1_IP) on the provisioning subnet -
        # dnsmasq binds its DHCP sockets to net1 and BOOTD_SERVER_IP
        # advertises it as the TFTP next-server. The existing-dhcp pod
        # (deployed separately below) keeps its own static address on
        # the same bridge, so the two never collide.
        #
        # kezio-boot-network-vm ("ipam": {}) is for the target VM's
        # provisioning NIC. The VM must NOT attach the static-ipam NAD:
        # when a KubeVirt bridge-mode interface's network carries IPAM,
        # virt-launcher starts its own in-pod DHCP server on that NIC to
        # hand the pod's CNI-assigned address to the guest - and the
        # static plugin hands every attaching pod the same address, so
        # that rogue server offers the guest bootd's own 192.0.2.2
        # before either bootd or the existing-dhcp pod ever gets a
        # chance to answer on the wire (observed live in run
        # 31128609456: bridge-pcap.txt showed a PXEClient:Arch:00007
        # DISCOVER answered from 169.254.75.10 - virt-launcher's own
        # in-pod DHCP server, not bootd's 192.0.2.2 or existing-dhcp's
        # 192.0.2.3 - while bootd itself only ever logged
        # HTTPClient:Arch:00016 requests and the segment carried zero
        # TFTP traffic: the firmware's PXE attempt never reached bootd
        # at all). With empty ipam virt-launcher runs no DHCP server on
        # this NIC, and the guest firmware does real DHCP on the wire
        # against bootd + the relayed lease server, which is exactly
        # what this lane must exercise.
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network
            namespace: kezio-system
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "type": "bridge",
                "bridge": "${PROVISIONING_BRIDGE}",
                "ipam": {
                  "type": "static",
                  "addresses": [
                    {"address": "${PROVISIONING_BOOTD_NET1_IP}"}
                  ]
                }
              }
          EOF
          cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network-vm
            namespace: kezio-system
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "type": "bridge",
                "bridge": "${PROVISIONING_BRIDGE}",
                "ipam": {}
              }
          EOF

      - name: Deploy the boot config and agent registration Services, wire real artifacts
        run: |
          set -euo pipefail
          kubectl apply -k config/e2e-boot-path
          kubectl -n kezio-system set env deployment/kezio-controller-manager \
            BOOT_SERVER_ADDR=:8090 \
            BOOT_ARTIFACTS_DIR=/boot-artifacts \
            BOOT_SERVER_URL="http://${PROVISIONING_BOOTD_NET1_IP%%/*}:80" \
            AGENT_SERVER_ADDR=:8091 \
            BOOT_AGENT_SERVER_URL="http://${PROVISIONING_BOOTD_NET1_IP%%/*}:80" \
            DEPLOYER=agent
          # config/e2e-boot-path deliberately does not wire the
          # fetch-boot-artifacts initContainer into its own
          # kustomization.yaml (see boot-artifacts-init-patch.yaml's own
          # comment: doing so would make test-e2e.yml's lighter,
          # always-on boot-path lane - which shares this same overlay
          # and never touches real artifact bytes - depend on an image
          # pull existing). This job does need real bytes, so it applies
          # that initContainer patch itself, on top of the overlay just
          # applied above, then points it at BOOT_ARTIFACTS_IMG.
          kubectl -n kezio-system patch deployment/kezio-controller-manager --type=json \
            --patch-file=config/e2e-boot-path/boot-artifacts-init-patch.yaml
          kubectl -n kezio-system set image deployment/kezio-controller-manager \
            fetch-boot-artifacts="${BOOT_ARTIFACTS_IMG}"
          kubectl rollout status deployment/kezio-controller-manager -n kezio-system --timeout=180s

      - name: Deploy the existing-dhcp pod on the provisioning bridge
        id: existing-dhcp
        # Skipped in the "lease" scenario: that scenario proves bootd's
        # own dnsmasq is the segment's sole DHCP authority, which needs
        # no other DHCP server present on the wire at all (not even one
        # bootd never relays to) - see the dhcp_scenario input's own
        # description.
        if: ${{ inputs.dhcp_scenario != 'lease' }}
        uses: ./.github/actions/deploy-existing-dhcp
        with:
          namespace: kezio-system
          name: kezio-existing-dhcp
          image: ${{ env.EXISTING_DHCP_IMG }}
          bridge: ${{ env.PROVISIONING_BRIDGE }}
          static-cidr: ${{ env.PROVISIONING_EXISTING_DHCP_NET1_IP }}
          dhcp-range: ${{ env.PROVISIONING_DHCP_RANGE }}

      - name: Deploy kezio-bootd on the provisioning bridge
        run: |
          set -euo pipefail
          cd config/bootd
          ../../bin/kustomize edit set image bootd=example.com/kezio-bootd:e2e-boot-path
          ../../bin/kustomize edit set image kezio-boot-artifacts="${BOOT_ARTIFACTS_IMG}"
          cd ../..
          kubectl apply -k config/bootd
          # - BOOTD_SERVER_IP: bootd's OWN net1 static address (the
          #   NAD's static ipam above) - the PXE next-server, so
          #   firmware TFTPs straight to the pod.
          # - BOOTD_PROVISIONING_CIDR: the segment's subnet, rendered
          #   as dnsmasq's proxyDHCP dhcp-range.
          # - BOOTD_BOOT_CONFIG_URL: bootd's OWN address (the same value
          #   BOOT_SERVER_URL/BOOT_AGENT_SERVER_URL were set to above) -
          #   bootd's own reverse proxy answers /boot/grub.cfg-<mac>
          #   once BOOTD_BOOT_UPSTREAM_URL below is set, forwarding it to
          #   kezio-boot-server; bootd renders this URL into the
          #   grub/grub.cfg it serves over TFTP for the netboot GRUB
          #   image.
          # - BOOTD_DHCP_RELAY_SERVER (relay scenario only): the
          #   existing-dhcp pod's own net1 address (deployed just
          #   above), on the SAME /24 as bootd's own net1 - the relay
          #   is a plain on-link unicast, no host-side routing
          #   involved. Left unset in the no-relay scenario (bootd runs
          #   pure proxyDHCP beside the same existing-dhcp pod) and in
          #   the lease scenario (no existing-dhcp pod exists to relay
          #   to at all).
          # - BOOTD_LEASE_MODE / BOOTD_LEASE_RANGE_START/END (lease
          #   scenario only): makes bootd's own dnsmasq the segment's
          #   DHCP lease authority instead of a proxyDHCP front - see
          #   internal/bootd.Config's LeaseMode doc comment. The range
          #   is pinned to PROVISIONING_LEASE_RANGE_START/END rather
          #   than left to auto-derive from BOOTD_PROVISIONING_CIDR:
          #   auto-derivation would start at the subnet's first host
          #   address, which collides with PROVISIONING_HOST_IP and
          #   PROVISIONING_BOOTD_NET1_IP (.1/.2) - both still statically
          #   assigned on this segment regardless of scenario.
          # - BOOTD_AGENT_UPSTREAM_URL / BOOTD_BOOT_UPSTREAM_URL: the
          #   in-cluster (ClusterIP) Services the target VM - which lives
          #   on the raw kezio-prov0 bridge with no cluster DNS and no
          #   route to a ClusterIP - cannot reach directly; bootd, an
          #   ordinary cluster pod on its other (eth0) interface, can.
          #   Setting these turns bootd's reverse proxy on (see
          #   internal/bootd's ProxyServer and config/bootd/README.md's
          #   "Reverse-proxying the agent and boot config servers"
          #   section): every /agent/... and /boot/... request the VM's
          #   firmware or kezio-agent sends to bootd's own address above
          #   now forwards to the real service - no socat, no
          #   separately-exposed Service.
          scenario_env=()
          case "${DHCP_SCENARIO}" in
            relay)
              scenario_env+=(BOOTD_DHCP_RELAY_SERVER="${PROVISIONING_EXISTING_DHCP_NET1_IP%%/*}")
              ;;
            no-relay)
              # Pure proxyDHCP: BOOTD_DHCP_RELAY_SERVER stays unset, so
              # bootd never touches lease traffic - the existing-dhcp
              # pod deployed above answers the lease directly.
              ;;
            lease)
              scenario_env+=(
                BOOTD_LEASE_MODE=true
                BOOTD_LEASE_RANGE_START="${PROVISIONING_LEASE_RANGE_START}"
                BOOTD_LEASE_RANGE_END="${PROVISIONING_LEASE_RANGE_END}"
              )
              ;;
            *)
              echo "::error::unknown dhcp_scenario '${DHCP_SCENARIO}' (expected relay, no-relay, or lease)" >&2
              exit 1
              ;;
          esac
          kubectl -n kezio-system set env deployment/kezio-bootd \
            BOOTD_SERVER_IP="${PROVISIONING_BOOTD_NET1_IP%%/*}" \
            BOOTD_PROVISIONING_CIDR="${PROVISIONING_CIDR}" \
            BOOTD_BOOT_CONFIG_URL="http://${PROVISIONING_BOOTD_NET1_IP%%/*}:80" \
            BOOTD_AGENT_UPSTREAM_URL="http://kezio-agent-server.kezio-system.svc.cluster.local:8091" \
            BOOTD_BOOT_UPSTREAM_URL="http://kezio-boot-server.kezio-system.svc.cluster.local:8090" \
            "${scenario_env[@]}"
          # config/bootd already wires its own fetch-boot-artifacts
          # initContainer (docker/boot-artifacts/Dockerfile via `cp`) and
          # a plain emptyDir "tftp" volume it populates - no volume patch needed
          # here anymore. Only the Multus network annotation, which is
          # site/job-specific, still needs patching in. This also fixes
          # a real bug the previous hostPath-based patch carried: a
          # hostPath volume violates the "restricted" Pod Security
          # Standard config/default's namespace enforces, which is
          # exactly what made this job's first dispatched runs fail
          # with FailedCreate ("restricted volume types (volume
          # "boot-artifacts" uses restricted volume type "hostPath")") -
          # an emptyDir populated by an initContainer has no such
          # problem.
          kubectl -n kezio-system patch deployment/kezio-bootd --type=json -p='[
            {"op":"add","path":"/spec/template/metadata/annotations","value":{"k8s.v1.cni.cncf.io/networks":"kezio-boot-network"}}
          ]'
          kubectl rollout status deployment/kezio-bootd -n kezio-system --timeout=180s

          # Same early-failure shape the old socat forward's curl check
          # used to give, moved here (bootd itself, not a host-level
          # forward, is what has to answer now): prove bootd's reverse
          # proxy actually reaches through to the boot config server on
          # bootd's own provisioning-network address.
          #
          # Split into a connect step and a status check instead of a
          # bare `curl -sf`: `-f` treats "could not open a TCP
          # connection to bootd" and "connected fine but the upstream
          # boot config server answered >= 400" as the exact same
          # failure, which previously cost a full debugging cycle
          # working out which of the two had actually happened (the
          # runner host having no address on this segment at all, a
          # routing problem with nothing to do with bootd's proxy). The
          # http_code capture below fails on the former (curl itself
          # errors, no code to report) and reports the code on the
          # latter, so the two are distinguishable from the error text
          # alone.
          bootd_ip="${PROVISIONING_BOOTD_NET1_IP%%/*}"
          http_code="$(curl -s -o /dev/null -w '%{http_code}' "http://${bootd_ip}:80/boot/artifacts/manifest.json")" || {
            echo "::error::could not connect to bootd's reverse proxy at ${bootd_ip}:80 at all (no TCP connection - a network/routing failure, not an HTTP error from the boot config server)" >&2
            exit 1
          }
          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 400 ]; then
            echo "::error::bootd's reverse proxy at ${bootd_ip}:80 is reachable but answered HTTP ${http_code} for /boot/artifacts/manifest.json - the proxy itself is up, the boot config server behind it is not serving the artifact" >&2
            exit 1
          fi

      - name: Assert the boot artifacts agent commit
        uses: ./.github/actions/assert-boot-artifacts-agent-commit
        with:
          bootd-ip: ${{ env.PROVISIONING_BOOTD_NET1_IP }}
          expected-commit: ${{ github.sha }}
          build-boot-artifacts: ${{ inputs.build_boot_artifacts }}

      - name: Create the Machine CR for the target VM
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: kezio.kojuro.date/v1alpha1
          kind: Machine
          metadata:
            name: e2e-boot-path-vm
            namespace: kezio-system
          spec:
            bootMACAddress: "${TARGET_VM_MAC}"
            online: true
            targetDisk:
              serialNumber: "${TARGET_VM_DISK_SERIAL}"
          EOF

      - name: Create and start the target KubeVirt VirtualMachine
        # OVMF UEFI firmware, no Secure Boot (secureBoot: false - the
        # shim kezio-bootd serves is still a real signed binary, copied
        # by config/bootd's fetch-boot-artifacts initContainer out of the
        # published kezio-boot-artifacts image, but nothing here enrolls
        # the firmware's Secure Boot keys). Network boot
        # first (interface bootOrder 1), then the blank data disk
        # (bootOrder 2) as the local-disk fallback GRUB's "exit" hands
        # control back to. The disk's serial is set explicitly so it
        # matches TARGET_VM_DISK_SERIAL / the Machine's targetDisk hint,
        # the same disk-serial-matches-targetDisk property this test
        # topology relies on.
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: e2e-boot-path-vm
            namespace: kezio-system
          spec:
            running: true
            template:
              metadata:
                labels:
                  kubevirt.io/vm: e2e-boot-path-vm
              spec:
                domain:
                  cpu:
                    cores: 1
                  resources:
                    requests:
                      memory: 2Gi
                  firmware:
                    bootloader:
                      efi:
                        secureBoot: false
                  devices:
                    interfaces:
                      - name: provisioning
                        macAddress: "${TARGET_VM_MAC}"
                        bridge: {}
                        bootOrder: 1
                    disks:
                      - name: data
                        serial: "${TARGET_VM_DISK_SERIAL}"
                        bootOrder: 2
                        disk:
                          bus: virtio
                networks:
                  - name: provisioning
                    multus:
                      networkName: kezio-boot-network-vm
                volumes:
                  - name: data
                    emptyDisk:
                      capacity: 2Gi
          EOF
          # Applying the VirtualMachine above only asks KubeVirt's VM
          # controller to create a VirtualMachineInstance for it; that
          # controller reconciles asynchronously, so the VMI object can
          # still not exist yet at this point ("no matches" for `kubectl
          # wait`, which errors out immediately on zero matches instead
          # of polling for existence). Same exists-then-condition shape
          # as the CRD waits above: poll for the VMI to exist first, then
          # wait for it to actually report Ready.
          deadline=$(( $(date +%s) + 60 ))
          until kubectl get vmi/e2e-boot-path-vm -n kezio-system >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VirtualMachineInstance e2e-boot-path-vm did not appear within the timeout - the VM controller may not have reconciled it." >&2
              exit 1
            fi
            sleep 2
          done
          kubectl wait vmi/e2e-boot-path-vm -n kezio-system --for=condition=Ready --timeout=180s

      - name: Start continuous VM console capture
        # This is exactly the boot the job needs to see the most - PXE,
        # GRUB, the live kernel/initrd fetch, the squashfs boot, and
        # kezio-agent's own startup - so a live attach in "Dump
        # diagnostics on failure" (which only ever sees the last 20s) is
        # no longer the only window onto it.
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: e2e-boot-path-vm
          logfile: ${{ runner.temp }}/console.log

      - name: Wait for the Machine to reach Available with reported hardware
        # Generous but bounded: PXE discovery + TFTP + the kernel/initrd
        # HTTP fetch + the live-boot squashfs fetch + kezio-agent startup
        # is a multi-minute chain end to end, well beyond a simulated
        # registration's near-instant round trip (contrast
        # test-e2e.yml's boot-path job).
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          while true; do
            state="$(kubectl get machine e2e-boot-path-vm -n kezio-system -o jsonpath='{.status.state}' || true)"
            echo "$(date -Is) Machine state: ${state:-<none>}"
            if [ "${state}" = "Available" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Machine e2e-boot-path-vm did not reach Available within the timeout." >&2
              exit 1
            fi
            sleep 10
          done
          kubectl get machine e2e-boot-path-vm -n kezio-system -o yaml
          disks="$(kubectl get machine e2e-boot-path-vm -n kezio-system -o jsonpath='{.status.hardware.disks[*].serialNumber}')"
          case "${disks}" in
            *"${TARGET_VM_DISK_SERIAL}"*) ;;
            *)
              echo "::error::expected reported disk serial ${TARGET_VM_DISK_SERIAL} in status.hardware.disks, got: ${disks}" >&2
              exit 1
              ;;
          esac

      - name: "Verify the DHCP relay leg reached the existing-dhcp server"
        # relay scenario only. See e2e-kubevirt-reusable.yml's step of
        # the same name for the full reasoning: this does NOT assert "a
        # lease is obtainable only through the relay" (the VM may
        # legitimately take either the existing-dhcp pod's own direct
        # offer or bootd's relayed copy - both are real, both are
        # on-segment). It instead proves the relay leg itself fired -
        # the Machine reaching Available above already means the PXE
        # handshake this checks happened.
        if: ${{ inputs.dhcp_scenario == 'relay' }}
        run: |
          set -euo pipefail
          bootd_ip="${PROVISIONING_BOOTD_NET1_IP%%/*}"
          existing_dhcp_ip="${PROVISIONING_EXISTING_DHCP_NET1_IP%%/*}"
          relay_line="DHCP relay at ${bootd_ip} -> ${existing_dhcp_ip}"

          bootd_log="$(kubectl -n kezio-system logs deployment/kezio-bootd --all-containers --tail=-1)"
          if ! grep -qF "${relay_line}" <<<"${bootd_log}"; then
            echo "::error::bootd's dnsmasq log never shows '${relay_line}' - the relay leg to the existing-dhcp server never fired." >&2
            echo "${bootd_log}"
            exit 1
          fi

          existing_dhcp_log="$(kubectl -n kezio-system logs deployment/kezio-existing-dhcp --all-containers --tail=-1)"
          if ! grep -qF "DHCPDISCOVER" <<<"${existing_dhcp_log}" || ! grep -qF "DHCPOFFER" <<<"${existing_dhcp_log}"; then
            echo "::error::existing-dhcp's own log shows no DHCPDISCOVER/DHCPOFFER exchange - it never actually answered the request bootd's log says it relayed." >&2
            echo "${existing_dhcp_log}"
            exit 1
          fi

      - name: "Verify the no-relay proxyDHCP scenario answered leases directly"
        # no-relay scenario only: proves the inverse of the relay
        # check above - bootd never relayed anything (BOOTD_DHCP_RELAY_
        # SERVER was left unset in the "Deploy kezio-bootd..." step),
        # and the existing-dhcp pod deployed alongside it answered the
        # DISCOVER/lease exchange on its own, which is what the Machine
        # reaching Available above depended on getting an address from.
        if: ${{ inputs.dhcp_scenario == 'no-relay' }}
        run: |
          set -euo pipefail
          bootd_log="$(kubectl -n kezio-system logs deployment/kezio-bootd --all-containers --tail=-1)"
          if grep -qF "DHCP relay at" <<<"${bootd_log}"; then
            echo "::error::bootd's dnsmasq log shows a DHCP relay line in the no-relay scenario - BOOTD_DHCP_RELAY_SERVER must stay unset here." >&2
            echo "${bootd_log}"
            exit 1
          fi

          existing_dhcp_log="$(kubectl -n kezio-system logs deployment/kezio-existing-dhcp --all-containers --tail=-1)"
          if ! grep -qF "DHCPDISCOVER" <<<"${existing_dhcp_log}" || ! grep -qF "DHCPACK" <<<"${existing_dhcp_log}"; then
            echo "::error::existing-dhcp's own log shows no DHCPDISCOVER/DHCPACK exchange - it never answered a lease directly, which pure proxyDHCP beside it depends on." >&2
            echo "${existing_dhcp_log}"
            exit 1
          fi

      - name: "Verify the lease scenario made bootd its own segment's lease authority"
        # lease scenario only: no existing-dhcp pod was ever deployed
        # (see the "Deploy the existing-dhcp pod..." step's own
        # condition), so a lease can only have come from bootd's own
        # dnsmasq (BOOTD_LEASE_MODE) - confirm both that absence and
        # that bootd's log actually shows it issuing a lease (DHCPACK),
        # not just answering the PXE portion of the exchange.
        if: ${{ inputs.dhcp_scenario == 'lease' }}
        run: |
          set -euo pipefail
          if kubectl -n kezio-system get deployment/kezio-existing-dhcp >/dev/null 2>&1; then
            echo "::error::kezio-existing-dhcp exists in the lease scenario - the segment must carry no stand-in DHCP server at all so bootd is unambiguously the lease authority." >&2
            exit 1
          fi

          bootd_log="$(kubectl -n kezio-system logs deployment/kezio-bootd --all-containers --tail=-1)"
          if ! grep -qF "DHCPACK" <<<"${bootd_log}"; then
            echo "::error::bootd's dnsmasq log shows no DHCPACK - it never issued a lease of its own under BOOTD_LEASE_MODE." >&2
            echo "${bootd_log}"
            exit 1
          fi

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "===== nodes ====="
          kubectl get nodes -o wide
          echo "===== kezio-system pods ====="
          kubectl get pods -n kezio-system -o wide
          echo "===== controller-manager logs ====="
          kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=1000
          echo "===== bootd logs ====="
          kubectl -n kezio-system logs deployment/kezio-bootd --all-containers --tail=1000
          echo "===== existing-dhcp logs (the site's stand-in existing DHCP server) ====="
          kubectl -n kezio-system logs deployment/kezio-existing-dhcp --all-containers --tail=1000
          echo "===== VirtualMachine / VMI ====="
          kubectl get vm,vmi -n kezio-system -o yaml
          echo "===== virt-launcher pod describe ====="
          kubectl describe pod -n kezio-system -l kubevirt.io/vm=e2e-boot-path-vm
          echo "===== VM console (last output) ====="
          timeout 20 virtctl console e2e-boot-path-vm -n kezio-system || true
          echo "===== Machine CR ====="
          kubectl get machine e2e-boot-path-vm -n kezio-system -o yaml
          echo "===== events ====="
          kubectl get events -n kezio-system --sort-by=.lastTimestamp
          echo "===== host FORWARD chain (canal/br_netfilter can silently drop bridged traffic here) ====="
          sudo iptables -L FORWARD -v --line-numbers || true
          sysctl net.bridge.bridge-nf-call-iptables || true
          echo "===== host mangle table CHECKSUM rules (fills UDP checksums the VM's virtio-net offloaded) ====="
          sudo iptables -t mangle -L POSTROUTING -v --line-numbers || true
          echo "===== ${PROVISIONING_BRIDGE} offload settings ====="
          ethtool -k "${PROVISIONING_BRIDGE}" | head || true

      - name: Stop the bridge capture and flush it to the artifact
        if: always()
        # Runs unconditionally, not just on failure - see
        # e2e-kubevirt-reusable.yml's step of the same name for why.
        run: |
          set +e
          sudo pkill -TERM -f "tcpdump -i ${PROVISIONING_BRIDGE}"
          sleep 2
          if [ -s "${RUNNER_TEMP}/bridge.pcap" ]; then
            sudo chmod 0644 "${RUNNER_TEMP}/bridge.pcap"
            tcpdump -vvv -r "${RUNNER_TEMP}/bridge.pcap" > "${RUNNER_TEMP}/bridge-pcap.txt" 2>&1
          fi

      - name: Collect the always-on diagnostics bundle
        if: always()
        # Unconditional, like the pcap flush above: bootd's and
        # existing-dhcp's logs carry log-dhcp decision lines (see
        # internal/bootd's forwardLines for bootd's own), and
        # controller-manager's log is where the boot server's own
        # per-request lines land (see internal/bootserver's logRequests)
        # - all useful on a passing run too, not only a failing one.
        uses: ./.github/actions/collect-e2e-diagnostics-bundle
        with:
          output-dir: ${{ runner.temp }}
          deployments: |
            kezio-controller-manager:controller-manager.log
            kezio-bootd:bootd.log
            kezio-existing-dhcp:existing-dhcp.log
          resources: |
            machine/e2e-boot-path-vm:machine.yaml
            vm/e2e-boot-path-vm:vm.yaml
            vmi/e2e-boot-path-vm:vmi.yaml

      - name: Upload E2E diagnostics artifacts
        # Always, not just on failure - this lane had no artifact upload
        # at all before; the bridge capture is worth having on a passing
        # run too (to confirm a fix actually restored DHCP/TFTP activity
        # instead of only ever validating this path when it is hardest to
        # also diagnose).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.job }}
          path: |
            ${{ runner.temp }}/console.log
            ${{ runner.temp }}/bridge.pcap
            ${{ runner.temp }}/bridge-pcap.txt
            ${{ runner.temp }}/bootd.log
            ${{ runner.temp }}/existing-dhcp.log
            ${{ runner.temp }}/controller-manager.log
            ${{ runner.temp }}/machine.yaml
            ${{ runner.temp }}/vm.yaml
            ${{ runner.temp }}/vmi.yaml
            ${{ runner.temp }}/events.txt
          if-no-files-found: ignore
          retention-days: 14
