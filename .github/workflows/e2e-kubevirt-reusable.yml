name: E2E Full Deploy (KubeVirt VM) - reusable

# The BT-transfer/full-deploy scenario, extracted from a single caller so
# it can be invoked with `workflow_call` - by kezio's own
# `e2e-deploy-kubevirt.yml` (a thin `workflow_dispatch` wrapper, same
# gating as before), by kezio's own `e2e-bmc-kubevirt.yml` (a thin
# `workflow_dispatch` wrapper that sets `bmc_mode: true`, same gating plus
# a second KubeVirtBMC-release gate - see that file's own header), and by
# the upstream ezio repository, which owns the BitTorrent engine this
# scenario seeds and leeches through. ezio ships build-only CI and no test
# suite of its own; calling this workflow gives it a real integration test
# - UEFI boot, real partclone data, a real swarm (opentracker + ezio
# seeder), and a boot check of the disk ezio helped write - for each ezio
# change, by overriding `ezio_ref` with the revision under test.
#
# What this job proves, end to end: KubeVirt + Multus stand up a target
# VM and a provisioning network; a real Image is ingested (qemu-img +
# sfdisk + partclone); an opentracker + ezio seeder swarm serves it; the
# target VM net-boots into a live environment, kezio-agent leeches the
# Image over BitTorrent and writes it to the VM's disk, the VM reboots,
# and the deployed disk actually boots - proven by qemu-guest-agent
# connecting and by reading a marker file back out of the guest.
#
# Every hardcoded image reference the original single-file workflow
# carried is now an `inputs.*` value below, defaulted to kezio's own
# values so kezio's caller is unchanged. `ezio_ref` is the one an ezio
# caller actually needs to touch - it selects the ezio git revision
# docker/seeder/Dockerfile builds (see that Dockerfile's own EZIO_REF ARG
# comment); the image-tag inputs exist so a caller can also swap kezio's
# own component images (or the third-party opentracker image) without
# forking this file, but ezio's own reuse only needs to set ezio_ref.
#
# No secrets are required: every image built here is built from source
# and loaded locally (never pushed), and the only external pulls
# (the Ubuntu cloud image, the opentracker image, ezio's own git clone,
# KubeVirtBMC's release manifest when bmc_mode is set) are all public. A
# caller that needs private registry auth can add a `secrets:` block here
# later; none exists today because nothing in this job needs one.
#
# Topology note (KubeVirtBMC vs. VM-native power): `bmc_mode` (default
# false) selects which of two ways this job gets the target VM powered on
# and PXE-booted:
#   - bmc_mode: false (kezio's own e2e-deploy-kubevirt.yml). kezio's own
#     BMC driver is a later milestone for this path, so the job relies on
#     the VM's own boot order (network first, local disk second) instead
#     of KubeVirtBMC: the harness starts the VM itself (`running: true`),
#     and kezio-agent finalizes a deployment by running `systemctl
#     reboot` inside the live environment itself (see
#     internal/agent/deploy/finalize.go's rebootOrPowerOff), which
#     re-enters the *same* firmware boot order without KubeVirtBMC's
#     help. The Machine no longer needing a net boot (state Provisioned)
#     makes kezio-bootd answer the post-reboot PXE attempt with a fixed
#     "exit" GRUB config (internal/bootserver's needsNetBoot/writeBootLocal)
#     instead of the live kernel/initrd - GRUB's "exit" hands control
#     straight back to firmware, which falls through to the next boot
#     device: the disk kezio-agent just wrote. No boot-order flip, no
#     virtctl restart, and no BMC call are needed to make the VM boot
#     from disk - the net-boot-first order and the agent's own reboot are
#     sufficient by design. This is the intended shape of the state
#     machine, not a stand-in for KubeVirtBMC.
#   - bmc_mode: true (kezio's own e2e-bmc-kubevirt.yml). The target VM is
#     left powered off (`running: false`) and given a Redfish endpoint
#     through KubeVirtBMC (https://github.com/kubevirtbmc/kubevirtbmc's
#     VirtualMachineBMC CRD); the Machine names that endpoint in
#     spec.bmc. kezio's own Redfish driver (internal/bmc/redfish) is what
#     has to power it on: the deployer's Register step
#     (internal/deployer/agent.go) calls SetOneTimePXEBoot then PowerOn
#     against that endpoint, and the same driver answers a real server's
#     BMC over the wire - this is the proof that code path actually
#     drives a VM through KubeVirtBMC, not a mock. After Provisioned, the
#     job also drives a second, independent BMC power cycle by flipping
#     spec.online off then on (internal/controller/machine_controller.go's
#     reconcilePower calls dep.PowerOff/dep.PowerOn, which go through the
#     BMC exactly like Register does), proving the steady-state power
#     path is BMC-driven too, not just the initial PXE boot.
on:
  workflow_call:
    inputs:
      ezio_ref:
        description: >-
          ezio git revision (tag, branch, or commit SHA) that
          docker/seeder/Dockerfile builds into the seeder image. This is the
          input an ezio-repo caller sets to the revision under test
          (for example, the pull request's head SHA). Defaults to the
          same pin docker/seeder/Dockerfile's own EZIO_REF ARG carries, so
          kezio's own caller builds the exact revision it always has.
        required: false
        type: string
        default: "v2.0.29"
      boot_artifacts_version:
        description: >-
          Boot-artifacts release tag to boot (see
          .github/workflows/build-live-image.yml). Empty uses the
          repository's latest published release. Publishing a release is
          a maintainer action in the kezio repository; this input only
          selects among what is already published there.
        required: false
        type: string
        default: ""
      manager_image:
        description: "Image tag to build/use for the kezio controller-manager."
        required: false
        type: string
        default: "example.com/kezio:e2e-deploy"
      bootd_image:
        description: "Image tag to build/use for kezio-bootd (the network-boot server)."
        required: false
        type: string
        default: "example.com/kezio-bootd:e2e-deploy"
      ingest_image:
        description: "Image tag to build/use for the image-ingest Job (qemu-img/sfdisk/partclone)."
        required: false
        type: string
        default: "example.com/kezio-ingest:e2e-deploy"
      seeder_image:
        description: "Image tag to build/use for the ezio seeder (built from ezio_ref by docker/seeder/Dockerfile)."
        required: false
        type: string
        default: "example.com/kezio-seeder:e2e-deploy"
      image_service_image:
        description: "Image tag to build/use for kezio-image-service (the upload/ingest front door)."
        required: false
        type: string
        default: "example.com/kezio-image-service:e2e-deploy"
      opentracker_image:
        description: >-
          BitTorrent tracker image the seeder and leecher announce
          against. Defaults to the same third-party image
          config/seeder/opentracker-deployment.yaml pins.
        required: false
        type: string
        default: "ghcr.io/tunisiano187/opentracker-docker:master"
      bmc_mode:
        description: >-
          When true, leave the target VM powered off and drive it through
          a KubeVirtBMC VirtualMachineBMC/Redfish endpoint instead of the
          harness starting it directly - see this workflow's own
          "Topology note" above for the full behavior difference. kezio's
          e2e-bmc-kubevirt.yml is the only caller that sets this.
        required: false
        type: boolean
        default: false
      kubevirtbmc_version:
        description: >-
          KubeVirtBMC release tag to install when bmc_mode is true (see
          https://github.com/kubevirtbmc/kubevirtbmc's own tag.yml
          release workflow for what "vX.Y.Z" publishes). Unused when
          bmc_mode is false.
        required: false
        type: string
        default: "v0.9.0"
      target_vm_name:
        description: "Name shared by the target VirtualMachine, Machine, and (when bmc_mode is true) VirtualMachineBMC."
        required: false
        type: string
        default: "e2e-deploy-vm"
      target_vm_mac:
        description: "MAC address the target VM's provisioning interface boots from."
        required: false
        type: string
        default: "52:54:00:be:ef:02"
      target_vm_disk_serial:
        description: "Serial number of the target VM's blank data disk, matched by Machine.spec.targetDisk."
        required: false
        type: string
        default: "KEZIOE2EDEPLOYDISK1"
      image_name:
        description: "Name of the Image CR the ingested, marker-customized Ubuntu cloud image is uploaded as."
        required: false
        type: string
        default: "e2e-deploy-ubuntu"
      image_service_token:
        description: "Bearer token kezioctl authenticates the image-service upload with."
        required: false
        type: string
        default: "kezio-e2e-deploy-token"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned the same way e2e-boot-path-kubevirt.yml pins them - bump
  # deliberately, not as a side effect of an unrelated change. These are
  # kezio's own cluster-addon versions, not something an external caller
  # needs to choose, so they stay plain env rather than inputs.
  RKE2_VERSION: "v1.36.2+rke2r1"
  CERT_MANAGER_VERSION: "v1.21.1"
  KUBEVIRT_VERSION: "v1.9.0"
  CDI_VERSION: "v1.65.0"
  # RKE2 has no default StorageClass (unlike k3s's bundled local-path);
  # config/e2e-deploy-path's store/staging PVCs request storageClassName
  # local-path explicitly, so this rancher/local-path-provisioner release
  # is installed and marked default below.
  LOCAL_PATH_PROVISIONER_VERSION: "v0.0.37"
  # Only installed when bmc_mode is true; see inputs.kubevirtbmc_version.
  KUBEVIRTBMC_VERSION: ${{ inputs.kubevirtbmc_version }}

  # The provisioning L2 segment, same shape as e2e-boot-path-kubevirt.yml.
  PROVISIONING_BRIDGE: kezio-prov0
  # Three distinct addresses on that segment, kept apart deliberately:
  #   - PROVISIONING_HOST_IP: the runner host's own address on the
  #     bridge. It anchors only the socat TCP forwards for the
  #     boot/agent servers below - it is NOT bootd's address (bootd
  #     stopped borrowing it when it grew its own net1 address).
  #   - PROVISIONING_BOOTD_NET1_IP: the static address the
  #     kezio-boot-network NetworkAttachmentDefinition assigns to
  #     bootd's net1. It is dnsmasq's dhcp-range subnet anchor, the
  #     relay giaddr, and the TFTP next-server bootd advertises - so
  #     firmware TFTPs straight into bootd's pod with no host-side
  #     UDP/69 forward in the path.
  #   - PROVISIONING_CIDR: the whole segment, handed to bootd as
  #     BOOTD_PROVISIONING_CIDR (its proxyDHCP dhcp-range).
  PROVISIONING_HOST_IP: 192.0.2.1/24
  PROVISIONING_BOOTD_NET1_IP: 192.0.2.2/24
  PROVISIONING_CIDR: 192.0.2.0/24
  # The stand-in "existing site DHCP server" lives in its own netns
  # behind a routed veth off the runner host (see the "Start a
  # lease-only DHCP server" step), on TEST-NET-2 so it can never be
  # confused with the provisioning segment. LEASE_SERVER_IP is what
  # bootd relays to (BOOTD_DHCP_RELAY_SERVER).
  LEASE_VETH_HOST_IP: 198.51.100.1/30
  LEASE_SERVER_IP: 198.51.100.2
  TARGET_VM_NAME: ${{ inputs.target_vm_name }}
  TARGET_VM_MAC: ${{ inputs.target_vm_mac }}
  TARGET_VM_DISK_SERIAL: ${{ inputs.target_vm_disk_serial }}
  # KubeVirtBMC names the Service it creates for a VirtualMachineBMC
  # "<virtualMachineRef.name>-virtbmc" (RedfishSvcPort 80, plain HTTP -
  # KubeVirtBMC does not terminate TLS on this port, hence
  # "redfish+http" rather than "redfish" below). Only used when bmc_mode
  # is true; the VirtualMachineBMC and the Machine live in kezio-system,
  # alongside the VM.
  BMC_REDFISH_ADDRESS: "redfish+http://${{ inputs.target_vm_name }}-virtbmc.kezio-system.svc.cluster.local/redfish/v1/Systems/1"
  BMC_CREDS_SECRET: "${{ inputs.target_vm_name }}-bmc-creds"

  # Ubuntu's "minimal" cloud image - the same source test-e2e.yml's
  # image-path job uses (see that job's own comment for why "minimal"
  # rather than the full cloud image): a bare GPT+ESP+ext4-root disk is
  # exactly what ingest's partition/filesystem handling needs, at
  # roughly half the download/convert/clone time of the full image.
  # /releases/noble/release/ always serves the latest 24.04 LTS point
  # build.
  UBUNTU_CLOUD_IMAGE_URL: "https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img"

  # Image refs come from inputs.* so an external caller (or kezio's own
  # thin dispatch wrappers) can override any of them without editing this
  # file.
  EZIO_REF: ${{ inputs.ezio_ref }}
  MANAGER_IMG: ${{ inputs.manager_image }}
  BOOTD_IMG: ${{ inputs.bootd_image }}
  INGEST_IMG: ${{ inputs.ingest_image }}
  SEEDER_IMG: ${{ inputs.seeder_image }}
  IMAGE_SERVICE_IMG: ${{ inputs.image_service_image }}
  OPENTRACKER_IMG: ${{ inputs.opentracker_image }}
  IMAGE_NAME: ${{ inputs.image_name }}
  IMAGE_SERVICE_TOKEN: ${{ inputs.image_service_token }}

  # The marker file kezio-agent's real partclone write must carry through
  # byte-for-byte, and the file the content-layer check reads back out of
  # the deployed guest through QGA. See the "Customize the Ubuntu cloud
  # image" step for why a freshly baked-in file was chosen over reading
  # some field already present in the stock cloud image (for example
  # /etc/os-release's ID): a value this workflow itself generates and
  # then verifies is a stronger proof that the exact ingested bytes made
  # it through qemu-img convert -> sfdisk slice -> partclone capture ->
  # BitTorrent seed/leech -> partclone restore unmodified, rather than
  # merely proving "some Ubuntu image booted".
  MARKER_PATH: "/etc/kezio-build-id"

jobs:
  deploy-kubevirt:
    name: >-
      ${{ inputs.bmc_mode
        && 'Power and PXE-boot a KubeVirt VM through KubeVirtBMC, deploy through it, and verify'
        || 'Deploy an Image onto a KubeVirt VM through the real agent chain and verify it booted' }}
    runs-on: ubuntu-latest
    # Honest budget: this job pays every cost e2e-boot-path-kubevirt.yml
    # pays (KVM setup, cluster+addon installs, a full live PXE boot) plus
    # every cost test-e2e.yml's image-path job pays (four extra image
    # builds, a several-hundred-MiB cloud image download+convert+clone)
    # plus the deploy-specific stages neither of those pays for on their
    # own: a real partclone write of that content onto the VM's disk, a
    # BitTorrent leech from the seeder to get it there, an in-guest
    # reboot, a second PXE cycle that exits back to firmware, and the
    # deployed OS booting far enough for qemu-guest-agent to connect.
    # bmc_mode adds ten more minutes on top: KubeVirtBMC's own control
    # plane and cert-manager-issued webhook certificate, plus a second
    # BMC power cycle (PowerOff/PowerOn) and guest-agent reconnect wait.
    timeout-minutes: ${{ inputs.bmc_mode && 100 || 90 }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fail fast unless /dev/kvm is usable
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm does not exist on this runner; KubeVirt VMs need hardware virtualization." >&2
            exit 1
          fi
          sudo usermod -aG kvm "$(whoami)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Fail fast unless a boot-artifacts release exists
        # config/boot-artifacts/fetch.sh's initContainer resolves this
        # same BOOT_ARTIFACTS_REPO ("tjjh89017/kezio", hardcoded in
        # config/e2e-boot-path/boot-artifacts-init-patch.yaml and
        # config/bootserver/boot-artifacts-init-patch.yaml, mirrored
        # here) / BOOT_ARTIFACTS_VERSION pair into a GitHub Release asset
        # URL deep inside the "Deploy image-service+seeder..." step
        # below, after the KVM/cluster/image-build setup above has
        # already run. A missing release there surfaces only as
        # fetch-boot-artifacts CrashLoopBackOff-ing and the
        # controller-manager Deployment rollout timing out - no curl
        # output, no obvious cause, and this exact shape has previously
        # been (mis)diagnosed as a pod securityContext bug (see ccfdc28,
        # 5233263) because nothing checked the release existed until
        # this step. Fail here instead, before any of that work is
        # spent, with the actual cause front and center.
        env:
          BOOT_ARTIFACTS_VERSION: ${{ inputs.boot_artifacts_version }}
        run: |
          set -euo pipefail
          repo="tjjh89017/kezio"
          if [ -n "${BOOT_ARTIFACTS_VERSION}" ]; then
            base_url="https://github.com/${repo}/releases/download/${BOOT_ARTIFACTS_VERSION}"
          else
            base_url="https://github.com/${repo}/releases/latest/download"
          fi
          url="${base_url}/sha256sums"
          # -L: GitHub always serves a release-asset download as a 302
          # redirect to a signed CDN URL, never the asset itself at this
          # URL - matching config/boot-artifacts/fetch.sh's own `curl
          # -fsSL`, which follows the same redirect to actually fetch it.
          # Without -L, curl's -w '%{http_code}' reports GitHub's 302
          # here and this check fails even when the release exists.
          code="$(curl -s -L -o /dev/null -w '%{http_code}' "${url}")"
          if [ "${code}" != "200" ]; then
            echo "::error::No boot-artifacts release asset at ${url} (HTTP ${code}). Publish one first: push a \"v*\" tag, or dispatch build-live-image.yml with publish=true (see that workflow's own header comment) - a plain workflow_dispatch of build-live-image.yml without publish=true only validates the build and skips the release step." >&2
            exit 1
          fi

      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=1048576
          sudo sysctl -w fs.inotify.max_user_instances=8192

      - name: Resource check (fail fast if the runner is under-resourced)
        run: |
          set -euo pipefail
          echo "===== CPU ====="
          nproc
          echo "===== Memory ====="
          free -h
          echo "===== Disk ====="
          df -h

          cpus="$(nproc)"
          mem_mb="$(free -m | awk '/^Mem:/{print $2}')"
          disk_avail_gb="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"

          # Union of e2e-boot-path-kubevirt.yml's floor (KubeVirt/CDI
          # control plane + one live-booted VM) and test-e2e.yml's
          # image-path floor (four extra image builds + a real cloud
          # image), plus headroom for the VM actually running a full
          # Ubuntu userspace after this job's deploy (not just the live
          # environment, as in the boot-path lane). When bmc_mode is
          # true, KubeVirtBMC's own control plane (controller + one
          # virtbmc pod per managed VM) is small next to
          # KubeVirt/CDI/cert-manager and already fits inside this floor.
          # RKE2's own control plane (etcd + a heavier apiserver/
          # controller-manager stack than k3s's, plus canal instead of
          # bare flannel) runs roughly 1 GiB heavier than k3s did, but
          # that still fits inside the same 14000 MiB floor - this floor
          # was already sized for the runner having enough RAM at all
          # (ubuntu-latest ships ~16 GiB), not for tracking peak usage
          # precisely, so it is left unchanged rather than pushed against
          # that ceiling.
          if [ "$cpus" -lt 4 ]; then
            echo "::error::Runner has only ${cpus} CPU(s); the KubeVirt full-deploy stage needs at least 4." >&2
            exit 1
          fi
          if [ "$mem_mb" -lt 14000 ]; then
            echo "::error::Runner has only ${mem_mb} MiB RAM; the KubeVirt full-deploy stage needs at least 14000 MiB." >&2
            exit 1
          fi
          if [ "$disk_avail_gb" -lt 25 ]; then
            echo "::error::Runner has only ${disk_avail_gb} GiB free disk; the KubeVirt full-deploy stage needs at least 25 GiB." >&2
            exit 1
          fi

      - name: Create the provisioning bridge
        run: |
          set -euo pipefail
          sudo ip link add "${PROVISIONING_BRIDGE}" type bridge
          sudo ip addr add "${PROVISIONING_HOST_IP}" dev "${PROVISIONING_BRIDGE}"
          sudo ip link set "${PROVISIONING_BRIDGE}" up

      - name: Cache the Ubuntu cloud image
        id: cache-cloud-image
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ubuntu-cloud.img
          key: ubuntu-cloud-image-${{ env.UBUNTU_CLOUD_IMAGE_URL }}

      - name: Download the Ubuntu cloud image
        if: steps.cache-cloud-image.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sfL -o "${{ runner.temp }}/ubuntu-cloud.img" "${UBUNTU_CLOUD_IMAGE_URL}"

      - name: Customize the Ubuntu cloud image with a marker file and qemu-guest-agent
        # Two things this test image needs that the stock download does
        # not have, both injected offline (no network into the image, no
        # boot of the image itself needed):
        #   - MARKER_PATH, containing a token generated fresh by this
        #     run (not baked into the repo) - the content layer's proof
        #     value. See MARKER_PATH's own comment above for why a fresh
        #     marker beats reading a field the stock image already has.
        #   - qemu-guest-agent, installed and enabled: the e2e test image
        #     itself must carry it; production images never need it,
        #     since the controller/boot layers of the three-layer verify
        #     do not depend on guest content.
        # Copied into a fresh path first: the qcow2 gets edited in place
        # below, and the cache step above must keep the pristine download
        # so a re-run with a cache hit customizes a clean copy, not a
        # copy some previous attempt already stamped a marker into.
        #
        # The qcow2 is edited by connecting it as an NBD block device
        # (qemu-nbd) and mounting its root partition directly - no guest
        # boot at all. An earlier revision of this step used libguestfs
        # (virt-customize), which boots a small "supermin" helper
        # appliance to make the same edits; that appliance's own boot
        # time turned out to be the real bottleneck on GitHub-hosted
        # runners, slow enough to time out this step outright. It also
        # once hit a second, narrower problem - virt-customize's
        # `--install` runs apt-get inside the appliance itself, which
        # needs the appliance's own outbound network (a "passt" user-mode
        # NAT) and failed hard on this runner
        # ("libguestfs error: passt exited with status 1"). Fetching the
        # qemu-guest-agent .deb with the host's own apt (real network, no
        # issue) sidestepped that second problem, but not the appliance
        # boot time; dropping libguestfs entirely sidesteps both.
        #
        # qemu-guest-agent has no hard package dependencies beyond
        # libc/libglib that the Ubuntu cloud image already carries, so
        # unpacking its payload with `dpkg-deb -x` (no maintainer scripts
        # run) is enough for a working daemon - only the postinst's
        # systemd-enable step needs to be reproduced by hand, which this
        # script does by reading the unit's own [Install] WantedBy= and
        # creating the same wants-symlink(s) dpkg would have.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils

          cp "${{ runner.temp }}/ubuntu-cloud.img" "${{ runner.temp }}/ubuntu-cloud-marked.img"

          MARKER_TOKEN="$(openssl rand -hex 16)"
          echo "MARKER_TOKEN=${MARKER_TOKEN}" >> "$GITHUB_ENV"

          qga_deb_dir="$(mktemp -d)"
          (cd "${qga_deb_dir}" && apt-get download qemu-guest-agent)
          qga_deb="$(ls "${qga_deb_dir}"/qemu-guest-agent_*.deb)"

          mount_dir="$(mktemp -d)"

          # Runs on every exit path (success or failure) so a broken
          # mount or a still-connected NBD device never wedges the
          # runner. Order matters: unmount before disconnecting the NBD
          # device, never the other way round. Both commands are no-ops
          # (errors suppressed) if their target was never set up, which
          # is normal when this trap fires early.
          cleanup() {
            sudo umount "${mount_dir}" 2>/dev/null || true
            sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
          }
          trap cleanup EXIT

          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 "${{ runner.temp }}/ubuntu-cloud-marked.img"
          sudo partprobe /dev/nbd0
          sudo udevadm settle

          # The Ubuntu cloud image's root filesystem is the largest ext4
          # partition on the disk - the image also carries a small
          # BIOS-boot and/or EFI system partition, neither of which is
          # ext4. Picking by size/filesystem instead of a hardcoded
          # partition number (for example /dev/nbd0p1) tolerates an
          # upstream layout change instead of silently mounting the
          # wrong partition.
          root_part=""
          root_size=0
          # Retry: partprobe/udevadm settle can still race the kernel's
          # nbd partition-node creation, so give it a few bounded
          # attempts before treating "no ext4 partition" as real.
          # Re-validated at this version bump: this is a GitHub Actions
          # runner kernel/udev race, independent of the KubeVirt/CDI/
          # RKE2 pins above, so it is still needed.
          for attempt in $(seq 1 10); do
            root_part=""
            root_size=0
            while read -r part_name part_fstype part_size; do
              [ "${part_fstype}" = "ext4" ] || continue
              if [ "${part_size}" -gt "${root_size}" ]; then
                root_size="${part_size}"
                root_part="/dev/${part_name}"
              fi
            done < <(lsblk -rno NAME,FSTYPE,SIZE --bytes /dev/nbd0)

            [ -n "${root_part}" ] && break
            [ "${attempt}" -eq 10 ] && break
            sleep 2
            sudo partprobe /dev/nbd0
            sudo udevadm settle
          done

          if [ -z "${root_part}" ]; then
            echo "::error::no ext4 partition found on /dev/nbd0" >&2
            lsblk /dev/nbd0
            blkid /dev/nbd0* || true
            exit 1
          fi
          echo "root partition: ${root_part}"

          sudo mount "${root_part}" "${mount_dir}"

          echo "${MARKER_TOKEN}" | sudo tee "${mount_dir}${MARKER_PATH}" >/dev/null

          sudo dpkg-deb -x "${qga_deb}" "${mount_dir}"

          unit_path="$(find "${mount_dir}/lib/systemd/system" "${mount_dir}/usr/lib/systemd/system" \
            -maxdepth 1 -name qemu-guest-agent.service 2>/dev/null | head -n1)"
          if [ -z "${unit_path}" ]; then
            echo "::error::qemu-guest-agent.service unit not found in the extracted package" >&2
            exit 1
          fi
          unit_rel="${unit_path#"${mount_dir}"}"
          echo "qemu-guest-agent unit: ${unit_rel}"

          wanted_by="$(grep -oP '^WantedBy=\K.*' "${unit_path}" || true)"
          wanted_by="${wanted_by:-multi-user.target}"

          for target in ${wanted_by}; do
            sudo mkdir -p "${mount_dir}/etc/systemd/system/${target}.wants"
            sudo ln -sf "${unit_rel}" "${mount_dir}/etc/systemd/system/${target}.wants/qemu-guest-agent.service"
          done

          echo "UBUNTU_CLOUD_IMAGE_PATH=${{ runner.temp }}/ubuntu-cloud-marked.img" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warm the ingest/seeder/image-service image caches
        # Same shape as test-e2e.yml's image-path job: builds (and loads
        # locally, never pushes) the three images `make docker-build-*`
        # build later, with GitHub Actions' layer cache under the same
        # scope names publish.yml uses, so this job and a push to main
        # share one warm cache instead of both paying the from-source
        # debian:sid seeder build cost. The seeder build additionally
        # takes EZIO_REF as a build-arg, so an ezio-repo caller's
        # ezio_ref input actually selects which ezio revision gets built
        # (see docker/seeder/Dockerfile's own EZIO_REF ARG comment).
        run: |
          set -euo pipefail
          for spec in "ingest:docker/ingest/Dockerfile:${INGEST_IMG}" "seeder:docker/seeder/Dockerfile:${SEEDER_IMG}" "image-service:docker/image-service/Dockerfile:${IMAGE_SERVICE_IMG}"; do
            IFS=: read -r scope dockerfile tag <<< "${spec}"
            build_args=()
            if [ "${scope}" = "seeder" ]; then
              build_args+=(--build-arg "EZIO_REF=${EZIO_REF}")
            fi
            docker buildx build \
              --file "${dockerfile}" \
              --tag "${tag}" \
              --cache-from "type=gha,scope=${scope}" \
              --cache-to "type=gha,mode=max,scope=${scope}" \
              "${build_args[@]}" \
              --load \
              .
          done

      - name: Build the manager image
        # Import happens later, in its own "Import images into RKE2
        # containerd" step, once RKE2 (which owns the containerd this
        # needs to import into) is actually installed below.
        run: |
          set -euo pipefail
          go mod tidy
          make docker-build IMG="${MANAGER_IMG}"

      - name: Build the bootd image
        run: |
          set -euo pipefail
          make docker-build-bootd BOOTD_IMG="${BOOTD_IMG}"

      - name: Build kezioctl
        run: |
          set -euo pipefail
          make build-kezioctl

      - name: Write the RKE2 config (must exist before the service starts)
        # cni: [multus, canal] is RKE2's own native way to run Multus
        # alongside a default CNI (https://docs.rke2.io/networking/multus_sriov)
        # - multus must be first in the list, canal is the actual pod
        # network. RKE2 deploys both as its own HelmChart addons at
        # startup; nothing further needs installing for Multus itself (see
        # the "Wait for the Multus NetworkAttachmentDefinition CRD" step
        # below, once the cluster is up).
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/rancher/rke2
          cat <<'EOF' | sudo tee /etc/rancher/rke2/config.yaml
          write-kubeconfig-mode: "0644"
          cni:
            - multus
            - canal
          EOF

      - name: Install RKE2
        run: |
          set -euo pipefail
          curl -sfL https://get.rke2.io | sudo INSTALL_RKE2_VERSION="${RKE2_VERSION}" sh -
          sudo systemctl enable --now rke2-server.service

          # kubectl/ctr/crictl ship under /var/lib/rancher/rke2/bin, not on
          # PATH by default - symlink them into /usr/local/bin (inside
          # sudo's secure_path) the same way the k3s installer always put
          # its own "k3s" binary there.
          sudo ln -sf /var/lib/rancher/rke2/bin/kubectl /usr/local/bin/kubectl
          sudo ln -sf /var/lib/rancher/rke2/bin/ctr /usr/local/bin/ctr
          sudo ln -sf /var/lib/rancher/rke2/bin/crictl /usr/local/bin/crictl

          echo "KUBECONFIG=/etc/rancher/rke2/rke2.yaml" >> "$GITHUB_ENV"
          export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
          # RKE2's control plane (etcd + canal + multus HelmChart addons)
          # takes longer to reach node-Ready than k3s's bare flannel did,
          # hence the more generous timeout below versus the old 120s.
          for _ in $(seq 1 90); do
            [ "$(kubectl get nodes --no-headers 2>/dev/null | wc -l)" -ge 1 ] && break
            sleep 2
          done
          kubectl wait --for=condition=Ready node --all --timeout=300s
          kubectl get nodes -o wide

      - name: Allow bridged traffic on the provisioning bridge (bypass canal's FORWARD filtering)
        # RKE2's canal CNI loads br_netfilter
        # (net.bridge.bridge-nf-call-iptables=1), which routes every
        # bridged L2 frame - including this bridge's, even though it
        # carries no cluster pod traffic - through the host's netfilter
        # FORWARD chain. kube-proxy/canal leave that chain's default
        # policy at DROP once the cluster is up
        # (https://github.com/kubernetes/kubernetes/issues/39823,
        # https://github.com/kubernetes/kubernetes/issues/91545), which
        # silently eats the VM's PXE DHCP DISCOVER broadcast travelling
        # between its Multus port and bootd's Multus port on this
        # bridge. Run after the node is Ready (canal has had the chance
        # to program its own FORWARD rules by then) and idempotently -
        # -C before -I - in case a later canal reconciliation touches
        # the chain again: add an ACCEPT scoped to this bridge's own
        # port-to-port traffic only, so cluster filtering everywhere
        # else is untouched.
        run: |
          set -euo pipefail
          if command -v iptables >/dev/null 2>&1; then
            sudo iptables -C FORWARD -i "${PROVISIONING_BRIDGE}" -o "${PROVISIONING_BRIDGE}" -j ACCEPT 2>/dev/null || \
              sudo iptables -I FORWARD -i "${PROVISIONING_BRIDGE}" -o "${PROVISIONING_BRIDGE}" -j ACCEPT
          fi
          # RKE2/canal can also run with the kernel's nf_tables backend
          # instead of legacy iptables; when the "inet filter" table
          # exists, mirror the same exemption there so the bridge is
          # covered regardless of which backend actually owns FORWARD.
          if command -v nft >/dev/null 2>&1 && sudo nft list table inet filter >/dev/null 2>&1; then
            sudo nft list chain inet filter FORWARD 2>/dev/null | grep -q "iifname \"${PROVISIONING_BRIDGE}\" oifname \"${PROVISIONING_BRIDGE}\" accept" || \
              sudo nft insert rule inet filter FORWARD iifname "${PROVISIONING_BRIDGE}" oifname "${PROVISIONING_BRIDGE}" accept
          fi

          # Also allow routed traffic between the bridge and the cluster's
          # pod network, both directions, scoped to the node's pod CIDR.
          # The target VM's ezio leecher joins the seeder's swarm by
          # connecting straight to the seeder pod's IP:16881 (the address
          # the tracker hands out - see config/seeder/README.md's no-NAT
          # rule) and announces to the opentracker Service's ClusterIP,
          # which kube-proxy's PREROUTING DNATs to the tracker pod before
          # this chain sees it. Both flows arrive on the bridge and leave
          # into the pod network (and back), and the FORWARD policy is
          # DROP once the cluster is up (run 31067834491's diagnostics
          # dump shows the chain), so without these two accepts the swarm
          # traffic dies here. Same idempotent -C-before--I shape as the
          # bridge-to-bridge rule above.
          pod_cidr="$(kubectl get node -o jsonpath='{.items[0].spec.podCIDR}')"
          if command -v iptables >/dev/null 2>&1; then
            sudo iptables -C FORWARD -i "${PROVISIONING_BRIDGE}" -d "${pod_cidr}" -j ACCEPT 2>/dev/null || \
              sudo iptables -I FORWARD -i "${PROVISIONING_BRIDGE}" -d "${pod_cidr}" -j ACCEPT
            sudo iptables -C FORWARD -o "${PROVISIONING_BRIDGE}" -s "${pod_cidr}" -j ACCEPT 2>/dev/null || \
              sudo iptables -I FORWARD -o "${PROVISIONING_BRIDGE}" -s "${pod_cidr}" -j ACCEPT
          fi
          if command -v nft >/dev/null 2>&1 && sudo nft list table inet filter >/dev/null 2>&1; then
            sudo nft list chain inet filter FORWARD 2>/dev/null | grep -q "iifname \"${PROVISIONING_BRIDGE}\" ip daddr ${pod_cidr} accept" || \
              sudo nft insert rule inet filter FORWARD iifname "${PROVISIONING_BRIDGE}" ip daddr "${pod_cidr}" accept
            sudo nft list chain inet filter FORWARD 2>/dev/null | grep -q "oifname \"${PROVISIONING_BRIDGE}\" ip saddr ${pod_cidr} accept" || \
              sudo nft insert rule inet filter FORWARD oifname "${PROVISIONING_BRIDGE}" ip saddr "${pod_cidr}" accept
          fi

      - name: Fill UDP checksums for PXE DHCP crossing the provisioning bridge
        # The target VM's virtio-net leaves UDP checksums to be filled in
        # by "hardware" (CHECKSUM_PARTIAL) rather than computing them
        # itself. That is fine as long as the frame stays on a path that
        # keeps honouring the offload flag, but this frame's actual path -
        # tap device -> this Linux bridge -> a Multus veth -> bootd's pod
        # network namespace - crosses a device boundary that never
        # performs the fill, so the DHCP DISCOVER/OFFER datagrams arrive
        # at bootd's UDP socket with a checksum field the kernel considers
        # invalid and silently drops before the socket ever sees them.
        # This is the same failure libvirt's own virtual networks hit
        # (DHCP packets sent to VMs have no checksum due to a longstanding
        # bug when vhost-net is on the same host as the DHCP service) and
        # the same fix: an iptables mangle CHECKSUM --checksum-fill rule,
        # scoped to this bridge and to the two DHCP ports (67 server,
        # 68 client) - libvirt's own generated rule is
        # `-A POSTROUTING -o virbr0 -p udp -m udp --dport 68 -j CHECKSUM
        # --checksum-fill` (see libvirt commit "Add iptables rule to fixup
        # DHCP response checksum", libvir-list 2010-08); port 67 is added
        # here too since this bridge carries the DISCOVER direction (VM ->
        # bootd) as well, not only the reply. nft has no CHECKSUM target
        # equivalent, so when nft is the active backend and iptables
        # cannot be used, disabling tx checksum offload on the bridge
        # itself (`ethtool -K ... tx off`) is the fallback - cruder
        # (it stops the kernel from ever leaving a partial checksum on
        # anything forwarded through the bridge, not just DHCP) but it
        # covers the same failure mode. Idempotent (-C before -A) so a
        # re-run or a later reconciliation never duplicates the rule.
        run: |
          set -euo pipefail
          if command -v iptables >/dev/null 2>&1; then
            for port in 67 68; do
              sudo iptables -t mangle -C POSTROUTING -o "${PROVISIONING_BRIDGE}" -p udp --dport "${port}" -j CHECKSUM --checksum-fill 2>/dev/null || \
                sudo iptables -t mangle -A POSTROUTING -o "${PROVISIONING_BRIDGE}" -p udp --dport "${port}" -j CHECKSUM --checksum-fill
            done
          else
            sudo ethtool -K "${PROVISIONING_BRIDGE}" tx off || true
          fi

      - name: Start a lease-only DHCP server in a netns behind a routed veth (stands in for the site's existing DHCP server)
        # bootd's dnsmasq is proxyDHCP only - it never assigns
        # addresses. A real site keeps its existing DHCP server for
        # leases, and bootd relays the segment's lease traffic to it
        # (BOOTD_DHCP_RELAY_SERVER -> dnsmasq's dhcp-relay). This
        # dnsmasq plays that existing server: port=0 (no DNS), one
        # lease range on the provisioning subnet, nothing else.
        #
        # It runs in its OWN network namespace behind a routed veth
        # (LEASE_SERVER_IP), one L3 hop behind the runner host - the
        # "existing DHCP server reachable via the segment's gateway"
        # model. Two reasons, both load-bearing:
        #
        #  1. It must never hear the bridge's broadcasts - the only
        #     path from the target VM to this server is bootd's relay
        #     (giaddr'd unicast), which is exactly the path this lane
        #     must prove. A netns off the bridge guarantees that
        #     structurally.
        #  2. Binding it to the host's uplink address (the previous
        #     shape) can never receive the relay at all: dnsmasq
        #     resolves the ARRIVAL interface of every DHCP packet
        #     (SIOCGIFADDR + iface_check/check_listen_addrs, dhcp.c)
        #     and silently discards packets arriving on an interface
        #     its listen config does not cover - and a relayed unicast
        #     to the uplink address necessarily arrives via the
        #     provisioning bridge. In the netns the packet arrives on
        #     lease0, the very interface the listen-address lives on.
        #
        # The host forwards between the bridge and the veth
        # (ip_forward, plus FORWARD accepts scoped to this interface
        # pair - kube-proxy/canal leave FORWARD's default policy at
        # DROP, same reason as the bridged-traffic exemption step
        # above). Relayed replies go back to the giaddr (bootd's net1
        # address on the bridge), and bootd's dnsmasq re-emits them
        # onto the segment.
        #
        # dnsmasq-base, not dnsmasq: the -base package ships only the
        # binary, with no distro service unit that would auto-start a
        # port-53 DNS server with the stock config behind our back.
        # This install happens on the ephemeral CI runner host only.
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends dnsmasq-base
          sudo ip netns add kezio-lease
          sudo ip link add kezio-lease0 type veth peer name lease0
          sudo ip link set lease0 netns kezio-lease
          sudo ip addr add "${LEASE_VETH_HOST_IP}" dev kezio-lease0
          sudo ip link set kezio-lease0 up
          sudo ip netns exec kezio-lease ip link set lo up
          sudo ip netns exec kezio-lease ip addr add "${LEASE_SERVER_IP}/30" dev lease0
          sudo ip netns exec kezio-lease ip link set lease0 up
          sudo ip netns exec kezio-lease ip route add default via "${LEASE_VETH_HOST_IP%%/*}"
          sudo sysctl -w net.ipv4.ip_forward=1
          if command -v iptables >/dev/null 2>&1; then
            sudo iptables -C FORWARD -i "${PROVISIONING_BRIDGE}" -o kezio-lease0 -j ACCEPT 2>/dev/null || \
              sudo iptables -I FORWARD -i "${PROVISIONING_BRIDGE}" -o kezio-lease0 -j ACCEPT
            sudo iptables -C FORWARD -i kezio-lease0 -o "${PROVISIONING_BRIDGE}" -j ACCEPT 2>/dev/null || \
              sudo iptables -I FORWARD -i kezio-lease0 -o "${PROVISIONING_BRIDGE}" -j ACCEPT
          fi
          if command -v nft >/dev/null 2>&1 && sudo nft list table inet filter >/dev/null 2>&1; then
            sudo nft list chain inet filter FORWARD 2>/dev/null | grep -q "iifname \"${PROVISIONING_BRIDGE}\" oifname \"kezio-lease0\" accept" || \
              sudo nft insert rule inet filter FORWARD iifname "${PROVISIONING_BRIDGE}" oifname "kezio-lease0" accept
            sudo nft list chain inet filter FORWARD 2>/dev/null | grep -q "iifname \"kezio-lease0\" oifname \"${PROVISIONING_BRIDGE}\" accept" || \
              sudo nft insert rule inet filter FORWARD iifname "kezio-lease0" oifname "${PROVISIONING_BRIDGE}" accept
          fi
          # dhcp-option 3 (router): the runner host's own bridge address,
          # explicitly. Left to its default on a relayed request, dnsmasq
          # advertises giaddr as the router - bootd's net1 (192.0.2.2),
          # observed as "option: 3 router 192.0.2.2" in run 31067834491's
          # host-dnsmasq.log - and bootd's pod does not forward, so every
          # off-subnet packet the VM ever sends (the ezio leecher's
          # tracker announce and its BT connection to the seeder pod's
          # 10.42.x.x:16881, see "Deploy image-service+seeder..." below)
          # black-holes inside the bootd pod. The runner host IS this
          # segment's real gateway: it owns the bridge address and routes
          # into the cluster's pod network.
          cat <<EOF | sudo tee /etc/kezio-host-dnsmasq.conf
          port=0
          bind-interfaces
          listen-address=${LEASE_SERVER_IP}
          dhcp-range=192.0.2.10,192.0.2.100,255.255.255.0,12h
          dhcp-option=option:router,${PROVISIONING_HOST_IP%%/*}
          no-ping
          log-dhcp
          log-facility=${RUNNER_TEMP}/host-dnsmasq.log
          dhcp-leasefile=${RUNNER_TEMP}/host-dnsmasq.leases
          EOF
          sudo ip netns exec kezio-lease dnsmasq --conf-file=/etc/kezio-host-dnsmasq.conf
          echo "RELAY_DHCP_SERVER_IP=${LEASE_SERVER_IP}" >> "$GITHUB_ENV"

      - name: Start capturing the provisioning bridge (tcpdump)
        # Definitive instrumentation regardless of whether the checksum
        # fix above is the actual/only cause: capture every DHCP/TFTP
        # frame that crosses the bridge, from before the target VM even
        # exists through however this job ends, so a future failure has
        # the real wire contents (including whether the checksum field
        # is actually zero/invalid) to look at instead of only inference
        # from the FORWARD counters. Backgrounded the same way the
        # console capture below is; `|| true` on both the install and the
        # capture start so a runner without tcpdump (or a permissions
        # hiccup) never fails the job over an optional diagnostic.
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends tcpdump || true
          sudo -- sh -c "nohup tcpdump -i '${PROVISIONING_BRIDGE}' -w '${RUNNER_TEMP}/bridge.pcap' \
            udp port 67 or port 68 or port 69 \
            >/tmp/tcpdump-bridge.log 2>&1 &"

      - name: Install local-path-provisioner and mark it the default StorageClass
        # RKE2 ships no default StorageClass (k3s bundled local-path by
        # default; RKE2 deliberately does not). config/e2e-deploy-path's
        # store/staging PVCs request storageClassName local-path
        # explicitly, so that name must exist and be default is a
        # reasonable fallback for anything else (e.g. CDI's own scratch
        # space) that resolves a StorageClass by cluster default instead.
        run: |
          set -euo pipefail
          kubectl apply -f "https://raw.githubusercontent.com/rancher/local-path-provisioner/${LOCAL_PATH_PROVISIONER_VERSION}/deploy/local-path-storage.yaml"
          kubectl -n local-path-storage rollout status deployment/local-path-provisioner --timeout=180s
          kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

      - name: Import images into RKE2 containerd
        # RKE2's containerd socket is still under /run/k3s/containerd (a
        # genuine leftover of RKE2's k3s lineage - the socket path itself,
        # not the cluster, is k3s-named), and the plain "ctr" binary needs
        # both -a (socket) and -n k8s.io (the namespace the kubelet reads
        # from) spelled out explicitly - unlike k3s's own "k3s ctr"
        # wrapper, which defaulted both on its own.
        run: |
          set -euo pipefail
          for img in "${MANAGER_IMG}" "${BOOTD_IMG}" "${INGEST_IMG}" "${SEEDER_IMG}" "${IMAGE_SERVICE_IMG}"; do
            docker save "${img}" | sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import -
          done

      - name: Install cert-manager
        # Installed before KubeVirt, both for node-contention reasons and
        # (when bmc_mode is true) because it is also a hard prerequisite
        # for KubeVirtBMC's webhook certificate below.
        run: |
          set -euo pipefail
          kubectl apply -f "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.yaml"
          for d in cert-manager cert-manager-webhook cert-manager-cainjector; do
            kubectl wait deployment.apps/"${d}" --for condition=Available --namespace cert-manager --timeout=180s
          done

      - name: Install KubeVirt
        # The KubevirtSeccompProfile feature gate plus seccompConfiguration
        # patch below made virt-launcher pods admissible back when the
        # "Deploy CRDs and the controller-manager" step still enforced
        # restricted PSA on kezio-system (that step now labels the
        # namespace privileged - bootd's dnsmasq needs NET_ADMIN/NET_RAW -
        # so the gate is no longer load-bearing for admission, but it is
        # kept: an explicit seccompProfile on virt-launcher pods costs
        # nothing and keeps every pod as strict as the namespace label
        # allows). The original failure mode: without it, KubeVirt
        # renders the compute/guest-console-log containers with no
        # explicit securityContext.seccompProfile, which the "restricted"
        # Pod Security Standard rejects outright (every virt-launcher pod
        # creation then fails admission and the target VM never starts,
        # observed as repeated "it needs a privileged namespace to run"
        # FailedCreate events on the VirtualMachineInstance). Enabling the
        # gate makes KubeVirt stamp its pods with an explicit
        # seccompProfile, satisfying that requirement. Re-validated
        # against KubeVirt v1.9.0: KubevirtSeccompProfile is still Beta
        # (pkg/virt-config/featuregate/active.go), not default-on, so the
        # gate and patch are both still required.
        run: |
          set -euo pipefail
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-operator.yaml"
          kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-cr.yaml"
          kubectl patch kubevirt kubevirt -n kubevirt --type=merge -p '{
            "spec": {
              "configuration": {
                "developerConfiguration": {"featureGates": ["KubevirtSeccompProfile"]},
                "seccompConfiguration": {
                  "virtualMachineInstanceProfile": {
                    "customProfile": {"localhostProfile": "kubevirt/kubevirt.json"}
                  }
                }
              }
            }
          }'
          kubectl -n kubevirt wait kubevirt kubevirt --for=condition=Available --timeout=300s

      - name: Install virtctl
        run: |
          set -euo pipefail
          curl -sfL -o /tmp/virtctl \
            "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/virtctl-${KUBEVIRT_VERSION}-linux-amd64"
          sudo install -m 0755 /tmp/virtctl /usr/local/bin/virtctl
          rm -f /tmp/virtctl

      - name: Install CDI
        run: |
          set -euo pipefail
          kubectl apply -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-operator.yaml"
          kubectl apply -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-cr.yaml"
          kubectl wait cdi cdi --for=condition=Available --timeout=300s

      - name: Wait for the Multus NetworkAttachmentDefinition CRD (RKE2's own rke2-multus HelmChart addon)
        # RKE2 deploys Multus itself, as one of its own packaged HelmChart
        # addons (triggered by cni: [multus, canal] in the config.yaml
        # written before RKE2 started - see the "Write the RKE2 config"
        # step above), the same way it deploys canal - no separate
        # manifest apply and no host CNI directory surgery are needed
        # here, unlike k3s's non-standard, multi-location CNI layout
        # (config under /var/lib/rancher/k3s/agent/etc/cni/net.d, plugin
        # binaries split across /var/lib/rancher/k3s/data/cni and a
        # per-version /var/lib/rancher/k3s/data/<hash>/bin, neither of
        # which is the stock /etc/cni/net.d /opt/cni/bin location
        # multus-daemonset-thick.yml's hostPath mounts assumed) that
        # caused two rounds of mirror-image plugin-not-found failures
        # (run 31003551730: flannel not found; run 31005051325:
        # multus-shim not found). The addon's own HelmChart install can
        # still lag behind node-Ready, so wait for its NAD CRD to actually
        # exist (and be Established) before the "Create the provisioning
        # NetworkAttachmentDefinition" step below tries to use it.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          until kubectl get crd network-attachment-definitions.k8s.cni.cncf.io >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::network-attachment-definitions.k8s.cni.cncf.io CRD did not appear within the timeout - RKE2's rke2-multus HelmChart addon may not have installed." >&2
              kubectl get helmcharts -A -o wide || true
              kubectl -n kube-system get pods -o wide || true
              exit 1
            fi
            sleep 5
          done
          kubectl wait --for=condition=Established crd/network-attachment-definitions.k8s.cni.cncf.io --timeout=60s

      - name: Install KubeVirtBMC
        if: ${{ inputs.bmc_mode }}
        # One release asset, "kubevirtbmc-install.yaml" (CRD, RBAC,
        # cert-manager Certificate/Issuer, webhook, controller
        # Deployment), published by KubeVirtBMC's own tag.yml on every
        # "v*" tag. `kubectl wait --for condition=Available` on its
        # Deployment also waits out cert-manager issuing the webhook
        # certificate the Deployment's pod mounts (the pod cannot start
        # until that Secret exists).
        run: |
          set -euo pipefail
          kubectl apply -f "https://github.com/kubevirtbmc/kubevirtbmc/releases/download/${KUBEVIRTBMC_VERSION}/kubevirtbmc-install.yaml"
          kubectl -n kubevirtbmc-system wait deployment/kubevirtbmc-controller-manager --for=condition=Available --timeout=300s

      - name: Deploy CRDs and the controller-manager
        run: |
          set -euo pipefail
          make install
          make deploy IMG="${MANAGER_IMG}"
          # privileged, not restricted: bootd's dnsmasq child needs NET_ADMIN/NET_RAW, outside both the restricted and baseline PSA profiles - see config/bootd/deployment.yaml's capabilities comment. Every pod keeps its own strict securityContext regardless.
          kubectl label --overwrite ns kezio-system pod-security.kubernetes.io/enforce=privileged
          kubectl rollout status deployment/kezio-controller-manager -n kezio-system --timeout=180s

      - name: Create the provisioning NetworkAttachmentDefinitions
        # TWO NADs on the SAME bridge, split on purpose:
        #
        # kezio-boot-network (static ipam) is for the bootd pod ONLY.
        # bootd's net1 must carry a fixed address
        # (PROVISIONING_BOOTD_NET1_IP) on the provisioning subnet -
        # dnsmasq binds its DHCP sockets to net1, uses this address as
        # the dhcp-relay giaddr, and BOOTD_SERVER_IP advertises it as
        # the TFTP next-server. The runner host keeps
        # PROVISIONING_HOST_IP on the same bridge, so the two never
        # collide.
        #
        # kezio-boot-network-vm ("ipam": {}) is for the target VM's
        # provisioning NIC. The VM must NOT attach the static-ipam NAD:
        # when a KubeVirt bridge-mode interface's network carries IPAM,
        # virt-launcher starts its own in-pod DHCP server on that NIC
        # to hand the pod's CNI-assigned address to the guest - and the
        # static plugin hands EVERY attaching pod the same address, so
        # that rogue server offers the guest bootd's own
        # 192.0.2.2 (observed live: a 169.254.75.10 server answered
        # every DISCOVER before bootd with Your-IP 192.0.2.2, the
        # firmware took it and PXE died with PXE-E16). With empty ipam
        # virt-launcher runs no DHCP there, and the guest firmware does
        # real DHCP on the wire against bootd + the relayed lease
        # server, which is exactly what this lane must exercise.
        #
        # Chains the "tuning" CNI plugin onto the plain bridge attachment
        # to force net1's reverse-path filter loose (rp_filter=0) inside
        # bootd's own network namespace, IFNAME substituted by the tuning
        # plugin for whatever interface name the bridge plugin gave this
        # attachment (net1 here). A DHCPDISCOVER arrives with source
        # 0.0.0.0, destination 255.255.255.255 - a source address a
        # strict/loose reverse-path check can still refuse to accept
        # depending on kernel version and the namespace's inherited
        # sysctl defaults, and unlike a host-wide sysctl this setting
        # lives with the attachment itself (config/bootd's own
        # NetworkAttachmentDefinition example carries the same plugin so
        # a real deployment gets it too), reaching only bootd's net1
        # rather than every interface on the node.
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network
            namespace: kezio-system
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "name": "kezio-boot-network",
                "plugins": [
                  {
                    "type": "bridge",
                    "bridge": "${PROVISIONING_BRIDGE}",
                    "ipam": {
                      "type": "static",
                      "addresses": [
                        {"address": "${PROVISIONING_BOOTD_NET1_IP}"}
                      ]
                    }
                  },
                  {
                    "type": "tuning",
                    "sysctl": {
                      "net.ipv4.conf.IFNAME.rp_filter": "0"
                    }
                  }
                ]
              }
          EOF
          # No tuning chain here: the VM's traffic is bridged at L2
          # straight through virt-launcher's pod into the guest, so the
          # pod netns's IP-layer reverse-path filter never sees it.
          cat <<EOF | kubectl apply -f -
          apiVersion: k8s.cni.cncf.io/v1
          kind: NetworkAttachmentDefinition
          metadata:
            name: kezio-boot-network-vm
            namespace: kezio-system
          spec:
            config: |
              {
                "cniVersion": "0.3.1",
                "name": "kezio-boot-network-vm",
                "plugins": [
                  {
                    "type": "bridge",
                    "bridge": "${PROVISIONING_BRIDGE}",
                    "ipam": {}
                  }
                ]
              }
          EOF

      - name: Create the image-service bearer token Secret
        run: |
          set -euo pipefail
          kubectl -n kezio-system create secret generic kezio-image-service-token \
            --from-literal=token="${IMAGE_SERVICE_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy image-service+seeder+store+boot/agent servers, wire real ingest/seeding/deploy
        # Applies config/e2e-deploy-path (see that overlay's own doc
        # comment for why it exists instead of composing
        # config/e2e-image-path and config/e2e-boot-path directly), then
        # wires every per-run value kustomize's static YAML cannot
        # express onto the controller-manager in one `kubectl set env` -
        # the union of `make deploy-image-path`'s and `make
        # deploy-boot-path`'s own env sets, plus real
        # fetch-boot-artifacts wiring the same way
        # e2e-boot-path-kubevirt.yml adds it (see that workflow's own
        # step of the same name for why it is not part of the shared
        # overlay). The seeder and opentracker image edits are what let
        # a caller's seeder_image/opentracker_image inputs actually reach
        # the swarm this job stands up.
        env:
          BOOT_ARTIFACTS_VERSION: ${{ inputs.boot_artifacts_version }}
        run: |
          set -euo pipefail
          cd config/manager && ../../bin/kustomize edit set image controller="${MANAGER_IMG}"
          cd ../..
          cd config/image-service && ../../bin/kustomize edit set image "image-service=${IMAGE_SERVICE_IMG}"
          cd ../..
          cd config/seeder
          ../../bin/kustomize edit set image "seeder=${SEEDER_IMG}"
          ../../bin/kustomize edit set image "ghcr.io/tunisiano187/opentracker-docker=${OPENTRACKER_IMG}"
          cd ../..
          bin/kustomize build config/e2e-deploy-path | kubectl apply -f -

          # SEEDER_TRACKER_URL uses the opentracker Service's ClusterIP
          # as a literal, not its cluster-DNS name and not a socat
          # forward on the bridge address (the way 8090/8091 are
          # forwarded below). This one URL ends up in every .torrent's
          # announce field for BOTH swarm sides - the seeder reconciler's
          # torrents and the .torrent bytes the agent server hands the
          # target VM's leecher - and opentracker registers each peer at
          # its announce's source address:
          #   - The DNS name resolves fine in-cluster but the VM has no
          #     cluster DNS, so its leecher could never announce at all
          #     (run 31067834491: WritingContent stalled at 0%, the
          #     tracker's only peer was the seeder). The ClusterIP
          #     literal is the same address the name resolves to, so the
          #     seeder's announce path is unchanged, and the VM can
          #     reach it by routing: its default gateway is the runner
          #     host (dhcp-option:router above), where kube-proxy's
          #     PREROUTING DNAT applies to forwarded traffic too.
          #   - A socat forward would re-originate the seeder's announce
          #     from the host, registering the seeder at the host's
          #     cluster-side address instead of its pod IP:16881 - the
          #     exact announce!=reachable mismatch config/seeder/
          #     README.md's no-NAT rule forbids - and the leecher would
          #     be handed a dead peer address.
          # Read before the `kubectl set env` below so the controller
          # (seeder reconciler + agent server) starts with the final URL
          # and no restart is needed; the Service already exists (the
          # apply above created it) and its ClusterIP is immutable.
          tracker_clusterip="$(kubectl -n kezio-system get svc kezio-opentracker -o jsonpath='{.spec.clusterIP}')"

          kubectl -n kezio-system set env deployment/kezio-controller-manager \
            INGEST_IMAGE="${INGEST_IMG}" \
            INGEST_STORE_PVC=kezio-store \
            INGEST_STAGING_PVC=kezio-image-service-staging \
            SEEDER_TRACKER_URL="http://${tracker_clusterip}:6969/announce" \
            SEEDER_STORE_ROOT=/store \
            SEEDER_SERVICE_NAMESPACE=kezio-system \
            SEEDER_SERVICE_NAME=kezio-ezio-seeder \
            BOOT_SERVER_ADDR=:8090 \
            BOOT_ARTIFACTS_DIR=/boot-artifacts \
            BOOT_SERVER_URL="http://${PROVISIONING_HOST_IP%%/*}:8090" \
            AGENT_SERVER_ADDR=:8091 \
            BOOT_AGENT_SERVER_URL="http://${PROVISIONING_HOST_IP%%/*}:8091" \
            DEPLOYER=agent

          kubectl -n kezio-system create configmap boot-artifacts-fetch-script \
            --from-file=fetch.sh=config/boot-artifacts/fetch.sh \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n kezio-system patch deployment/kezio-controller-manager --type=json \
            --patch-file=config/e2e-boot-path/boot-artifacts-init-patch.yaml
          if [ -n "${BOOT_ARTIFACTS_VERSION}" ]; then
            kubectl -n kezio-system set env deployment/kezio-controller-manager \
              -c fetch-boot-artifacts "BOOT_ARTIFACTS_VERSION=${BOOT_ARTIFACTS_VERSION}"
          fi

          kubectl rollout status deployment/kezio-controller-manager -n kezio-system --timeout=180s
          for d in kezio-image-service kezio-ezio-seeder kezio-opentracker; do
            kubectl rollout status deployment/"${d}" -n kezio-system --timeout=180s
          done

          # Same early-failure shape as the socat forwards' curl check
          # below: prove the tracker actually answers HTTP on the
          # ClusterIP baked into the announce URL. No -f: an HTTP error
          # body (opentracker answers a parameterless /announce with a
          # bencoded failure) still proves TCP+HTTP reachability; only a
          # connect failure should fail the job here.
          if ! curl -s -o /dev/null --max-time 10 "http://${tracker_clusterip}:6969/announce"; then
            echo "::error::opentracker not reachable at ${tracker_clusterip}:6969 (the announce URL every .torrent carries)" >&2
            exit 1
          fi

      - name: Forward the boot/agent servers onto the provisioning bridge
        # kezio-boot-server and kezio-agent-server (both just created
        # above, BOOT_SERVER_URL/BOOT_AGENT_SERVER_URL already pointing at
        # this bridge address) are plain ClusterIP Services - reachable
        # only from inside the cluster network. config/bootserver/
        # README.md's and config/agentserver/README.md's own "Make the
        # Service reachable from the boot network" steps call this out as
        # something every real deployment still has to patch in (NodePort,
        # LoadBalancer, hostNetwork, or a reverse proxy); this e2e lane
        # was shipping neither, so the target VM - which lives on the raw
        # kezio-prov0 bridge with no cluster DNS and no route to a
        # ClusterIP - could reach neither the boot config server (so GRUB
        # never actually fetched a kernel to boot) nor the agent
        # registration server (so a live-booted kezio-agent would 404
        # forever - see 439f7a7's commit message for that half of the
        # bug). kezio-bootd solves the equivalent problem for its own
        # proxyDHCP/TFTP traffic by running as a Multus-attached pod
        # directly on this bridge (see config/bootd/
        # networkattachmentdefinition.example.yaml's "Why Multus, not
        # hostNetwork" section) - not reused here because attaching the whole
        # controller-manager Pod (leader election, the mutating/
        # validating webhooks, every other controller) onto an isolated
        # test L2 segment is a much bigger blast radius than this narrow
        # reachability gap needs.
        #
        # Plain host-level TCP forwarding instead: the runner *is* the
        # bridge's host network namespace (the "Create the provisioning
        # bridge" step above ran `ip addr add` directly on the runner,
        # not inside any container), so it already sits on the same
        # broadcast domain as the target VM's provisioning NIC and can
        # reach each Service's ClusterIP over the cluster's own pod
        # network. socat listens on the host's own bridge address
        # (${PROVISIONING_HOST_IP%%/*} - only these two TCP forwards;
        # TFTP needs no host forward, since bootd advertises its own
        # net1 address as next-server) and relays to
        # each Service's ClusterIP rather than a specific Pod IP, so a
        # Pod restart does not stop the forward from working - the same
        # property kube-proxy's own iptables rules would give a Pod
        # reaching the Service normally.
        #
        # The opentracker announce port (6969) is deliberately NOT
        # forwarded this way: a socat hop would re-originate the
        # seeder's announce from the host and register the seeder at
        # the wrong address (see the SEEDER_TRACKER_URL comment in the
        # deploy step above). HTTP is announce-source-agnostic, so 8090/
        # 8091 have no such constraint and socat is fine for them.
        run: |
          set -euo pipefail
          command -v socat >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq socat)

          bridge_ip="${PROVISIONING_HOST_IP%%/*}"
          boot_clusterip="$(kubectl -n kezio-system get svc kezio-boot-server -o jsonpath='{.spec.clusterIP}')"
          agent_clusterip="$(kubectl -n kezio-system get svc kezio-agent-server -o jsonpath='{.spec.clusterIP}')"

          # nohup + disown: these must keep running for the rest of the
          # job (through however long the VM takes to net-boot and
          # register), well past this step's own shell exiting - the same
          # backgrounding this workflow already relies on for the
          # image-service port-forward below, except that one is torn
          # down right after its one use and these are not, since every
          # later step depends on them staying up.
          nohup socat TCP-LISTEN:8090,bind="${bridge_ip}",fork,reuseaddr "TCP:${boot_clusterip}:8090" \
            >/tmp/socat-boot-server.log 2>&1 &
          disown
          nohup socat TCP-LISTEN:8091,bind="${bridge_ip}",fork,reuseaddr "TCP:${agent_clusterip}:8091" \
            >/tmp/socat-agent-server.log 2>&1 &
          disown

          sleep 1
          if ! curl -sf -o /dev/null "http://${bridge_ip}:8090/boot/artifacts/manifest.json"; then
            echo "::error::boot config server not reachable at ${bridge_ip}:8090 through the socat forward" >&2
            cat /tmp/socat-boot-server.log >&2 || true
            exit 1
          fi

      - name: Deploy kezio-bootd on the provisioning bridge
        env:
          BOOT_ARTIFACTS_VERSION: ${{ inputs.boot_artifacts_version }}
        run: |
          set -euo pipefail
          cd config/bootd && ../../bin/kustomize edit set image bootd="${BOOTD_IMG}"
          cd ../..
          kubectl apply -k config/bootd
          # The three site-specific values config/bootd/deployment.yaml
          # leaves as placeholders/comments (BOOTD_DHCP_INTERFACE=net1
          # is already set there):
          #   - BOOTD_SERVER_IP: bootd's OWN net1 static address (the
          #     NAD's ipam above) - the PXE next-server, so firmware
          #     TFTPs straight to the pod, and the dhcp-relay giaddr.
          #   - BOOTD_PROVISIONING_CIDR: the segment's subnet, rendered
          #     as dnsmasq's proxyDHCP dhcp-range.
          #   - BOOTD_DHCP_RELAY_SERVER: the host lease-only dnsmasq
          #     (see "Start a lease-only DHCP server" above) - the
          #     stand-in for the site's existing DHCP server.
          #   - BOOTD_BOOT_CONFIG_URL: the boot config server as the VM
          #     reaches it - the socat forward on the bridge address
          #     (the same value BOOT_SERVER_URL was set to above). bootd
          #     renders it into the grub/grub.cfg it serves over TFTP,
          #     which is how the netboot GRUB image finds its per-MAC
          #     config.
          kubectl -n kezio-system set env deployment/kezio-bootd \
            BOOTD_SERVER_IP="${PROVISIONING_BOOTD_NET1_IP%%/*}" \
            BOOTD_PROVISIONING_CIDR="${PROVISIONING_CIDR}" \
            BOOTD_DHCP_RELAY_SERVER="${RELAY_DHCP_SERVER_IP}" \
            BOOTD_BOOT_CONFIG_URL="http://${PROVISIONING_HOST_IP%%/*}:8090"
          # Strategic-merge (kubectl patch's default type for a built-in
          # object like Deployment), not --type=json: a JSON Patch "add"
          # on .../metadata/annotations replaces the whole annotations
          # map wholesale, so any later change to this same path (a
          # rerun, a future patch adding a second annotation) would
          # silently drop this one. A strategic-merge patch merges
          # map[string]string fields (annotations included) by key
          # instead, so this attachment survives regardless of what else
          # ever touches the pod template's annotations.
          kubectl -n kezio-system patch deployment/kezio-bootd --type=strategic -p='{
            "spec":{"template":{"metadata":{"annotations":{"k8s.v1.cni.cncf.io/networks":"kezio-boot-network"}}}}
          }'
          if [ -n "${BOOT_ARTIFACTS_VERSION}" ]; then
            kubectl -n kezio-system set env deployment/kezio-bootd \
              -c fetch-boot-artifacts "BOOT_ARTIFACTS_VERSION=${BOOT_ARTIFACTS_VERSION}"
          fi
          kubectl rollout status deployment/kezio-bootd -n kezio-system --timeout=180s

          # Fail fast here, not 20 minutes later at a PXE-E18 timeout on
          # the VM console: confirm the live bootd pod actually has the
          # Multus secondary interface Multus's own
          # k8s.v1.cni.cncf.io/network-status annotation reports back
          # (set by Multus after CNI ADD succeeds - the annotation this
          # step just requested is only bootd's *request*, not proof the
          # attachment happened), rather than only trusting the
          # deployment's own template annotation.
          # Exclude terminating pods: `rollout status` returning does not
          # mean the OLD ReplicaSet's pod is already gone, and a
          # terminating pod still reports phase=Running - so a bare
          # .items[0] can race onto the pre-patch pod that legitimately
          # lacks the attachment, failing this check spuriously.
          bootd_pod="$(kubectl -n kezio-system get pods -l app.kubernetes.io/component=bootd -o json \
            | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
          if [ -z "${bootd_pod}" ] || [ "${bootd_pod}" = "null" ]; then
            echo "::error::no non-terminating bootd pod found" >&2
            exit 1
          fi
          network_status="$(kubectl -n kezio-system get pod "${bootd_pod}" \
            -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}')"
          if ! grep -q 'kezio-boot-network' <<<"${network_status}"; then
            echo "::error::bootd pod ${bootd_pod} has no kezio-boot-network attachment in its network-status; got: ${network_status}" >&2
            exit 1
          fi
          echo "BOOTD_POD_NAME=${bootd_pod}" >> "$GITHUB_ENV"

          # Pin the relay leg to the provisioning bridge. dnsmasq
          # sources its relayed unicasts from the dhcp-relay LOCAL
          # address (bootd's net1 192.0.2.2), but the pod's default
          # route goes out eth0 (the CNI pod network), where a
          # 192.0.2.2-sourced packet to the lease server is dropped as
          # unroutable - host-dnsmasq never saw a single relayed
          # message. A /32 route via the host's bridge address sends
          # the relayed packet over the provisioning bridge instead:
          # the host owns the bridge gateway address and forwards to
          # the lease server's veth (rp_filter on the host is
          # satisfied because the host routes 192.0.2.0/24 on that
          # bridge), and replies to giaddr 192.0.2.2 return over the
          # same path. This models a site's existing DHCP server
          # reachable via the segment's L3 gateway. `ip route replace`
          # for idempotency; exec inherits the bootd container's
          # NET_ADMIN, and the image ships iproute2 for exactly this.
          kubectl -n kezio-system exec "${bootd_pod}" -c bootd -- \
            ip route replace "${RELAY_DHCP_SERVER_IP}/32" \
            via "${PROVISIONING_HOST_IP%%/*}" dev net1

      - name: Start capturing bootd's pod network namespace (nsenter tcpdump on net1)
        # bridge.pcap (started above) only proves a frame crossed
        # kezio-prov0's ports on the HOST side - it cannot see whether
        # that frame then actually entered bootd's own network namespace
        # over the Multus veth, since that boundary and the kernel's
        # IP-layer delivery decisions past it (routing, reverse-path
        # filtering, netns-local firewall rules) are invisible to a
        # host-side capture. Tapping net1 from inside the pod's own
        # network namespace is the only way to see whether a DISCOVER
        # actually reached bootd's interface at all - something bootd's
        # own logs never mention either way.
        #
        # Reached via nsenter into the sandbox's namespace (resolved
        # through crictl, RKE2's bundled container runtime CLI) rather
        # than `kubectl debug`: bootd's own image ships no tcpdump, so a
        # `kubectl debug` ephemeral container would need to pull a
        # separate debug image before it could start capturing, losing
        # exactly the early packets this capture exists to catch (it
        # must be running before the target VM is even created below).
        # nsenter reaches the same namespace directly using the tcpdump
        # binary the "Start capturing the provisioning bridge" step above
        # already installed on this host, with no image pull and no
        # dependency on the ephemeral-containers feature being enabled.
        #
        # crictl is pointed explicitly at RKE2's own containerd socket
        # (-r): its default endpoint probe only tries
        # /run/containerd/containerd.sock, /run/crio/crio.sock and
        # /var/run/cri-dockerd.sock, none of which exist on an RKE2 node
        # (RKE2 bundles containerd under /run/k3s/containerd instead, the
        # same socket "Import images into RKE2 containerd" above already
        # targets with `ctr -a`) - left unset, every crictl call here
        # exits non-zero.
        #
        # This is a diagnostic instrument only: it must never fail the
        # job. `set +e` plus an explicit ::warning:: and early exit 0 on
        # each resolution step guarantee the step always exits 0,
        # regardless of whether crictl, nsenter or tcpdump are present or
        # able to resolve bootd's sandbox.
        run: |
          set +e
          crictl_endpoint="unix:///run/k3s/containerd/containerd.sock"

          sandbox_id="$(sudo crictl -r "${crictl_endpoint}" pods --name "${BOOTD_POD_NAME}" -q 2>/tmp/crictl-bootd-netns.log | head -1)"
          if [ -z "${sandbox_id}" ]; then
            echo "::warning::bootd pod-netns capture: crictl could not resolve a sandbox ID for pod ${BOOTD_POD_NAME} via ${crictl_endpoint} - skipping this diagnostic capture, it does not affect the e2e result"
            cat /tmp/crictl-bootd-netns.log >&2
            exit 0
          fi

          sandbox_pid="$(sudo crictl -r "${crictl_endpoint}" inspectp -o go-template --template '{{.info.pid}}' "${sandbox_id}" 2>/tmp/crictl-bootd-netns.log)"
          if [ -z "${sandbox_pid}" ]; then
            echo "::warning::bootd pod-netns capture: crictl could not resolve the sandbox pid for ${sandbox_id} - skipping this diagnostic capture, it does not affect the e2e result"
            cat /tmp/crictl-bootd-netns.log >&2
            exit 0
          fi

          if ! command -v tcpdump >/dev/null 2>&1; then
            echo "::warning::bootd pod-netns capture: tcpdump not found on the runner - skipping this diagnostic capture, it does not affect the e2e result"
            exit 0
          fi

          sudo -- sh -c "nohup nsenter -t '${sandbox_pid}' -n -- tcpdump -i net1 -w '${RUNNER_TEMP}/bootd-netns.pcap' \
            udp port 67 or port 68 or port 69 \
            >/tmp/tcpdump-bootd-netns.log 2>&1 &" \
            || echo "::warning::bootd pod-netns capture: failed to start nsenter/tcpdump inside bootd's netns - skipping this diagnostic capture, it does not affect the e2e result"
          exit 0

      - name: Ingest the marker-customized Ubuntu image through kezioctl
        run: |
          set -euo pipefail
          kubectl -n kezio-system port-forward svc/kezio-image-service 18080:8080 &
          PF_PID=$!
          echo "PF_PID=${PF_PID}" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:18080/healthz" && break
            sleep 1
          done

          bin/kezioctl image upload "${UBUNTU_CLOUD_IMAGE_PATH}" \
            --name "${IMAGE_NAME}" \
            --namespace kezio-system \
            --server http://127.0.0.1:18080 \
            --token "${IMAGE_SERVICE_TOKEN}" \
            --format qcow2

      - name: Wait for the Image to reach Ready (real ingest - qemu-img, sfdisk, partclone)
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 900 ))
          while true; do
            state="$(kubectl get image "${IMAGE_NAME}" -n kezio-system -o jsonpath='{.status.state}' || true)"
            echo "$(date -Is) Image state: ${state:-<none>}"
            [ "${state}" = "Ready" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Image ${IMAGE_NAME} did not reach Ready within the timeout." >&2
              kubectl get image "${IMAGE_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            sleep 5
          done
          kubectl get image "${IMAGE_NAME}" -n kezio-system -o yaml

      - name: Stop the image-service port-forward
        if: always()
        run: kill "${PF_PID}" 2>/dev/null || true

      - name: Create the BMC credentials Secret
        if: ${{ inputs.bmc_mode }}
        # Shared by both sides of the BMC relationship: KubeVirtBMC's
        # VirtualMachineBMC.spec.authSecretRef reads the same
        # "username"/"password" keys kezio's
        # Machine.spec.bmc.credentialsSecretRef does (KubeVirtBMC's
        # bmcUserKey/bmcPasswordKey constants match
        # internal/bmc/credentials.go's SecretKeyUsername/SecretKeyPassword
        # exactly), so one Secret authenticates kezio's Redfish client
        # against KubeVirtBMC's Redfish server.
        run: |
          set -euo pipefail
          BMC_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::${BMC_PASSWORD}"
          kubectl -n kezio-system create secret generic "${BMC_CREDS_SECRET}" \
            --type=kubernetes.io/basic-auth \
            --from-literal=username=kezio-e2e \
            --from-literal=password="${BMC_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create the Machine CR for the target VM
        if: ${{ !inputs.bmc_mode }}
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: kezio.kojuro.date/v1alpha1
          kind: Machine
          metadata:
            name: ${TARGET_VM_NAME}
            namespace: kezio-system
          spec:
            bootMACAddress: "${TARGET_VM_MAC}"
            online: true
            targetDisk:
              serialNumber: "${TARGET_VM_DISK_SERIAL}"
            imageRef:
              name: ${IMAGE_NAME}
          EOF

      - name: Create and start the target KubeVirt VirtualMachine
        if: ${{ !inputs.bmc_mode }}
        # Network boot first (bootOrder 1), the blank data disk second
        # (bootOrder 2) - the same shape e2e-boot-path-kubevirt.yml uses,
        # and the mechanism this workflow's header comment explains makes
        # a real boot-from-disk happen after deploy with no boot-order
        # flip and no BMC call: kezio-agent's own in-guest reboot re-nets
        # PXE against the same order, and kezio-bootd's Provisioned-state
        # "exit" GRUB response falls straight through to the disk.
        # 3Gi memory / 4Gi disk (vs. the boot-path lane's 2Gi/2Gi): this
        # VM actually boots a full Ubuntu userspace with
        # qemu-guest-agent, not just the live environment, and its
        # target disk must hold the whole converted Ubuntu minimal cloud
        # image (virtual size a little over 2GiB) with headroom for the
        # last partition's post-deploy filesystem grow (see
        # internal/agent/deploy/finalize.go's fsResizeCommand).
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: ${TARGET_VM_NAME}
            namespace: kezio-system
          spec:
            running: true
            template:
              metadata:
                labels:
                  kubevirt.io/vm: ${TARGET_VM_NAME}
              spec:
                domain:
                  cpu:
                    cores: 2
                  resources:
                    requests:
                      memory: 3Gi
                  firmware:
                    bootloader:
                      efi:
                        secureBoot: false
                  devices:
                    interfaces:
                      - name: provisioning
                        macAddress: "${TARGET_VM_MAC}"
                        bridge: {}
                        bootOrder: 1
                    disks:
                      - name: data
                        serial: "${TARGET_VM_DISK_SERIAL}"
                        bootOrder: 2
                        disk:
                          bus: virtio
                networks:
                  - name: provisioning
                    multus:
                      networkName: kezio-boot-network-vm
                volumes:
                  - name: data
                    emptyDisk:
                      capacity: 4Gi
          EOF
          kubectl wait vmi/"${TARGET_VM_NAME}" -n kezio-system --for=condition=Ready --timeout=180s

      - name: Create the target KubeVirt VirtualMachine, powered off
        if: ${{ inputs.bmc_mode }}
        # `running: false`: unlike the non-bmc_mode path, this VM is
        # never started here. Same device shape (network boot first,
        # blank data disk second) as the non-bmc_mode VM above, so the
        # post-deploy in-guest reboot (kezio-agent's own systemctl
        # reboot, unrelated to the BMC) falls through to disk the same
        # way.
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: ${TARGET_VM_NAME}
            namespace: kezio-system
          spec:
            running: false
            template:
              metadata:
                labels:
                  kubevirt.io/vm: ${TARGET_VM_NAME}
              spec:
                domain:
                  cpu:
                    cores: 2
                  resources:
                    requests:
                      memory: 3Gi
                  firmware:
                    bootloader:
                      efi:
                        secureBoot: false
                  devices:
                    interfaces:
                      - name: provisioning
                        macAddress: "${TARGET_VM_MAC}"
                        bridge: {}
                        bootOrder: 1
                    disks:
                      - name: data
                        serial: "${TARGET_VM_DISK_SERIAL}"
                        bootOrder: 2
                        disk:
                          bus: virtio
                networks:
                  - name: provisioning
                    multus:
                      networkName: kezio-boot-network-vm
                volumes:
                  - name: data
                    emptyDisk:
                      capacity: 4Gi
          EOF

      - name: "Assert the VM is off before any Machine is created (the harness did not start it)"
        if: ${{ inputs.bmc_mode }}
        # Bounded wait, not a one-shot check: right after `kubectl apply`,
        # KubeVirt's controller may not have populated status.printableStatus
        # yet, so an empty status here is a populate-lag race, not a real
        # power state problem. A Running status, though, is never lag - it
        # means the VM actually came up, which must fail immediately.
        # Re-validated against KubeVirt v1.9.0: the controller still
        # populates this field asynchronously, so the bounded wait stays.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 120 ))
          while true; do
            status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
            echo "$(date -Is) VM printableStatus: ${status:-<none>}"
            [ "${status}" = "Stopped" ] && break
            if [ "${status}" = "Running" ]; then
              echo "::error::VM ${TARGET_VM_NAME} printableStatus = Running, want Stopped - it must be off until kezio's controller powers it on through the BMC." >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VM ${TARGET_VM_NAME} printableStatus = ${status:-<none>}, want Stopped - it must be off until kezio's controller powers it on through the BMC." >&2
              exit 1
            fi
            sleep 5
          done
          if kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system >/dev/null 2>&1; then
            echo "::error::A VirtualMachineInstance already exists for ${TARGET_VM_NAME}; the VM must not be running yet." >&2
            exit 1
          fi

      - name: Create the KubeVirtBMC VirtualMachineBMC for the target VM
        if: ${{ inputs.bmc_mode }}
        # Gives the VM a Redfish endpoint: KubeVirtBMC's
        # VirtualMachineBMC controller creates a Pod running the
        # "virtbmc" agent (talking to the Kubernetes API, translating
        # Redfish calls into VirtualMachine Start/Stop/Restart and boot
        # order patches) and a ClusterIP Service named
        # "<virtualMachineRef.name>-virtbmc" in front of it, on port 80
        # (plain HTTP - see BMC_REDFISH_ADDRESS's comment above). No IPMI
        # simulator is enabled; this job only exercises the Redfish
        # side, matching kezio's redfish:// driver.
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: bmc.kubevirt.io/v1beta1
          kind: VirtualMachineBMC
          metadata:
            name: ${TARGET_VM_NAME}
            namespace: kezio-system
          spec:
            virtualMachineRef:
              name: ${TARGET_VM_NAME}
            authSecretRef:
              name: ${BMC_CREDS_SECRET}
          EOF

      - name: Wait for the VirtualMachineBMC to become Ready
        if: ${{ inputs.bmc_mode }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 180 ))
          while true; do
            ready="$(kubectl get virtualmachinebmc "${TARGET_VM_NAME}" -n kezio-system \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' || true)"
            clusterip="$(kubectl get virtualmachinebmc "${TARGET_VM_NAME}" -n kezio-system \
              -o jsonpath='{.status.clusterIP}' || true)"
            echo "$(date -Is) VirtualMachineBMC Ready=${ready:-<none>} clusterIP=${clusterip:-<none>}"
            [ "${ready}" = "True" ] && [ -n "${clusterip}" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VirtualMachineBMC ${TARGET_VM_NAME} did not become Ready within the timeout." >&2
              kubectl get virtualmachinebmc "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            sleep 5
          done
          kubectl get virtualmachinebmc "${TARGET_VM_NAME}" -n kezio-system -o yaml
          kubectl -n kezio-system rollout status deployment 2>/dev/null || true
          kubectl -n kezio-system get pods -l app=virtbmc 2>/dev/null || true

      - name: Wait for the virtbmc pod to become Ready
        if: ${{ inputs.bmc_mode }}
        # The VirtualMachineBMC Ready condition just checked above only
        # means KubeVirtBMC's Service got a ClusterIP (reason:
        # ServiceReady) - it says nothing about whether the virtbmc pod
        # behind that Service has passed its own readinessProbe on
        # /redfish/v1 (initialDelaySeconds 2, periodSeconds 10) yet.
        # Moving straight to the curl check on that signal alone can hit
        # the Service while it still has zero ready endpoints, which
        # surfaces as a plain connection refused. kubevirt.io/virtual
        # machinebmc-name is the label KubeVirtBMC's own controller
        # applies to this pod (its VirtualMachineBMCNameLabel constant).
        # Re-validated at this version bump: kubevirtbmc_version stays
        # v0.9.0 (already the latest release), so this wait and the
        # curl-retry step below it are unchanged.
        run: |
          set -euo pipefail
          kubectl -n kezio-system wait --for=condition=Ready pod \
            -l "kubevirt.io/virtualmachinebmc-name=${TARGET_VM_NAME}" --timeout=180s

      - name: "Verify the Redfish endpoint is reachable and reports the VM off"
        if: ${{ inputs.bmc_mode }}
        # Exercised from inside the cluster with a throwaway Pod (the
        # Service is ClusterIP-only, same as kezio's other in-cluster
        # services); the same call the controller's Register step is
        # about to make, done here by hand first so a broken Redfish
        # endpoint fails with a clear diagnostic instead of surfacing
        # only as a Machine stuck in Error. The curl call itself is
        # additionally retried a few times: the pod-Ready wait above
        # closes the main race, but a belt-and-braces retry absorbs a
        # first-connection blip on an endpoint that only just turned
        # ready, without masking a real, persistent failure.
        run: |
          set -euo pipefail
          BMC_USERNAME="$(kubectl get secret "${BMC_CREDS_SECRET}" -n kezio-system -o jsonpath='{.data.username}' | base64 -d)"
          BMC_PASSWORD="$(kubectl get secret "${BMC_CREDS_SECRET}" -n kezio-system -o jsonpath='{.data.password}' | base64 -d)"
          echo "::add-mask::${BMC_PASSWORD}"

          # --overrides carries the whole container spec (image,
          # command, stdin) because a restricted-PSA securityContext
          # must be merged in via the generated pod's JSON - kubectl
          # run has no flag for it. Same numeric runAsUser/runAsGroup
          # as curlimages/curl's other initContainer uses in this repo
          # (e.g. config/bootd/deployment.yaml): the image's own USER
          # is the non-numeric "curl_user", which restricted PSA can't
          # resolve to verify runAsNonRoot. kezio-system now enforces
          # privileged PSA (bootd's dnsmasq needs NET_ADMIN/NET_RAW -
          # see the namespace label step above), so this override is no
          # longer required for admission; it is kept so this throwaway
          # pod stays as strict as every other pod in the lane.
          redfish_overrides="$(jq -n \
            --arg name "kezio-e2e-redfish-check" \
            --arg image "curlimages/curl:8.21.0" \
            --arg auth "${BMC_USERNAME}:${BMC_PASSWORD}" \
            --arg url "http://${TARGET_VM_NAME}-virtbmc.kezio-system.svc.cluster.local/redfish/v1/Systems/1" \
            '{
              apiVersion: "v1",
              kind: "Pod",
              spec: {
                securityContext: {
                  runAsNonRoot: true,
                  seccompProfile: {type: "RuntimeDefault"}
                },
                containers: [{
                  name: $name,
                  image: $image,
                  stdin: true,
                  command: ["curl", "-sf", "-u", $auth, $url],
                  securityContext: {
                    allowPrivilegeEscalation: false,
                    runAsNonRoot: true,
                    runAsUser: 100,
                    runAsGroup: 101,
                    capabilities: {drop: ["ALL"]},
                    seccompProfile: {type: "RuntimeDefault"}
                  }
                }]
              }
            }')"

          redfish_body=""
          last_err=""
          last_phase=""
          for attempt in $(seq 1 5); do
            # A fresh pod name per attempt: reusing one fixed name would
            # race a leftover pod from a failed attempt instead of a
            # clean retry.
            #
            # Output is read from `kubectl logs`, not from an attached
            # stream: `kubectl run -i --rm --quiet` can exit 0 with empty
            # captured stdout if the pod's curl finishes before the
            # attach stream is established, which would otherwise be
            # misread as a successful-but-empty response. Running
            # detached (--attach=false) and waiting for the pod phase
            # before reading its logs avoids that race entirely.
            pod_name="kezio-e2e-redfish-check-${attempt}"
            phase=""
            body=""
            if kubectl run "${pod_name}" -n kezio-system \
              --attach=false --restart=Never --image=curlimages/curl:8.21.0 --quiet \
              --overrides="${redfish_overrides}" 2>&1; then
              if kubectl wait --for=jsonpath='{.status.phase}'=Succeeded \
                "pod/${pod_name}" -n kezio-system --timeout=60s >/dev/null 2>&1; then
                phase="Succeeded"
              else
                phase="$(kubectl get "pod/${pod_name}" -n kezio-system -o jsonpath='{.status.phase}' 2>/dev/null || true)"
              fi
              body="$(kubectl logs "pod/${pod_name}" -n kezio-system 2>&1 || true)"
              kubectl delete "pod/${pod_name}" -n kezio-system --ignore-not-found >/dev/null 2>&1
            else
              phase="PodCreateFailed"
            fi
            last_phase="${phase}"
            if [ "${phase}" = "Succeeded" ] && [ -n "${body}" ]; then
              redfish_body="${body}"
              last_err=""
              break
            fi
            last_err="${body}"
            redfish_body=""
            echo "attempt ${attempt}/5: curl against the Redfish endpoint failed (pod phase: ${phase}), retrying in 5s: ${last_err}"
            sleep 5
          done
          if [ -z "${redfish_body}" ]; then
            echo "::error::Redfish endpoint still unreachable after 5 attempts (last pod phase: ${last_phase}): ${last_err}" >&2
            exit 1
          fi
          echo "Redfish ComputerSystem response: ${redfish_body}"

          power_state="$(jq -r '.PowerState' <<<"${redfish_body}")"
          if [ "${power_state}" != "Off" ]; then
            echo "::error::Redfish reports PowerState=${power_state}, want Off before Register runs." >&2
            exit 1
          fi

      - name: Create the Machine CR, with spec.bmc pointing at KubeVirtBMC's Redfish endpoint
        if: ${{ inputs.bmc_mode }}
        # No manual power-on, no manual boot-order flip: the controller's
        # Register step (internal/deployer/agent.go) is what must call
        # SetOneTimePXEBoot and PowerOn against BMC_REDFISH_ADDRESS to
        # bring this Machine up.
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: kezio.kojuro.date/v1alpha1
          kind: Machine
          metadata:
            name: ${TARGET_VM_NAME}
            namespace: kezio-system
          spec:
            bmc:
              address: ${BMC_REDFISH_ADDRESS}
              credentialsSecretRef:
                name: ${BMC_CREDS_SECRET}
            bootMACAddress: "${TARGET_VM_MAC}"
            online: true
            targetDisk:
              serialNumber: "${TARGET_VM_DISK_SERIAL}"
            imageRef:
              name: ${IMAGE_NAME}
          EOF

      - name: "Assert kezio powered the VM on through the BMC (not the harness)"
        if: ${{ inputs.bmc_mode }}
        # The only thing that has touched this VM since it was created
        # `running: false` is the Machine CR just created above. If the
        # VM comes up, it came up because agentDeployer.Register called
        # the BMC.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 180 ))
          while true; do
            status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
            echo "$(date -Is) VM printableStatus: ${status:-<none>}"
            case "${status}" in
              Running) break ;;
            esac
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VM ${TARGET_VM_NAME} never reached Running after the Machine was created - kezio's Register did not power it on through the BMC." >&2
              kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            sleep 5
          done
          kubectl wait vmi/"${TARGET_VM_NAME}" -n kezio-system --for=condition=Ready --timeout=180s

      - name: Start continuous VM console capture
        # No `if:` guard - both the bmc_mode and non-bmc_mode branches
        # above land here with the VMI already Ready, so this runs
        # exactly once regardless of which power path this job used.
        #
        # Runs for the rest of the job (nohup + disown, the same
        # backgrounding pattern the socat forwards above use) so the
        # eventual "Dump diagnostics on failure" step's 20-second live
        # `virtctl console` attach - which only ever sees whatever the
        # guest happens to print in that narrow window, nothing from
        # before it - is no longer the only window onto the guest: this
        # file accumulates the VM's serial console from the moment it
        # started, through however this job ends.
        #
        # `virtctl console` puts the local terminal into raw mode to
        # relay guest input, which fails outright without a real TTY
        # (verified against virtctl v1.9.0: it errors "not a terminal"
        # on a plain pipe or file redirect). `script` supplies a fake
        # pty - the standard way to run a TTY-requiring program
        # headlessly - and, given a logfile argument, records everything
        # written to that pty there, byte for byte, without also needing
        # a real terminal itself.
        run: |
          set -euo pipefail
          nohup script -qec "virtctl console '${TARGET_VM_NAME}' -n kezio-system" \
            "${RUNNER_TEMP}/console.log" >/tmp/console-capture-wrapper.log 2>&1 &
          disown

      - name: Wait for the Machine to reach Provisioned
        # Generous but bounded: this covers the same multi-minute live
        # boot chain e2e-boot-path-kubevirt.yml's own wait step covers,
        # plus disk resolution, partitioning, the real partclone
        # write/BitTorrent leech of the ingested content, PostHooks, and
        # finalize.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            state="$(kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.state}' || true)"
            echo "$(date -Is) Machine state: ${state:-<none>}"
            if [ "${state}" = "Provisioned" ]; then
              break
            fi
            if [ "${state}" = "Error" ]; then
              echo "::error::Machine ${TARGET_VM_NAME} landed in Error while deploying." >&2
              kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Machine ${TARGET_VM_NAME} did not reach Provisioned within the timeout." >&2
              exit 1
            fi
            sleep 10
          done
          kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml

      - name: "Verify layer 1 (controller): status.provisioning matches spec, conditions clean"
        run: |
          set -euo pipefail
          machine_json="$(kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o json)"

          provisioned_image="$(jq -r '.status.provisioning.image.imageRef.name' <<<"${machine_json}")"
          if [ "${provisioned_image}" != "${IMAGE_NAME}" ]; then
            echo "::error::status.provisioning.image.imageRef.name = ${provisioned_image}, want ${IMAGE_NAME}" >&2
            exit 1
          fi

          target_disk="$(jq -r '.status.provisioning.image.targetDisk' <<<"${machine_json}")"
          if [ -z "${target_disk}" ] || [ "${target_disk}" = "null" ]; then
            echo "::error::status.provisioning.image.targetDisk is empty" >&2
            exit 1
          fi
          echo "resolved target disk: ${target_disk}"

          ready_status="$(jq -r '.status.conditions[] | select(.type=="Ready") | .status' <<<"${machine_json}")"
          if [ "${ready_status}" != "True" ]; then
            echo "::error::Ready condition status = ${ready_status}, want True" >&2
            echo "${machine_json}" | jq '.status.conditions'
            exit 1
          fi

      - name: "Wait for layer 2 (boot): the deployed disk boots and qemu-guest-agent connects"
        # The live environment never runs qemu-guest-agent (see this
        # workflow's header comment on why only the *deployed* test
        # image carries it), so AgentConnected never goes True while the
        # VM is still net-booted into the live environment - only once
        # the post-deploy in-guest reboot has actually fallen through to
        # the disk kezio-agent wrote and that disk's own userspace has
        # come up far enough to start the agent. guestOSInfo is
        # populated by the same QGA connection and asserted right after,
        # together proving kernel + userspace came up from the deployed
        # disk - not from a Machine.status side-channel.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            connected="$(kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system \
              -o jsonpath='{.status.conditions[?(@.type=="AgentConnected")].status}' || true)"
            echo "$(date -Is) VMI AgentConnected: ${connected:-<none>}"
            [ "${connected}" = "True" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::qemu-guest-agent never connected within the timeout after Provisioned - the VM did not boot from the deployed disk." >&2
              exit 1
            fi
            sleep 5
          done

          guest_os_id="$(kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.guestOSInfo.id}')"
          echo "guestOSInfo.id: ${guest_os_id}"
          if [ "${guest_os_id}" != "ubuntu" ]; then
            echo "::error::guestOSInfo.id = ${guest_os_id}, want ubuntu (the deployed image's OS, not the live-boot environment's)" >&2
            exit 1
          fi

      - name: "Verify layer 3 (content): read the marker file back through QGA and compare"
        # No SSH: the marker is read with QGA's
        # guest-file-open/guest-file-read/guest-file-close commands, sent
        # over virtio-serial via `virsh qemu-agent-command` run inside
        # the VM's own virt-launcher pod - the same mechanism a
        # QGA-based guest-file read helper uses (there is no
        # `virtctl guestexec` subcommand to reach for instead).
        run: |
          set -euo pipefail
          # Exclude terminating pods so a lingering old virt-launcher pod
          # (still phase=Running while it shuts down) cannot shadow the
          # live one.
          launcher_pod="$(kubectl get pods -n kezio-system -l "kubevirt.io/vm=${TARGET_VM_NAME}" -o json \
            | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
          if [ -z "${launcher_pod}" ] || [ "${launcher_pod}" = "null" ]; then
            echo "::error::no non-terminating virt-launcher pod found for VM ${TARGET_VM_NAME}" >&2
            exit 1
          fi
          domain="kezio-system_${TARGET_VM_NAME}"

          qga_exec() {
            kubectl exec -n kezio-system "${launcher_pod}" -c compute -- \
              virsh qemu-agent-command "${domain}" "$1"
          }

          open_reply="$(qga_exec "{\"execute\":\"guest-file-open\",\"arguments\":{\"path\":\"${MARKER_PATH}\",\"mode\":\"r\"}}")"
          handle="$(jq -r '.return' <<<"${open_reply}")"
          if [ "${handle}" = "null" ] || [ -z "${handle}" ]; then
            echo "::error::guest-file-open on ${MARKER_PATH} failed: ${open_reply}" >&2
            exit 1
          fi

          read_reply="$(qga_exec "{\"execute\":\"guest-file-read\",\"arguments\":{\"handle\":${handle},\"count\":4096}}")"
          qga_exec "{\"execute\":\"guest-file-close\",\"arguments\":{\"handle\":${handle}}}" >/dev/null

          marker_content="$(jq -r '.return["buf-b64"]' <<<"${read_reply}" | base64 -d | tr -d '\n')"
          echo "marker content: ${marker_content}"

          if [ "${marker_content}" != "${MARKER_TOKEN}" ]; then
            echo "::error::marker file content mismatch: guest has ${marker_content@Q}, expected ${MARKER_TOKEN@Q}" >&2
            exit 1
          fi

      - name: "BMC power cycle: PowerOff through the BMC (spec.online=false)"
        if: ${{ inputs.bmc_mode }}
        # Independent of Register's one-time PXE power-on: once
        # Provisioned, internal/controller/machine_controller.go's
        # reconcilePower keeps the VM's power matched to spec.online
        # through the same BMC, and agentDeployer.PowerOff requests a
        # graceful shutdown (Redfish GracefulShutdownResetType ->
        # KubeVirtBMC's VirtualMachine Stop). This proves the
        # steady-state power path is BMC-driven too, not only the
        # initial boot.
        run: |
          set -euo pipefail
          kubectl patch machine "${TARGET_VM_NAME}" -n kezio-system --type=merge -p '{"spec":{"online":false}}'

          deadline=$(( $(date +%s) + 300 ))
          while true; do
            status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
            powered_on="$(kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.poweredOn}' || true)"
            echo "$(date -Is) VM printableStatus=${status:-<none>} Machine status.poweredOn=${powered_on:-<none>}"
            [ "${status}" = "Stopped" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VM ${TARGET_VM_NAME} did not stop within the timeout after spec.online=false - kezio's BMC-driven PowerOff did not take effect." >&2
              kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            sleep 5
          done

      - name: "BMC power cycle: PowerOn through the BMC (spec.online=true) and reconnect"
        if: ${{ inputs.bmc_mode }}
        run: |
          set -euo pipefail
          kubectl patch machine "${TARGET_VM_NAME}" -n kezio-system --type=merge -p '{"spec":{"online":true}}'

          deadline=$(( $(date +%s) + 300 ))
          while true; do
            status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
            echo "$(date -Is) VM printableStatus: ${status:-<none>}"
            [ "${status}" = "Running" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VM ${TARGET_VM_NAME} did not start within the timeout after spec.online=true - kezio's BMC-driven PowerOn did not take effect." >&2
              kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            sleep 5
          done
          kubectl wait vmi/"${TARGET_VM_NAME}" -n kezio-system --for=condition=Ready --timeout=180s

          deadline=$(( $(date +%s) + 600 ))
          while true; do
            connected="$(kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system \
              -o jsonpath='{.status.conditions[?(@.type=="AgentConnected")].status}' || true)"
            echo "$(date -Is) VMI AgentConnected: ${connected:-<none>}"
            [ "${connected}" = "True" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::qemu-guest-agent never reconnected after the BMC-driven PowerOn - the VM did not boot back from the deployed disk." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set +e
          # Tee the whole dump into a file too, on top of the usual job
          # log output: this is one of the two files "Upload E2E
          # diagnostics artifacts" below picks up, so this dump survives
          # past the log retention/scroll-back a human would otherwise
          # have to dig through.
          exec > >(tee "${RUNNER_TEMP}/diagnostics-dump.log") 2>&1
          echo "===== nodes ====="
          kubectl get nodes -o wide
          echo "===== kezio-system pods ====="
          kubectl get pods -n kezio-system -o wide
          echo "===== controller-manager logs ====="
          kubectl -n kezio-system logs deployment/kezio-controller-manager --all-containers --tail=1000
          echo "===== controller-manager fetch-boot-artifacts initContainer logs ====="
          # kubectl logs --all-containers above does not include
          # initContainers, so a fetch-boot-artifacts crash (for example,
          # a permission error writing into its volume, or the release
          # asset itself 404ing) would otherwise surface only as a
          # Deployment rollout timeout with no error text. --previous
          # first, since a CrashLoopBackOff pod's *current* attempt is
          # usually still starting or already exited by the time this
          # step runs - the failure output is in the previous attempt.
          #
          # `deployment/kezio-controller-manager` (a workload reference,
          # not a pod name) resolves through whichever ReplicaSet
          # kubectl's own logs-for-a-workload lookup picks - with a
          # rollout in progress there are two live ReplicaSets, and it
          # has been observed to pick the OLD one, which has no
          # fetch-boot-artifacts container at all ("container
          # fetch-boot-artifacts is not valid for pod ... out of:
          # manager"). Loop over the actual pods instead, and dump each
          # one's rendered securityContext so a future patch-application
          # regression (fsGroup/runAsUser missing from the live spec) is
          # visible here too, not just guessed at.
          for p in $(kubectl -n kezio-system get pods -l control-plane=controller-manager -o name); do
            echo "--- ${p} securityContext ---"
            kubectl -n kezio-system get "${p}" \
              -o jsonpath='{.spec.securityContext}{"\n"}{range .spec.initContainers[*]}{.name}{": "}{.securityContext}{"\n"}{end}'
            echo "--- ${p} fetch-boot-artifacts logs (--previous) ---"
            kubectl -n kezio-system logs "${p}" -c fetch-boot-artifacts --previous --tail=200 || \
              kubectl -n kezio-system logs "${p}" -c fetch-boot-artifacts --tail=200 || true
          done
          echo "===== bootd logs ====="
          kubectl -n kezio-system logs deployment/kezio-bootd --all-containers --tail=1000
          echo "===== bootd fetch-boot-artifacts initContainer logs ====="
          for p in $(kubectl -n kezio-system get pods -l app.kubernetes.io/component=bootd -o name); do
            echo "--- ${p} securityContext ---"
            kubectl -n kezio-system get "${p}" \
              -o jsonpath='{.spec.securityContext}{"\n"}{range .spec.initContainers[*]}{.name}{": "}{.securityContext}{"\n"}{end}'
            # Multus attachment, dumped explicitly: the requested
            # k8s.v1.cni.cncf.io/networks annotation only proves what was
            # asked for, not what actually attached, and neither is
            # visible in the plain pod logs above - a Multus CNI ADD
            # failure (for example, the NetworkAttachmentDefinition
            # missing, or the host bridge not existing yet) leaves bootd
            # itself running normally on eth0 alone while every PXE
            # request on the boot segment silently times out, with
            # nothing in bootd's own logs to explain why.
            echo "--- ${p} k8s.v1.cni.cncf.io/networks annotation (requested) ---"
            kubectl -n kezio-system get "${p}" \
              -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/networks}{"\n"}'
            echo "--- ${p} k8s.v1.cni.cncf.io/network-status annotation (actual, set by Multus) ---"
            kubectl -n kezio-system get "${p}" \
              -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}{"\n"}'
            # net1 lives only inside this pod's own network namespace, so
            # its rp_filter setting and link state have to be read from
            # there (via nsenter/crictl, the same way the pod-netns
            # capture above reaches it), not from the host - a strict
            # reverse-path filter on net1 is one of the candidates for a
            # DISCOVER (source 0.0.0.0) that crosses the host bridge but
            # never reaches bootd's UDP socket.
            echo "--- ${p} net1 rp_filter and link state (inside the pod network namespace) ---"
            pod_name="${p#pod/}"
            # Same RKE2 endpoint crictl needs everywhere else in this
            # workflow (see "Start capturing bootd's pod network
            # namespace" above) - without -r, crictl's default endpoint
            # probe finds nothing on an RKE2 node and this whole block
            # silently produces no output.
            crictl_endpoint="unix:///run/k3s/containerd/containerd.sock"
            sandbox_id="$(sudo crictl -r "${crictl_endpoint}" pods --name "${pod_name}" -q | head -1)"
            if [ -n "${sandbox_id}" ]; then
              sandbox_pid="$(sudo crictl -r "${crictl_endpoint}" inspectp -o go-template --template '{{.info.pid}}' "${sandbox_id}")"
              sudo nsenter -t "${sandbox_pid}" -n -- sh -c '
                for f in all default net1; do
                  echo "net.ipv4.conf.${f}.rp_filter = $(cat /proc/sys/net/ipv4/conf/${f}/rp_filter 2>/dev/null || echo "<no such interface>")"
                done
                ip -d link show net1 2>&1
                ip addr show net1 2>&1
              ' || true
            fi
            echo "--- ${p} fetch-boot-artifacts logs (--previous) ---"
            kubectl -n kezio-system logs "${p}" -c fetch-boot-artifacts --previous --tail=200 || \
              kubectl -n kezio-system logs "${p}" -c fetch-boot-artifacts --tail=200 || true
          done
          echo "===== ingest Job(s) ====="
          kubectl get jobs -n kezio-system -l kezio.kojuro.date/image -o wide
          kubectl logs -n kezio-system -l kezio.kojuro.date/image --all-containers --tail=1000
          echo "===== seeder logs ====="
          kubectl -n kezio-system logs deployment/kezio-ezio-seeder --tail=1000
          echo "===== opentracker logs ====="
          kubectl -n kezio-system logs deployment/kezio-opentracker --tail=1000
          echo "===== image-service logs ====="
          kubectl -n kezio-system logs deployment/kezio-image-service --tail=1000
          echo "===== VirtualMachine / VMI ====="
          kubectl get vm,vmi -n kezio-system -o yaml
          echo "===== virt-launcher pod describe ====="
          kubectl describe pod -n kezio-system -l "kubevirt.io/vm=${TARGET_VM_NAME}"
          echo "===== VM console (last 20s, live attach only - see the uploaded console.log artifact for the full history from VM start) ====="
          timeout 20 virtctl console "${TARGET_VM_NAME}" -n kezio-system || true
          echo "===== Machine CR ====="
          kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
          echo "===== Image CR ====="
          kubectl get image "${IMAGE_NAME}" -n kezio-system -o yaml
          echo "===== events ====="
          kubectl get events -n kezio-system --sort-by=.lastTimestamp
          echo "===== host FORWARD chain (canal/br_netfilter can silently drop bridged traffic here) ====="
          sudo iptables -L FORWARD -v --line-numbers || true
          sysctl net.bridge.bridge-nf-call-iptables || true
          echo "===== host mangle table CHECKSUM rules (fills UDP checksums the VM's virtio-net offloaded) ====="
          sudo iptables -t mangle -L POSTROUTING -v --line-numbers || true
          echo "===== ${PROVISIONING_BRIDGE} offload settings ====="
          ethtool -k "${PROVISIONING_BRIDGE}" | head || true

      - name: Stop the bridge capture and flush it to the artifact
        if: always()
        # Runs unconditionally (not just on failure) so a passing run
        # also leaves a record of what actually crossed the bridge -
        # the same reasoning "Upload E2E diagnostics artifacts" below
        # gives for uploading unconditionally. tcpdump only flushes its
        # pcap writer cleanly on SIGTERM, so signal it and give it a
        # moment before reading the file back; both steps are `|| true`
        # since a runner where the capture never started (tcpdump
        # missing) must not fail the job over a missing optional file.
        run: |
          set +e
          sudo pkill -TERM -f "tcpdump -i ${PROVISIONING_BRIDGE}"
          sleep 2
          if [ -s "${RUNNER_TEMP}/bridge.pcap" ]; then
            sudo chmod 0644 "${RUNNER_TEMP}/bridge.pcap"
            tcpdump -vvv -r "${RUNNER_TEMP}/bridge.pcap" > "${RUNNER_TEMP}/bridge-pcap.txt" 2>&1
          fi

      - name: Stop bootd's pod-netns capture and flush it to the artifact
        if: always()
        # Same reasoning as "Stop the bridge capture" above, for the
        # capture "Start capturing bootd's pod network namespace" started
        # inside bootd's own network namespace: matched on the pcap
        # output path (nsenter itself is a short-lived wrapper process
        # that has already exited by the time this step runs - only the
        # tcpdump it exec'd survives, and pkill -f matches its full
        # command line including that path) rather than on a saved PID,
        # since a pod restart between the two steps would make a saved
        # PID stale.
        run: |
          set +e
          sudo pkill -TERM -f "tcpdump -i net1 -w ${RUNNER_TEMP}/bootd-netns.pcap"
          sleep 2
          if [ -s "${RUNNER_TEMP}/bootd-netns.pcap" ]; then
            sudo chmod 0644 "${RUNNER_TEMP}/bootd-netns.pcap"
            tcpdump -vvv -r "${RUNNER_TEMP}/bootd-netns.pcap" > "${RUNNER_TEMP}/bootd-netns-pcap.txt" 2>&1
          fi

      - name: Flush the bootd and host DHCP-server logs to the artifact
        if: always()
        # Unconditional, like the pcap flushes above: bootd's pod log
        # now carries dnsmasq's forwarded per-request log-dhcp decision
        # lines (see internal/bootd's forwardLines), and the host
        # lease server's own log-dhcp log shows whether relayed lease
        # traffic ever arrived - both are the DHCP story a passing OR
        # failing run needs on record. The failure-only diagnostics
        # dump includes bootd's log too, but only on failure.
        run: |
          set +e
          kubectl -n kezio-system logs deployment/kezio-bootd --all-containers --tail=-1 \
            > "${RUNNER_TEMP}/bootd.log" 2>&1 || true
          if [ -f "${RUNNER_TEMP}/host-dnsmasq.log" ]; then
            sudo chmod 0644 "${RUNNER_TEMP}/host-dnsmasq.log"
          fi
          exit 0

      - name: Dump KubeVirtBMC diagnostics on failure
        if: ${{ failure() && inputs.bmc_mode }}
        run: |
          set +e
          # See "Dump diagnostics on failure" above for why this is
          # teed into a file as well as the job log.
          exec > >(tee "${RUNNER_TEMP}/diagnostics-kubevirtbmc-dump.log") 2>&1
          echo "===== kubevirtbmc-system pods ====="
          kubectl get pods -n kubevirtbmc-system -o wide
          echo "===== KubeVirtBMC controller-manager logs ====="
          kubectl -n kubevirtbmc-system logs deployment/kubevirtbmc-controller-manager --all-containers --tail=1000
          echo "===== VirtualMachineBMC ====="
          kubectl get virtualmachinebmc -n kezio-system -o yaml
          echo "===== virtbmc pod logs (the per-VM Redfish/IPMI agent) ====="
          kubectl -n kezio-system logs "${TARGET_VM_NAME}-virtbmc" --all-containers --tail=1000
          echo "===== virtbmc Service ====="
          kubectl get svc -n kezio-system -l app=virtbmc -o yaml
          echo "===== events (kubevirtbmc-system) ====="
          kubectl get events -n kubevirtbmc-system --sort-by=.lastTimestamp

      - name: Upload E2E diagnostics artifacts
        # Always, not just on failure: the continuous console capture and
        # the diagnostics dump are equally worth having on a passing run
        # (for example, to confirm a fix actually restored DHCP/TFTP
        # activity) - restricting the upload to failed runs would mean
        # only ever validating this observability path when it is
        # hardest to also validate the fix it is meant to help diagnose.
        # if-no-files-found: ignore, since the two diagnostics-*-dump.log
        # files above only exist on a failed run at all.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.job }}-${{ inputs.target_vm_name }}
          path: |
            ${{ runner.temp }}/console.log
            ${{ runner.temp }}/diagnostics-dump.log
            ${{ runner.temp }}/diagnostics-kubevirtbmc-dump.log
            ${{ runner.temp }}/bridge.pcap
            ${{ runner.temp }}/bridge-pcap.txt
            ${{ runner.temp }}/bootd-netns.pcap
            ${{ runner.temp }}/bootd-netns-pcap.txt
            ${{ runner.temp }}/bootd.log
            ${{ runner.temp }}/host-dnsmasq.log
            ${{ runner.temp }}/host-dnsmasq.leases
          if-no-files-found: ignore
          retention-days: 7
