name: E2E Full Deploy (KubeVirt VM) - reusable

# The BT-transfer/full-deploy scenario, callable via `workflow_call` - by
# kezio's own `main.yaml` (the `e2e-bmc` job, part of the single
# needs-graph every push and pull request runs), and by the upstream
# ezio repository, which owns the BitTorrent engine this scenario seeds
# and leeches through. ezio ships build-only CI and no test suite of its
# own; calling this workflow gives it a real integration test for each
# ezio change, by overriding `ezio_ref` with the revision under test.
#
# What this job proves end to end: KubeVirt + Multus stand up a target VM
# and a provisioning network; a real Image is ingested (qemu-img +
# sfdisk + partclone); an opentracker + ezio seeder swarm serves it;
# kezio's own Redfish driver (internal/bmc/redfish) powers the target VM
# on and PXE-boots it through a real KubeVirtBMC endpoint; the target VM
# net-boots into a live environment, kezio-agent leeches the Image over
# BitTorrent and writes it to the VM's disk, the VM reboots, and the
# deployed disk actually boots - proven by qemu-guest-agent connecting
# and by reading a marker file back out of the guest.
#
# Every image reference is an `inputs.*` value below, defaulted to
# kezio's own values. `ezio_ref` is the one an ezio caller needs to
# touch - it selects the ezio git revision docker/seeder/Dockerfile
# builds; the image-tag inputs let a caller swap kezio's own component
# images (or the third-party opentracker image) without forking this
# file.
#
# No secrets are required: every image built here is built from source
# and loaded locally (never pushed), and the only external pulls (the
# Ubuntu cloud image, the opentracker image, ezio's own git clone,
# KubeVirtBMC's release manifest) are all public.
#
# Topology note (BMC-driven power): the target VM is left powered off
# (`running: false`) and given a Redfish endpoint through KubeVirtBMC
# (https://github.com/kubevirtbmc/kubevirtbmc's VirtualMachineBMC CRD);
# the Machine names that endpoint in spec.bmc. kezio's own Redfish driver
# (internal/bmc/redfish) has to power it on: the deployer's Register step
# (internal/deployer/agent.go) calls SetOneTimePXEBoot then PowerOn
# against that endpoint - proof that code path actually drives a VM
# through KubeVirtBMC, not a mock. After Provisioned, the job also drives
# a second, independent BMC power cycle by flipping spec.online off then
# on (machine_controller.go's reconcilePower calls
# dep.PowerOff/dep.PowerOn through the same BMC), proving the
# steady-state power path is BMC-driven too, not just the initial PXE
# boot. kezio never ships without a BMC driver, so this workflow has only
# the one, BMC-driven shape.
on:
  workflow_call:
    inputs:
      ezio_ref:
        description: >-
          ezio git revision (tag, branch, or commit SHA) that
          docker/seeder/Dockerfile builds into the seeder image. This is the
          input an ezio-repo caller sets to the revision under test
          (for example, the pull request's head SHA). Defaults to the
          same pin docker/seeder/Dockerfile's own EZIO_REF ARG carries, so
          kezio's own caller builds the exact revision it always has.
        required: false
        type: string
        default: "v2.0.29"
      boot_artifacts_image:
        description: >-
          kezio-boot-artifacts OCI image to boot - a published ghcr tag,
          pulled by the kubelet directly inside the cluster, same as any
          other image reference. Ignored when boot_artifacts_artifact is
          set or build_boot_artifacts is true (see both below for the
          precedence). Defaults to the published "latest" tag.
        required: false
        type: string
        default: "ghcr.io/tjjh89017/kezio-boot-artifacts:latest"
      boot_artifacts_artifact:
        description: >-
          Name of a workflow artifact - produced by an upstream job in
          the SAME workflow run (for example kezio's own main.yaml
          "Boot artifacts" job) with actions/upload-artifact, holding
          dist/live/{vmlinuz,initrd.img,filesystem.squashfs,shimx64.efi,
          grubx64.efi,manifest.json,sha256sums} - to download and package
          into the kezio-boot-artifacts image this job boots, instead of
          building it in-lane or pulling a published image. This is the
          preferred mode for kezio's own main.yaml graph: it builds the
          live boot image exactly once (in the "Boot artifacts" job) and
          every e2e job downstream reuses that same build, rather than
          each e2e job repeating the many-minutes `lb build` or falling
          back to a possibly-stale published ghcr image. Empty (the
          default) disables this mode. Precedence when more than one
          boot-artifacts input is set: boot_artifacts_artifact wins over
          build_boot_artifacts, which wins over boot_artifacts_image.
        required: false
        type: string
        default: ""
      build_boot_artifacts:
        description: >-
          Build the live boot image (hack/live-image/build.sh, which
          cross-compiles cmd/agent from this checkout) and the
          kezio-boot-artifacts image from it, instead of consuming
          boot_artifacts_artifact or pulling boot_artifacts_image (see
          both above for the precedence). This is the only way this job
          boots a kezio-agent built from the commit under test without a
          prior job's artifact to hand off - set it when cmd/agent or
          internal/agent changed and no upstream "Boot artifacts" job
          ran in this same workflow. Costs roughly the same many-minutes
          budget that upstream job itself reserves for the identical
          script (see this job's own timeout-minutes), so it is opt-in,
          not the default. Ignored when boot_artifacts_artifact is set.
        required: false
        type: boolean
        default: false
      manager_image:
        description: "Image tag to build/use for the kezio controller-manager."
        required: false
        type: string
        default: "example.com/kezio:e2e-deploy"
      bootd_image:
        description: "Image tag to build/use for kezio-bootd (the network-boot server)."
        required: false
        type: string
        default: "example.com/kezio-bootd:e2e-deploy"
      ingest_image:
        description: "Image tag to build/use for the image-ingest Job (qemu-img/sfdisk/partclone)."
        required: false
        type: string
        default: "example.com/kezio-ingest:e2e-deploy"
      seeder_image:
        description: "Image tag to build/use for the ezio seeder (built from ezio_ref by docker/seeder/Dockerfile)."
        required: false
        type: string
        default: "example.com/kezio-seeder:e2e-deploy"
      image_service_image:
        description: "Image tag to build/use for kezio-image-service (the upload/ingest front door)."
        required: false
        type: string
        default: "example.com/kezio-image-service:e2e-deploy"
      opentracker_image:
        description: >-
          BitTorrent tracker image the seeder and leecher announce
          against. Defaults to the same third-party image
          config/seeder/opentracker-deployment.yaml pins.
        required: false
        type: string
        default: "ghcr.io/tunisiano187/opentracker-docker:master"
      existing_dhcp_image:
        description: >-
          dnsmasq image standing in for the site's existing DHCP server
          (see .github/actions/deploy-existing-dhcp). Deliberately a
          different, pinned third-party image from kezio-bootd's own -
          the two dnsmasq instances must stay distinguishable in logs
          bundle.
        required: false
        type: string
        default: "jpillora/dnsmasq:1.1@sha256:78a9c6711031a557d9c6a79a0b6e060c4ac09de3a8755c78d690acb55b4ccd15"
      kubevirtbmc_version:
        description: >-
          KubeVirtBMC release tag to install (see
          https://github.com/kubevirtbmc/kubevirtbmc's own tag.yml
          release workflow for what "vX.Y.Z" publishes).
        required: false
        type: string
        default: "v0.9.0"
      dhcp_scenario:
        description: >-
          Which of kezio-bootd's DHCP scenarios this run drives through a
          real PXE boot to agent registration (see
          internal/bootd.Config's LeaseMode doc comment):
            - no-relay (default): proxyDHCP beside the existing-dhcp
              stand-in server (see existing_dhcp_image above), with no
              relay leg at all - the stand-in answers the lease directly
              on the wire and bootd answers only the PXE portion of the
              exchange.
            - lease: BOOTD_LEASE_MODE instead - no stand-in DHCP server
              is deployed at all, and bootd's own dnsmasq is the
              segment's sole DHCP lease authority.
          The relay scenario (bootd relaying to a site's existing DHCP
          server) is retired (issue #15); no-relay and lease are the two
          scenarios kezio's own state machine still needs proven.
        required: false
        type: string
        default: no-relay
      target_vm_name:
        description: "Name shared by the target VirtualMachine, Machine, and VirtualMachineBMC."
        required: false
        type: string
        default: "e2e-deploy-vm"
      target_vm_mac:
        description: "MAC address the target VM's provisioning interface boots from."
        required: false
        type: string
        default: "52:54:00:be:ef:02"
      target_vm_disk_serial:
        description: "Serial number of the target VM's blank data disk, matched by Machine.spec.targetDisk."
        required: false
        type: string
        default: "KEZIOE2EDEPLOYDISK1"
      image_name:
        description: "Name of the Image CR the ingested, marker-customized Ubuntu cloud image is uploaded as."
        required: false
        type: string
        default: "e2e-deploy-ubuntu"
      image_service_token:
        description: "Bearer token kezioctl authenticates the image-service upload with."
        required: false
        type: string
        default: "kezio-e2e-deploy-token"

permissions:
  contents: read

env:
  # kezio's own cluster-addon versions, not something an external caller
  # needs to choose, so they stay plain env rather than inputs. Bump
  # deliberately, not as a side effect of an unrelated change.
  RKE2_VERSION: "v1.36.2+rke2r1"
  KUBEVIRT_VERSION: "v1.9.0"
  CDI_VERSION: "v1.65.0"
  # RKE2 has no default StorageClass (unlike k3s's bundled local-path);
  # config/e2e-deploy-path's store/staging PVCs request storageClassName
  # local-path explicitly, so this rancher/local-path-provisioner release
  # is installed and marked default below.
  LOCAL_PATH_PROVISIONER_VERSION: "v0.0.37"
  # See inputs.kubevirtbmc_version.
  KUBEVIRTBMC_VERSION: ${{ inputs.kubevirtbmc_version }}

  # The provisioning L2 segment: a flat L2 with no gateway. The host DOES
  # carry one address on it (PROVISIONING_HOST_IP below) but that does
  # not compromise the "target VM's real deployment segment" shape - see
  # that variable's own comment.
  PROVISIONING_BRIDGE: kezio-prov0
  # Distinct addresses on that segment, kept apart deliberately (and all
  # outside the existing-dhcp pod's dhcp-range 192.0.2.10-100 below, so a
  # leased address can never collide with any of them):
  #   - PROVISIONING_HOST_IP: the runner host's own address on the
  #     bridge. Nothing on the boot path ever addresses this IP; it
  #     exists solely so the runner can act as an on-segment client for
  #     the "Deploy kezio-bootd" step's post-deploy curl probe. Without
  #     it the host has no route to this /24 at all.
  #   - PROVISIONING_BOOTD_NET1_IP: the static address the
  #     kezio-boot-network NAD assigns to bootd's net1 - dnsmasq's
  #     dhcp-range subnet anchor and the TFTP next-server bootd
  #     advertises, and (once bootd's reverse proxy is configured below)
  #     the one address a net-booting machine ever needs for the whole
  #     boot-to-registration flow. No socat forward and no bare ClusterIP
  #     URL anywhere in this lane.
  #   - PROVISIONING_EXISTING_DHCP_NET1_IP: the static address the
  #     existing-dhcp pod's own NAD assigns to its net1, used in the
  #     no-relay scenario only. On the SAME /24 as bootd's net1, keeping
  #     the site's existing DHCP server on-segment, answering leases
  #     directly beside bootd's own proxyDHCP.
  #   - PROVISIONING_TRACKER_NET1_IP / PROVISIONING_SEEDER_NET1_IP: the
  #     static addresses the kezio-tracker-network / kezio-seeder-network
  #     NADs assign to the opentracker and ezio seeder pods' net1 - a
  #     routable data-network secondary NIC on both, so every address a
  #     .torrent or tracker response carries is on-link for the target
  #     VM and no NAT/DNAT ever touches the announce path.
  #   - PROVISIONING_CIDR: the whole segment, handed to bootd as
  #     BOOTD_PROVISIONING_CIDR (its proxyDHCP dhcp-range).
  PROVISIONING_HOST_IP: 192.0.2.1/24
  PROVISIONING_BOOTD_NET1_IP: 192.0.2.2/24
  PROVISIONING_EXISTING_DHCP_NET1_IP: 192.0.2.3/24
  PROVISIONING_TRACKER_NET1_IP: 192.0.2.4/24
  PROVISIONING_SEEDER_NET1_IP: 192.0.2.5/24
  PROVISIONING_CIDR: 192.0.2.0/24
  PROVISIONING_DHCP_RANGE: "192.0.2.10,192.0.2.100,255.255.255.0,12h"
  # Same pool PROVISIONING_DHCP_RANGE draws from - reused (not derived
  # from it) so the "lease" scenario's BOOTD_LEASE_RANGE_START/END don't
  # depend on parsing that string. Kept clear of PROVISIONING_HOST_IP/
  # PROVISIONING_BOOTD_NET1_IP (.1/.2), which stay statically assigned.
  PROVISIONING_LEASE_RANGE_START: "192.0.2.10"
  PROVISIONING_LEASE_RANGE_END: "192.0.2.100"
  DHCP_SCENARIO: ${{ inputs.dhcp_scenario }}
  TARGET_VM_NAME: ${{ inputs.target_vm_name }}
  TARGET_VM_MAC: ${{ inputs.target_vm_mac }}
  TARGET_VM_DISK_SERIAL: ${{ inputs.target_vm_disk_serial }}
  # KubeVirtBMC names the Service it creates for a VirtualMachineBMC
  # "<virtualMachineRef.name>-virtbmc" (RedfishSvcPort 80, plain HTTP -
  # hence "redfish+http" rather than "redfish" below).
  BMC_REDFISH_ADDRESS: "redfish+http://${{ inputs.target_vm_name }}-virtbmc.kezio-system.svc.cluster.local/redfish/v1/Systems/1"
  BMC_CREDS_SECRET: "${{ inputs.target_vm_name }}-bmc-creds"

  # Ubuntu's "minimal" cloud image: a bare GPT+ESP+ext4-root disk is
  # exactly what ingest's partition/filesystem handling needs, at
  # roughly half the download/convert/clone time of the full image.
  # /releases/noble/release/ always serves the latest 24.04 LTS point
  # build.
  UBUNTU_CLOUD_IMAGE_URL: "https://cloud-images.ubuntu.com/minimal/releases/noble/release/ubuntu-24.04-minimal-cloudimg-amd64.img"

  # Image refs come from inputs.* so a caller can override any of them
  # without editing this file.
  EZIO_REF: ${{ inputs.ezio_ref }}
  MANAGER_IMG: ${{ inputs.manager_image }}
  BOOTD_IMG: ${{ inputs.bootd_image }}
  # When boot_artifacts_artifact or build_boot_artifacts is set, this job
  # builds and locally imports this exact tag from either the downloaded
  # artifact or an in-lane hack/live-image/build.sh run (see
  # BOOT_ARTIFACTS_LOCAL below); otherwise this is boot_artifacts_image,
  # pulled by the kubelet from ghcr with no local build or import at all.
  BOOT_ARTIFACTS_IMG: ${{ (inputs.boot_artifacts_artifact != '' || inputs.build_boot_artifacts) && 'example.com/kezio-boot-artifacts:e2e-deploy' || inputs.boot_artifacts_image }}
  # "true" when this job builds and locally imports its own
  # kezio-boot-artifacts image (from a downloaded artifact or an in-lane
  # build) rather than relying on the kubelet to pull boot_artifacts_image
  # from ghcr. Centralizes the precedence check (boot_artifacts_artifact
  # over build_boot_artifacts) so every later step tests one flag instead
  # of repeating the same two-input expression.
  BOOT_ARTIFACTS_LOCAL: ${{ inputs.boot_artifacts_artifact != '' || inputs.build_boot_artifacts }}
  INGEST_IMG: ${{ inputs.ingest_image }}
  SEEDER_IMG: ${{ inputs.seeder_image }}
  IMAGE_SERVICE_IMG: ${{ inputs.image_service_image }}
  OPENTRACKER_IMG: ${{ inputs.opentracker_image }}
  EXISTING_DHCP_IMG: ${{ inputs.existing_dhcp_image }}
  IMAGE_NAME: ${{ inputs.image_name }}
  IMAGE_SERVICE_TOKEN: ${{ inputs.image_service_token }}

  # The marker file kezio-agent's real partclone write must carry through
  # byte-for-byte, read back out of the deployed guest through QGA. A
  # freshly baked-in, self-generated value is a stronger proof that the
  # exact ingested bytes survived qemu-img convert -> sfdisk slice ->
  # partclone capture -> BitTorrent seed/leech -> partclone restore than
  # reading a field already present in the stock image (e.g.
  # /etc/os-release's ID), which would only prove "some Ubuntu booted".
  MARKER_PATH: "/etc/kezio-build-id"

jobs:
  deploy-kubevirt:
    name: Power and PXE-boot a KubeVirt VM through KubeVirtBMC, deploy through it, and verify
    runs-on: ubuntu-latest
    # Honest budget: KVM setup, cluster+addon installs (incl. KubeVirtBMC
    # and cert-manager webhook cert), a full live PXE boot through a real
    # BMC power-on, four extra image builds, a cloud image
    # download+convert+clone, a real partclone write, a BitTorrent leech,
    # an in-guest reboot, a second PXE cycle back to firmware, the
    # deployed OS booting far enough for qemu-guest-agent to connect, and
    # a second BMC power cycle with its own guest-agent reconnect wait.
    # boot_artifacts_artifact costs about the same as the plain-pull
    # baseline (a download plus a cheap `docker build` repackage, not a
    # from-source `lb build`), so it stays at the 100-minute floor rather
    # than build_boot_artifacts' 190.
    timeout-minutes: ${{ inputs.build_boot_artifacts && 190 || 100 }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download the boot-artifacts hand-off
        # Only source that needs no network pull and no in-lane `lb
        # build`: an upstream job in this same workflow run (kezio's own
        # main.yaml "Boot artifacts" job) already produced these files -
        # see boot_artifacts_artifact's own input description for the
        # full precedence. actions/download-artifact resolves a bare
        # `name:` against the current run, so no run-id/token plumbing is
        # needed for a same-run, same-workflow hand-off like this one.
        if: ${{ inputs.boot_artifacts_artifact != '' }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.boot_artifacts_artifact }}
          path: dist/live

      - name: Fail fast if the downloaded boot artifacts are empty
        # Catches a bad artifact name or an upstream job that uploaded
        # nothing, before the many-minutes KVM/cluster setup below ever
        # starts - the same "check early" reasoning as the image-exists
        # check further down.
        if: ${{ inputs.boot_artifacts_artifact != '' }}
        run: |
          set -euo pipefail
          missing=()
          for f in vmlinuz initrd.img filesystem.squashfs shimx64.efi grubx64.efi manifest.json; do
            [ -s "dist/live/${f}" ] || missing+=("${f}")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::boot_artifacts_artifact '${{ inputs.boot_artifacts_artifact }}' downloaded but is missing or empty: ${missing[*]} - the upstream job's artifact hand-off produced nothing usable." >&2
            exit 1
          fi

      - name: Fail fast unless /dev/kvm is usable
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm does not exist on this runner; KubeVirt VMs need hardware virtualization." >&2
            exit 1
          fi
          sudo usermod -aG kvm "$(whoami)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Fail fast unless the boot-artifacts image exists
        # BOOT_ARTIFACTS_IMG is only pulled deep inside later steps, after
        # 20+ minutes of KVM/cluster/image-build setup - a missing image
        # would otherwise surface only as ImagePullBackOff and a rollout
        # timeout well after that setup cost was already paid. Check here
        # instead. Skipped whenever BOOT_ARTIFACTS_LOCAL is set: that mode
        # builds and locally imports its own tag (from either a
        # downloaded artifact or an in-lane build), which no registry has.
        if: ${{ env.BOOT_ARTIFACTS_LOCAL != 'true' }}
        run: |
          set -euo pipefail
          if ! docker manifest inspect "${BOOT_ARTIFACTS_IMG}" >/dev/null; then
            echo "::error::No boot-artifacts image at ${BOOT_ARTIFACTS_IMG}. Publish one first by pushing a \"v*\" tag - release.yaml builds and publishes kezio-boot-artifacts on every such tag (see that workflow's own header comment)." >&2
            exit 1
          fi

      - name: Raise inotify limits
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=1048576
          sudo sysctl -w fs.inotify.max_user_instances=8192

      - name: Resource check (fail fast if the runner is under-resourced)
        run: |
          set -euo pipefail
          echo "===== CPU ====="
          nproc
          echo "===== Memory ====="
          free -h
          echo "===== Disk ====="
          df -h

          cpus="$(nproc)"
          mem_mb="$(free -m | awk '/^Mem:/{print $2}')"
          disk_avail_gb="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"

          # Floor covers a KubeVirt/CDI control plane + one live-booted VM
          # running a full Ubuntu userspace, four extra image builds, and
          # RKE2's heavier-than-k3s control plane (etcd, canal); sized for
          # ubuntu-latest's ~16 GiB, not for tracking peak usage exactly.
          if [ "$cpus" -lt 4 ]; then
            echo "::error::Runner has only ${cpus} CPU(s); the KubeVirt full-deploy stage needs at least 4." >&2
            exit 1
          fi
          if [ "$mem_mb" -lt 14000 ]; then
            echo "::error::Runner has only ${mem_mb} MiB RAM; the KubeVirt full-deploy stage needs at least 14000 MiB." >&2
            exit 1
          fi
          if [ "$disk_avail_gb" -lt 25 ]; then
            echo "::error::Runner has only ${disk_avail_gb} GiB free disk; the KubeVirt full-deploy stage needs at least 25 GiB." >&2
            exit 1
          fi

      - name: Create the provisioning bridge
        # PROVISIONING_HOST_IP is the runner's own address, not a
        # gateway: every participant in the boot path gets its own
        # Multus-attached address and none of them ever addresses this
        # one - it exists only for the "Deploy kezio-bootd" step's
        # post-deploy curl probe.
        run: |
          set -euo pipefail
          sudo ip link add "${PROVISIONING_BRIDGE}" type bridge
          sudo ip addr add "${PROVISIONING_HOST_IP}" dev "${PROVISIONING_BRIDGE}"
          sudo ip link set "${PROVISIONING_BRIDGE}" up

      - name: Cache the Ubuntu cloud image
        id: cache-cloud-image
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ubuntu-cloud.img
          key: ubuntu-cloud-image-${{ env.UBUNTU_CLOUD_IMAGE_URL }}

      - name: Download the Ubuntu cloud image
        if: steps.cache-cloud-image.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sfL -o "${{ runner.temp }}/ubuntu-cloud.img" "${UBUNTU_CLOUD_IMAGE_URL}"

      - name: Customize the Ubuntu cloud image with a marker file and qemu-guest-agent
        # Full reasoning lives in
        # .github/actions/customize-cloud-image/action.yml, shared with
        # e2e-scale-multisite-kubevirt.yml.
        uses: ./.github/actions/customize-cloud-image
        with:
          source-image-path: "${{ runner.temp }}/ubuntu-cloud.img"
          output-image-path: "${{ runner.temp }}/ubuntu-cloud-marked.img"
          marker-path: "${{ env.MARKER_PATH }}"
          cloud-image-url: "${{ env.UBUNTU_CLOUD_IMAGE_URL }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the e2e lane's component images
        # Extracted into its own composite action, shared shape for any
        # future KubeVirt lane - see that action's doc comment for the
        # "why" behind each build.
        uses: ./.github/actions/build-e2e-images
        with:
          build-boot-artifacts: ${{ inputs.build_boot_artifacts }}
          boot-artifacts-downloaded: ${{ inputs.boot_artifacts_artifact != '' }}

      - name: Install RKE2 with Multus enabled
        # Shared with e2e-boot-path-kubevirt.yml and
        # e2e-scale-multisite-kubevirt.yml - see this action's own doc
        # comment for why it was extracted (the three lanes' RKE2 setup
        # was byte-identical).
        uses: ./.github/actions/install-rke2
        with:
          rke2-version: ${{ env.RKE2_VERSION }}

      - name: Harden the provisioning bridge for real PXE/DHCP traffic
        # Extracted into its own composite action - see that action's
        # own doc comment for the full "why" behind each fixup.
        uses: ./.github/actions/harden-provisioning-bridge

      - name: Install local-path-provisioner and mark it the default StorageClass
        # RKE2 ships no default StorageClass. config/e2e-deploy-path's
        # store/staging PVCs request storageClassName local-path
        # explicitly, so that name must exist; being default is also a
        # reasonable fallback for anything else (e.g. CDI's scratch
        # space) that resolves a StorageClass by cluster default.
        run: |
          set -euo pipefail
          kubectl apply -f "https://raw.githubusercontent.com/rancher/local-path-provisioner/${LOCAL_PATH_PROVISIONER_VERSION}/deploy/local-path-storage.yaml"
          kubectl -n local-path-storage rollout status deployment/local-path-provisioner --timeout=180s
          kubectl patch storageclass local-path -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

      - name: Import images into RKE2 containerd
        # RKE2's containerd socket is still under /run/k3s/containerd (a
        # genuine leftover of RKE2's k3s lineage - the socket path itself,
        # not the cluster, is k3s-named), and the plain "ctr" binary needs
        # both -a (socket) and -n k8s.io (the namespace the kubelet reads
        # from) spelled out explicitly - unlike k3s's own "k3s ctr"
        # wrapper, which defaulted both on its own.
        run: |
          set -euo pipefail
          images=("${MANAGER_IMG}" "${BOOTD_IMG}" "${INGEST_IMG}" "${SEEDER_IMG}" "${IMAGE_SERVICE_IMG}")
          # BOOT_ARTIFACTS_IMG only needs a local import when this job
          # built it locally above (from a downloaded artifact or an
          # in-lane build - see BOOT_ARTIFACTS_LOCAL) - the default
          # (published ghcr) tag is left for the kubelet to pull itself
          # inside the cluster, exactly like a real deployment.
          if [ "${BOOT_ARTIFACTS_LOCAL}" = "true" ]; then
            images+=("${BOOT_ARTIFACTS_IMG}")
          fi
          for img in "${images[@]}"; do
            docker save "${img}" | sudo ctr -a /run/k3s/containerd/containerd.sock -n k8s.io images import -
          done

      - name: Install cert-manager, KubeVirt, virtctl, and CDI
        # Shared with e2e-boot-path-kubevirt.yml and
        # e2e-scale-multisite-kubevirt.yml - see this action's own doc
        # comment (and its own header on the KubeVirt CRD race and the
        # KubevirtSeccompProfile gate) for the full "why". Also waits for
        # RKE2's own rke2-multus HelmChart addon to publish the Multus
        # NetworkAttachmentDefinition CRD, which the "Create the
        # provisioning NetworkAttachmentDefinitions" step below needs.
        uses: ./.github/actions/install-cluster-addons
        with:
          kubevirt-version: ${{ env.KUBEVIRT_VERSION }}
          cdi-version: ${{ env.CDI_VERSION }}

      - name: Install KubeVirtBMC
        # One release asset, "kubevirtbmc-install.yaml" (CRD, RBAC,
        # cert-manager Certificate/Issuer, webhook, controller
        # Deployment), published by KubeVirtBMC's own tag.yml on every
        # "v*" tag. `kubectl wait --for condition=Available` on its
        # Deployment also waits out cert-manager issuing the webhook
        # certificate the Deployment's pod mounts (the pod cannot start
        # until that Secret exists).
        run: |
          set -euo pipefail
          kubectl apply -f "https://github.com/kubevirtbmc/kubevirtbmc/releases/download/${KUBEVIRTBMC_VERSION}/kubevirtbmc-install.yaml"
          kubectl -n kubevirtbmc-system wait deployment/kubevirtbmc-controller-manager --for=condition=Available --timeout=300s

      - name: Deploy CRDs and the controller-manager
        run: |
          set -euo pipefail
          make install
          make deploy IMG="${MANAGER_IMG}"
          # privileged, not restricted: bootd's dnsmasq child needs NET_ADMIN/NET_RAW, outside both the restricted and baseline PSA profiles - see config/bootd/deployment.yaml's capabilities comment. Every pod keeps its own strict securityContext regardless.
          kubectl label --overwrite ns kezio-system pod-security.kubernetes.io/enforce=privileged
          kubectl rollout status deployment/kezio-controller-manager -n kezio-system --timeout=180s

      - name: Create the provisioning NetworkAttachmentDefinitions
        # A fifth NAD, kezio-existing-dhcp-network, is created separately
        # by the "Deploy the existing-dhcp pod" step below through
        # .github/actions/deploy-existing-dhcp.
        uses: ./.github/actions/create-provisioning-nads

      - name: Create the image-service bearer token Secret
        run: |
          set -euo pipefail
          kubectl -n kezio-system create secret generic kezio-image-service-token \
            --from-literal=token="${IMAGE_SERVICE_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy image-service+seeder+store+boot/agent servers, wire real ingest/seeding/deploy
        # Applies config/e2e-deploy-path, then wires every per-run value
        # kustomize's static YAML cannot express onto the
        # controller-manager in one `kubectl set env` (the union of
        # `make deploy-image-path`'s and `make deploy-boot-path`'s own
        # env sets, plus fetch-boot-artifacts wiring). The seeder and
        # opentracker image edits are what let a caller's
        # seeder_image/opentracker_image inputs reach the swarm.
        run: |
          set -euo pipefail
          cd config/manager && ../../bin/kustomize edit set image controller="${MANAGER_IMG}"
          cd ../..
          cd config/image-service && ../../bin/kustomize edit set image "image-service=${IMAGE_SERVICE_IMG}"
          cd ../..
          cd config/seeder
          ../../bin/kustomize edit set image "seeder=${SEEDER_IMG}"
          ../../bin/kustomize edit set image "ghcr.io/tunisiano187/opentracker-docker=${OPENTRACKER_IMG}"
          cd ../..
          bin/kustomize build config/e2e-deploy-path | kubectl apply -f -

          # Attach the opentracker pod to the provisioning bridge through
          # its own static-ipam NAD (created above). This is the exact
          # annotation config/seeder's production Deployments carry
          # commented out, applied here as a workflow patch so production
          # manifests keep their site-neutral defaults. Strategic-merge
          # (not JSON Patch, which would clobber the whole annotations
          # map), applied before the rollout waits below so those waits
          # cover the re-rolled, bridge-attached pod.
          kubectl -n kezio-system patch deployment/kezio-opentracker --type=strategic -p='{
            "spec":{"template":{"metadata":{"annotations":{"k8s.v1.cni.cncf.io/networks":"kezio-tracker-network"}}}}
          }'

          # SEEDER_TRACKER_URL is the opentracker pod's own bridge
          # address (its Multus net1, just attached above) - not the
          # kezio-opentracker Service's ClusterIP, not a cluster-DNS
          # name, and not a socat forward on the host's bridge address.
          # This one URL ends up in every .torrent's announce field for
          # BOTH swarm sides - the seeder reconciler's torrents and the
          # .torrent bytes the agent server hands the target VM's
          # leecher - and opentracker registers each peer at its
          # announce's source address, so both properties below are
          # load-bearing:
          #   - The VM reaches it on-link: 192.0.2.4 is on the VM's own
          #     /24, no gateway, no cluster DNS, no route into the pod
          #     network needed (a ClusterIP literal would force that
          #     route plus kube-proxy DNAT).
          #   - The seeder's announce leaves its own net1 with source
          #     192.0.2.5, so the tracker registers the seeder at the one
          #     address the VM's leecher can actually connect to on port
          #     16881 - announce IP == reachable IP, nothing NATs the
          #     path (config/seeder/README.md's no-NAT rule). A socat hop
          #     on 6969 would re-originate the announce from the host and
          #     break exactly this.
          # opentracker binds 0.0.0.0 by default, so it answers on net1
          # with no extra config. Set in the same `kubectl set env` as
          # everything else, before the rollout waits, so the controller
          # starts with the final URL and never needs a restart.
          #
          # SEEDER_DEPLOYMENT_IMAGE opts into the per-Image seeder
          # Deployment path this lane exists to exercise (see
          # internal/controller/seeder_deployment.go); the grace period
          # is cut from its 5-minute production default down to 45s so
          # the teardown step below observes the actual deletion inside
          # this job's time budget. SEEDER_DEPLOYMENT_NETWORK names the
          # same kezio-seeder-network NAD as the pod template's
          # v1.multus-cni.io/default-network - not the additive
          # k8s.v1.cni.cncf.io/networks annotation the opentracker patch
          # uses - so every per-Image seeder pod is single-homed on the
          # provisioning bridge from creation, no post-hoc patch needed,
          # and pod.Status.PodIP is the address agentserver's DeployPlan
          # builder points the target VM's leecher at.
          kubectl -n kezio-system set env deployment/kezio-controller-manager \
            INGEST_IMAGE="${INGEST_IMG}" \
            INGEST_STAGING_PVC=kezio-image-service-staging \
            INGEST_SERVICE_ACCOUNT=kezio-ingest \
            SEEDER_TRACKER_URL="http://${PROVISIONING_TRACKER_NET1_IP%%/*}:6969/announce" \
            SEEDER_DEPLOYMENT_IMAGE="${SEEDER_IMG}" \
            SEEDER_DEPLOYMENT_GRACE_PERIOD=45s \
            SEEDER_DEPLOYMENT_NETWORK=kezio-seeder-network \
            BOOT_SERVER_ADDR=:8090 \
            BOOT_ARTIFACTS_DIR=/boot-artifacts \
            BOOT_SERVER_URL="http://${PROVISIONING_BOOTD_NET1_IP%%/*}:80" \
            AGENT_SERVER_ADDR=:8091 \
            BOOT_AGENT_SERVER_URL="http://${PROVISIONING_BOOTD_NET1_IP%%/*}:80" \
            DEPLOYER=agent

          kubectl -n kezio-system patch deployment/kezio-controller-manager --type=json \
            --patch-file=config/e2e-boot-path/boot-artifacts-init-patch.yaml
          kubectl -n kezio-system set image deployment/kezio-controller-manager \
            fetch-boot-artifacts="${BOOT_ARTIFACTS_IMG}"

          kubectl rollout status deployment/kezio-controller-manager -n kezio-system --timeout=180s
          for d in kezio-image-service kezio-opentracker; do
            kubectl rollout status deployment/"${d}" -n kezio-system --timeout=180s
          done

          # Fail fast if the tracker pod's Multus attachment did not
          # actually happen: the patched annotation only records the
          # *request*, and a CNI ADD failure leaves the pod running
          # normally on eth0 alone, which would only surface 20+ minutes
          # later as a leech stalled at 0%. ezio-seeder is deliberately
          # absent from this loop: there is no shared-fleet pod to check
          # here, only the per-Image Deployment checked once it exists
          # further below.
          for spec in "opentracker:kezio-tracker-network"; do
            component="${spec%%:*}"
            nad_name="${spec#*:}"
            pod_name="$(kubectl -n kezio-system get pods -l app.kubernetes.io/component="${component}" -o json \
              | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
            if [ -z "${pod_name}" ] || [ "${pod_name}" = "null" ]; then
              echo "::error::no non-terminating ${component} pod found" >&2
              exit 1
            fi
            network_status="$(kubectl -n kezio-system get pod "${pod_name}" \
              -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}')"
            if ! grep -q "${nad_name}" <<<"${network_status}"; then
              echo "::error::${component} pod ${pod_name} has no ${nad_name} attachment in its network-status; got: ${network_status}" >&2
              exit 1
            fi
          done

          # Prove the tracker answers HTTP on its bridge address, the
          # same L2 path the VM will use. No -f: an HTTP error body
          # (opentracker answers a parameterless /announce with a
          # bencoded failure) still proves TCP+HTTP reachability; only a
          # connect failure should fail here.
          if ! curl -s -o /dev/null --max-time 10 "http://${PROVISIONING_TRACKER_NET1_IP%%/*}:6969/announce"; then
            echo "::error::opentracker not reachable at ${PROVISIONING_TRACKER_NET1_IP%%/*}:6969 on the provisioning bridge (the announce URL every .torrent carries)" >&2
            exit 1
          fi

      - name: Deploy the existing-dhcp pod on the provisioning bridge
        id: existing-dhcp
        # Skipped in the "lease" scenario: that scenario proves bootd's
        # own dnsmasq is the segment's sole DHCP authority, which needs
        # no other DHCP server present on the wire at all.
        if: ${{ inputs.dhcp_scenario != 'lease' }}
        uses: ./.github/actions/deploy-existing-dhcp
        with:
          namespace: kezio-system
          name: kezio-existing-dhcp
          image: ${{ env.EXISTING_DHCP_IMG }}
          bridge: ${{ env.PROVISIONING_BRIDGE }}
          static-cidr: ${{ env.PROVISIONING_EXISTING_DHCP_NET1_IP }}
          dhcp-range: ${{ env.PROVISIONING_DHCP_RANGE }}

      - name: Deploy kezio-bootd on the provisioning bridge
        # Extracted into its own composite action - see that action's
        # doc comment for the "why" behind each wired value and fail-fast
        # check.
        uses: ./.github/actions/deploy-bootd

      - name: Assert the boot artifacts agent commit
        # This step proves the agent booted was built from this commit
        # (BOOT_ARTIFACTS_LOCAL: either a downloaded same-run artifact or
        # an in-lane build_boot_artifacts build, both built from
        # expected-commit), or states exactly which commit it actually
        # booted instead - so a lane can never go green while silently
        # booting a stale kezio-agent.
        uses: ./.github/actions/assert-boot-artifacts-agent-commit
        with:
          bootd-ip: ${{ env.PROVISIONING_BOOTD_NET1_IP }}
          expected-commit: ${{ github.sha }}
          build-boot-artifacts: ${{ env.BOOT_ARTIFACTS_LOCAL }}

      - name: Ingest the marker-customized Ubuntu image through kezioctl
        run: |
          set -euo pipefail
          kubectl -n kezio-system port-forward svc/kezio-image-service 18080:8080 &
          PF_PID=$!
          echo "PF_PID=${PF_PID}" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://127.0.0.1:18080/healthz" && break
            sleep 1
          done

          bin/kezioctl image upload "${UBUNTU_CLOUD_IMAGE_PATH}" \
            --name "${IMAGE_NAME}" \
            --namespace kezio-system \
            --server http://127.0.0.1:18080 \
            --token "${IMAGE_SERVICE_TOKEN}" \
            --format qcow2

      - name: Wait for the Image to reach Ready (real ingest - qemu-img, sfdisk, partclone)
        uses: ./.github/actions/wait-for-image-ready
        with:
          image-name: ${{ env.IMAGE_NAME }}

      - name: Stop the image-service port-forward
        if: always()
        run: kill "${PF_PID}" 2>/dev/null || true

      - name: Provision the target VM through a real KubeVirtBMC/Redfish endpoint
        # Extracted into its own composite action (BMC credentials
        # Secret, data disk PVC, the VM created powered off, the
        # VirtualMachineBMC, the Redfish reachability check, and the
        # Machine CR that makes kezio's Register step power it on).
        uses: ./.github/actions/provision-target-vm-via-bmc

      - name: Start continuous VM console capture
        # The later "power cycle to consume KubeVirtBMC's one-shot PXE
        # override" step tears the VMI down and brings up a new one
        # (fresh virt-launcher pod, fresh console socket); the action's
        # reattach loop covers that VMI-recreation case, not just a
        # transient drop.
        uses: ./.github/actions/capture-vm-console
        with:
          vm-name: ${{ inputs.target_vm_name }}
          logfile: ${{ runner.temp }}/console.log

      - name: Verify the per-Image seeder Deployment is single-homed on the provisioning bridge
        # The Machine created above is what drives
        # internal/controller/seeder_deployment.go's reference count:
        # reconcileSeederDeployments creates a Deployment labelled
        # kezio.kojuro.date/seeder-image=${IMAGE_NAME} the moment the
        # Machine enters Provisioning, which this step waits for - a real
        # Machine driving create-on-demand, not a unit test poking the
        # reconciler directly.
        #
        # Unlike the opentracker patch above, no kubectl patch happens
        # here: SEEDER_DEPLOYMENT_NETWORK (set before this Machine ever
        # existed) makes buildSeederDeployment stamp every per-Image
        # seeder pod's template with v1.multus-cni.io/default-network:
        # kezio-seeder-network from creation - single-homed by
        # construction, never dual-homed the way the opentracker/tracker
        # pods are with the additive k8s.v1.cni.cncf.io/networks
        # annotation. This step verifies the attachment took and that
        # pod.Status.PodIP - what agentserver's resolveSeederTorrentURL
        # resolves into the deploy plan - landed on the provisioning
        # subnet, not the cluster pod network.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 300 ))
          seeder_dep=""
          while true; do
            seeder_dep="$(kubectl -n kezio-system get deployments \
              -l "kezio.kojuro.date/seeder-image=${IMAGE_NAME}" \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            if [ -n "${seeder_dep}" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::no per-Image seeder Deployment labelled kezio.kojuro.date/seeder-image=${IMAGE_NAME} appeared - the Machine never drove it into existence." >&2
              kubectl -n kezio-system get machine "${TARGET_VM_NAME}" -o yaml || true
              exit 1
            fi
            sleep 5
          done
          echo "per-Image seeder Deployment: ${seeder_dep}"
          echo "SEEDER_DEPLOYMENT_NAME=${seeder_dep}" >> "$GITHUB_ENV"

          kubectl rollout status deployment/"${seeder_dep}" -n kezio-system --timeout=180s

          # Same non-terminating-pod network-status check the swarm pods
          # get above - a CNI ADD failure here would otherwise only
          # surface later as a leech stalled at 0%.
          pod_name="$(kubectl -n kezio-system get pods -l "kezio.kojuro.date/seeder-image=${IMAGE_NAME}" -o json \
            | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
          if [ -z "${pod_name}" ] || [ "${pod_name}" = "null" ]; then
            echo "::error::no non-terminating pod found for per-Image seeder Deployment ${seeder_dep}" >&2
            exit 1
          fi
          network_status="$(kubectl -n kezio-system get pod "${pod_name}" \
            -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}')"
          if ! grep -q "kezio-seeder-network" <<<"${network_status}"; then
            echo "::error::per-Image seeder pod ${pod_name} has no kezio-seeder-network attachment in its network-status; got: ${network_status}" >&2
            exit 1
          fi

          pod_ip="$(kubectl -n kezio-system get pod "${pod_name}" -o jsonpath='{.status.podIP}')"
          if [[ "${pod_ip}" != "${PROVISIONING_SEEDER_NET1_IP%%/*}" ]]; then
            echo "::error::per-Image seeder pod ${pod_name} PodIP is ${pod_ip}, want the provisioning bridge address ${PROVISIONING_SEEDER_NET1_IP%%/*} - default-network did not replace the cluster network as expected." >&2
            kubectl -n kezio-system get pod "${pod_name}" -o yaml || true
            exit 1
          fi
          echo "SEEDER_DEPLOYMENT_POD=${pod_name}" >> "$GITHUB_ENV"

      - name: Wait for the Machine to reach Provisioned
        # Generous but bounded: covers the multi-minute live boot chain,
        # plus disk resolution, partitioning, the real partclone
        # write/BitTorrent leech, PostHooks, and finalize.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            state="$(kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.state}' || true)"
            echo "$(date -Is) Machine state: ${state:-<none>}"
            if [ "${state}" = "Provisioned" ]; then
              break
            fi
            if [ "${state}" = "Error" ]; then
              echo "::error::Machine ${TARGET_VM_NAME} landed in Error while deploying." >&2
              kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Machine ${TARGET_VM_NAME} did not reach Provisioned within the timeout." >&2
              exit 1
            fi
            sleep 10
          done
          kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml

      - name: "Verify layer 1 (controller): status.provisioning matches spec, conditions clean"
        run: |
          set -euo pipefail
          machine_json="$(kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o json)"

          provisioned_image="$(jq -r '.status.provisioning.image.imageRef.name' <<<"${machine_json}")"
          if [ "${provisioned_image}" != "${IMAGE_NAME}" ]; then
            echo "::error::status.provisioning.image.imageRef.name = ${provisioned_image}, want ${IMAGE_NAME}" >&2
            exit 1
          fi

          target_disk="$(jq -r '.status.provisioning.image.targetDisk' <<<"${machine_json}")"
          if [ -z "${target_disk}" ] || [ "${target_disk}" = "null" ]; then
            echo "::error::status.provisioning.image.targetDisk is empty" >&2
            exit 1
          fi
          echo "resolved target disk: ${target_disk}"

          ready_status="$(jq -r '.status.conditions[] | select(.type=="Ready") | .status' <<<"${machine_json}")"
          if [ "${ready_status}" != "True" ]; then
            echo "::error::Ready condition status = ${ready_status}, want True" >&2
            echo "${machine_json}" | jq '.status.conditions'
            exit 1
          fi

      - name: "Verify the no-relay proxyDHCP scenario answered leases directly"
        # no-relay scenario only: proves bootd never relayed anything and
        # the existing-dhcp pod deployed alongside it answered the
        # DISCOVER/lease exchange on its own.
        if: ${{ inputs.dhcp_scenario == 'no-relay' }}
        run: |
          set -euo pipefail
          existing_dhcp_log="$(kubectl -n kezio-system logs deployment/kezio-existing-dhcp --all-containers --tail=-1)"
          if ! grep -qF "DHCPDISCOVER" <<<"${existing_dhcp_log}" || ! grep -qF "DHCPACK" <<<"${existing_dhcp_log}"; then
            echo "::error::existing-dhcp's own log shows no DHCPDISCOVER/DHCPACK exchange - it never answered a lease directly, which pure proxyDHCP beside it depends on." >&2
            echo "${existing_dhcp_log}"
            exit 1
          fi

      - name: "Verify the lease scenario made bootd its own segment's lease authority"
        # lease scenario only: no existing-dhcp pod was ever deployed, so
        # a lease can only have come from bootd's own dnsmasq
        # (BOOTD_LEASE_MODE) - confirm both that absence and that bootd's
        # log shows it issuing a lease (DHCPACK), not just answering the
        # PXE portion of the exchange.
        if: ${{ inputs.dhcp_scenario == 'lease' }}
        run: |
          set -euo pipefail
          if kubectl -n kezio-system get deployment/kezio-existing-dhcp >/dev/null 2>&1; then
            echo "::error::kezio-existing-dhcp exists in the lease scenario - the segment must carry no stand-in DHCP server at all so bootd is unambiguously the lease authority." >&2
            exit 1
          fi

          bootd_log="$(kubectl -n kezio-system logs deployment/kezio-bootd --all-containers --tail=-1)"
          if ! grep -qF "DHCPACK" <<<"${bootd_log}"; then
            echo "::error::bootd's dnsmasq log shows no DHCPACK - it never issued a lease of its own under BOOTD_LEASE_MODE." >&2
            echo "${bootd_log}"
            exit 1
          fi

      - name: "BMC power cycle to consume KubeVirtBMC's one-shot PXE override (VMI recreation)"
        # KubeVirtBMC-only accommodation, not a kezio product concern. On
        # real hardware, firmware consumes agentDeployer.Register's
        # one-shot PXE override (SetOneTimePXEBoot) after a single boot,
        # so kezio-agent's in-guest reboot at the end of finalize lands
        # on the deployed disk. KubeVirtBMC instead emulates the override
        # by injecting bootOrder into the VMI spec and only clears it
        # (bootorderrestore controller) once the VMI is recreated - an
        # in-guest reboot keeps the same VMI/QEMU process, so OVMF keeps
        # rewriting NVRAM BootOrder from the still-present override,
        # falling through to PXE every time. A real BMC-level stop/start
        # here (spec.online) recreates the VMI so bootorderrestore
        # restores the original boot order before the in-guest reboot
        # chain runs.
        #
        # Confirmed not to disturb kezio's own state machine:
        # reconcileProvisioned only calls reconcilePower (PowerOn/
        # PowerOff) for a spec.online mismatch on a Provisioned Machine;
        # neither issues SetOneTimePXEBoot (only Register does), so this
        # power cycle cannot re-arm the override or restart provisioning.
        run: |
          set -euo pipefail

          old_uid="$(kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.metadata.uid}')"
          echo "current VMI UID: ${old_uid}"

          kubectl patch machine "${TARGET_VM_NAME}" -n kezio-system --type=merge -p '{"spec":{"online":false}}'

          deadline=$(( $(date +%s) + 300 ))
          while true; do
            status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
            vmi_now="$(kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
            echo "$(date -Is) VM printableStatus=${status:-<none>} VMI UID=${vmi_now:-<gone>}"
            if [ "${status}" = "Stopped" ] && [ -z "${vmi_now}" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VM ${TARGET_VM_NAME} did not stop and its VMI did not disappear within the timeout after spec.online=false - the old VMI must be gone before bootorderrestore can consume the one-shot on the next start." >&2
              kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            sleep 5
          done

          kubectl patch machine "${TARGET_VM_NAME}" -n kezio-system --type=merge -p '{"spec":{"online":true}}'

          deadline=$(( $(date +%s) + 300 ))
          new_uid=""
          while true; do
            status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
            new_uid="$(kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
            echo "$(date -Is) VM printableStatus=${status:-<none>} VMI UID=${new_uid:-<none>}"
            if [ "${status}" = "Running" ] && [ -n "${new_uid}" ] && [ "${new_uid}" != "${old_uid}" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VM ${TARGET_VM_NAME} did not come back up with a new VMI within the timeout after spec.online=true." >&2
              kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            sleep 5
          done
          echo "new VMI UID: ${new_uid}"

          # Wait for KubeVirtBMC's bootorderrestore controller to actually
          # consume the one-shot against this new VMI - the VMI existing
          # is not enough, restoring the boot order happens
          # asynchronously once the controller observes the new
          # generation.
          deadline=$(( $(date +%s) + 120 ))
          while true; do
            if kubectl -n kubevirtbmc-system logs deployment/kubevirtbmc-controller-manager --since=5m 2>/dev/null \
                | grep -F "oneshot boot order restored successfully" | grep -qF "${TARGET_VM_NAME}"; then
              echo "KubeVirtBMC restored the original boot order (one-shot consumed)."
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::KubeVirtBMC's bootorderrestore controller never logged consuming the one-shot boot override for ${TARGET_VM_NAME} within the timeout - it may still be in effect." >&2
              kubectl -n kubevirtbmc-system logs deployment/kubevirtbmc-controller-manager --tail=200
              exit 1
            fi
            sleep 5
          done

          kubectl wait vmi/"${TARGET_VM_NAME}" -n kezio-system --for=condition=Ready --timeout=180s

      - name: "Wait for layer 2 (boot): the deployed disk boots and qemu-guest-agent connects"
        # The live environment never runs qemu-guest-agent, so
        # AgentConnected only goes True once the post-deploy in-guest
        # reboot has fallen through to the disk kezio-agent wrote and its
        # userspace started the agent. guestOSInfo comes from the same
        # QGA connection, together proving kernel + userspace came up
        # from the deployed disk, not from a Machine.status side-channel.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 600 ))
          while true; do
            connected="$(kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system \
              -o jsonpath='{.status.conditions[?(@.type=="AgentConnected")].status}' || true)"
            echo "$(date -Is) VMI AgentConnected: ${connected:-<none>}"
            [ "${connected}" = "True" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::qemu-guest-agent never connected within the timeout after Provisioned - the VM did not boot from the deployed disk." >&2
              echo "===== VMI ${TARGET_VM_NAME} conditions at timeout ====="
              kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system -o yaml || true
              exit 1
            fi
            sleep 5
          done

          guest_os_id="$(kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.guestOSInfo.id}')"
          echo "guestOSInfo.id: ${guest_os_id}"
          if [ "${guest_os_id}" != "ubuntu" ]; then
            echo "::error::guestOSInfo.id = ${guest_os_id}, want ubuntu (the deployed image's OS, not the live-boot environment's)" >&2
            exit 1
          fi

      - name: "Verify layer 3 (content): read the marker file back through QGA and compare"
        # No SSH: the marker is read with QGA's
        # guest-file-open/guest-file-read/guest-file-close commands, sent
        # over virtio-serial via `virsh qemu-agent-command` run inside
        # the VM's own virt-launcher pod - the same mechanism a
        # QGA-based guest-file read helper uses (there is no
        # `virtctl guestexec` subcommand to reach for instead).
        run: |
          set -euo pipefail
          # Exclude terminating pods so a lingering old virt-launcher pod
          # (still phase=Running while it shuts down) cannot shadow the
          # live one.
          launcher_pod="$(kubectl get pods -n kezio-system -l "kubevirt.io/vm=${TARGET_VM_NAME}" -o json \
            | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
          if [ -z "${launcher_pod}" ] || [ "${launcher_pod}" = "null" ]; then
            echo "::error::no non-terminating virt-launcher pod found for VM ${TARGET_VM_NAME}" >&2
            exit 1
          fi
          domain="kezio-system_${TARGET_VM_NAME}"

          qga_exec() {
            kubectl exec -n kezio-system "${launcher_pod}" -c compute -- \
              virsh qemu-agent-command "${domain}" "$1"
          }

          open_reply="$(qga_exec "{\"execute\":\"guest-file-open\",\"arguments\":{\"path\":\"${MARKER_PATH}\",\"mode\":\"r\"}}")"
          handle="$(jq -r '.return' <<<"${open_reply}")"
          if [ "${handle}" = "null" ] || [ -z "${handle}" ]; then
            echo "::error::guest-file-open on ${MARKER_PATH} failed: ${open_reply}" >&2
            exit 1
          fi

          read_reply="$(qga_exec "{\"execute\":\"guest-file-read\",\"arguments\":{\"handle\":${handle},\"count\":4096}}")"
          qga_exec "{\"execute\":\"guest-file-close\",\"arguments\":{\"handle\":${handle}}}" >/dev/null

          marker_content="$(jq -r '.return["buf-b64"]' <<<"${read_reply}" | base64 -d | tr -d '\n')"
          echo "marker content: ${marker_content}"

          if [ "${marker_content}" != "${MARKER_TOKEN}" ]; then
            echo "::error::marker file content mismatch: guest has ${marker_content@Q}, expected ${MARKER_TOKEN@Q}" >&2
            exit 1
          fi

      - name: "Verify the per-Image seeder Deployment is torn down after its grace period"
        # Demand for this Deployment dropped to zero the moment the
        # Machine left Provisioning - already several minutes ago given
        # the Layer 2/3 waits in between, comfortably longer than
        # SEEDER_DEPLOYMENT_GRACE_PERIOD=45s (a real deployment leaves it
        # at the reconciler's 5-minute default). Asserts the delete side
        # of the reference count fired, not just the create side already
        # proved above. Polls rather than asserting gone immediately,
        # covering the one reconcile still needed after the grace period.
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 120 ))
          while kubectl -n kezio-system get deployment "${SEEDER_DEPLOYMENT_NAME}" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::per-Image seeder Deployment ${SEEDER_DEPLOYMENT_NAME} was not removed within the grace period plus poll budget." >&2
              kubectl -n kezio-system get deployment "${SEEDER_DEPLOYMENT_NAME}" -o yaml || true
              exit 1
            fi
            sleep 5
          done
          echo "per-Image seeder Deployment ${SEEDER_DEPLOYMENT_NAME} was removed."

      - name: "BMC power cycle: PowerOff through the BMC (spec.online=false)"
        # Independent of Register's one-time PXE power-on: once
        # Provisioned, reconcilePower keeps the VM's power matched to
        # spec.online through the same BMC (PowerOff -> Redfish
        # GracefulShutdownResetType -> KubeVirtBMC's VirtualMachine
        # Stop), proving the steady-state power path is BMC-driven too.
        run: |
          set -euo pipefail
          kubectl patch machine "${TARGET_VM_NAME}" -n kezio-system --type=merge -p '{"spec":{"online":false}}'

          deadline=$(( $(date +%s) + 300 ))
          while true; do
            status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
            powered_on="$(kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.poweredOn}' || true)"
            echo "$(date -Is) VM printableStatus=${status:-<none>} Machine status.poweredOn=${powered_on:-<none>}"
            [ "${status}" = "Stopped" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VM ${TARGET_VM_NAME} did not stop within the timeout after spec.online=false - kezio's BMC-driven PowerOff did not take effect." >&2
              kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            sleep 5
          done

      - name: "BMC power cycle: PowerOn through the BMC (spec.online=true) and reconnect"
        # Re-runs the layer 2 AgentConnected poll here (proving the
        # deployed disk survived the off/on cycle and booted again), so
        # the "Verify layer 3 again..." step below only needs to add the
        # marker-content re-read.
        run: |
          set -euo pipefail
          kubectl patch machine "${TARGET_VM_NAME}" -n kezio-system --type=merge -p '{"spec":{"online":true}}'

          deadline=$(( $(date +%s) + 300 ))
          while true; do
            status="$(kubectl get vm "${TARGET_VM_NAME}" -n kezio-system -o jsonpath='{.status.printableStatus}' || true)"
            echo "$(date -Is) VM printableStatus: ${status:-<none>}"
            [ "${status}" = "Running" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::VM ${TARGET_VM_NAME} did not start within the timeout after spec.online=true - kezio's BMC-driven PowerOn did not take effect." >&2
              kubectl get machine "${TARGET_VM_NAME}" -n kezio-system -o yaml
              exit 1
            fi
            sleep 5
          done
          kubectl wait vmi/"${TARGET_VM_NAME}" -n kezio-system --for=condition=Ready --timeout=180s

          deadline=$(( $(date +%s) + 600 ))
          while true; do
            connected="$(kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system \
              -o jsonpath='{.status.conditions[?(@.type=="AgentConnected")].status}' || true)"
            echo "$(date -Is) VMI AgentConnected: ${connected:-<none>}"
            [ "${connected}" = "True" ] && break
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::qemu-guest-agent never reconnected after the BMC-driven PowerOn - the VM did not boot back from the deployed disk." >&2
              echo "===== VMI ${TARGET_VM_NAME} conditions at timeout ====="
              kubectl get vmi "${TARGET_VM_NAME}" -n kezio-system -o yaml || true
              exit 1
            fi
            sleep 5
          done

      - name: "Verify layer 3 again after the BMC power cycle: read the marker file back through QGA and compare"
        # Same QGA mechanism as "Verify layer 3 (content)..." above,
        # re-run after the BMC-driven PowerOff/PowerOn cycle: proves the
        # deployed disk's content is still intact after a full off/on
        # cycle, not merely that the VM came back "Running". The
        # virt-launcher pod is looked up fresh rather than reusing the
        # earlier variable - KubeVirt ties one pod per VMI run, and the
        # PowerOff/PowerOn above already replaced it with a new pod.
        run: |
          set -euo pipefail
          launcher_pod="$(kubectl get pods -n kezio-system -l "kubevirt.io/vm=${TARGET_VM_NAME}" -o json \
            | jq -r '[.items[] | select(.metadata.deletionTimestamp == null)][0].metadata.name')"
          if [ -z "${launcher_pod}" ] || [ "${launcher_pod}" = "null" ]; then
            echo "::error::no non-terminating virt-launcher pod found for VM ${TARGET_VM_NAME}" >&2
            exit 1
          fi
          domain="kezio-system_${TARGET_VM_NAME}"

          qga_exec() {
            kubectl exec -n kezio-system "${launcher_pod}" -c compute -- \
              virsh qemu-agent-command "${domain}" "$1"
          }

          open_reply="$(qga_exec "{\"execute\":\"guest-file-open\",\"arguments\":{\"path\":\"${MARKER_PATH}\",\"mode\":\"r\"}}")"
          handle="$(jq -r '.return' <<<"${open_reply}")"
          if [ "${handle}" = "null" ] || [ -z "${handle}" ]; then
            echo "::error::guest-file-open on ${MARKER_PATH} failed (post-BMC-power-cycle): ${open_reply}" >&2
            exit 1
          fi

          read_reply="$(qga_exec "{\"execute\":\"guest-file-read\",\"arguments\":{\"handle\":${handle},\"count\":4096}}")"
          qga_exec "{\"execute\":\"guest-file-close\",\"arguments\":{\"handle\":${handle}}}" >/dev/null

          marker_content="$(jq -r '.return["buf-b64"]' <<<"${read_reply}" | base64 -d | tr -d '\n')"
          echo "marker content (post-BMC-power-cycle): ${marker_content}"

          if [ "${marker_content}" != "${MARKER_TOKEN}" ]; then
            echo "::error::marker file content mismatch after the BMC power cycle: guest has ${marker_content@Q}, expected ${MARKER_TOKEN@Q}" >&2
            exit 1
          fi

      - name: Dump diagnostics on failure
        # Extracted into its own composite action - see that action's
        # doc comment for the "why" behind each dump.
        uses: ./.github/actions/dump-e2e-diagnostics

      - name: Collect the always-on diagnostics bundle
        if: always()
        # Unconditional: bootd's pod log carries dnsmasq's forwarded
        # per-request log-dhcp decision lines, controller-manager's log
        # is where the boot server's own per-request lines land, and the
        # rest is the same Machine/Image/events picture the failure-only
        # dump prints inline - worth having on a passing run too. The
        # per-Image seeder Deployment is deliberately absent here:
        # reconcileSeederDeployments removes it once the Machine finishes
        # provisioning, so it is usually already gone by this point on a
        # passing run.
        uses: ./.github/actions/collect-e2e-diagnostics-bundle
        with:
          output-dir: ${{ runner.temp }}
          deployments: |
            kezio-controller-manager:controller-manager.log
            kezio-bootd:bootd.log
            kezio-existing-dhcp:existing-dhcp.log
            kezio-opentracker:opentracker.log
            kezio-image-service:image-service.log
          job-label-selectors: |
            kezio.kojuro.date/image:ingest.log
          resources: |
            machine/${{ inputs.target_vm_name }}:machine.yaml
            image/${{ inputs.image_name }}:image.yaml
            vm/${{ inputs.target_vm_name }}:vm.yaml
            vmi/${{ inputs.target_vm_name }}:vmi.yaml

      - name: Upload E2E diagnostics artifacts
        # Always, not just on failure: the console capture and
        # diagnostics dump are equally worth having on a passing run.
        # if-no-files-found: ignore, since the two diagnostics-*-dump.log
        # files only exist on a failed run.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ github.job }}-${{ inputs.target_vm_name }}
          path: |
            ${{ runner.temp }}/console.log
            ${{ runner.temp }}/diagnostics-dump.log
            ${{ runner.temp }}/diagnostics-kubevirtbmc-dump.log
            ${{ runner.temp }}/bootd.log
            ${{ runner.temp }}/existing-dhcp.log
            ${{ runner.temp }}/controller-manager.log
            ${{ runner.temp }}/opentracker.log
            ${{ runner.temp }}/image-service.log
            ${{ runner.temp }}/ezio-seeder.log
            ${{ runner.temp }}/ingest.log
            ${{ runner.temp }}/machine.yaml
            ${{ runner.temp }}/image.yaml
            ${{ runner.temp }}/vm.yaml
            ${{ runner.temp }}/vmi.yaml
            ${{ runner.temp }}/events.txt
          if-no-files-found: ignore
          retention-days: 14
