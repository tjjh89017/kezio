# Minimal stand-in for Multus's own
# network-attachment-definitions.k8s.cni.cncf.io CRD, installed here only
# so this package's envtest suite can create/read
# NetworkAttachmentDefinition objects the way internal/nadvalidate and
# SubnetReconciler read them in production: as unstructured.Unstructured,
# with only spec.config actually read. A real cluster gets the full
# upstream CRD from the Multus CNI installation
# (https://github.com/k8snetworkplumbingwg/multus-cni); this repo does
# not vendor or own that CRD, so this file exists solely to make the NAD
# kind creatable inside envtest's control plane, and is not applied to
# any real cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  names:
    kind: NetworkAttachmentDefinition
    listKind: NetworkAttachmentDefinitionList
    plural: network-attachment-definitions
    singular: network-attachment-definition
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                config:
                  type: string
