      labels:
        app.kubernetes.io/component: image-service
        app.kubernetes.io/name: kezio
        app.kubernetes.io/part-of: kezio
    spec:
      containers:
      - args:
        - --addr=:8080
        - --staging-dir=/staging
        - --token-file=/etc/kezio/image-service/token
        command:
        - /image-service
        image: ghcr.io/tjjh89017/kezio-image-service:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        name: image-service
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /staging
          name: staging
        - mountPath: /etc/kezio/image-service
          name: token
          readOnly: true
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: staging
        persistentVolumeClaim:
          claimName: kezio-image-service-staging
      - name: token
        secret:
          defaultMode: 288
          secretName: kezio-image-service-token
