apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: machinehardwares.kezio.kojuro.date
spec:
  group: kezio.kojuro.date
  names:
    kind: MachineHardware
    listKind: MachineHardwareList
    plural: machinehardwares
    singular: machinehardware
  scope: Namespaced
  versions:
  - name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          MachineHardware is the Schema for the machinehardwares API. It carries
          no status: it is itself the observed hardware inventory, owned by and
          name-aligned with its Machine.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MachineHardwareSpec is the hardware inventory the agent reports at
              registration. Every field is optional: a MachineHardware object starts
              empty and the controller fills it in once inspection completes.
            properties:
              cpuCount:
                description: CPUCount is the machine's logical CPU count.
                format: int32
                minimum: 0
                type: integer
              disks:
                description: Disks lists the machine's disks.
                items:
                  description: |-
                    MachineHardwareDisk records one disk from the agent-reported inventory.
                    Field set matches TargetDiskHints so a hint can be matched against an
                    entry here with no unit conversion.
                  properties:
                    deviceName:
                      description: DeviceName is the kernel device path, for example
                        "/dev/nvme0n1".
                      maxLength: 255
                      minLength: 1
                      type: string
                    hctl:
                      description: |-
                        HCTL is the disk's SCSI host:channel:target:lun address, for example
                        "0:0:0:0".
                      pattern: ^[0-9]+:[0-9]+:[0-9]+:[0-9]+$
                      type: string
                    model:
                      description: Model is the disk's reported model string.
                      maxLength: 255
                      type: string
                    pciePath:
                      description: |-
                        PciePath is the disk's PCIe address, read by resolving
                        /sys/block/<dev>.
                      maxLength: 255
                      type: string
                    rotational:
                      description: |-
                        Rotational reports whether the disk is a spinning disk (true) or
                        solid-state (false), read from /sys/block/*/queue/rotational.
                      type: boolean
                    serialNumber:
                      description: |-
                        SerialNumber is the disk's serial number, read from
                        /sys/block/*/device/serial or udev.
                      maxLength: 255
                      type: string
                    sizeBytes:
                      description: SizeBytes is the disk's size, from blockdev --getsize64.
                      format: int64
                      minimum: 0
                      type: integer
                    slotNumber:
                      description: |-
                        SlotNumber is the disk's NVMe namespace or PCIe slot number, read
                        best-effort from DMI.
                      format: int32
                      type: integer
                    vendor:
                      description: Vendor is the disk's reported vendor string.
                      maxLength: 255
                      type: string
                    wwn:
                      description: WWN is the disk's World Wide Name, read from udev's
                        ID_WWN.
                      maxLength: 255
                      type: string
                  required:
                  - deviceName
                  type: object
                maxItems: 64
                type: array
              memoryBytes:
                description: MemoryBytes is the machine's total memory.
                format: int64
                minimum: 0
                type: integer
              nics:
                description: Nics lists the machine's network interfaces.
                items:
                  description: |-
                    MachineHardwareNIC records one network interface from the
                    agent-reported inventory.
                  properties:
                    macAddress:
                      description: MACAddress is the interface's MAC address.
                      pattern: ^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$
                      type: string
                    name:
                      description: Name is the interface name, for example "eth0".
                      maxLength: 255
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
            type: object
        type: object
    served: true
    storage: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: machines.kezio.kojuro.date
spec:
  group: kezio.kojuro.date
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    singular: machine
  scope: Namespaced
  versions:
  - name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Machine is the Schema for the machines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MachineSpec defines the desired state of Machine. There is no power
              intent field here: power follows the deploy lifecycle and the
              AfterDeploy mechanism only.
            properties:
              afterDeploy:
                default: Reboot
                description: |-
                  AfterDeploy selects what happens when a deployment finishes without
                  an OS image to reboot into. Defaults to Reboot.
                enum:
                - Reboot
                - PowerOff
                type: string
              bmc:
                description: |-
                  BMC identifies the board management controller that powers and
                  boot-orders this machine. The controller uses it to power the
                  machine on for inspection and deployment, and to set its power
                  state afterward.
                properties:
                  address:
                    description: |-
                      Address is the BMC endpoint URL. Its scheme selects the driver, for
                      example "redfish://" or "ipmi://".
                    pattern: ^[a-zA-Z][a-zA-Z0-9+.-]*://.+
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names the Secret holding the BMC username and
                      password.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - address
                - credentialsSecretRef
                type: object
              bootMACAddress:
                description: |-
                  BootMACAddress is the MAC address of the NIC the machine network
                  boots from. The boot config server uses it to find this machine.
                  Normally discovered by inspection; it is mandatory only when the
                  inspect-disable annotation skips inspection, a rule the Machine
                  webhook enforces.
                pattern: ^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$
                type: string
              dataImages:
                description: |-
                  DataImages is an ordered list of additional, non-OS images deployed
                  alongside the OS image in the same live session (or by themselves,
                  when ImageRef is absent).
                items:
                  description: |-
                    MachineDataImage is one additional, non-OS image deployed alongside (or
                    instead of) the machine's OS image in the same live session. Each entry
                    resolves against its own TargetDisk hints; all resolved disks across a
                    Machine's OS image and its DataImages must be distinct.
                  properties:
                    imageRef:
                      description: |-
                        ImageRef names the Image to deploy. It is typically a non-bootable
                        image (a data disk or a scratch layout), since only the OS image
                        gets a boot entry.
                      properties:
                        name:
                          description: |-
                            Post-mutation admission always re-serialises this struct, so a
                            zero-value Name would otherwise satisfy "required"; MinLength closes
                            that gap. MaxLength mirrors the Kubernetes object name limit and
                            bounds the CEL cost of any pattern-matching XValidation rule a
                            field of this type carries (see ImageSlot.ContentRef).
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      type: object
                    targetDisk:
                      description: TargetDisk selects the disk this image deploys
                        to.
                      properties:
                        deviceName:
                          description: |-
                            DeviceName is the kernel device path, for example "/dev/nvme0n1".
                            This is the last-choice hint: device names are not stable across
                            boots.
                          maxLength: 255
                          type: string
                        hctl:
                          description: |-
                            HCTL is the disk's SCSI host:channel:target:lun address, for example
                            "0:0:0:0".
                          pattern: ^[0-9]+:[0-9]+:[0-9]+:[0-9]+$
                          type: string
                        maxSizeGigabytes:
                          description: MaxSizeGigabytes rejects disks larger than
                            this size.
                          format: int64
                          minimum: 1
                          type: integer
                        minSizeGigabytes:
                          description: MinSizeGigabytes rejects disks smaller than
                            this size.
                          format: int64
                          minimum: 1
                          type: integer
                        model:
                          description: Model is the disk's reported model string.
                          maxLength: 255
                          type: string
                        pciePath:
                          description: |-
                            PciePath is the disk's PCIe address, read by resolving
                            /sys/block/<dev>.
                          maxLength: 255
                          type: string
                        rotational:
                          description: |-
                            Rotational matches on whether the disk is a spinning disk (true) or
                            solid-state (false), read from /sys/block/*/queue/rotational.
                          type: boolean
                        serialNumber:
                          description: |-
                            SerialNumber is the disk's serial number, read from
                            /sys/block/*/device/serial or udev.
                          maxLength: 255
                          type: string
                        slotNumber:
                          description: |-
                            SlotNumber is the disk's NVMe namespace or PCIe slot number, read
                            best-effort from DMI.
                          format: int32
                          type: integer
                        vendor:
                          description: Vendor is the disk's reported vendor string.
                          maxLength: 255
                          type: string
                        wwn:
                          description: WWN is the disk's World Wide Name, read from
                            udev's ID_WWN.
                          maxLength: 255
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: minSizeGigabytes must be less than or equal to maxSizeGigabytes
                        rule: '!has(self.minSizeGigabytes) || !has(self.maxSizeGigabytes)
                          || self.minSizeGigabytes <= self.maxSizeGigabytes'
                  required:
                  - imageRef
                  type: object
                maxItems: 32
                type: array
              ezio:
                description: |-
                  Ezio overrides the operator's cluster-wide default EZIO tuning for
                  this machine's leecher.
                properties:
                  aioThreads:
                    description: AioThreads overrides the EZIO daemon's async I/O
                      thread count.
                    format: int32
                    minimum: 1
                    type: integer
                  cacheSizeMB:
                    description: |-
                      CacheSizeMB overrides the EZIO daemon's unified cache size, in
                      megabytes.
                    format: int32
                    minimum: 1
                    type: integer
                  maxConnections:
                    description: |-
                      MaxConnections overrides the per-torrent maximum peer connection
                      count (ezio's AddTorrent max_connections).
                    format: int32
                    maximum: 1024
                    minimum: 1
                    type: integer
                  maxUploads:
                    description: |-
                      MaxUploads overrides the per-torrent maximum upload slot count
                      (ezio's AddTorrent max_uploads).
                    format: int32
                    maximum: 1024
                    minimum: 1
                    type: integer
                  port:
                    description: Port overrides the EZIO daemon's listen port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              imageRef:
                description: |-
                  ImageRef names the Image to deploy as this machine's OS. It must be
                  a bootable image. May be absent when the machine deploys only
                  DataImages and keeps its existing OS.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              params:
                description: |-
                  Params is schemaless input for the attached hooks' templating.
                  Merge order: the deployed Image's own params first, then this
                  field; later entries override earlier ones.
                x-kubernetes-preserve-unknown-fields: true
              postHookRefs:
                description: |-
                  PostHookRefs is an ordered list of PostHook resources attached to
                  this machine. Execution order: the attached Image's own
                  postHookRefs (ImageSpec.PostHookRefs) run first, then this list;
                  within this list, the given order holds. The shipped default hook
                  (kezio-default-finalize) is substituted only when both lists are
                  empty and this machine deploys an OS image.
                items:
                  description: |-
                    NameRef is a reference to a resource by name, optionally in another
                    namespace. When Namespace is empty, the namespace of the referencing
                    resource is used. Field names that hold a NameRef end in "Ref"; ordered
                    lists of NameRef end in "Refs".
                  properties:
                    name:
                      description: |-
                        Post-mutation admission always re-serialises this struct, so a
                        zero-value Name would otherwise satisfy "required"; MinLength closes
                        that gap. MaxLength mirrors the Kubernetes object name limit and
                        bounds the CEL cost of any pattern-matching XValidation rule a
                        field of this type carries (see ImageSlot.ContentRef).
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
              subnetRef:
                description: |-
                  SubnetRef names the Subnet this machine network boots through -
                  the broadcast domain whose bootd instance answers this machine's
                  PXE boot. Required: a Machine with no Subnet cannot be
                  network-booted.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
