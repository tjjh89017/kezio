                    format: int64
                    minimum: 1
                    type: integer
                  minSizeGigabytes:
                    description: MinSizeGigabytes rejects disks smaller than this
                      size.
                    format: int64
                    minimum: 1
                    type: integer
                  model:
                    description: Model is the disk's reported model string.
                    type: string
                  pciePath:
                    description: |-
                      PciePath is the disk's PCIe address, read by resolving
                      /sys/block/<dev>.
                    type: string
                  rotational:
                    description: |-
