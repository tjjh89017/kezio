                items:
                  description: |-
                    PostHookStep is one ordered step of a PostHook, exactly one of a named
                    builtin, a live-OS script, or a chroot script.
                  properties:
                    builtin:
                      description: Builtin runs one of the named steps KEZIO ships.
                      properties:
                        name:
                          description: Name selects which shipped builtin runs.
                          enum:
                          - mkswap
                          - efibootmgr
                          - growLastPartition
                          - install-removable-fallback
                          type: string
                        timeoutSeconds:
                          description: |-
