apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kezio
    control-plane: controller-manager
  name: kezio-controller-manager
  namespace: kezio-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kezio
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: kezio
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        command:
        - /manager
        env:
        - name: INGEST_IMAGE
          value: ghcr.io/tjjh89017/kezio-ingest:0.1.7
        - name: INGEST_STAGING_PVC
          value: kezio-image-service-staging
        - name: INGEST_SERVICE_ACCOUNT
          value: kezio-ingest
        - name: SEEDER_TRACKER_URL
          value: http://192.0.2.4:6969/announce
        - name: SEEDER_DEPLOYMENT_IMAGE
          value: ghcr.io/tjjh89017/kezio-seeder:0.1.7
        - name: BOOT_SERVER_ADDR
          value: :8090
        - name: BOOT_SERVER_URL
          value: http://192.0.2.2:80
        - name: AGENT_SERVER_ADDR
          value: :8091
        - name: BOOT_AGENT_SERVER_URL
          value: http://192.0.2.2:80
        - name: DEPLOYER
          value: agent
        - name: BOOTD_DEPLOYMENT_IMAGE
          value: ghcr.io/tjjh89017/kezio-bootd:0.1.7
        - name: BOOTD_DEPLOYMENT_BOOT_ARTIFACTS_IMAGE
          value: ghcr.io/tjjh89017/kezio-boot-artifacts:0.1.7
        - name: BOOTD_DEPLOYMENT_AGENT_UPSTREAM_URL
          value: http://kezio-agent-server.kezio-system.svc.cluster.local:8091
        - name: BOOTD_DEPLOYMENT_BOOT_UPSTREAM_URL
          value: http://kezio-boot-server.kezio-system.svc.cluster.local:8090
        - name: BOOTD_DEPLOYMENT_SERVICE_ACCOUNT
          value: kezio-bootd
        - name: BOOT_ARTIFACTS_DIR
          value: /boot-artifacts
        image: ghcr.io/tjjh89017/kezio:0.1.7
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8090
          name: boot-http
          protocol: TCP
        - containerPort: 8091
          name: agent-http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-certs
          readOnly: true
        - mountPath: /boot-artifacts
          name: boot-artifacts
          readOnly: true
      initContainers:
      - command:
        - cp
        - -a
        - /boot-artifacts/vmlinuz
        - /boot-artifacts/initrd.img
        - /boot-artifacts/filesystem.squashfs
        - /boot-artifacts/shimx64.efi
        - /boot-artifacts/grubx64.efi
        - /boot-artifacts/manifest.json
        - /dest
        image: ghcr.io/tjjh89017/kezio-boot-artifacts:0.1.7
        imagePullPolicy: IfNotPresent
        name: fetch-boot-artifacts
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /dest
          name: boot-artifacts
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: kezio-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: webhook-certs
        secret:
          secretName: webhook-server-cert
      - emptyDir: {}
        name: boot-artifacts
---
apiVersion: apps/v1
