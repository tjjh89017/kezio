                            image is written to.
                          type: string
                      required:
                      - imageRef
                      type: object
                    type: array
                  image:
                    description: Image records the deployed OS image and its target
                      disk.
                    properties:
                      imageRef:
                        description: ImageRef names the Image being deployed.
                        properties:
                          name:
                            description: |-
                              Post-mutation admission always re-serialises this struct, so a
                              zero-value Name would otherwise satisfy "required"; MinLength closes
                              that gap.
                            minLength: 1
                            type: string
                          namespace:
                            type: string
                        required:
                        - name
                        type: object
                      targetDisk:
                        description: TargetDisk is the resolved device path the image
                          is written to.
                        type: string
                    required:
                    - imageRef
                    type: object
                type: object
              state:
                description: State is the machine's position in the state machine.
