                    type: string
                type: object
              poweredOn:
                description: PoweredOn reports the machine's last observed power state.
                type: boolean
              provisioning:
                description: Provisioning records what was actually deployed.
                properties:
                  dataImages:
                    description: DataImages records each deployed non-OS image and
