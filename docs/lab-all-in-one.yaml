# kezio lab: everything in one file
#
# This is the example manifest for docs/lab-proxmox-rke2.md. It holds the
# whole lab in one file: the CRDs, the controller-manager with its full
# environment, the image upload service, the ingest RBAC, opentracker, the
# boot and agent server Services, bootd's ClusterRole, the three
# NetworkAttachmentDefinitions, and one Site, Subnet, and Machine.
#
#   kubectl apply -f docs/lab-all-in-one.yaml
#
# It is generated from the kustomizations under config/ (see the guide's
# sections 5 and 6 for the command sequence it replaces) plus the lab's own
# objects. It is an example to read and edit, not a supported install
# path: config/ is the source of truth, and this file goes stale whenever a
# CRD or a manifest there changes. Regenerate or hand-edit it rather than
# treating it as current.
#
# ## Before you apply
#
# The cluster must already have:
#
#   - cert-manager. The manager's validating webhook is served with a
#     cert-manager Certificate, and the Certificate and Issuer objects
#     below need its CRDs to exist.
#   - Multus, for the NetworkAttachmentDefinitions.
#   - A default StorageClass named "local-path" (the guide installs
#     local-path-provisioner). Change the two PVC references if yours has
#     another name.
#   - A Linux bridge named "kezio-prov0" on every node, carrying the
#     provisioning segment.
#
# ## What to change before you apply
#
# Search for CHANGEME first - the file does not work until every one of
# them is replaced:
#
#   - The image-service bearer token, in Secret/kezio-image-service-token.
#   - The BMC username and password, in Secret/lab-target-1-bmc. Never
#     commit a real token to version control.
#
# Then review these, which carry working defaults from the guide:
#
#   - Image tags. Every kezio image is pinned to 0.1.7, in the images of
#     the two Deployments, the fetch-boot-artifacts initContainer, and the
#     INGEST_IMAGE / SEEDER_DEPLOYMENT_IMAGE / BOOTD_DEPLOYMENT_IMAGE /
#     BOOTD_DEPLOYMENT_BOOT_ARTIFACTS_IMAGE environment variables. The
#     image tag has no "v", but the git tag it comes from does. For
#     releases up to and including v0.1.7, kezio-boot-artifacts is the
#     one exception: it kept the "v", so change those two references to
#     v0.1.7 if you stay on such a release.
#   - Addresses. The provisioning segment is 192.0.2.0/24: bootd at
#     192.0.2.2, opentracker at 192.0.2.4, the seeder at 192.0.2.5, and a
#     lease range of 192.0.2.10-192.0.2.100. They appear in the three
#     NetworkAttachmentDefinitions, the Subnet, and the manager's
#     SEEDER_TRACKER_URL / BOOT_SERVER_URL / BOOT_AGENT_SERVER_URL.
#   - The machine. Machine/lab-target-1 carries the Proxmox VM's MAC
#     address, its Redfish path (.../Systems/501), and its disk serial.
#
# ## What this file does not do
#
#   - It ingests no image. Machine/lab-target-1 references Image
#     "lab-ubuntu", which you create by uploading a disk image through
#     kezioctl - see the guide's section 7. Until then the Machine waits.
#   - It creates no bootd Deployment. SubnetReconciler builds one from the
#     Subnet below, once the manager is running.
#   - It runs no seeder. The controller starts one per (Image, Site) only
#     while a Machine is deploying that Image, and removes it afterwards.
#   - It sets up nothing outside the cluster: not the Proxmox bridge, not
#     the VMs, not proxmox-redfish, and not the two iptables rules PXE
#     needs across the bridge. Sections 2 and 3 of the guide cover those.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kezio
    control-plane: controller-manager
    pod-security.kubernetes.io/enforce: privileged
  name: kezio-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: imagelayouts.kezio.kojuro.date
spec:
  group: kezio.kojuro.date
  names:
    kind: ImageLayout
    listKind: ImageLayoutList
    plural: imagelayouts
    shortNames:
    - ezl
    - imagelayout
    singular: imagelayout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageLayout is the Schema for the imagelayouts API. One ImageLayout is
          written once, by the ingest Job, for each Image that reaches Ready with
          a disk layout - see internal/ingest.WriteImageLayout and
          ImageDiskStatus.LayoutRef. It carries no Status: nothing updates it
          after that single write.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImageLayoutSpec defines the desired state of ImageLayout: the verbatim
              sfdisk dump of an Image's source disk layout.
            properties:
              sfdiskJSON:
                description: |-
                  SfdiskJSON is the verbatim `sfdisk --json` dump of the source
                  disk's partition table, captured once during ingest. It carries
                  the GPT disk GUID and partition type GUIDs so a restored disk
                  matches the source exactly.

                  This is deliberately a plain string, not typed fields: the agent
                  feeds this straight back to sfdisk to replay the layout onto a
                  target disk, and sfdisk's own JSON schema drifts across versions.
                  Modeling partitions as typed fields here would require reinterpreting
                  that schema instead of replaying it verbatim, and would need to
                  track every sfdisk version kezio-ingest might run against.
                minLength: 2
                type: string
                x-kubernetes-validations:
                - message: spec.sfdiskJSON must be a JSON object (the verbatim `sfdisk
                    --json` dump)
                  rule: self.startsWith('{')
            required:
            - sfdiskJSON
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: images.kezio.kojuro.date
spec:
  group: kezio.kojuro.date
  names:
    kind: Image
    listKind: ImageList
    plural: images
    shortNames:
    - ezi
    - image
    singular: image
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.bootable
      name: Bootable
      type: boolean
    - jsonPath: .spec.osFamily
      name: OSFamily
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Image is the Schema for the images API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImageSpec defines the desired state of Image. It is create-only: the
              apiserver rejects any update to it. An Image's partitions are
              distributed by BitTorrent, and a torrent's info hash binds to fixed
              content; allowing spec to change after creation would let an in-use
              info hash silently point at different content and break every swarm
              seeding it. To publish new content, create an Image with a new name;
              to retry a failed ingest, delete the Image and create it again.

              Immutability is enforced per field below (self == oldSelf on each of
              Source, Bootable, OSFamily, PostHookRefs, and Params) rather than once
              on the whole struct: Params is schemaless
              (x-kubernetes-preserve-unknown-fields), and CEL's equality over a
              struct embedding an unstructured field is markedly more fragile across
              apiserver versions and object shapes than equality over individually
              typed fields, with a spurious inequality anywhere failing the whole
              update. Splitting the rule per field means a quirk isolated to Params
              cannot block updates that never touch the others, and vice versa.
            properties:
              bootable:
                default: true
                description: |-
                  Bootable marks this image as a bootable OS image: ingest expects an
                  ESP and finalize creates a boot entry. Set to false for a
                  non-bootable image (a data disk, a scratch layout, a pre-formatted
                  store), for which ingest does not require an ESP and finalize skips
                  the boot loader step. Defaults to true.
                type: boolean
                x-kubernetes-validations:
                - message: spec.bootable is immutable once the Image is created; create
                    a new Image to publish different content
                  rule: self == oldSelf
              osFamily:
                default: Linux
                description: |-
                  OSFamily gates OS-specific validation and builtins (for example
                  mkswap, which only applies to Linux). Defaults to Linux.
                enum:
                - Linux
                - Windows
                - FreeBSD
                - Other
                type: string
                x-kubernetes-validations:
                - message: spec.osFamily is immutable once the Image is created; create
                    a new Image to publish different content
                  rule: self == oldSelf
              params:
                description: |-
                  Params is schemaless input for the attached hooks' templating. Merge
                  order: this field first, then the deploying Machine's own params;
                  later entries override earlier ones.

                  This is a pointer, not a value: apiextensionsv1.JSON.MarshalJSON
                  always emits a literal "null" for its zero value, and Go's
                  encoding/json "omitempty" does not suppress a zero-value struct (it
                  only suppresses nil pointers, nil maps/slices, and empty
                  strings/numbers). A value field would therefore round-trip an absent
                  Params as an explicit JSON null on every re-marshal - notably inside
                  the defaulting webhook, which re-marshals the whole object to
                  compute its mutation patch even when Default is a no-op, turning
                  "params never set" into a stray "add /spec/params null" patch on
                  every Image create or update. A pointer field is nil (and correctly
                  omitted) until something actually sets Params.

                  No XValidation transition rule guards this field: a schemaless
                  (x-kubernetes-preserve-unknown-fields) value has no structural
                  schema for CEL to key equality off, which is the same fragility
                  this type's doc comment describes for the whole-struct rule this
                  replaced. Params immutability is instead enforced in Go, by
                  ImageCustomValidator.ValidateUpdate (see internal/webhook/v1alpha1),
                  which can compare the raw JSON directly.
                x-kubernetes-preserve-unknown-fields: true
              postHookRefs:
                description: |-
                  PostHookRefs is an ordered list of PostHook resources attached to
                  this image. Execution order: this list runs before the attaching
                  Machine's own postHookRefs; within this list, the given order holds.
                items:
                  description: |-
                    NameRef is a reference to a resource by name, optionally in another
                    namespace. When Namespace is empty, the namespace of the referencing
                    resource is used. Field names that hold a NameRef end in "Ref"; ordered
                    lists of NameRef end in "Refs".
                  properties:
                    name:
                      description: |-
                        Post-mutation admission always re-serialises this struct, so a
                        zero-value Name would otherwise satisfy "required"; MinLength closes
                        that gap.
                      minLength: 1
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-validations:
                - message: spec.postHookRefs is immutable once the Image is created;
                    create a new Image to publish different content
                  rule: self == oldSelf
              source:
                description: |-
                  Source describes where the source disk image comes from and how to
                  verify it.
                properties:
                  checksum:
                    description: |-
                      Checksum verifies the fetched or uploaded source image before ingest
                      converts it. The expected form is "<algorithm>:<hex digest>", for
                      example "sha256:...".
                    type: string
                  format:
                    description: Format is the on-disk format of the source image.
                    enum:
                    - raw
                    - qcow2
                    - vmdk
                    type: string
                  url:
                    description: |-
                      URL is the location the ingest job fetches the source image from. It
                      may be absent when the image is uploaded directly (for example
                      through kezioctl), in which case the ingest job waits for the upload
                      instead of fetching a URL.
                    type: string
                required:
                - format
                type: object
                x-kubernetes-validations:
                - message: spec.source is immutable once the Image is created; create
                    a new Image to publish different content
                  rule: self == oldSelf
            required:
            - source
            type: object
          status:
            description: ImageStatus defines the observed state of Image.
            properties:
              conditions:
                description: |-
                  Conditions report the current state of the image, including
                  ConditionReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              disk:
                description: Disk records the disk-level layout captured during ingest.
                properties:
                  layoutRef:
                    description: |-
                      LayoutRef names the ImageLayout holding the sfdisk JSON dump of the
                      disk layout (see ImageLayoutSpec.SfdiskJSON). It always resolves in
                      this Image's own namespace.
                    properties:
                      name:
                        description: |-
                          Post-mutation admission always re-serialises this struct, so a
                          zero-value Name would otherwise satisfy "required"; MinLength closes
                          that gap.
                        minLength: 1
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  partitionTable:
                    description: PartitionTable is the partition table type found
                      on the source disk.
                    enum:
                    - gpt
                    - mbr
                    type: string
                  sizeBytes:
                    description: SizeBytes is the total size of the source disk image.
                    format: int64
                    type: integer
                type: object
              partitions:
                description: Partitions records each partition captured during ingest.
                items:
                  description: ImagePartitionStatus records one partition captured
                    during ingest.
                  properties:
                    fsType:
                      description: |-
                        FSType is the file system found on this partition, when applicable
                        (for example "vfat", "ext4"). Empty for roles without a file system
                        (msr) or handled without one (a swap partition restored by UUID).
                      type: string
                    infoHash:
                      description: |-
                        InfoHash is the BitTorrent v1 info hash of this partition's content,
                        present once ingest has produced torrent metadata for it. Its
                        .torrent file lives alongside the content itself in this
                        partition's own PVC (see internal/controller/image_publish.go),
                        never in status: torrent.info scales with piece count, and status
                        carrying it either inline or as the ingest Job's termination
                        message (which is capped at 4KiB) silently failed to parse for an
                        Image with enough partitions (see internal/ingest.ResultPartition).
                        A deploy plan resolves this to a fetchable URL at plan-build time
                        instead (see internal/agentserver's buildPlanPartition and
                        agentapi.PlanPartition.TorrentURL).
                      type: string
                    number:
                      description: Number is the partition number on the source disk.
                      format: int32
                      type: integer
                    role:
                      description: Role is the OS-neutral role of this partition.
                      enum:
                      - esp
                      - data
                      - swap
                      - msr
                      type: string
                    usedBytes:
                      description: UsedBytes is the amount of data ingest captured
                        for this partition.
                      format: int64
                      type: integer
                    uuid:
                      description: |-
                        UUID is the source partition's file-system UUID, recorded for
                        partitions (such as swap) that are restored by UUID instead of by
                        torrent content.
                      type: string
                  required:
                  - number
                  - role
                  type: object
                type: array
              seeders:
                description: |-
                  Seeders records, per site, how many Machines currently hold this
                  Image's seeder Deployment demanded there - the derived reference
                  count that decides whether that Deployment exists (see
                  ImageSeederSiteStatus's doc comment). Absent or empty means no
                  site currently demands a seeder Deployment for this Image.
                items:
                  description: |-
                    ImageSeederSiteStatus records how many Machines at Site currently hold
                    this Image's per-Image seeder Deployment demanded there. See
                    internal/controller's machineHoldsSeederReference for which Machine
                    states count, and its reconcileSeederDeployments for how this is
                    computed and kept in sync with the Deployment(s) it describes.
                    MachineCount can be zero: a site whose demand just dropped keeps its
                    entry (and its Deployment) through the teardown grace period, so
                    "still up with zero demand, about to drain" stays visible here rather
                    than disappearing the instant the count changes.
                  properties:
                    machineCount:
                      description: |-
                        MachineCount is how many Machines at Site currently hold a seeder
                        reference to this Image.
                      format: int32
                      type: integer
                    site:
                      description: |-
                        Site is the namespace-qualified identity ("namespace/name", Site's
                        doc comment) of the Site object this count applies to, derived
                        from the demanding Machines' spec.subnetRef (through that Subnet's
                        own spec.siteRef) rather than set directly on the Machine.
                      type: string
                  required:
                  - machineCount
                  - site
                  type: object
                type: array
              state:
                description: State is the ingest state machine position.
                enum:
                - Pending
                - Ingesting
                - Ready
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: machines.kezio.kojuro.date
spec:
  group: kezio.kojuro.date
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    shortNames:
    - ezm
    - machine
    singular: machine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.online
      name: Online
      type: boolean
    - jsonPath: .status.poweredOn
      name: PoweredOn
      type: boolean
    - jsonPath: .spec.bootMACAddress
      name: BootMAC
      type: string
    - jsonPath: .spec.subnetRef.name
      name: Subnet
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Machine is the Schema for the machines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MachineSpec defines the desired state of Machine.
            properties:
              afterDeploy:
                default: Reboot
                description: |-
                  AfterDeploy selects what happens when a deployment finishes without
                  an OS image to reboot into. Defaults to Reboot.
                enum:
                - Reboot
                - PowerOff
                type: string
              bmc:
                description: |-
                  BMC identifies the board management controller that powers and
                  boot-orders this machine. The controller uses it to power the
                  machine on for inspection and deployment, and to set its power
                  state afterward.
                properties:
                  address:
                    description: |-
                      Address is the BMC endpoint URL. Its scheme selects the driver, for
                      example "redfish://" or "ipmi://".
                    pattern: ^[a-zA-Z][a-zA-Z0-9+.-]*://.+
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names the Secret holding the BMC username and
                      password.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - address
                - credentialsSecretRef
                type: object
              bootMACAddress:
                description: |-
                  BootMACAddress is the MAC address of the NIC the machine network
                  boots from. The boot config server uses it to find this machine.
                pattern: ^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$
                type: string
              dataImages:
                description: |-
                  DataImages is an ordered list of additional, non-OS images deployed
                  alongside the OS image in the same live session (or by themselves,
                  when ImageRef is absent).
                items:
                  description: |-
                    MachineDataImage is one additional, non-OS image deployed alongside (or
                    instead of) the machine's OS image in the same live session. Each entry
                    resolves against its own TargetDisk hints; all resolved disks across a
                    Machine's OS image and its DataImages must be distinct.
                  properties:
                    imageRef:
                      description: |-
                        ImageRef names the Image to deploy. It is typically a non-bootable
                        image (a data disk or a scratch layout), since only the OS image
                        gets a boot entry.
                      properties:
                        name:
                          description: |-
                            Post-mutation admission always re-serialises this struct, so a
                            zero-value Name would otherwise satisfy "required"; MinLength closes
                            that gap.
                          minLength: 1
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      type: object
                    targetDisk:
                      description: TargetDisk selects the disk this image deploys
                        to.
                      properties:
                        deviceName:
                          description: |-
                            DeviceName is the kernel device path, for example "/dev/nvme0n1".
                            This is the last-choice hint: device names are not stable across
                            boots.
                          type: string
                        hctl:
                          description: |-
                            HCTL is the disk's SCSI host:channel:target:lun address, for example
                            "0:0:0:0".
                          type: string
                        maxSizeGigabytes:
                          description: MaxSizeGigabytes rejects disks larger than
                            this size.
                          format: int64
                          minimum: 1
                          type: integer
                        minSizeGigabytes:
                          description: MinSizeGigabytes rejects disks smaller than
                            this size.
                          format: int64
                          minimum: 1
                          type: integer
                        model:
                          description: Model is the disk's reported model string.
                          type: string
                        pciePath:
                          description: |-
                            PciePath is the disk's PCIe address, read by resolving
                            /sys/block/<dev>.
                          type: string
                        rotational:
                          description: |-
                            Rotational matches on whether the disk is a spinning disk (true) or
                            solid-state (false), read from /sys/block/*/queue/rotational.
                          type: boolean
                        serialNumber:
                          description: |-
                            SerialNumber is the disk's serial number, read from
                            /sys/block/*/device/serial or udev.
                          type: string
                        slotNumber:
                          description: |-
                            SlotNumber is the disk's NVMe namespace or PCIe slot number, read
                            best-effort from DMI.
                          format: int32
                          type: integer
                        vendor:
                          description: Vendor is the disk's reported vendor string.
                          type: string
                        wwn:
                          description: WWN is the disk's World Wide Name, read from
                            udev's ID_WWN.
                          type: string
                      type: object
                  required:
                  - imageRef
                  type: object
                type: array
              ezio:
                description: |-
                  Ezio overrides the operator's cluster-wide default EZIO tuning for
                  this machine's leecher.
                properties:
                  aioThreads:
                    description: AioThreads overrides the EZIO daemon's async I/O
                      thread count.
                    format: int32
                    minimum: 1
                    type: integer
                  cacheSizeMB:
                    description: |-
                      CacheSizeMB overrides the EZIO daemon's unified cache size, in
                      megabytes.
                    format: int32
                    minimum: 1
                    type: integer
                  maxConnections:
                    description: |-
                      MaxConnections overrides the per-torrent maximum peer connection
                      count (ezio's AddTorrent max_connections). A WAN-routed swarm
                      stays healthy with a small per-torrent cap (around 8-10): unlike a
                      single LAN segment, a large fan-out here does not find more useful
                      peers, only more idle connections across the routed links. The
                      operator default already reflects this; raise it only for a
                      same-LAN deployment with many machines that benefit from wider
                      fan-out.
                    format: int32
                    maximum: 1024
                    minimum: 1
                    type: integer
                  maxUploads:
                    description: |-
                      MaxUploads overrides the per-torrent maximum upload slot count
