---
# The image-service bearer token. kezioctl sends it with every upload, and
# the image-service pod does not start without this Secret. The manifests
# under config/ never carry it, because a bearer token has no safe
# placeholder in version control - replace the value here, or create the
# Secret out of band and delete this object.
apiVersion: v1
kind: Secret
metadata:
  name: kezio-image-service-token
  namespace: kezio-system
type: Opaque
stringData:
  token: CHANGEME-image-service-token
---
# bootd's address on the provisioning segment. It is pinned, never
# IPAM-allocated: firmware caches it mid-boot as the PXE next-server and
# the TFTP target, so an address that changes on pod restart strands an
# in-flight GRUB fetch.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: kezio-boot-network
  namespace: kezio-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "kezio-boot-network",
      "plugins": [
        {
          "type": "bridge",
          "bridge": "kezio-prov0",
          "ipam": {
            "type": "static",
            "addresses": [{"address": "192.0.2.2/24"}]
          }
        }
      ]
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: kezio-tracker-network
  namespace: kezio-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "kezio-tracker-network",
      "plugins": [
        {
          "type": "bridge",
          "bridge": "kezio-prov0",
          "ipam": {
            "type": "static",
            "addresses": [{"address": "192.0.2.4/24"}]
          }
        }
      ]
    }
---
# One static address suits a Site that deploys one Image at a time. A Site
# that deploys several at once needs one address per concurrent (Image,
# Site) seeder Deployment - move to the whereabouts pool in
# config/seeder/networkattachmentdefinition-whereabouts.example.yaml, and
# deploy its ip-reconciler CronJob with it.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: kezio-seeder-network
  namespace: kezio-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "kezio-seeder-network",
      "plugins": [
        {
          "type": "bridge",
          "bridge": "kezio-prov0",
          "ipam": {
            "type": "static",
            "addresses": [{"address": "192.0.2.5/24"}]
          }
        }
      ]
    }
---
# A Site is a maximal routable domain: every Subnet inside one Site is
# mutually routable. seederSubnetRef names the Subnet its seeder pods
# attach to; a Site without one runs no seeder at all.
apiVersion: kezio.kojuro.date/v1alpha1
kind: Site
metadata:
  name: lab
  namespace: kezio-system
spec:
  seederSubnetRef:
    name: lab-prov
---
# One Subnet per broadcast domain. SubnetReconciler builds this segment's
# bootd Deployment from it.
#
# dhcp.mode: lease makes bootd's own dnsmasq the segment's DHCP authority,
# which fits a lab bridge with no DHCP server of its own. The MAC gate does
# not relax: only an enrolled Machine's bootMACAddress gets a lease. Use
# mode: proxy instead when the segment already has a DHCP server - that is
# the shape kezio's end-to-end CI lane exercises.
apiVersion: kezio.kojuro.date/v1alpha1
kind: Subnet
metadata:
  name: lab-prov
  namespace: kezio-system
spec:
  siteRef:
    name: lab
  cidr: 192.0.2.0/24
  bootdServerIP: 192.0.2.2
  bootdNetworkRef:
    name: kezio-boot-network
  seederNetworkRef:
    name: kezio-seeder-network
  dhcp:
    mode: lease
    leaseRangeStart: 192.0.2.10
    leaseRangeEnd: 192.0.2.100
---
# The Proxmox API token kezio authenticates to proxmox-redfish with.
# username is the token's full identity, user and token ID together;
# password is the token secret.
#
# PLACEHOLDER VALUES ONLY - replace them before you apply, and keep the
# real values out of version control.
apiVersion: v1
kind: Secret
metadata:
  name: lab-target-1-bmc
  namespace: kezio-system
type: kubernetes.io/basic-auth
stringData:
  username: "CHANGEME@pve!CHANGEME"
  password: CHANGEME-proxmox-api-token-secret
---
# One target machine.
#
# The BMC path names the System explicitly: one proxmox-redfish daemon
# fronts every VM on the host, so its Systems collection has many members,
# and the driver refuses to guess among them.
#
# The scheme is redfish+http, matching the plain-HTTP unit the walkthrough
# installs. Plain "redfish://" means HTTPS and fails against that unit with
# a connection error. If the daemon has TLS instead, use "redfish://" - and,
# while its certificate is self-signed, add the annotation
# kezio.kojuro.date/bmc-insecure-skip-verify: "true" to this Machine. That
# is an annotation, not a spec field, because it is a transport-trust
# decision rather than deployment intent; any value other than exactly
# "true" means verify.
#
# subnetRef decides the Site: kezio derives it as subnetRef ->
# Subnet.spec.siteRef -> Site, so a machine always leeches from the seeder
# at the segment its boot NIC is really wired to. There is no field to set
# it directly.
apiVersion: kezio.kojuro.date/v1alpha1
kind: Machine
metadata:
  name: lab-target-1
  namespace: kezio-system
spec:
  bmc:
    address: redfish+http://10.0.0.10:8000/redfish/v1/Systems/501
    credentialsSecretRef:
      name: lab-target-1-bmc
  bootMACAddress: "52:54:00:be:ef:01"
  subnetRef:
    name: lab-prov
  online: true
  imageRef:
    name: lab-ubuntu
  targetDisk:
    serialNumber: "KEZIOLAB0001"
