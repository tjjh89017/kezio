                        name:
                          description: Name is the interface name, for example "eth0".
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                type: object
              inspectingSince:
                description: |-
                  InspectingSince records when the machine most recently entered the
                  Inspecting state (set alongside State transitioning to Inspecting).
