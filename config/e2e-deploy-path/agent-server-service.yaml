# Byte-identical copy of config/e2e-boot-path/agent-server-service.yaml
# (itself a copy of config/agentserver/service.yaml); see
# kustomization.yaml in this directory for why this overlay keeps local
# copies instead of referencing the originals by relative path.
apiVersion: v1
kind: Service
metadata:
  name: kezio-agent-server
  namespace: kezio-system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: agent-server
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: kezio
  ports:
    - name: agent-http
      port: 8091
      targetPort: agent-http
      protocol: TCP
