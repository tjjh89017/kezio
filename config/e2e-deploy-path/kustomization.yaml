# Overlay for the e2e full-deploy KubeVirt stage
# (.github/workflows/e2e-deploy-kubevirt.yml, workflow_dispatch only): the
# union of config/e2e-image-path (real ingest/publish) and
# the boot/agent server Services, plus config/seeder,
# since full-deploy needs a real Image ingested, a real per-Image seeder
# Deployment, and a real Machine net-booting through kezio-bootd into
# kezio-agent to deploy onto a KubeVirt VM's disk.
#
# Takes ../boot-agent-server as its base - the same overlay an operator
# applies - and adds only what this lane needs on top: the image-service,
# seeder and ingest kustomizations, and an RWO staging PVC for the
# single-node runner. Everything the controller-manager Deployment carries
# here is therefore what an operator gets, which is the point: the operator
# path had no coverage at all while each e2e lane built its own parallel
# copy of it (see #30).
#
# Does not compose ../e2e-image-path or ../e2e-boot-path: both pull in
# ../default, as ../boot-agent-server already does, and kustomize cannot
# merge two kustomizations that each independently pull in the same base.
#
# BOOT_ARTIFACTS_DIR arrives from ../boot-agent-server's boot-artifacts
# component; the `kubectl set env` below repeats the same value, which
# merges rather than replaces.
#
# INGEST_IMAGE, SEEDER_*, SEEDER_DEPLOYMENT_*, BOOT_SERVER_ADDR,
# BOOT_ARTIFACTS_DIR, BOOT_SERVER_URL, BOOT_AGENT_SERVER_URL,
# AGENT_SERVER_ADDR, and DEPLOYER are NOT set here - they need per-run
# values; the workflow sets them with `kubectl set env` after applying.
resources:
  - ../boot-agent-server
  - ../image-service
  - ../seeder
  - ../ingest

patches:
  - path: staging-pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: kezio-image-service-staging
