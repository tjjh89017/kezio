# Overlay for the e2e full-deploy KubeVirt stage
# (.github/workflows/e2e-deploy-kubevirt.yml, workflow_dispatch only): the
# union of config/e2e-image-path (real ingest/publish) and
# config/e2e-boot-path (boot/agent server Services), plus config/seeder,
# since full-deploy needs a real Image ingested, a real per-Image seeder
# Deployment, and a real Machine net-booting through kezio-bootd into
# kezio-agent to deploy onto a KubeVirt VM's disk.
#
# Does not compose ../e2e-image-path or ../e2e-boot-path directly: both
# already pull in ../default, and kustomize cannot merge two kustomizations
# that each independently pull in the same base. Instead this overlay pulls
# in ../default once, plus ../image-service, ../seeder, and ../ingest, plus
# local copies of the plain-YAML resource/patch files those two overlays
# ship (kustomize's LoadRestrictionsRootOnly forbids referencing a plain
# file outside this kustomization's own root). Keep each copy in sync with
# its origin.
#
# INGEST_IMAGE, SEEDER_*, SEEDER_DEPLOYMENT_*, BOOT_SERVER_ADDR,
# BOOT_ARTIFACTS_DIR, BOOT_SERVER_URL, BOOT_AGENT_SERVER_URL,
# AGENT_SERVER_ADDR, and DEPLOYER are NOT set here - they need per-run
# values; the workflow sets them with `kubectl set env` after applying.
resources:
  - ../default
  - ../image-service
  - ../seeder
  - ../ingest
  - boot-server-service.yaml
  - agent-server-service.yaml

patches:
  - path: staging-pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: kezio-image-service-staging
  - path: manager-boot-port-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
  - path: manager-agent-port-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
