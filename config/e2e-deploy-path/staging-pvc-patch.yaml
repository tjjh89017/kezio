# Byte-identical copy of config/e2e-image-path/staging-pvc-patch.yaml;
# see kustomization.yaml in this directory for why this overlay keeps
# local copies instead of referencing the originals by relative path.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kezio-image-service-staging
  namespace: kezio-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
