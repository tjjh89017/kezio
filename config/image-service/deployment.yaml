apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: image-service
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kezio
      app.kubernetes.io/component: image-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kezio
        app.kubernetes.io/component: image-service
    spec:
      securityContext:
        runAsNonRoot: true
        # The token Secret volume below is mounted 0440 (owner+group
        # read only) and Secret files are owned root:root by default; a
        # nonroot container (this image runs distroless, uid 65532, like
        # every other kezio image) is neither the owner nor in the
        # owning group, so it opens the mounted token file and gets EACCES
        # ("permission denied") even though defaultMode already restricts
        # it correctly. fsGroup makes kubelet chgrp the volume to this
        # GID and apply the volume's own group-read bit for it, which
        # 0440 already grants - so the container can read the file
        # without loosening its mode further (0444 world-readable is not
        # needed).
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-service
          image: image-service:latest
          command:
            - /image-service
          args:
            - --addr=:8080
            - --staging-dir=/staging
            - --token-file=/etc/kezio/image-service/token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: staging
              mountPath: /staging
            - name: token
              mountPath: /etc/kezio/image-service
              readOnly: true
      volumes:
        - name: staging
          persistentVolumeClaim:
            claimName: image-service-staging
        - name: token
          secret:
            # The cluster operator creates this Secret out of band before
            # deploying (for example: kubectl create secret generic
            # kezio-image-service-token --from-literal=token=$(openssl
            # rand -hex 32) -n kezio-system). It is intentionally not
            # created by this kustomization: a bearer token has no safe
            # placeholder value to ship in version control. The name
            # matches this kustomization's namePrefix (kezio-) even
            # though the Secret itself is not one of its resources.
            secretName: kezio-image-service-token
            defaultMode: 0o440
