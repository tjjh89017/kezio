apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: image-service
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kezio
      app.kubernetes.io/component: image-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kezio
        app.kubernetes.io/component: image-service
    spec:
      securityContext:
        runAsNonRoot: true
        # The token Secret volume below is mounted 0440, owned root:root by
        # default; this nonroot container (uid 65532) is neither owner nor
        # group, so it gets EACCES without fsGroup. fsGroup chgrps the volume
        # to this GID so the existing 0440 group-read bit applies, without
        # loosening the mode to world-readable.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-service
          image: image-service:latest
          command:
            - /image-service
          args:
            - --addr=:8080
            - --staging-dir=/staging
            - --token-file=/etc/kezio/image-service/token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: staging
              mountPath: /staging
            - name: token
              mountPath: /etc/kezio/image-service
              readOnly: true
      volumes:
        - name: staging
          persistentVolumeClaim:
            claimName: image-service-staging
        - name: token
          secret:
            # The cluster operator creates this Secret out of band before
            # deploying (e.g. kubectl create secret generic
            # kezio-image-service-token --from-literal=token=$(openssl rand
            # -hex 32) -n kezio-system) - not by this kustomization, since a
            # bearer token has no safe placeholder for version control.
            secretName: kezio-image-service-token
            defaultMode: 0o440
