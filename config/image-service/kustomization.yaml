# Standalone kustomization for the image upload service (the server-side
# target of `kezioctl image upload`). It is deliberately not one of
# config/default's resources: it needs its own staging PVC and a bearer
# token Secret the operator provisions out of band, and it scales
# independently of the controller manager. Deploy it as an addition once
# config/default is applied and the scaffold-system namespace exists:
#
#   kustomize build config/image-service | kubectl apply -f -
#
# (after creating the kezio-image-service-token Secret and setting the
# image with `kustomize edit set image`, as with config/manager).
namespace: scaffold-system
namePrefix: kezio-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: kezio

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml

images:
  - name: image-service
    newName: ghcr.io/tjjh89017/kezio-image-service
    newTag: latest
