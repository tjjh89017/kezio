apiVersion: v1
kind: Service
metadata:
  name: image-service
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: image-service
    app.kubernetes.io/managed-by: kustomize
spec:
  # ClusterIP is the safe default: exposes the upload port only inside the
  # cluster. Reaching it from outside (kezioctl, another site) is the
  # cluster operator's choice - port-forward, Ingress, LoadBalancer, or
  # NodePort - made by patching this Service in an overlay.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: image-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
