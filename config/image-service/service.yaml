apiVersion: v1
kind: Service
metadata:
  name: image-service
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: image-service
    app.kubernetes.io/managed-by: kustomize
spec:
  # ClusterIP is the safe default: it exposes the upload port
  # (containerPort 8080, see deployment.yaml) only inside the cluster
  # network. Reaching it from kezioctl running outside the cluster (or
  # from another site, where kezio keeps boot infrastructure per-site/local
  # while image/data storage is shared/global) is the cluster operator's
  # choice — port-forward, an Ingress, a
  # LoadBalancer type, or a NodePort — made by patching this Service in
  # an overlay, not by this base manifest.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: image-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
