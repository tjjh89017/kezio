apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-service-staging
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: image-service
    app.kubernetes.io/managed-by: kustomize
spec:
  # ReadWriteMany: the ingest job that consumes a staged upload
  # (kezio-staged://<name>) mounts the same volume image-service wrote it
  # to. An RWO-only storage class forces both onto the same node - a valid
  # choice for a single-node/small cluster, but not assumed here.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      # Sized for source disk images (Image.spec.source: raw/qcow2/vmdk) in
      # flight before ingest converts and slices them. Size to the largest
      # expected concurrent upload volume; overlay to change it.
      #
      # image-service also admits an upload against this volume's actual
      # free space before reading a body byte (imageservice.Admission),
      # failing fast with 507 instead of running out of space mid-write.
      # Set --staging-quota-bytes for a tighter, policy-driven cap below
      # this PVC's size.
      storage: 100Gi
