---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - pods
  - secrets
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - k8s.cni.cncf.io
  resources:
  - network-attachment-definitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kezio.kojuro.date
  resources:
  - imagelayouts
  - sites
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kezio.kojuro.date
  resources:
  - images
  - machines
  - posthooks
  - subnets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kezio.kojuro.date
  resources:
  - images/finalizers
  - machines/finalizers
  - posthooks/finalizers
  - subnets/finalizers
  verbs:
  - update
- apiGroups:
  - kezio.kojuro.date
  resources:
  - images/status
  - machines/status
  - posthooks/status
  - subnets/status
  verbs:
  - get
  - patch
  - update
