resources:
# All RBAC is applied under this ServiceAccount. Comment it out if the
# manager uses a ServiceAccount that already exists at runtime; update the
# RoleBinding/ClusterRoleBinding subjects if renaming it.
- service_account.yaml
- role.yaml
- role_binding.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# Protects the metrics endpoint with authn/authz. Comment out to disable.
# https://book.kubebuilder.io/reference/metrics.html
- metrics_auth_role.yaml
- metrics_auth_role_binding.yaml
- metrics_reader_role.yaml
# Admin/Editor/Viewer helper roles per CRD, not used by kezio itself.
# Comment out to skip installing them.
- machine_admin_role.yaml
- machine_editor_role.yaml
- machine_viewer_role.yaml
- posthook_admin_role.yaml
- posthook_editor_role.yaml
- posthook_viewer_role.yaml
- image_admin_role.yaml
- image_editor_role.yaml
- image_viewer_role.yaml
- site_admin_role.yaml
- site_editor_role.yaml
- site_viewer_role.yaml
- subnet_admin_role.yaml
- subnet_editor_role.yaml
- subnet_viewer_role.yaml

