# This rule is not used by the project kezio itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kezio.kojuro.date.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/managed-by: kustomize
  name: posthook-editor-role
rules:
- apiGroups:
  - kezio.kojuro.date
  resources:
  - posthooks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kezio.kojuro.date
  resources:
  - posthooks/status
  verbs:
  - get
