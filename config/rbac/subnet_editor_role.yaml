# Not used by kezio itself; a helper for users who manage subnets but
# should not control RBAC.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/managed-by: kustomize
  name: subnet-editor-role
rules:
- apiGroups:
  - kezio.kojuro.date
  resources:
  - subnets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kezio.kojuro.date
  resources:
  - subnets/status
  verbs:
  - get
