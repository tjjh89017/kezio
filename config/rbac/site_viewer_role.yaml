# Not used by kezio itself; a helper granting read-only access to sites
# for monitoring/limited-visibility users.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/managed-by: kustomize
  name: site-viewer-role
rules:
- apiGroups:
  - kezio.kojuro.date
  resources:
  - sites
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kezio.kojuro.date
  resources:
  - sites/status
  verbs:
  - get
