# Not used by kezio itself; a helper granting read-only access to machines
# for monitoring/limited-visibility users.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/managed-by: kustomize
  name: machine-viewer-role
rules:
- apiGroups:
  - kezio.kojuro.date
  resources:
  - machines
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kezio.kojuro.date
  resources:
  - machines/status
  verbs:
  - get
