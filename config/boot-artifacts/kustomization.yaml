# Shared Kustomize Component: the fetch.sh script that populates a boot
# artifacts volume from a published GitHub Release (see
# .github/workflows/build-live-image.yml). It is a Component, not a
# resources-composing kustomization on its own - it has nothing to
# deploy by itself, only something for config/bootserver and config/bootd
# to add an initContainer patch on top of. Both of those `components:`
# this directory rather than duplicating the script inline in two
# patches.
#
# `disableNameSuffixHash: true` on the ConfigMap below is deliberate: a
# fixed name lets each consumer's initContainer patch reference it by a
# literal name instead of tracking a generated hash, at the cost of a
# ConfigMap edit here not automatically rolling the pods that mount it -
# acceptable for an initContainer whose job is a one-shot fetch-and-exit,
# not a long-running process that would need a restart to pick up a
# changed script.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: boot-artifacts-fetch-script
    files:
      - fetch.sh
    options:
      disableNameSuffixHash: true
