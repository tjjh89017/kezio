# Byte-identical copy of config/bootserver/boot-artifacts-init-patch.yaml -
# see boot-server-service.yaml in this directory for why this overlay keeps
# local copies (kustomize's LoadRestrictionsRootOnly forbids a `patches:`
# entry outside this kustomization's own root). Keep the two in sync.
#
# Deliberately NOT wired into this directory's kustomization.yaml `patches:`
# list: config/e2e-boot-path is shared by test-e2e.yml's hermetic
# "boot-path" job (simulates GRUB/agent traffic, never needs real artifact
# bytes) and e2e-boot-path-kubevirt.yml's real KubeVirt boot. Wiring this
# initContainer in would make every test-e2e.yml run depend on an image
# pull. Only e2e-boot-path-kubevirt.yml applies this file (`kubectl patch
# --type=json --patch-file`) after the base overlay is up.
#
# Unlike config/bootserver/boot-artifacts-init-patch.yaml, this copy has no
# "add .../containers/0/env" op: e2e-boot-path-kubevirt.yml already ran
# `kubectl set env` (BOOT_ARTIFACTS_DIR=/boot-artifacts, etc.), which
# populates containers[0].env as a whole array - an "add" at that path here
# would replace it and drop those vars.
#
# The initContainer's image IS the fetch (docker/boot-artifacts/Dockerfile,
# built by .github/workflows/build-live-image.yml, with vmlinuz/initrd.img/
# filesystem.squashfs/shimx64.efi/grubx64.efi/manifest.json baked in at
# /boot-artifacts), so populating the shared emptyDir is a plain `cp` with
# no network access. e2e-boot-path-kubevirt.yml repoints the image with
# `kubectl set image` after this patch; "kezio-boot-artifacts:latest" below
# is only the placeholder value the JSON Patch needs.
#
# fsGroup matches this image's numeric USER gid (65532): the "boot-artifacts"
# emptyDir is otherwise created root:root 0755, so without this the `cp`
# below fails EACCES and the initContainer CrashLoopBackOffs.
- op: add
  path: /spec/template/spec/securityContext/fsGroup
  value: 65532
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: fetch-boot-artifacts
      image: kezio-boot-artifacts:latest
      # Explicit, not left to the API server's tag-based default: this
      # container is later repointed at the real tag with `kubectl set
      # image`, which never re-runs defaulting, so an implicit default here
      # would bake in imagePullPolicy: Always and ignore an already-imported
      # local image. Keep in sync with config/bootserver's copy.
      imagePullPolicy: IfNotPresent
      command:
        - cp
        - -a
        - /boot-artifacts/vmlinuz
        - /boot-artifacts/initrd.img
        - /boot-artifacts/filesystem.squashfs
        - /boot-artifacts/manifest.json
        - /dest
      volumeMounts:
        - name: boot-artifacts
          mountPath: /dest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        # Numeric image USER (Dockerfile's USER 65532:65532) lets restricted
        # Pod Security Admission verify runAsNonRoot without an explicit
        # runAsUser/runAsGroup override here.
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: boot-artifacts
    emptyDir: {}
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: boot-artifacts
    mountPath: /boot-artifacts
    readOnly: true
