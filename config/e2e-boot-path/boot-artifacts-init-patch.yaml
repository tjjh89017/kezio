# Byte-identical copy of config/bootserver/boot-artifacts-init-patch.yaml
# - see boot-server-service.yaml in this directory for why this overlay
# keeps local copies instead of referencing the originals by relative
# path (kustomize's LoadRestrictionsRootOnly forbids a `patches:` entry
# naming a plain file outside this kustomization's own root). Keep the
# two in sync if that file changes.
#
# Deliberately NOT wired into this directory's kustomization.yaml
# `patches:` list: config/e2e-boot-path is shared by test-e2e.yml's
# always-on, hermetic "boot-path" job (which only simulates GRUB/agent
# traffic with a plain HTTP client - see e2e-boot-path-kubevirt.yml's
# own header comment - and never needs real artifact bytes) and
# e2e-boot-path-kubevirt.yml's real KubeVirt boot. Wiring a real
# GitHub-Release-fetching initContainer into the shared overlay would
# make every test-e2e.yml run depend on network egress and a published
# release existing, which is exactly the "trustworthy, always-on signal"
# staying that way that e2e-boot-path-kubevirt.yml's header argues for
# keeping separate. Only e2e-boot-path-kubevirt.yml applies this file,
# with `kubectl patch --type=json --patch-file`, after the base overlay
# is already up, and after separately materializing the
# "boot-artifacts-fetch-script" ConfigMap this patch's "fetch-script"
# volume references (`kubectl create configmap ... --from-file=fetch.sh=
# config/boot-artifacts/fetch.sh`) - see that step in
# e2e-boot-path-kubevirt.yml.
#
# Unlike config/bootserver/boot-artifacts-init-patch.yaml, this copy has
# no "add .../containers/0/env" op: by the time this file is applied,
# e2e-boot-path-kubevirt.yml has already run `kubectl set env` with
# BOOT_ARTIFACTS_DIR=/boot-artifacts (among the other BOOT_*/DEPLOYER
# vars that command sets together), which populates containers[0].env as
# a whole array - a JSON Patch "add" at that same path here would
# replace, not extend, that array and silently drop every var `kubectl
# set env` just set.
#
# fsGroup below matches curl_user's gid (101, see the initContainer's own
# securityContext comment) because the "boot-artifacts" emptyDir added
# further down is otherwise created root:root mode 0755 - a fresh
# emptyDir gets no group access for a non-root gid unless the pod's
# fsGroup says so, the same reasoning config/image-service's
# securityContext.fsGroup comment documents for its Secret volume. Without
# this, fetch-boot-artifacts's `mkdir -p "${DEST_DIR}"` (config/
# boot-artifacts/fetch.sh) fails with EACCES and the initContainer
# CrashLoopBackOffs before the manager container ever starts.
#
# Re-validated at the latest e2e version bump: curl_user's uid/gid come
# from the curlimages/curl image (curl:8.21.0, unchanged - already
# latest) and restricted PSA is this repo's own namespace policy, not
# affected by the KubeVirt/CDI/Multus/k3s bumps, so this patch stays.
- op: add
  path: /spec/template/spec/securityContext/fsGroup
  value: 101
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: fetch-boot-artifacts
      image: curlimages/curl:8.21.0
      command: ["/bin/sh", "/scripts/fetch.sh"]
      env:
        - name: BOOT_ARTIFACTS_REPO
          value: tjjh89017/kezio
        - name: BOOT_ARTIFACTS_VERSION
          value: latest
        - name: BOOT_ARTIFACTS_FILES
          value: "vmlinuz initrd.img filesystem.squashfs manifest.json"
        - name: DEST_DIR
          value: /boot-artifacts
      volumeMounts:
        - name: boot-artifacts
          mountPath: /boot-artifacts
        - name: fetch-script
          mountPath: /scripts
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        # curlimages/curl's image USER is the non-numeric "curl_user"
        # (uid 100, gid 101 per its own /etc/passwd); restricted Pod
        # Security Admission cannot resolve a non-numeric image USER to
        # verify runAsNonRoot, so it rejects the pod outright
        # ("cannot verify user is non-root") unless a numeric
        # runAsUser/runAsGroup is set explicitly here.
        runAsUser: 100
        runAsGroup: 101
        capabilities:
          drop: ["ALL"]
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: boot-artifacts
    emptyDir: {}
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: fetch-script
    configMap:
      name: boot-artifacts-fetch-script
      defaultMode: 0o444
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: boot-artifacts
    mountPath: /boot-artifacts
    readOnly: true
