# Byte-identical copy of config/agentserver/manager-port-patch.yaml; see
# boot-server-service.yaml in this directory for why this overlay keeps
# local copies instead of referencing the originals by relative path.
- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    containerPort: 8091
    name: agent-http
    protocol: TCP
