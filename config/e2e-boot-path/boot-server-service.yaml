# Byte-identical copy of config/bootserver/service.yaml. Kustomize's
# LoadRestrictionsRootOnly forbids a `resources:` entry naming a plain YAML
# file outside this kustomization's own root, so `../bootserver/service.yaml`
# can't be referenced directly. Keep the two in sync.
apiVersion: v1
kind: Service
metadata:
  name: kezio-boot-server
  namespace: kezio-system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: boot-server
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: kezio
  ports:
    - name: boot-http
      port: 8090
      targetPort: boot-http
      protocol: TCP
