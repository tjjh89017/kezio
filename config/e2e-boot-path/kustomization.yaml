# Overlay wiring the boot config and agent registration Services into the
# base deployment, for e2e stages that need bootd/the agent to reach the
# controller-manager. Aggregates the base deployment plus the
# standalone-Service pieces config/bootserver and config/agentserver each
# normally leave for a cluster operator to opt into, mirroring
# config/e2e-image-path's shape for image-service/seeder.
#
# Pulls in ../default once and includes the same boot-server and
# agent-server components config/bootserver, config/agentserver and
# config/boot-agent-server include, so this lane builds the identical
# Service and containerPort bytes an operator gets. It deliberately leaves
# out config/components/boot-artifacts: this overlay stays hermetic, since
# its lanes simulate GRUB and agent traffic and never read real artifact
# bytes. The BMC e2e lane's deploy-e2e-deploy-path-stack action applies
# boot-artifacts-init-patch.yaml from here by file path instead - that file
# is a different patch from the component's, not a copy of it.
#
# BOOT_SERVER_ADDR, BOOT_ARTIFACTS_DIR, BOOT_SERVER_URL,
# BOOT_AGENT_SERVER_URL, AGENT_SERVER_ADDR, and DEPLOYER are NOT set here -
# they need per-run values; the e2e suite sets them with `kubectl set env`
# after applying this overlay.
resources:
  - ../default

components:
  - ../components/boot-server
  - ../components/agent-server
