# Overlay wiring the boot config and agent registration Services into the
# base deployment, for e2e stages that need bootd/the agent to reach the
# controller-manager. Aggregates the base deployment plus the
# standalone-Service pieces config/bootserver and config/agentserver each
# normally leave for a cluster operator to opt into, mirroring
# config/e2e-image-path's shape for image-service/seeder.
#
# config/e2e-deploy-path keeps local copies of this directory's
# Service/patch manifests rather than composing it directly (see that
# directory's own comment for why), and the BMC e2e lane's
# deploy-e2e-deploy-path-stack action applies
# boot-artifacts-init-patch.yaml from here by file path. Keep those
# copies in sync with the originals here.
#
# Does not compose config/bootserver or config/agentserver directly: both
# already list ../default as a resource, and kustomize cannot merge two
# kustomizations that each independently pull in the same base. Instead this
# overlay pulls in ../default once, plus local copies of the Service/patch
# manifests bootserver and agentserver each ship (see
# boot-server-service.yaml's header comment for why they're local copies).
#
# BOOT_SERVER_ADDR, BOOT_ARTIFACTS_DIR, BOOT_SERVER_URL,
# BOOT_AGENT_SERVER_URL, AGENT_SERVER_ADDR, and DEPLOYER are NOT set here -
# they need per-run values; the e2e suite sets them with `kubectl set env`
# after applying this overlay.
resources:
  - ../default
  - boot-server-service.yaml
  - agent-server-service.yaml

patches:
  - path: manager-boot-port-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
  - path: manager-agent-port-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
