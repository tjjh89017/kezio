# Overlay for the e2e boot-path stage (test/e2e's "Boot path (control-plane
# wiring)" Context, gated by E2E_BOOT_PATH=true). Aggregates the base
# deployment plus the standalone-Service pieces config/bootserver and
# config/agentserver each normally leave for a cluster operator to opt into,
# mirroring config/e2e-image-path's shape for image-service/seeder.
#
# Does not compose config/bootserver or config/agentserver directly: both
# already list ../default as a resource, and kustomize cannot merge two
# kustomizations that each independently pull in the same base. Instead this
# overlay pulls in ../default once, plus local copies of the Service/patch
# manifests bootserver and agentserver each ship (see
# boot-server-service.yaml's header comment for why they're local copies).
#
# BOOT_SERVER_ADDR, BOOT_ARTIFACTS_DIR, BOOT_SERVER_URL,
# BOOT_AGENT_SERVER_URL, AGENT_SERVER_ADDR, and DEPLOYER are NOT set here -
# they need per-run values; the e2e suite sets them with `kubectl set env`
# after applying this overlay.
resources:
  - ../default
  - boot-server-service.yaml
  - agent-server-service.yaml

patches:
  - path: manager-boot-port-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
  - path: manager-agent-port-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
