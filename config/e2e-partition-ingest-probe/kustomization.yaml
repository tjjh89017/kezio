# Overlay for PR-triggered partition-ingest probing: config/default plus
# config/image-service and a staging PVC patch, with no seeder/opentracker
# (this probe only times ingest through the per-partition-PVC/publish path,
# internal/controller/image_publish.go). Deliberately no store PVC/mount:
# both are specific to the legacy shared-store path
# (IngestConfig.LegacySharedStoreVolume), which this probe bypasses.
#
# staging-pvc-patch.yaml is a local copy of config/e2e-image-path's own
# patch (LoadRestrictionsRootOnly forbids a relative-path reference).
resources:
  - ../default
  - ../image-service
  - ../ingest

patches:
  - path: staging-pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: kezio-image-service-staging
