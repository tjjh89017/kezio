# Overlay for probe-partition-ingest.yml: config/default plus
# config/image-service and a staging PVC patch, with no seeder/opentracker
# (this probe never seeds or leeches - it only times ingest through the
# per-partition-PVC/publish path, see internal/controller/image_publish.go).
# Deliberately does not add a store PVC or a store mount on the manager:
# both are specific to the legacy shared-store path
# (IngestConfig.LegacySharedStoreVolume), which this probe's whole point is
# to bypass - see the probe workflow, which never sets INGEST_STORE_PVC.
#
# staging-pvc-patch.yaml is a local copy of config/e2e-image-path's own
# patch, not a relative-path reference to it, for the same
# LoadRestrictionsRootOnly reason config/e2e-deploy-path's header comment
# explains.
resources:
  - ../default
  - ../image-service
  - ../ingest

patches:
  - path: staging-pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: kezio-image-service-staging
