# config/image-service/pvc.yaml requests ReadWriteMany for real deployments
# that may split image-service and the ingest Job across nodes. This
# disposable single-node RKE2 cluster has no ReadWriteMany provisioner by
# default, and both consumers run on the same node here, so
# ReadWriteOnce + "local-path" is sufficient and actually bindable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kezio-image-service-staging
  namespace: kezio-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
