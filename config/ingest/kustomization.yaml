# Standalone kustomization for the ingest Job's own RBAC: a ServiceAccount
# plus the Role/RoleBinding to create/get/update ImageLayouts in its
# namespace. Not one of config/default's resources: real ingest is opt-in,
# gated by IngestConfig.enabled() (INGEST_IMAGE unset means no ingest Jobs
# run). Deploy alongside config/default whenever ingest is wired up:
#
#   kustomize build config/ingest | kubectl apply -f -
#
# and set INGEST_SERVICE_ACCOUNT=kezio-ingest on the controller-manager
# Deployment so the ingest Job's pod runs as this ServiceAccount instead of
# the namespace default, which has no ImageLayout RBAC.
namespace: kezio-system
namePrefix: kezio-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: kezio

resources:
  - service_account.yaml
  - role.yaml
  - role_binding.yaml
