apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: ingest
    app.kubernetes.io/managed-by: kustomize
  name: ingest-role
  namespace: system
rules:
  # The ingest Job writes its own layout ConfigMap directly (see
  # internal/ingest.WriteLayoutConfigMap) instead of relaying the sfdisk
  # dump back through the Image controller's 4KiB-capped termination
  # message. It never needs to read an Image itself: the owner reference
  # it sets comes from env vars the controller already put on the Job
  # (see internal/controller's buildIngestJob).
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
      - update
