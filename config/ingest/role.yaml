apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: ingest
    app.kubernetes.io/managed-by: kustomize
  name: ingest-role
  namespace: system
rules:
  # The ingest Job writes its own ImageLayout directly
  # (internal/ingest.WriteImageLayout); it never needs to read an Image, its
  # owner reference comes from env vars buildIngestJob already set. Scoped
  # to imagelayouts only: RBAC resourceNames can't restrict create, so a
  # ConfigMap-shaped grant would let this ServiceAccount touch any
  # ConfigMap in the namespace.
  - apiGroups:
      - kezio.kojuro.date
    resources:
      - imagelayouts
    verbs:
      - create
      - get
      - update
