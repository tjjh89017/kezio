# Sample Secret for Machine "machine-sample"'s spec.bmc.credentialsSecretRef.
#
# Shape: type kubernetes.io/basic-auth, with exactly the "username" and
# "password" keys that internal/bmc.CredentialsFromSecretData looks up.
# Both keys are required; either missing or empty fails the Machine's BMC
# connection at resolve time rather than connecting with empty credentials.
#
# PLACEHOLDER VALUES ONLY - replace before applying. Never commit real BMC
# credentials to a manifest; use a secret manager, sealed-secrets, or a
# similar out-of-band mechanism in a real deployment.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/managed-by: kustomize
  name: machine-sample-bmc
type: kubernetes.io/basic-auth
stringData:
  username: CHANGEME-bmc-username
  password: CHANGEME-bmc-password
