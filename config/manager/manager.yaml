apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kezio
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: kezio
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: kezio
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: kezio
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # image-service's in-cluster Service address (see
          # config/image-service), for the ImageImport controller to
          # discover a kezio-staged:// source's size ahead of sizing the
          # ingest scratch PVC (see internal/controller's
          # discoverSourceSizeBytes). The token comes from the same
          # Secret image-service itself reads its bearer token from
          # (config/image-service/deployment.yaml); optional, so the
          # manager still starts in a cluster with no image-service
          # deployed - a source whose size cannot be discovered this way
          # just falls back to the configured floor.
          - name: IMAGE_INGEST_IMAGE_SERVICE_URL
            value: http://kezio-image-service.kezio-system.svc.cluster.local:8080
          - name: IMAGE_INGEST_IMAGE_SERVICE_TOKEN
            valueFrom:
              secretKeyRef:
                name: kezio-image-service-token
                key: token
                optional: true
          # The ingest Job attaches its source image with qemu-nbd by
          # default (IMAGE_INGEST_ATTACH=nbd), which needs a privileged
          # pod and the node's "nbd" kernel module loaded with
          # max_part>0 (see docs/crd-reference.md). Set to "true" on a
          # cluster that cannot run a privileged ingest Job; the ingest
          # Job then falls back to the original unprivileged file-copy
          # pipeline, at the cost of a larger scratch PVC.
          # - name: IMAGE_INGEST_UNPRIVILEGED
          #   value: "false"
        ports: []
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
