# Runs the boot config server and the agent registration server together,
# the ordinary shape for a cluster that deploys machines: a machine cannot
# register through the agent server if it never net boots through the boot
# server. Apply this instead of, not beside, config/bootserver and
# config/agentserver:
#
#   kustomize build config/boot-agent-server | kubectl apply -f -
#
# Applying config/bootserver and config/agentserver one after the other
# does NOT give the same result, and fails silently. Each of those two
# lists ../default as a resource, so each renders a complete
# controller-manager Deployment carrying only its own component. The second
# `kubectl apply` therefore removes the first one's containerPort and, for
# config/bootserver, the fetch-boot-artifacts initContainer - while every
# command still reports success. The failure surfaces much later, as a
# refused connection to a Service whose pods no longer expose that port.
#
# Read config/bootserver/README.md and config/agentserver/README.md for the
# BOOT_* and AGENT_* variables this still leaves for the operator to set.
resources:
  - ../default

components:
  - ../components/boot-server
  - ../components/agent-server
  - ../components/boot-artifacts
