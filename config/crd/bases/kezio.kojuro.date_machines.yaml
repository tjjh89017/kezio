---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: machines.kezio.kojuro.date
spec:
  group: kezio.kojuro.date
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    singular: machine
  scope: Namespaced
  versions:
  - name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Machine is the Schema for the machines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              MachineSpec defines the desired state of Machine. There is no power
              intent field here: power follows the deploy lifecycle and the
              AfterDeploy mechanism only.
            properties:
              afterDeploy:
                default: Reboot
                description: |-
                  AfterDeploy selects what happens when a deployment finishes without
                  an OS image to reboot into. Defaults to Reboot.
                enum:
                - Reboot
                - PowerOff
                type: string
              bmc:
                description: |-
                  BMC identifies the board management controller that powers and
                  boot-orders this machine. The controller uses it to power the
                  machine on for inspection and deployment, and to set its power
                  state afterward.
                properties:
                  address:
                    description: |-
                      Address is the BMC endpoint URL. Its scheme selects the driver, for
                      example "redfish://" or "ipmi://".
                    pattern: ^[a-zA-Z][a-zA-Z0-9+.-]*://.+
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names the Secret holding the BMC username and
                      password.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - address
                - credentialsSecretRef
                type: object
              bootMACAddress:
                description: |-
                  BootMACAddress is the MAC address of the NIC the machine network
                  boots from. The boot config server uses it to find this machine.
                  Normally discovered by inspection; it is mandatory only when the
                  inspect-disable annotation skips inspection, a rule the Machine
                  webhook enforces.
                pattern: ^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$
                type: string
              dataImages:
                description: |-
                  DataImages is an ordered list of additional, non-OS images deployed
                  alongside the OS image in the same live session (or by themselves,
                  when ImageRef is absent).
                items:
                  description: |-
                    MachineDataImage is one additional, non-OS image deployed alongside (or
                    instead of) the machine's OS image in the same live session. Each entry
                    resolves against its own TargetDisk hints; all resolved disks across a
                    Machine's OS image and its DataImages must be distinct.
                  properties:
                    imageRef:
                      description: |-
                        ImageRef names the Image to deploy. It is typically a non-bootable
                        image (a data disk or a scratch layout), since only the OS image
                        gets a boot entry.
                      properties:
                        name:
                          description: |-
                            Post-mutation admission always re-serialises this struct, so a
                            zero-value Name would otherwise satisfy "required"; MinLength closes
                            that gap. MaxLength mirrors the Kubernetes object name limit and
                            bounds the CEL cost of any pattern-matching XValidation rule a
                            field of this type carries (see ImageSlot.ContentRef).
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      type: object
                    targetDisk:
                      description: TargetDisk selects the disk this image deploys
                        to.
                      properties:
                        deviceName:
                          description: |-
                            DeviceName is the kernel device path, for example "/dev/nvme0n1".
                            This is the last-choice hint: device names are not stable across
                            boots.
                          maxLength: 255
                          type: string
                        hctl:
                          description: |-
                            HCTL is the disk's SCSI host:channel:target:lun address, for example
                            "0:0:0:0".
                          pattern: ^[0-9]+:[0-9]+:[0-9]+:[0-9]+$
                          type: string
                        maxSizeGigabytes:
                          description: MaxSizeGigabytes rejects disks larger than
                            this size.
                          format: int64
                          minimum: 1
                          type: integer
                        minSizeGigabytes:
                          description: MinSizeGigabytes rejects disks smaller than
                            this size.
                          format: int64
                          minimum: 1
                          type: integer
                        model:
                          description: Model is the disk's reported model string.
                          maxLength: 255
                          type: string
                        pciePath:
                          description: |-
                            PciePath is the disk's PCIe address, read by resolving
                            /sys/block/<dev>.
                          maxLength: 255
                          type: string
                        rotational:
                          description: |-
                            Rotational matches on whether the disk is a spinning disk (true) or
                            solid-state (false), read from /sys/block/*/queue/rotational.
                          type: boolean
                        serialNumber:
                          description: |-
                            SerialNumber is the disk's serial number, read from
                            /sys/block/*/device/serial or udev.
                          maxLength: 255
                          type: string
                        slotNumber:
                          description: |-
                            SlotNumber is the disk's NVMe namespace or PCIe slot number, read
                            best-effort from DMI.
                          format: int32
                          type: integer
                        vendor:
                          description: Vendor is the disk's reported vendor string.
                          maxLength: 255
                          type: string
                        wwn:
                          description: WWN is the disk's World Wide Name, read from
                            udev's ID_WWN.
                          maxLength: 255
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: minSizeGigabytes must be less than or equal to maxSizeGigabytes
                        rule: '!has(self.minSizeGigabytes) || !has(self.maxSizeGigabytes)
                          || self.minSizeGigabytes <= self.maxSizeGigabytes'
                  required:
                  - imageRef
                  type: object
                maxItems: 32
                type: array
              ezio:
                description: |-
                  Ezio overrides the operator's cluster-wide default EZIO tuning for
                  this machine's leecher.
                properties:
                  aioThreads:
                    description: AioThreads overrides the EZIO daemon's async I/O
                      thread count.
                    format: int32
                    minimum: 1
                    type: integer
                  cacheSizeMB:
                    description: |-
                      CacheSizeMB overrides the EZIO daemon's unified cache size, in
                      megabytes.
                    format: int32
                    minimum: 1
                    type: integer
                  maxConnections:
                    description: |-
                      MaxConnections overrides the per-torrent maximum peer connection
                      count (ezio's AddTorrent max_connections).
                    format: int32
                    maximum: 1024
                    minimum: 1
                    type: integer
                  maxUploads:
                    description: |-
                      MaxUploads overrides the per-torrent maximum upload slot count
                      (ezio's AddTorrent max_uploads).
                    format: int32
                    maximum: 1024
                    minimum: 1
                    type: integer
                  port:
                    description: Port overrides the EZIO daemon's listen port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              imageRef:
                description: |-
                  ImageRef names the Image to deploy as this machine's OS. It must be
                  a bootable image. May be absent when the machine deploys only
                  DataImages and keeps its existing OS.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              params:
                description: |-
                  Params is schemaless input for the attached hooks' templating.
                  Merge order: the deployed Image's own params first, then this
                  field; later entries override earlier ones.
                x-kubernetes-preserve-unknown-fields: true
              postHookRefs:
                description: |-
                  PostHookRefs is an ordered list of PostHook resources attached to
                  this machine. Execution order: the attached Image's own
                  postHookRefs (ImageSpec.PostHookRefs) run first, then this list;
                  within this list, the given order holds. The shipped default hook
                  (kezio-default-finalize) is substituted only when both lists are
                  empty and this machine deploys an OS image.
                items:
                  description: |-
                    NameRef is a reference to a resource by name, optionally in another
                    namespace. When Namespace is empty, the namespace of the referencing
                    resource is used. Field names that hold a NameRef end in "Ref"; ordered
                    lists of NameRef end in "Refs".
                  properties:
                    name:
                      description: |-
                        Post-mutation admission always re-serialises this struct, so a
                        zero-value Name would otherwise satisfy "required"; MinLength closes
                        that gap. MaxLength mirrors the Kubernetes object name limit and
                        bounds the CEL cost of any pattern-matching XValidation rule a
                        field of this type carries (see ImageSlot.ContentRef).
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
              subnetRef:
                description: |-
                  SubnetRef names the Subnet this machine network boots through -
                  the broadcast domain whose bootd instance answers this machine's
                  PXE boot. Required: a Machine with no Subnet cannot be
                  network-booted.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              targetDisk:
                description: |-
                  TargetDisk selects the disk the OS image deploys to. Ignored when
                  ImageRef is absent.
                properties:
                  deviceName:
                    description: |-
                      DeviceName is the kernel device path, for example "/dev/nvme0n1".
                      This is the last-choice hint: device names are not stable across
                      boots.
                    maxLength: 255
                    type: string
                  hctl:
                    description: |-
                      HCTL is the disk's SCSI host:channel:target:lun address, for example
                      "0:0:0:0".
                    pattern: ^[0-9]+:[0-9]+:[0-9]+:[0-9]+$
                    type: string
                  maxSizeGigabytes:
                    description: MaxSizeGigabytes rejects disks larger than this size.
                    format: int64
                    minimum: 1
                    type: integer
                  minSizeGigabytes:
                    description: MinSizeGigabytes rejects disks smaller than this
                      size.
                    format: int64
                    minimum: 1
                    type: integer
                  model:
                    description: Model is the disk's reported model string.
                    maxLength: 255
                    type: string
                  pciePath:
                    description: |-
                      PciePath is the disk's PCIe address, read by resolving
                      /sys/block/<dev>.
                    maxLength: 255
                    type: string
                  rotational:
                    description: |-
                      Rotational matches on whether the disk is a spinning disk (true) or
                      solid-state (false), read from /sys/block/*/queue/rotational.
                    type: boolean
                  serialNumber:
                    description: |-
                      SerialNumber is the disk's serial number, read from
                      /sys/block/*/device/serial or udev.
                    maxLength: 255
                    type: string
                  slotNumber:
                    description: |-
                      SlotNumber is the disk's NVMe namespace or PCIe slot number, read
                      best-effort from DMI.
                    format: int32
                    type: integer
                  vendor:
                    description: Vendor is the disk's reported vendor string.
                    maxLength: 255
                    type: string
                  wwn:
                    description: WWN is the disk's World Wide Name, read from udev's
                      ID_WWN.
                    maxLength: 255
                    type: string
                type: object
                x-kubernetes-validations:
                - message: minSizeGigabytes must be less than or equal to maxSizeGigabytes
                  rule: '!has(self.minSizeGigabytes) || !has(self.maxSizeGigabytes)
                    || self.minSizeGigabytes <= self.maxSizeGigabytes'
            required:
            - bmc
            - subnetRef
            type: object
          status:
            description: MachineStatus defines the observed state of Machine.
            properties:
              agentSession:
                description: |-
                  AgentSession records the session credential most recently minted
                  for kezio-agent at registration, presented on every subsequent
                  poll.
                properties:
                  expiresAt:
                    description: ExpiresAt is when the current session token stops
                      being accepted.
                    format: date-time
                    type: string
                  tokenHash:
                    description: TokenHash is the SHA-256 hex digest of the current
                      session token.
                    type: string
                type: object
              conditions:
                description: Conditions report the current state of the machine.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentRunRef:
                description: CurrentRunRef names the DeployRun for a deployment in
                  progress.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              errorCount:
                description: |-
                  ErrorCount counts consecutive errors since the last success in the
                  current state. The controller uses it to compute backoff.
                format: int32
                type: integer
              errorMessage:
                description: |-
                  ErrorMessage describes the most recent error, when OperationalStatus
                  is "error".
                type: string
              errorType:
                description: |-
                  ErrorType classifies the most recent error, when OperationalStatus
                  is "error".
                type: string
              goodCredentials:
                description: |-
                  GoodCredentials records the last BMC Secret observation the
                  controller successfully authenticated with.
                properties:
                  resourceVersion:
                    description: |-
                      ResourceVersion is the named Secret's resourceVersion at the time of
                      this observation.
                    type: string
                  secretRef:
                    description: SecretRef names the observed BMC credentials Secret.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              lastSuccessfulRunRef:
                description: |-
                  LastSuccessfulRunRef names the most recent DeployRun that completed
                  successfully. The provisioning trigger compares the current deploy
                  intent against this run's resolved snapshot.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              lastUpdated:
                description: |-
                  LastUpdated is when this status was last written. Its absence
                  despite a set spec.imageRef is the signal that status was lost
                  (rather than never provisioned).
                format: date-time
                type: string
              netBoot:
                description: |-
                  NetBoot records the live-boot token most recently minted for this
                  machine by the boot config server.
                properties:
                  expiresAt:
                    description: ExpiresAt is when the current boot token stops being
                      accepted.
                    format: date-time
                    type: string
                  tokenHash:
                    description: TokenHash is the SHA-256 hex digest of the current
                      boot token.
                    type: string
                type: object
              operationalStatus:
                description: |-
                  OperationalStatus is the axis orthogonal to State: it reports an
                  error, a delay, or a detach without disturbing State.
                enum:
                - OK
                - error
                - delayed
                - detached
                type: string
              poweredOn:
                description: PoweredOn reports the machine's last observed power state.
                type: boolean
              state:
                description: |-
                  State is the machine's position in the state machine.
                  Deprovisioning/PoweringOff are the delete-only states: the
                  controller enters them only once a deletion timestamp is set, and
                  they never appear on the forward walk.
                enum:
                - Enrolling
                - Inspecting
                - Available
                - Provisioning
                - Provisioned
                - Deprovisioning
                - PoweringOff
                type: string
              triedCredentials:
                description: |-
                  TriedCredentials records the BMC Secret observation of the most
                  recent connection attempt, successful or not.
                properties:
                  resourceVersion:
                    description: |-
                      ResourceVersion is the named Secret's resourceVersion at the time of
                      this observation.
                    type: string
                  secretRef:
                    description: SecretRef names the observed BMC credentials Secret.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
