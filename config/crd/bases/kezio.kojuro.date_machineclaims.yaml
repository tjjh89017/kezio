          spec:
            description: |-
              MachineClaimSpec defines the desired state of MachineClaim: which
              machine the claim wants, and what to deploy on it.
            properties:
              afterDeploy:
                default: Reboot
                description: |-
                  AfterDeploy selects what happens when a deployment finishes
