  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: imageimports.kezio.kojuro.date
spec:
  group: kezio.kojuro.date
  names:
    kind: ImageImport
    listKind: ImageImportList
    plural: imageimports
    singular: imageimport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.imageRef.name
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          ImageImport is the Schema for the imageimports API. It is the request
          to turn one source disk image into a set of PartitionContent objects
          plus the Image that binds them, with exactly one partclone run - in the
          cluster - producing all of it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ImageImportSpec defines the desired state of ImageImport: one source
              disk image, the names to give what comes out of it, and the Image-level
              settings to stamp onto the Image this import creates.

              The spec is immutable once created (see the type-level XValidation
              rule). An import runs partclone exactly once, in the cluster: the
              partition table, every partition's role and file system, and every
              content's size are things only that run can know, so nothing here
              describes them.
            properties:
              bootable:
                default: true
                description: Bootable is copied onto the created Image's spec.bootable.
                type: boolean
              contentPrefix:
                description: |-
                  ContentPrefix names the PartitionContent objects this import
                  captures: partition N becomes "<contentPrefix>-p<N>"
                  (internal/store.ContentName). The import fails if any of those names
                  is already taken - content is immutable, so an import never writes
                  over one. MaxLength leaves room for the "-p<N>" suffix and the
                  "-content" suffix each content's own PVC name carries
                  (internal/store.MaxContentNameLength).
                maxLength: 240
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                type: string
              imageName:
                description: |-
                  ImageName is the name of the Image this import creates once ingest
                  has captured the whole layout, in this ImageImport's own namespace.
                  The import fails if that name is already taken.
                maxLength: 253
                minLength: 1
                type: string
              osFamily:
                default: Linux
                description: OSFamily is copied onto the created Image's spec.osFamily.
                enum:
                - Linux
                - Windows
                - FreeBSD
                - Other
                type: string
              params:
                description: Params is copied onto the created Image's spec.params.
                x-kubernetes-preserve-unknown-fields: true
              postHookRefs:
                description: PostHookRefs is copied onto the created Image's spec.postHookRefs.
                items:
                  description: |-
                    NameRef is a reference to a resource by name, optionally in another
                    namespace. When Namespace is empty, the namespace of the referencing
                    resource is used. Field names that hold a NameRef end in "Ref"; ordered
                    lists of NameRef end in "Refs".
                  properties:
                    name:
                      description: |-
                        Post-mutation admission always re-serialises this struct, so a
                        zero-value Name would otherwise satisfy "required"; MinLength closes
                        that gap. MaxLength mirrors the Kubernetes object name limit and
                        bounds the CEL cost of any pattern-matching XValidation rule a
                        field of this type carries (see ImageSlot.ContentRef).
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
              source:
                description: Source is the disk image to import.
                properties:
                  checksum:
                    description: |-
                      Checksum verifies the fetched source image before ingest converts
                      it: "sha256:<hex digest>".
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  url:
                    description: URL is the location the ingest Job fetches the source
                      image from.
                    maxLength: 4096
                    minLength: 1
                    type: string
                required:
                - checksum
                - url
                type: object
            required:
            - contentPrefix
            - imageName
            - source
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: ImageImportStatus defines the observed state of ImageImport.
            properties:
              conditions:
                description: |-
                  Conditions report the current state of the import. Every write
                  carries observedGeneration set to the generation the write observed.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contentRefs:
                description: |-
                  ContentRefs names every PartitionContent this import created, in
                  partition order.
                items:
                  description: |-
                    NameRef is a reference to a resource by name, optionally in another
                    namespace. When Namespace is empty, the namespace of the referencing
                    resource is used. Field names that hold a NameRef end in "Ref"; ordered
                    lists of NameRef end in "Refs".
                  properties:
                    name:
                      description: |-
                        Post-mutation admission always re-serialises this struct, so a
                        zero-value Name would otherwise satisfy "required"; MinLength closes
                        that gap. MaxLength mirrors the Kubernetes object name limit and
                        bounds the CEL cost of any pattern-matching XValidation rule a
                        field of this type carries (see ImageSlot.ContentRef).
                      maxLength: 253
                      minLength: 1
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 128
                type: array
              imageRef:
                description: ImageRef names the Image this import created, once it
                  exists.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              state:
                description: State is the object's position in the import workflow.
                enum:
                - Pending
                - Ingesting
                - Ready
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
