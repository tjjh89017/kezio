---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: deployruns.kezio.kojuro.date
spec:
  group: kezio.kojuro.date
  names:
    kind: DeployRun
    listKind: DeployRunList
    plural: deployruns
    singular: deployrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.machineRef.name
      name: Machine
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: DeployRun is the Schema for the deployruns API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DeployRunSpec is the resolved deployment snapshot for one attempt. The
              Machine reconciler writes it once at creation; every field is immutable
              afterward (see the type-level XValidation rule) since it is the historical
              record of what this attempt was resolved to run.
            properties:
              dataImages:
                description: |-
                  DataImages is the resolved non-OS image list, copied from
                  Machine.spec.dataImages.
                items:
                  description: |-
                    MachineDataImage is one additional, non-OS image deployed alongside (or
                    instead of) the machine's OS image in the same live session. Each entry
                    resolves against its own TargetDisk hints; all resolved disks across a
                    Machine's OS image and its DataImages must be distinct.
                  properties:
                    imageRef:
                      description: |-
                        ImageRef names the Image to deploy. It is typically a non-bootable
                        image (a data disk or a scratch layout), since only the OS image
                        gets a boot entry.
                      properties:
                        name:
                          description: |-
                            Post-mutation admission always re-serialises this struct, so a
                            zero-value Name would otherwise satisfy "required"; MinLength closes
                            that gap. MaxLength mirrors the Kubernetes object name limit and
                            bounds the CEL cost of any pattern-matching XValidation rule a
                            field of this type carries (see ImageSlot.ContentRef).
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      type: object
                    targetDisk:
                      description: TargetDisk selects the disk this image deploys
                        to.
                      properties:
                        deviceName:
                          description: |-
                            DeviceName is the kernel device path, for example "/dev/nvme0n1".
                            This is the last-choice hint: device names are not stable across
                            boots.
                          maxLength: 255
                          type: string
                        hctl:
                          description: |-
                            HCTL is the disk's SCSI host:channel:target:lun address, for example
                            "0:0:0:0".
                          pattern: ^[0-9]+:[0-9]+:[0-9]+:[0-9]+$
                          type: string
                        maxSizeGigabytes:
                          description: MaxSizeGigabytes rejects disks larger than
                            this size.
                          format: int64
                          minimum: 1
                          type: integer
                        minSizeGigabytes:
                          description: MinSizeGigabytes rejects disks smaller than
                            this size.
                          format: int64
                          minimum: 1
                          type: integer
                        model:
                          description: Model is the disk's reported model string.
                          maxLength: 255
                          type: string
                        pciePath:
                          description: |-
                            PciePath is the disk's PCIe address, read by resolving
                            /sys/block/<dev>.
                          maxLength: 255
                          type: string
                        rotational:
                          description: |-
                            Rotational matches on whether the disk is a spinning disk (true) or
                            solid-state (false), read from /sys/block/*/queue/rotational.
                          type: boolean
                        serialNumber:
                          description: |-
                            SerialNumber is the disk's serial number, read from
                            /sys/block/*/device/serial or udev.
                          maxLength: 255
                          type: string
                        slotNumber:
                          description: |-
                            SlotNumber is the disk's NVMe namespace or PCIe slot number, read
                            best-effort from DMI.
                          format: int32
                          type: integer
                        vendor:
                          description: Vendor is the disk's reported vendor string.
                          maxLength: 255
                          type: string
                        wwn:
                          description: WWN is the disk's World Wide Name, read from
                            udev's ID_WWN.
                          maxLength: 255
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: minSizeGigabytes must be less than or equal to maxSizeGigabytes
                        rule: '!has(self.minSizeGigabytes) || !has(self.maxSizeGigabytes)
                          || self.minSizeGigabytes <= self.maxSizeGigabytes'
                  required:
                  - imageRef
                  type: object
                maxItems: 32
                type: array
              hooksHash:
                description: |-
                  HooksHash is a content hash of every resolved PostHook step for this
                  run (Machine.spec.postHookRefs plus the OS Image's own
                  postHookRefs), used by the provisioning trigger to detect a hook
                  change without storing the resolved hook content itself.
                maxLength: 64
                type: string
              imageRef:
                description: |-
                  ImageRef names the OS Image resolved for this run, copied from
                  Machine.spec.imageRef. Absent for a dataImages-only run.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              machineRef:
                description: MachineRef names the Machine this run deploys to.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              resolvedDisks:
                description: |-
                  ResolvedDisks records which disk each image above resolved to,
                  against the hardware inventory known at creation. Excluded from the
                  provisioning trigger's intent comparison: device names drift across
                  boots, so a difference here alone must never start a new run.
                items:
                  description: |-
                    DeployRunResolvedDisk records one image and the disk resolved to receive
                    it, at the start of the run - the OS image or one dataImages entry.
                  properties:
                    imageRef:
                      description: ImageRef names the Image being deployed.
                      properties:
                        name:
                          description: |-
                            Post-mutation admission always re-serialises this struct, so a
                            zero-value Name would otherwise satisfy "required"; MinLength closes
                            that gap. MaxLength mirrors the Kubernetes object name limit and
                            bounds the CEL cost of any pattern-matching XValidation rule a
                            field of this type carries (see ImageSlot.ContentRef).
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          type: string
                      required:
                      - name
                      type: object
                    targetDisk:
                      description: TargetDisk is the resolved device path the image
                        is written to.
                      maxLength: 255
                      type: string
                  required:
                  - imageRef
                  - targetDisk
                  type: object
                maxItems: 33
                type: array
            required:
            - machineRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: DeployRunStatus defines the observed state of DeployRun.
            properties:
              conditions:
                description: Conditions report the current state of this run.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              partitions:
                description: |-
                  Partitions is one entry per partition this run writes to, across
                  the OS image and every dataImages entry.
                items:
                  description: |-
                    DeployRunPartitionProgress is one partition's current status within a
                    running deploy.
                  properties:
                    bytesDone:
                      description: BytesDone is the number of bytes written to this
                        partition so far.
                      format: int64
                      minimum: 0
                      type: integer
                    number:
                      description: |-
                        Number is the partition number, matching the target disk's
                        partition table.
                      format: int32
                      type: integer
                    percent:
                      description: Percent is the partition's completion percentage,
                        0-100.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                  required:
                  - number
                  type: object
                maxItems: 128
                type: array
              phase:
                description: Phase is the run's current sub-step.
                enum:
                - Pending
                - Partitioning
                - WritingContent
                - RunningPostHook
                - Finalizing
                - Succeeded
                - Failed
                type: string
              phaseTimings:
                description: |-
                  PhaseTimings records the start and end time of every phase this run
                  has entered, in the order it entered them.
                items:
                  description: DeployRunPhaseTiming records when the run entered and
                    left one phase.
                  properties:
                    finishedAt:
                      description: |-
                        FinishedAt is when the run left this phase. Absent while the phase
                        is still current.
                      format: date-time
                      type: string
                    phase:
                      description: Phase is one of the DeployRunPhase* constants.
                      type: string
                    startedAt:
                      description: StartedAt is when the run entered this phase.
                      format: date-time
                      type: string
                  required:
                  - phase
                  - startedAt
                  type: object
                maxItems: 16
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
