---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: partitioncontents.kezio.kojuro.date
spec:
  group: kezio.kojuro.date
  names:
    kind: PartitionContent
    listKind: PartitionContentList
    plural: partitioncontents
    singular: partitioncontent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.fsType
      name: FSType
      type: string
    - jsonPath: .status.infoHash
      name: InfoHash
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: |-
          PartitionContent is the Schema for the partitioncontents API. Its name
          is chosen by the user: an ImageImport names the content it captures
          "<spec.contentPrefix>-p<partition number>" (internal/store.ContentName),
          and a user who wants another name creates the content under that name
          instead. The name says nothing about the bytes, so the object is
          immutable and an import that would write over an existing name is
          rejected instead of replacing it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PartitionContentSpec defines the desired state of PartitionContent. It
              is the immutable record of one partition's data (see the type-level
              XValidation rule). Immutability is enforced rather than inherited: the
              object's name is chosen by the user, so nothing about the name pins the
              bytes, and an Image slot that references this name must be able to
              trust that the bytes behind it never change.
            properties:
              fsType:
                description: |-
                  FSType is the filesystem type of the partition, for example "ext4"
                  or "ntfs". It is empty when the partition carries no recognizable
                  file system - a BIOS boot partition, for example - which ingest
                  captures with partclone.dd rather than a file-system-aware
                  partclone binary. Recorded for audit only: the deploy path restores
                  content from the torrent, which carries its own format.
                maxLength: 64
                type: string
              lastExtentEnd:
                description: |-
                  LastExtentEnd is the end offset of the highest extent written at
                  ingest. Extents write at absolute offsets, so a target partition
                  must be at least this large; Image slot-size validation reads this
                  field to enforce that.
                format: int64
                minimum: 0
                type: integer
              pieceLength:
                description: |-
                  PieceLength is the BitTorrent piece length used to hash this
                  content. It is a pinned constant, recorded here only: a piece
                  length that varies between ingests would give identical bytes
                  different info hashes, so pinning it keeps a re-imported partition's
                  swarm identity reproducible.
                format: int64
                minimum: 1
                type: integer
              sizeBytes:
                description: SizeBytes is the partition's size at capture.
                format: int64
                minimum: 0
                type: integer
              source:
                description: Source records which import captured this content.
                properties:
                  importName:
                    description: |-
                      ImportName is the name of the ImageImport this content was captured
                      by.
                    maxLength: 253
                    minLength: 1
                    type: string
                  partitionNumber:
                    description: |-
                      PartitionNumber is the partition number within that import's source
                      disk this content was captured from.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - importName
                - partitionNumber
                type: object
              usedBytes:
                description: |-
                  UsedBytes is the number of bytes of real data in the partition, as
                  measured at capture.
                format: int64
                minimum: 0
                type: integer
            required:
            - fsType
            - lastExtentEnd
            - pieceLength
            - sizeBytes
            - source
            - usedBytes
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: PartitionContentStatus defines the observed state of PartitionContent.
            properties:
              conditions:
                description: Conditions report the current state of this content.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              infoHash:
                description: |-
                  InfoHash is the BitTorrent v1 info hash of this content, as
                  lowercase hex. It is the torrent's own identity - what the deploy
                  plan hands the agent, and what the agent verifies the restored
                  bytes against - but it is not this object's identity: it only
                  exists once partclone has run, so it is observed here rather than
                  declared in spec. The publish Job reports it, and it stays the same
                  for the life of the object (spec is immutable, so the bytes behind
                  it never change). Absent until publishing succeeds.
                pattern: ^[0-9a-f]{40}$
                type: string
              pvcRef:
                description: |-
                  PVCRef names the PVC holding this content's bytes, in the same
                  namespace as this object.
                properties:
                  name:
                    description: |-
                      Post-mutation admission always re-serialises this struct, so a
                      zero-value Name would otherwise satisfy "required"; MinLength closes
                      that gap. MaxLength mirrors the Kubernetes object name limit and
                      bounds the CEL cost of any pattern-matching XValidation rule a
                      field of this type carries (see ImageSlot.ContentRef).
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              seeders:
                description: |-
                  Seeders is the per-site seeder count for this content. It never
                  carries a seeder's network address - plan builders resolve the
                  seeder Pod address at plan time.
                items:
                  description: PartitionContentSeederSite counts seeders for this
                    content at one Site.
                  properties:
                    machineCount:
                      description: |-
                        MachineCount is the number of distinct Machines at this Site
                        currently deploying an Image that references this content - the
                        controller's own seeder Deployment is infrastructure, not a
                        counted machine.
                      format: int32
                      minimum: 0
                      type: integer
                    site:
                      description: |-
                        Site is the seeding Site's namespace-qualified identity
                        ("namespace/name", sitederive.SiteIdentity's format). One entry is
                        reported per Site that currently has an available seeder Deployment
                        serving this content (a Deployment owned by one of the Images that
                        reference it - see internal/controller's ImageReconciler).
                      maxLength: 253
                      type: string
                  required:
                  - machineCount
                  - site
                  type: object
                maxItems: 64
                type: array
              state:
                description: State is the object's position in the publish workflow.
                enum:
                - Pending
                - Publishing
                - Ready
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
