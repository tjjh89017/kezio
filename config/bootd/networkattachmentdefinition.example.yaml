# EXAMPLE / PLACEHOLDER - not applied by this kustomization. Copy this file,
# strip the ".example" suffix, fill in the site-specific values below, and
# apply it directly in the Subnet's own namespace under its final name.
# Point that Subnet's spec.bootdNetworkRef at the name - the controller
# stamps the k8s.v1.cni.cncf.io/networks annotation on its bootd Deployment
# for you (bootdPodAnnotations, internal/controller/bootd_deployment.go),
# so there is no kustomization.yaml entry to add or annotation to uncomment.
#
# Requires the Multus CNI meta-plugin
# (https://github.com/k8snetworkplumbingwg/multus-cni) and its
# NetworkAttachmentDefinition CRD already installed cluster-wide. See
# config/seeder/networkattachmentdefinition.example.yaml for the same
# pattern on the BitTorrent data network; that file's no-NAT rule does not
# apply here.
#
# === Why Multus, not hostNetwork ===
# bootd must see the exact broadcast domain a booting machine's NIC is on
# and broadcast proxyDHCP replies (255.255.255.255:68 - see
# internal/bootd's destinationFor) onto only that segment. hostNetwork would
# work but ties the pod to one node's NIC and fights over ports 67/69/4011;
# a Multus secondary interface (net1) gets the same L2 visibility without
# either problem, keeping eth0 free for the Kubernetes API access
# internal/bootd.MACCache depends on.
#
# === Routing ===
# Unlike config/seeder's data network, this attachment needs no routes onto
# other subnets: proxyDHCP/TFTP traffic here is directly-connected L2
# traffic. If a future site relays DHCP onto this segment from elsewhere
# (source address the relay's own, not 0.0.0.0), check net1's rp_filter
# before assuming a dropped request is something else - a relayed or
# renewal packet is not the zeronet-source broadcast this segment carries
# today, and Linux's reverse-path check does apply to it.
#
# === IPAM ===
# bootdServerIP (Subnet spec, stamped as BOOTD_SERVER_IP on the
# Deployment) requires static ipam that pins that exact address - a
# dynamic allocator such as whereabouts cannot satisfy this: the
# controller's CheckBootdAddress raises a BootdIPAMNotStatic Violation
# on any non-static ipam recognised on this NAD (internal/nadvalidate),
# and dynamic allocation is a chicken-and-egg with a value that must be
# known up front regardless. Contrast config/seeder's README, where
# dynamic (whereabouts) ipam is the legitimate choice on the data
# network - bootd's own address is pinned precisely because firmware
# caches it mid-boot as the PXE next-server/TFTP target, which the data
# network's address has no equivalent constraint for.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: kezio-boot-network
  namespace: system
spec:
  # SITE-SPECIFIC: replace the "macvlan" plugin entry with whatever CNI
  # plugin this cluster's boot L2 segment uses; it is illustrative only.
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "kezio-boot-network",
      "plugins": [
        {
          "type": "macvlan",
          "master": "REPLACE_WITH_BOOT_NETWORK_HOST_INTERFACE",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "addresses": [
              {
                "address": "REPLACE_WITH_STATIC_CIDR/32"
              }
            ]
          }
        }
      ]
    }
