# EXAMPLE / PLACEHOLDER - not applied by this kustomization. Copy this file,
# strip the ".example" suffix, fill in the site-specific values below, add it
# to kustomization.yaml's resources, then uncomment the
# k8s.v1.cni.cncf.io/networks annotation on deployment.yaml's pod template.
#
# Requires the Multus CNI meta-plugin
# (https://github.com/k8snetworkplumbingwg/multus-cni) and its
# NetworkAttachmentDefinition CRD already installed cluster-wide. See
# config/seeder/networkattachmentdefinition.example.yaml for the same
# pattern on the BitTorrent data network; that file's no-NAT rule does not
# apply here.
#
# === Why Multus, not hostNetwork ===
# bootd must see the exact broadcast domain a booting machine's NIC is on
# and broadcast unrelayed proxyDHCP replies (255.255.255.255:68 - see
# internal/bootd's destinationFor) onto only that segment. hostNetwork would
# work but ties the pod to one node's NIC and fights over ports 67/69/4011;
# a Multus secondary interface (net1) gets the same L2 visibility without
# either problem, keeping eth0 free for the Kubernetes API access
# internal/bootd.MACCache depends on.
#
# === Routing ===
# Unlike config/seeder's data network, this attachment needs no routes onto
# other subnets: proxyDHCP/TFTP traffic here is directly-connected L2
# traffic, except a DHCP relay agent's giaddr, which is reached via the
# cluster's normal eth0 routing, not net1 (see internal/bootd's package doc
# comment on relay awareness).
#
# === IPAM ===
# BOOTD_SERVER_IP (deployment.yaml) must match whatever address this NAD
# assigns net1 - static or a cluster-wide allocator such as whereabouts both
# work; see config/seeder's NAD example for the tradeoffs.
#
# === Reverse-path filtering ===
# A DHCPDISCOVER arrives on net1 from 0.0.0.0 to 255.255.255.255 - a pair
# some kernels' reverse-path filter silently drops before bootd's socket
# ever sees it. The chained "tuning" plugin below forces net1's own
# rp_filter to 0 for this attachment only (a fresh network namespace does
# not inherit the host's sysctl values, so a host-wide sysctl would not help).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: kezio-boot-network
  namespace: system
spec:
  # SITE-SPECIFIC: replace the "macvlan" plugin entry with whatever CNI
  # plugin this cluster's boot L2 segment uses; it is illustrative only.
  # Keep the "tuning" plugin entry (see "Reverse-path filtering" above)
  # unless this cluster's CNI bundle lacks the "tuning" binary.
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "kezio-boot-network",
      "plugins": [
        {
          "type": "macvlan",
          "master": "REPLACE_WITH_BOOT_NETWORK_HOST_INTERFACE",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "addresses": [
              {
                "address": "REPLACE_WITH_STATIC_CIDR/32"
              }
            ]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv4.conf.IFNAME.rp_filter": "0"
          }
        }
      ]
    }
