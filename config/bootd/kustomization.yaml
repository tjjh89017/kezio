# RBAC prerequisite for kezio-bootd (proxyDHCP + TFTP). bootd is not part
# of the controller-manager process, but its Deployment is no longer
# something this kustomization applies: SubnetReconciler creates one bootd
# Deployment per Subnet, in that Subnet's own namespace, from the shape
# deployment.yaml documents (see that file's header and README.md's "Who
# creates the bootd Deployment"). What is still applied here is the
# ClusterRole every Subnet's bootd ServiceAccount needs:
#
#   kustomize build config/bootd | kubectl apply -f -
#
# Read README.md first - a bootd pod also needs a ServiceAccount, a PSA
# label, and a NAD in its own Subnet's namespace, none of which this
# kustomization provisions (see "What you still provide, per Subnet" and
# "RBAC scope").
namespace: kezio-system
namePrefix: kezio-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: kezio

resources:
  - rbac.yaml
  # deployment.yaml is NOT listed here - it is a reference for what
  # SubnetReconciler builds per Subnet, not something this kustomization
  # applies. networkattachmentdefinition.example.yaml is NOT listed here
  # either - see that file's header comment.
