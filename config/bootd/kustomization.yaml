# Standalone kustomization for kezio-bootd (proxyDHCP + TFTP), deliberately
# not composed into config/default: bootd is not part of the
# controller-manager process, runs one replica per boot L2 segment, and
# needs its own Multus attachment. Deploy as an addition once config/default
# is applied:
#
#   kustomize build config/bootd | kubectl apply -f -
#
# Read README.md first - the BOOTD_SERVER_IP placeholder, TFTP artifacts
# volume, and Multus attachment all need manual setup a plain apply can't do.
namespace: kezio-system
namePrefix: kezio-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: kezio

resources:
  - rbac.yaml
  - deployment.yaml
  # networkattachmentdefinition.example.yaml is NOT listed here on
  # purpose - see that file's header comment.

images:
  - name: bootd
    newName: ghcr.io/tjjh89017/kezio-bootd
    newTag: latest
  # Named by deployment.yaml's fetch-boot-artifacts initContainer; override
  # with `kustomize edit set image kezio-boot-artifacts=...` to pin a version.
  - name: kezio-boot-artifacts
    newName: ghcr.io/tjjh89017/kezio-boot-artifacts
    newTag: latest
