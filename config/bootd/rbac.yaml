apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootd
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: bootd
---
# ClusterRole, not namespaced: bootd's MAC cache (internal/bootd.MACCache)
# watches every Machine in the cluster, since it can't know in advance which
# namespace(s) hold the Machines it should net-boot. Narrow to a namespaced
# Role + RoleBinding in an overlay if that's known.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bootd
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: bootd
rules:
  - apiGroups:
      - kezio.kojuro.date
    resources:
      - machines
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootd
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: bootd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bootd
subjects:
  - kind: ServiceAccount
    name: bootd
    namespace: system
