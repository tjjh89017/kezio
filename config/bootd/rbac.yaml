apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootd
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: bootd
---
# ClusterRole, not a namespaced Role: bootd's MAC cache
# (internal/bootd.MACCache) watches every Machine in the cluster, not
# only ones in its own namespace - a site's bootd has no reliable way to
# know in advance which namespace(s) the Machines it should net-boot
# live in. Narrow this to a namespaced Role + RoleBinding in an overlay
# if a deployment's Machines are known to live in a single namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bootd
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: bootd
rules:
  - apiGroups:
      - kezio.kojuro.date
    resources:
      - machines
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bootd
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: bootd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bootd
subjects:
  - kind: ServiceAccount
    name: bootd
    namespace: system
