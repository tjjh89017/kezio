apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootd
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: bootd
    app.kubernetes.io/managed-by: kustomize
spec:
  # One replica per boot segment: two bootd pods answering the same
  # broadcast domain would both reply to every DHCPDISCOVER, and a
  # firmware client has no way to prefer one proxyDHCP answer over the
  # other. Scale out by deploying this kustomization once per site
  # (each with its own Multus attachment below), not by raising
  # replicas here.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kezio
      app.kubernetes.io/component: bootd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kezio
        app.kubernetes.io/component: bootd
      annotations:
        # Attaches the site's boot L2 segment as a Multus secondary NIC
        # (net1), alongside the cluster's own eth0. This is required,
        # not optional: bootd's proxyDHCP responder must see the same
        # broadcast domain the booting firmware's NIC is on (see
        # RequiredHERE.md's "Why Multus, not hostNetwork" section), and
        # must be able to send an unrelayed reply as a broadcast
        # (255.255.255.255:68) that only reaches that L2 segment, not
        # every network the node's own eth0 happens to touch (see
        # README.md's "Why Multus, not hostNetwork" section).
        #
        # "kezio-boot-network" below is a placeholder name - see
        # networkattachmentdefinition.example.yaml in this directory for
        # the real NAD this depends on (not applied by this
        # kustomization; it is site-specific). Create the real NAD
        # first, then uncomment this and point it at that NAD's name.
        # k8s.v1.cni.cncf.io/networks: kezio-boot-network
    spec:
      serviceAccountName: bootd
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Fetches shimx64.efi/grubx64.efi (see .github/workflows/
      # build-live-image.yml, which now publishes them alongside the
      # live kernel/initrd/squashfs) into the "tftp" emptyDir below
      # before bootd starts - the concrete answer to what this
      # Deployment's own comment on the "tftp" volume used to call a
      # gap this kustomization does not fill. Uses fetch.sh from the
      # "boot-artifacts-fetch-script" ConfigMap (../boot-artifacts, a
      # Component this kustomization's own kustomization.yaml adds
      # under `components:`).
      #
      # BOOT_ARTIFACTS_VERSION defaults to "latest" - override with
      # `kubectl set env deployment/kezio-bootd -c fetch-boot-artifacts
      # BOOT_ARTIFACTS_VERSION=v0.1.0` (or a further kustomize patch) to
      # pin a specific release instead.
      initContainers:
        - name: fetch-boot-artifacts
          image: curlimages/curl:8.21.0
          command: ["/bin/sh", "/scripts/fetch.sh"]
          env:
            - name: BOOT_ARTIFACTS_REPO
              value: tjjh89017/kezio
            - name: BOOT_ARTIFACTS_VERSION
              value: latest
            - name: BOOT_ARTIFACTS_FILES
              value: "shimx64.efi grubx64.efi"
            - name: DEST_DIR
              value: /tftp
          volumeMounts:
            - name: tftp
              mountPath: /tftp
            - name: fetch-script
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # curlimages/curl's image USER is the non-numeric "curl_user"
            # (uid 100, gid 101 per its own /etc/passwd); restricted Pod
            # Security Admission cannot resolve a non-numeric image USER
            # to verify runAsNonRoot, so it rejects the pod outright
            # ("cannot verify user is non-root") unless a numeric
            # runAsUser/runAsGroup is set explicitly here.
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - "ALL"
      containers:
        - name: bootd
          image: bootd:latest
          env:
            # BOOTD_SERVER_IP: SITE-SPECIFIC, must be set to this pod's
            # actual reachable IP on the boot L2 segment (the Multus
            # net1 address above) - there is no meaningful default for
            # an address that names this host. Firmware reads this back
            # as both the DHCP Server Identifier and (unless
            # BOOTD_NEXT_SERVER_IP overrides it) the TFTP next-server.
            - name: BOOTD_SERVER_IP
              value: "REPLACE_WITH_BOOTD_BOOT_NETWORK_IP"
            - name: BOOTD_TFTP_DIR
              value: /tftp
          ports:
            - name: proxydhcp
              containerPort: 67
              protocol: UDP
            - name: pxe
              containerPort: 4011
              protocol: UDP
            - name: tftp
              containerPort: 69
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
              # Ports 67 and 69 are privileged (<1024); NET_BIND_SERVICE
              # is the one capability restricted Pod Security Admission
              # still allows a container to add (see
              # https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted),
              # so bootd stays runAsNonRoot (65532, matching every other
              # kezio image) instead of the alternative of running as
              # root, which restricted PSA forbids outright.
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: tftp
              mountPath: /tftp
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          # No probes wired: bootd's protocols (proxyDHCP, PXE, TFTP)
          # are all UDP with no lightweight synchronous health check to
          # piggyback a probe on, and health here is best judged by
          # whether firmware on the segment is actually booting - an
          # operational signal, not one this container can self-report
          # cheaply. Revisit if a future readiness signal (for example,
          # "Machine MAC cache synced" from internal/bootd.MACCache)
          # turns out to be worth exposing.
      volumes:
        # Populated by the fetch-boot-artifacts initContainer above
        # before bootd's own container starts; an emptyDir is enough
        # since the fetch is cheap (two small EFI binaries) and repeats
        # on every pod (re)start rather than needing to persist across
        # one. If internal/bootd's TFTPServer ever finds this volume
        # empty regardless (for example, the initContainer failed and
        # the Deployment tolerated it, which it does not by default -
        # see internal/bootd's package doc comment), it serves a clean
        # per-file error, not a startup crash.
        - name: tftp
          emptyDir: {}
        - name: fetch-script
          configMap:
            name: kezio-boot-artifacts-fetch-script
            defaultMode: 0o444
