apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootd
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: bootd
    app.kubernetes.io/managed-by: kustomize
spec:
  # One replica per broadcast domain: two bootd pods on the same segment
  # would both answer every DHCPDISCOVER, and firmware can't prefer one
  # proxyDHCP reply over the other. Scale by deploying this kustomization
  # once per site (each with its own Multus attachment below), not by
  # raising replicas.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kezio
      app.kubernetes.io/component: bootd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kezio
        app.kubernetes.io/component: bootd
      annotations:
        # Attaches the site's boot L2 segment as a Multus secondary NIC (net1).
        # Required, not optional: bootd's proxyDHCP responder must see the same
        # broadcast domain the booting firmware is on, and must broadcast its
        # reply (255.255.255.255:68) only onto that segment, not every network
        # eth0 touches (see README.md's "Why Multus, not hostNetwork").
        #
        # "kezio-boot-network" is a placeholder - see
        # networkattachmentdefinition.example.yaml for the real, site-specific
        # NAD. Create it first, then uncomment and point this at its name.
        # k8s.v1.cni.cncf.io/networks: kezio-boot-network
    spec:
      serviceAccountName: bootd
      securityContext:
        # No pod-level runAsNonRoot: the containers disagree, so each states
        # its own - fetch-boot-artifacts runs non-root, bootd must run as
        # uid 0 (see its securityContext below).
        seccompProfile:
          type: RuntimeDefault
        # Matches docker/boot-artifacts/Dockerfile's USER gid (65532). The
        # "tftp" emptyDir is otherwise created root:root 0755, so without this
        # the initContainer's `cp` fails EACCES and CrashLoopBackOffs before
        # bootd starts. ("run" needs no such help: bootd writes it as root.)
        fsGroup: 65532
      # Copies shimx64.efi/grubx64.efi out of the kezio-boot-artifacts image
      # (docker/boot-artifacts/Dockerfile) into the "tftp" emptyDir below
      # before bootd starts; a plain `cp` with no network access needed.
      #
      # kustomization.yaml's `images:` entry for "kezio-boot-artifacts"
      # defaults to "latest" - override with `kustomize edit set image
      # kezio-boot-artifacts=...` to pin a specific version.
      initContainers:
        - name: fetch-boot-artifacts
          image: kezio-boot-artifacts:latest
          command: ["cp", "-a", "/boot-artifacts/shimx64.efi", "/boot-artifacts/grubx64.efi", "/dest"]
          volumeMounts:
            - name: tftp
              mountPath: /dest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # Numeric image USER (Dockerfile's USER 65532:65532) lets restricted
            # Pod Security Admission verify runAsNonRoot without an explicit
            # runAsUser/runAsGroup override here.
            runAsNonRoot: true
            capabilities:
              drop:
                - "ALL"
      containers:
        - name: bootd
          image: bootd:latest
          env:
            # SITE-SPECIFIC: this pod's reachable IP on the boot L2 segment
            # (the Multus net1 address above). Firmware reads it back as the
            # PXE boot server and (unless BOOTD_NEXT_SERVER_IP overrides it)
            # the TFTP next-server.
            - name: BOOTD_SERVER_IP
              value: "REPLACE_WITH_BOOTD_BOOT_NETWORK_IP"
            # SITE-SPECIFIC: the boot L2 segment's IPv4 subnet - dnsmasq only
            # answers proxyDHCP for subnets it has a matching dhcp-range for.
            - name: BOOTD_PROVISIONING_CIDR
              value: "REPLACE_WITH_BOOT_NETWORK_CIDR"
            # Pod interface on the boot L2 segment; must match the Multus
            # attachment above. dnsmasq binds its DHCP sockets exclusively
            # to this interface.
            - name: BOOTD_DHCP_INTERFACE
              value: net1
            # SITE-SPECIFIC: URL a netbooting machine fetches its per-MAC GRUB
            # config from. With the reverse proxy enabled below, this is
            # bootd's own address (BOOTD_SERVER_IP + BOOTD_PROXY_ADDR's port),
            # since bootd's proxy answers /boot/grub.cfg-<mac> by forwarding
            # to config/bootserver. Without it set, a netbooting machine loads
            # GRUB and stops at the grub> prompt.
            # - name: BOOTD_BOOT_CONFIG_URL
            #   value: "REPLACE_WITH_BOOTD_OWN_URL"
            # Optional, SITE-SPECIFIC once set: in-cluster base URLs of
            # internal/agentserver and internal/bootserver. Setting either
            # turns on bootd's reverse proxy (BOOTD_PROXY_ADDR below): every
            # /agent/... request forwards to the first, every /boot/...
            # request to the second, so both a live-booted kezio-agent and a
            # netbooting machine reach the whole HTTP surface through this one
            # bootd address. Leave both unset to keep bootd proxying nothing.
            # - name: BOOTD_AGENT_UPSTREAM_URL
            #   value: "http://kezio-agent-server.kezio-system.svc.cluster.local:8091"
            # - name: BOOTD_BOOT_UPSTREAM_URL
            #   value: "http://kezio-boot-server.kezio-system.svc.cluster.local:8090"
            # Optional: address the reverse proxy above listens on once
            # enabled. Defaults to BOOTD_SERVER_IP:80; override only on
            # collision.
            # - name: BOOTD_PROXY_ADDR
            #   value: "REPLACE_WITH_BOOTD_BOOT_NETWORK_IP:80"
            - name: BOOTD_TFTP_DIR
              value: /tftp
          ports:
            - name: proxydhcp
              containerPort: 67
              protocol: UDP
            - name: pxe
              containerPort: 4011
              protocol: UDP
            # Only actually listened on once BOOTD_*_UPSTREAM_URL is set;
            # harmless to declare unconditionally.
            - name: proxy-http
              containerPort: 80
              protocol: TCP
            - name: tftp
              containerPort: 69
              protocol: UDP
          securityContext:
            # Root, unlike every other kezio container, not by preference:
            # Kubernetes grants added capabilities to permitted/effective only
            # for uid 0. A non-root bootd's execve clears permitted (no file
            # capabilities) and allowPrivilegeEscalation=false blocks regaining
            # them, so its dnsmasq child dies missing NET_ADMIN (see
            # internal/bootd/caps.go). Confinement instead comes from: all
            # capabilities dropped except the three below, no privilege
            # escalation, read-only root filesystem, seccomp RuntimeDefault,
            # no privileged: true, no hostNetwork.
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
              # dnsmasq (internal/bootd's Dnsmasq) requires all three to serve
              # DHCP: NET_BIND_SERVICE for ports 67/4011/69, NET_ADMIN + NET_RAW
              # which dnsmasq checks for explicitly and refuses to start
              # without. Deliberately absent: SETUID/SETGID - bootd runs
              # dnsmasq with --user=root instead of dropping to "nobody"
              # (see internal/bootd/dnsmasq.go's runChild).
              #
              # NET_ADMIN is outside the "restricted" and "baseline" PSA
              # profiles, so the namespace bootd deploys into must set
              # pod-security.kubernetes.io/enforce=privileged. That relaxes
              # admission only - the pod itself grants nothing beyond these
              # three capabilities.
              add:
                - NET_BIND_SERVICE
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: tftp
              mountPath: /tftp
              readOnly: true
            # Writable dir for rendered dnsmasq config, the Machine informer's
            # dhcp-hostsfile, and dnsmasq's leasefile (internal/bootd.DefaultRunDir);
            # required since the root filesystem is read-only.
            - name: run
              mountPath: /run/bootd
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          # No livenessProbe: bootd's protocols (proxyDHCP, PXE, TFTP) are all
          # UDP with no lightweight check to piggyback on, and the dnsmasq
          # child already restarts itself with backoff on crash
          # (internal/bootd.Dnsmasq.Start); a liveness probe would fight that
          # supervisor.
          #
          # readinessProbe matters once the reverse proxy is enabled
          # (internal/bootd.ProxyServer): without it, `kubectl rollout status`
          # could report success before the proxy's listener was bound.
          # cmd/bootd wires /readyz to ProxyServer.Ready when enabled, and to
          # an always-ok check otherwise.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 1
            periodSeconds: 5
      volumes:
        # Populated by the fetch-boot-artifacts initContainer above; an
        # emptyDir is enough since the fetch is cheap and repeats on every
        # pod (re)start. If found empty anyway, internal/bootd's TFTPServer
        # serves a per-file error, not a startup crash.
        - name: tftp
          emptyDir: {}
        - name: run
          emptyDir: {}
