# Adds the boot config server's Service and containerPort on top of
# config/default. Not one of config/default's own resources: the boot
# config server is off by default (BOOT_SERVER_ADDR unset), and turning it
# on needs cluster-specific inputs config/default can't guess. Deploy as an
# addition once config/default is applied:
#
#   kustomize build config/bootserver | kubectl apply -f -
#
# Read README.md first - the BOOT_* variables and artifacts volume it needs.
resources:
  - ../default
  - service.yaml

# Named by boot-artifacts-init-patch.yaml's fetch-boot-artifacts
# initContainer; override with `kustomize edit set image
# kezio-boot-artifacts=...` to pin a version.
images:
  - name: kezio-boot-artifacts
    newName: ghcr.io/tjjh89017/kezio-boot-artifacts
    newTag: latest

patches:
  - path: manager-port-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
  - path: boot-artifacts-init-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
