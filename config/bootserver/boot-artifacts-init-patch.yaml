# Adds an initContainer to controller-manager that fetches the published
# live-image artifacts (vmlinuz, initrd.img, filesystem.squashfs,
# shimx64.efi, grubx64.efi, manifest.json - see
# .github/workflows/build-live-image.yml) into an emptyDir mounted at
# /boot-artifacts before the manager container starts, and points
# BOOT_ARTIFACTS_DIR at that mount. This is the concrete answer to what
# used to be README.md's "mounting a volume there is left to the cluster
# operator" gap: the default now works with no further overlay, and
# BOOT_ARTIFACTS_VERSION (below) is the one knob an operator overrides -
# via `kubectl set env` on the fetch-boot-artifacts container, or a
# further kustomize patch - to pin a specific release instead of always
# fetching the repository's latest one.
#
# shimx64.efi/grubx64.efi are included here (not just vmlinuz/initrd.img/
# filesystem.squashfs) because Config.EFIDir (internal/bootserver)
# defaults to this same BOOT_ARTIFACTS_DIR: GET /boot/http/<name> (the
# UEFI HTTP Boot route) needs them in this directory to serve out of the
# box, with no separate volume or BOOT_EFI_DIR override required.
#
# config/boot-artifacts (a Component this kustomization's own
# kustomization.yaml adds under `components:`) supplies fetch.sh itself,
# as the "boot-artifacts-fetch-script" ConfigMap this patch mounts.
#
# fsGroup below matches curl_user's gid (101, see the initContainer's own
# securityContext comment) because the "boot-artifacts" emptyDir added
# further down is otherwise created root:root mode 0755 - a fresh
# emptyDir gets no group access for a non-root gid unless the pod's
# fsGroup says so, the same reasoning config/image-service's
# securityContext.fsGroup comment documents for its Secret volume. Without
# this, fetch-boot-artifacts's `mkdir -p "${DEST_DIR}"` (config/
# boot-artifacts/fetch.sh) fails with EACCES and the initContainer
# CrashLoopBackOffs before the manager container ever starts.
- op: add
  path: /spec/template/spec/securityContext/fsGroup
  value: 101
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: fetch-boot-artifacts
      image: curlimages/curl:8.21.0
      command: ["/bin/sh", "/scripts/fetch.sh"]
      env:
        - name: BOOT_ARTIFACTS_REPO
          value: tjjh89017/kezio
        - name: BOOT_ARTIFACTS_VERSION
          value: latest
        - name: BOOT_ARTIFACTS_FILES
          value: "vmlinuz initrd.img filesystem.squashfs shimx64.efi grubx64.efi manifest.json"
        - name: DEST_DIR
          value: /boot-artifacts
      volumeMounts:
        - name: boot-artifacts
          mountPath: /boot-artifacts
        - name: fetch-script
          mountPath: /scripts
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        # curlimages/curl's image USER is the non-numeric "curl_user"
        # (uid 100, gid 101 per its own /etc/passwd); restricted Pod
        # Security Admission cannot resolve a non-numeric image USER to
        # verify runAsNonRoot, so it rejects the pod outright
        # ("cannot verify user is non-root") unless a numeric
        # runAsUser/runAsGroup is set explicitly here.
        runAsUser: 100
        runAsGroup: 101
        capabilities:
          drop: ["ALL"]
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: boot-artifacts
    emptyDir: {}
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: fetch-script
    configMap:
      name: boot-artifacts-fetch-script
      defaultMode: 0o444
- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: BOOT_ARTIFACTS_DIR
      value: /boot-artifacts
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: boot-artifacts
    mountPath: /boot-artifacts
    readOnly: true
