# Adds an initContainer to controller-manager that fetches the published
# live-image artifacts (vmlinuz, initrd.img, filesystem.squashfs,
# manifest.json - see .github/workflows/build-live-image.yml) into an
# emptyDir mounted at /boot-artifacts before the manager container
# starts, and points BOOT_ARTIFACTS_DIR at that mount. This is the
# concrete answer to what used to be README.md's "mounting a volume
# there is left to the cluster operator" gap: the default now works with
# no further overlay, and BOOT_ARTIFACTS_VERSION (below) is the one knob
# an operator overrides - via `kubectl set env` on the fetch-boot-
# artifacts container, or a further kustomize patch - to pin a specific
# release instead of always fetching the repository's latest one.
#
# config/boot-artifacts (a Component this kustomization's own
# kustomization.yaml adds under `components:`) supplies fetch.sh itself,
# as the "boot-artifacts-fetch-script" ConfigMap this patch mounts.
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: fetch-boot-artifacts
      image: curlimages/curl:8.21.0
      command: ["/bin/sh", "/scripts/fetch.sh"]
      env:
        - name: BOOT_ARTIFACTS_REPO
          value: tjjh89017/kezio
        - name: BOOT_ARTIFACTS_VERSION
          value: latest
        - name: BOOT_ARTIFACTS_FILES
          value: "vmlinuz initrd.img filesystem.squashfs manifest.json"
        - name: DEST_DIR
          value: /boot-artifacts
      volumeMounts:
        - name: boot-artifacts
          mountPath: /boot-artifacts
        - name: fetch-script
          mountPath: /scripts
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: boot-artifacts
    emptyDir: {}
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: fetch-script
    configMap:
      name: boot-artifacts-fetch-script
      defaultMode: 0o444
- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: BOOT_ARTIFACTS_DIR
      value: /boot-artifacts
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: boot-artifacts
    mountPath: /boot-artifacts
    readOnly: true
