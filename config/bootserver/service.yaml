# Exposes the boot config server's port. Unlike image-service and
# seeder, there is no separate Deployment here: the boot config server
# runs embedded in the controller-manager process (see
# internal/bootserver and cmd/main.go's BOOT_SERVER_ADDR gate), so this
# Service selects controller-manager's own pods.
apiVersion: v1
kind: Service
metadata:
  name: kezio-boot-server
  namespace: kezio-system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: boot-server
    app.kubernetes.io/managed-by: kustomize
spec:
  # GRUB and the target machine's firmware reach this port directly from
  # the boot network - a ClusterIP alone would not be reachable from
  # there. As with image-service's Service, making that reachable
  # (NodePort, a LoadBalancer, hostNetwork, or an Ingress/proxy on the
  # boot network) is a cluster-operator choice made by patching this
  # Service in a further overlay, not by this base manifest. Whatever
  # address the operator settles on is what BOOT_SERVER_URL (see
  # README.md) must name.
  type: ClusterIP
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: kezio
  ports:
    - name: boot-http
      port: 8090
      targetPort: boot-http
      protocol: TCP
