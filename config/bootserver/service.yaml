# Exposes the boot config server's port. Unlike image-service/seeder, there
# is no separate Deployment: it runs embedded in controller-manager
# (internal/bootserver, cmd/main.go's BOOT_SERVER_ADDR gate), so this
# Service selects controller-manager's own pods.
apiVersion: v1
kind: Service
metadata:
  name: kezio-boot-server
  namespace: kezio-system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: boot-server
    app.kubernetes.io/managed-by: kustomize
spec:
  # GRUB and the target machine's firmware reach this port directly from
  # the boot network - ClusterIP alone is not reachable there. Making it
  # reachable (NodePort, LoadBalancer, hostNetwork, Ingress/proxy) is a
  # cluster-operator choice via a further overlay; whatever address results
  # is what BOOT_SERVER_URL (README.md) must name.
  type: ClusterIP
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: kezio
  ports:
    - name: boot-http
      port: 8090
      targetPort: boot-http
      protocol: TCP
