---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-kezio-kojuro-date-v1alpha2-machine
  failurePolicy: Fail
  name: vmachine-v1alpha2.kb.io
  rules:
  - apiGroups:
    - kezio.kojuro.date
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - machines
  sideEffects: None
