---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-kezio-kojuro-date-v1alpha1-image
  failurePolicy: Fail
  name: mimage-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kezio.kojuro.date
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - images
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-kezio-kojuro-date-v1alpha1-machine
  failurePolicy: Fail
  name: mmachine-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kezio.kojuro.date
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - machines
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-kezio-kojuro-date-v1alpha1-posthook
  failurePolicy: Fail
  name: mposthook-v1alpha1.kb.io
  rules:
  - apiGroups:
    - kezio.kojuro.date
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - posthooks
  sideEffects: None
