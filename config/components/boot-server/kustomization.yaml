# The boot config server's Service and its containerPort on the
# controller-manager Deployment. A component, not an overlay: it carries no
# base of its own, so any number of kustomizations can include it beside
# each other without each one pulling in ../default again - which is what
# together in one Deployment without pulling ../default in twice (see
# config/boot-agent-server's comment).
#
# Included by config/boot-agent-server and config/e2e-deploy-path. It
# renders the same
# bytes for all of them; anything one of them needs and the others do not
# belongs in that kustomization, never here.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - service.yaml

patches:
  - path: manager-port-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
