# The boot config server's Service and its containerPort on the
# controller-manager Deployment. A component, not an overlay: it carries no
# base of its own, so any number of kustomizations can include it beside
# each other without each one pulling in ../default again.
#
# Included by config/netboot-e2e. Combine with ../agent-server: a machine
# that net boots but cannot register stays in Inspecting forever (see
# config/netboot-e2e's own comment).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - service.yaml

patches:
  - path: manager-port-patch.yaml
    target:
      kind: Deployment
      name: controller-manager
