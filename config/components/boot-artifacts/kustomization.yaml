# The fetch-boot-artifacts initContainer that populates the emptyDir the
# boot config server serves from, plus BOOT_ARTIFACTS_DIR pointing at it.
# Separate from config/components/boot-server because it is optional: a
# caller can turn the boot server on and supply the artifacts some other
# way.
#
# The images: entry below is the knob for pinning a build. Override it
# from the including kustomization with the rewritten name, not the
# placeholder one:
#
#   kustomize edit set image \
#     ghcr.io/tjjh89017/kezio-boot-artifacts=ghcr.io/tjjh89017/kezio-boot-artifacts:v0.3.2
#
# "kezio-boot-artifacts" only matches inside this component, because this
# entry has already renamed it by the time an including kustomization runs
# its own image transformer.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

images:
  - name: kezio-boot-artifacts
    newName: ghcr.io/tjjh89017/kezio-boot-artifacts
    newTag: latest

patches:
  - path: boot-artifacts-init-patch.yaml
    target:
      kind: Deployment
      name: controller-manager
