# Adds an initContainer to controller-manager that populates an emptyDir
# mounted at /boot-artifacts before the manager container starts, and points
# BOOT_ARTIFACTS_DIR at that mount. kustomization.yaml's `images:` entry for
# "kezio-boot-artifacts" is the knob an operator overrides (`kustomize edit
# set image` or a further overlay) to pin a specific published version.
#
# shimx64.efi/grubx64.efi are included (not just vmlinuz/initrd.img/
# filesystem.squashfs) because Config.EFIDir (internal/bootserver) defaults
# to this same BOOT_ARTIFACTS_DIR: GET /boot/http/<name> needs them here to
# serve out of the box.
#
# The initContainer's image IS the fetch (docker/boot-artifacts/Dockerfile,
# built by .github/workflows/build-live-image.yml, with vmlinuz/initrd.img/
# filesystem.squashfs/shimx64.efi/grubx64.efi/manifest.json baked in at
# /boot-artifacts), so populating the shared emptyDir is a plain `cp` with
# no network access.
#
# fsGroup matches this image's numeric USER gid (65532): the "boot-artifacts"
# emptyDir is otherwise created root:root 0755, so without this the `cp`
# below fails EACCES and the initContainer CrashLoopBackOffs before the
# manager container starts.
- op: add
  path: /spec/template/spec/securityContext/fsGroup
  value: 65532
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: fetch-boot-artifacts
      image: kezio-boot-artifacts:latest
      # Explicit, not left to the API server's tag-based default: this
      # container is created with the "latest" placeholder above, then
      # repointed at the real tag via `kubectl set image`, which never
      # re-runs defaulting - an implicit default here would bake in
      # imagePullPolicy: Always forever and ignore an already-imported
      # local image on every rollout.
      imagePullPolicy: IfNotPresent
      command:
        - cp
        - -a
        - /boot-artifacts/vmlinuz
        - /boot-artifacts/initrd.img
        - /boot-artifacts/filesystem.squashfs
        - /boot-artifacts/shimx64.efi
        - /boot-artifacts/grubx64.efi
        - /boot-artifacts/manifest.json
        - /dest
      volumeMounts:
        - name: boot-artifacts
          mountPath: /dest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        # Numeric image USER (Dockerfile's USER 65532:65532) lets restricted
        # Pod Security Admission verify runAsNonRoot without an explicit
        # runAsUser/runAsGroup override here.
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: boot-artifacts
    emptyDir: {}
- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: BOOT_ARTIFACTS_DIR
      value: /boot-artifacts
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: boot-artifacts
    mountPath: /boot-artifacts
    readOnly: true
