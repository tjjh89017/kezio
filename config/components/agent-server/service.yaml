# Exposes the agent registration server's port. As with the boot config
# server,
# there is no separate Deployment: it runs embedded in controller-manager
# (internal/agentserver, cmd/main.go's AGENT_SERVER_ADDR gate).
apiVersion: v1
kind: Service
metadata:
  name: kezio-agent-server
  namespace: kezio-system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: agent-server
    app.kubernetes.io/managed-by: kustomize
spec:
  # kezio-agent reaches this port directly at whatever address
  # internal/bootserver's Config.ServerURL names (the kezio.server= cmdline
  # value), which must be this Service's boot-network-reachable address -
  # ordinarily the same address the boot config server's Service uses, since one
  # controller-manager process serves both.
  type: ClusterIP
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: kezio
  ports:
    - name: agent-http
      port: 8091
      targetPort: agent-http
      protocol: TCP
