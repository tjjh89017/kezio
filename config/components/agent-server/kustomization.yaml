# The agent registration server's Service and its containerPort on the
# controller-manager Deployment. See config/components/boot-server for why
# these pieces are components rather than overlays.
#
# Included by config/boot-agent-server and config/e2e-deploy-path.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - service.yaml

patches:
  - path: manager-port-patch.yaml
    target:
      kind: Deployment
      name: kezio-controller-manager
