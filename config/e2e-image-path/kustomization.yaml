# Overlay for the e2e image-path stage (test/e2e's "Image ingest and
# seeding" Context, gated by E2E_IMAGE_PATH=true). Aggregates the base
# deployment plus config/image-service (normally opt-in) and config/ingest.
#
# Runs no seeder: seeding is demand-driven by a Machine deploying the Image
# (internal/controller/seeder_deployment.go), and this stage never creates a
# Machine (see test/e2e/e2e_image_path_test.go's "creates no per-Image
# seeder Deployment or Pod" spec). config/e2e-deploy-path drives a real
# Machine through a real per-Image seeder Deployment end to end.
#
# Not a production template - exists to exercise the real ingest+publish
# path on a disposable single-node k3s/RKE2 cluster:
#   - the staging PVC is patched to ReadWriteOnce/"local-path", since a
#     single-node cluster has no ReadWriteMany provisioner by default;
#   - INGEST_IMAGE on the controller-manager Deployment is NOT set here (it
#     needs the locally built, per-run image tag) - the e2e suite sets it
#     with `kubectl set env` after applying this overlay.
resources:
  - ../default
  - ../image-service
  - ../ingest

patches:
  - path: staging-pvc-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: kezio-image-service-staging
