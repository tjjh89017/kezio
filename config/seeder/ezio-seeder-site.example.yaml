# EXAMPLE / PLACEHOLDER - not applied by this kustomization (note the
# ".example.yaml" suffix; it is not listed in kustomization.yaml's
# resources). This is a template for one additional, site-local
# ezio-seeder replica; see README.md's "Per-site seeders" section for the
# full reasoning. Copy this file per site, strip the ".example" suffix,
# fill in the SITE-SPECIFIC values marked below, and add it to
# kustomization.yaml's resources.
#
# === Why this is a second Deployment, not a Service change ===
#
# A site-local seeder is deliberately just another replica of the same
# "ezio-seeder" component, kept as its own Deployment object (rather than
# raised replicas on ezio-seeder-deployment.yaml) only because each
# instance needs its own Multus data-network attachment - one Deployment
# cannot template two different NetworkAttachmentDefinitions across its
# pods. Everything else about it is identical to the central seeder:
#
#   - Its pod template's labels (app.kubernetes.io/name: kezio,
#     app.kubernetes.io/component: ezio-seeder) MUST match
#     ezio-seeder-service.yaml's selector exactly. That is what makes
#     this pod a second endpoint of the SAME Service - the operator's
#     seeder reconciler (internal/controller/seeder_controller.go)
#     already resolves every Ready endpoint of that one Service
#     independently (see its "one Service, N endpoints" EndpointSlice
#     walk), so a site pod that matches the selector is picked up and
#     synced with zero controller-side changes.
#   - It joins the SAME central opentracker (the SEEDER_TRACKER_URL the
#     controller-manager is configured with) - never a site-local
#     tracker. The tracker is the one shared meeting point of the swarm
#     (see README.md's "Per-site seeders" section for why a per-site
#     tracker would fragment it instead of helping).
#   - Once this pod is seeding, a leecher whose data-network route to it
#     is shorter/cheaper than the route to the central seeder simply
#     prefers it during libtorrent's own peer selection - no kezio code
#     decides this. That is BT's normal behavior, not a mechanism this
#     repository implements.
#
# === Precondition: the store PVC must be reachable from this site ===
#
# Like ezio-seeder-deployment.yaml, this template mounts the store PVC
# read-only and expects contents already resting on it - it is not a
# leecher that downloads content over BT first. That only works when
# this pod's node has access to the same store volume the central
# ingest Job writes to (a ReadWriteMany/network-backed PVC reachable
# from wherever this Deployment schedules, or the same cluster with
# routed L3 to the storage backend - see the main README's cross-network
# design notes).
#
# A genuinely storage-isolated site (its own cluster, no route to the
# central store) cannot use this template as-is: it needs a pod that
# leeches the content once over BT and then keeps seeding from local
# disk, the "pre-warm" pattern already described in the design doc's
# cross-network section. That pattern needs no artifact-sync mechanism
# either - the BT download itself is the sync - but it is a different
# pod shape (a plain leecher, added with seed_mode=false, not this
# store-mounted seed_mode=true template) and is not built by this
# repository yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  # SITE-SPECIFIC: give each site's copy a distinct name so it does not
  # collide with the central ezio-seeder-deployment.yaml (or another
  # site's copy) once namePrefix/kustomize apply. "site-a" here is a
  # placeholder.
  name: ezio-seeder-site-a
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: ezio-seeder
    app.kubernetes.io/managed-by: kustomize
    # Informational only: no kezio controller reads this label. It exists
    # so `kubectl get pods -l kezio.kojuro.date/network-site=site-a` (or
    # a dashboard) can find this site's replica; it does not correspond
    # to Machine.spec.networkSite and does not drive any routing
    # decision (see that field's doc comment, api/v1alpha1/machine_types.go).
    kezio.kojuro.date/network-site: site-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kezio
      app.kubernetes.io/component: ezio-seeder
      # Selecting on the site label too keeps this Deployment's own
      # rollout scoped to its own pod, without changing what the
      # Service (which selects on the two labels above only) treats as
      # a member.
      kezio.kojuro.date/network-site: site-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kezio
        app.kubernetes.io/component: ezio-seeder
        kezio.kojuro.date/network-site: site-a
      # SITE-SPECIFIC: point this at the site's own data-network
      # NetworkAttachmentDefinition (copy
      # networkattachmentdefinition.example.yaml per site - a shared
      # macvlan/bridge config rarely spans two physically distinct
      # sites).
      annotations:
        k8s.v1.cni.cncf.io/networks: kezio-data-network-site-a
      # SITE-SPECIFIC: schedule this pod at (or near) the site rather
      # than wherever the scheduler likes - a nodeSelector/affinity on
      # whatever node label identifies this site's nodes.
      nodeSelector:
        kezio.kojuro.date/network-site: site-a
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ezio-seeder
          image: seeder:latest
          env:
            - name: EZIO_GRPC_LISTEN
              value: "0.0.0.0:50051"
            - name: EZIO_BT_PORT
              value: "16881"
            - name: EZIO_SLOW_START
              value: "true"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: bt
              containerPort: 16881
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: store
              mountPath: /store
              readOnly: true
      volumes:
        - name: store
          persistentVolumeClaim:
            # SITE-SPECIFIC: must resolve to the same store contents the
            # central ingest Job writes to and the central seeder reads
            # from (see ezio-seeder-deployment.yaml's volumes comment) -
            # a network-backed PVC reachable from this site's node(s),
            # not a fresh empty claim.
            claimName: kezio-store
