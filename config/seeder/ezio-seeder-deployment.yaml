apiVersion: apps/v1
kind: Deployment
metadata:
  name: ezio-seeder
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: ezio-seeder
    app.kubernetes.io/managed-by: kustomize
spec:
  # A single seeder replica keeps "one process, many torrents" simple:
  # the operator's seeder reconciler (internal/controller.SeederReconciler)
  # already handles more than one Ready seeder endpoint (it diffs each
  # one independently via EndpointSlice lookup), so raising replicas here
  # is a valid scale-out step later - each additional pod needs its own
  # stable data-network IP (see the Multus/IPAM notes below), which is
  # why this is not the default.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kezio
      app.kubernetes.io/component: ezio-seeder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kezio
        app.kubernetes.io/component: ezio-seeder
      # annotations:
      #   # Attaches a routable data-network interface as a Multus
      #   # secondary NIC (net1), alongside the cluster's own eth0. This
      #   # is required, not optional, for a seeder to work correctly:
      #   #
      #   #   - eth0 (the cluster's primary CNI interface) stays reachable
      #   #     for the operator's gRPC control connection
      #   #     (internal/seeder.Client) and for kube-apiserver/kubelet
      #   #     traffic.
      #   #   - net1 (this Multus attachment) carries BitTorrent traffic:
      #   #     the ezio process both listens for peer connections and
      #   #     originates the tracker announce on this network.
      #   #
      #   # "kezio-data-network" below is a placeholder name - it names a
      #   # NetworkAttachmentDefinition that does not ship with this
      #   # kustomization (see networkattachmentdefinition.example.yaml
      #   # in this directory and the "No-NAT rule" section of README.md
      #   # for why the real NAD is site-specific and cannot be a generic
      #   # default). Create the real NAD first, then uncomment this and
      #   # point it at that NAD's name.
      #   k8s.v1.cni.cncf.io/networks: kezio-data-network
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ezio-seeder
          image: seeder:latest
          env:
            - name: EZIO_GRPC_LISTEN
              value: "0.0.0.0:50051"
            # Fixed BT listen port: the no-NAT contract (see README.md)
            # requires the port ezio actually listens on to match the
            # port advertised to the swarm, for every seeder pod, so
            # picking a fixed value here (rather than letting ezio choose
            # an ephemeral one) is deliberate, not incidental.
            - name: EZIO_BT_PORT
              value: "16881"
            # Slow start is on by default: without it, a burst of
            # machines fetching from this seeder can saturate the node
            # uplink the moment the swarm forms, and a UEFI PXE client
            # that boots slightly later can starve on its (timeout
            # sensitive) TFTP/HTTP fetches and hang. The ramp keeps
            # early swarm traffic below line rate so late boots still
            # get through. Set to "false" to disable; tune the step with
            # EZIO_SLOW_START_PERIOD (seconds, ezio defaults to 10).
            - name: EZIO_SLOW_START
              value: "true"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: bt
              containerPort: 16881
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          # No probes wired to the gRPC port: this image ships no HTTP/gRPC
          # health endpoint of its own (see docker/seeder/Dockerfile - it is
          # upstream ezio plus a flag-passthrough entrypoint only, no
          # decision logic and no extra listener). The operator's seeder
          # reconciler already calls GetTorrentStatus/GetVersion over the
          # same gRPC connection it uses for control, which serves the
          # same purpose (detect an unreachable seeder) without adding a
          # probe surface to this container.
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: store
              mountPath: /store
              readOnly: true
      volumes:
        - name: store
          persistentVolumeClaim:
            # This PVC is expected to be the SAME volume the ingest Job
            # writes to (INGEST_STORE_PVC, see cmd/main.go's
            # ingestConfigFromEnv doc comment) - a seeder with its own,
            # separately-provisioned "store" volume would just be empty.
            # Point this at the real store PVC's name (kustomize edit set
            # or an overlay patch); "kezio-store" is a placeholder that
            # matches this kustomization's namePrefix, not a claim this
            # kustomization creates.
            claimName: kezio-store
