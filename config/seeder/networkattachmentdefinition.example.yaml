# EXAMPLE / PLACEHOLDER - not applied by this kustomization. Copy this file,
# strip the ".example" suffix, fill in the site-specific values below, and
# apply it in the seeder Subnet's own namespace under its final name. Point
# that Subnet's spec.seederNetworkRef at the name - the controller stamps
# the seeder pod's default-network annotation for you (seederPodAnnotations,
# internal/controller/seeder_deployment.go). opentracker's own annotation
# (a separate, always-applied Deployment - opentracker-deployment.yaml) is
# still a manual uncomment, since opentracker is not a per-Subnet object.
#
# THIS IS THE SINGLE-IMAGE/LAB SHAPE: one static address, for a site
# deploying at most one Image at a time - the site's own choice, not a
# mandate (README.md's "Provisioning-segment address pool"). A site with
# concurrent Image deploys needs one address per concurrent (Image, site)
# seeder Deployment - see networkattachmentdefinition-whereabouts.example.yaml
# for that shape. A site that outgrows static ipam surfaces it as an
# Advisory SeederStaticMultiImage condition on the seeder Subnet, not a
# hard failure - see README.md.
#
# Requires the Multus CNI meta-plugin
# (https://github.com/k8snetworkplumbingwg/multus-cni) and its
# NetworkAttachmentDefinition CRD already installed cluster-wide.
#
# === Why this exists (the no-NAT rule) ===
# BitTorrent is not NAT-friendly: peers connect directly to the IP:port a
# torrent's tracker announce advertised. If anything between the seeder and
# the swarm rewrites the source address (ClusterIP DNAT, a NAT gateway),
# remote peers can't reach it. Hard requirement: announce IP:port ==
# reachable IP:port, no NAT/SNAT anywhere on that path. A pod's default
# eth0 fails that for most cluster CNIs, hence a second, routable interface
# (net1, this attachment) dedicated to BitTorrent, while eth0 stays for
# cluster-internal traffic (kube-apiserver, kubelet, the operator's gRPC
# connection to ezio).
#
# === Routing: specific routes via net1, not a default-route flip ===
# Do not make net1 the pod's default route - most cluster CNIs rely on eth0
# for the cluster's own pod/service CIDRs, and flipping the default route
# breaks their return path. Instead give net1 specific static routes scoped
# to the data network(s) peers live on (this NAD's "routes" key, or an IPAM
# addon's routes field, e.g. whereabouts). eth0 keeps the default route and
# cluster CIDRs; net1 only carries what is explicitly routed to it.
#
# === IPAM: static or whereabouts, not DHCP ===
# The announce IP must stay stable for as long as the seeder is seeding
# (peers cache it from the tracker response). Two choices satisfy that:
#   - type: static - simplest when the data-network address plan is
#     managed by hand; set the address in this NAD's ipam block (or via
#     k8s.v1.cni.cncf.io/networks' per-pod ips override). Never set this
#     address to the Subnet's bootdServerIP: bootd and the seeder share
#     one L2 segment even when they use separate NADs, so handing this
#     address to a seeder pod collides with bootd's own PXE
#     next-server/TFTP target. Sharing one NAD between bootd and the
#     seeder is fine; only the address itself must not collide.
#   - type: whereabouts - a cluster-wide IPAM allocator
#     (https://github.com/k8snetworkplumbingwg/whereabouts) for addresses
#     drawn from a shared pool. See
#     networkattachmentdefinition-whereabouts.example.yaml; RECOMMENDED once
#     a site can have more than one Image deploying at once, since each
#     per-Image seeder Deployment needs its own address.
# DHCP IPAM works too but pulls in a cluster-wide DHCP daemon dependency
# (cni-dhcp) to solve what static/whereabouts already solve without one.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: kezio-data-network
  namespace: system
spec:
  # SITE-SPECIFIC: replace this config with whatever CNI plugin this
  # cluster's data network uses; this "bridge" example is illustrative only.
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "REPLACE_WITH_DATA_NETWORK_BRIDGE",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "REPLACE_WITH_STATIC_CIDR/32"
          }
        ],
        "routes": [
          {
            "dst": "REPLACE_WITH_DATA_NETWORK_CIDR"
          }
        ]
      }
    }
