apiVersion: v1
kind: Service
metadata:
  name: ezio-seeder
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: ezio-seeder
    app.kubernetes.io/managed-by: kustomize
spec:
  # ClusterIP, gRPC port only. This Service is how the operator's seeder
  # reconciler (internal/controller.SeederReconciler, configured via
  # SEEDER_SERVICE_NAME/SEEDER_SERVICE_NAMESPACE) finds each seeder pod's
  # gRPC control endpoint: it lists this Service's EndpointSlices rather
  # than dialing the ClusterIP directly, so it can address one specific
  # Ready seeder pod even when there is more than one replica or one is
  # mid-restart. There is deliberately no port for the BitTorrent (bt)
  # container port here - the BT data path is reached over each pod's own
  # data-network IP directly (see ezio-seeder-deployment.yaml's Multus
  # annotation), and putting it behind a Service's DNAT would break the
  # no-NAT contract described in README.md.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: ezio-seeder
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
