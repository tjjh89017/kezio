apiVersion: v1
kind: Service
metadata:
  name: opentracker
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: opentracker
    app.kubernetes.io/managed-by: kustomize
spec:
  # ClusterIP only: for cluster-internal reachability. Cross-site BitTorrent
  # announce traffic reaches the tracker over its data-network IP (the Multus
  # secondary interface), never through this Service - ClusterIP is DNAT'd,
  # which would break announce/reachability consistency. See README.md's
  # "No-NAT rule".
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: opentracker
  ports:
    - name: announce-tcp
      port: 6969
      targetPort: announce-tcp
      protocol: TCP
    - name: announce-udp
      port: 6969
      targetPort: announce-udp
      protocol: UDP
