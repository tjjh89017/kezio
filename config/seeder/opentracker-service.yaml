apiVersion: v1
kind: Service
metadata:
  name: opentracker
  namespace: system
  labels:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: opentracker
    app.kubernetes.io/managed-by: kustomize
spec:
  # ClusterIP only: this Service exists for cluster-internal reachability
  # (for example a leecher Pod running in the same cluster). Cross-site
  # BitTorrent announce traffic reaches the tracker over the pod's own
  # data-network IP (the Multus secondary interface, see
  # opentracker-deployment.yaml's commented annotation), never through
  # this Service - a Service's ClusterIP is DNAT'd, which would make the
  # tracker's advertised reachability inconsistent with where announce
  # traffic actually lands. See README.md's "No-NAT rule" section.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kezio
    app.kubernetes.io/component: opentracker
  ports:
    - name: announce-tcp
      port: 6969
      targetPort: announce-tcp
      protocol: TCP
    - name: announce-udp
      port: 6969
      targetPort: announce-udp
      protocol: UDP
