# EXAMPLE / PLACEHOLDER - not applied by this kustomization. RECOMMENDED
# shape for a real site: see networkattachmentdefinition.example.yaml (the
# static-IPAM example) for the single-Image/lab shape, and README.md's
# "Provisioning-segment address pool" for the sizing rule below.
#
# === Why a pool, not one static address ===
# The operator creates one seeder Deployment per (Image, site) while a
# Machine there is deploying that Image (SEEDER_DEPLOYMENT_NETWORK - see
# README.md's "Wiring the operator side"). Each seeder pod is single-homed
# on this network, so pod.Status.PodIP is what leechers reach directly - one
# address per pod, not per site. A site with several Images deploying
# concurrently needs one address per concurrently active (Image, site)
# Deployment at once; a single static address only covers a site where at
# most one Image ever deploys at a time.
#
# whereabouts (https://github.com/k8snetworkplumbingwg/whereabouts) hands
# out one address per pod from a shared range and releases it on pod
# deletion, without per-pod NAD edits - matching the churn of short-lived
# per-Image seeder pods.
#
# === Sizing the pool ===
# pool size >= (max concurrently active Images at this site) x replicas,
# PLUS HEADROOM.
#
# "Concurrently active Images" is the largest number of distinct Images any
# Machine at this site is deploying (or retrying via
# machineHoldsSeederReference) at once; "replicas" is each seeder
# Deployment's replica count (buildSeederDeployment sets 1 today). Headroom
# covers: the grace period (SEEDER_DEPLOYMENT_GRACE_PERIOD, default 5m) that
# keeps a just-emptied Deployment's pod/address alive in case a deploy
# against the same Image restarts, and whereabouts' own leaked allocations
# (see ip-reconciler note below) - a bare-minimum pool has no slack for even
# one leak. Size generously; addresses here are cheap relative to a starved
# deploy.
#
# === The ip-reconciler CronJob is required, not optional ===
# whereabouts leaks allocations on ungraceful pod deletion (node loss,
# kubelet restart mid-eviction): the record survives even though the pod is
# gone. Per-Image seeder Deployments create/delete pods constantly (see
# README.md's "Per-Image, on-demand seeding"), so this leak path is
# exercised constantly, not rarely. Deploy whereabouts' own ip-reconciler
# CronJob
# (https://github.com/k8snetworkplumbingwg/whereabouts/tree/master/doc#ip-reconciler)
# alongside this NAD, or a leaked pool slowly starves new seeder Deployments
# of addresses.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: kezio-data-network
  namespace: system
spec:
  # SITE-SPECIFIC: replace this config with whatever CNI plugin this
  # cluster's data network uses; this "bridge" example is illustrative only.
  # Keep the "routes" entry scoped to net1 only - see
  # networkattachmentdefinition.example.yaml's "Routing" section.
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "bridge",
      "bridge": "REPLACE_WITH_DATA_NETWORK_BRIDGE",
      "ipam": {
        "type": "whereabouts",
        "range": "REPLACE_WITH_POOL_CIDR",
        "routes": [
          {
            "dst": "REPLACE_WITH_DATA_NETWORK_CIDR"
          }
        ]
      }
    }
