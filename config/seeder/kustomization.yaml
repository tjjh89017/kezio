# Standalone kustomization for the seeding data plane's shared piece:
# opentracker, the BitTorrent tracker every per-Image seeder Deployment
# and every machine's leecher announces to. It is deliberately not one
# of config/default's resources, the same reasoning as
# config/image-service: it needs a cluster-specific data network
# config/default has no way to guess. Deploy it as an addition once
# config/default is applied:
#
#   kustomize build config/seeder | kubectl apply -f -
#
# The seeder itself is not a standalone Deployment any more: the
# operator creates and removes one per-Image, per-site seeder Deployment
# on demand (internal/controller/seeder_deployment.go) - see README.md
# for the current architecture.
#
# Before applying, read README.md in this directory - in particular the
# no-NAT rule and the SEEDER_*/SEEDER_DEPLOYMENT_* wiring the operator
# side needs, neither of which a kustomize apply alone can satisfy.
namespace: kezio-system
namePrefix: kezio-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: kezio

resources:
  - opentracker-deployment.yaml
  - opentracker-service.yaml
  # networkattachmentdefinition.example.yaml is NOT listed here on
  # purpose - see that file's header comment.
