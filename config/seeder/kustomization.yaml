# Standalone kustomization for opentracker, the BitTorrent tracker every
# per-Image seeder Deployment and leecher announces to. Deliberately not one
# of config/default's resources (needs a cluster-specific data network).
# Deploy as an addition once config/default is applied:
#
#   kustomize build config/seeder | kubectl apply -f -
#
# The seeder itself is not a standalone Deployment: the operator creates and
# removes one per-Image, per-site seeder Deployment on demand
# (internal/controller/seeder_deployment.go) - see README.md.
#
# Read README.md first - the no-NAT rule and SEEDER_*/SEEDER_DEPLOYMENT_*
# wiring the operator needs are not satisfied by a plain apply.
namespace: kezio-system
namePrefix: kezio-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: kezio

resources:
  - opentracker-deployment.yaml
  - opentracker-service.yaml
  # networkattachmentdefinition.example.yaml is NOT listed here on
  # purpose - see that file's header comment.
